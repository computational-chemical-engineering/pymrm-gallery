name: execute

# freeze caches notebook output, so a green site build proves nothing about
# whether the notebooks still run. This workflow is the real check, and it runs
# on a schedule as well as on PRs so a pymrm release cannot silently break every
# page while the site keeps rendering stale output.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"     # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python scripts/check_metadata.py

  notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pymrm: ["pinned", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # "pinned" installs the floor that requirements.txt declares, so the
          # floor is actually tested; "latest" installs the newest release.
          if [ "${{ matrix.pymrm }}" = "pinned" ]; then
            floor=$(grep -oP '^pymrm>=\K[0-9.]+' requirements.txt)
            pip install "pymrm==${floor}"
          else
            pip install --upgrade --pre pymrm
          fi
          python -c "import pymrm; print('pymrm', pymrm.__version__)"

      - name: Record the machine
        # Pages that pass on one runner and fail on another differ in round-off;
        # the CPU and the BLAS kernel are what to look at first.
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          python -c "import numpy; numpy.show_config()" | grep -iE 'openblas|version' | head -4 || true

      - name: Execute every page
        run: python scripts/run_pages.py

      # Run even when a page failed: before 2026-10-29 this step was skipped on
      # every run with a failing page, so the metrics went unchecked for weeks.
      - name: Check agreement metrics against baseline
        if: always()
        run: python scripts/check_agreement.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-pages-${{ matrix.pymrm }}
          path: |
            pages/**/index.ipynb
            pages/**/agreement.json
