  - id: A4.3
    slug: dusty-gas-model
    title: "The dusty gas model"
    description: >
      Pore diffusion in its n-component form, and the three things one effective
      diffusivity per species cannot express: an inert species carrying zero flux
      with a concentration that varies by 22.5 %, uphill diffusion whose
      composition window narrows in proportion to pore size but never closes, and
      a reaction-generated internal pressure. Plus the viscous term, reduced to a
      screening group 3 p d_0/(32 eta v_bar) which - swept consistently, with the
      Knudsen number tied to the same d_0 - bounds the review's "not very serious"
      at 0.63 % of the internal pressure at every pore size from 1 nm to 100 um.
