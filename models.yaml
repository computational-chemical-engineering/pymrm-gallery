  - id: H1.8
    slug: robeson-upper-bound
    title: "The Robeson upper bound, revisited: where the 2008 line moved, and what \"primarily the front factor\" can mean"
    description: >
      Every polymer-membrane paper draws one diagonal on its selectivity-permeability plot:
      P_i = k*alpha^n, the Robeson upper bound. Robeson's 2008 revisit prints k and n for
      thirteen gas pairs, prior and present, but only 9 support a prior-versus-present
      comparison (H2/O2 and He/O2 have no present bound, CO2/N2 and N2/CH4 no prior one), and
      the paper's own Conclusions classify exactly those nine. On them the paper's central
      claim, that the shift is "primarily due to a change in the front factor, k", is
      decomposed and shown to depend on the reference selectivity: dlog k is the shift at
      alpha = 1, where the membrane does not separate, and on Robeson's own Table 13 numbers
      the front-factor share of the same two shifts runs 0.56 to 1.03 across four
      selectivities. The reference-free version, that the two lines are near-parallel, holds
      for 6 of the nine. Because |n| runs from 0.79 to 5.8, dlog k does not reproduce the
      paper's own ranking of which bounds moved most, while the selectivity gain at fixed
      permeability reproduces it (3 of 3 at every evaluation point inside the permeability
      range all nine pairs share, with a third-to-fourth gap of 0.011 to 0.111 decades). The
      two H2/CO2 bounds cross at alpha = 37.47, inside the paper's own tabulated range, which
      rests on 1 tabulated point. 19 of the 117 points the paper tables as "close to the
      present empirical upper bound" lie above it, by up to a factor 3.5. Tables 13a/13b
      reproduce from Table 12 (median 0.017 %, one row outside even a generous printing
      band). The one second route, a covering line re-estimated from the 117 points, agrees
      on the size of the shift at a stated reference (0.086 decades on the well-levered
      pairs at each pair's geometric-mean selectivity, up to 0.543 across references) and
      does not reproduce the front-factor share.
    section: H
    status: published
    page: pages/H1.8-robeson-upper-bound/
    tier: T0
    priority: P1
    structures: []
    phases:
      - gas
    predicts:
      - the empirical ceiling on fast-gas permeability at a given separation factor, for eleven gas pairs, from the 2008 bound
      - how far each 1991/1994 bound moved by 2008, decomposed into a front-factor part and a slope part at a stated selectivity
      - the selectivity gain at fixed permeability, which is the measure that reproduces the paper's own ranking of the shifts
      - the selectivity at which a pair's two bounds cross, and whether that lies inside the range of the paper's own data
      - how far any claimed (permeability, selectivity) pair sits from the bound, as P/(k*alpha^n)
      - the transition permeability from solution-diffusion to Knudsen diffusion, reproduced from the bound and a solubility selectivity
    pymrm_api: []
    reference:
      authors:
        - "Robeson, L. M."
      year: 2008
      container: "Journal of Membrane Science 320(1-2) 390-400 (2008)"
      doi: 10.1016/j.memsci.2008.04.030
    reference_read_from:
      authors:
        - "Robeson, L. M."
      year: 2008
      container: "Journal of Membrane Science 320(1-2) 390-400"
      doi: 10.1016/j.memsci.2008.04.030
      note: >
        The PRIOR bounds originate in Robeson (1991), J. Membr. Sci. 62, 165 and Robeson,
        Burgoyne, Langsam, Savoca & Tien (1994), Polymer 35, 4970. Neither is on disk; neither
        was consulted. Every prior value on the page is read from the 2008 paper's Table 12
        block headed "Prior upper bound data (1,2)". The page cannot establish that the 2008
        restatement is faithful to the originals, and says so wherever a prior value carries a
        result.
    data:
