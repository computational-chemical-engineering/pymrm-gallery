      year: 1970
      container: >
        The Mathematical Theory of Non-Uniform Gases: An Account of the Kinetic
        Theory of Viscosity, Thermal Conduction and Diffusion in Gases, 3rd
        edition, prepared in co-operation with D. Burnett. Cambridge University
        Press; reissued in the Cambridge Mathematical Library with a Foreword by
        Carlo Cercignani (1990), reprinted 1993. ISBN 0 521 40844 X.
      doi: null
      note: >
        The ORIGIN, not a reprint, and the document actually read - so there is no
        `reference_read_from`. The catalogue recorded no citation at all for this
