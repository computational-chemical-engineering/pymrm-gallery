  - id: J4.6
    slug: michaelis-menten-briggs-haldane
    title: "Michaelis-Menten and Briggs-Haldane: one rate law, two constants, and what data can decide between them"
    description: >
      Froment, De Wilde & Bischoff section 1.5.1 derives the enzyme rate law
      twice: by rapid equilibrium, eq. (1.5.1-8) with K_M = k_-1/k_1, named there
      "the Michaelis-Menten equation", and by the pseudo steady state "formulated
      by Briggs and Haldane", the identical expression with K_M = (k_-1 + k_2)/k_1,
      eq. (1.5.1-14). The page asks what an experiment can settle. No
      steady-state rate measurement can: under the reparameterisation
      k_2 = r_m/C_E0, k_-1 = k_2/rho, k_1 = (k_-1+k_2)/K_M, eq. (1.5.1-13) is
      eq. (1.5.1-15) and d r/d rho = 0, proved in sympy and checked to below
      1e-14 <!-- claim: rate_law_rho_degeneracy_max_rel --> over eight decades of
      rho. A batch transient does see rho, at order eps = C_E0/(c_A0 + K_M), but
      the largest spread, 0.9773 <!-- claim: rho_spread_induction_over_eps --> eps,
      sits in the induction layer at t = 2.011e-7 <!-- claim: rho_spread_induction_peak_min -->
      min. Over the window the source table samples only
      0.242 <!-- claim: rho_spread_over_eps_trace_limit --> eps survives, and with
      r_m, K_M and C_E0 free to compensate, telling rho = 1e-4 from 1e4 at the
      table's 5e-4 cmol/L resolution needs eps = 5.798e-2 <!-- claim: eps_star_discrimination_with_compensation -->,
      a factor 18.20 <!-- claim: eps_star_compensation_penalty --> more enzyme than
      the same statistic with nothing free, at which the quasi-steady-state
      approximation is itself off by 88.9 <!-- claim: qssa_error_at_discrimination_eps_over_resolution -->
      times that resolution. The seven-point batch table of Rawlings & Ekerdt
      Exercise 9.15 gives r_m = 0.162583 <!-- claim: mm_fit_rm_cmol_per_L_min -->
      cmol/(L min) and K_M = 0.503055 <!-- claim: mm_fit_KM_cmol_per_L --> cmol/L
      at 4.02e-3 <!-- claim: mm_fit_rms_cmol_per_L --> RMS against
      3.90e-2 <!-- claim: null_first_order_rms_cmol_per_L --> for a first-order
      null, and the two elementary-step parameters are not significant
      (F = 1.90 <!-- claim: full_model_F_statistic --> against
      F_crit,95 = 9.55 <!-- claim: full_model_F_crit_95 -->). The quasi-steady
      state is controlled by C_E0/(c_A0 + K_M), not C_E0/c_A0, and rho* for the
      rapid-equilibrium route is computed twice, 0.080 % <!-- claim: rho_star_equilibrium_two_route_rel_diff -->
      apart. Two printed defects, reported and not repaired: p. 24's limit
      "rA = k1CE0" [sic], contradicted by the book's own equations, and p. 25's
      "Lineweaver-Burke plot of 1/r versus CA" [sic], where 1/r is strictly convex
      in C_A and no straight line comes closer than 31.7 % <!-- claim: lineweaver_printed_axes_nonlinearity_minimax -->
      of its range over 0.05 to 1.0 cmol/L.
