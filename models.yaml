      FOUR PRINTED DEFECTS, REPORTED AND NONE REPAIRED: eq. (15)'s logarithm, which
      gives t_half = 0 where eq. (16) two lines below gives tau ln2/(alpha(1+sigma1
      mu)) - established by MARCHING eq. (14) rather than by asserting it, and the
      one-character correction is labelled an inference; Table IV's b = 58.3, where the
      two observations (57.4937) and the paper's own b' = 100.0 (57.5000) agree to
      0.011 % and the printed value is 1.40 % from both; Table XX's beta = 0.36 for
      methane on glass, where the paper's own N0 and monolayer count give 0.4571 and
      where the printed value uniquely breaks the paper's own ordering claim; the pair
      "(100 bars) ... 0.20" on journal page 1384, where 0.20 corresponds to 25.641 bars
      under the paper's own a. AND, FILED SEPARATELY BECAUSE IT IS NOT AN ERROR AGAINST
      LANGMUIR: the sigma column of Tables XVIII-XX runs low, 18 of 21 printed values
      below the computed one, worst 3.77 %. The three worst rows are exactly the rows he
      prints to one or two significant figures (10,000; 10,000; 26,000), and truncating
      at each cell's own printed granularity reproduces 15 of 21 cells against 11 for
      rounding - he discarded figures, he did not miscompute them.

      THE PDF'S TEXT LAYER RENDERS EQ. (37) AS 25.2e16 WHERE THE PAGE PRINTS 25.2e15.
      That is a factor ten in every surface coverage and would put 17 of 20 entries
      above the monolayer bound, reversing the paper's conclusion. THAT COUNT IS NOT
