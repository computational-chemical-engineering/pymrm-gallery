  - id: J5.3
    slug: chiu-gel-effect
    title: "The gel effect without a switch: Chiu, Carratt and Soong's diffusion-controlled termination"
    description: >
      Chiu, Carratt & Soong (1983) build the Trommsdorff-Norrish gel effect out of ONE
      UNBRANCHED CONSTITUTIVE EQUATION - 1/k_t = 1/k_t0 + theta_t P/f(x), a reaction
      resistance and a mass-transfer resistance in series - and criticise earlier
      treatments for switching diffusion control on at a prescribed critical conversion
      "in a somewhat ad hoc fashion".  THEIR COMPARISON WITH EXPERIMENT LIVES ONLY IN
      FIGURES 3-9, whose markers are Marten & Hamielec's data, SO THAT HALF OF THE CASE
      IS OUT OF SCOPE AND NOTHING IS DIGITISED; the page establishes nothing about
      whether the model describes PMMA and says so.  Every parameter in Table II is a
      FITTED number by the table's own title, so everything computed from them is a
      CONSISTENCY CHECK on the authors' fit and on this transcription.
      THE HEADLINE IS THE PAPER'S OWN GRAPHICAL ONSET CONSTRUCTION, reconstructed from
      the sentence that defines it (book p. 354) and computed rather than read: a
      least-squares line over the decades L0-2 to L0-4 gives
      0.25516 <!-- claim: onset_x_50C -->, 0.34838 <!-- claim: onset_x_70C --> and
      0.44034 <!-- claim: onset_x_90C -->, the largest miss against the printed onsets
      0.00966 <!-- claim: onset_max_abs_dev -->, with the increase with temperature
      reproduced.  Those are at the higher initiator loading, and the page says so: the
      same construction on the other loading's curve misses by up to
      0.03126 <!-- claim: onset_dev_other_loading_max -->.  THE LIMIT ON THAT NUMBER
      IS THE SENTENCE, NOT THE ARITHMETIC: the defensible readings of the construction
      spread the answer by 0.09009 <!-- claim: onset_definition_band_max -->,
      9.33 <!-- claim: onset_band_over_max_dev --> times the largest miss, while the
      resampling grid moves it by 1.311e-05 <!-- claim: onset_resample_floor_max_rel -->
      relative and an independent integration reproduces it to below
      1e-10 <!-- claim: onset_two_route_max_rel --> relative.
      TWO OF THE PAPER'S OWN CORRELATIONS ARE RECOMPUTED FROM ITS OWN TABLE II.
      Figure 13's Arrhenius plots give 34.908161 <!-- claim: dE_theta_t_0258_kcal -->
      and 34.516600 <!-- claim: dE_theta_t_01548_kcal --> kcal/mol for theta_t and
      27.771564 <!-- claim: dE_theta_p_kcal --> for theta_p.  Figure 15's "All three
      points fall on the same straight line" holds to
      8.819e-04 <!-- claim: A_linear_in_Tgp2_max_rel --> relative, against
      1.535e-02 <!-- claim: A_null_linear_in_T_max_rel --> for the same three points
      fitted linearly in T, and neither form nests inside the other; but the printed
      rounding of A admits T_gp anywhere in
      [102.2222 <!-- claim: Tgp_band_lo_C -->, 128.0000 <!-- claim: Tgp_band_hi_C -->]
      degC, so what the comparison establishes is CONCAVITY IN T, the second
      difference of A being -0.007000 <!-- claim: A_second_difference -->, and not the
      quadratic form.
      THE PAPER'S OWN FRAMING IS TESTED RATHER THAN RESTATED.  "Only a small number of
      adjustable parameters" means 13 <!-- claim: n_fitted_distinct --> fitted numbers;
      the paper's own Figures 13 and 15 compress them, but reproduce theta_t only to
      18.8281 % <!-- claim: compress_theta_t_max_rel -->, which moves the onset
      conversion by 0.01633 <!-- claim: onset_compressed_shift_max -->.  The "ad hoc"
      criticism survives a quantitative test: eq. 31 and 32 carry no branch, theta_t
      moves the onset by only -0.21735 <!-- claim: onset_per_decade_theta_t --> per
      decade, and the same model switched on at a critical conversion is concave down
      before its switch and jumps 0.760194 <!-- claim: switch_logkt_jump --> of a
      decade in log k_t at it.
      THE QUASI-STEADY-STATE ASSUMPTION IS MEASURED AT EVERY CONDITION: its "more than
      a factor of 2" is 3.5176 <!-- claim: qssa_lam0_ratio_50C --> at the condition the
      paper plots and holds at 3 <!-- claim: qssa_n_above_2 --> of the six.
      IDENTITIES ARE PROVED RATHER THAN ASSERTED: eq. 24 and eq. 26 re-derived
      symbolically from eq. 21 (exactly zero), eq. 22's "Since r_D >> r_m" shown to
      cost exactly r_m/r_D, symbolically and through the flux a pymrm spherical-shell
      BVP computes (1.858e-05 <!-- claim: eq22_rm_over_rD_max_dev -->), and the moment
      equations 12-17 reproduced from the chain-length equations summed over a seeded
      population to below 1e-14 <!-- claim: moment_identity_ktc_max_rel --> relative,
      including the k_tc terms no condition the paper reports exercises.
      THREE PRINTED FEATURES ARE REPORTED AND NOT REPAIRED: Figure 3's legend
      transposes two digits of the lower initiator loading; Table I gives the
      first-order k_d the units "L/min"; and book p. 353 reads "The presence model"
      [sic].
