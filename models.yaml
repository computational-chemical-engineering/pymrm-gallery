  # ---------------------------------------------------------------- section C
  - id: B3.3
    slug: random-pore-model
    title: "The random pore model, 1980: eight figures, no table, and what the printed numbers still decide"
    description: >
      Bhatia and Perlmutter stop describing the solid and describe its PORES: a set
      of cylindrical surfaces of arbitrary size distribution that grow at the
      chemical rate and overlap each other as they grow, with Avrami's
      dV = (1-V)dV_E doing the book-keeping. Growth adds surface, overlap destroys
      it, and one group decides which wins, psi = 4 pi L_o (1-eps_o)/S_o^2. A
      reaction-rate maximum exists if and only if psi >= 2, which is the first
      model in the family that can represent both the gasification data that show
      one and the data that do not.

      THE PAPER CONTAINS NO TABLE (eight figures, a NOTATION list and a reference
      list), and its only comparison with experiment is Figure 8. That figure is
      NOT digitised here and the page states that it therefore does not establish
      empirical adequacy. What it does instead is hold the paper to what it
      prints. Fifteen symbolic identities close the derivation chain from
      eqs. (17)-(30) to (31)-(37), including that eq. (37)'s radical is a perfect
      square (so S/S_o IS dX/dtau) and that Petersen's surface maximum sits at
      eps = 1/2 for every structure (which is all eq. 34 says). The printed
      structural claims become numbers: the best-fit grain shape factor from the
      paper's own squared-deviation integral is 1.0000000 at psi = 0 and 0.4905224
      at psi = 2 against the printed 0.49 <= m <= 1, and 0.6638850 at psi = 1
      against the printed "very close to two-thirds"; the printed X_M < 0.393 is a
      truncation of 1 - exp(-1/2) = 0.39347. Both special-case reductions the
      abstract claims are checked: Bhatia's eq. (40) is B3.1's Yagi-Kunii
      shrinking core at omega = 0 to round-off, and the approach to Petersen (1957)
      is measured at 2.2 conversion points up to X = 0.75, the printed "about 75 %"
      landing at X = 0.7423 under the convention p. 384 prints for curve B, with
      the over-determined triple's other two pairings at 0.7599 and 0.7687. The
      two models use different overlap laws, 1-exp(-V_E) against 3u^2-2u^3, which
      differ at order V_E^(3/2) and can never coincide.

      Three printed defects, none repaired: "This match at m = 1" [sic] where the
      paper's own Figure 6, its preceding sentence and this page's least squares
      give m = 0.664 at psi = 1 (m = 1 misfits 5.34 times worse); the
      optimal-porosity worked example whose printed answer 0.1 is not a root of
      the paper's own eq. (35), the root being 0.08529 (a defect of precision
      only); and Park & Levenspiel dated 1976 in the text against 1975 in the
      reference list. And one thing the paper's own numbers say that it does not:
      Figure 7's curve C is INFEASIBLE for Petersen's eq. (3), asking for 4.60
      times the largest surface any structure of its length can have, which is
      why a parameter had to be freed; the curve-D length the paper never prints
      is reconstructed, 7.747e7 cm/cm3. Every root and extremum on the page is
      located by a scan and refined (pymrm.checks.find_roots), and the scalar
      inversions are pymrm newton blocks with NumJac((K, 1)).
