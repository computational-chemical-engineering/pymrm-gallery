        the 5e-4 print resolution), and K_M sits within
        0.61 % <!-- claim: mm_fit_KM_rel_dev_from_half --> of 0.5 cmol/L.
        C_E0 is not printed either, so r_m cannot be split into k_2 and the enzyme
