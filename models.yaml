  - id: J4.4
    slug: luedeking-piret
    title: "Luedeking-Piret: refitting alpha and beta from the one run whose raw data are printed"
    description: >
      Luedeking & Piret (1959) relate lactic acid formation to growth and to
      biomass, dP/dt = alpha dN/dt + beta N, and print six (alpha, beta) pairs,
      one per pH, in Table III. Only the pH 6.0 run has raw data in the paper
      (Tables I and II), so the page refits that one pair and scopes the other
      five out; no curve is digitised. The refit is a consistency check on the
      authors' own graphical fit, not a validation of the model, because Fig. 11's
      axes are Table II's last two columns. Least squares on 22 <!-- claim: n_rows_eq3 -->
      points gives alpha = 2.2666 <!-- claim: alpha_refit_eq3 --> and
      beta = 0.5287 <!-- claim: beta_refit_eq3 -->, with the printed pair within one
      standard error of each (printed_pair_inside_one_se) and costing
      0.65 % <!-- claim: eq3_printed_pair_rms_penalty --> in rms against the optimum.
      Against the two one-term laws the paper itself rejects, the two-term form is
      5.55 <!-- claim: eq2_null_growth_only_ratio --> and
      4.92 <!-- claim: eq2_null_density_only_ratio --> times better in rms over all
      rows, while on the logarithmic plateau, where the paper says both one-term
      forms hold, the ratios are 1.036 <!-- claim: eq2_logphase_null_growth_only_ratio -->
      and 1.033 <!-- claim: eq2_logphase_null_density_only_ratio -->. An integral form
      with no differentiated column gives a third route, the printed constants
      reproduce the acid curve to 1.70 % <!-- claim: P_curve_rms_rel --> rms, and the
      crossover k* = beta/alpha is a checked unique root at
      t = 10.1 <!-- claim: crossover_time_h --> h on two column paths. Table II checks
      itself: its k identity catches 87.4 % <!-- claim: digit_substitution_detection -->
      of single-digit substitutions. The pymrm content is a batch fermenter
      (backward Euler, newton + NumJac((1, 2))) and a steady plug-flow fermenter
      (construct_convflux_upwind + construct_div, outflow outlet read by
      compute_boundary_values), both closed by the printed k column and checked
      against the closed form of eq. (2), with observed orders between 0.9 and
      1.1 <!-- claim: pfr_grid_order --> for the plug-flow ladder.
