        and uses it, printing it as Eq. 1 with the cylindrical permeance
        alpha_H = 2 pi l_0 D C_0 / ln(r_o/r_i) and evaluating it at 473 K.
        Every character verified on the native 300 dpi bitmap. Itoh prints NO
        permeation measurement and NO temperature dependence, and never tests
        the exponent. Same source as H1.4.
    origin_not_consulted: >
      Bohmholdt, G. and Wicke, E. (1967) - the half-power pressure law, as Itoh
      attributes it; Sieverts, A. and Danz, W. (1936) - the solubility constant
      C_0 = 1280 mol/m3, the ONLY thing Itoh cites them for; Nagamoto, H. and
      Inoue, H. (1985) - the diffusivity D = 9.23e-10 m2/s. All recorded without
      DOIs: no copy was available and no citation could be verified against an
      original, so container and year come from Itoh's reference list only.
      Itoh does not reprint any of their results - he cites Bohmholdt & Wicke for
      the exponent and then writes his own Eq. 1 - which is why the read paper,
      not the origin, is in `reference`.
    data: {tier: 2, method: stated in text, status: complete}
    note: >
      Promoted into the first wave after H1.12 was deferred. The catalogue's
      second citation, Caravella et al. (2010) on the empirical pressure
      exponent, is not on disk and is not used: the page treats the exponent by
      derivation and never claims to test it against data. A future page
      comparing measured exponents needs a permeation dataset and is recorded as
      a follow-up on queue_cases/H1.1.yaml.
    related: [H1.4, H1.3, H1.5, H1.7]

