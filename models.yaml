    description: >
      The 1954 origin of redox (Mars-van Krevelen) kinetics prints no rate
      constant for any aromatic oxidation - the famous constants live in
      figures only, and the authors disclaim mechanistic proof in the printed
      discussion. What the paper does print, this page reproduces end to end:
      the two k' tables (Kuster's and Neumann's SO2 data with the authors'
      computed intermediates; held-out blocks at 3.80 % mean), the apparent
      activation energy (8.58 kcal/mol vs "about 9"), the eq. (8) van 't Hoff
      closure (22.6 vs the printed 23 kcal/mol), and the paper's one complete
      worked design - the two-stage SO2 converter catalyst split along the
      optimum temperature curve, 23.6 : 76.4 from printed inputs alone against
      the printed 23 : 77, by quadrature and a pymrm plug-flow solve agreeing
      to 0.10 split-points. Equal-parameter discrimination on the reprinted
      Neumann data puts the MvK integrated form at 1.0 conversion-points rms
      against 2.85 (first order) and 3.80 (Boreskov 0.8-power): the
      retardation term measurably earns its place. Four printed defects found
      and proved from the paper's own neighbours: eq. (16)'s sign-inverted
      RHS, the alpha_eq-power mismatch between (13a) and (14), the 425 C
      k'-average slip, and Table 4's unstated stoichiometry settled as
      pyrite-roaster gas.
