  - id: C1.2
    slug: eley-rideal
    title: "Eley-Rideal kinetics: the impact rate law, and the case that the name is wrong"
    description: >
      The gas-collision (impact) rate law r = k K_A c_A c_B/(1 + K_A c_A + ...)
      contrasted with Langmuir-Hinshelwood kinetics imported from C1.1 - built
      from Prins (2018), a historical and terminological review whose thesis is
      that the mechanism universally called Eley-Rideal was proposed by Langmuir
      in 1922 and should be called Langmuir-Rideal, while Eley and Rideal
      actually studied a chemisorbed + physisorbed pair. The page reports that
      naming finding plainly, derives all 11 <!-- claim: printed_limits_agree --> printed limiting-order claims
      symbolically (all hold), and reports one printed defect: the maximum
      condition "c_A = K_A" [sic] is dimensionally inconsistent with the paper's
      own Eq. (3a) - the derived, unit-invariant condition is K_A c_A = 1 +
      K_B c_B, root-found by pymrm's find_roots against a closed form that
      shares no algebra with it. The paper's discrimination paragraph is turned
      into a number: the chemisorbing species must span a root-found factor
      w* = 11.8 <!-- claim: wstar_tol844 --> centred on the L-H maximum before the impact law can be
      rejected at the 1947 fit's own average deviation, and placement matters as
      much as width (off the maximum the misfit at w* is only 5.3e-05 <!-- claim: dev_at_wstar_center001 -->). A numerical
      experiment on C1.1's fitted constants then answers the question on the
      formalism's founding dataset: Hougen & Watson's own mechanism (o) is
      exactly Prins's Eq. (3b) (with the product's adsorption term retained),
      and fit quality alone (27.4 <!-- claim: lr_o_on_exact_d_mean_pct --> % mean |Delta| at the least-squares-optimal
      fit - the declared protocol; directly minimising mean |Delta| instead
      gives 22.8 <!-- claim: lr_o_direct_mean_pct --> % - vs a 16.8 <!-- claim: codimer_d_scatter_pct --> % noise floor) separates the two laws on noiseless rates, but
      only because the 1947 design spans a decade in hydrogen pressure (the
      design also straddles the L-H turnover at p_U* = 2.50 <!-- claim: codimer_pUstar_atm --> atm, an
      observation, not a second necessary condition: collapsing the hydrogen span
      alone already drops the misfit to 3.2 <!-- claim: lr_o_collapsedpH_mean_pct --> %, below the noise floor), while the
      denominator exponent (1 vs 2) is indistinguishable there at the design's
      noise floor even when the rates carry no noise. The source prints no
      measurement, no table and no figure, and the page claims no experimental
      validation.
