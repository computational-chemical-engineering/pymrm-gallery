  - id: A3.5
    slug: ranz-marshall-froessling
    title: "Ranz-Marshall: the only constant this paper tests is the 2.0, and the authors' own water data miss it"
    description: >
      Nu = 2 + 0.6 Re^(1/2) Pr^(1/3) taken apart constant by constant. The 0.60 is
      FITTED to the very tables any comparison would use, the 1/2 and 1/3 are
      Froessling's assumptions and cannot be identified from the transcribed tables, and
      the 2.0 is the one piece of theory, so it is the only constant these rows can
      decide. Extrapolated to Re = 0, the paper's heat-transfer runs give
      2.0582 <!-- claim: t1_heat_intercept_free --> and its benzene mass-transfer runs
      2.0523 <!-- claim: t4_benzene_intercept_free -->, both consistent with 2.0, while
      its water mass-transfer runs give 1.7322 <!-- claim: t1_mass_intercept_free -->,
      -3.08 <!-- claim: mass_intercept_t_water --> standard errors from it. The authors
      saw that gap and named its likeliest cause ("inaccurate values of diffusivity");
      what this page adds is the size, per species, with its standard error, and the
      tension with the two conclusions they drew from it: the abstract's claim to have
      verified the zero-Reynolds Nusselt number, and the claim that their water vapour
      diffusivity may be the most accurate in the literature. pymrm recomputes the 2.0
      from the spherical BVP it comes from and measures the solve against the exact
      answer, then confirms the closed form that sizes the radial-convection factor Ranz said in 1993 the
      papers had underplayed. Along the way the Reynolds column, over-determined by the
      columns printed beside it, gives up a convention neither part states for the
