  - id: A3.1
    slug: whitman-two-film
    title: "Whitman's two-film theory, and what his three runs can actually test"
    description: >
      The resistance-in-series picture every absorption calculation still uses,
      rebuilt as the two-domain diffusion problem it claims to be and then measured
      against the three runs Whitman published with it. His equilibrium curve is
      reconstructed from four equilibrium pairs hidden in Table 1's own columns
      rather than digitised from his figure; his worked example is reproduced end
      to end with his five printed numbers held out; and the one prediction he
      holds out is shown to be 99.4 % gas-film controlled, so deleting the liquid
      film entirely moves it from -0.558 % to +0.054 % of the observed rate -
      closer, not further, and the limit is taken analytically rather than with a
      large-k_c constant.
      A single film of either kind misses the three runs by 42-59 %; two films fit
      them to 0.38 % with one degree of freedom to spare, and that degree of
      freedom is off by 0.93 %.
