    title: "Trickle-bed reactor with partial catalyst wetting"
    description: >
      In a trickle bed part of every pellet is dry, and a volatile reactant reaches
      the dry part straight from the gas - so partial wetting is a shortcut, not a
      penalty, and the gain grows with the Thiele modulus. This page reproduces
      Herskowitz & Smith's Figure 6 from their own Table 1 and Eqs. 19-21, and
      reports two printed defects found in doing so: a cross-reference to the wrong
      table, and a legend whose rows are offset by one against the curves they
      label. As printed the chain is right for one curve out of four; with the
      offset corrected it closes all four with nothing fitted. One residual, a
      log-log slope 1.077 against a measured 1.111, is reported as unexplained.
