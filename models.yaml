  - id: A3.6
    slug: calderbank-moo-young
    title: "Calderbank-Moo-Young continuous-phase transfer"
    description: >
      Calderbank & Moo-Young's claim is that in a dispersion whose particles move
      freely under gravity the continuous-phase mass-transfer coefficient depends on
      nothing but the physical properties, in two regimes: rigid small bubbles with
      `k_L Sc^(2/3) = 0.31 (drho mu g / rho^2)^(1/3)`, and mobile large ones with
      `k_L Sc^(1/2) = 0.42 (drho mu g / rho^2)^(1/3)`. The content of the split is the exponent,
      D^(2/3) against D^(1/2). The page reproduces the paper's own two theoretical
      derivations of eq. (1)'s constant, 0.276000 <!-- claim: c28_value --> and
      0.339599 <!-- claim: c34_value --> against the printed `0.28` and `0.34`; rebuilds
      the split in pymrm as a linear boundary-layer march checked against the
      Leveque and Higbie closed forms on separate step and cell ladders; and maps the
      transition the paper describes and never models, halfway at
      Lambda = 0.2721 <!-- claim: lambda_half -->. It re-runs the paper's algebra and
      reports two steps that do not close: eq. (6) cannot produce eq. (7)
      (-48.0 % <!-- claim: eq7_from_printed_eq6_rel_dev --> as printed), and eq. (9)
      meets Chilton-Colburn at Re = 4480 <!-- claim: pipe_cross_Re -->, not 10,000,
      while the pipe chain itself reproduces. A printed table exponent is corrected
      from the paper's own correlation, with a control that passes. Nothing here
      judges the three fitted constants: no figure is digitised.
