  - id: J1.3
    slug: bet-multimolecular-adsorption
    title: "BET 1938: the theory that yields the surface, against the theory that has to be given it"
    description: >
      Brunauer, Emmett and Teller open by refuting a rival - the polarization
      theory of de Boer, Zwicker and Bradley - and only then derive their own
      isotherm. This page rebuilds both. The refutation is reproduced from its own
      constants: the inter-layer dipole ratio comes out 0.0102 where Bradley's fit
      needs 0.989, a factor 96.8, and Bradley's k lies outside the domain in which
      the polarization recursion has any decaying solution at all - confirmed by
      solving that recursion instead of quoting its closed form. The BET side is
      then split into what was fitted and what was not: the seven-gas surface
      agreement is a real out-of-sample test that collapses a 46.9 % spread in v_m
      to 10.6 %, while the celebrated agreement between v_m and point B is shown to
      be half-guaranteed by the equation's own shape - the BET inflection point
      cannot exceed 2/sqrt(3) v_m for any c, a ceiling derived in closed form and
      root-found independently. That bound is ONE-SIDED, capping only how far an
      eye-read knee can sit above v_m; the paper's own butane isotherm has point B
      52 % below it. One printed statement does not survive: "840 +- 70 cal. [...]
      for nitrogen on all twelve adsorbents" is the eleven-row number.
