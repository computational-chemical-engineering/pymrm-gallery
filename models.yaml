  - id: J1.1
    slug: langmuir-isotherm
    title: "Langmuir 1918: the isotherm that could not have proved its own conclusion"
    description: >
      Langmuir fitted his isotherm by drawing a straight line through the p/q-versus-p
      plot, so the q_cal columns of Tables II-XVII are a two-parameter fit judged
      against its own training data; the page labels that a goodness of fit everywhere
      and never reports it as a metric. What CAN fail is elsewhere. Langmuir's own
      contest against Freundlich is a fair one - two parameters each, the same eleven
      points - and with both forms refitted optimally Freundlich loses by 3.82 in RMS
      on Table VII and on 13 of the 14 tables that can host the comparison, the single
      exception being the table Langmuir himself excludes. The monomolecular
      conclusion rests not on the isotherm but on beta, the saturation amount against
      a monolayer count from the liquid density, whose worst row leaves only 17 % of
      headroom. The page's own result explains why it had to: Langmuir's Case VI,
      eqs. (29) and (30) of the same paper, is shown symbolically to be EXACTLY the
      BET isotherm twenty years early, and every pressure he reached lies below
      p/p0 = 1.5e-3 - recovered by inverting his own Table XXI - where his monolayer
      and multilayer equations differ by at most 0.16 %, against observational scatter
      12 to 1100 times larger; and refitting BET to Table VII with BOTH parameters free
      improves the fit by 1.26 parts in 100000, the multilayer model returning Case I
      exactly. Four printed defects are reported and none repaired, including eq. (15)'s
      logarithm, which gives t_half = 0 where eq. (16) two lines below it does not; a
      fifth pattern, the sigma column running low, is reported separately because it is
      a truncation convention rather than an error.
    section: J
    status: published
    tier: T0
    priority: P1
    structures: [S1]
    phases: [gas-solid]
    predicts:
      - the Langmuir adsorption isotherm, eqs. (9) and (31), and its linearisation (32)
      - a two-site isotherm, eq. (19), and the already-saturated-site form, eq. (33)
      - dissociative adsorption with a square-root pressure dependence, eq. (28)
      - the multilayer isotherm of Case VI, eqs. (26), (29) and (30) - which IS the BET equation
      - the rate of approach to adsorption equilibrium, eqs. (14)-(16)
      - elementary spaces per sq. cm. and the fraction of a monolayer covered, eqs. (37) and beta
      - the "relative life" of an adsorbed molecule from the isotherm constant a, eq. (38)
      - the saturation pressure of the liquefied gas, recovered from eq. (39) and Table XXI
    pymrm_api:
