    note: >
      A MODEL PAPER WITH PRINTED CONSTANTS AND NO PRINTED DATA, AND THE PAGE IS BUILT
      AROUND EXACTLY THAT.  The scope decision is the case's main judgement and it is
      made explicitly: the measurements are Marten & Hamielec's and exist in this paper
      only as markers on Figures 3-9, so no curve is digitised, the page states that it
      therefore shows nothing about the model's empirical adequacy, and it spends its
      effort on what the paper does print - two tables, six stated results, two internal
      correlations and two structural claims about the model itself.  Every parameter in
      Table II is a FIT by the table's own title and every number computed from one is
      labelled a consistency check; the six stated results are the model's own output
      and reproducing them is labelled REPRODUCTION, not validation.
      THE HEADLINE IS A GRAPHICAL CONSTRUCTION DESCRIBED IN WORDS, and the page's main
      methodological contribution is separating what the arithmetic knows from what the
      sentence means: the arithmetic floors are 1.311e-05 (the resampling grid, which is
      the real one) and 9.08e-12 (two integration routes, which prices the attractor),
      while the definitional band is 0.09009 - so the band is what limits the number and
      it is reported beside it.
      FOUR RETRACTIONS ARE CARRIED IN THE OPEN AND ALL FOUR ARE RECOMPUTED LIVE.
      (a) THE CONSTRUCTION was wrong and its own break row caught it: taking the global
      minimum of the second derivative of log k_t as "the bend" jumped to the
      GLASS-effect feature at large theta_t and made the onset non-monotone in theta_t
      (0.32043, 0.25455, 0.42929 at half, one and twice the tabulated value).  The
      monotonicity is now asserted on BOTH constructions - until 2026-08-14 it was
      asserted only on the derivative-free window fit, which never had the defect and
      could not have detected its return.  (b) THE BAND excluded the 3-5-decade window
      while the page's own break row already treated that window as defensible;
      admitting it widened the band from 0.02424 to 0.05126, 2.1147x.  (b2) IT THEN
      STILL EXCLUDED THE 4-6-DECADE WINDOW, the widest-swinging reading of the same
      family and one the page's own truncation test acquits - its fit mask ends inside
      x = 0.86 at four of the six conditions, including the one where the band is widest
      - so admitting that one as well took the band to 0.09009, 1.7576x again and
      3.7168x in all, and turned "two and a half times the largest miss" into 9.33
      times.  Both narrower bands are kept as break rows.  (c) THE SWITCH JUMP was read
      from a lambda_0 at the nearest resampling-grid point (x = 0.29993) while the
      Fujita factor of the same expression was evaluated at 0.30, which printed 0.759993
      where the quantity as defined is 0.760194.
      53 defect injections cover all 56 metrics with 249 measured row-metric links, and
      the coverage map is GENERATED from the measured moves rather than written by hand;
      all 53 rows move a reported metric and the 19/34 split between mis-transcribed
      cells and changed methods is computed rather than asserted.  ONE metric is declared
      STRUCTURAL with what it cannot detect (a sign flip on an exact identity gives
      exactly 2 on any population, so it is paired with a truncation companion that does
      depend on the population and IS covered); NO weak metric is declared, every metric
      being moved past check_agreement.py's 5 % comparison tolerance with the weakest
      cover 5.4023 % on onset_x_90C; THREE metrics sit below ABS_FLOOR and each has an
      above-floor companion.  Seven
      quantities are computed a second way, and the page says what each one tests - SIX
      of the seven are independent routes, while the seventh is the first route
      DELIBERATELY BROKEN (the moment identity with its convolution truncation
      violated), which is a companion rather than a second route and the notebook and
      meta.yaml both say so inline; and one of the six was a closed-form identity in
      floating point until it was rewired to the shell solve's discrete flux.
      Nothing is stochastic except a
      seeded test population, so two executions give an identical agreement.json.
      THE PAGE IS EXPLICIT ABOUT WHAT PYMRM DOES NOT ADD: the model is zero-dimensional,
      every headline is arithmetic on printed cells or an ODE solution, and pymrm buys
      two things only - a residual-and-Jacobian form for the eight-field source term
      (first order, 1.0094 observed) and the paper's own eq. 21 solved as a spherical
      shell instead of approximated, whose DISCRETE FLUX is what prices eq. 22 at
      exactly r_m/r_D (1.858e-05 at n = 6400, order 1.8953, and four orders away with
      the geometry set to Cartesian).
