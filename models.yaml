  - id: J1.4
    slug: iast-mixed-gas-adsorption
    title: "IAST 1965: mixture adsorption from pure-component isotherms alone — and a paper that prints no numbers"
    description: >
      Myers and Prausnitz derive the ideal adsorbed solution theory - Raoult's law
      with the pure-component reference taken at matched SPREADING PRESSURE,
      P y_i = P_i(pi) x_i - and with it predict mixture adsorption from
      pure-component isotherms alone, no mixture data and no mixture parameters.
      Every one of the paper's four experimental validations is a figure of
      external data, and even the pure inputs are never tabulated (there is not
      one table in the paper), so this page validates what the paper actually
      prints: the derivation chain, verified with sympy (eleven identities exactly
      zero), which surfaces two printed equation defects - eq. (11) is missing the
      '+' between its two RT ln terms, and the sentence introducing eq. (21) cites
      eq. (21) itself; the graphical lever-rule construction of Fig. 1, proved and
      drawn; and the solver, tested against closed forms it never touches - the
      equal-capacity case (where the page derives symbolically that IAST IS
      extended Langmuir, reproduced to 7.6e-16) and the Henry-law limit the paper
      itself proves rigorous. The paper's consistency charge against the Langmuir
      mixture rule is then made quantitative: around a closed loop in (P, y) the
      Gibbs one-form leaves an 11.9 %-of-scale spreading-pressure deficit for
      unequal-capacity extended Langmuir - computed by line integral and by a
      symbolically derived curl, agreeing to 2.7e-15, exactly linear in m2 - m1 -
      where IAST closes the same loop to 8e-16. One structural result the paper
      stops short of: IAST selectivity is exactly constant whenever the two pure
      isotherms are the same curve shifted in log P, so composition-dependent
      selectivity is a shape signal.
