  - id: B2.2
    slug: froment-bischoff-coking
    title: "Froment-Bischoff coke deactivation: the coke profile names the fouling mechanism"
    description: >
      Froment & Bischoff (1961) replaced time-on-stream deactivation bookkeeping
      with activity as a function of the carbon actually deposited, coupled the
      coke's formation kinetics to the reactor continuity equation, and showed the
      deposit forms a profile whose direction names the mechanism - descending for
      coke from the reactant, ascending for coke from the product - with the locus
      of maximum rate travelling down the bed as the catalyst ages. The page
      re-derives all three printed solutions independently (including an exact
      scalar-ODE reduction of the consecutive case the paper does not contain),
      meets them with one pymrm finite-volume bed at second order in both
      refinement axes (worst 1.7e-5 in y, 5.0e-5 in C), and measures the paper's four hand-era
      approximations one by one: gamma = 0 costs 0.29 % at the paper's own gamma
      and 5.9 % at its printed 0.02 bound; the four-term series is 22 % off at its
      claimed corner; the large-eta patch under-counts carbon by an amount that
      GROWS with time (1.16 in alpha*c by ab_eta = 10, so the printed Fig. 3(b) is
      biased and the claim that the approximation improves with eta is false in
      c); and eta ~= t costs 2.2e-5 for the paper's own reactor. A one-character
      typo in eq. (49) (alpha*z for az, a factor ~200 here) is adjudicated from
      the line above it. The Fig.-4 slope claims are recomputed exactly: the 1.0
      limits reproduce, the printed 0.5-onset values do not (CE crosses 0.5 near
      ab_eta = 13, not 4, with no plateau; 0.5 is PH's asymptote but unreached at
      10), and the Voorhies comparison sharpens - every quoted experimental
      exponent is reachable by the consecutive mechanism and none by
      parallel-exponential. The profile diagnostic is then given an amplitude: the
      ascending signature's half-bed contrast decays only logarithmically (below a
      20 % assay floor by t' ~ 20, though the inlet anchor is exact at every t), the descending
      one is already invisible to 10 % assays at the paper's own operating point,
      and equal-weight mixed mechanisms cancel the profile identically while
      producing a perfectly smooth Voorhies curve.
