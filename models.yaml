    predicts:
    - mixture adsorption equilibria (x_i, n_t, selectivity) from pure-component isotherms alone, eqs. (22), (26), (36)-(42)
    - reduced spreading pressure z = pi A/RT from any pure isotherm, eq. (19), analytic or by anchored quadrature
    - the Henry-limit closure n_i = K_i P y_i with constant selectivity K1/K2, eqs. (30)-(35)
    - the lever-rule graphical solution of Fig. 1, eqs. (45)-(46)
    - the exact condition under which extended Langmuir is thermodynamically consistent (equal capacities, where it IS an IAST)
    - a closed-loop Gibbs-consistency diagnostic applicable to any mixture-adsorption model n_i(P, y)
