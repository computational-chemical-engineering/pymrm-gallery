  - id: A2.6
    slug: gunn-dispersion-correlations
    title: "Gunn's dispersion correlations, and what the number 2 depends on"
    description: >
      Gunn's stochastic fast/slow-stream model for dispersion in fixed beds, with the
      one empirical function p(Re) that makes it evaluable, printed here as eqs (3)
      to (5) for spheres, solid cylinders and hollow cylinders. Its
      high-Reynolds-number limit is Ud/D -> 2p/(1-p), and eq. (3)'s two constants sum
      to exactly a half - so the "widely quoted value of 2" is a sphere fact, and the
      paper's own cylinder constants give 1.70 and 1.17. The axial and radial
      correlations are then used together in a 2-D axisymmetric pymrm bed, checked
      against Gunn's own printed closed form and against a Bessel-mode generalisation
      of it, and used to put a number on his wall-channel argument and on the cost of
      the wrong downstream boundary condition. The axial correlation is compared with
      the 55 measured points A2.5 digitised, with the resolving power of that
      comparison measured and the overlap question settled from printed text rather
      than assumed.
