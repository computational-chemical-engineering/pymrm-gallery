  - id: A3.7
    slug: vant-riet-kla
    title: "van 't Riet's k_L a correlation for stirred gas-liquid vessels"
    description: >
      Two numbers predict volumetric oxygen transfer in a stirred vessel: power
      per unit volume and superficial gas velocity. van 't Riet's 1979 review
      correlates the whole published body of data with them, and insists the
      constants be BRANCHED, one set for water and one for strong ionic
      solutions. The page implements both branches and asks what the review's own
      printed numbers can and cannot decide. Reproduction, not validation: eqs. 8
      and 9 were fitted to the data compiled in Figures 1-5, which are not
      digitised. Figure 5's crossing topology reproduces from the printed
      constants (one crossing, at P/V = 826.5 <!-- claim: fig5_crossing_pv --> W/m3).
      With the prefactor re-fitted, the ionic v_s exponent 0.2 can be deleted for
      26.4 % <!-- claim: null_ion_beta0_cost --> over Figure 4's drawn lines,
      inside the review's own 20-40 % accuracy, while the other three exponents
      are load-bearing. The ion enhancement implied by the two fits falls to
      1.30 <!-- claim: ion_ratio_min --> times in one corner, short of the 2x the
      review argues for. With pymrm, a plug-flow gas column exchanging with a
      well-mixed liquid, solved as the full gassing-out transient on separate step
      and cell ladders and checked against a closed form and an operator-free
      Lagrangian route, shows eq. 2 under-reporting k_L*A by 19.1 % <!-- claim: bias_pure_transient --> on the pure-water branch and 45.4 % <!-- claim: bias_ionic_transient --> on the ionic one at the centre of the
      printed window in a 2600 L vessel, and gives the governing group
      N_G = (1-eps) k H_t/(v_s H), not the review's tau_G k_L*A.
