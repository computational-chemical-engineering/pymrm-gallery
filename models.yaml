  - id: B2.1
    slug: voorhies-coking-law
    title: "Voorhies' coking law: carbon on catalyst keeps time, not throughput"
    description: >
      Voorhies (1945) - the origin of C_c = A theta^n, carbon on catalyst as a
      power of the time since the last regeneration, and of the sharper claim
      that the deposit at a given residence time is independent of feed rate.
      The page quantifies that claim from the paper's own printed tables: across
      ten groups spanning up to a fourfold feed-rate range, the feed-rate
      exponent of carbon-on-catalyst is -0.116 to +0.034 - at least 9.6x closer
      to 0 than to the throughput hypothesis' +1 in every group - while
      carbon-on-feed sits at ~ -1, with the resolving power of a
      2-significant-figure table computed rather than assumed. It shows the two
      carbon columns are linked by the run's mass ratio at the rounding floor
      (so the claim gets one test per table, not two; the linkage identity
      doubles as a per-row transcription guard and surfaces an unexplained ~8 %
      cross-block drift, reported not resolved), re-derives the printed
      conversion-feed-rate-time equation V = 96/(U^0.34 theta^0.19) exactly by
      symbolic and numeric routes with independent solvers (95.7145 / 0.34130 /
      0.19113 - every printed digit the correct rounding; every leading-digit or
      exponent-scale misreading of the five inputs misses the triple, their last
      digits resting on twice-read digit-scale crops), measures the printed "doubles per 190-200 F"
      claim per catalyst (natural ~206 F, synthetic ~176 F - the band is a fair
      pooled summary that fits neither catalyst individually), settles a
      factor-2 defect in the printed nomenclature (K = A^2 where the paper's own
      eq. 8 requires A^2/2; consequence-free, reported not repaired), and
      demonstrates from the paper's own two campaigns that A is local (factor
      1.82 between units at identical nominal conditions) while n is the
      portable part (0.38-0.53 across modes and feeds - exactly the range
      Froment & Bischoff quote, reconciled against B2.2's transcription).
      Deliberately scoped to printed tables and printed equations: no figure
      digitised, so the time exponent n is transcribed, never tested.
    section: B
    status: published
    page: pages/B2.1-voorhies-coking-law/
    tier: T0
    priority: P1
    structures:
      - S1
    phases:
