  - id: I1.3
    slug: heck-wei-katzer-monolith
    title: "Heck-Wei-Katzer monolith: 1-D versus 2-D"
    description: >
      The paper's two abstract claims, tested, and neither needs a figure. Table 1,
      the baseline against which the paper calls a Nusselt number unusual, is
      derived rather than quoted: 48/11 for the circular duct and 28/9 for the
      equilateral triangle in closed form, and the square pair on two
      discretisations sharing no code (pymrm finite volumes extrapolated, and a
      Fourier-sine Galerkin solve). Four of the five reproducible cells match every
      printed digit; the square duct at constant wall temperature, printed 2.976,
      comes out 2.977523, outside its printed interval, and is not attributed because
      Shah and London (1971) was not consulted.
      The anomaly reproduces from the two printed wall-flux functions with every
      landmark root-found: at the flux zero eq. (19)'s numerator vanishes, so the
      Nusselt number passes through zero, and the pole lies 8.7 % further
      downstream in both. The running text's cause is a wrong one-sentence summary;
      the paper's next paragraph gives the correct mechanism.
      On the adequacy claim, the paper's thresholds are sampled cases quoted at two
      channel lengths; root-found at each figure's length the page's models
      reproduce both statements, and the gap between them decomposes into
      -13.42 degC of length and +2.59 degC of model. On a common length the 2-D model
      needs a higher inlet temperature than either 1-D model, about half of it
      channel shape. As a ratio of the equivalent inlet shift to the "less than
      2 degC" claim, the Grigull-Tratz 1-D model of Fig. 12 gives 1.43 at a 316 degC
      inlet and 1.09 to 3.41 over 310 to 340 degC, and the constant-Nu model of the
      parametric figures 2.86 at 316 degC and 2.26 to 7.74. Three incompatible meanings of
      X* are separated against computations, and the printed check value
      Tbar(0.25) = 0.0224 measures the paper's own ten-point radial grid. Two
      dimensional groups are reconstructed, so every conclusion is a difference
      between models on identical parameters.
    section: I
    status: published
    page: pages/I1.3-heck-wei-katzer-monolith/
