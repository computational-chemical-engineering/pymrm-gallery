  - id: A3.8
    slug: onda-correlations
    title: "The Onda correlations, and which of their fourteen constants the paper can see"
    description: >
      Three coupled correlations, wetted area, liquid-side and gas-side coefficients,
      with the area feeding the liquid side and not the gas side. Eq. (4) is eq. (3)
      rearranged and printed with no working, so recovering it two independent ways
      pins all four gas-side constants at once: 0.774443 <!-- claim: jd_prefactor_symbolic -->
      against the printed `0.771`, a gap inside the printed precision of `a_t D_p = 3.4`.
      Combining eqs. (1) and (2) forces the local slope of k_L a against L under a
      ceiling of 0.8 <!-- claim: window_hi --> for any packing and liquid, a bound with
      no prefactor in it, and 2 <!-- claim: table1_n_above_ceiling --> of the six
      exponents in Onda's own Table 1, both spheres, sit above it. All fourteen
      constants go into a pymrm counter-current absorber, linear with upwind faces and
      solved by newton on the exact van Leer Jacobian, and their elasticities are
      computed three ways: eq. (1)'s `0.75` is exactly inert wherever the packing and
      the liquid share a surface tension, and eq. (3)'s `1/3` doubled is worth
      0.73 % <!-- claim: e_ScG_doubled_reldev --> of packed height in an air system.
    section: A
    status: published
    page: pages/A3.8-onda-correlations/
    tier: T1
    priority: P1
    structures:
