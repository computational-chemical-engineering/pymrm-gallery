    note: >
      TIER 5, AND ONLY ONE COLUMN OF IT IS MEASUREMENT. q_obs is measured - a McLeod
      gauge pressure and a gas volume by difference. a, b, b', sigma, N0, beta and
      Tables XXI, XXII and XXV are all constants Langmuir DERIVED from those
      measurements, so reproducing one is reproduction and never validation, and the
      page says so at every such comparison.

      THE FIT IS A FIT. Eqs. (31)/(33)/(19) at the printed constants reproduce all 101
      printed q_cal cells to 0.434 cu.mm, and that number is reported on the page as a
      transcription check and NEVER as evidence for the model. Null baselines are
      printed beside every agreement that is quoted: a zero-parameter constant is 3.7
