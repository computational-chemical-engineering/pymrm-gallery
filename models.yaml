      container: "Chemical Engineering Science 16(3-4) 189-201"
      doi: 10.1016/0009-2509(61)80030-4
      note: >
        PART I ONLY. The catalogue row also cites Part II (Kinetic data in
        reactors with catalyst decay, CES 17 (1962) 105); no page image of Part II
        exists on disk - only Elsevier api-text of the decimal-dropping class - so
        it was not read and contributes nothing to the page. Identity of Part I
        verified from the scan's own running head, by-line, abstract and
        received-date (the OCR renders the year as 1901).
    data:
      tier: 6
      method: "transcribed from cropped 300 dpi (native) renders of Appendix 2 and Secs. 5-7; no figure digitised - the paper contains no data figure, and all six solution figures are recomputed from the printed equations"
      status: complete
    related:
      - B2.1
      - B2.3
      - B2.4
      - B1.3
      - C2.10
      - D3.4
      - J1.5
      - A2.1
    note: >
      FIT/TEST: nothing is fitted and nothing can be validated - the paper
      contains no measurements, so every agreement is reproduction or internal
      consistency, and the page, meta.yaml, README and both data sidecars all say
      so. The model is parameter-free given the printed dimensionless groups; the
      authors' own order-of-magnitude constants fix only the computed ranges.

      HEADLINE SECOND ROUTE: the closed-form baselines are themselves computed a
      second, independent way (the paper's eq.-29 ODE route, 3.0e-13; the CE
      reduction cross-checked symbolically against the printed series (44)), so a
      wrong baseline cannot hide behind a matching solver.

      THREE QUANTIFIED FINDINGS against printed claims, all stated on the page:
      (1) eq. (49) prints alpha*z where eq. (48) requires az - a one-character
      typo worth a factor alpha/a; (2) the large-eta patch does NOT improve as eta
      increases in carbon - its deficit grows like ln(eta), and the printed
      Fig. 3(b), which the text says was computed from it, tops near 2.9 where the
      exact solution tops at 4.0; (3) the two printed slope-onset readings (CE 0.5
      at ~4, PH 0.5 at ~10) are graphical-chord values that exact computation puts
      at 0.710 and 0.726, with the CE slope crossing 0.5 only near 13 and
      possessing no plateau.

      PYMRM TRAP RECORDED (measured in the fresh-bed table and break table):
      pymrm's zero-gradient outflow bc reconstructs the outlet face with zero
      slope; where the physical outlet gradient is nonzero this leaves the outlet
      cell first-order even under TVD deferred correction. IN THAT CONFIGURATION
      every outlet reading - including compute_boundary_values, which faithfully
      evaluates the bc it is given - inherits an O(h) bias (5.1e-4 at n=200 vs
      2.3e-6 for a linear upwind face extrapolation), and correcting the single
      outflow face flux restores clean second order. The scope matters: with
      pymrm's outflow left AS-IS, compute_boundary_values is second order
      (1.56e-6) and the upwind extrapolation is the O(h) reading (7.05e-4, 450x
      worse) - so this refines the A3.7 handoff lesson for corrected-flux beds
      and does NOT overturn it for uncorrected ones.

      STRUCTURAL CHECKS NAMED: the sympy PDE residuals, the series-coefficient
      matches, the w=0.5 flat-profile zero and the (A.2a)/(A.2b) products are
      identities that cannot fail once transcription is right; all sit at or below
      ABS_FLOOR and are labelled as documentation, not protection. The
      perturbation-blind spot is also named: a systematic mis-reading of the
      dimensionless groups would move all routes together and is guarded only by
      the Appendix-2 printed arithmetic (which pins a and b but not alpha and K).

