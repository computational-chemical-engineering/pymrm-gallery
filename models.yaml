      consulted: Eucken, Verh. deut. physik. Ges. 16, 345 (1914); Bakker, Z. physik.
      Chem. 89 (1915); Haber, J. Soc. Chem. Ind. 33, 50 (1914); Knudsen, Ann. Physik
      31, 205 (1910), the thermal-effusion correction; Meyer's Kinetic Theory of Gases,
      German edition 1899, p. 82, the source of eq. (1); and Langmuir's own "Part I"
      (This Journal 38, 2221 (1916)) and "Part II" (39, 1848 (1917)), which carry the
      monomolecular-film evidence this paper leans on. Nothing on the page derives from
      any of them. Brunauer, Emmett & Teller (1938) IS on disk and is the subject of
      J1.3, whose README, meta.yaml and findings were read before this page was built;
