      kcal/mol against "about 9"), the eq. (8) van 't Hoff closure
      (22.6 <!-- claim: vantHoff_dH_kcal_per_mol_SO3 --> against the printed 23
      kcal/mol), and the paper's one complete worked design, the two-stage SO2
      converter catalyst split along the optimum temperature curve: converter 1
      takes 23.6 <!-- claim: split_converter1_pct_quad --> per cent of the catalyst,
      from printed inputs alone, against the printed 23 : 77, by quadrature and a
      pymrm plug-flow solve 0.08 <!-- claim: split_routes_gap_points --> split-points
      apart. Equal-parameter discrimination on the reprinted Neumann data puts
      the MvK integrated form at 1.01 <!-- claim: discrimination_rms_mvk -->
      conversion-points rms against 2.47 <!-- claim: discrimination_rms_boreskov -->
      (Boreskov's power law) and 2.85 <!-- claim: discrimination_rms_first_order -->
