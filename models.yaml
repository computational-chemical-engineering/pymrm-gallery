  - id: C1.1
    slug: lhhw-hougen-watson
    title: "Langmuir-Hinshelwood-Hougen-Watson kinetics: the 1947 codimer estimation, re-run"
    description: >
      The kinetic-term x driving-force / adsorption-group formalism, rebuilt from
      the people it is named after: Chapter XIX of Chemical Process Principles
      derives the dual-site machinery from the Langmuir isotherm and works a
      complete parameter estimation on printed data - 40 differential-reactor runs
      of codimer hydrogenation, 18 rival mechanisms fitted by linearised least
      squares, sixteen rejected on sign grounds. The page re-runs the whole
      estimation: the 200 C transcription is proven by the book's own printed
      checksums, the mechanism-d constants reproduce to 0.6 % by two independent
      routes, and 38 of the 54 printed mechanism rows are consistent with the data
      to better than 3 %. The remainder are diagnosed, not excused: eight of Table
      D's rows trace to a single corrupted Sum(R pS) worksheet entry (two
      independent printed rows imply the same wrong value to 1.1 %), the boxed
      final equation misprints dS_S (-30.96 for Table G's -30.46, adjudicated from
      the book's own K_S row at 10x separation), and one Table C cell is a digit
      slip proven by its own row. The acceptance verdicts survive everything - the
      joint acceptable set is {d, h} at every threshold - but the modern refit
      shows the data cannot separate d from h (0.4 percentage points in rate
      space; even noiseless h-rates are fitted by d to 3.6 %), so the book's
      choice of d stands on chemistry, not statistics. A pymrm plug-flow
      demonstration drives the fitted law through an isothermal bed where ignoring
      the 42 % mole contraction silently lengthens the bed by half.
