  - id: A1.6
    slug: wen-yu-minimum-fluidisation
    title: "Wen and Yu's minimum fluidisation velocity: where 33.7 and 0.0408 come from, and what they cost"
    description: >
      The one-line estimate of u_mf that everyone uses, taken apart. Substituting
      the paper's two voidage-group approximations into the Ergun force balance
      recovers its printed 33.7 and 0.0408 to -0.08 % and +0.04 %, which fixes from
      the outside which friction law it encodes - a thing the communication does
      not state, since it prints neither the Ergun equation nor the derivation.
      Solved simultaneously, those two approximations pin the effective particle
      down uniquely: sphericity 0.669 at a voidage of 0.474, which is not a sphere;
      forced onto a sphere they contradict each other by 8 %, and the branch that
      survives into the viscous term sits at 0.383, below the paper's own stated
      voidage floor. The cost against the unapproximated balance depends on the
      voidage: at 0.42 it is 28.9 % low in the viscous limit and 1.8 % low in the
      turbulent one, but at 0.385 the turbulent end is the worse one. Like for
      like at 0.42, that voidage cost outweighs the uncertainty in Ergun's own
      constants (A1.1's refit of them) by 22.7x in the viscous limit and 1.17x in
      the turbulent one. Tested against 21 minimum fluidisation velocities Geldart
      measured seven years later and the authors never saw, it is biased -17.4 %
      with a 38.1 % rms about zero against their claimed 34 % - though a standard
      deviation about the mean, which the paper never defines either way, gives
      33.9 % and matches them. On the eight spherical cuts it is low on every row,
      by 25.2 % on average and by anything from 5.5 % to 54.5 % row by row. The
      page also reports the contrary evidence: the same balance is unbiased at
      those powders' own inverted voidage only because that inversion is a change
      of variables on the same measurement, and at the bed voidage Geldart himself
      reports - 0.444 with no inference at all on two rows where he prints
      U_MB = U_0 and H_MB/H_0 = 1.000 - it is +58 % biased, worse than the
      correlation it is being used to judge. Which reading is right is left open,
      as is the sphericity the headline rides on: phi_s = 1 comes from six words
      of Geldart's prose, and 0.864 would erase the bias entirely.
