  - id: J4.1
    slug: monod
    title: "Monod: what a growth curve can and cannot pick out of the family"
    description: >
      Froment, De Wilde & Bischoff section 1.5.2 prints the Monod equation as
      eq. (1.5.2-1), defines its two constants by exactly two properties - the
      asymptote r_m and the half-rate point K_S - and couples it to the biomass
      balance eq. (1.5.2-2) and the constant-yield relation eq. (1.5.2-3); its
      Chapter 1 reference list carries "Monod, J., Annu. Rev. Microbiol., 3, 371
      (1949)", the exact citation this case catalogues, confirmed here on a 300 ppi
      crop. Rawlings & Ekerdt p. 596 prints the same equation beside four
      alternatives - Blackman, Tessier, Moser and Contois - and calls it "the
      simplest form of the Langmuir adsorption isotherm". THIS PAGE ASKS WHETHER
      DATA CAN PICK MONOD OUT OF THAT FAMILY, and answers with numbers.
      TWO OF THE FOUR CANNOT BE SEPARATED FROM IT BY ANY CONSTANT-YIELD BATCH RUN,
      AND THIS IS EXACT. Moser contains Monod at n = 1. And CONTOIS IS MONOD
      REPARAMETERISED: constant yield makes X = phi(a - S), so
      mu_m S/(K_sx X + S) = (mu_m/beta) S/(K_sx phi a/beta + S) with
      beta = 1 - K_sx phi - a bijection between the two parameter pairs, sympy
      residual exactly zero, confirmed to better than 1e-4 in both constants by two
      optimisers started from different places on the two parameterisations (the
      exact residuals are those optimisers' exit tolerances, printed on the page
      and deliberately not reported as metrics). Of the
      two that ARE separable at this design, Blackman needs 1.30 repeats of the run
      and Tessier 10.3, N* being a ~50 %-power threshold rather than a
      95 %-detection sample size.
      MONOD AND BLACKMAN AGREE EXACTLY ON BOTH PROPERTIES FROMENT DEFINES THE
      CONSTANTS BY - the asymptote, and the half rate at S = K_S, which sits on
      Blackman's linear branch - and differ by EXACTLY mu_m/3 at the branch switch
      S = 2 K_S, and by mu_m(3-2 sqrt 2)/2 = 0.0858 mu_m at S = (sqrt 2 - 1) K_S on
      the lower branch. Both closed forms, both checked against a root-found
      extremum.
      AND ON THE ONE REAL DATASET, THE RANKING OF THE FIVE IS DECIDED BY THE DATA
      REDUCTION, NOT BY THE DATA. Levenspiel's Problem 29.18 prints seven intervals
      of a batch run, attributed by him to Monod (1958) p. 74 - not the 1949 paper,
      and not consulted. Fit them as the exercise invites, comparing
      ln(Cc_end/Cc_start)/dt with mu evaluated at the interval-AVERAGE substrate
      concentration, and Monod comes LAST of the four two-parameter laws (RMS
      0.054690 1/h against Blackman's 0.026772) while Moser's exponent n = 1.93
      clears the 95 % F test at F = 12.27 against F(1,4) = 7.71 - a verdict CO-CAUSED
      by the one printed cell the page flags, since at that cell's balance-implied
      60.18 route A gives F = 5.45 against the same 7.71 and the verdict flips. Do
      the interval average EXACTLY instead - the same seven growth rates, the same
      five models, no new parameter, with the substrate trajectory taken from the
      table's own material balance rather than from the printed averages (route B
      never reads the CA_bar column, and the balance line it uses is the SIX-ROW
      one) - and Monod's residual falls 42 % to 0.031466, Blackman becomes the
      worst of the four, n drops to 1.51 and F to 1.44.
      A SEEDED BOOTSTRAP PRICES THAT, WITH A CONTROL, every draw refitted the way
      route A fits the real data rather than read off the scan grid. On data the
      Monod model itself generates, the reduction rejects Monod 36.5 % +- 1.1 % of
      the time and drives the median fitted exponent to 1.61 +- 0.0074; on data
      drawn from the reduction's OWN model, where it is correctly specified, it
      sits AT nominal size, 4.95 % +- 0.5 %, and returns 1.01 +- 0.0049. Those six
      numbers are Monte-Carlo estimates at 2000 seeded draws - four frequencies
      and two medians, not six frequencies - and every quotation of them carries
      its sampling error; at that draw count the frequencies are seed-independent
      in their leading figure only and the medians to at least two figures. So the
      small-sample F
      approximation at n = 7 is essentially exact and is not the culprit - the
      reduction is - and the observed F = 12.27 has p = 0.23 +- 0.0094 against a
      properly generated Monod null. The grid-only numbers the first version of this page
      reported, 30.8 % and a conservative-looking 2.1 %, are kept as a break row.
      The bias behind it is
      0.0663 1/h at CA_bar = 9, which is 1.21 TIMES THE RESIDUAL SCATTER the
      ranking is read off, and it has a sign: mu is concave, so the shortcut makes
      every saturating law look too gradual near exhaustion.
      THE EXPERIMENT THAT DOES SEPARATE CONTOIS FROM MONOD IS NAMED AND PRICED: a
      chemostat sweeping the FEED. Monod washes out at D_c = mu_m S_f/(K_S + S_f),
      Contois at D_c = mu_m whatever the feed; the two cross at EXACTLY S_f = a,
      the substrate intercept of the batch run's own material balance (root-found
      197.116 against 197.120), and differ by a factor 1.83 at S_f = 20.
      ONE PRINTED CELL IS REPORTED AND NOT REPAIRED: the table's fourth
      interval-average substrate concentration is off the constant-yield line the
      other six rows fix at R^2 = 0.99996 (all seven give 0.98505), and a
      leave-one-out sweep says which row rather than merely that one is off.
    section: J
    status: published
    page: pages/J4.1-monod/
    tier: T0
    priority: P1
    structures:
      - S1
    phases:
      - liquid
    predicts:
      - the specific growth rate mu = mu_m S/(K_S + S) and the biomass balance
        dC_B/dt = mu C_B closed by a constant yield
      - mu_m and K_S from a batch table of biomass-versus-time intervals, both by
        the interval-average shortcut and by integrating the law across each
        interval
      - which of the five printed growth laws (Monod, Blackman, Tessier, Moser,
        Contois) a given batch design can distinguish, and how many repeats of it
        each would take
      - the chemostat steady states and the critical dilution rate for washout,
        under Monod and under Contois, as a function of feed concentration
      - the plug-flow fermenter profile, which is the batch problem in space
    pymrm_api:
      - construct_convflux_upwind
      - construct_div
      - compute_boundary_values
      - NumJac
      - newton
    reference:
      authors:
        - Monod, J.
      year: 1949
      title: The growth of bacterial cultures
      container: "Annual Review of Microbiology 3, 371-394 (1949)"
      doi: 10.1146/annurev.mi.03.100149.002103
      note: >
        ORIGIN_NOT_CONSULTED - the 1949 paper is not on disk and could not be
        obtained. TEXTBOOK-CANONICAL-SOURCE PAGE under the standing decision of
        2026-08-02, with the E1.1 target pinned to Froment by the coordinator
        before dispatch. READ FROM: Froment, G. F., De Wilde, J. & Bischoff, K. B.,
        "Chemical Reactor Analysis and Design", 3rd edition, John Wiley & Sons
        (2011), ISBN 978-0-470-56541-4, Chapter 1, section 1.5.2 "Microbial
        Kinetics", book pp. 26-29 (PDF 68-71), eqs. (1.5.2-1) to (1.5.2-3). The
        E1.1 test passes: the book STATES the rate law, ATTRIBUTES it (naming K_S
        "the Monod- or saturation constant", recording that "in the original Monod
        equation, r is represented by mu, r_m by mu_max and C_A by S", and carrying
        the exact 1949 citation in its Chapter 1 reference list on book p. 58) and
        CARRIES it, coupling it to the biomass balance rather than merely printing
        the form. THE FILENAME SAYS "Froment_Bischoff": this is the THIRD edition
        and De Wilde is a full author. Its born-digital text layer nonetheless
        LOSES EVERY OPERATOR IN AN EQUATION - each Symbol-font operator extracts
        as an unmappable Private-Use-Area glyph (U+F02D for the leading minus of
        eq. (1.5.2-3), U+F03D for the = beside it), emitted by all three pdftotext
        modes and rendering as nothing - so everything load-bearing was read on a
        300 ppi render. This corrects the "dropped the leading term" diagnosis the
        published J4.6 gives for eq. (1.5.1-17) of the same book.
        RAWLINGS & EKERDT 2nd edn p. 596 is used as a MODEL CATALOGUE and for its
        chemostat balances eqs. (10.18)-(10.19), NOT as a second E1.1 target, and
        nothing is adjudicated between the books. Its five growth laws are cited
        there to Bailey & Ollis and Shuler & Kargi, so NOTHING on the page is
        attributed to Blackman, Tessier, Moser or Contois personally.
        THE DATA COME FROM A THIRD BOOK AND FROM A DIFFERENT MONOD PUBLICATION:
        Levenspiel, "Chemical Reaction Engineering", 3rd edn (1999), Problem 29.18,
        book p. 644, which presents them as "the reported data for one of his runs"
        and attributes them to "Monod, 1958, p. 74". That book is not on disk and
        was not consulted, and the page does not imply the table is the 1949
        paper's.
    data:
      tier: 2
      method: table
      status: complete
    note: >
      IDENTIFIABILITY IS A PROPERTY OF THE EXPERIMENT, NOT OF THE MODEL, and this
      page is that sentence made quantitative. Two of the four alternatives
      Rawlings & Ekerdt print beside Monod are provably indistinguishable from it
      on a constant-yield batch run - Moser by nesting, Contois by an exact
      reparameterisation - so a batch fit that "prefers" one of them is reporting
      its own optimiser. Of the two that are separable, only Blackman is resolvable
      by the single run available, at N* = 1.30 repeats against Tessier's 10.3.
      The page's second finding is methodological and cost the first: the ranking
      of the five laws on the one real dataset flips depending on whether the rate
      law is evaluated at the interval-average substrate concentration or averaged
      across the interval, and a seeded bootstrap WITH A CONTROL ARM shows the
      shortcut rejects a true Monod 36.5 % +- 1.1 % of the time against
      4.95 % +- 0.5 %, i.e. exactly nominal, for its own correctly-specified model. Every empirical number is a goodness of fit and is
      labelled one; the identities are proofs and are labelled structural; and the
      Rawlings reproduction is reproduction, not validation.
      79 defect injections, all 79 of which move their metric, cover 60 of 74
      metrics; the other 14 are named structural with above-floor companions, and
      six quantities the page proves are exactly zero are printed but not
      reported at all, because CI compares everything above ABS_FLOOR at 5 % and
      they are optimiser and root-find exit tolerances - a rule asserted over the
      whole enumerated class of 18 such quantities rather than over the list of
      exclusions. An assertion cell checks 96 prose and metadata values plus 10
      break-table lookups against the live computation, and a mechanical sweep
      requires every number written in scientific notation in meta.yaml,
      README.md, this entry and both data sidecars to match a live value to half
      an ulp of its own printed digits, and measures its own detection rate by
      mutating every token it finds.
      SCOPE BOUNDARY: substrate inhibition (Froment eq. 1.5.2-4, Graef & Andrews
      [1973]; Rawlings' mu_m S/(K_s+S+K_1 S^2)) belongs to J4.2 and gets no
      quantitative treatment here; Williams' structured model, eqs. (1.5.2-5) to
      (1.5.2-8) of the same section, is J4.9's.
    related: [J4.2, J4.6, J4.8, J4.9, J1.1, C1.1, B1.1, J4.7]

  - id: J4.2
    slug: andrews-substrate-inhibition
    title: "Andrews' inhibition function: the two claims in his Summary, tested"
    description: >
      Andrews (1968) puts Haldane's enzyme-inhibition function into a batch and a
      chemostat balance and states two results in one sentence of his Summary: in
      BATCH culture the primary effect of substrate inhibition is an increase in
      the LAG TIME, whereas in CONTINUOUS culture it "may result in process
      instability". He also assumes there is NO LAG PHASE, so the first claim is
      about a lag his kinetics manufacture and can be measured against a
      no-inhibition control. THIS PAGE TESTS BOTH RATHER THAN ILLUSTRATING THEM,
      with his own printed constants, and DIGITISES NOTHING.
      THE PAPER PRINTS NO TABLE - every "table" hit in the text layer is inside the
      word "unstable" - but it is not figure-gated, because every parameter set is
      typeset inside a figure legend, and reading a legend is transcription.
      THE BATCH CLAIM SURVIVES QUANTITATIVELY. Going from no inhibition to his
      K_i = 2.0 g/l multiplies the time to reach 5 g/l by 5.256387, from 6.949160 h
      to 36.527476 h, and 94.40 % of that increase is LAG against 5.65 % a slower
      exponential phase. Under Monod the lag is IDENTICALLY ZERO by the same
      definition, so inhibition creates a lag where there was none. The share is
      monotone: 87.78 % at K_i = 10, 91.25 % at 5, 94.40 % at 2.
      THE PAGE ALSO STATES WHAT THOSE TWO NUMBERS DO NOT SAY. The PEAK specific
      growth rate falls only 19.4344 %, 0.997009 to 0.803246 1/h, and that is not
      the effect of inhibition on growth: the peak is reached at 36.492522 h of a
      36.527476 h run, 99.90431 % of the way through; the run is above half its
      peak rate for 0.638869 h, 1.7490088 % of its duration; the biomass rises
      114.67072-fold during the lag; and the REALISED mean rate
      ln(X_f/X_i)/t_f falls from 0.994042 to 0.189111 1/h, 80.98 %. And the lag
      SHARE is a partition only near Andrews' own target, because lambda does not
      depend on X_f while dt_f does: at X_f = 1 g/l the same decomposition returns
      109.4003 %. The 94.40 % is quoted at his 5 g/l target and defined there.
      BOTH OF HIS STATED NUMERICAL RESULTS COME BACK FROM A CLOSED FORM. Constant
      yield collapses eqs. (4)-(5) to one autonomous ODE with a rational integrand,
      so partial fractions give the batch time exactly (both sympy residuals zero):
      36.527476 h against his printed 36 (+1.4652 %) and 12.371597 h against his
      12.5 (-1.0272 %), agreeing with LSODA to 6.7e-12 while sharing no code with
      it. THE SECOND DEPENDS ON READING ONE SENTENCE, AND HIS OWN FIGURE READS IT:
      p. 715's "increased in 2.0 g/l steps after reduction in each case to 0.02
      g/l" supports three literal readings - reset to 2.0, increment by 2.0, or a
      2.0/4.0/6.0 ladder - worth 12.366419 h, 12.371597 h and 13.794022 h, a raw
      spread of 11.5442 %. The typeset annotation inside Fig. 7, "REPEATED ORGANISM
      SEPARATION & DILUTION. S_i ADDED IN INCREMENTS OF 2.0 GM/L", read at digit
      scale on a 300 ppi crop of the rotated landscape page and transcribed into
      the CSV, is the increment reading; that is what the page reports, with the
      reset reading priced at 0.042 % away and the ladder reading, +10.3522 %,
      named as the one the annotation excludes.
      THE CONTINUOUS CLAIM IS PROVED, NOT ILLUSTRATED. At theta = 3 h, S_0 = 5 g/l
      there are THREE steady states: a stable node at S_1 = 0.0150567,
      X_1 = 2.492472; a SADDLE at S_1 = 3.984943 with eigenvalues +0.0561790 and
      -1/3 per hour - which is the root eq. (9) as printed returns; and WASHOUT,
      which is LOCALLY STABLE, eigenvalue -0.0481080. The saddle's sign is exact,
      not numerical: det J = mu'(S*) X_1/(Y theta), so it carries the sign of mu'
      whatever the constants.
      INHIBITION BARELY MOVES THE STEADY STATE AND COMPLETELY CHANGES ITS BASIN. At
      the same muhat, K_s, theta and S_0, dropping the inhibition term moves the
      operating substrate by 0.3778 % and the operating biomass by 0.0011 % - and
      takes the washout eigenvalue from -0.0481080 to +0.660702 per hour, stable to
      unstable. Andrews notices the first half himself ("the inhibition function
      reduces to the Monod function") and understates it.
      THERE ARE TWO WASHOUT CONDITIONS AND EQ. (11) IS ONLY ONE OF THEM. His
      theta_w = 1/muhat_m = 1.244949 h is the FOLD and contains no S_0; the other -
      washout is stable whenever mu(S_0) < 1/theta, i.e. theta < 1/mu(S_0) =
      3.506000 h - depends on the feed and he does not print it. The exact bistable
      window at S_0 = 5 g/l is theta in (1.244949, 3.506000) h, AND ANDREWS
      OPERATES AT 3 h, INSIDE IT. The two conditions unify him with J4.1: under
      Monod mu is monotone, the fold never happens, and only the transcritical one
      survives - as D_c = mu_m S_f/(K_S + S_f), the formula J4.1 loads from
      Rawlings & Ekerdt. One criterion, D = mu(S), read at two different points.
      ALL SIX OF HIS STATED CONTINUOUS-CULTURE OUTCOMES REPRODUCE, and the page
      root-finds the thresholds he omits, on EVENT-TERMINATED integrations rather
      than swept windows: the critical inoculum is 0.1842466 g/l (his 0.10 is 45.7 %
      below it, his 0.50 171.4 % above), the critical step is S_0 = 17.28760 g/l,
      and the critical ramp is 0.8720668 h - SO HIS 1 HR RAMP CLEARS IT BY ONLY
      14.67 %. Two of those are computed twice by routes sharing only the
      right-hand side: the inoculum by basin bisection AND by the saddle's
      backward-integrated stable manifold (2.4e-12), the step by bisection AND by a
      separatrix side test (8.1e-14). The Fig. 8 threshold, by contrast, is exactly
      S_0 = 5.0 BY CONSTRUCTION and is labelled structural rather than reported.
      SEVEN PRINTED DEFECTS ARE REPORTED AND NONE REPAIRED. eq. (9) is printed with
      a BARE + and no +-, so it returns the higher root - the one this same paper
      calls unstable. eq. (10) is printed X_i = Y(S_0 - S_1) where X_1 is meant,
      X_i being this paper's symbol for the initial inoculum; the text layer turns
      X_1 into "XI", so only a render could show it. Figs. 4 and 7 give the
      dimensionless yield as GM/L, decided by the printed definition plus the
      dimensions of eq. (5) rather than by the five-to-two count across legends.
      Plus "Recherces" [sic], "step chances" [sic], "innoculum" and "a inhibition
      function" [sic].
      AND ONE APPROXIMATION THAT IS NOT CALLED A DEFECT: his half-rate definitions
      of K_s and K_i are exact only as K_s/K_i -> 0 and have NO SOLUTION unless
      K_i >= 4 K_s - exactly eq. (2)'s condition for muhat_m >= muhat/2 - and are
      +1.5468 % and -1.5232 % out at the K_i = 2.0 g/l of his chemostat figures -
      which is the MILDEST of the three K_i he prints, against +3.1947 %/-3.0958 %
      at the K_i = 1.0 of his Fig. 4 and +6.8502 %/-6.4110 % at the K_i = 0.50 of
      his Fig. 1, all three printed on the page. It gives the numbers and the
      condition and does NOT claim he was unaware; his own "even when K_s and K_i
      are well separated" is the nearest thing to a qualification.
      THE PAGE ADDS TWO THINGS ANDREWS DID NOT HAVE. Seeding the feed with
      0.0213935 g/l - 0.8583 % of the operating biomass - destroys the fold, and
      that number is where the page caught its own grid-limited calculation:
      bisecting a root COUNT sees the merging roots only while they are more than a
      grid cell apart, so the reported value is the DOUBLE-ROOT one (G = G' = 0,
      leaving mu(theta mu - 1) = mu'(S_0 - S), no grid in it), with the counting
      route shown converging onto it across six orders of magnitude in three scans.
      And the same kinetics in a
      pymrm plug-flow fermenter have NO bistability at any residence time or seed,
      which confirms Andrews' own "multistage operation with separate substrate
      supply" prediction IN THAT LIMIT ONLY.
