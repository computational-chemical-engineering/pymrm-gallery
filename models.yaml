  - id: D1.1
    slug: froment-fixed-bed-ladder
    title: "Five fixed-bed models on one reactor: what each rung of Froment's ladder buys"
    description: >
      Chapter 11 of Froment, De Wilde & Bischoff classifies fixed-bed reactor models in
      a 2x3 table and works five of its six cells. All five are built here on ONE
      reactor - the hydrocarbon-oxidation design case of section 11.5.2 - and compared
      by the shift each produces in the root-found inlet partial pressure at which the
      hot spot reaches the top of the book's own stated operating range. The two
      heterogeneous rungs pull in opposite directions and, measured like for like
      against the model each corrects, the second is about four and a half times the
      first, so stopping at the film model leaves you further from the
      particle-resolved one than plug flow was; axial dispersion moves the threshold by
      less than the discretisation error of a single 1200-cell plug-flow solve. Rung
      1's wall coefficient and rung 5's two radial parameters are the same measurement
      through eq. (11.7.4-1), which is what fixes the tube radius at 0.0125 m against
      the printed 2.54 cm diameter. Every pressure the page reports is in ATM, which is
      a stated reading: section 11.5.2 labels its pressures bar while restating Van
      Welsenaere & Froment's atm rate constant unchanged, and its own Fig. 11.5.2-1
      labels the ordinate "p0, atm". In atm its parametric-sensitivity sentence is
      reproduced to about one part in three thousand; read in the bar it prints, the
      same sentence is out by 1.1 % and its own design point sits 212 K above the
      ceiling the facing page states. Section 11.6's two printed criteria for
      deciding whether the axial-dispersion rung is needed cannot be evaluated on the
      reactor the chapter designs - one divides by a temperature difference that is zero
      by construction there, the other is dimensionally inhomogeneous as printed - and
      section 12.7.2, 148 pages later, says the criteria are not general and supplies
      alternates for equal feed and wall temperatures - with no cross-reference in
      either direction. That those alternates exist BECAUSE of the two problems above
      is this page's inference from that sentence and is labelled as one. Mears' interphase criterion passes while the same film
      temperature difference moves the runaway threshold by several times the margin
      section 11.5.2's own sentence hangs on: the chapter's criteria test the rate, and
      what this reactor needs tested is the threshold - though the chapter itself warns,
      at that operating point, that "heat and mass transfer effects would have to be
      taken into account", and the page prints that sentence beside the finding.
      Fifteen printed defects reported and none repaired. The largest is that the two
      columns of Table 11.5.3.A-2 disagree by up to 37 %, because its Q = 3.4675 is the
      value belonging to the critical radius 0.0175 m that the same example computes two
      paragraphs later, transplanted onto the 0.0125 m case tabulated; the book's own
      printed C = Q^2 A exp(-E/RT + b) makes Q proportional to R_t^(-1/2) and closes the
      argument, and a row-by-row transcription check cannot see it because every row was
      copied correctly - from the wrong case. Next largest is the unit slip above, of
      which the atm-to-bar conversion of Example 11.5.3.A is the visible half: the
      back-integrated critical pressure is left in atm and labelled bar, and converting
      it consistently makes the "excellent agreement" the book claims better than the
      numbers printed beside it.
