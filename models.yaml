      - the concentration span w* needed to discriminate the impact law from L-H at a given fit precision
      - the exact (3c)-(3b) degeneracy along a c_A sweep and its K_B c_B-sized signal in the c_B direction
      - which feature of the 1947 codimer design rejects the impact mechanism (the decade-wide p_H span), via a labelled numerical experiment
