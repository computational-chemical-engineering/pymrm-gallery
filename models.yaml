  - id: A1.7
    slug: geldart-classification
    title: "Geldart's powder groups: the boundaries, and what his own table says about them"
    description: >
      The four letters everyone quotes come from two inequalities, and both are
      quantitative predictions that can be checked. Recomputed from the
      expressions Geldart derives them from, they are 229.4 and 1.016e6 against
      the printed 225 and 1e6 — his own roundings, and harmless. The A/B
      criterion sorts 20 of the 21 fractions of his own measured Table 1 the same
      way their measured U_MB/U_0 does, the two routes sharing no input column —
      but a null model that calls every powder group A already scores 19, so the
      page reports the score on the three rows that can discriminate, 2 of 3, and
      states the tie-break on the two rows that print U_MB = U_0 exactly. On the
      single row where the criterion and the strict ratio part company, Geldart's
      own prose sides with the criterion.
      The correlation underneath it, Davies and Richardson's minimum
      fluidization velocity, is the sloppy half: the constant each measured row
      implies spans a factor 6.4 about a median of 0.98. And the B/D boundary
      turns out to be the Davidson cloud-existence condition written in other
      symbols — Geldart's 1/sqrt(2) against Davies-Taylor's 0.711, 0.55 % apart,
      less than the rounding he applied to his own answer — which makes the whole
      diagram a contour map of the smallest bubble a powder can wrap a cloud
      around.
