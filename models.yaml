      year: 1997
      container: "Chemical Engineering Research and Design 75 (Supplement), S82-S100 (Trans IChemE Vol 75, December 1997, Jubilee Supplement)"
      doi: 10.1016/S0263-8762(97)80006-8
      note: >
        A VERBATIM REPRINT, not a restatement: the running footer of every page
        reads "TRANS. INSTN CHEM. ENGRS, Vol. 32, 1954". The reprint renumbers
        the paper S82-S100 and the ORIGINAL PAGE NUMBERS 35-53 ARE NOWHERE
        PRINTED ON IT. Nineteen consecutive pages is consistent with 35-53, but
        the page does not assert that range as read; every page reference on the
        page and in the sidecars is a reprint page, marked as such.
    origin_not_consulted:
      - authors: ["Steinour, H. H."]
        year: 1944
