# pymrm-gallery model index — CANONICAL metadata source.
#
# This file is the single source of truth (docs/blueprint.md §0, consequence 3).
# Page front matter is validated against it by scripts/check_metadata.py; it is
# NOT an independent record. Entries with status: planned have no page yet and
# exist here so they can be turned into contributor issues.
#
# Full survey and rationale: docs/catalog-A-foundations.md, -B-reactors.md,
# -C-adjacent.md. Migration of the remaining ~236 catalogued models into this
# file is incremental; run scripts/check_metadata.py --report-missing to see
# which catalog IDs are not yet here.

