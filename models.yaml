      unexplained by any single-element repair. The famous +-8.44 % is in
      R = sqrt(pHpU/r) space; the same fit scatters 16.9 % in rate space (factor
      2.00, the delta-method value, measured).

      THE DISCRIMINATION ANSWER: the sign test's joint decision {d, h} is robust
      across thresholds 1-10 %, and the family shape is genuinely selected (the
      best rejected mechanism is 2.7 points worse; deleting the product term
      costs 6 points), but molecular-vs-atomic hydrogen is not resolvable: 0.4
      percentage points apart, with noiseless h-rates fitted by d to 3.6 % over
      the same compositions. The book's "the experimental fit is better with
      mechanism d" does not survive rate-space refitting; its chemical argument
      (no dissociation required) is what actually carries the choice.

      SCOPED OUT: the Johanson-Watson toluene example (book pp. 959-961), whose
      constants derive from conversion-curve figures - the repo-wide
      figure-review gate has no maintainer; and Chapter XXI's two-dimensional
      bed illustration, whose intermediates are all charts. Neither is needed by
      this page. Runtime ~5 s. One metric sits at or below check_agreement.py's
      ABS_FLOOR and are named on the page as outside CI.

  - id: C1.2
    slug: eley-rideal
    title: "Eley-Rideal kinetics: the impact rate law, and the case that the name is wrong"
    description: >
      The gas-collision (impact) rate law r = k K_A c_A c_B/(1 + K_A c_A + ...)
      contrasted with Langmuir-Hinshelwood kinetics imported from C1.1 - built
      from Prins (2018), a historical and terminological review whose thesis is
      that the mechanism universally called Eley-Rideal was proposed by Langmuir
      in 1922 and should be called Langmuir-Rideal, while Eley and Rideal
      actually studied a chemisorbed + physisorbed pair. The page reports that
      naming finding plainly, derives all eleven printed limiting-order claims
      symbolically (all hold), and reports one printed defect: the maximum
      condition "c_A = K_A" [sic] is dimensionally inconsistent with the paper's
      own Eq. (3a) - the derived, unit-invariant condition is K_A c_A = 1 +
      K_B c_B, root-found by two routes sharing no algebra. The paper's
      discrimination paragraph is turned into a number: the chemisorbing species
      must span a root-found factor w* = 11.8 centred on the L-H maximum before
      the impact law can be rejected at the 1947 fit's own +-8.44 % precision,
      and placement matters as much as width (off the maximum the misfit
      collapses by three orders). A numerical experiment on C1.1's fitted
      constants then answers the question on the formalism's founding dataset:
      Hougen & Watson's own mechanism (o) is exactly Prins's Eq. (3b) (with the
      product's adsorption term retained), and fit quality alone (27.4 % mean
      |Delta| at the least-squares-optimal fit - the declared protocol;
      directly minimising mean |Delta| instead gives a smaller number,
      conclusion unchanged - vs a 16.8 % noise floor) could have rejected it -
      but only because the 1947 design spans a decade in hydrogen pressure (the
      design also straddles the L-H turnover at p_U* = 2.50 atm, an
      observation, not a second necessary condition: collapsing the hydrogen
      span alone already drops the misfit below the noise floor), while the
      denominator exponent (1 vs 2) is indistinguishable there at the design's
      noise floor even when the rates carry no noise. The source prints no
      measurement, no table and no figure, and the page claims no experimental
      validation.
