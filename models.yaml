      note: >
        Reprints the 1923 article VERBATIM as item 5 of "Pioneer papers in
        convective mass transfer", with the origin stated in its own header.
        Eqs. (1)-(8), all ten columns of Table 1, the worked example on page 432
        and the printed axis tick labels of Figs 2 and 3 were verified on renders
        of this printing at its NATIVE 300 ppi (pdfimages -list reports CCITT-G4
        bilevel at 300 ppi, so a larger render only interpolates), each numeric
        cropped and re-read at that resolution; the OCR text layer is unusable
        for numbers.
        All page references on the page are to this reprint (429-433). The 1923
        range 146-148 is inherited from the reprint's header, not verified, and no
        individual 1923 page is cited. The header prints no issue number, so the
        1923 citation carries none. The reprint's Editor's Foreword (signed
        "D.B.S.", quoting Sherwood & Pigford 1951) is 1962 commentary and is never
        attributed to Whitman.
    origin_not_consulted: >
      Chemical and Metallurgical Engineering 29, 146-148 (1923) is pre-DOI and
