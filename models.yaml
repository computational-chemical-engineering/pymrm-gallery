  - id: E1.2
    slug: davidson-bubble
    title: "The Davidson bubble: rise velocity, cloud and through-flow"
    description: >
      A single bubble in an incipiently fluidised bed is a Laplace problem with a
      uniform-pressure hole in it, and one pymrm solve of it produces both the
      cloud that Kunii and Levenspiel's equation 9 gives and the 4.5 that opens
      their equation 10 — two consecutive equations, stated and never derived,
      that turn out to be one flow field read twice. The through-flow coefficient
      comes out to 1.1e-6 without ever being an input. The cloud, unlike the
      through-flow, has a pole rather than a limit at u_br = u_f, and the source
      paper's own appendix B bed sits on the wrong side of it.
