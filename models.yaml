      from - a filename was read as evidence of a paper. The article-object
      endpoint has no page images for either PII, so Table 1 on page 265 / 3901
      STILL has not been seen on a render - the two cells rest on two agreeing
      text layers, as before. The re-examination did narrow the
      possibilities from the equations: the first five rows of the cylinder
      column reproduce eq. 16, the plate and sphere columns are right at Lambda =
      5 and 10 to 0.0003, and no single rescaling of Lambda fits both cells
      (0.197 needs 0.961x, 0.100 needs 0.974x), so a differently defined modulus
      is ruled out and two arithmetic slips are what is left. Do not record this
      as verified on the print; it is not.
