      they can catch. Both error-carrying axes are refined - marcher time step, observed
      order 1.0021, Richardson 338x; plug-flow grid, order 1.0011, Richardson 637x.
      Both branches of the lag split and the switch between them are exercised, at
      K_i = S_i^2/K_s = 3333.3333 exactly. TWENTY-FOUR defect injections, and THE
      COVERAGE MAP IS GENERATED FROM THEIR MEASURED MOVES rather than written by
      hand: each row returns a dictionary keyed by metric name holding those metrics
      recomputed under the defect, a row covers a metric only if it moves it by more
      than 1e-6 relative, and the notebook fails to execute if any metric is
      uncovered or any row moves nothing. AND THE ROWS ARE PARSED RATHER THAN
      TRUSTED: a row returning a typed constant for a metric would record a move of
