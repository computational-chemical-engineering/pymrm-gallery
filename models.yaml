  - id: A4.1
    slug: wilke-mixture-rule
    title: "Fick's law with Wilke's mixture rule for the effective diffusivity"
    description: >
      Wilke's harmonic mixture rule is exact when a species diffuses through
      genuinely stagnant gases, so agreement there is arithmetic, not evidence.
      His own paper supplies the test that can fail: eight ternary film problems
      with the exact Stefan-Maxwell solution printed beside the rule. Recomputed
      against that solution the rule is 86.6 % <!-- claim: wilke_rule_max_err_vs_exact -->
      wrong at worst and 21.6 % <!-- claim: wilke_rule_median_err_vs_exact --> at
      the median, and the harmonic average is not what limits it. Replacing it
      with the weighted arithmetic mean moves the median to 22.2 %
      <!-- claim: arithmetic_null_median_err_vs_exact --> and the worst case to
      212.7 % <!-- claim: arithmetic_null_max_err_vs_exact -->; keeping it and
      moving the composition, as Wilke's own Method 2 does, takes the worst case
      to 12.1 % <!-- claim: method2_max_err_vs_exact -->.
    section: A
    status: published
    page: pages/A4.1-wilke-mixture-rule/
    tier: T0
    priority: P1
    structures: [S3]
    phases: [gas]
    reference:
      authors: ["Wilke, C. R."]
      year: 1950
      container: "Chemical Engineering Progress 46(2) 95-104"
      doi: null
      note: >
