  - id: F3.2
    slug: van-krevelen-hoftijzer
    title: "Van Krevelen–Hoftijzer: the chart replaced by a solve, and the assumption behind it measured"
    description: >
      The enhancement factor for a second-order gas-liquid reaction is an implicit
      relation that textbooks hand over as a chart. The page solves the two film
      equations with pymrm and prices the Van Krevelen-Hoftijzer approximation
      against a Richardson-extrapolated reference over the whole printed chart:
      the worst error is -2.7955 <!-- claim: vkh_worst_rel_error_pct --> % at
      gamma = 4.728 <!-- claim: vkh_worst_gamma -->, q = 1.522 <!-- claim: vkh_worst_q -->,
      root-found in both directions, inside the "within 10 percent" Froment, De
      Wilde & Bischoff print for it. The assumption they state, in both of their
      wordings (weak depletion of B at the interface, constancy of B close to it),
      does not order the error: at the worst point beta(0) is
      0.1647 <!-- claim: beta_interface_at_worst --> and the rate-weighted mean of
      beta is 2.115 <!-- claim: beta_constancy_at_worst --> times beta(0), while
      where B is gone the approximation is exact to
      -0.00037 <!-- claim: vkh_error_at_full_depletion_pct --> %. Levenspiel's
      instantaneous correction E_i^2(E_i-1)/M_H^2 is the large-gamma asymptote
      of the approximation only when E_i is large too, never of the equations: the film's deficit is q beta(0),
      exponentially small, so at M_H = 800 the printed correction is
      44.24 <!-- claim: lev_inst_overstatement_factor --> times too large. F3.1's
      stored VKH error is loaded and reconciled, not retyped. Data tier 6: both
      sides of every comparison are equations.
    section: F
    status: published
    page: pages/F3.2-van-krevelen-hoftijzer/
    tier: T0
    priority: P1
    structures: [S3]
    phases: [gas-liquid]
    predicts:
      - the enhancement factor of a second-order gas-liquid reaction from the implicit
        Van Krevelen-Hoftijzer relation, solved rather than read off a chart, over the
        whole domain of Froment's Fig. 6.3.2-1
      - the film equations' own enhancement factor and interfacial reactant depletion,
        as the reference the approximation is priced against
      - where on the (gamma, q) plane the approximation is worst, root-found in both
        directions, and by how much
      - how far the interfacial reactant is depleted where the approximation is worst,
        where it is half gone, nearly gone and gone
      - the asymptotic deficit E_i - E on the instantaneous branch, for the
        approximation and for the equations separately
      - the constancy of B over the reaction zone, as a rate-weighted mean of beta
        divided by its interfacial value, the book's second wording of the same
        assumption
    pymrm_api: [construct_grad, construct_div, NumJac, newton, compute_boundary_values,
                find_roots, observed_orders]
    reference:
      authors: ["Van Krevelen, D. W.", "Hoftijzer, P. J."]
