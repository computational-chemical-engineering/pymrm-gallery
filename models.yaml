  - id: J5.3
    slug: chiu-gel-effect
    title: "The gel effect without a switch: Chiu, Carratt and Soong's diffusion-controlled termination"
    description: >
      Chiu, Carratt & Soong (1983) build the Trommsdorff-Norrish gel effect out of ONE
      UNBRANCHED CONSTITUTIVE EQUATION - 1/k_t = 1/k_t0 + theta_t P/f(x), a reaction
      resistance and a mass-transfer resistance in series - and criticise earlier
      treatments for switching diffusion control on at a prescribed critical conversion
      "in a somewhat ad hoc fashion".  THEIR COMPARISON WITH EXPERIMENT LIVES ONLY IN
      FIGURES 3-9, whose markers are Marten & Hamielec's data, SO THAT HALF OF THE CASE
      IS OUT OF SCOPE AND NOTHING IS DIGITISED; the page therefore establishes nothing
      about whether the model describes PMMA and says so wherever it matters.  What the
      paper prints in numerals is two tables and six stated results about its own
      output, and every parameter in Table II is a FITTED number by the table's own
      title, so everything computed from them is a CONSISTENCY CHECK on the authors'
      fit and on this transcription, never a validation against nature.
      THE HEADLINE IS THE PAPER'S OWN GRAPHICAL ONSET CONSTRUCTION, reconstructed from
      the sentence that defines it (book p. 354, "extrapolating the sloped region to
      intersect with the initial value") and computed rather than read: a least-squares
      line over the decades L0-2 to L0-4 gives 0.25516, 0.34838 and 0.44034 against
      the printed 0.26, 0.35 and 0.45, low by 0.00484, 0.00162 and 0.00966, with the
      increase with temperature reproduced.  THOSE ARE AT I_0 = 0.0258 mol/L AND THE
      PAGE SAYS SO: the paper quotes one onset per temperature while Figures 10-12 plot
      both loadings and the sentence names neither, 0.0258 is the loading listed first
      in all three legends and the one Figures 16-18 plot, and the same construction on
      the 0.01548 curve of the same figures misses by up to 0.03126, 3.24 times the
      headline miss.  THE LIMIT ON THAT NUMBER IS THE SENTENCE,
      NOT THE ARITHMETIC, and the page separates the two: SEVEN defensible readings -
      six of "the sloped region", one of "the initial value" - spread the answer by
      0.09009, 9.33 times the largest miss, while the resampling grid moves it by
      1.311e-05 relative (which is why five decimals are quoted and not six) and a
      completely independent integration - the six ODEs re-parametrised by conversion,
      different solver family - reproduces it to 9.08e-12, a residual that prices the
      ATTRACTING MANIFOLD lambda_0(x) rather than the accuracy of either integration.
      The band is reported beside the value, the fit's digits are never quoted as if
      they were the onset, and the page states what the band does NOT cover: the
      steepest-slope tangent gives 0.44783, 0.47680 and 0.51866 and is excluded because
      its tangent point sits at the right edge of THIS PAGE's window at all six
      conditions.  THAT IS THE ONLY GROUND ON WHICH ANYTHING IS EXCLUDED AND IT IS
      APPLIED TO WHAT IS KEPT IN: the widest-swinging reading in the band, the
      4-6-decade window (0.29957, 0.41999, 0.49516), passes the same test, its fit mask
      ending inside x = 0.86 at four of the six conditions including the one where the
      band is widest.
      TWO OF THE PAPER'S OWN CORRELATIONS ARE RECOMPUTED FROM ITS OWN TABLE II.
      Figure 13's Arrhenius plots give 34.908161 and 34.516600 kcal/mol at the two
      initiator loadings against the printed 34 (+2.67 % and +1.52 %, mean 34.712380)
      and 27.771564 against the printed 28 (-0.82 %).  Figure 15's "All three points
      fall on the same straight line" holds to 8.819e-04 relative, against 1.535e-02
      for the same three points fitted linearly in T - 17.4057x worse, and NEITHER FORM
      NESTS INSIDE THE OTHER, so the direction of that ratio is evidence and not
      algebra.  The T_gp that would make the three A values exactly collinear is
      111.42857 degC against Table I's printed 114, but the printed rounding of A alone
      admits [102.2222, 128.0000] degC, so the three cells CANNOT distinguish them and
      the page reports the interval rather than the point.  WHAT THE RATIO IS EVIDENCE
      FOR IS CONCAVITY IN T AND NOT THE QUADRATIC FORM, and the page restates it that
      way: 17.4057x is the gain at ONE admissible T_gp - it is 3.6124x and 3.5347x at
      the two ends of that interval and diverges inside it - and two other non-nested
      two-parameter regressors beat linear-in-T as well (A against 1/T, 5.5926x;
      A against (T - 130)^2, 3.2607x), so what all of them read is the second difference
      of A, -0.007000, which linear-in-T cannot represent.
      THE PAPER'S OWN FRAMING IS TESTED RATHER THAN RESTATED, WHICH IS WHAT THIS PAGE
      IS FOR.  "Only a small number of adjustable parameters" means four named
      parameters and THIRTEEN fitted numbers over six conditions; the paper's own
      Figures 13 and 15 compress those thirteen to eight, reproducing A to 0.0882 % and
      theta_p to 8.3695 % but theta_t only to 18.8281 %, which moves the onset
      conversion by 0.01633 - 1.691 times the distance by which the reconstruction
      misses the printed onsets.  The compression is true as a procedure and lossy as
      an identity.  And the "ad hoc" criticism survives a quantitative test: eq. 31 and
      32 carry no branch at all, the nearest thing to an onset knob (theta_t) moves the
      onset by only -0.21735 per decade - 4.601 decades to buy one unit of onset,
      where a prescribed critical conversion buys it 1:1 by construction - and the
      counterfactual settles the paper's own argument on book p. 353: the same model
      switched on at x_c = 0.3 is concave DOWN over 100 % of its pre-switch portion and
      jumps 0.760194 of a decade in log k_t at the switch - both factors of that
      expression evaluated at x_c exactly, the radical concentration root-found on the
      dense solution rather than read off the nearest grid point - while the published
      model is
      concave UP from x = 0.30643 to the sharp rise with every onset inside that window
      by at least 0.12933.  ONE QUALIFICATION THE PAPER DOES NOT MAKE: below that lower
      bound the published curve is concave down too - initiator depletion - so
      "concave upward preceding the sharp rise" is true of the region it means and not
      of the whole pre-gel curve.
      THE QUASI-STEADY-STATE ASSUMPTION IS MEASURED AT ALL SIX CONDITIONS INSTEAD OF
      THE ONE THE PAPER PLOTS.  Its "more than a factor of 2" is 3.5176x at 50 degC
      with I0 = 0.0258, where the conversion history nevertheless agrees to 0.038611 in
      x - the paper's "surprisingly consistent"; across the six the factor runs 1.4889
      to 4.8466 and exceeds 2 at three of them and fails at three, falling with
      temperature and rising as the initiator loading falls.
      FIVE IDENTITIES ARE PROVED RATHER THAN ASSERTED: eq. 24 and eq. 26 re-derived
      symbolically from eq. 21 with the paper's own boundary conditions (exactly zero),
      eq. 22's "Since r_D >> r_m" shown to cost EXACTLY r_m/r_D - symbolically and then
      a second time through the flux a pymrm spherical-shell BVP actually computes,
      1.858e-05 over five ratios at n = 6400 and converging onto r_m/r_D at observed
      order 1.8953 - and the moment
      equations 12-17 reproduced from eq. 4a, 4b and 5 summed over a seeded finite
      population to 2.10e-16, INCLUDING the k_tc terms, which Table I sets to zero and
      which therefore no condition the paper reports ever exercises.
      ONE RETRACTION IS CARRIED IN THE OPEN.  Until 2026-08-14 that eq. 22 line read
      1.53e-16 "on a pymrm spherical-shell BVP" and the number was counted among the
      page's independent routes.  It was neither: 1 - K_22/K_exact reads two CLOSED-FORM
      scalars computed inside the shell function, so it is the identity in floating
      point and returns the same bits with nu = 0, with two cells and with no solve at
      all.  The metric now reads the discrete flux, the notebook demonstrates the old
      form's insensitivity beside the corrected number, and the nu = 0 break row - which
      never covered the old metric - moves the corrected one by four orders.
      A STRUCTURAL POINT THE PAPER'S PROSE DOES NOT MAKE: its "limiting conversion at
      long times" is reproduced as an ORDERING (0.95535, 0.98173, 0.99289 at a stated
      rate threshold, smallest gap 0.011165) but this model has NO limiting conversion
      in the mathematical sense - as x -> 1 the Fujita-Doolittle factor returns to 1,
      1/k_p -> 1/k_p0 + theta_p lambda_0 stays finite and dx/dt vanishes only through
      (1-x), so integrated far enough every condition creeps to 0.97897, 0.99850 and
      0.99998 and is still rising.  The plateau in Figures 3-5 is where the curve stops
      being drawn.
      THREE PRINTED FEATURES ARE REPORTED AND NOT REPAIRED: Figure 3's legend prints
      the lower initiator loading as 0.01584 where five other printings give 0.01548;
      Table I gives the first-order k_d the units "L/min" where eq. 1 makes them 1/min;
      and book p. 353 reads "The presence model" [sic].  A fourth is measured rather
      than filed as a defect: eq. 31 and 32 print the base-ten conversion as 2.3 and
      not ln(10), which is worth 0.00116 in onset conversion, so the model is run with
      the printed 2.3 and the alternative is priced.
