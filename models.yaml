    note: >
      Experimentally grounded but read the tier carefully: Table 1 is three runs
      with no apparatus description, no replicates and no error estimate, and the
      paper's own subtitle is "A Preliminary Experimental Confirmation". The
      two-film fit to those three rates (0.379 % rms against 41.7 % and 59.5 % for
      a single gas or liquid film) is the one genuine model test, and it has
      exactly one degree of freedom, which comes out 0.934 % adrift - reported on
      the page rather than smoothed over - and it is worse than the +0.319 % a
      ONE-parameter gas film achieves on the same quantity, which the page also
      reports. The liquid-film coefficient k_c is
      identified by run 1 alone: remove that run and the remaining data admit
      every k_c up to the top of the sweep. The equilibrium relation is a
      RECONSTRUCTION from Table 1's own printed (c, p) pairs, not a digitisation
      of Fig. 3 and not a thermodynamic correlation for HCl. k_p and k_c are
      per-apparatus conductances carrying no area and no film thickness. The page
      deliberately does NOT compare film theory with penetration (A3.2) or surface
      renewal (A3.3) - Whitman's data cannot see the diffusivity exponent that
      separates them - and it does not hand that comparison to either: A3.2 has no
      source and A3.3 declines it explicitly, so the three-way comparison is OPEN
      and the page says so instead of pointing a reader at it. The reaction cell
      is a limit check, not an enhancement model (F3.1 owns Hatta).

