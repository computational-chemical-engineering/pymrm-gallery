        container: "cited by the review as its reference [87] for the hexane-isomer membrane measurements"
        note: >
          The source of the measured n-hexane/3-methylpentane selectivity of 24 at
          15 kPa upstream, and of the 1.3 the same authors obtained from PURE
          components. Both are stated in the running text of Section 4.3 and
          marked on its Fig. 29(c). Not on disk and not consulted. The
