  - id: J4.4
    slug: luedeking-piret
    title: "Luedeking-Piret: refitting alpha and beta from the one run whose raw data are printed"
    description: >
      Luedeking & Piret (1959) print dP/dt = alpha dN/dt + beta N in their Summary
      and give six (alpha, beta) pairs, one per pH level, in Table III.  THE PAPER
      USES GREEK alpha AND beta; the catalogue and this repository's case yaml both
      call them "a and b", and the page keeps the paper's symbols and records the
      discrepancy.  ONLY ONE OF THE SIX pH LEVELS HAS ITS RAW DATA PRINTED: Tables I
      and II tabulate the pH 6.0 run and nothing else, as the running text on book
      p. 401 says outright, so the page refits that one row and scopes the other
      five out rather than digitising Figs. 4-11.  NO CURVE IS DIGITISED AND NO VALUE
      OFF A FIGURE ENTERS ANY DATASET, FIT OR METRIC; the single figure READING on
      the page - Fig. 10's zero-based beta panel, calibrated once to corroborate the
      SIGN of one Table III cell - is declared as such wherever it appears.
      THE REFIT IS A CONSISTENCY CHECK ON THE AUTHORS' OWN GRAPHICAL FIT, NOT A
      VALIDATION OF THEIR MODEL, and the page says so in those words: book p. 409,
      "The constants alpha and beta are determined from the plots of Fig. 11", and
      Fig. 11 plots (1/N)(dP/dt) against k, which ARE Table II's last two columns -
      the same measurements sit on both sides of the comparison.  Ordinary least
      squares on those 22 points gives alpha = 2.266562 and beta = 0.528684 against
      the printed 2.2 and 0.55, +3.03 % and -3.88 %, and BOTH ARE INSIDE ONE
      STANDARD ERROR (0.508390 and 0.427714 of one).  THE TWO CONSTANTS ARE
      ANTICORRELATED AT -0.891902, so the pair matters more than either number:
      holding alpha at the authors' 2.2 returns beta = 0.551282, 0.23 % from their
      0.55; holding beta at 0.55 returns alpha = 2.216616, 0.76 % from their 2.2;
      and their pair costs only 0.65 % in rms against the least-squares optimum
      (0.101450 against 0.100792).  Their straight edge is statistically
      indistinguishable from least squares.  THE FORM IS TESTED AGAINST TWO NULLS
      AND BOTH ARE THE PAPER'S OWN REJECTED ALTERNATIVES (book p. 410, "Neither
      statement was found to hold true outside of the period of logarithmic
      growth"): acid production proportional to growth rate alone is 5.5500x worse
      in rms and proportional to bacterial density alone 4.9158x worse, rising to
      14.2416x and 17.7940x on the integrated acid curve.  THE DIRECTION OF THOSE
      RATIOS IS ALGEBRA - each null is an exactly nested submodel, so the ratio
      cannot fall below 1 - SO BOTH HALVES OF THE PAPER'S SENTENCE ARE TESTED, not
      only the flattering one: on the logarithmic plateau the paper points to, the
      12 rows whose printed k lies in 0.46-0.48 (a spread of 4.3478 %, reached
      across a gap from 0.40), the two one-term forms cost only 1.036042x and
      1.033197x, while on the 10 rows outside it they cost 5.011873x and 3.708246x.
      The authors' qualifier is thus quantitative in both directions, and the page
      states why a ratio near 1 there is DEGENERACY rather than agreement: dN/dt =
      k_c N makes the two regressors nearly proportional and the plateau-only fit
      returns alpha = 1.614396, beta = 0.792957.  A THIRD ROUTE TO THE
      CONSTANTS TOUCHES NO DIFFERENTIATED COLUMN AT ALL - integrating eq. (2) and
      fitting the measured P column gives alpha = 2.272660, beta = 0.510150 - and
      the integrated model with the AUTHORS' printed constants reproduces the whole
      measured acid curve to 1.70 % rms and the final 43.3 mg/ml to +3.12 %
      (44.649542 predicted), which the page labels a coherence check between two
      reductions of one run rather than an independent test, because Table II's
      dP/dt column IS the P column graphically differentiated.  THE CROSSOVER THE
      PAPER DESCRIBES IN WORDS IS GIVEN A NUMBER: the two terms are equal at
      k* = beta/alpha = 0.25 1/h at pH 6.0, reached at t ~ 10.1 h, 72.8 % of
      the way through the tabulated window, ROOT-FOUND TWICE on column pairs that
      share nothing (the k column, and separately the dN/dt and N columns), the two
      routes differing by 2.450e-05 - WHICH THE PAGE LABELS A TRANSCRIPTION-
      CONSISTENCY RESIDUAL AND NOT THE PRECISION OF t*, since a linear interpolant
      moves t* by 0.16 % and a single mis-transcribed Table III cell by 6.5 %, so t*
      is quoted to one decimal; and over the whole run the two mechanisms contribute
      46.7 % and
      53.3 % of the acid, so neither is a correction.  ACROSS pH, beta COLLAPSES AND
      alpha BARELY MOVES: beta is strictly decreasing over all six levels by a
      factor of 5.0, alpha is flat at 2.2 for the top three and rises only
      1.613636 overall, so k* falls 8.068182-fold and the fermentation becomes
      almost purely growth-associated as the pH drops.  WHAT SIX PAIRS DO NOT
      ESTABLISH IS STATED: not that the form holds at the other five levels (six
      fitted pairs are six OUTPUTS of the Fig. 11 test, not the test), not a
      functional alpha(pH) or beta(pH), and not the inflection the paper reads off
      its own Fig. 10, since three of the six alpha values are printed as the same
      number.  TABLE II CHECKS ITSELF BY THE PAPER'S OWN DEFINITIONS (book p. 400,
      k and (1/N)(dP/dt) are quotients of the other columns) and the page MEASURES
      how strong that check is: the identities hold to 2.7356 % and 1.841 %, pure
      round-off of independently rounded two-figure columns, and 1764 of the 2019
      single-digit substitutions available in the (N, dN/dt, k) triple - 87.3700 % -
      break them by more than that band.  TWO PRINTED FEATURES ARE REPORTED AND NOT
      REPAIRED: Table III's pH 5.6 beta cell carries a stray mark before its leading
      zero, and the reading 0.49 is SETTLED THREE WAYS WITH ARITHMETIC FIRST: the
      minus reading breaks the beta monotonicity this notebook asserts, so the
      notebook would refuse to execute and the break row prices the violation at
      2800 %; the paper's own Fig. 10 (book p. 407) plots beta against pH on a
      ZERO-BASED axis with all six points above the axis, that one at about 0.50,
      which corroborates the SIGN without contributing a number to any dataset or
      metric; and only then the connected-component measurement (8 px, 4x3, matching
      the five genuine mid-dots in the same column at area 8-11 and NOT the page's
      one true hyphen at 11x4 px and area 38, with zero free-floating components of
      area 4-20 anywhere on the page).  It is a dot, not a minus, the digits are
      intact, the value is 0.49, and what the mark IS cannot be settled from one
      copy and is not guessed at.  TABLE III HAS NO INTERNAL IDENTITY - six rows,
      three independent columns, no derived quantity - but the page no longer says
      it "offers no arithmetic at all", because it does not: its pH column is
      printed a second time in running text on book p. 400 and asserted against the
      CSV, beta(pH) is plotted zero-based in Fig. 10, and the pH 6.0 row can be
      refitted from Tables I and II.  The Nomenclature also lists alpha and beta as
      "Constants" with no units, which appear only in Table III's footnotes.  The
      pymrm content is
      deliberately modest and labelled as such: a batch fermenter marched with
      newton + NumJac((1,2)) and a plug-flow fermenter from
      construct_convflux_upwind + construct_div (nu=0) with the outlet read by
      compute_boundary_values, both closed by the paper's own printed k column so
      that NO GROWTH LAW IS IMPORTED, and both checked against the closed form
      eq. (2) has exactly - P = P_0 + alpha (N - N_0) + beta int N dt - coming back
      first order at 1.008072 and 1.004313 with a Richardson outlet 2.224e-05 from
      the closed form.  The outlet-read question J4.2 raised is RE-MEASURED here
      rather than inherited: with a zero-gradient outflow condition both reads are
      first order and the last-cell read is the closer, by 1.016655 at ncell 3200,
      so compute_boundary_values is kept for flux CONSISTENCY, not accuracy.
