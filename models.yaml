  - id: A4.3
    slug: dusty-gas-model
    title: "The dusty gas model"
    description: >
      Pore diffusion in its n-component form, and the three things one effective
      diffusivity per species cannot express: an inert species carrying zero flux
      with a concentration that varies by 24.4 % <!-- claim: inert_concentration_variation_kn1 -->
      at Kn = 1, uphill diffusion whose composition window narrows nearly in
      proportion to pore size, and a reaction-generated internal pressure. Plus the
      viscous term, reduced to a screening group 3 p d_0/(32 eta v_bar) which,
      swept with the Knudsen number tied to the same d_0, changes the internal
      pressure by 0.640 % <!-- claim: viscous_relief_worst_over_pore_sizes --> at
      most from 1 nm to 100 um.
