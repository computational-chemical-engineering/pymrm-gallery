  - id: G1.1
    slug: larkins-two-phase-packed-bed
    title: "Larkins two-phase concurrent flow in packed beds"
    description: >
      Larkins, White and Jeffrey print a worked example: Table 3 (book p. 234) is
      eight runs of measured two-phase data on 3/8-in. Raschig rings and Table 4
      (book p. 235) is the authors' own arithmetic on the same rows. The page
      redoes the chain cell by cell - liquid Reynolds numbers to 0.174 % worst,
      delta_l to 0.218 %, delta_g to 0.416 % and the measured delta_lg to 0.639 %
      - and reports, without repairing it, that run 5 cannot close: with no gas
      Eq. (20) reduces to delta_lg = dP/dL, and the two tables print 2.321 and
      2.469. It recovers the air viscosity behind Table 4, which the paper never
      prints, linear in temperature to 0.0259 % and 0.819 % from Table 2's value
      out of sample; it reports a second printed defect (Eq. (23) printed with
      constant terms -0.774 and -0.744 on the same page); and it labels the
      comparison of Eqs. (22) and (23) with these rows a goodness of fit, beside
      null baselines. The pymrm part is the column dP/dz = rho_m/144 - delta_lg(P),
      solved with construct_convflux_upwind, construct_div, NumJac and newton
      with an outflow outlet, against an adaptive quadrature and the paper's own
      sectional recipe. It prices the shortcut the paper's design procedure rests
      on: the arithmetic mean of the terminal pressures is exact for one phase in
      horizontal flow (proved, and at round-off on the page), and with the
      two-phase correlation in the loop a single section is 1 % wrong at
      5.6012 ft on Table 3's largest-friction-loss row and 466.9537 ft on its
      mildest; sectioning converges at second order.
