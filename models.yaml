    note: >
      ANDREWS' NUMBERS ARE HIS OWN SIMULATION OUTPUT - "The solutions presented in
      this paper were obtained using PACTOLUS on the IBM 360 computer" (p. 708) -
      and his two stated times are HIS OWN READINGS OF HIS OWN PLOT ("It can be
      seen that only 12.5 hr are required..."). So matching them is REPRODUCTION,
      NOT VALIDATION, and the page says so in those words. THE PAPER CONTAINS NO
      EXPERIMENTAL DATA AT ALL; the only measurements it mentions are other
      people's, in prose and without numbers. Nothing on this page is fitted and no
      number on it is a goodness of fit.
      THE FIGURE COMPARISON IS OUT OF SCOPE AND THE PAGE SAYS SO: no curve on any
      of the ten figures is traced, so the page DOES NOT ESTABLISH EMPIRICAL
      ADEQUACY AGAINST ANDREWS' PLOTTED RESULTS. Two initial conditions he never
      prints - Fig. 9's S_1(0) and Fig. 10's initial state - are this page's
      assumptions, stated as such, with the sensitivity reported (the critical
      inoculum varies 5.2120 % over the whole sampled S_1(0) in [0, 0.2] g/l, and
      0.4071 % over [0, 0.05] alone, which is the flattering window and not the one
      reported; S_1(0) = 0 is itself corroborated by Fig. 9, where both S_1 curves
      emanate from the origin). X_0 = 0 is
      likewise this page's reading, checked by a full-text search and a read of all
      seventeen renders that find no value for it anywhere.
      J4.1 LEFT THIS CASE THE INHIBITION FORM ON PURPOSE and this page settles it:
      Andrews eq. (1), Froment eq. (1.5.2-4) and Rawlings & Ekerdt's
      mu_m S/(K_s + S + K_1 S^2) are proved one function in sympy, with Froment's
      r_m = Andrews' muhat and Rawlings' K_1 = 1/K_i. It also finds the trap in the
      crossing: Froment's prose defines r_m as "the maximum specific rate of
      biomass growth", true for his Monod eq. (1.5.2-1) and FALSE for his
      inhibition eq. (1.5.2-4), where the maximum is r_m/(1 + 2 sqrt(K_S/K_i)) -
      24.4949 % lower at Andrews' constants. Going the other way, Andrews' own
      reference list carries the primary citations for Moser, Teissier and Contois
      that J4.1 could not attribute; they are transcribed for whoever builds those
      cases, and NOTHING IS ATTRIBUTED TO ANY OF THEM.
      Validation is ranked and the fourth route refused: internal identities (all
      sympy residuals exactly zero, printed and NOT reported, because a symbolic
      zero is a proof) and stated numerical results in the text; NO FIGURE IS
      DIGITISED. SIX quantities are computed twice and the page separates the four
      genuinely independent ones - batch time 6.7e-12, critical inoculum 2.4e-12,
      critical step 8.1e-14, X_0 fold 1.2e-9 - from the two that are the same
      algebra written twice and are labelled TRANSCRIPTION CHECKS: eq. (9) against a
      Brent root (1.1e-16) and the transcritical residence time by its two routes
