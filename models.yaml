        (printed p. 126, sec. 6.1.3); records the pedigree in sec. 8.6
        (p. 204); Example 8.5.1 (pp. 201-203), "based on experiments conducted
        by Fairbanks and Wilke (1950)", is reproduced on the page and supplies
        the stagnant-regime limit. Read at its native 600 ppi.
    origin_not_consulted: >
      Gilliland & Sherwood (1934); Sherwood, "Absorption and Extraction" (1937);
