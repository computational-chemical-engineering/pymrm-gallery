  - id: H1.1
    slug: sieverts-permeation
    title: "Sieverts-law hydrogen permeation through Pd membranes"
    description: >
      The exponent is one half because the molecule splits in two, and that single
      fact decides how a palladium membrane behaves. The permeance Itoh prints as a
      formula is derived here instead - a pymrm radial solve of the wall lands on
      his 4.47e-5 mol/s - and the half-power law is then given the two consequences
      it is usually quoted without: a permeator empties in a FINITE length (on a
      clean permeate side), where an exponent of 1 never does, and spare membrane
      capacity is worth its square. Those numbers put Itoh's own membrane 18x from
      being the limiting resistance, which is the condition that puts the reactor of
      H1.4 on its fast-permeation ceiling and leaves the permeance no observable to
      move.
