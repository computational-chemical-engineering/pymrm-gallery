  - id: A4.1
    slug: wilke-mixture-rule
    title: "Fick's law with Wilke's mixture rule for the effective diffusivity"
    description: >
      Wilke's harmonic mixture rule is exact when a species diffuses through
      genuinely stagnant gases, so agreement there is arithmetic, not evidence.
      His own paper supplies the test that can fail: eight ternary film problems
      with the exact Stefan-Maxwell solution printed beside the rule. Recomputed
      against that solution the rule is 86.6 % wrong at worst and 21.6 % at the
      median - and the harmonic average is not what limits it. Replacing it with
      the weighted arithmetic mean moves the median by 0.6 points while making
      the worst case two and a half times worse; keeping it and moving the
      composition, as Wilke's own Method 2 does, takes the worst case to 12.1 %.
    section: A
    status: published
    page: pages/A4.1-wilke-mixture-rule/
    tier: T0
    priority: P1
    structures: [S3]
    phases: [gas]
    reference:
      authors: ["Wilke, C. R."]
      year: 1950
      container: "Chemical Engineering Progress 46(2) 95-104"
      doi: null
      note: >
        The origin, read in full on renders at the scan's native 400 ppi; no DOI
        exists. Identity confirmed from the document itself (title page,
        by-line, affiliation, running feet, 30-item Literature Cited, signed
        Discussion). The text layer is among the two worst in the library
        (182 characters on journal p. 97) and no character on the page comes
        from it. THIS IS NOT the Buddenberg-Wilke viscosity rule that BSL and
        Chapman & Cowling carry, and not Wilke & Lee 1955.
    reference_read_from:
      authors: ["Taylor, R.", "Krishna, R."]
      year: 1993
      container: "Multicomponent Mass Transfer, Wiley, ISBN 0-471-57417-1"
      doi: null
      note: >
