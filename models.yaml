  # ---------------------------------------------------------------- section I
  - id: H1.9
    slug: zeolite-membrane-maxwell-stefan-mixture
    title: "Maxwell–Stefan mixture diffusion in a zeolite membrane"
    description: >
      A 95-5 methane/n-butane mixture on a silicalite membrane. The pure
      components predict a butane-over-methane permeation selectivity of 1.73;
      Krishna & Baur compute 487 and Bakker measured 380. Two things do it, and
      this page separates them: the mixture isotherm is not the multicomponent
      Langmuir - size and configurational entropy push the LARGER molecule out
      near saturation, so the butane loading falls as the pressure rises, which no
      Langmuir isotherm can produce - and the exchange coefficients between the
      two sorbates are FINITE, so the fast species is dragged along by the slow
      one. Removing the exchange alone divides the selectivity by about 40.
      The review states its experimental comparisons as numbers rather than
      plots, so the page is TIER 2 and the comparison is validation. Funke et
      al.'s hexane-isomer selectivity comes out 4.3 % high from nothing but
      pure-component isotherm fits and one diffusivity ratio, inside a 1.57x band
      of readings the review's one sentence about that run leaves open, all swept
      where the comparison is made. Bakker's two methane/butane values come out
      1.28x and 3.4x; both lie between the finite- and infinite-exchange models,
      nearer the finite one, so the data favour finite exchange while agreeing
      quantitatively with neither. The review's own computations reproduce: five
      printed selectivities and four printed mixture fluxes, worst 0.74 %. The
      fluxes do not test the membrane thickness A4.7 reconstructed, because it
      cancels out of them identically; the transient methane peak time is the one
      quantity that carries it, and refined in space and time it lands 9.8 %
      before the printed 0.73 s, needing the thickness 5.3 % larger, an open
      tension with its candidate causes named. Two printed numbers do not
      reproduce and both are investigated: the Henry-limit sorption selectivity
      (2649.9 from Table 1 against 2200, and no single-parameter slip in the two
      Table 1 rows explains it without breaking A4.7's certifying check), and the
      multicomponent-Langmuir counterfactual, whose structural claim holds and
      whose value does not. Every check on the coupled machinery has a second
      route sharing no code with the first, the steady membrane is solved by
      pymrm.newton on the logarithm of the loadings with pymrm.continuation as
      the comparison route, and the review's own counter-example, zeolite 4A,
      is carried rather than dropped.
    section: H
    status: published
    page: pages/H1.9-zeolite-membrane-maxwell-stefan-mixture/
    tier: T1
    priority: P2
    structures: [S9, S4]
    phases: [gas-solid]
    predicts:
      - mixture adsorption isotherms from pure-component fits by ideal adsorbed solution theory, eqs. (62)-(65)
      - the matrix of thermodynamic factors for a non-ideal mixture isotherm, eq. (38)
      - exchange coefficients between sorbates from pure-component diffusivities, the Vignes-type eq. (43)
      - the n-component Maxwell-Stefan flux relations in a zeolite, eqs. (42), (44) and (45)
      - transient and steady multicomponent permeation across a zeolite membrane, eqs. (57)-(59)
      - permeation and sorption selectivities, eqs. (60) and (61)
      - self-diffusivities in a multicomponent mixture, eqs. (53)-(56)
    pymrm_api:
      - construct_grad
      - construct_div
      - construct_coefficient_matrix
      - NumJac
      - newton
      - continuation
    reference:
      authors: ["Krishna, R.", "Baur, R."]
      year: 2003
      container: "Separation and Purification Technology 33(3) 213-254"
      doi: 10.1016/S1383-5866(03)00008-X
    origin_not_consulted:
      - authors: ["Bakker, W. J. W."]
        year: 1999
        container: "PhD thesis, Delft University of Technology; the review's reference [79]"
        note: >
          The source of the measured methane/n-butane permeation selectivities of
          380 and 60, which the review states in the running text of Section 4.2.
          Not on disk and not consulted; the review is the document actually read.
          It reports no uncertainty for either value and does not state the
          membrane thickness or support used.
      - authors: ["Funke, H. H.", "Argo, A. M.", "Falconer, J. L.", "Noble, R. D."]
