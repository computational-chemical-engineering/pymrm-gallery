      - C2.19
      - B1.4
      - F2.3
    note: >
      THE FORMALISM PAGE for section C: C2.3, C2.4, C2.10 and C2.19 are LHHW
      instances that should import this page's anatomy (which species in the
      adsorption group, pH vs sqrt(pH), the exponent = number of centers).

      FIT DATA ONLY. Everything printed in the source was fitted to Table A's 40
      runs; no held-out measurement exists. Every agreement is labelled
      reproduction, never validation. Data tier 2 records that the underlying
      numbers are experimental measurements printed as tables (Tschernitz et al.
      1946, reprinted in full by the book) - not that the page validates
      predictions against independent experiments.

      THE PRINTED DEFECTS, all reported and none repaired: (1) run 25a's R_calc
      prints 5.40 where its own delta/delta^2/% columns require 5.90; (2) eight of
      Table D's 200 C rows descend from one corrupted Sum(R pS) worksheet entry -
      established by two independent printed rows implying the same wrong value
      (685 vs the true 277.5) to 1.1 %, and substituting it reproduces both rows
      to ~1 %; (3) eq. (q) misprints dS_S = -30.96 where Table G's -30.46
      reproduces the book's own K_S row at 10x better rms - implementations that
      type the boxed equation inherit a K_S ~22 % low; (4) three duplicate-row
      inconsistencies (r's c = 4.95 vs siblings' 4.45 at 275 C; c's a = 9.97 vs
      9.96 and q's a = 53.9 vs 54.0 at 325 C); (5) the 275 C g/m row is
      unexplained by any single-element repair. The famous +-8.44 % is in
      R = sqrt(pHpU/r) space; the same fit scatters 16.9 % in rate space (factor
      2.00, the delta-method value, measured).

      THE DISCRIMINATION ANSWER: the sign test's joint decision {d, h} is robust
      across thresholds 1-10 %, and the family shape is genuinely selected (the
      best rejected mechanism is 2.7 points worse; deleting the product term
      costs 6 points), but molecular-vs-atomic hydrogen is not resolvable: 0.4
      percentage points apart, with noiseless h-rates fitted by d to 3.6 % over
      the same compositions. The book's "the experimental fit is better with
      mechanism d" does not survive rate-space refitting; its chemical argument
      (no dissociation required) is what actually carries the choice.

      SCOPED OUT: the Johanson-Watson toluene example (book pp. 959-961), whose
      constants derive from conversion-curve figures - the repo-wide
      figure-review gate has no maintainer; and Chapter XXI's two-dimensional
      bed illustration, whose intermediates are all charts. Neither is needed by
      this page. Runtime ~5 s. One metric sits at or below check_agreement.py's
      ABS_FLOOR and are named on the page as outside CI.

  - id: C1.3
    slug: mars-van-krevelen-redox
    title: "Mars-van Krevelen: the redox rate law, read from the paper that derived it"
    description: >
      The 1954 origin of redox (Mars-van Krevelen) kinetics prints no rate
      constant for any aromatic oxidation - the famous constants live in
      figures only, and the authors disclaim mechanistic proof in the printed
      discussion. What the paper does print, this page reproduces end to end:
      the two k' tables (Kuster's and Neumann's SO2 data with the authors'
      computed intermediates; held-out blocks at 3.80 % mean), the apparent
      activation energy (8.58 kcal/mol vs "about 9"), the eq. (8) van 't Hoff
      closure (22.6 vs the printed 23 kcal/mol), and the paper's one complete
      worked design - the two-stage SO2 converter catalyst split along the
      optimum temperature curve, 23.6 : 76.4 from printed inputs alone against
      the printed 23 : 77, by quadrature and a pymrm plug-flow solve agreeing
      to 0.10 split-points. Equal-parameter discrimination on the reprinted
      Neumann data puts the MvK integrated form at 1.0 conversion-points rms
      against 2.85 (first order) and 3.80 (Boreskov 0.8-power): the
      retardation term measurably earns its place. Four printed defects found
      and proved from the paper's own neighbours: eq. (16)'s sign-inverted
      RHS, the alpha_eq-power mismatch between (13a) and (14), the 425 C
      k'-average slip, and Table 4's unstated stoichiometry settled as
      pyrite-roaster gas.
