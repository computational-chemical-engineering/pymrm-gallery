  - id: A1.8
    slug: gas-solid-drag-closures
    title: "Two ways to close gas-solid drag: Syamlal-O'Brien against Ergun, and against the velocity-voidage law it stands in for"
    description: >
      The scalar that decides almost everything a two-fluid fluidised-bed
      simulation does is the gas-solids drag coefficient, and the MFIX Theory
      Guide states in one paragraph why there is no single answer: there are two
      kinds of experiment it can be built from, packed-bed pressure drop and
      hindered settling, and the first "must be supplemented" where it was never
      measured. This page builds both and divides them. At a packed-bed voidage
      they agree in the viscous limit to 19 % and in the inertial limit to 4 % -
      and disagree by a factor 1.73 in between, at Re_m = 4, which is a bubbling
      bed and not an exotic corner; agreement in both limits turns out to be no
      evidence of agreement at all. In the dilute limit the packed-bed form gives
      7.9 % of the drag on an isolated sphere at Re = 1 and 0.10 % at Re = 0.01,
      which is that sentence made quantitative and the whole reason a blend rule
      exists. The Syamlal-O'Brien branch needs none: V_rm(1) = 1 exactly, at every
      Reynolds number, because the radicand of eq. (12) is a perfect square. The
      page also derives what the report never states - that V_rm is a
      slip-velocity ratio, proved from the momentum equations to 9.3e-15 - and
      uses it to cost the substitution eq. (12) makes for the Richardson-Zaki
      correlation it is admitted to be standing in for: against their Table VI,
      18 tabulated indices over Re 0.39-489, the implied index is biased +3.2 % at
      eps_g = 0.45 and +29.2 % at 0.95, and in the viscous limit the whole thing
      reduces to 4.14 + 1 against their tabulated 4.65. That result is conditional
      on a reading the document does not settle - eq. (11) forces V_rm to be a
      slip-velocity ratio while the report's own prose introducing it implies
      Richardson and Zaki's superficial one, the two are exactly one unit of index
      apart, and under the alternative the same comparison reads -26.3 % and
      -0.3 % with the viscous limit at -11.0 %. Both are printed and tracked. Put
      to 8 minimum-fluidisation velocities Geldart measured on spherical particles
      in 1973, all three closures overpredict at the voidage his own columns imply
      - Ergun +42 %, Syamlal-O'Brien +101 %, Richardson-Zaki +111 % - so none is
      validated, and the absolute bias is a statement about a voidage nobody
      measured: at a textbook 0.42 the three are +4.8 %, +59.6 % and +56.8 %. What
      the data do support is the ordering, seen most cleanly by inverting the
      question: the voidage each closure would need in order to be unbiased on
      those rows is 0.4147 for Ergun and 0.3708 and 0.3538 for the other two, the
      last of which is below the random loose packing of spheres. The two
      closure-to-closure ratios are reported as algebra rather than evidence - the
      terminal velocity cancels identically out of Syamlal-O'Brien over
      Richardson-Zaki - and the Syamlal-O'Brien over Ergun ratio runs 0.97 to 1.68
      and turns over on the last of the eight cuts rather than running monotonically
      with Reynolds number. The catalogue's other two drag closures are absent from
      the document on disk and nothing is written about them from memory.
