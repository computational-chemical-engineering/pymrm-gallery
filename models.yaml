      - monolayer capacity v_m and specific surface area from a fitted isotherm
      - net heat of adsorption in the first layer, E1 - EL, from c
      - the one-sided inflection-point ceiling v(x_infl) <= (2/sqrt3) v_m for every c
      - the exact c above which the single-point BET shortcut holds to a given tolerance
      - the inter-layer dipole ratio of the polarization theory from polarizability
