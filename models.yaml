  - id: A1.8
    slug: gas-solid-drag-closures
    title: "Two ways to close gas-solid drag: Syamlal-O'Brien against Ergun, and against the velocity-voidage law it stands in for"
    description: >
      The scalar that decides almost everything a two-fluid fluidised-bed
      simulation does is the gas-solids drag coefficient, and the MFIX Theory
      Guide states in one paragraph why there is no single answer: there are two
      kinds of experiment it can be built from, packed-bed pressure drop and
      hindered settling, and the first "must be supplemented" where it was never
      measured. This page builds both and divides them. At a packed-bed voidage of
      0.44 they agree in the viscous limit to 19 <!-- claim: limit_gap_viscous_pct_eps044 --> % and in the inertial limit to 4 <!-- claim: limit_gap_inertial_pct_eps044 --> %
      and disagree by a factor 1.73 <!-- claim: disagreement_factor_eps044 --> in between, at Re_m = 4.1 <!-- claim: dip_Re_m_eps044 -->, found as the root of the
      analytic derivative of their ratio; that is a bubbling bed and not an exotic
      corner, and agreement in both limits turns out to be no evidence of agreement
      at all. In the dilute limit the packed-bed form gives 7.9 <!-- claim: ergun_isolated_Re1_pct --> % of the drag on an
      isolated sphere at Reynolds number one and 0.10 <!-- claim: ergun_isolated_Re0p01_pct --> % at a hundredth of it, which is
      that sentence made quantitative and the whole reason a blend rule exists. The
      Syamlal-O'Brien branch needs none: V_rm(1) = 1 exactly, at every Reynolds
      number, because the radicand of eq. (12) is a perfect square. The page also
      derives what the report never states, that V_rm is a slip-velocity ratio,
      proved from the momentum equations (the force balance returns it to a
      residual below 1e-9 <!-- claim: check2_force_balance_identity -->), and uses it to cost the substitution eq. (12)
      makes for the Richardson-Zaki correlation it is admitted to be standing in
      for: against their Table VI the implied index is biased +3.2 <!-- claim: check3_index_bias_pct_eps045 --> % (standard
      error 1.2 <!-- claim: check3_index_bias_se_pct_eps045 --> %) at eps_g = 0.45 and +29.2 <!-- claim: check3_index_bias_pct_eps095 --> % (2.9 <!-- claim: check3_index_bias_se_pct_eps095 --> %) at 0.95. That result is
      conditional on a reading the document does not settle: eq. (11) forces V_rm to
      be a slip-velocity ratio while the report's own prose introducing it implies
      Richardson and Zaki's superficial one, the two are exactly one unit of index
      apart, and under the alternative the same comparison reads -26.3 <!-- claim: check3_alt_reading_bias_pct_eps045 --> % and -0.3 <!-- claim: check3_alt_reading_bias_pct_eps095 --> %.
      Both are printed and tracked. Put to the minimum-fluidisation velocities
      Geldart measured on eight spherical cuts in 1973, all three closures
      overpredict at the voidage his own columns imply: Ergun +42 <!-- claim: check4_ergun_bias_pct --> %,
      Syamlal-O'Brien +101 <!-- claim: check4_syamlal_obrien_bias_pct --> %, Richardson-Zaki +111 <!-- claim: check4_richardson_zaki_bias_pct --> %. None is validated, and the
      absolute bias is a statement about a voidage nobody measured: at a textbook
      voidage Ergun is +4.8 <!-- claim: check4_ergun_bias_pct_at_eps042 --> %. What the data do support is narrower: Ergun has the
      smallest absolute bias at 4 <!-- claim: check4_ergun_least_abs_bias_voidages --> of five voidages tried, the order of Syamlal-O'Brien
      and Richardson-Zaki is resolved (more than two standard errors of their paired
      difference) at only 1 <!-- claim: check4_so_rz_order_resolved_voidages --> of them, and the voidage each closure would need in order
      to be unbiased on those rows is 0.4147 <!-- claim: check4_eps_erasing_ergun_bias --> for Ergun and 0.3708 <!-- claim: check4_eps_erasing_richardson_zaki_bias --> and 0.3538 <!-- claim: check4_eps_erasing_syamlal_obrien_bias --> for the
      other two, all below the lowest voidage in the rows. The two closure-to-closure
      ratios are reported as algebra rather than evidence, since the terminal
      velocity cancels identically out of Syamlal-O'Brien over Richardson-Zaki, and
      the Syamlal-O'Brien over Ergun ratio runs 0.97 <!-- claim: ratio_SO_over_Ergun_min_diakon --> to 1.68 <!-- claim: ratio_SO_over_Ergun_max_diakon --> and turns over before the last
      of the eight cuts rather than running monotonically with Reynolds number. The
      catalogue's other two drag closures are absent from the document on disk and
      nothing is written about them from memory.
