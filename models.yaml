      THESIS: the reaction of a gas molecule with a chemisorbed one should be
      called Langmuir-Rideal (Langmuir 1922; IUPAC Gold Book agrees), and what
      Eley and Rideal studied in 1940-41 - a chemisorbed atom with a PHYSISORBED
      molecule - is a different mechanism, "the real E-R mechanism". Same
