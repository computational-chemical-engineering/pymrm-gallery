  - id: B1.7
    slug: mears-criteria
    title: "The Mears criteria: what each transport-limit test actually guarantees"
    description: >
      Mears' 1971 review collects the diagnostic inequalities in observables -
      intraparticle, interphase, interparticle - that decide whether a measured
      rate is chemistry or transport, almost all claiming a 5 % tolerance. This
      page solves the pellet, film and dispersion problems exactly at every
      criterion's own boundary and reports what each actually admits: eq. 17 is
      exact at first order, the intraparticle family is liberal by exactly its
      admitted 0.75-to-1 rounding, eq. 9 has a measured window of no power
      around the compensation point, the combined criterion fails structurally
      at low Biot number and tolerances stack to 11 %, and Mears' own axial
      criterion is the one that holds its claim everywhere.
