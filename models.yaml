      note: >
        The paper actually read, and the source of every equation. Names the law
        and uses it, printing it as Eq. 1 with the cylindrical permeance
        alpha_H = 2 pi l_0 D C_0 / ln(r_o/r_i) and evaluating it at 473 K.
        Every character verified on the native 300 dpi bitmap. Itoh prints NO
        permeation measurement and NO temperature dependence, and never tests
        the exponent. Same source as H1.4.
    origin_not_consulted: >
      Bohmholdt, G. and Wicke, E. (1967) - the half-power pressure law, as Itoh
      attributes it; Sieverts, A. and Danz, W. (1936) - the solubility constant
      C_0 = 1280 mol/m3, the ONLY thing Itoh cites them for; Nagamoto, H. and
