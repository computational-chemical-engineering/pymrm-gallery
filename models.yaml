  - id: A3.2
    slug: higbie-penetration
    title: Higbie penetration theory
    description: >
      A surface element is exposed to the gas for a definite time, absorbs by
      unsteady diffusion the whole while, and is then swept away, so nothing
      reaches a steady state and no film thickness appears in the argument. The
      coefficient is k_L = 2 sqrt(D / pi t_exp), and the exposure time in the two
      examples BSL applies it to is not fitted: it is L/v_max for the wetted wall of
      section 18.5 and D/v_t for the rising bubble of Example 18.5-1, both set by the
      geometry. The origin (Trans. AIChE 31, 1935) is pre-DOI and was NOT consulted;
      the model is read from Bird, Stewart & Lightfoot section 18.5, which derives
      it, names the penetration model and attributes it to Higbie in the same
      paragraph (one sentence and a footnote, which is the whole of what the book
      says about the 1935 paper and, together with what Froment prints about it where
      his cross-check is described, the whole of what this page attributes to it),
      with Froment, De Wilde & Bischoff section 6.4 as an independent cross-check on
      the constant. Both of BSL's worked problems reproduce: 18A.4 to +0.188 % of the
      printed 0.273 g-mol/hr by closed form AND to +0.187 % by a pymrm march of
      Eq. 18.5-11 that touches no error function, the two agreeing to 4.6e-4 %, the
      march's grid error; that agreement tests the dimensionless Phi(Lambda) only,
      since the dimensional prefactor is common to both routes and cancels, so it is
      the +0.188 % against the printed answer that tests that prefactor; and 18A.7
      to +0.220 %, but from Eq. 18.5-19, not the Eq. 18.5-20 the problem statement
      names, which is low by exactly sqrt(3), a printed defect proved from the
      problem's own inputs and reported rather than repaired. The page then takes
      the film / penetration / surface-renewal comparison that A3.1 and A3.3 cannot
      take from their own sources, because two things make it possible: BSL Problem
      18A.7(b) quotes Hammerton & Garner's MEASURED k_c of 117 cm/hr, on which
      penetration, alone of the three, predicts without a fitted constant, and comes
      out 12.0 % low (creeping flow, 49.2 % low), while the film and renewal pictures
      each fit the same single datum with zero residual by construction, needing a
      4.49 um film or s = 72.3 s^-1; and Froment's Table 6.4.2.1 puts all three
      enhancement factors side by side, where the surface renewal column rounds
      correctly everywhere, the film column is high by one unit in the last printed
      place at two of six gamma, and THE PENETRATION COLUMN DISAGREES WITH THE CLOSED
      FORM PRINTED AT ITS OWN HEAD AT ALL SIX, two of its cells being impossible on
      the printed digits alone (0.94, below the 1 that an enhancement factor cannot
      go under and below the 1.00 the other two columns of that row carry; and
      10.39, above the same row's surface-renewal 10.05). That closed form is itself
      re-derived from Froment's own Eq. 6.4.2-4 by quadrature to below 1e-12, which
      is what makes the table wrong rather than the reading. What pymrm adds is the
      equation BSL sets up and then declines to solve, the full Eq. 18.5-7, whose
      analytic solution it attributes to Pigford's 1941 thesis without printing it,
      and what falls out is that BSL's two reasons for replacing it are not one
      argument but two of very unequal weight: at Lambda = D L/(v_max delta^2) = 0.1,
      where the front has crossed 0.63 of the film, the parabolic velocity profile
      costs 1.92 % and the finite film 4.0e-6, a factor 4810, the wall effect taken
      from an exact eigenfunction series that the books do not contain and confirmed
      by the solver refined to 4800 cells. The penetration formula is within 1 % of
      the full equation for Lambda below 0.0564, i.e. a penetration depth below
      0.475 delta, root-found with pymrm.checks.find_roots. The page's negative
      result is stated plainly: the sqrt(D) exponent is STILL not tested, because one
      (k_L, D) pair cannot resolve an exponent, and the search behind that claim is
      described rather than asserted.
