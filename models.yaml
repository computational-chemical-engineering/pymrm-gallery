  - id: A4.4
    slug: knudsen-bosanquet
    title: "Knudsen diffusion and the Bosanquet relation"
    description: >
      The Bosanquet interpolation 1/D = 1/D_K + 1/D_AB is an approximation, not
      an identity — and its error is worst in the bulk-diffusion limit and
      vanishes under Knudsen control, the opposite of the usual instinct.
      Quantified against the dusty gas model across the whole transition: for a
      spherical pellet running A -> 2B at a Thiele modulus of 30 it overestimates
      the effectiveness factor by 27 % under bulk control (grid-converged 26.96 %;
      25.5 % at phi = 10, 27.7 % at phi = 100) and by 3e-5 % under Knudsen
      control.
