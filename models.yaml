      - the temperature dependence of the adsorption constants and the lumped rate constant (eq. q)
      - the rate maximum with temperature that adsorption starvation produces (579 K at the specimen composition)
      - catalyst requirement of an isothermal plug-flow bed using the fitted law (demonstration)
