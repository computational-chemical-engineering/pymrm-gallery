  - id: H1.8
    slug: robeson-upper-bound
    title: "The Robeson upper bound, revisited: where the 2008 line moved, and what \"primarily the front factor\" can mean"
    description: >
      Every polymer-membrane paper draws one diagonal on its selectivity-permeability plot:
      P_i = k*alpha^n, the Robeson upper bound. Robeson's 2008 revisit prints k and n for
      thirteen gas pairs, prior and present - but only NINE support a prior-versus-present
      comparison (H2/O2 and He/O2 have no present bound, CO2/N2 and N2/CH4 no prior one), and
      the paper's own Conclusions classify exactly those nine. On them the paper's central
      claim, that the shift is "primarily due to a change in the front factor, k", is
      decomposed and shown to be REFERENCE-DEPENDENT: dlog k is the shift at alpha = 1, which
      is outside every dataset in the paper, and on Robeson's own Table 13 numbers the
      front-factor share of the same two shifts runs 0.56 to 1.03 across four selectivities
      spanning a factor 7. The reference-free version - the two lines are near-parallel - holds
      for six of the nine - the three it fails are H2/N2, H2/CH4 and H2/CO2, and only the last
      is one the paper itself attributes to a slope change. Sharper still: because |n| runs from
      0.79 to 5.8, dlog k does NOT reproduce the paper's own ranking of which bounds moved most,
      while the SELECTIVITY gain at fixed permeability reproduces it exactly (3 of 3, at every
      evaluation point inside the permeability range all nine pairs share, though the
      third-to-fourth gap is itself reference-dependent and runs 0.011 to 0.111 decades across
      them) - so both of Robeson's statements are true at once, one about the shape of the move
      and one about its size. Two H2/CO2 bounds cross at alpha = 37.5, inside the paper's own
      tabulated range, where the 2008 "upper bound" sits 30 % BELOW the 1994 one - the crossing
      is a property of four printed numbers, but the "inside its own range" half of it rests on
      a SINGLE tabulated point at alpha = 100.9, which a break row removes. And 19 of the 117
      points the paper tables as "close to the present empirical upper bound" lie above it, by
      up to a factor 3.5 - which is not an error but the measured cost of a line the paper says
      is drawn "by eye". Tables 13a/13b reproduce all 26 rows from Table 12 (median 0.017 %, one
      row outside even a generous printing band). The decomposition itself is DEFINITIONAL given
      Table 12 and the page says so rather than dressing an identity as corroboration: the
      Table 13 prior/present cross-check agrees with it because its residual IS the difference
      of the two corresponding Table 13 identity residuals, measured to 4e-16 decades. The one
      genuine second route replaces the present bound with a covering line re-estimated from the
      117 points - its scope is the PRESENT line only, since both routes read the prior block from
      the same restatement and both use the same reference selectivity. At each pair's
      geometric-mean selectivity it agrees on the sign of every shift and to 0.086 decades on the
      seven pairs with enough lever arm - but those numbers are themselves reference-dependent and
      the page sweeps them: across each pair's own minimum, geometric-mean, median and maximum
      tabulated selectivity the worst residual runs 0.086 to 0.543 decades and the sign count is
      8 of 9, not 9 of 9, at the minimum. It reproduces the 3-of-3 ranking at the same reference
      and at five of the seven references the primary route is swept over, 2 of 3 at the other two,
      against 3 of 3 at all seven for the primary route - a real corroboration, weaker than the
      route it corroborates, and reported that way. It does NOT reproduce the front-factor share
      (median 0.43 against 0.98, range -0.03 to 1.55) - the same warning from the other side.
    section: H
    status: published
    page: pages/H1.8-robeson-upper-bound/
    tier: T0
    priority: P1
    structures: []
    phases:
      - gas
    predicts:
      - the empirical ceiling on fast-gas permeability at a given separation factor, for eleven gas pairs, from the 2008 bound
      - how far each 1991/1994 bound moved by 2008, decomposed into a front-factor part and a slope part at a stated selectivity
      - the selectivity gain at fixed permeability, which is the measure that reproduces the paper's own ranking of the shifts
      - the selectivity at which a pair's two bounds cross, and whether that lies inside the range of the paper's own data
      - how far any claimed (permeability, selectivity) pair sits from the bound, as P/(k*alpha^n)
      - the transition permeability from solution-diffusion to Knudsen diffusion, reproduced from the bound and a solubility selectivity
    pymrm_api: []
    reference:
      authors:
        - "Robeson, L. M."
      year: 2008
      container: "Journal of Membrane Science 320(1-2) 390-400 (2008)"
      doi: 10.1016/j.memsci.2008.04.030
    reference_read_from:
      authors:
        - "Robeson, L. M."
      year: 2008
