    title: "The Prater relation: temperature slaved to concentration in a catalyst particle"
    description: >
      One linear identity fixes the temperature everywhere inside a catalyst
      particle from the concentration alone, whatever the kinetics and whatever
      the shape. Proved symbolically, confirmed across 324 pymrm solves and an
