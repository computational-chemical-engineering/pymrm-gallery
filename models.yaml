    predicts:
      - carbon on catalyst C_c = A theta^n vs catalyst residence time, with the four printed (A, n) pairs for fixed-bed and fluid cracking
      - the feed-rate exponent of carbon-on-catalyst and carbon-on-feed at fixed residence time, against the throughput (+1) and time (0) hypotheses
      - conversion vs feed rate and cracking-period length, V = 96/(U^0.34 theta^0.19), re-derived exactly from the printed chain
