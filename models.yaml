  - id: A2.4
    slug: tanks-in-series
    title: "Tanks in series: what two moments of an RTD do and do not buy you"
    description: >
      The tanks-in-series model has one adjustable number, and Levenspiel's Chapter 14
      fits it three times. Fitting N to an RTD and then reporting that the RTD comes
      back is a goodness of fit, so this page fits N where the chapter fits it - from
      two moments, in worked example E14.4 - and then tests the consequences that were
      held out of the fit: the shape of the exit curve, the F curve, first- and
      second-order conversion, the macrofluid conversion, and Eq. 4's additivity.
      All three worked examples reproduce with zero deviation and all seven Fig. 14.3
      annotations to 3e-15, including the printed threshold "error < 2 % for N > 5",
      which root-finds to N = 5.2004 and is therefore correct at the tightest integer.
      The headline is a limit rather than an agreement: a five-stage chain of
      9, 9, 9, 9, 24 s matches E14.4's measured mean and variance EXACTLY and differs
      by 23.2 % in outlet concentration at k tbar = 10 (0.16 % in conversion), while
      the closed-form supremum over every chain matching those two moments is 83.1 %
      there. Along the way the model turns out to be the first-order upwind
      finite-volume scheme on N cells, so its equivalent Peclet number is 2N - which
      makes the chapter's opening claim about the dispersion model quantitative and
      de-inverts the chapter's own printed rule on Fig. 14.7 - and five printed
      defects are proved from the book's own arithmetic.
