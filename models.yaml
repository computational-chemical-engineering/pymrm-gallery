  # ---------------------------------------------------------------- section J
  - id: J1.1
    slug: langmuir-isotherm
    title: "Langmuir 1918: the isotherm that could not have proved its own conclusion"
    description: >
      Langmuir fitted his isotherm by drawing a straight line through the p/q-versus-p
      plot, so the q_cal columns of Tables II-XVII are a two-parameter fit judged
      against its own training data; the page labels that a goodness of fit and never
      reports it as evidence. What can fail is elsewhere. Langmuir's own contest against
      Freundlich is a fair one, and with both forms refitted on q Freundlich loses by a
      factor 3.82 <!-- claim: t7_F_over_L --> in RMS on Table VII. The monomolecular
      conclusion rests on beta, whose worst row leaves a headroom 1/beta of only
