        - Andrews, J. F.
      year: 1968
      title: >
        A Mathematical Model for the Continuous Culture of Microorganisms Utilizing
        Inhibitory Substrates
      container: "Biotechnology and Bioengineering 10(6) 707-723 (1968)"
      doi: 10.1002/bit.260100602
      note: >
        ORIGIN_CONSULTED - the paper is on disk and all seventeen pages were read
        at 300 ppi, the file's native resolution (pdfimages -list reports every
        page as CCITT-G4 bilevel at 300x300 ppi, so higher would be interpolation).
        Identity confirmed from the document's own first page: masthead
        "BIOTECHNOLOGY AND BIOENGINEERING / VOL. X, PAGES 707-723 (1968)", title,
        the by-line "JOHN F. ANDREWS, Environmental Systems Engineering, Clemson
        University, Clemson, South Carolina 29631", and the Summary. The DOI is the
        catalogue's, crossref-verified 2026-08-02 against the citation string; a
        1968 paper prints no DOI and nothing on the page depends on it. THREE PAGES
        ARE LANDSCAPE in the file (PDF 8, 12, 15 - Figs. 4, 7, 9) and pdftoppm
        returns them rotated; those legends were rotated back before reading. THE
        TEXT LAYER WAS USED ONLY FOR SEARCHING - it turns X_1 into "XI", which is
        exactly the failure that would have hidden eq. (10)'s subscript defect.
        TWO BYTE-IDENTICAL COPIES arrived (md5
        1cd0f791c388e168ab2304134187a5a3, 487616 bytes each); the second is parked
        in duplicates/ and is not a second part.
        NOT CONSULTED, and nothing attributed to any of them beyond what Andrews
        prints: Haldane, "Enzymes", Longmans (1930), his reference 9 and the ORIGIN
        OF THE INHIBITION FUNCTION ITSELF; Dixon & Webb, "Enzymes", Academic Press
        (1964), his reference 11 and his source for fitting the function, which is
        one reason THIS PAGE FITS NOTHING; Monod (1942), Moser (1958), Teissier
        (1936), Contois (1959), Koga & Humphrey (1967) and Brennan's PACTOLUS
        report (1964).
        ONE BORROWED CSV: pages/J4.1-monod/data/printed-growth-laws.csv, six rows,
        loaded not retyped. Froment, Rawlings & Ekerdt and Levenspiel were NOT
        opened for this page; everything from them arrives through J4.1's
        transcription.
    data:
      tier: 1
      method: transcription
      status: complete
    note: >
      ANDREWS' NUMBERS ARE HIS OWN SIMULATION OUTPUT ("The solutions presented in
      this paper were obtained using PACTOLUS on the IBM 360 computer", p. 708), and
      his two stated times are his own readings of his own plot. So matching them is
