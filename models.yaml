      authors: ["Taylor, G. I."]
      year: 1953
      container: "Proc. R. Soc. Lond. A 219 186–203"
      doi: 10.1098/rspa.1953.0139
    note: >
      Strong "pymrm improves the original" candidate: solve the real 2D problem
      and show where the 1D effective coefficient breaks down at short times.
