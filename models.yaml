        and r_m -34.1 % <!-- claim: lb_rm_bias_vs_nls --> off the direct fit on the
        one dataset, of which 14.0 % <!-- claim: lb_KM_bias_finite_difference_only -->
        on K_M is the differencing alone).
    data:
      tier: 2
      method: >
        Two transcriptions, no digitising and no figure extraction. THE SOURCE
