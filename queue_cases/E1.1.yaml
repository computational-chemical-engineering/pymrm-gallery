scope_decision: 'DECISION: needs-paper. Not covered, and nothing built. Made before any code was written.
  The reasoning has two independent halves - what the available source actually prints, and whether
  the resulting page would duplicate E2.1.

  WHAT KUNII & LEVENSPIEL (1968) ACTUALLY PRINT. The two-phase relation is present, and it is exact.
  Journal page 482, read off a 400 dpi pdftoppm render because the text layer mangles the equations:
  eq. 2 gives delta = (u_0 - u_mf)/u_b, eq. 3 gives u_b = u_0 - u_mf + u_br with u_br = 0.711 (g d_b)^(1/2),
  and eq. 4 relates the bed voidages. Multiplying eqs. 2 and 3 makes the visible bubble flow delta*u_b
  identically equal to u_0 - u_mf - that IS the two-phase postulate. The surrounding prose is descriptive
  rather than propositional: "When a bed is fluidized by gas at a superficial velocity, u_0, in excess
  of the minimum needed, u_mf, gas voids, called bubbles, are seen to rise through a denser continuous
  region, called the emulsion", followed by "The fraction of bed consisting of bubbles is then given
  by" eq. 2.

  WHAT THEY DO NOT PRINT, which is what decides the case. (1) No attribution. Toomey & Johnstone appear
  nowhere; the entire Literature Cited list on page 492 was read. The derivation of eqs. 2-13 is deferred
  to the authors'' own companion paper, Kunii & Levenspiel, Ind. Eng. Chem. Fundamentals 7, 446 (1968b),
  which is NOT on disk. (2) No naming. The phrase "two-phase theory" does not occur. Where the paper
  surveys the field, on page 487, it speaks generically of "what is considered to be a reasonable
  two-region model" and lists a dozen references - Lanneau, Lewis, Mathis & Watson, May, Muchi, Orcutt,
  Partridge & Rowe, Shen & Johnstone, Toor & Calderbank, Van Deemter - none of them Toomey & Johnstone.
  (3) No statement of accuracy and no departure. The model assumes the split exactly and never asks
  whether the visible bubble flow really is u_0 - u_mf. The only nearby attributed statement is Zabrodsky
  (1963)''s quite different fixed-bed-like picture, that "the surplus gas beyond that needed for minimum
  fluidization bypassed one or more rows of solids, then mixed completely with the percolating gas".
  The paper''s several mentions of "bypassing and channeling" concern gas-solid contacting lowering
  the observed Sherwood and Nusselt numbers, not the gas split being wrong. The dispatch''s premise
  - that "K&L and the wider literature record that the visible bubble flow is often well below u_0
  - u_mf" - is true of the wider literature and false of this paper. The failure of the postulate
  is a later result (Grace & Clift 1974 and after) and reaches print in Fluidization Engineering,
  not here.

  SO A K&L-SOURCED E1.1 WOULD DUPLICATE E2.1. Everything K&L print about the split - eqs. 2, 3 and
  4 - is already implemented and already validated on the published E2.1 page against Appendix C''s
  own printed intermediates (u_br 42.81 vs 42.8, u_b 53.91 vs 53.9, delta 0.2059 vs 0.206). E2.1 also
  already carries the bed-scale consequences that would be E1.1''s reason to exist: the conversion
  ceiling K_bc L_f/u_b that no rate constant can beat, its exact independence of u_0, and the crossing
  below backmix flow. What would be left for E1.1 is a parametric two-phase reactor exercise whose
  bypass parameter appears in no source on disk - numbers with nothing printed to check them against,
  which is the failure mode the brief exists to prevent.

  BUT IT IS NOT `covered`, AND THAT DISTINCTION IS THE POINT. E2.1 is tier 6 and can never be anything
  else: its own meta.yaml records that nothing on it is compared with a measurement. E1.1 as catalogued
  is about the postulate itself and its empirical standing, which is exactly what a measurement can
  settle and what E2.1 structurally cannot supply. With Toomey & Johnstone in hand - or Fluidization
  Engineering ch. 6 with its Y factor - E1.1 becomes the page that tests the split against data instead
  of assuming it, which is a different page from E2.1 rather than a subset of it. Marking it covered
  would close off the one thing section E is missing. If the maintainer disagrees, the flip is two
  lines: status: covered, covered_by: E2.1.

  NO OVERLAP WITH E1.2 EITHER WAY. E1.2 (Davidson-Harrison) owns single-bubble hydrodynamics - u_br
  = 0.711 (g d_b)^(1/2), the cloud of eq. 9, through-flow, and the exchange coefficients of eqs. 10-13.
  E1.1 is the bed-scale gas partition, eq. 2 and its consequences. Nothing was built here, so no collision
  was possible; recorded for whoever resumes the case.

  '
