blocker:
  kind: paper
  question: >
    Can you supply Toomey, R. D. & Johnstone, H. F., "Gaseous fluidization of
    solid particles", Chemical Engineering Progress 48(5) 220-226 (1952)? No DOI
    exists and there is no open-access route; it is an AIChE trade-magazine
    article from a volume predating DOIs. If it cannot be obtained, a fallback
    that would unblock the case equally well is Kunii & Levenspiel, "Fluidization
    Engineering" (2nd ed., 1991), chapter 6, which states the two-phase postulate
    as such, gives the visible-bubble-flow correction Y = Q_b/[(u_0 - u_mf)A] and
    prints measured Y values showing the postulate failing - none of which is in
    the 1968 paper already on disk.
  detail: >
    E1.1 was dispatched on the hypothesis that Kunii & Levenspiel (1968), which
    IS on disk and is the source of the published E2.1 page, could stand in as
    the readable source for the two-phase postulate, following the pattern of
    B1.6, F1.3, E1.2 and J3.1. It cannot. See scope_decision for exactly what
    K&L do and do not print, and why building from K&L alone would restate the
    published E2.1 page rather than add to it.
