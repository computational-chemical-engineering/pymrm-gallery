why_only_the_original_would_do: 'THE REPRINT ROUTE FOR THIS CASE WAS CHECKED AND FAILED, and that
  failure is the canonical example in AGENTS.md: Kunii & Levenspiel state the two-phase relation but
  never name it, never attribute it to Toomey & Johnstone and never test it, so the reprint could
  not source a page ABOUT that postulate. Checked again 2026-08-06 against the newly arrived Froment,
  De Wilde & Bischoff 3rd edition: the string "Toomey" does not occur in it either, and its fluidised-bed
  treatment expresses the bubble-emulsion interaction through Davidson & Harrison''s cross-flow and
  diffusion contributions instead. Both textbooks fail E1.1 here. This file is the original.'
what_it_carries: 'From the paper''s own abstract: a theory based on the forces and energy transformations
  within a fluidized system, in which the system attains the most stable configuration and the particles
  are shown to be at their terminal velocities; from which "the average Reynolds number in the dense
  or continuous phase is essentially independent of the superficial gas velocity", and a general equation
  relating pressure drop to superficial gas velocity and particle diameter. "The gas flow through
  the interstices of the bed, both at incipient fluidization and at higher velocities, can be estimated"
  - which is the two-phase postulate the case is for. Data: Table 2 (controllable variables and pressure
  drops per run) and Table 3 (quantities computed from 16-mm Fastax motion-picture film of the moving
  bed). Ends with a printed discussion including a question from Max Leva.'
