scope_decision: 'DECISION: needs-paper. Not covered, and nothing built. Made before any code was written.
  The reasoning has two independent halves - what the available source actually prints, and whether the
  resulting page would duplicate E2.1.

  WHAT KUNII & LEVENSPIEL (1968) ACTUALLY PRINT. The two-phase relation is present, and it is exact. Journal
  page 482, read off a 400 dpi pdftoppm render because the text layer mangles the equations: eq. 2 gives
  delta = (u_0 - u_mf)/u_b, eq. 3 gives u_b = u_0 - u_mf + u_br with u_br = 0.711 (g d_b)^(1/2), and eq.
  4 relates the bed voidages. Multiplying eqs. 2 and 3 makes the visible bubble flow delta*u_b identically
  equal to u_0 - u_mf - that IS the two-phase postulate. The surrounding prose is descriptive rather than
  propositional: "When a bed is fluidized by gas at a superficial velocity, u_0, in excess of the minimum
  needed, u_mf, gas voids, called bubbles, are seen to rise through a denser continuous region, called
  the emulsion", followed by "The fraction of bed consisting of bubbles is then given by" eq. 2.

  WHAT THEY DO NOT PRINT, which is what decides the case. (1) No attribution. Toomey & Johnstone appear
  nowhere; the entire Literature Cited list on page 492 was read. The derivation of eqs. 2-13 is deferred
  to the authors'' own companion paper, Kunii & Levenspiel, Ind. Eng. Chem. Fundamentals 7, 446 (1968b),
  which is NOT on disk. (2) No naming. The phrase "two-phase theory" does not occur. Where the paper surveys
  the field, on page 487, it speaks generically of "what is considered to be a reasonable two-region model"
  and lists a dozen references - Lanneau, Lewis, Mathis & Watson, May, Muchi, Orcutt, Partridge & Rowe,
  Shen & Johnstone, Toor & Calderbank, Van Deemter - none of them Toomey & Johnstone. (3) No statement
  of accuracy and no departure. The model assumes the split exactly and never asks whether the visible
  bubble flow really is u_0 - u_mf. The only nearby attributed statement is Zabrodsky (1963)''s quite
  different fixed-bed-like picture, that "the surplus gas beyond that needed for minimum fluidization
  bypassed one or more rows of solids, then mixed completely with the percolating gas". The paper''s several
  mentions of "bypassing and channeling" concern gas-solid contacting lowering the observed Sherwood and
  Nusselt numbers, not the gas split being wrong. The dispatch''s premise - that "K&L and the wider literature
  record that the visible bubble flow is often well below u_0 - u_mf" - is true of the wider literature
  and false of this paper. The failure of the postulate is a later result (Grace & Clift 1974 and after)
  and reaches print in Fluidization Engineering, not here.

  SO A K&L-SOURCED E1.1 WOULD DUPLICATE E2.1. Everything K&L print about the split - eqs. 2, 3 and 4 -
  is already implemented and already validated on the published E2.1 page against Appendix C''s own printed
  intermediates (u_br 42.81 vs 42.8, u_b 53.91 vs 53.9, delta 0.2059 vs 0.206). E2.1 also already carries
  the bed-scale consequences that would be E1.1''s reason to exist: the conversion ceiling K_bc L_f/u_b
  that no rate constant can beat, its exact independence of u_0, and the crossing below backmix flow.
  What would be left for E1.1 is a parametric two-phase reactor exercise whose bypass parameter appears
  in no source on disk - numbers with nothing printed to check them against, which is the failure mode
  the brief exists to prevent.

  BUT IT IS NOT `covered`, AND THAT DISTINCTION IS THE POINT. E2.1 is tier 6 and can never be anything
  else: its own meta.yaml records that nothing on it is compared with a measurement. E1.1 as catalogued
  is about the postulate itself and its empirical standing, which is exactly what a measurement can settle
  and what E2.1 structurally cannot supply. With Toomey & Johnstone in hand - or Fluidization Engineering
  ch. 6 with its Y factor - E1.1 becomes the page that tests the split against data instead of assuming
  it, which is a different page from E2.1 rather than a subset of it. Marking it covered would close off
  the one thing section E is missing. If the maintainer disagrees, the flip is two lines: status: covered,
  covered_by: E2.1.

  NO OVERLAP WITH E1.2 EITHER WAY. E1.2 (Davidson-Harrison) owns single-bubble hydrodynamics - u_br =
  0.711 (g d_b)^(1/2), the cloud of eq. 9, through-flow, and the exchange coefficients of eqs. 10-13.
  E1.1 is the bed-scale gas partition, eq. 2 and its consequences. Nothing was built here, so no collision
  was possible; recorded for whoever resumes the case.

  '
notes: 'BUILT 2026-08-07 from the original, which is on disk. The `toomey_johnstone_supplied` branch of
  `resume.answer_changes` was taken. Deliverables are in queue_cases/E1.1/page/: build_page.py -> index.ipynb
  (executed clean, 4.5 s, agreement.json byte-identical on two consecutive runs), meta.yaml, README.md,
  four CSVs each with a .meta.yaml sidecar carrying a columns: block, plus agreement.json with 23 metrics.


  THE ABANDONED PARTIAL BUILD WAS DELETED AND NOT INHERITED, per the dispatch and the J1.3/A3.5 precedent.
  Every digit was re-read off fresh 400 dpi renders. The independent re-read agreed with the abandoned
  CSVs on structure (which tables matter, the run ordering) and disagreed on three substantive points:
  (a) the abandoned Table-2 CSV filled in several dPke/dPmf cells that are in fact over-struck beyond
  reading - this build leaves 17 of 41 empty rather than guessing, because the illegible cells sit at
  the ends of each series where a straight-line intercept is most sensitive; (b) the abandoned Table-3
  CSV flagged bead 3''s u_p = 1.47 as ''read_as_4_from_glyph_and_ratio'' where the printed derived column
  settles it by arithmetic; (c) the abandoned build carried a `fit_subset` column marking runs for an
  eq.-(11) refit, which this build rejects outright - the ratio column is too incomplete for the endpoints
  of a straight line to be worth anything, and the page uses the four intercept ratios the authors print
  instead.


  WHAT THE PAGE IS. It tests the postulate rather than assuming it, which is what E2.1 (tier 6, nothing
  compared with a measurement) structurally cannot be. The postulate splits into a half the data support
  (the dense-phase flow is constant) and a half they refute (that constant is u_mf); the printed ratios
  u_mf/u_e = 0.85, 0.69, 0.83, 0.87 give a visible-bubble-flow factor Y = 0.765 at u_f = 2 u_mf. Three
  further results: the bed-weight identity Toomey claims in the printed Discussion holds to 0.49 % over
  25 runs; Table 3''s derived column was computed with a wrong diameter for bead size 2 (+3.96 % on all
  four rows, 0.089 % scatter) - a printed defect, reported not repaired; and eq. (13) + the D_p-independence
  claim + the five printed Re_mf cannot all be true (u_mf ~ D_p^1.51 against the required D_p^0.5, a full
  unit at 7.9 sigma). The pymrm content is the compressible-bed solve the authors call for and never do.


  NO FIGURE WAS DIGITISED and no review/ directory exists. Figure 5''s two axes are both columns of Table
  3, so it is recomputed from printed numbers; Figures 3 and 4 need the dPke/dPmf column, which is the
  part that is illegible, and the page says so instead of tracing anything.


  MODELS.YAML IS AN UPGRADE IN PLACE, NOT AN APPEND. models.yaml already carries a `status: planned` E1.1
  block (between E1.2 and E2.7). queue_cases/E1.1/models_entry.yaml REPLACES it in full and its header
  says so; the old header in that file claimed ''APPEND - E1.1 is not in models.yaml at all'', which was
  true when written and is not any more. integrate_case.py cannot do this automatically.


  E2.1''s `related:` list already points at E1.1, so no edit is needed there.

  '
