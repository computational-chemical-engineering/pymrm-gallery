title: "Itoh Pd membrane reactor: shifting a dehydrogenation equilibrium"
description: >
  Hydrogen leaves through a palladium wall, so a dehydrogenation capped at
  18.7 % equilibrium conversion runs to a measured 99.7 %. The model puts that
  operating point on its co-current fast-permeation ceiling and lands on the
  measured number with nothing fitted - and the page measures how little the
  comparison resolves (nothing about the kinetics or the permeance), after two
  misprints in the 3-page communication are resolved from the paper's own
  statements.
