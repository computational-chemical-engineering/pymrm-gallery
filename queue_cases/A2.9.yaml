what_it_carries: >
  * Part I derives the simplified E (engulfment) model from the earlier
    engulfment-deformation-diffusion (EDD) model, stating explicitly when the
    simplification is valid: Sc < 4000 and N > 2 (equivalently F < 1). E is
    named as the engulfment rate and related to the kinematic viscosity and the
    energy dissipation rate.
  * Part I's Tables 1-5 are printed numeric tables of product distribution X_s
    against the engulfment/reaction parameters - the effect of the discretisation
    parameter u, of feed conditions, of Sc (or Da), and of buffer concentration.
    Table 1 also carries the experimental Schmidt-number range 640 < Sc < 2560.
  * Part II applies the model to six problems (two four-reaction, four
    two-reaction) across plug flow, semi-batch and CSTR modes, with its own
    Tables 1-5 of X_s. It also introduces self-engulfment for plug-flow regions.
  * The chemistry throughout is the 1-naphthol / diazotised sulphanilic acid
    test reaction that made the model famous, so the selectivity the page
    reports is the one the model was validated on.

  Both parts pass the E1.1 test outright: they derive, name and test the model
  the case is for. The validation route is PRINTED TABLES, not figures - no
  maintainer needed.

validation_route: printed tables (Part I Tables 1-5, Part II Tables 1-5)
notes: >
  Micromixing selectivity is S1 (a pointwise ODE system), so this is a small
  page. The interesting pymrm angle is that the E model exists precisely to
  AVOID the PDE the EDD model needs - so a page that solves both and shows where
  the simplification's Sc < 4000 / F < 1 bound bites would be a genuine
  extension rather than a reproduction. Note that requires the earlier EDD
  papers, which are NOT on disk; do not claim the comparison without them.
