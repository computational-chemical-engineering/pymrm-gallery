page_range_discrepancy: UNRESOLVED, RECORD BOTH, DO NOT SILENTLY PICK ONE. Part I's own running heads
  read Page 139 (title page), 140, 141, ... 144 - i.e. Chem. Eng. Progr. 48(3) 139-144. The universal
  citation, including ISI's 1993 "This Week's Citation Classic" written by Ranz himself and also on
  disk, is 48, 141-146. Part II's footers read 173-180 and DO agree with the standard citation, so
  the disagreement is confined to Part I and is exactly two pages; the article is six pages either
  way. Whatever the page writes, it must say which it read.
false_alarms_now_closed: TWO files made this case look sourced before and both are still on disk under
  names that now say what they are. MISC-Ranz1993-citation-classic-commentary-CurrContents22.pdf is
  a ONE-PAGE 1993 reminiscence carrying none of the correlations. Charlesworth1960-evaporation-drops-dissolved-solids-AIChEJ6-9.pdf
  is a companion study by the same group about a different problem (crust formation in drops containing
  dissolved solids). The open question recorded on 2026-08-05 - does Charlesworth reprint enough to
  source this case by the reprint route? - is now MOOT.
what_it_carries: 'Part II page 1 prints the fitted intercepts N_Nu = 2.23 and N_Nu'' = 1.79 and the
  pure liquid-drop results (Table 1 and Figure 6), and explains the free-convection correction at
  N_Re = 0. Tables 2 and 3 with Figure 9 carry the rest. Ranz''s own 1993 caveat, worth putting on
  the page: the crude accounting for radial convection at the drop surface (the D_f factor) was "unfortunately
  not emphasized in the original papers".'
