  abandoned_work_deleted: 'The 2026-08-07 partial build (build_page.py plus seven sidecar-less CSVs)
    was DELETED and the case rebuilt from the source, per dispatch. The old CSVs were glanced at only
    to see which tables mattered; every digit was re-read from fresh 400 dpi crops. The independent
    re-read agreed with the old transcription everywhere EXCEPT Table 4 run 11''s N_Nu'', which the
    old file had as 10.0 and the 2026-08-07 build read as 10.6 on glyph evidence. THE FIXER PASS
    REVERTED THAT TO 10.0: the glyph is genuinely ambiguous, and Table 4''s own rate-independent
    N_Nu''/N_Nu ratio, which depends only on the printed temperatures and pressure, excludes 10.6 by
    6 % against a 1 % rounding budget. So the abandoned build was right on that cell. The old
    Tables 5 and 6 were dropped with a stated reason rather than carried.'
  headline: 'The correlation''s four constants have four different statuses and only the intercept is
    testable: 2.0 is theoretical, 0.60 is fitted to the very tables any comparison uses, and 1/2 and
    1/3 are Froessling''s assumptions, not identifiable from the transcribed tables (Part II tests
    them graphically in Figure 12, which is out of scope here). Extrapolated to N_Re = 0 by the
    same free two-parameter fit, Table 1 heat gives 2.0582 (+2.91 %), Table 4 benzene mass transfer
    2.0523 (+2.61 %) and Table 1 water mass transfer 1.7322 (-13.39 %), against a measured
    repeatability of 0.68 %. The paper''s own still-air pair, 2.23 and 1.79, has a ratio of 1.2458
    where eqs. (21) and (22) demand 1.'
  second_finding: 'The Reynolds column is over-determined by the columns printed beside it, and asking
    it at what temperature the air properties were evaluated - a convention neither part states FOR
    THE TABLES - returns w = 0.4996, i.e. the film temperature, by bounded minimisation rather than a
    sweep. Two independent corroborations were added in the fixer pass: Part II DOES state a reference
    temperature once, for the still-air run ("an average temperature of 290 deg K."), and that row''s
    printed air and drop temperatures average to 290.15 K; and Table 3, which prints no Reynolds
    column and so cannot enter the fit, reproduces its printed abscissa to 0.823 % at the recovered w
    against 1.769 % at the free stream, at 330-410 K against the fit''s 281-329 K. The
    fitted temperature exponent then lands on kinetic theory''s -1.7 (-1.765 +- 0.027 against
    -1.323 +- 0.033 at the free stream) and Table 1''s residual collapses to 0.126 % rms over eighteen
    four-figure Reynolds numbers. It is also a reuse instruction: using the free-stream temperature
    moves N_Re by up to 15.5 % on the paper''s own rows.'
  printed_defects_found: 'NONE. Two printed arithmetic checks were run and both came out clean and are
    reported anyway: test No. 80''s 5.83(1 - 0.028 - 0.006 - 0.011) = 5.57 recomputes to 5.567650
    (4.2e-04 relative), and eq. (24)''s 0.54 is within 0.34 % of what Table 1''s own rows give with
    the intercept held at 2.0.'
  scope_decisions: 'Figures 5, 12, 13 and 14 are out of scope (curves only, no maintainer figure
    review available), so nothing was digitised. Two consequences are stated on the page rather than
    worked around: the free-convection exponent 1/4 of eqs. (10)/(11) is NEVER EXERCISED, and Table 6''s
    calculated rates cannot be reproduced because they need Figure 14''s vapour-pressure curve. Table 5
    is unused - it carries no transfer coefficient. Table 2 is transcribed and used only for its two
    replicate pairs and for the Reynolds check, because every transfer number in it is 2 significant
    figures and its Re column is 1-2.'
  known_soft_spots: 'Three N_Nu'' cells (Table 1 runs 12-14) are covered by an ink blot and are left
    EMPTY, not guessed; the break table shows that filling them in by eye moves the water intercept
    1.7322 -> 1.8576, which weakens but does not remove the finding. No specific fill values are
    asserted. One digit (Table 4 run 11) is settled by the table''s own ratio arithmetic rather than
    by the glyph, which is ambiguous. The p_f = "the D_f factor"
    identification for Ranz''s 1993 caveat is an inference and is labelled one - no D_f appears in
    either part''s notation. The w identification rests on the Table 1 / Table 4 contrast:
    leave-one-TABLE-out is not stable (dropping Table 1 or Table 4 sends w to about 0.92), which is
    why the two external corroborations matter.'
