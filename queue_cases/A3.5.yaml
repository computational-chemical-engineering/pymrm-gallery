page_range_discrepancy: 'RESOLVED 2026-08-07 IN FAVOUR OF 141-146, WITH BOTH READINGS RECORDED ON THE
  PAGE AND THE MECHANISM SHOWN. Every Part I scan frame carries TWO folio lines: one at the very top,
  above the black edge of the leaf, and one at the bottom inside it. They differ by exactly two on
  every page, but BOTH LINES ARE LEGIBLE ON ONLY FOUR OF THE SIX FRAMES - 139/141,
  140/142, 141/143 and 144/146; on frame 4 the upper line is cut off at the leaf edge and on frame 5
  there is none, so 142?/144 and 143?/145 are inferred from the sequence rather than read. Part II settles which is
  the page''s own: its first page has a BLANK top margin and prints "Vol. 48, No. 4 | Chemical
  Engineering Progress | Page 173" at the FOOT of the text block, so in this issue the folio line is
  a FOOTER, not a running head. The line at the top of a Part I frame is therefore the preceding
  leaf''s footer caught in the same frame, and Part I''s own folios are 141-146 - which is the
  universal citation and the one Ranz himself gives in the 1993 ISI commentary on disk ("Chem. Eng.
  Progr. 48:141-6; 173-80, 1952"). The 139-144 reading came from taking the upper line as a running
  head. The page records both readings, states which it read, and cites only the foot-of-page folio
  throughout. Part II is 173-180 either way. THE FILENAME STILL CARRIES 139 and has NOT been changed;
  docs/papers-inventory.yaml still carries the old "UNRESOLVED" note and should be updated by the
  integrator if this resolution is accepted.'
false_alarms_now_closed: TWO files made this case look sourced before and both are still on disk under
  names that now say what they are. MISC-Ranz1993-citation-classic-commentary-CurrContents22.pdf is
  a ONE-PAGE 1993 reminiscence carrying none of the correlations - it is cited on the built page for
  exactly one thing, Ranz's own caveat about the crude accounting for radial convection.
  Charlesworth1960-evaporation-drops-dissolved-solids-AIChEJ6-9.pdf is a companion study by the same
  group about a different problem and is not used at all.
what_it_carries: 'Part II page 1 (folio 173) prints eqs. (21) and (22) and the still-air N_Nu = 2.23
  and N_Nu'' = 1.79; Table 1 (folio 174) the water-in-dry-air runs; Tables 2 and 3 (folio 175) the
  hot-air runs, Table 3 with the correlation''s own abscissa printed; Table 4 (folio 176) the benzene
  runs; eq. (24) (folio 179) the collapsed aqueous form h = (k/D_p)(2.0 + 0.54 Re^(1/2)); the Notation
  (folio 180) the definition of p_f. Part I carries the theory: eq. (7) N_Nu = N_Nu'' = 2.0 (folio 142),
  eqs. (8)-(11) with m = p = 1/3 and n = q = 1/2 from Froessling (folio 143), and eqs. (16)-(20) plus
  the worked correction for test No. 80 (folio 146).'
