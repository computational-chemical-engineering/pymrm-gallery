  for N tanks as its eq. 3 with the properties in Fig. 14.3; section 14.2 gives first-order conversion
  for N tanks and the graphical construction for arbitrary kinetics (Fig. 14.8), plus the macrofluid
  form via eq. 11.3. ATTRIBUTES: the F curve, Fig. 14.7, is labelled "from MacMullin and Weber (1935)".
  CARRIES AND TESTS: three worked examples E14.1-E14.3 fit N to real RTD data, and the chapter states
  the model''s own limits ("use it for small deviations from plug flow", equivalence to the dispersion
  model).'
