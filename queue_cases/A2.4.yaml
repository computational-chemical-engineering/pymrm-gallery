fixed:
  date: '2026-08-07'
  against: queue_cases/A2.4/review/verification.md
  summary: 'F1/F2 (blocking): the page asserted six times across five files that Ch. 14 prints no
    N-to-dispersion rule. It does - on Fig. 14.7, book p. 327 - and it is inverted. Every instance
    of the false claim removed and the inversion reported as printed defect (0), the most
    consequential of the set; the de-inversion is proved from Ch. 13''s own printed
    sigma^2_theta = 2(D/uL) and from the exact match of the annotation''s N > 50 threshold to
    Fig. 13.11''s printed D/uL < 0.01 limit. Two Ch. 13 rows added to the CSV. F3 (blocking): the
    23.2 % headline restated as a gap in OUTLET CONCENTRATION at the right-hand edge of a monotone
    sweep and as a LOWER bound, with the conversion gap (0.16 %, max 0.38 %) and the closed-form
    family supremum (83.1 %) printed beside it. F4: the four vacuous companion strings given real
    metrics (new e14_1/e14_2_wrong_power_gap) and the assert now fails when a companion names
    nothing. F5: rtd_convolution_dev relabelled structural, the "protects the quadrature" sentence
    deleted, and the independent-computations table corrected. F6: the break table rebuilt so every
    row recomputes and pins one metric, with the coverage map BUILT from the declared mover lists;
    the no-defect Eq. 4 row replaced by a real injection and the two collapse rows labelled. F7:
    the moment window extended to 800 s and what those two metrics measure said plainly. F8: the
    printed-coefficient peak 0.0149138 used for the tick defect. F9: Eq. 5 correctly identified.
    F10-F12 also taken: the volume-ratio factor extrapolated to exactly 2, the 900 s unit slip
    counted as a printed defect, and the three Pe matching rules reconciled.'
