  headline: 'THE HEADLINE IS A LIMIT, NOT AN AGREEMENT. A five-stage chain with residence times
    9, 9, 9, 9 and 24 s matches E14.4''s measured mean (60 s) and variance (900 s^2) EXACTLY - both
    deviations 0, asserted in code - and differs by 23.2 % in OUTLET CONCENTRATION at k tbar = 10
    (6.1 % second order), with an exit curve 6.9 % of the peak away. Stated with its three
    qualifications everywhere it appears: it is a concentration gap and NOT a conversion gap (the
    chains convert 99.334 % and 99.488 %, and the relative conversion gap never exceeds 0.38 %
    anywhere); it is monotone in k tbar, so it is the right-hand edge of the sweep and not a
    maximum over it (1.53 % at 2, 69.7 % at 50); and it is ONE chain, hence a lower bound. The
    supremum over the whole family matching both moments is closed form - every extremal chain has
    at most two distinct tank sizes, by Lagrange - and is 83.1 % at k tbar = 10, a factor of 5.9.'
  second_routes: 'four headlines computed twice with no shared assembly: E14.2''s L by brentq on
    the printed ratio AND by the closed form 119/(1-(10.5/14)^2); E14.4''s prefactor from
    N^N/((N-1)! tbar^N) AND by numerically normalising t^3 e^(-4t/60); first-order conversion by
    Eq. 11''s macrofluid quadrature of int e^(-kt) E dt AND by Eq. 9''s algebra; the RTD by a pymrm
    Crank-Nicolson march AND by Eq. 3''s closed form. The Simpson convolution E_M * E_N is NOT one
    of them and is not cited as one: for equal tank sizes the integrand is a cubic and Simpson is
    exact on cubics, so it is a structural identity that returns the same 1e-18 on 20 panels.'
  printed_defects: 'FIVE, each proved from the book''s own numbers and none repaired. (0) THE
    CONSEQUENTIAL ONE, and the one the first draft got backwards by asserting the chapter printed
    no conversion rule at all. Fig. 14.7, p. 327, inside its own axes box: "When N > 50 the curve
    becomes symmetrical in which case use fig. 13-11 with N = 1/2 (D/uL)" - the ratio is INVERTED.
    Ch. 13''s printed sigma^2_theta = 2(D/uL) (Fig. 13.12, p. 303) with Ch. 14''s
    sigma^2_theta = 1/N gives N = 1/2 (uL/D); and under the corrected form the annotation''s own
    threshold N > 50 is exactly D/uL < 0.01, the printed validity limit of the figure it points at.
    As printed it is 138 % wrong in conversion at N = 64, k tbar = 2, against 0.053 % de-inverted.
    (1) p. 328, V_Ntanks/V_p = 1 + k tbar_i = 1 + k tbar/(2N): the two right-hand sides differ by a
    factor of EXACTLY 2 (extrapolated to x = 0, not fitted) and the book''s own Eq. 9 shows the
    MIDDLE form is the wrong one. (2) Fig. E14.4b, p. 334: the top axis tick reads 0.105 s^-1 where
    the tick sequence and the book''s own PRINTED E(t) (peak 0.0149138 at t = 44.9775 s, ratio
    7.04) both require 0.015. (3) E14.2, p. 331: "L = 272 moles" where the Comment below says
    "L <= 272 miles". (4) E14.4, p. 333: "Delta(sigma^2) = 1000 - 100 = 900 s", a variance in
    seconds. In (3) and (4) the value is right and only the unit is a slip. A SIXTH item is
    typesetting: Eq. 11''s denominator is set as (N-1)! tbar_N with a LOWERED N where tbar^N is
    required, and E14.4 prints the raised form two pages later.'
  pymrm_finding: 'There is no pure-outflow boundary condition in pymrm. The nearest, zero-gradient,
    makes construct_convflux_upwind reconstruct the exit face to second order as (9 C_N - C_N-1)/8 -
    correct for a discretised PDE, a MODELLING error when the cell count is a physical parameter.
    It costs 5.9 % at N=2 and 3.8 % at N=4 and decays as N^-0.87, i.e. it is indistinguishable from
    ordinary first-order discretisation error. The page suppresses the boundary flux (b=1, d=0) and
    adds the outflow as a construct_coefficient_matrix sink on the last tank, which is exact. Worth
    a bc kind or a documented recipe in pymrm.'
  scope_decisions: 'E14.3 SCOPED OUT: its data live only in the curve of Fig. E14.3a and no curve is
    traced anywhere on this page. Fig. 14.3''s E_theta,inf annotation REPORTED BUT NOT SCORED: the
    two inflection points sit at 0.4267 and 0.6943 of the maximum at N = 4 while the figure draws a
    single level, and which convention it intends is not recoverable. Eq. 5 (the one-shot tracer
    relation Delta sigma^2 = (Delta tbar)^2/N, p. 324) is IN scope and is the most exercised
    relation on the page - run backwards it is E14.4''s fit. The CLOSED-RECIRCULATION material
    (Eqs. 6a-c and 7a-c, p. 325, Figs. 14.5-14.6) and Fig. 14.8''s graphical construction are out
    of scope; both are named in the "published model" section and neither is claimed as tested.'
