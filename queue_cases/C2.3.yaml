    ("D. C. DYSON AND J. M. SIMON, Chemical Engineering Department, Rice
    University, Houston, Tex.") sits at the foot of that same page. A reader
    who checks only the first screen will reject this file.
    (2) The PDF's `Title` metadata read "Kinetic study of the dehydrogenation of
    ethanol" during acquisition - the title of a DIFFERENT file in the same drop
    (1-s2.0-0009250964850922-main.pdf, Franckaerts & Froment 1964, now mapped to
    C2.19). Publisher metadata is not evidence.
    Identity established instead from the running head, the by-line, and the ACS
    download stamp printed on every page:
    "pubs.acs.org/iecfa7/article-pdf/7/4/605/19276144/i160028a013.pdf". 6 pp,
    complete, journal pages 605-610.
