    TWO TRAPS HAD TO BE CLEARED ON THIS FILE.
    (1) PDF page 1 opens with the LITERATURE CITED of the PRECEDING article (a
    Japanese catalyst study citing Ai, Echigoya & Ozaki and Wheeler), ending
    "Received for review August 31, 1967 / Accepted July 5, 1968 / Investigation
