  render_at: 300 dpi. CCITT-G4 bilevel at 300 x 300 ppi native. 600 dpi is interpolation.

what_it_carries: >
  The Temkin-Pyzhev rate expression in the engineering form that essentially
  every ammonia-converter model since has used, for pressures 150-300 atm, plus
  a printed effectiveness-factor correlation for the industrial pellet (the
  "diffusion correction" of the title) obtained by solving the pellet problem
  and correlating the result. Includes an equilibrium treatment, a
  conversion-temperature plane figure for a stoichiometric inert-free mixture at
  50 atm, and a comparison against the "reported exit conversions from
  experimental converter of Nielsen et al."
  Table I gives the constants for Equation 39 - printed, and the natural
  reproduction target.
validation_route: >
  PRINTED TABLE (Table I constants) plus the paper's own comparison against
  Nielsen's measured converter exit conversions. The comparison figure is a
  figure; the constants are printed. Build against the constants and the
  equilibrium/rate arithmetic first - that needs no maintainer. Only the
  Nielsen overlay would need digitisation, and it is not required for the page
  to stand.
notes: >
  SHARED FILE: this is the same document as D3.2 (ammonia synthesis converter).
  C2.3 is the rate law; D3.2 is the multi-bed reactor built on it. Build C2.3
  first and have D3.2 import it. Do NOT dispatch two builders who each
  transcribe Table I.
  The effectiveness-factor correlation makes this a natural consumer of B1.1
  (published) and of the C1.1 LHHW page.
