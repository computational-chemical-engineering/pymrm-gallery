  quality: >
    Good for prose. Equations damaged in the usual ACS-scan way (Equation (4)
    reads "<<=/< Xif^ ="); Table I "Constants for Equation 39" extracts its
    numbers cleanly enough to read (6.900548, 6.190112, 4.687353 ...) but MUST
