what_it_carries: >
  The model the case is named for, in the authors' own abstract: a rate equation
  for formation of the fouling compound coupled to the continuity equation for
  the main product, for TWO mechanisms - fouling by a reaction PARALLEL to the
  main reaction, and by one CONSECUTIVE to it. The decisive modelling choice is
  stated explicitly: activity is related "directly to the CARBON CONTENT of the
  catalyst, rather than to time, as has been done until now", with two
  functional forms tried (exponential and hyperbolic). The result is that the
  deposited carbon forms a PROFILE along the bed - descending for a parallel
  mechanism, ascending for a consecutive one - and the paper then discusses what
  those profiles do to the rate and temperature profiles.
  Passes the E1.1 test outright.
validation_route: >
  The descending-vs-ascending carbon profile is a QUALITATIVE signature that a
  pymrm sweep reproduces directly and that no fitting can fake, which makes it a
  strong page even before any number is matched. Whether the profiles are also
  tabulated has NOT been checked off the renders. Check before promising a
  quantitative comparison.
notes: >
  Same author as C2.10/D3.4 (Froment 1967) and same co-author as B1.3 (Bischoff
  1965) - three of this drop's files are by these two men, and the deactivation,
  o-xylene and generalised-modulus pages can share conventions.
  Build after B2.1 (Voorhies), whose coking law this generalises.
