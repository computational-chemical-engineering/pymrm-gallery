  summary: >
    Built and executed (about 90 s). All three printed solutions re-derived
    independently (incl. an exact scalar-ODE reduction of the consecutive case
    not in the paper) and met by one pymrm bed at observed order ~2 in both
    axes, worst 1.7e-5. The paper's four approximations measured (gamma=0:
    0.29 % at its own gamma, 5.9 % at its printed 0.02 bound; series 22 % off
    at its claimed corner; large-eta patch under-counts carbon by 1.16 in
    alpha*c at ab_eta=10 - the printed Fig. 3(b) inherits the bias; eta ~= t
    costs 2.2e-5). Three quantified findings against printed claims: the
    eq. (49) alpha*z/az typo, the false 'improves as eta increases' claim, and
    the two Fig.-4 slope onsets (exact: CE 0.710 at 4, crossing 0.5 near 13
    with no plateau; PH 0.726 at 10). Profile-diagnostic detectability mapped;
    Voorhies-exponent comparison sharpened (no quoted exponent reachable by
    parallel-exponential). The qualitative descending-vs-ascending signature
    the case file names as the validation route is reproduced exactly and
    extended with amplitudes. 55 metrics, 11 break rows. Nothing digitised; no
    review gate needed. Part II untouched (api-text only), as instructed.
