blocker:
  kind: needs-paper
  question: >
    Please supply EITHER Gunn, D. J., "Axial and radial dispersion in fixed
    beds", Chem. Eng. Sci. 42(2) 363-373 (1987), OR Gunn, D. J., "Theory of axial
    and radial dispersion in packed beds", Trans. Instn Chem. Engrs 47 (1969)
    351-359. Either one is enough; the second is where the model is derived.
  detail: >
    The 1993 note that arrived on 2026-08-02 IS about the right model and prints
    it in full as its Eq. (42):

      D/(Ud) = (ReSc/eps.Gamma)(1-p)^2
             + (Re^2 Sc^2/eps^2 Gamma^2) p(1-p)^3 (exp[-eps.Gamma/(p(1-p)ReSc)] - 1)
             + eps/(tau ReSc)

    but it is not evaluable from that paper alone. Three things are missing.

    (a) p(Re), the "probability of axial displacement", is the model's one
        empirical function and is never printed. The note says only that finding
        it from liquid-phase data "has been carried out for beds of spheres,
        solid cylinders and hollow cylinders [2, 5]" - i.e. in the two papers
        requested above.
    (b) eps, the bed porosity used in the figures, is not stated.
    (c) Gamma = 4(1-eps)alpha_1^2/eps therefore cannot be formed either, although
        tau = 1.4 IS given, in the Figure 1 caption.

    Without p(Re) the page would have to invent it or back-fit it from Gunn's own
    Figure 1, which is the fabrication route this case must not take. The
    equation itself is transcribed and the transcription is legible; only the
    empirical function is absent.
  artifacts:
  - the 1993 note, at ~/papers/pymrm-gallery/1-s2.0-025527019380020H-main.pdf
  - "the scope decision that established this: queue_cases/A2.5.yaml, scope_decision"

notes: >
  Reviewed on 2026-08-02 by the A2.5 builder, who read both papers and decided
  NOT to absorb this case into A2.5. The full argument is in
  queue_cases/A2.5.yaml under `scope_decision`; the short form is that (i) the
  model cannot be evaluated from the paper on disk, (ii) the two models are not
  algebraically identical and the 1993 note is in fact an argument about exactly
  that limit - E&R's Pe -> 2 versus Gunn's Ud/D -> 2p/(1-p) - so the A2.1/A2.2
  merge precedent does not apply, and (iii) no existing page examines this
  content, so the J3.3 `covered` precedent does not apply either.

  Two things from the 1993 note are already recorded on the A2.5 page, so they do
  not need redoing: Gunn puts the Peclet maximum of Edwards & Richardson's own
  data "at a Reynolds number of ~4" (A2.5 computes 3.195 from Eq. 18), and he
  quotes the argon-air Schmidt group as 0.77 where Edwards & Richardson use 0.72.

  When a paper does arrive, note that the 1993 note also reproduces Tsotsas &
  Schlunder's Figure 6 as its own Figure 3, and its Figures 1 and 2 carry
  experimental data from seven sources with Schmidt numbers from 0.77 to 4600 -
  which would make the eventual A2.6 page a strong candidate for an
  experimentally validated one, and a natural place to test the Schmidt-group
  dependence that A2.5 explicitly cannot (only one gas pair was ever run).
