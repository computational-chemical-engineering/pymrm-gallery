blocker: null

blocker_resolved:
  date: '2026-08-05'
  was: needs-paper, parked 2026-08-02 by the A2.5 builder
  the_question_was: >
    p(Re), the model's one empirical function, is never printed in the 1993 note,
    and neither is the porosity, so eq. (42) could not be evaluated without
    back-fitting p to the very figure the model is then compared against.
  the_answer: >
    THE 1987 PAPER PRINTS p(Re) OUTRIGHT, as three equations on journal page 365,
    read at 600 dpi:

      p = 0.17 + 0.33 exp(-24/Re),   spheres,          tau = 1.4    (3)
      p = 0.17 + 0.29 exp(-24/Re),   solid cylinders,  tau = 1.93   (4)
      p = 0.17 + 0.20 exp(-24/Re),   hollow cylinders, tau = 1.8    (5)

    The offset 0.17 and the scale 24 are shared by all three; only the amplitude
    and the tortuosity change with shape. Nothing had to be reconstructed and
    nothing was fitted.

    It also prints eq. (1), the axial model itself, which is eq. (42) of the 1993
    note written with 4 alpha_1^2 (1-eps) in place of eps.Gamma; the notebook
    checks the two forms against each other over 2001 Reynolds numbers at two
    Schmidt groups and gets 8.7e-11. And it prints the radial correlations, eqs
    (9)-(12), the Sherwood correlation eq. (13), the Danckwerts and
    convection-dominated boundary conditions eqs (14)-(15), and a printed
    closed-form reactor solution, eqs (16)-(18).

    THE POROSITY IS STILL NOT PRINTED for any figure. What the paper does print,
    on journal page 368 in the tube-diameter argument, is "the voidage in the
    bulk of a fixed bed of spheres is about 0.37". The page uses 0.37, states
    that it is an assumption, and reports the sensitivity of every comparison to
    it - which turns out to be the largest single uncertainty on the page,
    larger than the effect of p(Re) itself.

scope_decision_review:
  reviewed: '2026-08-05'
  question: >
    A2.5's builder argued A2.6 must stay separate partly because Gunn is an
    ARGUMENT AGAINST the Edwards & Richardson limit: E&R fix Pe -> 2 from the
    mixing-cell result, Gunn's eq. (43) gives Ud/D -> 2p/(1-p), which is 2 only
    if p = 0.5. Does the 1987 paper support, weaken or change that?
  verdict: >
    IT SHARPENS IT, AND MAKES IT QUANTITATIVE. The separation stands, and the
    reason is now stronger than when it was written.

    The 1987 paper supplies exactly the number the argument was missing. For
    SPHERES, eq. (3) gives p_inf = 0.17 + 0.33 = 0.50, so 2p/(1-p) = 2.0000 -
    Gunn's model reproduces E&R's limit EXACTLY. To that extent the two papers
    agree, and Gunn says so himself on journal page 366: "Pe approaches the
    widely quoted value of 2 at Reynolds numbers approaching 1000". Evaluated,
    eq. (1) gives 1.9862 at Re = 1000.

    But eqs (4) and (5), fitted to England and Gunn's CYLINDER measurements and
    never seeing a sphere, give p_inf = 0.46 and 0.37, hence 1.7037 and 1.1746.
    So the agreement at 2 is a property of the sphere fit, not of the model, and
    the mixing-cell argument - which contains no particle shape at all - cannot
    be what produces it. That is a stronger statement than "2 only if p = 0.5",
    because it is now falsifiable and falsified for two of the three shapes the
    same paper covers.

    The page also states the width of the claim honestly: two printed digits fix
    the limit only to about +/-4 %, so 2.0000 is not exact in any meaningful
    sense. What is outside rounding is the 1.70-fold spread between shapes.

    NOTHING HERE CHANGES A2.5. Its content - the measurement, the two-point
    moment method, the numerical-dispersion budget, the two-zone channelling
    diagnostic - is untouched, and this page adds no correction to it. The two
    numerical disagreements A2.5 already records are carried here unrepaired and
    are now quantified: Gunn's Sc = 0.77 against E&R's 0.72 changes the headline
    agreement by 0.6 percentage points, and Gunn's "maximum at Re about 4" is
    attributed, as A2.5 attributes it, to his Figure 1's COMBINED gas-phase set.
    For the record, eq. (1) itself peaks at Pe = 4.527 at Re = 3.151, against
    A2.5's Pe = 3.186 at Re = 3.195 for eq. (18), and the largest measured Peclet
    number in the file is 4.158.

    A merge would still have been wrong, and for a fourth reason the original
    argument did not have: this page is S6 and A2.5 is S4. The 2-D bed that uses
    the axial and radial coefficients together has no counterpart in A2.5.

