blocker: null

blocker_resolved:
  date: '2026-08-05'
  was: needs-paper, parked 2026-08-02 by the A2.5 builder
  the_question_was: >
    p(Re), the model's one empirical function, is never printed in the 1993 note,
    and neither is the porosity, so eq. (42) could not be evaluated without
    back-fitting p to the very figure the model is then compared against.
  the_answer: >
    THE 1987 PAPER PRINTS p(Re) OUTRIGHT, as three equations on journal page 365,
    read at 600 dpi:

      p = 0.17 + 0.33 exp(-24/Re),   spheres,          tau = 1.4    (3)
      p = 0.17 + 0.29 exp(-24/Re),   solid cylinders,  tau = 1.93   (4)
      p = 0.17 + 0.20 exp(-24/Re),   hollow cylinders, tau = 1.8    (5)

    The offset 0.17 and the scale 24 are shared by all three; only the amplitude
    and the tortuosity change with shape. Nothing had to be reconstructed and
    nothing was fitted.

    It also prints eq. (1), the axial model itself, which is eq. (42) of the 1993
    note written with 4 alpha_1^2 (1-eps) in place of eps.Gamma; the notebook
    checks the two forms against each other over 2001 Reynolds numbers at two
    Schmidt groups and gets 8.7e-11. And it prints the radial correlations, eqs
    (9)-(12), the Sherwood correlation eq. (13), the Danckwerts and
    convection-dominated boundary conditions eqs (14)-(15), and a printed
    closed-form reactor solution, eqs (16)-(18).

    THE POROSITY IS STILL NOT PRINTED for any figure. What the paper does print,
    on journal page 368 in the tube-diameter argument, is "the voidage in the
    bulk of a fixed bed of spheres is about 0.37". The page uses 0.37, states
    that it is an assumption, and reports the sensitivity of every comparison to
    it - which turns out to be the largest single uncertainty on the page,
    larger than the effect of p(Re) itself.

scope_decision_review:
  reviewed: '2026-08-05'
  question: >
    A2.5's builder argued A2.6 must stay separate partly because Gunn is an
    ARGUMENT AGAINST the Edwards & Richardson limit: E&R fix Pe -> 2 from the
    mixing-cell result, Gunn's eq. (43) gives Ud/D -> 2p/(1-p), which is 2 only
    if p = 0.5. Does the 1987 paper support, weaken or change that?
  verdict: >
    IT SHARPENS IT, AND MAKES IT QUANTITATIVE. The separation stands, and the
    reason is now stronger than when it was written.

    The 1987 paper supplies exactly the number the argument was missing. For
    SPHERES, eq. (3) gives p_inf = 0.17 + 0.33 = 0.50, so 2p/(1-p) = 2.0000 -
    Gunn's model reproduces E&R's limit EXACTLY. To that extent the two papers
    agree, and Gunn says so himself on journal page 366: "Pe approaches the
    widely quoted value of 2 at Reynolds numbers approaching 1000". Evaluated,
    eq. (1) gives 1.9862 at Re = 1000.

    But eqs (4) and (5), fitted to England and Gunn's CYLINDER measurements and
    never seeing a sphere, give p_inf = 0.46 and 0.37, hence 1.7037 and 1.1746.
    So the agreement at 2 is a property of the sphere fit, not of the model, and
    the mixing-cell argument - which contains no particle shape at all - cannot
    be what produces it. That is a stronger statement than "2 only if p = 0.5",
    because it is now falsifiable and falsified for two of the three shapes the
    same paper covers.

    The page also states the width of the claim honestly: two printed digits fix
    the limit only to about +/-4 %, so 2.0000 is not exact in any meaningful
    sense. What is outside rounding is the 1.70-fold spread between shapes.

    NOTHING HERE CHANGES A2.5. Its content - the measurement, the two-point
    moment method, the numerical-dispersion budget, the two-zone channelling
    diagnostic - is untouched, and this page adds no correction to it. The two
    numerical disagreements A2.5 already records are carried here unrepaired and
    are now quantified: Gunn's Sc = 0.77 against E&R's 0.72 changes the headline
    agreement by 0.6 percentage points, and Gunn's "maximum at Re about 4" is
    attributed, as A2.5 attributes it, to his Figure 1's COMBINED gas-phase set.
    For the record, eq. (1) itself peaks at Pe = 4.527 at Re = 3.151, against
    A2.5's Pe = 3.186 at Re = 3.195 for eq. (18), and the largest measured Peclet
    number in the file is 4.158.

    A merge would still have been wrong, and for a fourth reason the original
    argument did not have: this page is S6 and A2.5 is S4. The 2-D bed that uses
    the axial and radial coefficients together has no counterpart in A2.5.

deliverables:
  page: queue_cases/A2.6/page/
  models_entry: queue_cases/A2.6/models_entry.yaml
  runtime_seconds: 9
  review_artifact: none - NO figure was digitised for this page
  datasets:
  - gunn-1987-stated.csv (51 printed scalars, journal pages 365-371)
  - gunn-1987-table1.csv (4 particle grades x 3 estimates of intraparticle diffusivity)
  borrowed_datasets:
  - "pages/A2.5-edwards-richardson-dispersion/data/edwards-richardson-1968-fig9.csv (55 markers)"
  - "pages/A2.5-edwards-richardson-dispersion/data/edwards-richardson-1968-stated.csv"

key_numbers:
  peclet_limit_by_shape: >
    2.0000 spheres, 1.7037 solid cylinders, 1.1746 hollow cylinders, from
    Ud/D -> 2p_inf/(1-p_inf) with p_inf = 0.17 + the printed amplitude. Checked
    against direct evaluation of eq. (1) at Re = 1e8 to 7.2e-08 on all three.
    Two printed digits fix the limit only to about 4 %; the 1.70-fold spread
    between shapes is what is outside rounding
  eq8_worked_example: 1.65 x 0.37 / 0.6 = 1.0175 against the printed 1.02, -0.25 %
  stated_numbers: >
    seven reproduced, deviations 0.0 % to 11.4 %, each inside the precision of
    the phrase it tests. Pe(1000) = 1.9862 vs "approaches 2"; the liquid/gas
    maximum 10.891 at Re = 3.166 vs "a factor of 10 at Re ~ 3"; the crossover at
    Re = 0.177 vs "0.2"; Table 1's ten entries averaging 0.0970 vs "about 10 %"
  stated_range_that_fails: >
    the UPPER end of "0.2 < Re < 300" is not a crossing at all - the liquid/gas
    ratio decays asymptotically to 1 and is still 1.084 at Re = 300 and 1.025 at
    Re = 1000. Reported, not repaired
  cross_document_identity: >
    eq. (1) [1987] vs eq. (42) [1993] with Gamma = 4(1-eps)alpha_1^2/eps, 8.7e-11
    over 2001 Reynolds numbers at Sc = 0.77 and 800. STRUCTURAL - no break row,
    and the page says so
  expm1_finding: >
    the two printed forms are algebraically identical and NOT numerically: written
    as exp(x) - 1 rather than expm1(x), eq. (1)'s liquid branch loses 1.7e-06
    relative at Sc = 800, because the second term cancels the first exactly in the
    limit
  eq1_vs_55_markers: >
    20.30 % mean absolute deviation, +15.77 % bias, log scatter 0.1994, against
    A2.5's 55 digitised markers. E&R's own eq. (18) on the same rows, recomputed
    here, gives 11.7495 % and +0.0031 % - reproducing A2.5's published 11.75 %
    and +0.003 % to 1e-05 absolute
  nulls: >
    22.96 % with p a FREE constant, p = 0.0793 - the strongest null and the one
    the page reports against, because anything weaker flatters p(Re). Also
    24.88 % with p frozen at 0.17, 67.63 % with p frozen at 0.50 (the mixing-cell
    picture), 23.16 % with eq. (1)'s second term dropped, 29.91 % for E&R's
    uncorrected eq. (15)
  fit_set_overlap: >
    PROBABLY OUT OF SAMPLE, argued from printed text rather than assumed. Gunn
    1987 p. 365 says p was estimated from experiments "in which the effect of
    molecular diffusion was very small"; Gunn 1993 p. 335 says that meant
    liquid-phase measurements, ReSc >> 1, for all three shapes [2, 5] = Gunn 1969
    and Gunn 1987, with gas-phase results used "to compare". These markers are gas
    phase at Sc = 0.77 with ReSc = 0.0066 to 37.8, median 1.40, 26 of 55 below 1
    and 47 of 55 below 10. The 1987 paper attributes eqs (4)/(5) to England & Gunn
    (1970) and eq. (3) to nothing, and says E&R's estimates "are well supported by
    eq. (1)". Not provably held out either, and the page does not upgrade the word
  what_the_markers_cannot_resolve: >
    deleting p(Re) costs 2.7 percentage points against the strongest null at
    eps = 0.37, and 4.6 points when each model is given the porosity it prefers
    (16.38 % at eps = 0.443 against 21.01 % at 0.433). The UNPRINTED porosity
    moves the headline 9.1 points between eps = 0.34 and 0.40, 3.4 times as much,
    and does so NON-monotonically: there is an interior minimum at eps = 0.4429,
    MAD 16.38 %, and the residual rises again above it. Nothing on the page
    separates a porosity error from a model error
  solver_eq17: 7.454e-07 at n_z = 800, observed order 1.99; STRUCTURALLY BLIND to nu, n_r and D_R
  solver_bessel_mode: >
    2.896e-05 at (800, 80), observed order 2.00 refining both axes, against a 2-D
    closed form derived here (eq. 17 with k -> k + D_R (beta_1/R)^2). Break
    factors x2646 on nu = 0, x252 on n_r = 5, x64 on bare upwind, x23 on a
    zero-gradient outlet, x559 on a Dirichlet inlet
  solver_pair_blind_spot: >
    a 10 % error made CONSISTENTLY in D or D_R - operator, lam, k_eff and the
    closed form together - moves the two checks by 0.0 % and 6.3 %, against the
    factor of four they move for one grid halving. A coefficient wrong everywhere
    is invisible to both, because the closed form is built from the same numbers.
    The same 10 % injected into the OPERATOR ALONE, reference held fixed, moves
    V5a x1369 and V5b x53.7 for D, and V5b x445 for D_R while leaving V5a at
    exactly 1. Both experiments are on the page; the earlier draft labelled the
    consistent rows "in the operator only", which is what they are not
  wall_channel: >
    reading Price's superficial 1.65 as INTERSTITIAL raises unconverted reactant
    leaving a 100-diameter bed by +5.46 % with no radial mixing and +1.16 % with
    eq. (9)'s coefficient, so radial dispersion erodes 79 % of the channel. Gunn's
    own corrected 1.0175 moves it by +0.001 %
  outlet_boundary_condition: >
    the zero-gradient outlet reports +1.03 % too much unreacted material, and that
    number is IDENTICAL from L/d = 5 to L/d = 200. What length buys is the
    interior: the same error 4 diameters in falls from +0.15 % to 9.4e-08 to
    4.4e-16 at L/d = 20 - one unit in the last place - and to a true zero beyond.
    Over a 400-fold sweep in kL/U the outlet error is 0.911 to 0.998 times
    lambda D/U
  second_independent_computation: >
    V8. Two reactor numbers recomputed with scipy solve_bvp collocation, a
    different mesh in a different solver, the reference asserting status == 0 and
    its own rms residuals (worst 1.0e-10). The wall-channel cost with radial
    dispersion off agrees to 1.4e-04 relative, which is the only check on the page
    that reads the velocity profile, the area weights and the mixing-cup
    weighting - V5a and V5b both run a uniform profile. The outlet-condition error
    did NOT agree: it had been read at the last cell CENTRE, h/2 short of z = L,
    and since eq. (18) and the zero-gradient outlet differ in outlet gradient by
    construction the offset does not cancel in their ratio. That made the metric
    11.4 % low and no break row could have found it. Read at the FACE at
    h = 1/32 d it is 1.0339 % against the collocation 1.0353 %, -0.13 %
  table1: >
    worst within-row spread 16.0 %, mean 10.6 %, over four grades and three
    independent methods; mean of the ten entries 0.0970 against the paper's own
    "about 10 % of molecular". The isobaric counter-diffusion column is the
    largest on 4 of 4 rows (one-sided sign test p = 0.0625) - printed, not claimed
  metrics_below_abs_floor: >
    NONE. All 51 reported metrics are above check_agreement.py's ABS_FLOOR of
    1e-12; the smallest is 8.7e-11. The notebook prints this check itself

break_table:
  solver_rows: 9
  correlation_rows: 20
  note: >
    Two families, because they fail under disjoint defects and neither
    substitutes for the other. Every metric on the page has a row that moves it
    except two, which are labelled structural on the page: the cross-document
    identity against eq. (42), and eq. (17) substituted back into eq. (16).
    Several more are guarded by a family rather than an individual row (the four
    nulls, the porosity points and the optimum, and the recomputation of A2.5's
    published headline, which is guarded by A2.5's own break table), and four by
    a second independent computation of the same quantity, which is stronger.

    Rows added after adversarial review: p_offset 0.17 read as 0.11 (Peclet limit
    2 -> 1.571), the wall region 0.5d read as 1.0d (wall-channel cost +168 %), the
    Danckwerts inlet written with the local u(r) instead of the area mean
    (-1.1 %), and the two genuine operator-only coefficient injections.

    The sharpest correlation rows: eq. (1)'s second term dropped moves the
    high-Re limit check by 1.4e7; alpha_1 taken as the first root of J_1 instead
    of J_0 moves the headline agreement by +207 % and the liquid/gas ratio by
    +41 %; eq. (10)'s 29 read as 2.9 moves D_axial/D_radial by +237 %; the wall
    porosity 0.6 read as 0.5 moves eq. (8) by +20 %; eq. (3)'s 24 read as 2.4
    moves Pe(1000) by +2.9 %; Table 1's two em dashes read as zeros move its mean
    by -16.7 %.

what_the_page_cannot_conclude:
- >
  That eq. (1) is validated against measurement. It is compared against 55
  digitised markers at a porosity nobody printed, and deleting p(Re) costs less
  than a plausible porosity error. The markers are PROBABLY outside the set Gunn
  estimated p(Re) from - see fit_set_overlap - but "probably outside" is not "held
  out", and the page does not upgrade the word.
- >
  Anything about the Schmidt-group dependence, which is what Gunn's Figure 1
  exists to show over a 1000-fold range and is the reason this model is more than
  a correlation. The gallery has no liquid-phase dispersion dataset. Jacques &
  Vermeulen (1957) or Miller & King (1966) would supply one, and would test the
  model on the phase Gunn says p(Re) was actually estimated from. This is the
  single most valuable extension.
- >
  Anything about particle shape from measurement. Only the sphere branch is
  tested; eqs (4), (5), (11) and (12) are evaluated and never checked against
  data, so the headline shape result rests entirely on printed constants.
- >
  Anything about the radial correlation from measurement. Eq. (9) is used in the
  2-D bed and checked for self-consistency, and its high-Reynolds-number values
  (Pe_f -> 11, 7 and 5.7) are noted to reproduce the textbook radial Peclet
  number - but no radial dispersion data are on disk.
- >
  Anything about eq. (13), the Sherwood correlation. It is transcribed into the
  CSV because it is on the same pages and is the most-cited thing in the paper,
  and it is never exercised. A page for it would belong in section A3 beside A3.4
  (Wakao & Funazkri), which is the natural comparison, and would need a dataset
  neither page has.
- >
  That the wall-channel or outlet-condition numbers generalise. Both are one
  operating point, stated in full on the page; the paper contains no worked
  reactor example, so nothing there constrains L/d, d_t/d or the Damkohler group.

source_notes:
  pdf_findings: >
    docs/pdf-findings.md has no entry for Gunn1987-axial-radial-dispersion-fixed-beds-CES42-363.pdf yet.
    One is needed and this is what it should say. The scan is a 1987 Pergamon
    Acrobat Capture job, 11 pages, about 5,500 characters per page, and the text
    layer is USABLE FOR PROSE AND UNUSABLE FOR EQUATIONS. Observed corruptions:
    eq. (1) comes back as "4a;;;+,)(1 -PI?"; eq. (5) as
    "p=O.i7+0.20exp(-24/Re)"; "Peclet" as "P&let" throughout; the running head
    volume line split across five lines and mis-ordered; "Miller and King" as
    "Miller and Ring" in the Figure 1 caption; Table 1's row label SA201 as
    "SA20 1". Every constant used on the page was read off a page render, never
    off the text layer. CORRECTED 2026-08-05 after the native-resolution rule was
    revised: `pdfimages -list` shows this scan is CCITT-G4 bilevel at 300 ppi
    NATIVE, so the first pass at 600 dpi was interpolation. Eqs (1) and (2), the
    Notation on journal page 372, the p(Re) constants, the wall paragraph on page
    368 and all ten Table 1 entries were re-read on CROPPED renders at 300 ppi.
    Two things were settled by that re-read and by nothing else: the subscript 0
    in Re = d U_0 rho / mu, and the missing square in eq. (2)'s denominator.
  papers_on_disk: >
    DEFECT TO FIX, found 2026-08-05: docs/papers-on-disk.yaml now carries the key
    `A2.6:` TWICE - line 43 mapping it to Gunn1993-axial-dispersion-note-ChemEngProcess32-333.pdf (the
    1993 note) and line 105 mapping it to Gunn1987-axial-radial-dispersion-fixed-beds-CES42-363.pdf (the
    catalogued 1987 paper). YAML silently keeps the LAST one, so `yaml.safe_load`
    returns the 1987 file and the earlier line is invisible to any tool while
    still being read by humans. The 1987 mapping is the correct one; the 1993
    line should be deleted from the mapping and re-added as a comment or under a
    separate `secondary:` key, because that note IS a legitimate secondary source
    for this case and the page cites it. Not fixed here - docs/ is outside the
    builder's remit.
  printing_errors_in_the_source:
  - >
    The caption of Figure 5 says the solid lines are "eq. (4)". Eq. (4) is the
    probability function for solid cylinders; the figure is radial dispersion in
    beds of SPHERES, so the lines must be eqs (9) and (10), as the body text says
    two sentences earlier. Recorded in the dataset sidecar, not repaired.
  - >
    The tortuosity for spheres is 1.4 in eq. (3) and 1.2 in eq. (10) - the same
    physical quantity in the same beds, 17 % apart, described by the paper only
    as differing "by small amounts". Both are carried as separate CSV rows and
    the page uses each in its own place; using the radial one axially is a
    break-table row.

notes: >
  Built on 2026-08-05 by copying pages/A2.5-edwards-richardson-dispersion/ and
  substituting the physics, as AGENTS.md requires. The break table was rebuilt
  from scratch for the substituted physics - none of A2.5's rows apply, since
  this page has no transient solve, no moment inversion and no two-zone model.

  The cross-page rule was followed in both directions. A2.5's nine findings about
  the 55 borrowed rows are listed in this page's "The data" section with a
  statement of whether each affects it; A2.5's published headline of 11.75 % is
  RECOMPUTED from the same file rather than quoted, and reproduces to 1e-05; and
  the two numbers this page states that also live in A2.5's data - the Peclet
  maximum and the effect of including the one nearly-resolvable fused glyph - are
  printed beside A2.5's own values.

  NO figure was digitised for this page and none should be. There is no
  maintainer available for a figure review, and the one figure-derived dataset
  this page needs already exists, audited, on a published page.
