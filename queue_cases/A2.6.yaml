key_numbers:
  peclet_limit_by_shape: >
    2.0000 spheres, 1.7037 solid cylinders, 1.1746 hollow cylinders, from
    Ud/D -> 2p_inf/(1-p_inf) with p_inf = 0.17 + the printed amplitude. Checked
    against direct evaluation of eq. (1) at Re = 1e8 to 7.2e-08 on all three.
    Two printed digits fix the limit only to about 4 %; the 1.70-fold spread
    between shapes is what is outside rounding
  eq8_worked_example: 1.65 x 0.37 / 0.6 = 1.0175 against the printed 1.02, -0.25 %
  stated_numbers: >
    seven reproduced, deviations 0.0 % to 11.4 %, each inside the precision of
    the phrase it tests. Pe(1000) = 1.9862 vs "approaches 2"; the liquid/gas
    maximum 10.891 at Re = 3.166 vs "a factor of 10 at Re ~ 3"; the crossover at
    Re = 0.177 vs "0.2"; Table 1's ten entries averaging 0.0970 vs "about 10 %"
  stated_range_that_fails: >
    the UPPER end of "0.2 < Re < 300" is not a crossing at all - the liquid/gas
    ratio decays asymptotically to 1 and is still 1.084 at Re = 300 and 1.025 at
    Re = 1000. Reported, not repaired
  cross_document_identity: >
    eq. (1) [1987] vs eq. (42) [1993] with Gamma = 4(1-eps)alpha_1^2/eps, 8.7e-11
    over 2001 Reynolds numbers at Sc = 0.77 and 800. STRUCTURAL - no break row,
    and the page says so
  expm1_finding: >
    the two printed forms are algebraically identical and NOT numerically: written
    as exp(x) - 1 rather than expm1(x), eq. (1)'s liquid branch loses 1.7e-06
    relative at Sc = 800, because the second term cancels the first exactly in the
    limit
  eq1_vs_55_markers: >
    20.30 % mean absolute deviation, +15.77 % bias, log scatter 0.1994, against
    A2.5's 55 digitised markers. E&R's own eq. (18) on the same rows, recomputed
    here, gives 11.7495 % and +0.0031 % - reproducing A2.5's published 11.75 %
    and +0.003 % to 1e-05 absolute
  nulls: >
    24.88 % with p frozen at 0.17 (p(Re) deleted), 67.63 % with p frozen at 0.50
    (the mixing-cell picture), 23.16 % with eq. (1)'s second term dropped, 29.91 %
    for E&R's uncorrected eq. (15)
  what_the_markers_cannot_resolve: >
    deleting p(Re) altogether costs 4.6 percentage points, while the UNPRINTED
    porosity moves the headline 9.1 points between eps = 0.34 and 0.40 - twice as
    much - and monotonically, so these data would prefer a looser bed than 0.37.
    Nothing on the page separates a porosity error from a model error
  solver_eq17: 7.454e-07 at n_z = 800, observed order 1.99; STRUCTURALLY BLIND to nu, n_r and D_R
  solver_bessel_mode: >
    2.896e-05 at (800, 80), observed order 2.00 refining both axes, against a 2-D
    closed form derived here (eq. 17 with k -> k + D_R (beta_1/R)^2). Break
    factors x2646 on nu = 0, x252 on n_r = 5, x64 on bare upwind, x23 on a
    zero-gradient outlet, x559 on a Dirichlet inlet
  solver_pair_blind_spot: >
    a 10 % error in D or D_R moves the two checks by 0.0 % and 6.3 %, against the
    factor of four they move for one grid halving. The transport coefficients are
    invisible to both, because the closed form is built from the same numbers -
    stated on the page, not left to look like evidence
  wall_channel: >
    reading Price's superficial 1.65 as INTERSTITIAL raises unconverted reactant
    leaving a 100-diameter bed by +5.46 % with no radial mixing and +1.16 % with
    eq. (9)'s coefficient, so radial dispersion erodes 79 % of the channel. Gunn's
    own corrected 1.0175 moves it by +0.001 %
  outlet_boundary_condition: >
    the zero-gradient outlet reports +0.92 % too much unreacted material, and that
    number is IDENTICAL from L/d = 5 to L/d = 200. What length buys is the
    interior: the same error 4 diameters in falls from +0.13 % to 9.3e-08 to
    exactly zero in double precision. Over a 400-fold sweep in kL/U the outlet
    error is 0.79 to 0.89 times lambda D/U
  table1: >
    worst within-row spread 16.0 %, mean 10.6 %, over four grades and three
    independent methods; mean of the ten entries 0.0970 against the paper's own
    "about 10 % of molecular". The isobaric counter-diffusion column is the
    largest on 4 of 4 rows (one-sided sign test p = 0.0625) - printed, not claimed
  metrics_below_abs_floor: >
    NONE. All 39 reported metrics are above check_agreement.py's ABS_FLOOR of
    1e-12; the smallest is 8.7e-11. The notebook prints this check itself

break_table:
  solver_rows: 8
  correlation_rows: 17
  note: >
    Two families, because they fail under disjoint defects and neither
    substitutes for the other. Every metric on the page has a row that moves it
    except two, which are labelled structural on the page: the cross-document
    identity against eq. (42), and eq. (17) substituted back into eq. (16).
    Three more are guarded by a family rather than an individual row (the three
    nulls, the two porosity points, and the recomputation of A2.5's published
    headline, which is guarded by A2.5's own break table).

    The sharpest correlation rows: eq. (1)'s second term dropped moves the
    high-Re limit check by 1.4e7; alpha_1 taken as the first root of J_1 instead
    of J_0 moves the headline agreement by +207 % and the liquid/gas ratio by
    +41 %; eq. (10)'s 29 read as 2.9 moves D_axial/D_radial by +237 %; the wall
    porosity 0.6 read as 0.5 moves eq. (8) by +20 %; eq. (3)'s 24 read as 2.4
    moves Pe(1000) by +2.9 %; Table 1's two em dashes read as zeros move its mean
    by -16.7 %.

what_the_page_cannot_conclude:
- >
  That eq. (1) is validated against measurement. The comparison is a goodness of
  fit with PARTIAL overlap - Gunn fitted p(Re) to a body of sphere and cylinder
  data that includes E&R's points - at a porosity nobody printed, and deleting
  p(Re) altogether costs less than a plausible porosity error.
- >
  Anything about the Schmidt-group dependence, which is what Gunn's Figure 1
  exists to show over a 1000-fold range and is the reason this model is more than
  a correlation. The gallery has no liquid-phase dispersion dataset. Jacques &
  Vermeulen (1957) or Miller & King (1966) would supply one and would turn a
  partly circular fit residual into a genuine test. This is the single most
  valuable extension.
- >
  Anything about particle shape from measurement. Only the sphere branch is
  tested; eqs (4), (5), (11) and (12) are evaluated and never checked against
  data, so the headline shape result rests entirely on printed constants.
- >
  Anything about the radial correlation from measurement. Eq. (9) is used in the
  2-D bed and checked for self-consistency, and its high-Reynolds-number values
  (Pe_f -> 11, 7 and 5.7) are noted to reproduce the textbook radial Peclet
  number - but no radial dispersion data are on disk.
- >
  Anything about eq. (13), the Sherwood correlation. It is transcribed into the
  CSV because it is on the same pages and is the most-cited thing in the paper,
  and it is never exercised. A page for it would belong in section A3 beside A3.4
  (Wakao & Funazkri), which is the natural comparison, and would need a dataset
  neither page has.
- >
  That the wall-channel or outlet-condition numbers generalise. Both are one
  operating point, stated in full on the page; the paper contains no worked
  reactor example, so nothing there constrains L/d, d_t/d or the Damkohler group.

source_notes:
  pdf_findings: >
    docs/pdf-findings.md has no entry for 1-s2.0-0009250987850662-main.pdf yet.
    One is needed and this is what it should say. The scan is a 1987 Pergamon
    Acrobat Capture job, 11 pages, about 5,500 characters per page, and the text
    layer is USABLE FOR PROSE AND UNUSABLE FOR EQUATIONS. Observed corruptions:
    eq. (1) comes back as "4a;;;+,)(1 -PI?"; eq. (5) as
    "p=O.i7+0.20exp(-24/Re)"; "Peclet" as "P&let" throughout; the running head
    volume line split across five lines and mis-ordered; "Miller and King" as
    "Miller and Ring" in the Figure 1 caption; Table 1's row label SA201 as
    "SA20 1". Every constant used on the page was read off a 600 dpi render.
  papers_on_disk: >
    DEFECT TO FIX, found 2026-08-05: docs/papers-on-disk.yaml now carries the key
    `A2.6:` TWICE - line 43 mapping it to 1-s2.0-025527019380020H-main.pdf (the
    1993 note) and line 105 mapping it to 1-s2.0-0009250987850662-main.pdf (the
    catalogued 1987 paper). YAML silently keeps the LAST one, so `yaml.safe_load`
    returns the 1987 file and the earlier line is invisible to any tool while
    still being read by humans. The 1987 mapping is the correct one; the 1993
    line should be deleted from the mapping and re-added as a comment or under a
    separate `secondary:` key, because that note IS a legitimate secondary source
    for this case and the page cites it. Not fixed here - docs/ is outside the
    builder's remit.
  printing_errors_in_the_source:
  - >
    The caption of Figure 5 says the solid lines are "eq. (4)". Eq. (4) is the
    probability function for solid cylinders; the figure is radial dispersion in
    beds of SPHERES, so the lines must be eqs (9) and (10), as the body text says
    two sentences earlier. Recorded in the dataset sidecar, not repaired.
  - >
    The tortuosity for spheres is 1.4 in eq. (3) and 1.2 in eq. (10) - the same
    physical quantity in the same beds, 17 % apart, described by the paper only
    as differing "by small amounts". Both are carried as separate CSV rows and
    the page uses each in its own place; using the radial one axially is a
    break-table row.

notes: >
  Built on 2026-08-05 by copying pages/A2.5-edwards-richardson-dispersion/ and
  substituting the physics, as AGENTS.md requires. The break table was rebuilt
  from scratch for the substituted physics - none of A2.5's rows apply, since
  this page has no transient solve, no moment inversion and no two-zone model.

  The cross-page rule was followed in both directions. A2.5's nine findings about
  the 55 borrowed rows are listed in this page's "The data" section with a
  statement of whether each affects it; A2.5's published headline of 11.75 % is
  RECOMPUTED from the same file rather than quoted, and reproduces to 1e-05; and
  the two numbers this page states that also live in A2.5's data - the Peclet
  maximum and the effect of including the one nearly-resolvable fused glyph - are
  printed beside A2.5's own values.

  NO figure was digitised for this page and none should be. There is no
  maintainer available for a figure review, and the one figure-derived dataset
  this page needs already exists, audited, on a published page.
