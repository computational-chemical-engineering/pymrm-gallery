notes: >-
  BUILT AND READY. Nine sections, build_page.py + index.ipynb executed (30 s),
  meta.yaml, README.md, models_entry.yaml, agreement.json, one CSV with sidecar.
  Nothing moved into pages/. A3.3 does not exist in models.yaml yet, so the
  models_entry.yaml block appends rather than upgrading.

  WHAT THE PAPER IS. Pure theory. No figures, no tables, no measurements, and
  Danckwerts says so explicitly. Validation is therefore tier 3 on the builder
  brief's ladder (stated numerical results in the text) plus exact solutions -
  and no figure needed digitising, so no maintainer review is required and the
  case never stalled.

  TWO TRANSCRIPTION TRAPS, both confirmed at 600 dpi and both now break-table
  rows. (1) The falling-film example's D is printed 1e-5 and the PDF text layer
  renders it "10-3"; the worked L only comes out at the printed 0.05 with 1e-5.
  (2) The depth-of-penetration fraction is a stacked "1/100" that the text layer
  drops entirely; it is confirmed independently because 2*erfcinv(0.01) = 3.6428
  is the 3.6 printed in the same sentence, where 1/10 would give 2.326.

  ONE PRINTED DEFECT FOUND AND REPORTED (not repaired): eq. 25's exponent is
  printed kG^2 theta / HD where eq. 29, which it cites, and the erfc argument in
  the same equation both require H^2. Proved from the paper's own eq. 9 - with
  H^2 the eq. 25 integral collapses onto eq. 9 to 3.1e-13, with the printed HD it
  diverges.

  THREE OF THE PAPER'S OWN NUMBERS ARE LOOSE and the page reports rather than
  reconciles them: "about 6 mm" against 6.83 computed from his own 3.6 (+14 %),
  "about 2 mm" against 2.141 (+7 %), and "c0'/c* > 50" where eq. 36's exact
  threshold is 53.01 - at exactly 50 his own criterion is not met (0.94186
  against the 0.95 it demands).

  WHAT THE PAGE CANNOT CONCLUDE, stated as its main negative result: the sqrt(D)
  exponent is the theory's only discriminating claim and this paper contains
  nothing that could test it. s ~ 5 s^-1 is obtained by INVERTING k_L = sqrt(Ds)
  from handbook coefficients that are not printed here; film theory fits the same
  datum exactly as well by inverting k_L = D/x_L (7.07e-3 cm/s and 14.1 um
  respectively), one free constant each, zero residual each.

  SCOPE NOTE FOR THE INTEGRATOR - THE THREE-WAY COMPARISON IS DELIBERATELY NOT
  CLAIMED. A3.1 (Whitman) was being built concurrently and A3.2 (Higbie) is
  needs-paper. This page uses eq. 1 only as Danckwerts prints it, and describes
  his "nonrandom packing" case - which reduces algebraically to a fixed contact
  time - WITHOUT attaching Higbie's name, because the 1951 paper cites Higbie
  only for evidence on interfacial resistance and never for penetration theory.
  The page says in Reuse that the three-way comparison belongs on whichever of
  A3.1/A3.2/A3.3 is built last, with all three sources in hand. If A3.1 has
  claimed it, nothing here conflicts; if neither has, it is still open.

  METRICS BELOW CI's FLOOR. Four metrics are algebraic identities under
  check_agreement.py's ABS_FLOOR = 1e-12 and are therefore NOT compared by CI:
  eq25_collapse_to_eq9 (3.1e-13), eq36_closed_vs_quadrature (2.2e-16),
  eq17_from_eq15_16 (6.2e-15) and eq13_vs_eq12 (exactly 0). Each has a companion
  metric above the floor that carries its break row - eq25_printed_growth_rate,
  the eq. 31 break row, and eq17_swapped_erf_dev. Do not treat the four as
  protected.

  ONE DEFECT-INJECTION TEST WAS INITIALLY POWERLESS and the page records it:
  swapping erf and erfc in eq. 16 moves nothing at c0'/c* = 1, because the
  equation is symmetric in the two there. Re-run at c0'/c* = 3 it moves 67 %.
