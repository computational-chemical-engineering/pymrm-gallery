e1_1_test: PASSED. 11.7.1 the effective transport concept; 11.7.2 continuity and energy equations;
  11.7.3 design/simulation of a fixed bed reactor for catalytic hydrocarbon oxidation; 11.7.4 an equivalent
  one-dimensional model - which is itself a testable reduction claim; 11.7.5 a two-dimensional model
  accounting for radial variations in the bed structure; 11.7.6 two-dimensional cell models. papers-requested.yaml
  called D1.5 the one genuine gap in the gallery among D1.1-D1.5, because the only published S6 page
  (A2.3, Taylor-Aris) has no reaction and no wall heat transfer.
