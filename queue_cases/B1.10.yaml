what_it_carries: >
  An extension of the Mason-Evans / King-Gunn dusty-gas flux equations to WIDE
  PORE SIZE DISTRIBUTIONS, on a cross-linked pore network with dead-end pores,
  plus a surface-diffusion term. The detailed model (their eq. 10) is reduced to
  three practical forms (eqs. 13-15), and the paper's own headline result is that
  "the use of TWO LUMPED PORE RADII gives good agreement with experiments on a
  wide variety of solids", with the optimal lumped radii estimable from measured
  pore-size distributions.
  Passes the E1.1 test outright.
validation_route: >
  The paper says three simplified forms "are tested" against experiments on a
  wide variety of solids, so a comparison exists; whether the comparison is
  tabulated or plotted has NOT been checked off the renders. The structural
  claim - that two lumped radii suffice - is testable without any of the
  paper's data by solving the full distribution in pymrm and measuring the
  two-radius approximation's error, which is the stronger page and needs no
  maintainer.
notes: >
  P3/T2 - do not dispatch ahead of the T0/P1 work in this drop.
  S9 (Maxwell-Stefan) and directly downstream of A4.3 (dusty gas, PUBLISHED),
  which supplies the Mason-Evans equations this extends, and A4.4
  (Knudsen/Bosanquet, PUBLISHED). Cross-links to B1.9 (Wakao-Smith random pore),
  unblocked in the same drop, which solves the same bidisperse problem by a
  different route - the two together are an obvious comparison page. Decide the
  B1.9/B1.10/B1.13 scope split before dispatching more than one builder.
  Note the Wisconsin lineage: C1.1's monograph (Hougen & Watson) is from the
  same department.
