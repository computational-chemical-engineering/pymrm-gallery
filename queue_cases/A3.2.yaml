e1_1_test: 'PASSED. STATES and ATTRIBUTES in one sentence: "This approach for studying gas absorption
  was apparently first proposed by Higbie. The problem discussed in this section illustrates the ''penetration
  model'' of mass transfer", with the full citation R. Higbie, Trans. AIChE 31, 365-389 (1935) and
  a biographical footnote on Higbie (University of Michigan, du Pont). CARRIES: the absorption-into-a-falling-film
  problem is solved for short contact time t_exp = L/v_max, giving the penetration result, and the
  model is developed further in Chapters 20 (sec. 20.4, deforming interfaces) and 22.'
e1_1_target_pinned: 'PINNED BY THE COORDINATOR 2026-08-09, BEFORE DISPATCH, and deliberately — an
  unpinned target across several books IS what parked C1.5, and this case must not repeat it by
  accident. THE E1.1 TARGET IS BIRD, STEWART & LIGHTFOOT 2002, SECTION 18.5 (book p. ~560), the
  source named in reference_read_from: that is what the model is read from, and the page cites it
  as such. Froment, De Wilde & Bischoff Ch. 6 sec. 6.4 is a CROSS-CHECK ONLY — use it to verify
  constants independently and for the closed-form enhancement factor Higbie''s uniform age gives,
  and cite it for exactly that. It is NOT a second E1.1 target and the page does not adjudicate
  between the two books'' scopes; if they disagree on a constant, that disagreement is a finding to
  report, not a scope question to settle. Levenspiel is excluded (see a_source_that_fails).
  Note the two files differ in kind: BSL is a 300 ppi JBIG2 bilevel scan whose equations are
  destroyed in the text layer (numbers off crops), Froment is born-digital at 200 ppi with a clean
  layer including equation numbers.'
second_source_on_disk: 'Froment, De Wilde & Bischoff 3rd edn ALSO passes, from the other direction:
  their Ch. 6 sec. 6.4 "Surface Renewal Theory" treats Higbie''s [1935] penetration theory as the
  special case of a uniform surface age, derives the average absorption rate for it, and prints the
  resulting ENHANCEMENT FACTOR in closed form. Building the page against both is cheap and gives an
  independent check of every constant.'
a_source_that_fails: LEVENSPIEL FAILS E1.1 HERE and it is worth recording why. He mentions Higbie
  only in passing - "Alternatives to the film theory are also in use. These models [Higbie (1935);
  Danckwerts (1950, 1955)] view that the liquid at the interface is continually washed ..." - with
  the reference in the chapter list. Named and attributed, but not derived and not tested. That is
  the E1.1 failure mode exactly. Do not use him for this case.
why_this_case_matters: >-
  A3.1 (Whitman two-film) and A3.3 (Danckwerts surface renewal) are both PUBLISHED
  and both deliberately decline the three-way comparison. A3.2 completes the film / penetration /
  surface-renewal trio and owns that comparison. A3.3 also established that the sqrt(D) exponent is
  not testable from Danckwerts' own paper - both fits have zero residual by construction - so the
  three-way comparison is where that question actually gets answered.
  CORRECTED 2026-08-09 BY THE BUILD, and the correction went into the dispatch prompt before it was
  caught, so record it here - the last clause is WRONG and the built page does not claim it. The trio
  comparison answers the MAGNITUDE / free-parameter question - on the one measured datum on disk
  (Hammerton & Garner's k_c) penetration is the only falsifiable member and lands 12.0 % low, while
  film and surface renewal fit that same datum with zero residual by construction. It does NOT
  answer the sqrt(D) EXPONENT question: one (k_L, D) pair cannot resolve an exponent, and answering
  it needs at least two diffusivities at the same hydrodynamics, which nothing on disk for this case
  has. The published page states that limit rather than papering over it, and the negative claim is
  backed by a described search of every Chapter 18 problem (18A.1-18D.2).
