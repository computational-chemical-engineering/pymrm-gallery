e1_1_test: 'PASSED. STATES and ATTRIBUTES in one sentence: "This approach for studying gas absorption
  was apparently first proposed by Higbie. The problem discussed in this section illustrates the ''penetration
  model'' of mass transfer", with the full citation R. Higbie, Trans. AIChE 31, 365-389 (1935) and
  a biographical footnote on Higbie (University of Michigan, du Pont). CARRIES: the absorption-into-a-falling-film
  problem is solved for short contact time t_exp = L/v_max, giving the penetration result, and the
  model is developed further in Chapters 20 (sec. 20.4, deforming interfaces) and 22.'
second_source_on_disk: 'Froment, De Wilde & Bischoff 3rd edn ALSO passes, from the other direction:
  their Ch. 6 sec. 6.4 "Surface Renewal Theory" treats Higbie''s [1935] penetration theory as the
  special case of a uniform surface age, derives the average absorption rate for it, and prints the
  resulting ENHANCEMENT FACTOR in closed form. Building the page against both is cheap and gives an
  independent check of every constant.'
a_source_that_fails: LEVENSPIEL FAILS E1.1 HERE and it is worth recording why. He mentions Higbie
  only in passing - "Alternatives to the film theory are also in use. These models [Higbie (1935);
  Danckwerts (1950, 1955)] view that the liquid at the interface is continually washed ..." - with
  the reference in the chapter list. Named and attributed, but not derived and not tested. That is
  the E1.1 failure mode exactly. Do not use him for this case.
why_this_case_matters: A3.1 (Whitman two-film) and A3.3 (Danckwerts surface renewal) are both PUBLISHED
  and both deliberately decline the three-way comparison. A3.2 completes the film / penetration /
  surface-renewal trio and owns that comparison. A3.3 also established that the sqrt(D) exponent is
  not testable from Danckwerts' own paper - both fits have zero residual by construction - so the
  three-way comparison is where that question actually gets answered.
