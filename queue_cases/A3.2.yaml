built: 'BUILT 2026-08-09. Staged complete at queue_cases/A3.2/page/ (build_page.py, index.ipynb
  executed clean in ~40 s, meta.yaml, README.md, three data CSVs each with a .meta.yaml sidecar,
  agreement.json with 43 metrics) plus queue_cases/A3.2/models_entry.yaml. models.yaml has NO A3.2
  entry, so that block is an APPEND, not an upgrade in place. Two consecutive executions give
  byte-identical agreement.json and identical cell content, outputs and figure bytes. Nothing was
  written outside queue_cases/A3.2/; no review/ directory and no page image exists anywhere.
  E1.1 target honoured as pinned: the model is read from BSL sec. 18.5, Froment sec. 6.4 is used
  as a cross-check only and the page does not adjudicate between the two books.
  HEADLINES: BSL Problem 18A.4 reproduced to +0.188 % of the printed 0.273 g-mol/hr by Eq. 18.5-18
  and independently to +0.187 % by a pymrm march of Eq. 18.5-11 that touches no error function
  (the two agree to 4.6e-4 %); Problem 18A.7(a) reproduced to +0.220 % BUT FROM EQ. 18.5-19, not
  the Eq. 18.5-20 its own statement instructs, which is low by exactly sqrt(3) - a printed defect
  reported and not repaired; 18A.7(b) to +0.188 %. THE ONE EMPIRICAL TEST: the parameter-free
  penetration prediction is 12.0 % below Hammerton & Garner''s measured k_c (creeping flow, 49.2 %
  below), while the film and surface-renewal pictures fit the same single datum with zero residual
  by construction. SECOND PRINTED DEFECT: Froment Table 6.4.2.1''s penetration column disagrees with
  the closed form printed at its own head at all six gamma (worst 6.4 %) and two of its cells are
  impossible against the printed digits of the other two columns of their rows (0.94 < 1; 10.39 >
  the row''s surface-renewal 10.05). That closed form is re-derived from Froment''s own Eq. 6.4.2-4
  by quadrature to 1.3e-12, which is what makes the table wrong rather than the reading. PYMRM ADDS
  the full Eq. 18.5-7 that BSL sets up and declines to solve, and the decomposition of BSL''s two
  reasons for replacing it: at Lambda = 0.1 the parabolic velocity profile costs 1.92 % and the
  finite film 4.0e-6, a factor 4810, the wall effect being smaller than the solver''s own
  discretisation error and therefore measured against an exact eigenfunction series instead.
  1 % threshold root-found at Lambda* = 0.0564 (penetration depth < 0.475 delta; > 105 um for
  18A.4''s column). NEGATIVE RESULT STATED: the sqrt(D) exponent is still not tested - one (k_L, D)
  pair cannot resolve an exponent - and the search behind that claim is described on the page.
  FOR THE INTEGRATOR: A3.1 and A3.3 both state in prose AND in models.yaml/meta.yaml that "A3.2 has
  no source" and that the three-way comparison is open with nobody to send a reader to. Both
  statements are now stale. This builder did not edit published pages.'
