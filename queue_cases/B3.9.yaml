what_it_carries: >
  A 44-page critical review of pyrolysis modelling with the structure the case
  needs, from its own contents: §2 chemical kinetics (one- and multi-component
  primary mechanisms, secondary tar cracking and polymerisation, distributed
  activation energy models, multi-step cellulose mechanisms), §3 transport models
  at particle and reactor scale (volumetric decomposition rates, intraparticle
  transport, external heat transfer coefficients, unreacted-core-shrinking
  models, simulation results). The competing-reaction schemes the case is about
  are §2.2-2.4.
  APPLY THE E1.1 TEST BEFORE BUILDING: a review that merely CONTAINS the
  Broido-Shafizadeh scheme cannot source a page ABOUT it - that is exactly why
  E1.1 was parked. What is needed is that Di Blasi NAMES the scheme, attributes
  it, and prints its rate constants. The review is critical rather than
  cataloguing and almost certainly does, but CHECK IT AND WRITE DOWN WHERE
  before dispatching. This is cheap: the text layer is clean and greppable.
validation_route: >
  A review of this kind normally prints a COMPILATION TABLE of kinetic
  parameters from many studies, which is both the validation target and the
  gallery's best angle: solve every published parameter set on one problem and
  show the spread. That is the "one page, many correlations, one dataset"
  pattern A1.1 and A1.8 use. Confirm the table exists before promising it - it
  is a grep away.
notes: >
  T1/P1 and no maintainer needed if the parameter tables are there. The clean
  text layer makes this the cheapest extraction in the drop.
  Cross-links: B3.7 (Kobayashi two-competing-rate devolatilisation) was unblocked
  in the same drop and is the coal analogue of the same two-reaction idea;
  B3.8's three files are the network-pyrolysis alternative. The three together
  are a coherent pyrolysis cluster - decide the scope split before dispatching.
