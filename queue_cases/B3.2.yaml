    Mediocre. 1970 Pergamon scan; word-splitting and symbol damage throughout
    ("Abstract-Gas-solid", "al rractian at the phase boundary"). Every parameter
    and every conversion-time value must come off a cropped image - the same
    discipline B3.1 (published) needed, where the shrinking-core equations had
