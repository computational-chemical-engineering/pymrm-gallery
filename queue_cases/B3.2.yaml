  render_at: 300 dpi. CCITT-G4 bilevel at 300 x 300 ppi native.
what_it_carries: >
  The grain model as its authors state it, and the reason it exists: the
  shrinking-core model puts structural parameters into an EMPIRICAL rate
  constant, whereas here "the progress of the reaction [is described] in terms of
  the porosity, grain size, gas phase and solid state diffusivities and a
  heterogeneous reaction rate constant, WHICH IS NOW INDEPENDENT OF STRUCTURE."
  Passes the E1.1 test outright.
  Note the authors' own honesty caveat, which the page must carry: "By taking
  'reasonable values' for these parameters the model was found to reproduce the
  GENERAL TRENDS exhibited by the experimental data of other investigators."
  That is a trend claim, not a fit - do not present it as a validated prediction.
validation_route: >
  Structural, plus the published B3.1 as an independent reference. B3.1
  (Yagi-Kunii shrinking core) is live in the gallery and validated to 6.9e-16
  against an independent derivation, and the grain model must REDUCE to it in
  the appropriate limit - that is a check the source pays for and that cannot be
  satisfied by accident. Build that limit first.
  The paper's own comparisons are against other investigators' data reproduced
  as figures; treat any overlay as needing the review gate, for which no
  maintainer is available as of 2026-08-05.
notes: >
  Natural triptych with the published B3.1 and with B3.4 (Sohn's law of additive
  reaction times), whose source arrived in the same drop and which is explicitly
  a closed-form bridge between the shrinking-core and grain pictures. Sohn's
  paper cites Szekely & Evans. Build B3.2 and B3.4 in that order and have B3.4
  import both.
