  validation_summary: >
    Two independent routes to the model: the paper's formulation marched with
    pymrm (construct_grad/div nu=0, NumJac((n,2)) + newton, complementarity
    clamp for Eq. 21's 0 <= R'), and an exact closed form E.P./ell =
    sqrt(6 X(theta)) derived on the page from Eqs. 21+27 via an exposure
    transformation. Agreement 3.4e-5 / 4.3e-5 (g = 0.5 / 5) over the whole
    history; both axes refined at observed orders 2.00 / 2.02 INCLUDING
    grain-exhaustion events; the simulated surface-grain history converges
    (order ~1.9) onto B3.1's independently published eq. 6 with omega = g/6,
    which is the reduction the case YAML asked to be built first. Temporal
    mass balance 1.0e-6 at order 2.00 (catches Eq.21-vs-Eq.27 transcription
    inconsistency, demonstrated); dimensional closure on the printed Fig. 7
    constants 2.3e-4 (this check fired during the build: a 6-ell domain
    returned 48%). Break table recomputes the four transient-route metrics under every one of six
    defects; no-move cells labelled as blindness findings. Structural items
    labelled: spatial flux telescoping (4.6e-15) and the G-vs-eq.6 algebraic
    identity (4.4e-13, below ABS_FLOOR).
  results_added: >
    Diffuse-zone width is a travelling constant w(g)*ell = 0.295 cm for the
    printed Fig. 7 base case, from printed constants only (no C0 exists in the
    paper); lag Delta = 1/4 + g/30; 5% limit-departure window spans 3x in
    theta at g = 0.125 and >4 orders of magnitude at g = 500.
