what_it_carries: >
  The three-reaction LHHW model (CO hydrogenation, CO2 hydrogenation, water-gas
  shift) that is the field standard for low-pressure methanol synthesis, fitted
  to spinning-basket data, with model discrimination among candidate mechanisms
  and the resulting rate and adsorption constants tabulated. This is the direct
  counterpart of C2.1 (Xu & Froment for SMR) and should be built in the same
  shape: rate law, printed constants, parity against the paper's own runs.
validation_route: >
  PRINTED TABLES (rate and adsorption constants; the model-discrimination
  tables). Confirm the exact table inventory off the renders before promising a
  parity plot - whether the raw run-by-run rates are printed or only plotted has
  NOT been checked and decides whether a maintainer is needed.
notes: >
  SHARED FILE with D3.3 (methanol synthesis reactor). Build C2.4 first; D3.3
  imports the kinetics.
  DO NOT CONFUSE WITH C2.5. C2.5 is Vanden Bussche & Froment, J. Catal. 161:1
  (1996), the CO2-based alternative, and it is NOT on disk - see the trap note
  on queue_cases/C2.5.yaml. The Vanden Bussche & Froment paper that IS on disk
  uses THESE (Graaf's) kinetics, so it is evidence for C2.4 and D3.3, not for
  C2.5. The C2.4-vs-C2.5 comparison page the catalogue asks for cannot be built
  yet.
