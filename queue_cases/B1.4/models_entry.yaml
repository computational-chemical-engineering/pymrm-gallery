  - id: B1.4
    slug: weisz-prater-criterion
    title: "The Weisz-Prater criterion: what an observed rate can tell you"
    description: >
      The inverse pellet problem: one inequality in measurable quantities alone
      decides whether a rate is kinetics or transport. What its threshold
      actually guarantees, computed exactly for five kinetics and three shapes;
      a false-negative map of the isothermal form against Weisz and Hicks'
      non-isothermal extension; and the corner of the authors' own parameter
      range where their claim that the observable removes the multiplicity
      stops holding.
    section: B
    status: in-progress        # integrator flips to published on merge
    page: pages/B1.4-weisz-prater-criterion/
    tier: T0
    priority: P1
    structures: [S3]
    phases: [gas-solid]
    reference:
      authors: ["Weisz, P. B.", "Prater, C. D."]
      year: 1954
      container: "Advances in Catalysis 6, 143. Academic Press, New York"
      doi: null
    reference_read_from:
      authors: ["Weisz, P. B.", "Hicks, J. S."]
      year: 1962
      container: "Chemical Engineering Science 17(4) 265-275"
      doi: 10.1016/0009-2509(62)85005-2
      note: >
        Prints the criterion as its eq. (1), names its purpose, gives the
        observable group as eq. (11), extends it to the exothermic case as
        eq. (10a), and devotes Section V to the observable formulation. Every
        equation verified on 600 dpi renders of journal pages 265, 267, 268,
        269, 272 and 273, and the reference list on page 274. Weisz and Hicks
        attribute eq. (1) itself to their reference [9] (Weisz, Z. Phys. Chem.
        1957 11 1) rather than to [5] (Weisz and Prater 1954); both are
        recorded on the page and neither was consulted. Reference [5] is
        printed without a chapter title, so the page supplies none.
    predicts:
      - observable Weisz modulus
      - effectiveness factor admitted at the criterion threshold
      - false negatives of the isothermal criterion for exothermic pellets
      - onset of steady-state multiplicity in the observable
      - apparent activation energy
    pymrm_api: [construct_grad, construct_div, NumJac, newton, clip_approach]
    data: {tier: 6, method: analytical, status: complete}
    related: [B1.1, B1.5, B1.6, B1.7, B1.3, B1.2, D1.4, J4.7]
