notes: >-
  BUILT VIA THE REPRINT ROUTE, and it passed both AGENTS.md tests: the 1962
  printing does not merely contain the result, it IS the result, reprinted
  verbatim and attributed in its own header; and no existing page examines it
  (A3.3 Danckwerts, staged in the same batch, explicitly scopes Whitman out).

  The extraction lesson worth carrying: THE EQUILIBRIUM CURVE DID NOT NEED
  DIGITISING. Whitman's subscript convention makes (c1, p1) and (c3, p3)
  equilibrium pairs, so Table 1's own columns print four equilibrium points
  spanning 2.88 decades of pressure - enough to reconstruct the straight
  semi-log line his Fig. 3 plots, with two degrees of freedom left over as a
  transcription check (worst residual 0.383 % in p). No figure was digitised, so
  no review gate was needed and the case never stalled. Look for this whenever a
  paper's table defines a quantity as "the value in equilibrium with" something
  else.

  The page's headline is a power analysis, not an agreement: Whitman's one
  held-out prediction is 99.4 % gas-film controlled, so deleting the liquid film
  entirely moves it 0.6 % and moves it CLOSER to the measurement, and removing
  run 1 from the fit leaves k_c unbounded above. The single degree of freedom
  the three runs offer (the run3/run2 rate ratio) is off by 0.934 % against a
  printed precision of 0.29 %, and the page reports that against itself.
