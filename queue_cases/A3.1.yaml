  note: >-
    THE TEXT ACTUALLY READ. A VERBATIM reprint of the 1923 article, published as
    item 5 of "Pioneer papers in convective mass transfer", with the origin
    stated in its own header ("W. G. WHITMAN: The two-film theory of gas
    absorption, Chemical and Metallurgical Engineering 29, 146-148 (1923).
    Reprinted with permission from Chemical Engineering, Copyright 1923,
    McGraw-Hill Publishing Co."). Every equation (eqs. 1-8), all ten columns of
    Table 1, the whole worked example on reprint page 432 and the printed axis
    tick labels of Figs 2 and 3 were verified on 600 dpi renders (pdftoppm -r
    600) on 2026-08-05. ALL PAGE REFERENCES ON THE PAGE ARE TO THIS PRINTING
    (429-433). The OCR text layer is unusable for numbers: it returns eq. (7) as
    "2,$~=PL~~2Lz", run 3's K_c as "om7" and run 2's c1 as "3:", because the 1962
    typesetting uses a mid-dot decimal separator that the OCR discards.

    The reprint opens with an Editor's Foreword signed "D.B.S." quoting Sherwood
    & Pigford's 1951 preface ("after 28 years the theory itself has never been
    adequately checked experimentally"). That is 1962 editorial commentary, NOT
    Whitman, and the page says so explicitly and never attributes it to him. It
    is quoted because it is the question the page answers with a number.
