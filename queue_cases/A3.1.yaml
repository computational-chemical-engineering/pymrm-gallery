notes: >-
  BUILT VIA THE REPRINT ROUTE, and it passed both AGENTS.md tests: the 1962
  printing does not merely contain the result, it IS the result, reprinted
  verbatim and attributed in its own header; and no existing page examines it
  (A3.3 Danckwerts, staged in the same batch, explicitly scopes Whitman out).

  The extraction lesson worth carrying: THE EQUILIBRIUM CURVE DID NOT NEED
  DIGITISING. Whitman's subscript convention makes (c1, p1) and (c3, p3)
  equilibrium pairs, so Table 1's own columns print four equilibrium points
  spanning 2.88 decades of pressure - enough to reconstruct the straight
  semi-log line his Fig. 3 plots, with two degrees of freedom left over as a
  transcription check (worst residual 0.383 % in p). No figure was digitised, so
  no review gate was needed and the case never stalled. Look for this whenever a
  paper's table defines a quantity as "the value in equilibrium with" something
  else.

  The page's headline is a power analysis, not an agreement: Whitman's one
  held-out prediction is 99.4 % gas-film controlled, so deleting the liquid film
  entirely moves it from -0.558 % to +0.054 % of the observed rate - CLOSER to
  the measurement - and removing run 1 from the fit leaves k_c unbounded above.
  The single degree of freedom the three runs offer (the run3/run2 rate ratio)
  is off by 0.934 % against a printed precision of 0.29 %, where a ONE-parameter
  gas film is off by 0.319 %; the page reports that against itself.

  THE k_c -> INFINITY LIMIT IS TAKEN ANALYTICALLY, as k_p (p1 - f(c3)). An
  earlier draft set k_c = 1e12 and read the rate off the LIQUID side of eq. (4),
  where (c2 - c3) is 2.4e-11 against an ulp(204) of 2.8e-14 - the headline was
  floating-point round-off, it sat above check_agreement.py's ABS_FLOOR so CI
  would have compared it, and one decade more in k_c reversed its sign. The
  fixed value is confirmed by a second, independent route (Richardson
  extrapolation of the finite-k_c root solve, agreeing to 1.3e-12), and the
  notebook prints the conditioning evidence rather than just the answer. Lesson
  for the next case: a break-table row establishes that a metric is SENSITIVE
  and says nothing about whether its baseline is CORRECT - the row guarding this
  one moved it by a factor 484 and passed throughout.
