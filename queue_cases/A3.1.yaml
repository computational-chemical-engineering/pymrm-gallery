notes: 'REPRINT ROUTE — this is the AGENTS.md case, and it is a strong one. IJHMT reprinted
  Whitman verbatim in its series ''Pioneer Papers in Convective Mass Transfer, 5'', with the
  header ''W. G. WHITMAN: The two-film theory of gas absorption, Chemical and Metallurgical
  Engineering 29, 146-148 (1923). Reprinted with permission from Chemical Engineering, Copyright
  1923, McGraw-Hill Publishing Co.'' plus an Editor''s Foreword. The 1923 original is pre-DOI
  and unreachable; this reprint has its own DOI and is reachable with the API key. Cite Whitman
  1923 as `reference` and the 1962 reprint as `reference_read_from`.'
