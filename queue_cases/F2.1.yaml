updated: '2026-08-06'
doi_source: 'REMOVED AS WRONG, 2026-08-06. The file recorded doi 10.1002/aic.690300421 with authors
  Deckwer, Burckhart & Zoll, container "AIChE Journal 30(4) 675-678", title "Turbulent axial dispersion
  coefficients in the liquid in a two-phase bubble column", marked crossref-verified. THAT DOI AND
  THAT TITLE BELONG TO A DIFFERENT AUTHOR: the Wiley download stamp printed on every page of Lehrer1984-turbulent-axial-dispersion-bubble-column-AIChEJ30-654.pdf
  reads doi/10.1002/aic.690300421, and that document is I. H. Lehrer, Monash University, AIChE J.
  30(4) 654-657 (1984). Deckwer, Burckhart & Zoll 1974 is in Chemical Engineering Science, not AIChE
  Journal, and is ten years earlier. So the recorded citation was a chimera - a Deckwer author list
  welded to a Lehrer title, container and DOI - and buying from the DOI bought Lehrer. THIS IS THE
  THIRD TIME: C2.5 (right authors and year, wrong container) and D3.3 (a 1993 DOI on a 1988 paper)
  are the other two. The check that catches it is: verify the CONTAINER and the AUTHOR LIST separately,
  not just the title and the year.'
near_miss_on_disk: '`Lehrer1984-turbulent-axial-dispersion-bubble-column-AIChEJ30-654.pdf` = Lehrer,
  I. H., "Turbulent Axial Dispersion Coefficients in the Liquid in a Two-Phase Bubble Column", AIChE
  J. 30(4) 654-657 (1984), Department of Chemical Engineering, Monash University. Four pages, 300
  ppi CCITT-G4, ~4.7 k chars/page.


  IT IS NOT THIS CASE''S PAPER AND IT IS NOT A REPRINT ROUTE FOR IT ON PRESENT EVIDENCE. Lehrer derives
  HIS OWN E_L model from a bubble-rise/wave-theory argument (Maneri & Mendelson) and uses Deckwer
  et al. (1974) only as DATA to test it against - his Table 2 compares observed and calculated E_L
  "using these data ... of Deckwer et al. (1974)". He does NOT print Deckwer''s correlation. A page
  built from him would be a page about LEHRER''s correlation, not Deckwer''s.'
