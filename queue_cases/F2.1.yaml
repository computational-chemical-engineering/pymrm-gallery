blocker:
  kind: question
  question: 'Two questions, in order, and the second only if the first is answered no.

    (1) Is Lehrer (1984) an acceptable source for this case? He is on disk, he is a genuine turbulent-axial-dispersion-in-a-two-phase-bubble-column
    paper with his own correlation and his own validation against Deckwer''s data, and building from
    him needs nothing further. But the catalogue row says "Deckwer", so the page would be renamed
    in substance. This is a scope call, not a document problem.

    (2) If no: supply Deckwer, W.-D., Burckhart, R. & Zoll, G., "Mixing and Mass Transfer in Tall
    Bubble Columns", CHEMICAL ENGINEERING SCIENCE 29, 2177 (1974). REQUEST IT BY TITLE AND CONTAINER,
    NOT BY DOI - the recorded DOI was wrong and has already bought the wrong paper once.'
  detail: 'This is the A3.5 / B3.6 / C2.5 discipline: a file that looks like the case''s paper is
    on disk, and forcing it would produce a page attributed to the wrong person. Answer the question
    before requesting anything.'
