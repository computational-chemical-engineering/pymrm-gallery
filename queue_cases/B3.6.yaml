near_miss_on_disk: >
  `Smith1982-combustion-rates-coal-chars-review-SympCombust19-1045.pdf` = Smith, I. W., "THE COMBUSTION RATES OF
  COAL CHARS: A REVIEW", Nineteenth Symposium (International) on Combustion, The
  Combustion Institute (1982) 1045-1065, CSIRO Division of Fossil Fuels, North
  Ryde NSW. 21 pp, complete. Identified by reading its own first page: the
  symposium running head, the display title, the by-line and affiliation, and the
  abstract.
  What its abstract promises: "Means of calculating reaction rates are shown
  which account for temperatures of particles, mass transfer and diffusion of
  oxygen into the particle's pore structure, and reaction on the pore walls ...
  Experimental data are shown for observed reactivities of coal chars corrected
  for external mass transfer effects, and INTRINSIC REACTIVITIES ARE REPORTED for
  various coal chars and other carbons corrected for pore diffusion effects.
  Measured data on mass-transfer rates and changes in particle structure during
  combustion are given."
  That is a strong reprint-route candidate AND a possible experimental-validation
  source - which is why the question above is worth answering properly rather
  than guessing.
  TEXT LAYER: the worst in the 2026-08-05 third drop. Page 3 extracts 37
  characters; the file mixes a 200 ppi image with 300 ppi CCITT-G4 pages. Any
  check must be done on renders, not on grep.
