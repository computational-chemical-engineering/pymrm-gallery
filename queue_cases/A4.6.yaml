what_it_carries: >
  Checked section by section against what the case is FOR, because a monograph
  that merely mentions a topic does not source a page about it (the E1.1 test).

    * The formula itself. Section 14.2 quotes the first approximation [D12]1 for
      five molecular models, of which (14.2, 4) is the 12,6 and exp;6 form - the
      Chapman-Enskog binary diffusivity. Section 14.21 gives the second
      approximation [D12]2 with the A, B, C, E coefficients and Kihara's
      simplification. Section 9.81 derives them.
    * The collision integrals, AS A PRINTED TABLE. Table 6 (book p. 185) gives
      W12(1)(1), (1/3)W12(2)(2), A, B and C for the 12,6 model at SIXTEEN values
      of kT/eps_12 running 0.3, 0.5, 0.7, 1.0, 1.3, 1.6, 2.0, 2.5, 3.0, 4.0,
      5.0, 7.0, 10.0, 20.0, 50.0, 100.0 - counted off a 300 dpi render, twice.
      (The OCR gives the last row as "1000" because the mid-dot decimal
      separator vanishes; it is 100.0. A first pass through this file recorded
      "fifteen values to 1000" for exactly that reason. Do not take the range
      from the text layer.) This is the piece that decides the case:
      the numbers are tabulated, not only plotted, so no figure digitisation is
      needed. (Fig. 8 on the same page plots the same quantities for the 12,6
      and exp;6 models - ignore it, use the table.)
    * The force constants. Table 17, "Values of eps/k, sigma and r_m for the
      12,6 model", and Table 18 for the exp;6 model.
    * The validation data, ALSO AS A PRINTED TABLE. Table 22 (book p. 263),
      "Coefficients of diffusion at S.T.P.", gives measured D12 for roughly
      forty-five gas pairs, each with its literature reference, together with
      the effective sigma_12 derived from it and the viscosity-derived
      (1/2)(sigma_1 + sigma_2) for comparison. Table 23 gives the variation of
      D12 with temperature; Tables 24 and 25 give self-diffusion coefficients.
    * The book's own caveat, which the page must repeat: section 14.2 opens
      "Observations of the mutual diffusion of pairs of gases are difficult to
      make, and such observations as have been made are liable to a fairly large
      experimental error", and section 14.32 says the quoted D12 "may, in
      unfavourable cases, be in error by several per cent."

  Verdict: the book carries the result the case is for, with a printed-table
  validation route. A4.6 is buildable without a maintainer.

does_not_carry: >
  Do not let this book close cases it does not serve.
    * A4.1 (Wilke mixture rule) - NOT here. The only Wilke in the book is
      Buddenberg & Wilke (1949) for the VISCOSITY of a mixture, cited once in
      section 12.43, and the name index has a single entry (p. 244). Wilke's
      1950 diffusion mixture rule is not stated, named or attributed anywhere.
      Straight E1.1 failure; A4.1 stays needs-paper.
    * A4.3 (dusty gas) and A4.4 (Knudsen / Bosanquet) - no pore transport of any
      kind. Both are already published anyway.
    * A4.5 (Fuller-Schettler-Giddings, 1966) - postdates the third edition's
      cut-off and is not discussed.
    * A4.2 (Maxwell-Stefan) - the multicomponent diffusion coefficients are in
      Chapter 18, but A4.2 is already published from Krishna & Wesselingh 1997.

validation_route: >
  printed tables, no figure anywhere. Table 22 gives FIFTY measured D12 (not the
  ~45 first estimated), of which 39 are usable because Table 17 has no 12,6
  constants for NH3, C2H4 or C2H6. Table 6 has SIXTEEN rows, running to 100.0.

built:
  page: queue_cases/A4.6/page/
  models_entry: queue_cases/A4.6/models_entry.yaml
  slug: chapman-enskog
  runtime_seconds: 205
  headline: >
    Chapman-Enskog first approximation vs the 39 usable measured pairs: mean
    absolute deviation 3.65 %, bias -2.74 %, worst -10.06 % (N2-CO2), 29/39
    inside 5 %. Null model (collision integral deleted, Table 11 diameters):
    17.24 %. The SAME theory with the book's own virial-derived force constants:
    10.23 % against 4.13 % for the viscosity-fitted ones on the same 27 pairs -
    so the headline is a joint statement about the theory and about which
    property its parameters were fitted to, and the page says so.
  out_of_sample: >
    YES with respect to the diffusion data. Table 17's eps/k and sigma are
    fitted to pure-gas VISCOSITY (book p. 235, explicit), the combination rules
    are assumptions from section 12.41, and Table 6 is a numerical integration
    fitted to nothing. Table 23's constants ARE derived from D12(T) and are
    deliberately NOT used - that is the circularity trap, one table away.
  corrections_to_the_source_map: >
    Two, both from cropped native-resolution reads.
      * Table 22 has FIFTY rows, not "roughly forty-five".
      * Table 6's third column is (1/2) W^(2)_12(2), NOT (1/3). The fraction
        glyph is destroyed in the scan and cannot be read at any magnification;
        it was established twice from printed material - eq. (9.8, 7) with the
        rigid-sphere normalisation of eq. (10.2, 1) (2.9e-4 against 1/2, 0.50
        against 1/3), and an independent quadrature of the 12,6 potential
        (0.30 % against 1/2, 34 % against 1/3). It changes no diffusivity, since
        only W^(1)(1) enters [D12]_1.
  also_read_and_used: >
    Table 11 (book p. 228) was NOT in the source map's list and is needed: it is
    the only place in the book that prints MOLECULAR WEIGHTS (so no external
    periodic table is required), it supplies the pure-gas viscosities that
    eq. (14.21, 3) needs for the second approximation, and section 14.32 states
    that Table 22's last column is built from ITS sigma, not Table 17's.
  a41_confirmed_negative: >
    Re-checked while building. The book's only Wilke is Buddenberg & Wilke
    (1949) on the viscosity of a mixture, section 12.43. A4.1 stays needs-paper;
    nothing on the A4.6 page sources it.
