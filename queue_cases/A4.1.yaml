wrong_wilke_history: 'THIS IS THE THIRD WILKE FILE TO ARRIVE AND THE FIRST CORRECT ONE. The other
  two, both still on disk: MISC-Wilke1955-binary-diffusion-coefficient-estimation-IEC47-1253.pdf (Wilke
  & Lee 1955, a critical review of binary-diffusivity ESTIMATION methods plus a new correlation -
  a different paper, journal, year and equation), and the Buddenberg-Wilke VISCOSITY mixture rule,
  which is what Chapman & Cowling and Bird/Stewart/Lightfoot actually carry when they cite "Wilke".
  Do not let either be mistaken for this again. NOTE the Buddenberg-Wilke viscosity rule is ALSO in
  this paper, as eqs. (39)-(43) and Table 2; the built page scopes it out explicitly as a different
  catalogue case, so a future agent looking for it now knows where it is.'
what_it_carries: 'Confirmed and used. The printed abstract states the rule in full. Beyond that the
  paper carries the material the page is actually built on: eqs. (1)-(38); TABLE 1 (journal p. 99,
  printed rotated 90 degrees) with eight ternary test examples solved three ways - Method 1 (the rule
  at the arithmetic-mean composition), Method 2 (the same rule at a flux-weighted effective film composition)
  and Method 3 (the EXACT Stefan-Maxwell solution, eqs. 21-24), which is the failure test; a nine-step
  SAMPLE CALCULATION with every intermediate printed (Example VI by Method 2, journal p. 101); the
  Example-VI film-pressure-factor paragraph (288 / 75 / 72.5 / 147.5 / 215.5 mm, p. 99); the Example-IV
  diffusivity averages 2.15 and 2.22 sq.cm./sec. beside Figure 3; the accuracy claim "a maximum derivation [sic]
  of less than 10%" for Method 2 (p. 100 - the paper really does print DERIVATION); and a signed DISCUSSION in which J. H. Arnold names the
  weighted-arithmetic-mean alternative attributed to Hougen and Watson - which the page uses as its
  null baseline.'
independent_second_witness: 'Taylor & Krishna (1993) confirmed on 600 dpi renders. Sec. 6.1.3 (printed
  p. 126) prints eq. (6.1.14) with "(Wilke, 1950)" inline and states the condition. CORRECTION TO docs/papers-inventory.yaml:
  the pedigree sentence ("pioneered by Hougen and Watson (1947) and by Wilke (1950)") is in section
  8.6 on printed p. 204, NOT 8.7; the exact/linearized comparisons are sec. 8.5.5 (p. 203) and sub-section
  8.6.1 (p. 208). Example 8.5.1 "Evaporation into Two Inert Gases" (pp. 201-203) is the Fairbanks &
  Wilke problem and is reproduced in full on the page - five printed intermediates to 9.8e-5. It also
  carries a printed slip: p. 203 says "so y_1delta = 0.0" where the problem statement means y_10.'
built:
  by: builder agent, 2026-08-07
  staged_at: queue_cases/A4.1/page/
  runtime_seconds: 22
  headline: 'Wilke''s rule against the exact solution of his own eight problems: 86.6 % worst case,
    21.6 % median. The failure is NOT the harmonic average - the weighted arithmetic mean Arnold
    attributes to Hougen and Watson moves the median by 0.6 points (21.6 -> 22.2 %) while making the
    worst case two and a half times worse (212.7 %) - it is the COMPOSITION the rule is frozen at: Wilke''s own Method 2 keeps
    the harmonic mean, moves the composition, and takes the worst case to 12.1 %.'
  printed_defects: 'Three, all proved from the paper''s own numbers and all reported rather than repaired:
    Method-1 N_B of Examples I and II printed without their minus signs (magnitudes agree to 0.06 %);
    Method-1 N_A of Example VI (-0.104), which implies a film pressure factor of 380 mm against the
    288 mm the paper''s own p. 99 text states for exactly that quantity, while the recomputation gives
    287.4 mm; and eq. (22)''s first bracket, whose printed 1/D_AC must be 1/D_BC or (21)+(22) do not
    integrate to the paper''s own eq. (23) - shown symbolically. Two further cells are left unrepaired
    because the constraint does not decide them: Example I''s third Method-3 set and Example III''s
    Method-3 pair.'
