updated: '2026-08-06'
wrong_wilke_history: 'THIS IS THE THIRD WILKE FILE TO ARRIVE AND THE FIRST CORRECT ONE. The other
  two, both still on disk: MISC-Wilke1955-binary-diffusion-coefficient-estimation-IEC47-1253.pdf (Wilke
  & Lee 1955, a critical review of binary-diffusivity ESTIMATION methods plus a new correlation -
  a different paper, journal, year and equation), and the Buddenberg-Wilke VISCOSITY mixture rule,
  which is what Chapman & Cowling and Bird/Stewart/Lightfoot actually carry when they cite "Wilke".
  Do not let either be mistaken for this again.'
what_it_carries: 'The printed abstract states the result in full: from the Stefan-Maxwell diffusion
  equations, the effective diffusion coefficient of a gas with respect to a multicomponent mixture
  of STAGNANT gases is D''_A = (1 - y_A) / (y_B/D_AB + y_C/D_AC + y_D/D_AD + ...), with "application
  of this relation ... studied by comparison with exact solutions of the diffusion equations for various
  types of diffusion". Ten pages ending in a 30-entry Literature Cited, consistent with 95-104.'
independent_second_witness: Taylor & Krishna (1993), now also on disk, print this rule as their eq.
  (6.1.14) in section 6.1.3 "Limiting Cases" with "(Wilke, 1950)" INLINE, record in section 8.7 that
  the effective-diffusivity concept was "pioneered by Hougen and Watson (1947) and by Wilke (1950)",
  and TEST it in Chapter 8 against the experiments of Fairbanks and Wilke (1950) and against the exact
  and linearized matrix solutions. That gives this case a ready-made failure test the origin paper
  alone does not - build the page against both.
