notes: |
  SCOPE — read before building. The case title names three drag laws; this
  report carries only one of them in full.

  * Syamlal-O'Brien: section 2.2.1 gives it complete — the terminal-velocity-to-
    drag conversion attributed to Syamlal & O'Brien (1987) as eq. (11), the
    Garside & Al-Dibouni (1977) closed form for V_rm as eq. (12) with A and B in
    eqs (13) and (14), and the Dalla Valle (1948) single-sphere C_D. This report,
    not the 1989 conference paper the catalogue cites, is the citable published
    source for the correlation as it is actually implemented.
  * Wen-Yu: NOT in this report. The strings "Wen and Yu" and "Wen & Yu" do not
    occur anywhere in it. Wen & Yu (1966) is already on disk as the A1.6 file.
  * Gidaspow: cited only in passing (Gidaspow 1986, for needing a low-solids-
    fraction correlation). The blended Ergun/Wen-Yu form of Gidaspow (1994) is a
    monograph and is not on disk; Ergun (1952) itself is, as the A1.1 file.

  So a page can source Syamlal-O'Brien from this report and Wen-Yu plus Ergun
  from papers already held. The Gidaspow *blend rule* would still need the 1994
  monograph and must not be written from memory.

  TEXT LAYER: poor. pdftotext runs words together ("Fluid-SolidsMomentum") and
  mangles digits ("0.O6Re", "_g-2'6s", "Ergun (f952)"). Read every constant off
  a 600 dpi render — see docs/pdf-findings.md.
