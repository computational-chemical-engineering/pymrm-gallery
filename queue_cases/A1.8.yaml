  headline: |
    At a packed-bed voidage the two closure families agree in BOTH asymptotic
    limits - 19 % viscous, 4 % inertial at eps_g = 0.44 - and disagree by a
    factor 1.73 at Re_m = 4.09, which is a bubbling bed. Agreement in both limits
    is not evidence of agreement. Qualified on the page: on Ergun's own abscissa
    that dip is at Re/(1-eps) = 7.30 and his 244 recovered markers start at 7.45,
    so the worst point is 2.0 % below his data; at eps_g = 0.50 the dip is at
    9.72 and inside it.

    Against Richardson & Zaki's Table VI (18 tabulated indices, nothing fitted)
    the index implied by eq. (12) is +3.2 % at eps_g = 0.45 rising to +29.2 % at
    0.95; in the viscous limit it reduces to 4.14 + 1 = 5.14 against their
    tabulated 4.65, +10.5 %. CONDITIONAL: eq. (11) forces V_rm to be a slip
    ratio, the report's own prose implies the superficial one, and under that
    alternative the same numbers are -26.3 %, -24.2 %, -0.3 % with a viscous
    limit of -11.0 % - the sign reverses. Both are printed and CI-tracked; the
    page adopts the reading eq. (11) implements. Not settleable without Garside &
    Al-Dibouni (1977), which is not on disk.

    Against 8 minimum-fluidisation velocities Geldart measured on spherical
    particles, all three closures overpredict at the derived voidage - Ergun
    +42.1 %, Syamlal-O'Brien +101.2 %, Richardson-Zaki +111.1 %. None is
    validated. The blanket refusal to rank was withdrawn after A1.6's
    +4.8185 % at eps_mf = 0.42 on these same rows was recomputed and put on the
    page: the absolute bias is a statement about a voidage nobody measured, but
    the ordering is stable, and the voidage each closure would need in order to
    be unbiased is 0.4147 (Ergun), 0.3708 (R-Z), 0.3538 (S-O'), the last two
    below random loose packing. Neither closure-to-closure ratio is
    measurement-facing: v_t cancels out of S-O'/R-Z to 2.2e-16, and the
    S-O'/Ergun ratio (0.97-1.68) TURNS OVER on the last cut, so it is not
    monotone in Re.

    The Check-3 break table is swept over six voidages, not one. At eps_g = 0.50
    alone the dilute B exponent 2.65 and the switch voidage 0.85 moved nothing in
    any of the four checks, while the page's own headline at eps_g = 0.95 sits on
    that untested branch. Swept, 7 of 15 mis-readings invisible at 0.50 become
    visible.

    Incidental: eq. (14)'s branch switch at eps_g = 0.85 is continuous to
    0.049 %, so it is a change of functional form and not a step. The
    discontinuous closure the catalogue names is a different one and is not on
    disk.
