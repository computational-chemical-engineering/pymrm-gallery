scope_decision: |
  BUILT, WITH ONE OF THE THREE NAMED CLOSURES AND TWO SUBSTITUTES. The report
  carries Syamlal-O'Brien complete (eqs. 11-16, section 2.2.1) and neither of the
  other two DRAG LAWS - "Wen and Yu"/"Wen & Yu" do not occur in it, and the
  report prints no Gidaspow drag closure and no blend rule. Gidaspow (1986),
  Appl. Mech. Rev. 39, 1-23, is cited exactly once in section 2.2.1, for the
  observation that a packed-bed correlation must be supplemented at low solids
  fraction.

  CORRECTED 2026-08-03: it is NOT true that "Gidaspow appears only in passing".
  Measured on the extracted text layer, the name occurs 28 times (18 body, 10
  reference list) across ten reference entries, four of them Gidaspow-first-
  author (1974 Round Table; Gidaspow & Ettehadieh 1983; Gidaspow et al. 1984;
  Gidaspow 1986), and the report ADOPTS a Ding & Gidaspow (1990) expression as
  its own eq. (88) plus a Syamlal & Gidaspow (1985) conductivity model. The text
  layer mangles names so that count is a floor. Only the absence of a Gidaspow
  DRAG law is load-bearing, and only that is claimed. Nothing about either
  missing closure was written from memory.

  The page instead builds the pair the report's OWN paragraph on journal page 10
  names as the two kinds of data a drag law can come from - the packed-bed route
  (Ergun 1952, via the published A1.1) and the terminal-velocity route
  (Syamlal-O'Brien, plus Richardson & Zaki 1954, whose paper is on disk as the
  A1.5 file and whose correlation the report explicitly says eq. (12) is a
  closed-form substitute for). So it IS a three-way closure comparison, just not
  the three the catalogue names, and every leg is sourced from a document on
  disk.

  Reading the report's own reference list turned up something the catalogue does
  not know: the origin of eq. (11) is Syamlal & O'Brien (1987), "A Generalized
  Drag Correlation for Multiparticle Systems", UNPUBLISHED REPORT. There is no
  origin paper to acquire. This DOE report is the citable published source, and
  the catalogue's "Syamlal & O'Brien (1989)" is a different item in the same list
  (a bubble-simulation paper, AIChE Symp. Ser. No. 270, 85, 22-31).

