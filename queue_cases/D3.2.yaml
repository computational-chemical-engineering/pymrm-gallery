scope: >
  READ THIS BEFORE DISPATCHING. The document supplies the RATE EXPRESSION and
  the pellet effectiveness-factor correction, plus an equilibrium treatment, a
  conversion-temperature plane at 50 atm and a comparison against the reported
  exit conversions of Nielsen's experimental converter. It does NOT contain a
  multi-bed quench or intercooled converter design with bed depths, quench
  fractions and inlet temperatures - which is what D3.2's title names.
  So D3.2 is buildable as "the Dyson-Simon rate law driving a multi-bed adiabatic
  converter", with the bed configuration stated as a chosen illustrative case
  rather than reproduced from a source, and that limitation named on the page.
  This is the A1.8 / A3.13 situation again: build what the document carries, say
  which named component is missing, and name what would complete it (a converter
  design paper - Nielsen's, which Dyson & Simon cite and which is NOT on disk).
validation_route: >
  PRINTED TABLE (Table I, constants for Equation 39) plus the paper's own
  equilibrium and rate arithmetic. The Nielsen exit-conversion comparison is a
  FIGURE; a page can stand without it. No maintainer needed for the printed part.
notes: >
  SHARED FILE with C2.3. Build C2.3 (the rate law) first and have D3.2 import
  it. Do not dispatch two builders onto one transcription of Table I.
