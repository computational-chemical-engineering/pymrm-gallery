status: complete

source:
  authors: ["Henze, M.", "Grady, C. P. L. Jr", "Gujer, W.", "Marais, G. v. R.", "Matsuo, T."]
  year: 1987
  container: "Water Research 21(5) 505-515"
  doi: 10.1016/0043-1354(87)90058-3
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; table image not reproduced)"

acquisition:
  method: table
  figure: "Table 1, column headings (journal pages 506-507) and the vertical definitions printed beneath them"
  tool: "poppler pdftoppm at 600 dpi, read visually"
  operator: "Claude Opus 5 (assisted)"
  date: 2026-07-30
  procedure: >
    The definitions are set vertically under the matrix and the text layer
    returns them as isolated characters, so they were read from the render.
  estimated_error: "not applicable - symbols and text"

columns:
  - {name: i,       unit: "-", description: component index, 1-13}
  - {name: symbol,  unit: "-", description: component symbol as printed}
  - {name: name,    unit: "-", description: component definition as printed under the matrix}
  - {name: units,   unit: "-", description: units as printed, in the paper's M/L/T notation}

notes: >
  The paper's units carry the information the continuity check runs on.  Seven
  components are declared to be in COD units, S_O is declared "Oxygen (negative
  COD)", four are declared "as nitrogen", and alkalinity is declared to be in
  molar units.  Those declarations are what fix the composition vectors used on
  the page; nothing there is invented.

