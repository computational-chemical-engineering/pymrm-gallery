e1_1_test: 'PASSED. STATES: eq. (1.5.2-1), r = r_m C_A/(K_S + C_A). ATTRIBUTES: the text names K_S
  "the Monod- or saturation constant", explains that "in the original Monod equation r is represented
  by mu, r_m by mu_max and C_A by S", and the chapter reference list carries "Monod, J., Annu. Rev.
  Microbiol., 3, 371 (1949)" - the exact citation recorded on this case, so the origin is identified
  rather than implied. CARRIES: it is then coupled to the biomass balance eq. (1.5.2-2) and contrasted
  with the substrate-inhibition form, whose rate exhibits a MAXIMUM where Monod tends to an asymptote
  - a qualitative discriminator a page can demonstrate.'
e1_1_target_pinned: 'PINNED BY THE COORDINATOR 2026-08-13, BEFORE DISPATCH. Three books on disk
  carry this case; it is decided here once, and the page does not adjudicate between them (an
  unpinned target across several books is what parked C1.5).
  THE E1.1 TARGET IS FROMENT, DE WILDE & BISCHOFF 3rd edn, SECTION 1.5.2 (book pp. ~53-55, PDF 69),
  eq. (1.5.2-1). It is chosen because its chapter reference list carries "Monod, J., Annu. Rev.
  Microbiol., 3, 371 (1949)" - the EXACT citation this case catalogues - so the origin is identified
  rather than implied, and because it couples the rate to the biomass balance eq. (1.5.2-2) rather
  than merely printing the form. Note the contrast with J4.6, where Froment cites neither origin.
  RAWLINGS & EKERDT p. 596 IS A MODEL CATALOGUE, NOT A SECOND E1.1 TARGET. It prints Monod beside
  Blackman, Tessier, Moser and Contois, and calls Monod "the simplest form of the Langmuir adsorption
  isotherm". Use it for the competing forms and cite it for exactly that. The comparison against
  those alternatives is the substance of this page: can the data identify Monod against them, or is
  the choice underdetermined? Answer it with numbers.
  LEVENSPIEL Chs. 28-30: use ONLY if his worked example genuinely prints Monod''s own reported data,
  and CHECK IT FIRST - his attribution is to Monod (1958), NOT the 1949 paper this case catalogues.
  If the numbers are real and traceable they are worth having (most gallery pages are tier 6 for want
  of any measurement), but they must be labelled as coming from a different Monod publication that
  is NOT on disk and was NOT consulted, and the page must not imply they are the 1949 paper''s data.
  If they turn out to be illustrative rather than reported, say so and drop them.
  SCOPE BOUNDARY, IMPORTANT: substrate inhibition belongs to J4.2 (Andrews/Haldane), which is a
  SEPARATE case being built in this same batch. Froment contrasts Monod with the inhibition form
  (asymptote vs maximum) and it is tempting to annex that comparison - DO NOT. Mention it in one
  sentence as the neighbouring case and leave the quantitative treatment to J4.2, exactly as A3.1
  and A3.3 left the three-way comparison to A3.2.
  THE ORIGIN IS NOT ON DISK: Monod, Annu. Rev. Microbiol. 3, 371-394 (1949). Use reference_read_from
  and origin_not_consulted, and attribute to Monod nothing beyond what Froment prints about him - the
  A3.2 attribution-drift defect is the failure mode for this kind of page.'
other_sources_on_disk: 'Rawlings & Ekerdt 2nd edn also passes and is complementary: book p. 596 prints
  Monod beside the Blackman, Tessier, Moser and Contois alternatives and beside substrate- and product-inhibition
  forms, notes that Monod is "the simplest form of the Langmuir adsorption isotherm", and closes the
  chemostat balances with it - so it supplies the competing models for free. Levenspiel Chs. 28-30
  also use it, and one worked example uses Monod''s OWN reported data ("see Monod, 1958, p. 74"),
  but note his attribution is to Monod (1958), not the 1949 paper.'
