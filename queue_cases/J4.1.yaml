build_summary: 'READY, FIXED TWICE, 2026-08-14. Nine sections, executed clean, 110 s, deterministic
  (two consecutive fresh executions give byte-identical agreement.json, byte-identical figure
  PNGs and identical output in all 46 blocks; the one wall-clock timing the page used to print
  was removed for that reason). 74 metrics, 79 defect injections all of which move their metric,
  96 prose/metadata assertions plus 10 break-table lookups, plus a mechanical sweep asserting
  every scientific-notation number in the metadata files against the live computation at half
  an ulp of its own printed digits.
  SECOND FIX PASS (six findings, all in the material the first pass added, all of one kind - an
  assertion that did not do what the page said it did). The depth table''s "unconverged" column
  was structurally incapable of being non-zero, because the second start of the two-start fit IS
  the nesting point; it is now counted from the grid start alone and reads 994/131/11/0/0 over
  zoom depths 0/2/4/6/8, a real convergence curve, with the structural zero printed beside it and
  named as such. The mechanical sweep''s window was a RELATIVE 5e-sig, up to ten times looser than
  the half ulp it claimed, and its regex skipped every token that ended a sentence and could not
  read README.md''s x10^-n spelling at all; all three are fixed and the sweep now mutates every
  token it finds and prints its own measured detection rate. Three more proved-exactly-zero
  quantities were still above ABS_FLOOR in agreement.json (Sf_crossing_vs_a_relerr,
  contois_map_mum_relerr, contois_map_KS_relerr): they are now printed and not reported, the rule
  is asserted over the whole enumerated class of 18 such quantities, and the two-significant-figure
  pins that the assertion cell still had on them (a tighter gate than the 5 % CI comparison the
  rule removes) are bounds. The six bootstrap numbers now carry their Monte-Carlo sampling error
  everywhere they are quoted. No reported number changed.
  NINE VERIFICATION FINDINGS APPLIED. The largest: the bootstrap control''s headline was a
  SEARCH-GRID ARTEFACT - each draw was fitted on the scan grid while the observed F it was
  compared against came from a refined fit, which deflated F on every draw and made the control
  look conservative at 2.1 % when a converged refit puts it AT nominal, 4.95 %. Six agreement
  metrics moved (boot_size_forward_truth 0.308 -> 0.3655, boot_size_control_truth 0.021 -> 0.0495,
  boot_median_n_forward_truth 1.603 -> 1.612, boot_median_n_control_truth 0.951 -> 1.009,
  boot_p_of_observed_F 0.184 -> 0.228, boot_p_of_observed_n 0.106 -> 0.129) and three were
  DROPPED as optimiser exit tolerances for quantities the page proves are exactly zero
  (sep_moser, sep_over_scatter_moser, contois_minus_monod_rms). The page''s conclusion is
  unchanged and strengthened. Also: route A''s significance verdict is co-caused by the one
  flagged cell (F = 5.45 with it imputed) and now says so where the reader meets it; the
  two-integrator cross-check''s claimed reach and the S + X/phi invariant are restated as what
  they measurably are; and section 1.5.2 does print numbers (Fig. 1.5.2-1''s caption). E1.1 CONFIRMED BY THE BUILDER: Froment''s Chapter 1
  reference list on book p. 58 prints "Monod, J., Annu. Rev. Microbiol., 3, 371 (1949)." -
  read at digit scale on a 300 ppi crop. Origin NOT consulted; reference_read_from used
  throughout and origin_not_consulted stated in meta.yaml, README.md and the page itself.'
