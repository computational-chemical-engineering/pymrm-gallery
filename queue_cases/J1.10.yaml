inventory_correction: >
  THE PAPER PRINTS FOUR TABLES, NOT TWO. docs/papers-inventory.yaml and this file's earlier
  `upgrade` note both say "both of the paper's tables"; the paper has Table 1 (p. 277, feed
  volume), Table 2 (p. 280, Simpson & Wheaton's ion exclusion, restated), Table 3 (p. 281, plate
  heights derived from Table 2) and Table 4 (p. 286, the gas-liquid plate-height measurement that
  produces the three-term formula). All four are transcribed on the page. The two that carry the
  plate height are 3 and 4, not 1 and 2. Worth propagating to the inventory.
