findings:
  - 'eq. (21) as printed cannot be right: (a+delta)/delta where its own eqs. (24) and (25)
    require (a+delta)/a. Reported, not repaired.'
  - 'eq. (56) set to unity gives d_f/d_p = 1.83e-4 where the text says "about 0 0001". NOT an
    error: the sentence is an order-of-magnitude claim quoted to one significant figure with
    "about", so 1.83e-4 is the same order of magnitude and the conclusion it carries is
    unaffected. Recorded because it is exactly recomputable from printed inputs.'
  - 'The List of Symbols defines u as interstitial; Tables 2-4 and Figs. 11-14 are headed
    superficial. Fig. 9 converts, the gas-liquid section does not appear to. Cannot be closed
    (F_I is not printed for those columns); the band each reading requires is reported instead.'
  - 'The paper''s own "<< 1" conditions fall as 1/z while the skewness they bound falls as
    z^(-1/2), so at the column that produced Table 3 they are 2.4e-3 and the curve is still
    skewed by 0.14.'
