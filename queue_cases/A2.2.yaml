notes: "Absorbed into A2.1 on 2026-08-02, after both papers were read in full. The\ncomplete\
  \ argument, including the steelman for keeping this case separate and\nwhy it fails, is\
  \ in queue_cases/A2.1.yaml under `scope_decision`. In brief:\n\n- Wehner & Wilhelm's eq.\
  \ (20) for the reaction section is algebraically\n  identical to Danckwerts' eq. (33) and\
  \ they say so on p. 91, so the decisive\n  quantitative check for either page is the same\
  \ object. Verified: independent\n  transcriptions of the two papers agree to 1.1e-16.\n\
  - What they add is the DERIVATION of Danckwerts' conditions, which Danckwerts\n  himself\
  \ justified only by \"Intuition suggests...\". A boundary condition and\n  its justification\
  \ are one result.\n- Their three-section model IS built on the A2.1 page, as one pymrm domain\
  \ with\n  piecewise diffusivity: their eqs. (19), (20), (21) and (22) are all\n  reproduced,\
  \ their conclusion that the reaction section is invariant to both\n  end sections is tested\
  \ over five decades of Pe_a and four of Pe_c, and their\n  derivation of df/dz(1) = 0 is\
  \ recovered rather than imposed.\n- Their criticism of Hulburt's solution - \"not consistent\
  \ with the limit of a\n  stirred reactor\" - is turned into a number there too: it is exactly\
  \ the\n  naive-Dirichlet-inlet error, quantified against their own eq. (22).\n\nNothing\
  \ in this paper is left unused, so there is no residual case here. If a\nfuture maintainer\
  \ wants A2.2 back as a page, the only material not already on\nA2.1 is the non-steady-state\
  \ discussion in their Appendix (contributed by\nAcrivos), which neither paper solves.\n"
