notes: |
  Absorbed into A2.1 on 2026-08-02, after both papers were read in full. The
  complete argument, including the steelman for keeping this case separate and
  why it fails, is in queue_cases/A2.1.yaml under `scope_decision`. In brief:

  - Wehner & Wilhelm's eq. (20) for the reaction section is algebraically
    identical to Danckwerts' eq. (33) and they say so on p. 91, so the decisive
    quantitative check for either page is the same object. Verified: independent
    transcriptions of the two papers agree to 1.1e-16.
  - What they add is the DERIVATION of Danckwerts' conditions, which Danckwerts
    himself justified only by "Intuition suggests...". A boundary condition and
    its justification are one result.
  - Their three-section model IS built on the A2.1 page, as one pymrm domain with
    piecewise diffusivity: their eqs. (19), (20), (21) and (22) are all
    reproduced, their conclusion that the reaction section is invariant to both
    end sections is tested over five decades of Pe_a and four of Pe_c, and their
    derivation of df/dz(1) = 0 is recovered rather than imposed.
  - Their criticism of Hulburt's solution - "not consistent with the limit of a
    stirred reactor" - is turned into a number there too: it is exactly the
    naive-Dirichlet-inlet error, quantified against their own eq. (22).
  - Their qualification of Danckwerts' inlet discontinuity (p. 90, "which will be
    shown later to be not necessarily correct") is quoted on the page and
    reconciled with a measurement: in the three-section solve f is continuous at
    z = 0 and the step is the Pe_a -> infinity limit.

  What is NOT on the A2.1 page, stated precisely rather than as "nothing is left
  unused" (which an earlier version of this file said, and then contradicted two
  lines later):

  - the non-steady-state discussion in their Appendix, contributed by Acrivos,
    eqs. (23)-(26), which neither paper solves;
  - the p. 92 paragraph reconciling df/dz(1) = 0 with the plug-flow gradient
    -R*exp(-R) ("The key term in this development is {1 - exp(a*Pe_b(z-1))}"),
    a boundary-layer / non-uniform-limit argument.

  Neither would support a page of its own, and neither changes the `covered`
  verdict; both would be natural additions to A2.1 if it is revisited.
  (Verified 2026-08-02, review/verification.md F7.)
