what_it_carries: >
  This is the reactor half of the paper and it is an unusually direct fit. The
  paper's stated purpose is to test the reliability of the ONE-DIMENSIONAL
  plug-flow model against a TWO-DIMENSIONAL model with radial gradients, on a
  complex hydrocarbon-oxidation scheme, and to review the basic data each needs.
  It writes out the 1D equations explicitly and argues that the 1D model gives
  only averages and "provides no information concerning excessive temperatures
  along the axis, which may be markedly different from the mean and unacceptable
  for reasons of reactor stability, process selectivity, and catalyst
  deactivation".
  That argument, made in 1967 with the computing of 1967, is a pymrm S2-vs-S6
  diff. It is the best "the original could only sketch this; pymrm can sweep it"
  candidate in this drop.
validation_route: >
  PRINTED constants plus the paper's own 1D/2D comparison for the worked case.
  Whether the comparison profiles are tabulated or only plotted has NOT been
  established off the renders - check before promising a quantitative overlay.
  The kinetic constants and the operating conditions are printed and suffice.
notes: >
  SHARED FILE with C2.10 (the kinetics). Build C2.10 first, import here.
  Sibling to the published D2.2 (Van Welsenaere-Froment runaway) - same author,
  same hot-spot problem, machinery already in the repo. Also imports A3.11/A3.12
  (radial heat transfer parameters) once those land.
