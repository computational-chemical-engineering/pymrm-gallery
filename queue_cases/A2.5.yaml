follow_up:
  blocking: false
  kind: figure review
  artifact: queue_cases/A2.5/review/fig9-overlay.png
  already_answered: >
    This block used to ask "does no red circle sit on a bare stretch of the
    dashed curve?" as an open question. It is not open: one did. The row at
    (2038.7, 278.3) sat on the horizontal Eq.-(18) dash spanning x = 2022-2058,
    with exactly the 130 px of curve-independent ink the acceptance threshold
    demanded - contributed by the three glyphs fused around it. It has been moved
    onto the open circle beside it, and the sidecar now describes the threshold
    as the size filter it is rather than as a test that a glyph is present.
    Asking a maintainer to check something the extraction can answer, and whose
    answer is no, is worse than not asking.
  question: >
    Two things, neither of which changes a conclusion. (a) The sidecar lists
    three glyphs still fused into their neighbours, at Re = 0.82, 1.79 and 2.49.
    The middle one is an open circle whose ring fit at (1592.0, 263.0) covers
    95 % of the outline with an empty interior - near enough to resolvable that
    the call is the maintainer's. Including it moves the headline from 11.75 %
    to 11.62 % and the count above Pe = 2 from 30 to 31; that is recorded in the
    sidecar under `missing.effect_if_included`. Should it go in? (b) Did the
    draughtsman centre each glyph on the data point, or centre its ink? For a
    filled triangle the two differ by about 5 px, which is 1.9 % in Peclet number.
  why_non_blocking: >
    The page reports its headline agreement with and without both bounding
    perturbations (+/- 3.8 px and +/- 5 px applied to every point): the mean
    absolute deviation moves by at most 0.09 percentage points, and mostly the
    BIAS moves, by up to 1.9 points - which is why the bias is reported and not
    claimed. The one marker whose inclusion is genuinely in question moves the
    headline by 0.13 points, less than either perturbation, and the refit of beta
    is quoted with a block-bootstrap interval far wider than its difference from
    the printed value.

notes: >
  Provenance notes for the integrator. The 1968 Pergamon text layer drops the
  mid-dot decimal separator: it renders 0.607 as 0607, 0.203 as 0,203 and 0.0097
  as o%l97, and it turned Figure 8's label "D_L = gamma D_M = 0.150 cm2/sec" into
  "0.130". Every number in the three CSVs was read off a 600 dpi render, and
  nothing was repaired by inference. docs/pdf-findings.md has no entry for this
  file yet; it runs about 4,900 characters per page. docs/papers-on-disk.yaml
  needs a line mapping A2.5 to 1-s2.0-0009250968870563-main.pdf and A2.6 to
  1-s2.0-025527019380020H-main.pdf (the latter with the caveat above, since it is
  not the catalogued Gunn paper).
