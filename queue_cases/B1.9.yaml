what_it_carries: >
  The random-pore model as its authors state it: "The total rate is the sum of
  separate contributions for diffusion through macropores, micropores and a
  SERIES PATH", requiring only the pore volume-pore radius distribution as
  input. AND IT CARRIES ITS OWN DATA: "Experimental diffusion measurements are
  reported for FIVE high-area alumina pellets of different densities made from
  the same Boehmite powder", over 1-12 atm, showing macropore control in the
  least dense pellet and micropore control in the most dense - plus comparisons
  against literature data for a silver catalyst and a low-area alumina.
  Passes the E1.1 test outright, and this is one of the few cases in the drop
  whose source contains MEASUREMENTS.
validation_route: >
  EXPERIMENTAL if the pressure-series measurements are printed as tables.
  handoff.md records that only four pages in the whole gallery are validated
  against experiment, and that moving that ratio is a standing goal - so CHECK
  THE TABLE INVENTORY OFF THE RENDERS FIRST, because if the five pellets'
  diffusion rates are figure-only this case hits the review gate and there is no
  maintainer available as of 2026-08-05. Ranked on that uncertainty in
  docs/source-map-2026-08-05b.md.
notes: >
