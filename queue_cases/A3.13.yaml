scope_decision: >
  BUILDABLE, BUT NOT FOR THE RADIATION TERM THE CASE TITLE NAMES. Read this
  before dispatching; it is the A1.8 situation repeating.

  A3.13's catalogue line is "Zehner-Bauer-Schlünder ... Stagnant bed
  conductivity INCL. RADIATION". Neither document on disk delivers radiation:

    * Kandula is about Zehner & SCHLÜNDER (1970), the point-contact ZS model.
      Radiation and contact conduction are Bauer's 1978 additions and are not in
      the 1970 model.
    * Mou et al. print, as their Eq. (7), the SIMPLIFIED ZBS (S-ZBS) model with
      the Smoluchowski correction folded in. Their own Introduction states
      plainly that Syamlal & Gidaspow simplified ZBS "by ignoring the
      Smoluchowski AND RADIATION effects" to obtain S-ZBS. Setting k_g* back to
      k_g in their Eq. (7) recovers S-ZBS itself, so the main article does carry
      a complete, evaluable model - but not the radiative one.
    * The FULL ZBS with radiation lives in Mou's SUPPLEMENTARY MATERIALS
      (Eq. S2, Table S2). THE SUPPLEMENT IS NOT ON DISK; the PDF is the 17-page
      main article only. Do not cite Eq. S2 or Tables S1-S9 as read - the article
      refers to them nine times and none of them is in the file.

  So: build the ZS / S-ZBS core against Mou's printed tables, state on the page
  which named component is absent, and name the document that would complete it
  (Bauer & Schlünder 1978, Int. Chem. Eng. 18, 189; or the German original
  Zehner & Schlünder, Chem. Ing. Tech. 42 (1970) 933-941). That is exactly what
  A1.8 did with the missing Gidaspow and Wen-Yu closures.

text_layer:
  mou: >
    Born-digital Elsevier PDF, clean. Greek letters, subscripts, equation bodies
    and table headers all survive. No render needed. (20 MB, because the figures
    are high-resolution.)
  kandula: >
    Envision OCR over a CCITT-G4 bilevel scan at 300 x 300 ppi native. POOR:
    "eefcient" for efficient, "Zhner-Schlunder" for Zehner-Schlünder, "z, 0.6"
    and "^ 0.6" for the same phi = 0.6, and the model equation comes back as
    "ke _ k2/k1 / k1 (1— V) + V42/kt)". Read every equation and every number off
    a render AT 300 DPI - not 600, the images are bilevel.

what_it_carries: >
  From Mou et al., all in the main article and all in PRINTED TABLES:
    * Table 1: physical property parameters of four metal powders (LaNi5, 17-4
      PH, 316 L, IN 718) - particle size distribution d10/d50/d90, volume mean
      diameter, material density, solid thermal conductivity, and bed porosity
      (0.53, 0.46, 0.45, 0.44).
    * Table 2: predicted vs experimental ETC under nitrogen, argon and helium at
      p_g = 0.1-3.0 MPa, T_ave = 20 C, with the relative error printed per row.
    * Table 3: predicted vs experimental ETC for NaCl, 316 L, LaNi5, IN 718 and
      SS 304 beds at atmospheric pressure under air and argon, drawn from four
      independent literature sources.
    * Eqs. (1)-(9) and (14): the ETC cell relation, the Smoluchowski-modified gas
      conductivity, the thermal accommodation coefficient, the modified S-ZBS
      model Eq. (7) with B and delta, and the relative-error definition Eq. (14).
    * The authors' own accuracy claim - "Mean prediction error of modified S-ZBS
      model for experimental data is below 2 %", maximum RE below 20 % - which is
      a ready-made `report_agreement` target and an honesty check: a page
      claiming better than 2 % mean error is claiming more than the authors did.

  No maintainer is needed for this route: it is a printed table throughout.

validation_route: printed tables (Mou Tables 1-3); Kandula is figure-only and is the secondary
notes: >
  Kandula's figures span a much wider conductivity ratio (8 to 1200) than Mou's
  metal powders, so digitising them would extend the page's range - but that is
  the figure route and parks at the review gate that currently has no maintainer.
  Build the printed-table page first and record the extension as future work.
