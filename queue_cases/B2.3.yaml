  a^(d-1) cancellation that pins C_P fails, moves it 0 -> 3 at 1e-4, and the
  row is labelled compound. "asserted < 1e-9" is gone with the sep_null_*
  metrics. The required span is swept over the two unprinted choices it hides:
  0.073 to 0.382 over C_LO in 0.05-0.40 and 3-9 levels, printed as a table with
  the base cell marked, and README/meta/models_entry now call 0.204 an order
