fixer_pass: >
  2026-08-09. Applied queue_cases/B2.3/review/verification.md after re-measuring
  every finding with my own code. The verification's verdict stands and NOTHING
  IT SAID HELD UNDER ATTACK WAS WEAKENED: the one positive separability claim
  (plug flow, parallel vs independent, 2.20e-3) is unchanged, so are the 26
  symbolic identities, the 17 verbatim quotes, the closed forms, the eq. (24)
  defect and both correctly-rejected defect candidates. Metrics 167 -> 204,
  break rows 16 -> 22 movers + 1 robustness, sub-floor metrics 42 -> 63,
  runtime 235 s -> 270 s (two fresh executions, byte-identical agreement.json
  and MD5-identical figures).

  F1 (CONFIRMED, and the identity's DOMAIN IS NARROWER THAN THE VERIFICATION
  STATES). Side-by-side is exactly parallel with n' -> lambda sigma / kappa in
  the batch and the bed, for every sigma - but it needs n' = 1 as well as
  n = d = 1, which the verification's statement omits. In the bed the poison
  solves dp/ds = -sigma lambda a^d p^n', so p = exp(-sigma lambda INT a) only at
  n' = 1; in the batch d ln c = (kappa/lambda sigma) p^-n' dp is a power law
  only at n' = 1. Measured at sigma = 0.8, n = d = 1: n' = 0.5 gives 8.0e-3
  (batch) / 5.8e-2 (bed) and n' = 2 gives 3.2e-2 / 1.1e-1, against 8.2e-10 /
  1.9e-11 at n' = 1. The verification's own sigma sweep was run at n' = 1, so
  its numbers are right and only the stated domain was over-broad; the page now
  states n = n' = d = 1 everywhere the family appears, and carries off-condition
  controls in n', in d and in n. SECOND CORRECTION, an extension the
  verification did not make: the OTHER side-by-side identity (d = 1, n' = n,
  sigma = kappa/lambda, where the poison solves the reactant's own equation so
  p == c) is not batch-only either - it holds in the bed AND in the constant-flow
  mixed reactor, measured 0.0 / 0.0 / 7.3e-15 for batch / bed / mixed at
  n = n' in {1, 1.5, 2}. Section 4 is now "Five exact degeneracies - and they
  reach every device"; "the only device that is not exactly degenerate" is
  struck from the front matter, Background, section 6, "What pymrm adds",
  README, meta.yaml, models_entry.yaml and this file. STRUCTURES [S1, S5] KEPT,
  on the verifier's other ground, which is true: the bed is a real 1-D
  convection problem on the pymrm operators, and it is the only contacting with
  a spatial coordinate - so it is the only one whose activity is a field. That
  is now the reason given.

  F2 (CONFIRMED, and it is NINE entries, not eight). The ninth is
  sep_mixed_par_vs_s-b-s = 3.19e-5, which the p == c identity above makes
  exactly zero in the mixed reactor - a consequence of the F1 extension. Fixed
  structurally rather than by re-seeding: twin_params() returns, for each of the
  64 (device, truth, candidate) triples, the parameter vector at which the
  identity of section 4 makes the candidate reproduce the truth exactly; the
  twin is checked against the fitter's own bounds and evaluated, and the matrix
  reports min(fit, twin) with identity-backed entries flagged. 44 of 64 have a
  twin; worst twin residual 1.5e-9 (the ODE tolerance). The nine shortfalls are
  printed in their own table beside what the algebra gives, largest 1.31e-3,
  all in the safe direction, none crossing a threshold (asserted). Break row (i)
  now reads 5, not 6. The same twin is applied to section 7's boundary rows, so
  mixed_boundary_worst_inside falls 3.49e-5 -> 1.47e-9 - which STRENGTHENS the
  page's own claim that inside d >= n'/n the impersonation is perfect.

  F3 (CONFIRMED on the substance, PARTLY OVERRULED on the diagnosis, and the
  dispatch's question answered in print). The diagonal's exact minimum is zero
  by construction, so a non-zero diagonal is an optimiser stall: "The gap is a
  result, not a solver failure" is struck and the twin sets the diagonal to
  zero exactly. The stalls are reported separately as sep_stall_* (8.55e-6
  batch, 2.38e-5 mixed; 8.7e-10 plug, 2.6e-14 constC). BUT the verification says
  "several per cent away from the truth" is "supported by no output" and that a
  1 % single-parameter move costing 20-300x the stall shows a stall rather than
  non-identifiability. I computed the recovered parameters - which needed a
  latent bug fixed: fit_class returned bx = the best SEED, never the argmin,
  because `if v <= state["best"]` could not fire once state["best"] had already
  been updated inside the residual. With the argmin tracked, the stalled points
  sit 3.6 % (batch) and 10.5 % (mixed) from the truth in their worst
  coordinate, at stalls of 8.55e-6 and 2.38e-5, while a 1 % move along any
  single coordinate costs 17x to 311x that (I reproduce the verifier's
  displacement table exactly: 2.658e-3, 1.164e-3, 5.346e-4, 3.927e-4, 5.154e-4
  for batch). So both are true and they are the same fact: the response is far
  less sensitive along a compensating direction than along any axis - eq. (6)'s
