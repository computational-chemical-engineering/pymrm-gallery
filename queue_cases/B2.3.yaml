text_layer:
  quality: >
    Poor. 1972 Academic Press scan; the OCR damages the abstract heavily
    ("detrrmination", "ordrrs", "particlrs", "parallrl", "Wr discuss the various
    rractor types which may he usctf"). Every reaction order, deactivation order
    and rate constant must come off a cropped image.
  render_at: 300 dpi. CCITT-G4 bilevel at 300 x 300 ppi native.
what_it_carries: >
  The nth-order deactivation rate equation and, per the abstract, the
  experimental determination of "the ordrrs of reaction and deactivation in the
  nth order rate equation which represents the FOUR BROAD CLASSES of
  deactivation of catalyst particles: parallel, series, side-by-side, and
  independent", together with a discussion of which reactor types (batch-solids
  and others) can resolve them.
  That four-class taxonomy is what the catalogue means by "order-based decay
  laws", and it is the natural companion to B2.2, which treats two of the four
  (parallel and consecutive/series) in a fixed bed.
validation_route: >
  The paper's own point is EXPERIMENTAL DESIGN - which reactor type can
  distinguish which deactivation class. That is a discriminability question, and
  the gallery's version of it is exactly the S1/S4 sweep pymrm is good at: solve
  all four classes over the operating plane and show where their responses are
  and are not separable. That needs no data and no maintainer.
  PRE-DISPATCH RENDER DONE, 2026-08-08 (coordinator). The question this block
  used to leave open - whether the paper's own measured orders are tabulated -
  is settled: they are NOT, because the paper prints NO experimental data at
  all. Digit density is 70-112 per page across all eight pages and is entirely
  equation numbers; there is no table anywhere in the document; Figs 2-6 are
  schematic test plots rather than data (Fig. 6's caption: "A straight line on
  this plot indicates that the guessed order of deactivation is correct"). The
  Discussion says the subject is method, not measurement: "we ask in particular
  whether experiments CAN BE DEVISED so as to give simply the orders and rate
  constants". So `what_it_carries` above overstates it - the abstract's damaged
  "experimental detrrmination of the ordrrs" means how to determine them, and
  the paper's own title word is "Experimental SEARCH for a Simple Rate
  Equation".
  Consequence for the dispatch: the discriminability sweep is the ONLY route,
  exactly as this block anticipated, and NO comparison against the author's
  measured orders may be promised or attempted - there are none. The page is a
  prove-the-printed-structure page (J1.4 precedent) plus a measured
  separability sweep.
notes: >
  Build after B2.1 and B2.2 - the three form one story and B2.2 already supplies
  the reactor.
  Note the risk of a check that cannot fail (handoff.md): a discriminability
  claim must be measured, not asserted. If the four classes are claimed
  separable, inject the wrong class and confirm the metric moves.
built: >
  STAGED 2026-08-08 at queue_cases/B2.3/page/ (index.ipynb executed clean,
  agreement.json with 217 metrics after the second fixer pass (204 after the
  first, 167 as first staged), two CSVs + sidecars, README.md, meta.yaml)
  plus queue_cases/B2.3/models_entry.yaml (APPEND - models.yaml carries no B2.3
  entry; the entry has status: published and page: pages/B2.3-levenspiel-
  deactivation-classes/). Slug: levenspiel-deactivation-classes. Runtime 310 s
  after the second fixer pass (270 s after the first, 235 s as first staged;
  the identity twins, the grid refinement of the bed profile and the Euler
  time-order study added ~39 s, and the bed outlet's time refinement ~40 s).
  The validation_route block above was followed exactly: no data exist in the
  source, none was used, and no measured order is compared against.
  WHAT CAME OUT, in case a verifier wants the short version. The discriminability
  question was measured with 64 fits (every class fitted to every other class's
  response, all parameters free) and the answer is largely NEGATIVE: ALL FOUR
  batch-solids devices carry an EXACT degeneracy, by five algebraic identity
  families the paper does not state - most sharply, in any well-mixed fluid at
  constant flow series deactivation of order (n', d) IS parallel of order
  (n n', d + n') for any n; and at the base orders n = n' = d = 1, in a batch of
  fluid or a plug-flow bed, side-by-side deactivation with poison group sigma IS
  parallel deactivation with n' -> lambda sigma / kappa, for EVERY sigma (the
  poison profile is a power of the reactant profile there; it is not in the two
  well-mixed devices, where the same identity fails by 1e-1). Only the batch and the bed
  keep parallel, series and independent apart, and at a 0.2-percentage-point
  conversion resolution only one of the twelve class pairs is separable in one
  device. The discriminating measurement turns out to be the activity PROFILE,
  not the effluent - and both bed inlet values are EXACT rather than sampled
  (a(0, theta) = exp(-lambda theta) under parallel decay, identically 1 under
  series because C_R = 0 at the feed face), gradients of opposite sign - which
  lands on B2.2's finding from the other direction. Levenspiel's recommended
  held-C_A device is confirmed to decouple d from n' and shown to destroy the
  class distinction within one run as the price; the span of held levels needed
  to recover the class is root-found AND swept over the two unprinted design
  choices it hides. One printed defect: eq. (24) prints 1/k_d where the
  paper's own eq. (21) requires 1/k, residual exactly ln(k_d/k), dimensionally
  impossible as printed; reported, not repaired.
  STRUCTURES: [S1, S5], not S1 alone as this file said - the plug-flow
  contacting is a real 1-D convection problem built on
  construct_convflux_upwind / construct_div / interp_cntr_to_stagg_tvd, and it
  is the only contacting with a spatial coordinate: it carries the activity
  profile, eq. (22) solved on the bed, both convergence studies, the
  pseudo-steady eps study and four break rows. (It is NOT "the only device that
  is not exactly degenerate" - an earlier version of this block, of the page and
  of both yaml files said so, and it is false: the bed collapses side-by-side
  onto parallel exactly, just as the batch does. Fixed 2026-08-09.) meta.yaml
  and models_entry.yaml both carry [S1, S5].
