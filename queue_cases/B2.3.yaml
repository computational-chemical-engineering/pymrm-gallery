fixer_pass_2: >
  2026-08-09. Applied queue_cases/B2.3/review/verification-pass2.md. Both
  required fixes done, the moderate one done, and every finding re-measured
  with my own code before anything was changed. Metrics 204 -> 217, break rows
  22 movers + 1 robustness -> 24 movers + 3 robustness, sub-floor metrics
  unchanged at 63 in 12 kinds, runtime 270 s -> 310 s (309.8 s and 307.2 s on
  two fresh executions, agreement.json md5 a604c5e6a73821147c291dbccd4ee80c on
  both, notebook content byte-identical). NOTHING THE VERIFICATION LISTED AS
  HOLDING UNDER ATTACK WAS WEAKENED: sep_plug_par_vs_ind is still
  2.201628626736685e-3 and sep_plug_par_vs_ser 8.065873833966777e-4, the twins,
  the degeneracies, the quotes and the closed forms are untouched.

  P1 (CONFIRMED, INDEPENDENTLY, AND THE FIX GOES FURTHER THAN THE VERIFIER
  ASKED). I re-derived the converged bed outlets on my own Chebyshev-Lobatto
  spectral bed - cumulative integration matrix exact to 2e-16 on both test
  integrands, theta marched under Radau at rtol 1e-12 - and got
  a(1, theta=1) = 0.190166168541 (parallel) and 0.177112507749 (series),
  N-independent to 1e-12 over N = 24, 32, 48, 64, 96. The page's own bed,
  space-Richardson from (m = 400, 800), reproduces the verifier's table
  exactly: parallel 0.190205152 / 0.190175998 / 0.190168676 / 0.190166841 at
  nt = 50 / 100 / 200 / 400, errors +3.90e-5 / +9.83e-6 / +2.51e-6 / +6.72e-7 -
  clean second order in Delta-theta. So the printed 0.190176 carried a +9.8e-6
  TEMPORAL error while its own SPACE extrapolation residual was only 1.8e-7
  (the disagreement between the (200,400) and (400,800) pairs).
  THE FIX. The outlet is now extrapolated TWICE. The space-Richardson of the
  two finest grids is repeated at nt = 50, 100 and 200; the observed order of
  that sequence is printed (1.99 parallel, 2.00 series - Heun's own order,
  measured on the outlet rather than assumed from the conversion history) and
  the second Richardson is taken from the finest pair. Reported outlets
  0.19017 and 0.17711, against my spectral values to +6.6e-8 and -1.1e-7.
  AND THE DIGITS. Six decimals were being printed on a quantity whose own
  refinement resolves about 2.4e-6, so a residual bound is now computed
  (max of the time correction and the two-grid-pair spread) and the outlets are
  quoted to the five decimals it supports. This matters: the series limit
  0.1771125 sits ON the 6-decimal rounding boundary, so no method the bed can
  afford prints its sixth digit reliably - the doubly-extrapolated value rounds
  to 0.177112 and the truth to 0.177113, differing by 1.1e-7 of actual error.
  Five decimals is right for both classes with 6x margin.
  THE CERTIFICATE. bed_profile_time_sensitivity no longer parses f"{...:.6f}"
  strings (which quantised it at 5e-7 and made 5.165e-7 the ROUNDING, not the
  change) and no longer tests the series class alone: it is now the max over
  BOTH classes of the outlet change under nt doubling, on floats, at the finest
  grid - 7.32e-6. Its control, bed_inlet_time_sensitivity, is the same doubling
  on the INLET cell centres: 2.49e-9, which is 17786x below the parallel
  cell-centre error and 1.1e6 below the series one, so the spatial study and
  its observed orders are demonstrably uncontaminated. "The study is purely
  spatial" now says which reading it is true of, and says out loud that the
  other one is not.
  NT_CONV IS NOW CONSTRAINED, in both directions. Four new break rows: halving
  NT_CONV to 50 moves the space-only reading 0.190176 -> 0.190205 (parallel)
  and 0.177113 -> 0.177116 (series), and reading the time extrapolation off the
  50/100 pair instead of 100/200 does NOT move the reported outlet (4.5e-8 and
  1.4e-9, both under the table's own 1e-6 relative test). NO HEADLINE MOVED:
  the contrasts still print +0.1404 and -0.8229, confirmed after the fix.
  THE SWEEP THE DISPATCH ASKED FOR. Every other reported bed quantity was
  checked for the same wrong-baseline class and none carries it.
  bed_spatial_* are measured at FROZEN a, so no time integration exists in
  them; bed_time_order* are convergence orders whose whole subject is the
  temporal error, with the nt = 200 Heun anomaly already disclosed as the m =
  400 spatial floor; bed_vs_quadrature_* and eq22_maxdev_pymrm are deviations
  of the PRODUCTION configuration (m = 200, nt = 200), labelled as such, not
  limits; pseudo_steady_* is a difference between two solutions of one
  discretisation and its fitted slope is 1.01 over eps = 1e-4 to 3e-3, so no
  numerical floor is contaminating it; both bed inlet values are closed forms.
  The notebook now prints the general lesson in its own words: this was one
  defect three times in one section (sampled inlet, single-grid outlet,
  single-step-count outlet), and the rule is that no reported value may be a
  function of a resolution the page chose - each such knob is extrapolated away
  or shown by halving to be irrelevant - and no value may be printed to more
  digits than its own refinement resolves.

  P2 (CONFIRMED, and three more of the same class found and fixed). The two
  named coverage strings claimed a resolution re-read that the break table's
  own note says cannot exist; both now state that break (i-constC) is COMPOUND
  and that what moves the count is the d = 2 half, not the resolution half.
  Re-checking every coverage string key by key turned up three more:
  (i) sep_stall_* named break (h) as their "Mover" when the table declares (h)
  a ROBUSTNESS row that must not move - reworded to say that (h)'s knob can
  only lower a stall, so the stalls are upper bounds; (ii) mixed_boundary_*
  said the boundary "switches it by ~1e12" where the executed row switches it
  by 7e6 - the ratio is now computed from the two metrics instead of typed;
  (iii) the two _ser outlet metrics would have pointed at rows built for the
  parallel class only, so the new bed rows are generated for BOTH classes.

  P3 (CONFIRMED and taken). wrong_class_misfit is numpy least-squares on
  analytic power laws in c and 1-c and never calls run_const_c, so
  constC_span_needed_prec5pct could not have detected a defect in the held-C_A
  device. All 19 constC sub-floor metrics now name span_constC_par = 1.20, an
  output of run_const_c itself; the generic constC rule names
  constC_sbs_recovered_d_base = 1.383; and, on the same principle,
  degen_mixed_series_is_parallel_rtol1e-13 stops naming its own
  looser-tolerance self and names mixed_boundary_np1_d0.5 = 3.05e-3, the same
  identity evaluated where it does not hold. The sub-floor table now states the
  companion rule and names the defect it just repaired.

  DECLINED, with the measurement. (a) The verifier's offered upgrade of adding
  degeneracy 4 to the held-C_A device: I verified it holds - with d = 1 and
  sigma = kappa/lambda the poison driver becomes the constant
  r_set/c_set^n, whose mixed-flow poison solves p + (r_set/c_set^n) p^n' = 1,
  which p = c_set satisfies identically for every n = n' - but it is already
  covered. That device's separability matrix reports every off-diagonal entry
  at <= 1.1e-16 by twin, side-by-side included, so the collapse is claimed
  already; adding a fourth famA row would restate it while disturbing section
  4's text, which the verification passed. (b) Optional item 4 (the clause that
  sigma = 0 collapses side-by-side onto independent) is outside the dispatch's
  scope and is left for the maintainer; it is true, and the page's caveats
  already say it elsewhere.
