  page now prints the recovered parameters, the displacement table and that
  reading. THE 20x FLOOR: confirmed inert and REMOVED. 20x the stall is 1.7e-4 /
  1.7e-8 / 4.8e-4 / 5.2e-13 against resolutions 2e-3 / 2e-3 / 2e-3 / 1e-2, worst
  case 0.24 of its device's resolution; the notebook prints that table, asserts
  it, and every threshold and every count is unchanged by dropping the floor
  (checked: 0 / 1 / 0 / 0 separable pairs before and after).

  F4 (CONFIRMED, and BOTH inlet values are exact, not just the series one). At
  s = 0 the feed is imposed, so C_R = 0: series gives da/dtheta = 0 and
  a(0, theta) = 1 identically, and parallel gives da/dtheta = -lambda a and
  a(0, theta) = exp(-lambda theta) = 0.049787 - so the reported 0.049965 was
