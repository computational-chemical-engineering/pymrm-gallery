  8.88e-5 / 4.44e-5, observed order 1.00 both, and the study shown to be
  spatial (doubling nt moves both readings by 5.2e-7). The outlets have no
  closed form and are Richardson-extrapolated instead of sampled: 0.190176 and
  0.177113, giving contrasts +0.1404 and -0.8229 (was +0.140 / -0.812).
  [SUPERSEDED BY fixer_pass_2, which is the current state: both of those outlet
  numbers were still TIME-limited and the 5.2e-7 certificate was a string
  rounding measured on one class. The page now reports 0.19017 and 0.17711.
  The contrasts are unchanged.]

  Smaller ones, all done. Break row (c) now sets Heun's observed order 1.97
  against Euler's 1.01 on the same 50->100 pair (order against order; the old
  row compared an order with an error and could not fail), and the page
  explains the nt = 200 Heun anomaly - apparent order 3.16 because its time
  error has fallen onto the m = 400 spatial floor. fits_capped is falsifiable:
  sep_matrix passes tag=(config, truth, candidate) to fit_class, so a capped
  sweep fit would be recorded and the assertion beside it could fire; re-run
  value still 0 of 64. The sub-floor bookkeeping is rebuilt: every one of the 63
  sub-floor metrics is classified into one of 12 KINDS (not all identities - 3
  are the separable counts that carry the negative headline, 1 is a budget
  counter, 1 a boolean, 5 are numerical ODE-vs-closed-form deviations), states
