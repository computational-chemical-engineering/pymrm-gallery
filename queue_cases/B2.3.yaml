  the CSV in full, says the paper's instruction for eq. (6) is to hold C_P, and
  reports that its own sigma = 0 row - which IS that instruction - recovers d
  to 5.4e-9. Degeneracy 2's 1.3e-9 is shown to be the integrator tolerance
