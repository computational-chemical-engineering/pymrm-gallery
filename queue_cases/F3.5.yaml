    rules land on the printed ticks?

    (2) STILL OPEN FROM THE FIRST PASS, unanswered. In F3.5-fig4-overlay.png the dashed CO2
    curve and the solid promoted-HCO3- curve run about 13 px apart at the right edge; the
    script identifies the upper intermittent one (#2) as the dashed CO2 curve at 2.18. Is that
