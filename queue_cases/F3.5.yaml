notes: 'Paper identity resolved 2026-07-31: the catalogue''s citation "Versteeg & van Swaaij
  (1988); Danckwerts & Sharma" points at the group''s kinetics paper; the auto-resolved DOI
  (crossref) landed on Bosch, Versteeg & van Swaaij (1989) CES 44(11) 2735-2743, which IS
  the model paper the case wants (CO2 into amine-promoted carbonate with parallel reversible
  reactions) and cites the 1988 kinetics paper as its correlation (11). Verified against the
  PDF first pages; reference block above records the actual paper.

  Page staged at queue_cases/F3.5/page/. Verification pass 2026-07-31 sent it back as "legitimate
  but under-caveated"; the model, the transcriptions, the scalar and the numerics all stood,
  and the corrections in queue_cases/F3.5/review/verification.md sections 9-10 were applied
  2026-08-01. State now:

  Film model reproduces Table 2 after a one-scalar reconstruction of K3 = Kw/Kc2 (s = 1.4585)
  fitted to the paper''s own J = E kL (ci - cb) identity. HEADLINE is the unpromoted FLUX,
  max 3.8%; promoted E 7.6%, promotion factors 5.6%. The unpromoted E agree to 0.6% but that
  is flattered - the fitted cb sits in E''s denominator, E is 2.6x less sensitive to s than
  J, and the four E_u deviations are one offset repeated; the page says so. The fit is NOT
  independent of the enhancement factors (the implied cb is built from J and E) and the page
  states that exactly. Location is a three-way choice: Kc1 rejected (E_u 19.8% high), Kc2
  vs Kw essentially undetermined (F 5.6% vs 8.6%); the code uses Kc2. Why K3 differs is not
  established - ionic strength has the right sign, a ~10 K Kw reference temperature error
  fits equally well.

  ADVERSE RESULT, reported on the page as such: the paper''s only two out-of-sample numbers
  both prefer the printed constants - desorption F = 3.72 (-2.3%) printed vs 3.35 (-12.0%)
  reconstructed, driving-force reduction 34.7% vs 39.1% against the paper''s "about one third".
  The page runs both and does not present this as corroboration.

  Independent support that touches no enhancement factor: the unpromoted bulk CO2 read off
  Figures 2, 3 and 4 implies s = 1.419, 1.405, 1.510 (mean 1.445), and the alpha = 0.2 solve
  reproduces Fig. 2''s HDA profile (374 -> 485 vs 369 -> 484). Those readings also show Figs
  2 and 3 to be at alpha = 0.2 although their insets print 0.4 (electroneutral against [K+]
  = 4000 only at 0.2); Table 2 and Fig. 4 agree with each other and the page follows them.
  Figure readings are quoted as a cross-check pending maintainer visual review - no CSV, no
  dataset, nothing on the page depends on them; see follow_up below.

  CURVE-IDENTITY CORRECTION applied 2026-08-02 after the maintainer''s first review pass ("in
  fig 2 you missed the top solid line: CO3_p. In fig3 the top dashed line is CO3_u and the
  solid line is CO3_p"). Fig. 2''s promoted CO3-- was missed because that solid rule leaves
  the plot box through the top at the right-hand edge, above the row the read band started
  at; Fig. 3''s two carbonate curves converge to within one line width at the frame and had
  been fused into one run, so they are now tracked over the strip where they are still two
  rules (out to x/delta = 0.96) and each extrapolated to x/delta = 1. Both corrections are
  policed by a NEW falsifiable test the first pass could not even state: the promoted bulk
  must satisfy [K+] + [AmH+] = [HCO3-] + 2[CO3--] + [AmCOO-], which needs the promoted CO3--
  of every figure. All three balance on the corrected reading, worst deviation 0.20 % (0.11 %
  on the unpromoted test), and the promoted carbonate that charge balance DEMANDS agrees with the curve actually
  read to within 4.1 mol/m3 in every figure. Without Fig. 2''s promoted CO3-- the solid bulk
  there is short of anion charge by a factor of five, which is how the error shows up.

  THE alpha = 0.2 CONCLUSION SURVIVES, and so does s. The two mis-read curves are promoted
  carbonates and enter neither the loading identification nor the bulk CO2 that gives s. The
  unpromoted charge sums are now 3998.3 / 4000.2 / 3995.5 against [K+] = 4000 (Fig. 3 moved
  from 3997 as its dashed carbonate was disentangled from the solid one); s = 1.419 / 1.405 / 1.510
  (mean 1.445) is bit-identical to the first pass. Four metrics added to agreement.json:
  s_from_figures_mean, fig_charge_dev_unpromoted_max, fig_charge_dev_promoted_max, and
  amine_flux_closure (advertised in meta.yaml but previously untracked, the same gap the
  verifier caught for vkh_dev). Overlays
  regenerated in review/ (git-ignored); review/README.md records what changed and what to look
  at.

  Collateral fixes found by the prose-vs-output audit run alongside the correction, all
  small and none touching the model: front-matter date; "HCO3- ~ 804-806" (was 804-805, the
  reading is 803.8/805.5); "1.3% below the figure" (was "within 1.3%", the value is 1.33%);
  the implied-cb rounding sensitivity is now computed and prints 9%, not the hard-coded ~13%;
  the gas-side bound now says which E it is evaluated at (the reconstructed run''s 153) and
  notes it still holds at the page''s largest E, 171; the paper''s Table 3 range F(DEA) 2.7-5.0
  is transcribed as printed with a note that the paper''s own Table 2 goes down to 2.51;
  amine_flux_closure added to metrics; five stale check numbers in source comments realigned
  with the labels the cells actually print; runtime_seconds 45 -> 40.

  Tier 6: the paper contains no tabulated measurements. Runtime ~40 s.

  '
