    Fig. 3 correction turned up, offered as evidence but not as an answer: the LOWER rule of
    that pair (#3) reads 2.164 if it is put on the left axis - so "2.16" is most likely the
    solid promoted-HCO3- rule read on the CO2 axis, not a different reading of the same curve.
    The pair is cleanly resolved into two tracks here, unlike Fig. 3's carbonates, and the
    split holds with the tracking strip ended at x/delta = 0.90, 0.93, 0.97 and 1.00 (dashed
    2.177-2.184 at duty 0.27-0.66, solid at duty 0.99-1.39). Your eye still decides.
  detail: >-
    NOT BLOCKING - the page ships with the figure result disclosed as pending, exactly as it
    was. What the answer buys: the Figs 2/3/4 reading is the page's only route to the
    correction scalar s that does not go through the printed enhancement factors, and is
    therefore what answers the circularity finding against the reconstruction. It gives
    s = 1.419 / 1.405 / 1.510 (mean 1.445) against the fitted 1.4585, with no Table 2 and no
    E in the calculation. Confirming it lets the "pending maintainer visual review" label come
    off; it does not change any number.

    The corrected reading now carries TWO independent falsifiable checks, both printed on the
    page. (a) The dashed curves against the potassium, [HCO3-] + 2[CO3--] = [K+] = 4000
    mol/m3: 3998.3 / 4000.2 / 3995.5, i.e. 0.11 % worst case, and swapping the two ion assignments
    breaks it by -20 / -20 / +40 %. (b) NEW, and the test that caught the errors you flagged:
    the solid curves must satisfy [K+] + [AmH+] = [HCO3-] + 2[CO3--] + [AmCOO-]. It cannot be
    written down without the promoted CO3-- of every figure, and with Fig. 2's missing the
    solid bulk there was short of anion charge by a factor of five. On the corrected reading
    all three figures balance, worst deviation 0.20 %, and the promoted carbonate that charge balance
    demands sits within 4.1 mol/m3 of the curve actually read. review/README.md sets out what
    changed and what to look at.
