# Block to splice into models.yaml for J3.5. The catalogue currently has no
# J3.5 record (it is referenced only from J3.4's `related:`), so this is an
# append, not an in-place upgrade. slug and title match page/meta.yaml exactly.
- id: J3.5
  slug: single-particle-model
  title: "Single particle models with electrolyte (SPM / SPMe)"
  description: >
    Marquis et al.'s asymptotic reduction of the Doyle-Fuller-Newman model -
    the SPM at leading order, the SPMe at first order - applied to the
    gallery's own 1993 cell, with the promised O(C_e) and O(C_e^2) error
    scalings measured against the J3.4 full model on a converged sweep: slope
    1.00 for the SPM, and for the SPMe a local exponent of 2.07 at the bottom
    of the sweep drifting to 2.70 at the top.
  section: J
  status: published
  page: pages/J3.5-single-particle-model/
  tier: T1
  priority: P1
  structures: [S8, S10, S3]
  phases: [liquid-solid]
  reference:
    authors: ["Marquis, S. G.", "Sulzer, V.", "Timms, R.", "Please, C. P.", "Chapman, S. J."]
    year: 2019
    container: "Journal of the Electrochemical Society 166(15) A3693-A3706"
    doi: 10.1149/2.0341915jes
  predicts: [terminal voltage of reduced-order battery models, electrolyte correction profiles, a-priori applicability of the reduction]
  pymrm_api: [construct_grad, construct_div, NumJac, newton]
  data: {tier: 6, method: table, status: complete}
  note: >
    The catalogue phrase "various reductions of J3.4" made citable: the SPM and
    SPMe as the leading- and first-order terms of Marquis et al.'s asymptotic
    expansion, re-derived for the 1993 half-cell geometry and tested against
    the gallery's own J3.4 solve. Model-vs-model throughout - the J3.4
    reference is itself a reproduction of a published simulation, so nothing
    here touches a measurement. The page also measures what its own slope test
    resolves: the ohmic and concentration corrections sharply, the
    electrode-averaged exchange-current term not at all (0.01 %), and no
    parameter of the shared set at all. Their own Table IV is context only: the
    property functions of their cell live in cited codes, not the printed
    paper.
  related: [J3.4, J1.5, B1.1]
