blocker: null
text_layer:
  quality: >
    Reasonable for prose but the criteria themselves are inequalities with
    subscripted groups, and OCR eats the symbols (the effectiveness factor
    extracts as a bare comma). Every criterion must be transcribed from a
    cropped image and then CHECKED - a Mears criterion is a numeric threshold,
    and a lost decimal point silently changes the verdict a page reports.
  render_at: 300 dpi. CCITT-G4 bilevel at 300 x 300 ppi native.
what_it_carries: >
  The screening criteria - interphase and intraparticle, mass and heat - that
  tell an experimenter whether measured rates are free of transport artefacts,
  derived rather than asserted, with the reaction orders and activation energies
  entering explicitly. The paper reviews the effectiveness-factor literature it
  builds on (Petersen 1965; Satterfield & Sherwood 1963) and derives the
  criteria from the strong-diffusion asymptote.
validation_route: >
  DERIVED, not data-fitted. The criteria are inequalities, so the natural
  validation is the one the gallery is best at and the one the paper could not
  do: solve the full pellet/film problem in pymrm over the parameter plane and
  MEASURE where each criterion's stated tolerance (usually "rate deviates less
  than 5 %") is actually met, violated, or conservative. No data, no figures, no
  maintainer.
notes: >
  This is the same shape as the published B1.4 (Weisz-Prater criterion), whose
  finding was non-uniqueness INSIDE the safe band. Expect a related result here
  and reuse B1.4's machinery. Build B1.4's page-reading first so the two pages
  agree on conventions.
  Cross-link: the criteria consume B1.1/B1.3 (effectiveness factor) and A3.4/A3.5
  (film coefficients).
  BUILT 2026-08-06, staged at queue_cases/B1.7/page/, status ready for
  verification. A previous session's partial build_page.py was inherited but
  NOT trusted: the paper was re-read page by page from fresh 300 dpi native
  renders (all criteria and constants verified), and execution exposed and
  fixed four defects in the inherited script - a dead-bracket dimensional heat
  check (rewritten to parametrise the film's low branch by T_s), a
  perturbation-slope check sampling the WRONG END of the branch (deep
  diffusion instead of Phi -> 0; it claimed "confirmed" at 99 % error), a
  "void window" definition with no sign change (the printed bound is liberal
  everywhere - redefined against the unrounded 0.75, giving the asymmetric
  window (0.222, 1.159) at gamma = 30), and a fold-immunity claim resting on a
  zero count that a denser grid refutes (recast as worst-certified-deviation).
  FIXED 2026-08-06 after adversarial verification (review/verification.md,
  verdict safe-after-fixes): the fold-band worst and the joint-pass worst were
  BOTH grid-limited extrema - the shipped 5.7 % is 7.2 % at the root-found
  band edge (the verifier's own 6.8 % was still their grid), and the shipped
  9.0 % is 11.1 % at the interior Bi_m optimum ~6.3 with the pass-set edge
  root-found (the verifier's 9.96 % at Bi_m = 7 was still t-grid-limited);
  cross()'s docstring said the OPPOSITE of what the code returns (it returns
  the deep-side, largest-Phi crossing) - docstring fixed, the three-crossing
  structure above gamma*beta ~ 1.45 printed, and the second mild
  over-certification regime past gamma*beta ~ 1.95 (5.03-5.22 % to gb = 3)
  measured and scoped into the window claim; Carberry's 10.0 % now printed
  under both readings (9.1 % under Mears' surface-referenced eta); the axial
  definition aligned to the fixed-Pe_L implementation with the co-varying
  reading computed beside it (3.80-4.73 %); the theta sign wrinkle put in the
  page prose. Two break rows added for the verifier's uncovered defect
  classes (crossing selection, scan-grid density), both live instances.
  Headline numbers: eq. 17 exact 5 % at n = 1; intraparticle family 6.3-6.8 %
  at printed bounds (the 0.75 rounding IS the 5 % claim); joint pass of
  eqs. 1+17+21 still admits 11.1 %; eq. 1's band certifies eta ~ 3.1e3 on the
  folded branch vs eq. 9's 7.2 %; axial criterion holds, 3.9-4.95 %. Runtime
  ~230 s. 53 agreement metrics, all mapped to break rows or labelled
  structural; three named as below ABS_FLOOR.
