    Identity established from page 2 onward (the section headed "Intraparticle
    Transport", on effectiveness factors and the characteristic particle
    dimension), the running head "Ind. Eng. Chem. Process Des. Develop., Vol. 10,
    No. 4", the file's own Title/Author metadata ("Tests for Transport
    Limitations in Experimental Catalytic Reactors" / D. E. Mears) and the ACS
    download stamp "article-pdf/10/4/541/". 7 pp, journal pages 541-547.
    This is the THIRD file in the repo with the previous-article-first shape
