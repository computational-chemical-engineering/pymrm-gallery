what_it_carries: >
  Reduction kinetics for three oxygen carriers (Cu-, Ni-, Fe-based) with syngas
  (CO + H2) - i.e. the particle-conversion kinetics the case names, for all three
  of the carriers the CLC literature actually uses, in one paper. Framed in the
  CLC context (CO2 capture without a separation step).
validation_route: >
  PRINTED KINETIC PARAMETERS (the paper's deliverable is a kinetic parameter set
  per carrier per gas). Whether the conversion-vs-time curves are tabulated or
  only plotted has NOT been checked off the renders; check before promising an
  overlay. The parameters alone support a page.
notes: >
  Consumes B3.1 (shrinking core, PUBLISHED) and B3.2/B3.4 (grain model and
  additive reaction times, both unblocked in this same drop) - the carriers are
  modelled with exactly those particle models, so this case is a natural
  DOWNSTREAM build. Do not dispatch it before B3.2 and B3.4.
  I1.8 (chemical looping combustion REACTOR) is catalogued to Adánez et al.,
  PECS 38 (2012), which is NOT on disk; this file is particle kinetics, not a
  reactor model, and does not unblock I1.8. Recorded there.
