title: Oxygen-carrier reduction/oxidation
catalog_reference: Abad & Adánez, Chem. Eng. Sci. (2007)
catalog_reference_is_wrong: >
  WRONG JOURNAL. The document on disk is Energy & Fuels 21(4) 1843-1853 (2007),
  read off its own running head ("Energy & Fuels 2007, 21, 1843-1853") and its
  ACS download stamp (article-pdf/21/4/1843/). Right authors, right group, right
  year - wrong container.
  There IS a separate Abad et al. paper in Chem. Eng. Sci. 62 (2007) on mapping
  the operating range for Cu-, Fe- and Ni-based carriers; it is NOT on disk and
  it is not the reduction-KINETICS paper this case needs. Fix the catalogue row
  when the page is built and do not propagate "Chem. Eng. Sci." into meta.yaml or
  models.yaml.
  Same class of error as A1.6 (wrong Wen & Yu paper), A2.9 (wrong journal) and
  A1.8. Note also the pattern that keeps recurring in this repository: author +
  year agree, container does not, and container was not being checked.
