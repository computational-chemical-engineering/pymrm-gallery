notes: 'BUILT 2026-08-14.  Three corrections to this file, all made on renders and none of
  them changing the case:
  (1) THE E1.1 MATERIAL IS SPLIT ACROSS THREE SECTIONS, not concentrated in 6.3.2 as the
  pin says.  Section 6.3.2 (book p. 331) prints F_A = gamma/tanh gamma as (6.3.2-11), the
  chart, and "as first given by Van Krevelen and Hoftijzer [1948]".  The ASSUMPTION quote
  ("under the assumption that B is only weakly depleted near the interface") is in section
  6.3.3, book p. 335.  THE APPROXIMATION ITSELF is (6.3.5-1) in section 6.3.5, book p. 340,
  with "in a way analogous to that applied to pseudo-first-order" and the accuracy claim
  "This approximate solution is valid to within 10 percent of the numerical solution".  The
  target book and chapter are unchanged; the page cites all three sections with book pages.
  (2) LEVENSPIEL''S "5360" IS PRINTED, NOT AN OCR MANGLING.  This file says the second page
  number in his reference-list entry is "an OCR mangling"; on a 600 ppi render the leading
  glyph is the same digit-5 shape as the 5 of "563" earlier on the same line, so book p. 537
  really prints "Trans. I. Chem. E., 32, 5360 (1954)".  Whether 5360 is itself a misprint
  cannot be settled from anything on disk and the page draws no inference from it.
  (3) THE SPELLING DEFECT IS REAL AND IS REPORTED, NOT REPAIRED.  Levenspiel prints "van
  Krevelens" with a terminal s in BOTH places he names him (Fig. 23.4''s caption, book
  p. 530, and the Ch. 23 reference list, book p. 537), checked on 600 ppi renders.  It is
  settled against Froment, who cites the same paper (Rec. Trav. Chim. Pays-Bas 67, 563,
  1948) and spells it Van Krevelen, on a 300 ppi render of his book p. 365.  No citation
  discrepancy was reported: the 1948 and 1954 entries are two publications and Levenspiel
  carries both, exactly as the pin says.'
