e1_1_test: 'PASSED, and on two independent books. FROMENT, DE WILDE & BISCHOFF 3rd edn, Ch. 6: section
  6.3.2 constructs "a diagram showing F_A as a function of gamma, as first given by Van Krevelen and
  Hoftijzer [1948], but only for the case of no reaction in the bulk (Fig. 6.3.2-1)"; the curves for
  moderately fast second-order reactions "were calculated by Van Krevelen and Hoftijzer [1948] under
  the assumption that B is only weakly depleted near the interface"; and where the equations "cannot
  be solved analytically, only numerically ... Van Krevelen and Hoftijzer [1948] dealt with this situation
  in a way analogous to that applied to pseudo-first-order" - i.e. the approximate analytical enhancement
  factor itself. Named, attributed by year, derived, and its assumption stated (weak depletion of
  B) - which is exactly the failure boundary a page should test. LEVENSPIEL 3rd edn Ch. 23/24 carries
  the same result as its E-vs-M_H chart "modified from the numerical solution of van Krevelens and
  Hoftijzer (1954)", with the full citation in the chapter reference list, and discusses the three-zone
  situation the approximation covers. Two independent restatements of the same closed form is a free
  cross-check on every constant.'
what_it_carries: The enhancement factor for a second-order gas-liquid reaction as a function of the
  Hatta number and the infinite-enhancement limit E_i - the classic implicit relation that must be
  solved numerically, and whose usual chart is what the page can replace with a solve. Froment gives
  it in the F_A-versus-gamma form and Levenspiel in the E-versus-M_H form; reconciling the two notations
  is itself worth doing on the page.
origin_not_consulted: 'Van Krevelen & Hoftijzer, Rec. Trav. Chim. 67, 563 (1948), is NOT on disk.
  Both books are restatements with attribution, so this is the reprint route: reference: names the
  origin, reference_read_from: names the books.'
related_published_pages: F3.5 (CO2-amine absorption, published) already runs a film model with parallel
  reversible reactions and reports enhancement factors and promotion factors against Bosch et al.'s
  Table 2. Read it before building this one - its finding that the unpromoted enhancement factors
  agree to 0.6 % while the flux headline is 3.8 % is directly relevant.
