scope_decision: >
  DECIDED BEFORE TRANSCRIPTION, and recorded here as the case yaml asks. The page is
  about THE ISOTHERM AND THE CONSTANTS DERIVED FROM IT - the theory of journal pages
  1368-1376 (Cases I-VI, eqs. 1-33) and Tables II-XI, XIII-XXII, which are the mica
  and glass isotherms and everything Langmuir computes from them. Table XXV is
  carried for one reason only: it exercises eq. (37) on a THIRD adsorbent (312 sq.
  cm. of platinum foil against 5750 of mica and 1966 of glass). TABLES I, XII, XXIII
  AND XXIV ARE SCOPED OUT AND NOT TRANSCRIBED - outgassing inventories and the
  platinum oxygen/carbon-monoxide bookkeeping, which are about the apparatus and
  about irreversible chemisorption, not about the isotherm. Journal pages 1393-1401
  contain no isotherm at all.

  The decision followed the brief's rule - prefer whatever lets you TEST rather than
  restate. Restating q_cal would be restating a fit.
fit_vs_test: >
  LANGMUIR FITTED HIS ISOTHERM TO THE VERY DATA THE PAGE WOULD OTHERWISE COMPARE
  AGAINST, so the q_cal columns of Tables II-XVII are a GOODNESS OF FIT and are
  labelled one in the notebook, in meta.yaml, in models_entry.yaml, in README.md and
  here. He obtained a and b by DRAWING a straight line through p/q against p (eq. 32)
  - not by least squares - and the calculated columns follow from those constants.
  The page reproduces all 101 printed q_cal cells to 0.434 cu.mm at worst and reports
  that as a TRANSCRIPTION CHECK, never as evidence for the model. It is not in
  agreement.json as an agreement.

  NULL BASELINES ARE PRINTED BESIDE EVERY AGREEMENT THE PAGE DOES QUOTE: a
  zero-parameter constant model is 3.7 to 87 times worse in RMS than Langmuir and a
  one-parameter proportional law 1.8 to 27 times, per table, and both are tabulated.

  WHAT IS NOT A FIT, and is where the page's evidence lives: (1) the DISCRIMINATION
  against Freundlich, which Langmuir himself stages in Table VII with the same data
  and the same parameter count and which can fail - with both forms refitted
  optimally the best two-parameter Freundlich is 3.8235 times worse on Table VII and
  worse on 13 of 14 tables, the one exception being the table Langmuir himself
  excludes; (2) the OUT-OF-SAMPLE BOUND beta < 1, whose denominator comes from liquid
  densities and contains no adsorption, holding on all twenty entries with only 16.7
  % of headroom on the tightest row; and (3) the page's own result, that Langmuir's
  Case VI IS the BET isotherm and that his data lie where it cannot be told apart
  from Case I.
incidental_finding_result: >
  CHECKED AND SETTLED, in the direction that matters. Rawlings & Ekerdt, book page
  443, state that the Danckwerts boundary conditions "were derived at least 45 years
  prior to Danckwerts in a classic paper by Langmuir [22]". THEIR REFERENCE [22] IS
  NOT THIS PAPER. Read from their own bibliography (2nd edn, born-digital, clean text
  layer): "[22] I. Langmuir. The velocity of reactions in gases moving through heated
  vessels and the effect of convection and diffusion. J. Am. Chem. Soc., 30(11):1742-
  1754, 1908." Danckwerts 1953 minus 1908 is 45 exactly, which is the arithmetic
  their sentence asserts. Their [32] is Weller, "Langmuir as chemical engineer... or,
  from Danckwerts to Bodenstein and Damkoehler", Chem. Eng. Ed. 28:262-264 (1994),
  which is presumably where the priority claim comes from; it is not on disk either.

  THE 1918 PAPER ON DISK CANNOT SUPPORT OR REFUTE THE ATTRIBUTION. It contains no
  flow, no convection and no boundary condition of any kind. The search: the full
  43-page text was grepped for "convection" (0 hits), "flow" (0), "boundary" (1, in
  van der Waals's liquid-vapour transition layer on journal page 1361), "diffusion"
  (3, all about a mercury-vapour diffusion-pump artefact and gas diffusion between
  bulbs), "velocity" (5, all reaction velocity on platinum), "stream" (0) and
  "mixing" (0); the theory section was read page by page on 300 ppi renders and every
  table was cropped and read. Every apparatus in the paper is a sealed static bulb.

  ACTION FOR THE INTEGRATOR, NOT FOR THIS BUILDER: A2.1 and A2.2 were NOT touched.
  Settling the priority claim needs J. Am. Chem. Soc. 30(11) 1742-1754 (1908), which
  is NOT in ~/papers/pymrm-gallery/. That is an acquisition target and would be a
  genuine attribution finding for the two published Danckwerts pages if obtained.
