fixer_pass: >
  2026-08-08. Applied queue_cases/J1.1/review/verification.md after re-measuring every
  finding. THREE REQUIRED FIXES, all confirmed and all applied. (1) The flagship
  text-layer count was wrong: it is 17 of 20 above unity under 25.2e16, not 19. The
  page now COUNTS it from langmuir-1918-constants.csv in section 6.5 instead of
  typing it into an f-string, prints the three entries that would survive and their
  margin, and the same 17 appears in the break table, README.md, meta.yaml,
  models_entry.yaml, the printed-claims sidecar and this file. (2) A line labelled
  "root-found on the marched solution" was root-found on the CLOSED FORM and its
  2.2e-16 was an algebraic identity presented as a fourth independent route. It is
  now labelled an identity that could not have failed, and a GENUINE root-find on the
  marched trajectory was added beside it: 0.110160 against eq. (16)'s 0.109954,
  1.875e-3 relative, halving with dt over 200-1600 steps at observed order 1.00, with
  its own reported metric and break row. (3) "shares no algebra" was false of the
  newton/Brent pair - they share amp, S and dS and differ only in iteration - and is
  now called a root-finder cross-check wherever it appears; the other independence
  claim (fitting on q versus Langmuir's p/q linearisation) is true and kept.
  UPGRADES TAKEN, each re-measured first: Langmuir's own journal-page-1375 sentence
  ("...then all the coefficients in (29) after b are zero") quoted verbatim off a
  fresh 300 ppi crop as the licence for the collapse; the occupancy ladder summed to
  INFINITY in closed form, giving BET exactly with no truncation anywhere; BET refit
  to Table VII with BOTH parameters free, reaching RMS 0.3501824 against Langmuir's
  0.3501868 and returning Case I's own constants, with a power-check break row; and
  the p/p0 claim widened to every printed pressure in both bulbs and both isotherm
  forms (30 entries, 124 pressures) with the narrower 18-entry separation table's
  scope stated explicitly. MINORS: "far below saturation" corrected to journal page
  1384 (read on my own crop; journal 1385 has no occurrence of the stem at all); the
  "46 hits" for "saturat" replaced by the measured 38 (37 with -layout, the
  difference one hyphenation) with the tool named; the sigma-column truncation
  separated from the four genuine defects and identified positively as a truncation
  convention. UPGRADE DECLINED: the external vapour-pressure corroboration - the page
  has no offline source for modern vapour pressures and typing them from memory is
  what non-negotiable 13 forbids, so a self-contained substitute was added instead
  (root-found: the recovered p0 would have to be a factor 12.145 too high for scatter
  and separation to reach parity). Nothing on the "held under attack" list was
  weakened. 58 metrics, 64 break rows, 62 moving; two consecutive executions give
  identical cell content, identical figure hashes and an identical agreement.json.
