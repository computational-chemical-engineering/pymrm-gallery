printed_defects: >
  FOUR, ALL REPORTED AND NONE REPAIRED, each proved from the paper's own numbers in
  the F2.3 order, PLUS one reporting convention filed separately. (1) EQ. (15)'s logarithm is printed as ln[theta'/(theta1 - theta')]
  and gives t_half = 0 at theta' = theta1/2, contradicting eq. (16) two lines below,
  which Langmuir derives BY making that substitution; it also gives t = -infinity at
  theta' = 0. Proved by MARCHING eq. (14) with a newton-solved implicit step rather
  than by asserting it; the one-character correction (theta_1 in the numerator) is
  labelled an inference. (2) TABLE IV's b = 58.3: the table's two observations
  determine b exactly at 57.4937 and the paper's own b' = 100.0 requires 57.5000, two
  independent routes agreeing to 0.011 %, while 58.3 is 1.40 % from both; Tables V
  and XVII pass the same test and Table IV is the only mica table with no q_cal
  column. (3) TABLE XX's beta = 0.36 for methane on glass, where the paper's own N0 =
  0.288e15 and its own methane monolayer count 0.63e15 give 0.4571 - proved twice,
  because the printed value also uniquely breaks journal page 1391's own claim that
  the adsorption order is the same under b', N0 and beta in all three sets. (4) The
  pair "(100 bars) ... 0.20" on journal page 1384: with Table VII's own a = 0.156 the
  companion claim 0.684 at 3 bars is reproduced (0.6812) but 0.20 corresponds to
  25.641 bars, and at the printed 100 bars the same curve gives 0.0602. Two readings
  are printed and neither adopted. AND, FILED SEPARATELY FROM THOSE FOUR BECAUSE IT IS
  A REPORTING CONVENTION AND NOT AN ERROR: the sigma column of Tables XVIII-XX runs
  low, 18 of 21 printed values below the computed one, worst 3.77 %. The three worst
  rows are exactly the rows Langmuir prints to one or two significant figures
  (10,000; 10,000; 26,000), and truncating at each cell's own printed granularity
  reproduces 15 of 21 cells against 11 for rounding.
text_layer_warning: >
  THE TEXT LAYER RENDERS EQ. (37) AS N0 = 25.2 x 10^16 b/s WHERE THE PAGE PRINTS
  10^15. That is a factor ten in every N0 and every beta in the paper and would put
  17 of 20 entries above the monolayer bound, reversing Langmuir's central
  conclusion (the three that would survive are the mica 155 K oxygen, argon and
  nitrogen entries, each an order of magnitude clear of the threshold; the count is
  computed by the notebook, not typed). Confirmed on a 300 ppi crop AND by arithmetic: the coefficient must be
  N x 4.16e-8 = 2.521e16 = 25.2e15. The text layer also mangled half the b column of
  Table X and destroyed the column alignment of Table XXII entirely.
