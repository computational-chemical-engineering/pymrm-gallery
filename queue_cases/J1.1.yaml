scope: FORTY-THREE PAGES. The isotherm is a small part of a very long experimental paper on adsorption
  at low pressures on glass, mica and platinum. Decide what the page is about before transcribing
  - the isotherm derivation, or the measurements it was fitted to.
incidental_finding: Rawlings & Ekerdt (2nd edn, also on disk) record that the Danckwerts boundary
  conditions "were derived at least 45 years prior to Danckwerts in a classic paper by Langmuir".
  That claim is now checkable against this very file, and it bears on the published A2.1/A2.2.
