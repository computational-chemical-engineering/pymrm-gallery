notes: >
  PRE-DISPATCH RENDER DONE, 2026-08-08 (coordinator), and it DEMOTES this case.
  The table-vs-figure question is settled the wrong way: the paper is
  FIGURE-ONLY. There is no table anywhere in the seven text pages. The primary
  data - metastable zone width vs cooling rate for the four salts - are plotted
  points on the log-log Figs. 2-5 (KCl, then three further salts in Figs. 3-5),
  and the derived results are scatter plots too (Fig. 6 m vs molecular weight,
  Figs. 7-10). The paper says its own dataset was reduced elsewhere: "the
  experimental data of more than 25 substances were treated by the method of
  least squares and yielded results whose preliminary evaluation shows some
  interesting correlations" - the fitted k and m per substance are shown as
  points, never printed as numbers.
  Consequence: the `what_it_carries` route ("from the measured zone width at
  various cooling rates b, k and the nucleation order m are extracted") requires
  DIGITISING the authors' own plots, which is load-bearing digitisation and so
  stalls at the review gate - the A3.14 precedent, and A3.12's owed figure
  review is already an open maintainer item. Do not dispatch this as a
  data-comparison page.
  If it is built at all, the honest route is J1.4-shaped: prove the printed
  structure - eqs. (12)-(16) close to log b = (m-1)log(...) - log a + log k +
  m log(dt_max), whose slope IS the nucleation order m - and then MEASURE what
  a three-cooling-rate design (the paper's own "three different cooling rates
  b") can and cannot resolve about m. That needs no digitisation and no
  maintainer. Decide the scope before dispatching; it is no longer the small
  S1 the 2026-08-08 model-split note assumed.
