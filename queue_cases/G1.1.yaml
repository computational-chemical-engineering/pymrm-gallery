  down the same page. Do not reject the file from the first screen.
what_it_carries: 'From the abstract: pressure drop and liquid saturation for two-phase concurrent
  flow, in a variety of packings and gas-liquid systems with a wide range of fluid properties; two
  basic flow patterns for nonfoaming systems; and correlations of pressure-drop and liquid-saturation
  data expressed in terms of the SINGLE-PHASE friction losses of each fluid flowing alone in the bed
  - i.e. the Lockhart-Martinelli-style construction the case is for. Deviations for foaming systems
  are discussed and illustrated with sample data, which is a separate, honest scope boundary for the
  page.'
