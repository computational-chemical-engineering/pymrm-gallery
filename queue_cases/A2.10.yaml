what_it_carries: >
  * The zone model itself: each zone is a perfectly mixed vessel, with the mass
    balance and species balance written out in section 4, step 4.
  * A fully specified test case whose parameters are all printed: a
    10 m x 2 m x 10 m tank with a 1 x 1 m offset inlet and outlet, water-like
    fluid (rho = 1000 kg/m3, mu = 1e-3 kg/(m s)), inlet velocity 0.5 m/s
    (500 kg/s), tracer switch from x_A = 1 to x_B = 1, meshed at 50 x 10 x 50 =
    25,000 cells, zoned to about 100 zones.
  * Tables 1 and 2: numeric assessment criteria for the zoning algorithms Theta
    and Theta_H, and for the aggregation of zones smaller than five cells.
  * The two automatic-zoning algorithms in full, which is the paper's own
    contribution and what the title promises.

scope_warning: >
  READ THIS BEFORE DISPATCHING. Two things bound what a page can honestly claim.

    * PART I IS NOT ON DISK. Part I is a DIFFERENT, THREE-AUTHOR paper (Bezzo,
      Macchietto & Pantelides, 2003) and it is where the multizonal/CFD framework
      is derived. Part II cites it repeatedly for the framework, the interface
      definitions and the flowrate-subset algorithms. Part II is self-contained
      for the ZONE MODEL and the ZONING ALGORITHMS; it is not self-contained for
      the framework. Say on the page which document each equation came from.
    * THE ZONE NETWORK COMES FROM A CFD SOLUTION THE GALLERY CANNOT REPRODUCE.
      Step 1 of the test case is a steady-state 25,000-cell Navier-Stokes
      solution, and the zoning algorithms consume its velocity and dissipation
      fields. pymrm does not solve that. So an honest A2.10 page reproduces the
      COMPARTMENT-MODEL half - given a network and inter-zone flows, integrate
      the tracer response and compare mixing curves - and states plainly that
      the network was taken from the paper rather than generated. Do not
      manufacture a CFD field and present it as the paper's.
  This is a scope decision, not a blocker. It is why the case is P3/T2 and why
  it should not be dispatched ahead of the P1/P2 cases this batch unblocked.

validation_route: printed tables (Tables 1 and 2), but see scope_warning
