integrator_notes: >
  Target directory pages/A1.7-geldart-classification/. A1.7 is NOT in models.yaml;
  splice queue_cases/A1.7/models_entry.yaml into section A. slug and title there
  match meta.yaml exactly.

  Runtime 4 s, executed with nbclient (timeout 1800, kernel python3, resources
  path "."). No errors, nothing suppressed. pymrm 2.3.1.dev3.

  The notebook loads its CSV through gallery_utils.load_data with
  page="A1.7-geldart-classification", so the Colab raw-URL fallback resolves once
  the directory is at that path.

  Section order follows the AGENTS.md contract: Background, The published model,
  Parameters and assumptions, The data, PyMRM implementation, Results,
  Validation, What pymrm adds, Reuse. No Quarto callouts or shortcodes anywhere.

  The page reuses E1.2's percolation operator (its solve_mode / davidson_bubble,
  condensed, with the sabotage hooks removed) and E1.2's closed form for R_c/R,
  and says so in the code docstring, in the PyMRM implementation section and in
  the validation caveats. If E1.2 changes, this page's cloud numbers move with
  it - a statement now ON THE PAGE, in the PyMRM implementation section and in
  "What pymrm adds", not only here.

  queue_cases/A1.7/review/ contains only verification.md, the adversarial
  verification report. Nothing was digitised, so there is no overlay to review
  and no page image anywhere in the tree.

  meta.yaml and models_entry.yaml both carry status: in-progress. Flip both to
  published on merge.

notes: >
  Attribution check, per the handoff's "expect the received attribution to be
  wrong": here it is right. The catalogue names Geldart, Powder Technol. 7:285
  (1973), and that is exactly the paper on disk and exactly the origin of the
  classification. What is NOT Geldart's, and is recorded as origin_not_consulted
  in models_entry.yaml, is eq. (3) (Davies & Richardson 1966, his ref. 11),
  eq. (9) (Verloop & Heertjes, ref. 10) and eq. (10) (Oltrogge, ref. 36). None of
  those three is on disk; all are used exactly as Geldart prints them.

  Two degraded glyphs in the scan were resolved from surrounding text and are
  recorded as judgements, not inferred digits: the exponent in eq. (7) is a half
  power, and the heading of Table 1's fifth column is U_MB (the printed subscript
  scans as "MP").
