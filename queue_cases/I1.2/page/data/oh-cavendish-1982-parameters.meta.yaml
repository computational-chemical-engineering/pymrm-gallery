dataset_id: oh-cavendish-1982-parameters
title: Standard parameter set and kinetic constants for the monolith model
status: complete

source:
  authors:
    - "Oh, S. H."
    - "Cavendish, J. C."
  year: 1982
  container: "Industrial & Engineering Chemistry Product Research and Development 21(1) 29-37"
  doi: 10.1021/i300005a006
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

provenance_tier:
  tier: 2
  note: >
    Printed tables and displayed equations, transcribed as numbers. Table I is
    the authors' standard parameter set; eqs 1-8 are the rate expressions,
    which the authors obtained by recalibrating only the pre-exponential
    factors of Voltz et al. (1973) against their own recycle-reactor data
    (Schlatter and Chou, 1978). The activation energies and adsorption
    equilibrium constants are Voltz's unchanged.

acquisition:
  method: table
  figure: "Table I (journal page 31) and eqs 1-8 (journal page 30)"
  tool: "poppler pdftoppm at 600 dpi; every value read from the rendered page image"
  procedure: >
    The scan has a good text layer (~9000 characters per page) but it mangles
    the equations badly: eq 5 comes out of pdftotext as "6.699 X 109
    exp(-12556/T)" with the exponent flattened into the mantissa, and eq 6's
    K2 reads "2,08 X 103". Every constant was therefore read off a 600 dpi
    render rather than transcribed from the text layer.
  operator: "Claude Opus 5 (assisted), reviewed by the gallery maintainers"
  date: 2026-07-30
  estimated_error: >
    None beyond the paper's own rounding (4 significant figures for the rate
    constants and Table I).

completeness:
  note: >
    Table I is complete. Four quantities the model needs are NOT in the paper
    and are not in this file, because inventing them would be fabrication:
    (1) the limiting Nusselt and Sherwood numbers - the paper says only that
    they come from Shah and London (1971) for fully developed laminar flow with
    constant wall heat flux; (2) the molecular diffusivities D_i - the paper
    names the Slattery-Bird formula and cites Bird et al. (1960) p. 505, so the
    formula is reproducible but the numbers are not printed; (3) the heats of
    combustion (-dH)_i, which are standard thermochemistry; (4) the mean
    molecular weight of the exhaust. The notebook derives each of these from a
    named external source and says so.

columns:
  - {name: symbol,      unit: "-",      description: "symbol as printed in the paper"}
  - {name: value,       unit: varies,   description: "value as printed"}
  - {name: unit,        unit: "-",      description: "unit"}
  - {name: description, unit: "-",      description: "what the quantity is"}
  - {name: case,        unit: "-",      description: "case 1, case 2, or both"}
  - {name: source,      unit: "-",      description: "where in the paper it comes from"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3), which cannot be overridden
  by contract. No page image is reproduced.
