  licence: "all rights reserved (facts extracted)"

acquisition:
  method: "read from 600 dpi page renders"
  procedure: >
    The paper has no text layer of any kind, so every number was read off an
    image. k1 = 150 and k2 = 1.75 and the count of 640 experiments are printed in
    the running text of journal page 91, immediately after eq. (13b); the same two
    constants appear again in eq. (13c) on page 92 and in the abstract equation on
    page 89. Three independent printings of the same two numbers, all read.

    `kozeny_carman_line_fv_measured` is NOT printed anywhere. It is the ordinate
    of the horizontal dashed line that Figure 6 labels "Kozeny - Carman",
    measured on the render: the ink-weighted centre of the dashed line over an
    abscissa window clear of the label and of the data is row 3904.2, and the
    Figure 6 ordinate is calibrated from its own decade ladder (10^4 at row
    2729.3, 10^2 at row 4015.9, 643.3 px per decade). It is reported because it
    settles a real ambiguity: Carman's own sphere constant gives 180 in these
    coordinates, which would sit 52 px higher and is excluded outright.

    `carman_kozeny_constant_k` and `carman_kozeny_fv` come from Eisfeld &
    Schnitzlein (2001), who write the hydraulic-radius result as
    psi = 6^(3-n) k Re^(n-2) (1-eps)^(3-n)/eps^3 and state k = 5 for spheres at
    n = 1. Carman (1937) itself was not consulted.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-07-30
  estimated_error: >
    The printed constants are exact as printed. The measured line level carries
    +/- 0.5 (one scan pixel, 0.35 %).

