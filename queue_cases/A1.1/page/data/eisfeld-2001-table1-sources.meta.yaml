dataset_id: eisfeld-2001-table1-sources
title: "Tube-to-particle diameter ratios for the very data sets Ergun plotted"
status: complete
purpose: >
  Ergun's Figure 7 carries no D/dp information, so on his axes the wall effect
  cannot be located. Eisfeld & Schnitzlein re-catalogued the same primary sources
  half a century later and their Table 1 gives the D/dp range of each. That is
  what lets this page mark which of Ergun's three panels sits inside the
  wall-effect regime - Morcom's, at D/dp = 3.7 to 9.1 for spheres, tablets and
  nodules.

source:
  authors:
    - "Eisfeld, B."
    - "Schnitzlein, K."
  year: 2001
  container: "Chemical Engineering Science 56(14) 4321-4329"
  doi: 10.1016/S0009-2509(00)00533-9
  access: "Elsevier full-text API, institutional key (lawful access)"
  licence: "all rights reserved (facts extracted)"

acquisition:
  method: "transcribed from the publisher's full text"
  tables: "Table 1, the rows whose primary sources also appear in Ergun (1952)"
  operator: "Claude Opus 5 (assisted)"
  date: 2026-07-30
  caveats: >
    These are Eisfeld & Schnitzlein's counts and ranges for THEIR extraction of
    each primary source, not Ergun's. The two need not contain the same runs -
    Ergun explicitly dropped the mixtures and the D/dp < 10 systems from Burke &
    Plummer (journal page 93), and Eisfeld's Burke & Plummer row still reaches
    down to D/dp = 5.379. The mapping to Ergun's panels is therefore
    source-level, not point-level, and the page uses it that way: to say which
    panel is dominated by small D/dp, never to attach a D/dp to an individual
    marker. `ergun_fig7_panel` is blank for sources that appear only in Ergun's
    Figures 6 and 8.
    Ergun & Orning (1949) is listed because it is Ergun's own earlier
    sphere work; it is NOT the "Present investigation" panel of the 1952 paper,
    which is crushed porous coke.

columns:
  - {name: source, unit: "-", description: "primary reference"}
  - {name: particles, unit: "-", description: "particle type"}
  - {name: n_data, unit: "-", description: "points in Eisfeld's database from that source"}
  - {name: D_over_dp_min, unit: "-", description: "minimum tube-to-particle diameter ratio"}
  - {name: D_over_dp_max, unit: "-", description: "maximum; equals the minimum where only one value is listed"}
  - {name: eps_min, unit: "-", description: "minimum mean voidage"}
  - {name: eps_max, unit: "-", description: "maximum mean voidage"}
  - {name: Re_dp_min, unit: "-", description: "minimum particle Reynolds number"}
  - {name: Re_dp_max, unit: "-", description: "maximum particle Reynolds number"}
  - {name: ergun_fig7_panel, unit: "-", description: "which panel of Ergun's Fig. 7 this source is plotted in, blank if none"}

