blocker:
  kind: paper
  question: >
    Please supply a paper containing MEASURED ternary Stefan-tube compositions -
    the classic is Carty, R. & Schrodt, T. (1975), "Concentration profiles in
    ternary gaseous diffusion", Ind. Eng. Chem. Fundam. 14, 276-278
    (acetone/methanol/air). Any equivalent published dataset would do.
  detail: >
    WHY THE 2013 PAPER DOES NOT CLOSE THIS CASE. Read this before requesting
    again, and before assuming the case is served.

    A4.8 is catalogued as the "classic MS validation EXPERIMENT" - the whole
    point of the case is that Maxwell-Stefan is tested against measurements that
    Fick's law cannot reproduce, the same argument that makes A4.9 (Duncan-Toor)
    the strongest early page in the gallery.

    Mills & Chang is not that. It is a BINARY problem (water vapour evaporating
    into air), solved in TWO dimensions with the Navier-Stokes equations plus a
    Kramers-Kistemaker diffusion-slip wall condition, and its purpose is to rebut
    Salcedo-Diaz et al. (2008) and the Kerkhof-Geboers "Unified Theory". It is a
    polemic between two modelling frameworks.

    It contains NO experimental data and NO tables of any kind. Every result -
    axial and radial velocity profiles, the pressure field, species mass fluxes,
    vapour mass fraction, absolute air velocity - is a figure (Figs. 1-9). So
    even the model-versus-model comparison it does make is only reproducible by
    digitising figures, which parks at the figure-review gate that currently has
    no maintainer.

    What it IS good for, and what should be recorded rather than rediscovered:
    it states the one-dimensional classical solution ("diffusion with one
    component stationary") and its history - Lee & Wilke (1954) and Heinzelmann
    et al. (1965) on end effects, McDonald et al. (1971) and Meyer & Kostin
    (1975) on the first 2-D solutions with a no-slip wall - and it quantifies the
    diffusion-slip velocity for water into air as "at most about 25% of the bulk
    velocity". If A4.8 is ever built as a 1-D-versus-2-D page rather than a
    model-versus-data page, this is its source.
  artifacts:
  - the 2013 paper, at ~/papers/pymrm-gallery/1-s2.0-S0009250912007099-main.pdf
  - the identification record in docs/papers-on-disk.yaml, under "ON DISK, IDENTIFIED,
