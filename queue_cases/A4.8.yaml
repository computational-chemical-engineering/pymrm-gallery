e1_1_test: 'PASSED, with one caveat that decides whether this page needs the review gate. Example
  2.1.1, "Multicomponent Diffusion in a Stefan Tube: An Experimental Test of the Maxwell-Stefan Equations",
  reproduces the experiment this case was blocked on BY NAME - "In an attempt to check the validity
  of the Maxwell-Stefan equations Carty and Schrodt (1975) evaporated a binary liquid mixture of acetone(1)
  and methanol(2) in a Stefan tube. Air(3) was used as the carrier gas." It PRINTS the conditions:
  x1 = 0.319 and x2 = 0.528 at the liquid surface, 99.4 kPa, 328.5 K, diffusion path 0.238 m, D12
  = 8.48, D13 = 13.72, D23 = 19.91 mm2/s; and it PRINTS the converged fluxes N1 = 1.783e-3 and N2
  = 3.127e-3 mol/m2 s with N3 = 0. Section 8.6 then works the SAME experiment with effective-diffusivity
  methods (Example 8.6.1) and compares against the exact and linearized matrix solutions - which is
  precisely the Fick-vs-Maxwell-Stefan discrimination this case exists for. CAVEAT: the measured composition
  PROFILES are Figure 2.5, a figure. The fluxes and the conditions are printed; the scatter is not.
  A page built on the printed fluxes and the method comparison needs NO figure digitisation and NO
  maintainer gate. A page that wants the measured profiles does.'
the_other_half: 'Bird, Stewart & Lightfoot 2nd edn, also on disk, carries the ARNOLD half of this
  case: section 18.2 "Diffusion through a Stagnant Gas Film" (book p. 545) with Example 18.2-2 "Determination
  of Diffusivity" - the Stefan tube as a measuring instrument - and section 20.1 Example 20.1-1 "Unsteady-State
  Evaporation of a Liquid (the ''Arnold Problem'')" (book p. 613), ATTRIBUTED to J. H. Arnold, Trans.
  AIChE 40, 361-378 (1944), with Table 20.1-1 of the phi functions and problems 20B.1/20B.2 extending
  it. Both halves of "Stefan tube / Arnold diffusion" are therefore sourced.'
near_miss_still_on_disk: 'Mills2013-two-dimensional-stefan-tube-CES90-130.pdf is a Stefan-tube paper
  and does NOT close this case: it is a BINARY water-vapour-into-air 2-D Navier-Stokes computation
  written to rebut Salcedo-Diaz et al. (2008) and the Kerkhof-Geboers equations, with no experimental
  data and no tables of any kind. It remains a modelling-context secondary.'
text_layer:
  quality: ABBYY over bilevel. Prose excellent; symbols degrade badly - the Maxwell-Stefan D-with-bar
    renders as "£>", so "D12 = 8.48" comes out as "£>12 = 8.48mm2/s". Every constant off a crop.
  render_at: 600 dpi. JBIG2 bilevel at 600 x 600 ppi native.
