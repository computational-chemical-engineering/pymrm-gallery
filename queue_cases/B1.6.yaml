notes: >
  Built 2026-07-31, staged at queue_cases/B1.6/page/. The earlier `needs-paper`
  block is lifted and removed: Prater (1958) itself is still not on disk and
  still has no open-access route, but it is NOT needed. Weisz & Hicks (1962) -
  already on disk and already the source for the published B1.1/B1.5 page -
  print the relation as their eq. (7) and attribute it to Prater for any particle
  geometry, citing Damkoehler for the sphere. Eqs. (4), (5), (7) and (8) were
  read off a 600 dpi render of journal page 266; the text layer mangles them
  (`AT = T - To = - F`, `[grad ~1,~~`). The page states explicitly that Prater
  1958 was not consulted, and its DOI (10.1016/0009-2509(58)85035-6) was resolved
  via CrossRef and checked against the volume and page in Weisz & Hicks' own
  reference [11] ("PRATER C. D., Chem. Engng. Sci. 1958 8 284").

  Finding worth carrying: the two printed expressions for beta in eq. (8) carry
  OPPOSITE signs - eq. (7) at c -> 0 gives -(c_0 H D)/(K T_0) while eq. (8)
  writes +(c_0 H D)/(K T_0) = (dT/T_0)_max. The page prints both alternatives and
  shows that the paper's own eq. (8) rate exponent, its stated sweep of beta from
  0 to +0.8 for exothermic reactions, and its eta > 1 result all select
  beta = +(dT/T_0)_max. Nothing was repaired by inference.

  Validation route 2 (an internal identity the model must satisfy); no figure
  digitised and none needed, so no maintainer review gate. Tier 6 - an identity
  proof plus numerical confirmation, NOT experimental validation, and the page
  says so in five places.

  REVISED 2026-08-01 after adversarial verification (report kept at
  queue_cases/B1.6/review/verification.md). The physics, derivations and
  transcription all survived attack unchanged, including the sign contradiction
  in Weisz & Hicks and the transient breakdown, which the verifier reproduced on
  an independent node-based finite-difference discretisation (Le = 10 gives
  0.2519 on two grids and two schemes). What was wrong was the page's account of
  what its numbers proved, and that has been rewritten. Three claims were false
  and are gone from every location including meta.yaml: that the sweep residual
  "measures the nonlinear solve" (it is 8.5e-12 for a Newton iterate with
  y = 2.12 at the centre), that it "would catch a mismatched geometry index" (it
  is 4.7e-12 while eta is 57 % wrong, and one construct_div serves both columns
  so the defect cannot even be constructed per field), and that the collocation
  section "removes the shared-operator objection" (the collocation inherits the
  invariant identically; 6 of its 12 solves do not even reach their own
  tolerance, and the residual does not notice).

  Headline numbers. What the sweep residual IS: a floating-point measurement,
  1.1e-11 worst over 324 pymrm two-field solves (median 8.9e-13), with
  convergence asserted separately through the Newton residual (worst 4.6e-11).
  What it detects, now measured on the page by injection rather than asserted -
  heat-source sign flip 4.2e-01, 1 % heat-source scale error exactly 1.0e-02,
  boundary-condition type mismatch 1.6e-01, rate at an inconsistent state
  5.4e-01, i.e. linear in the defect. What it is blind to, also measured:
  non-converged Newton 1.1e-11, wrong geometry index 4.7e-12 (eta 57 % wrong),
  3-cell grid 2.4e-15 (eta 37 % wrong - BETTER than at n_u = 200). The checks
  that can fail are the two profile comparisons: pymrm against the collocation
  solution, 1.0e-06 at n_u = 800 at second order (and it correctly flags the one
  case where the collocation reference itself did not converge, stalling at
  9.3e-05), and pymrm against B1.1's shooting reference, 3.9e-05 at n_u = 800,
  observed order 2.11. The collocation identity residual (2.6e-13), the beta
  recovery (3.3e-10) and the reduced-equation match (6.1e-12 in y) are kept but
  labelled as inherited identities - convention and implementation checks
  between pages, not corroboration. Breakdowns: with a film the bulk-referenced
  relation is wrong by beta(1-y_s)(Bi_m/Bi_h - 1), a closed form derived on the
  page and matched to 1.9e-11 relative - but the match is forced by the discrete
  harmonicity (5.6e-14 on an 8-cell grid), so it confirms the algebra, not the
  solve; the surface-referenced relation still holds to 5.5e-12. In a transient
  the relation is exact iff Le = 1 (control 3.5e-13) and is violated by up to
  0.252 of beta otherwise.

  Integrator notes: no new pip dependencies (sympy is already in
  requirements.txt, added for J4.8). No data/ directory and no sidecar - no
  numbers are transcribed, only equations. B1.6 is not yet in models.yaml, so
  queue_cases/B1.6/models_entry.yaml is a NEW entry to append in section-B order
  after B1.5, not an upgrade in place; B1.5's `related:` list already names B1.6.
  Notebook runtime ~64 s. report_agreement now carries 17 metrics: the four
  defect-sensitivity numbers and the three blindness numbers are CI-visible, the
  Newton residual and the two profile comparisons were added, and
  beta_recovery_vs_B1_5 was dropped because it only re-encoded the sweep
  residual divided by (1-y).
