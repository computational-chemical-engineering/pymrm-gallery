  question: 'Two things in the printed model could not be settled from the paper and
    are worth a second opinion. (1) Appendix A says the PEO-LiCF3SO3 conductivity
    ''was fit to a third-order polynomial'' and cites ref. 19, but prints no coefficients
    and no kappa(c) figure. It was reconstructed by inverting the paper''s own eqs.
    28 and 29, which both contain (1/kappa + 1/sigma), giving kappa_eff = 7.97e-3
    and 6.72e-3 S/m - 19 % apart. (2) Eq. 5 omits the factor nu = 2 that a 1:1 salt
    requires. Figure 2 cannot decide it: nu = 1 fits slightly better (18.2 vs 25.5
    mV) but nu = 2 gives better transport limits, and the two bracket the published
    curves. The page uses nu = 2 on the thermodynamic argument and prints both.'
  detail: 'Not blocking - the page is live and states both openly rather than choosing
    by fit. If you have the Bouridah/Fauteux conductivity data (ref. 19/20) the reconstruction
    could be replaced by the real polynomial, which would also sharpen the charge-curve
    residual: the charge bias is +64 mV against -24 mV on discharge, the signature
    of series resistance and therefore of exactly this reconstructed kappa.'
