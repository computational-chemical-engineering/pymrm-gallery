  status: published
  tier: T1
  priority: P1
  structures: [S3, S10]
  phases: [gas-liquid]
  reference:
    authors: ["Bosch, H.", "Versteeg, G. F.", "van Swaaij, W. P. M."]
    year: 1989
    container: "Chemical Engineering Science 44(11) 2735-2743"
    doi: 10.1016/0009-2509(89)85216-9
  # note: the catalogue's original citation "Versteeg & van Swaaij (1988);
  # Danckwerts & Sharma" pointed at the group's kinetics paper; the model the
  # case wants is carried by Bosch et al. (1989) part II, used here. The 1988
  # kinetics paper supplies this paper's correlation (11).
  predicts: [enhancement factor, promotion factor, absorption and desorption flux, film concentration profiles]
