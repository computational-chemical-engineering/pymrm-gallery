- id: F3.5
  slug: co2-amine-absorption
  title: "CO2 absorption into amine-promoted carbonate solutions"
  description: >
    Seven species, two kinetic reactions and two acid-base equilibria in a
    stagnant film: the rigorous reversible-network model that settled the
    shuttle-versus-homogeneous-catalysis debate for amine-promoted hot
    potash, reproduced against the paper's Table 2 and desorption result -
    including a one-scalar reconstruction, from the paper's own numbers, of
    the equilibrium constant its code must have used, with the evidence
    against that reconstruction reported alongside the evidence for it.
