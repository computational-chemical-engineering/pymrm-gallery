e1_1_test: 'PASSED. Chapter 2 "Kinetics of Homogeneous Reactions" splits exactly the way this case
  does: section 2.1 "Concentration-Dependent Term of a Rate Equation" (book p. 14) and section 2.2
  "Temperature-Dependent Term of a Rate Equation" (book p. 27). It also states a consequence the page
  can TEST rather than restate: the rate is far more temperature-sensitive at low temperature than
  at high, and the frequency factor does not affect the temperature SENSITIVITY. Sections 2.3-2.4
  add the mechanism and theory limits.'
catalogue_note: C1.5's catalog_reference was "-" (empty) - no citation at all - so this fills a case
  that was previously unbuildable under AGENTS.md regardless of difficulty.
other_sources_on_disk: 'Rawlings & Ekerdt 2nd edn also passes: their Ch. 5 eqs. 5.32/5.33 give the
  Arrhenius form with the weak prefactor dependence k0 = A T^B, -2 <= B <= 1, and the stated validity
  condition Ea >> B kB T - itself a testable claim, and their text layer is clean.'
