what_it_carries: >
  * The subject the case is for. The paper reviews the standard two-parameter
    quasi-homogeneous model - Coberly & Marshall (1951) and Brötz (1951),
    "Standardmodell" after Tsotsas - writes out its governing equation and
    boundary conditions (1a) etc. with the wall condition
    -lambda_r dT/dr = alpha_w(T_w - T) at r = R, and then confronts it with
    three independent 1991 experimental studies performed in parallel: Nilles
    (steam-heated), Freiwald (electrically heated) and Borkink (water-cooled),
    on tubes of comparable dimensions, covering D/d from 1.17 to 51.
  * Radial temperature profiles (Abb. 5-7, 9, 10), the standard deviation of the
    fitted parameters, the fraction of the total resistance carried by the wall
    (Abb. 8), and lambda_r/lambda_f against Péclet number (Abb. 11) with symbols
    keyed to the three data sets.
  * Its stated purpose is to resolve, for the first time, the long-standing
    discrepancies between empirical correlations for the wall and radial
    parameters - which is exactly what the catalogue asks A3.14 to deliver.

  IT CONTAINS NO TABLES AT ALL. Checked: the string "Tabelle" does not occur
  anywhere in the ten pages. Every quantitative result is in Abb. 1-11.

validation_route: >
  FIGURE-ONLY. This is the constraint that ranks the case. There is no printed
  table to reproduce, so any validation against the paper's measurements requires
  digitising its figures, which produces review overlays of copyrighted page
  images and parks at the figure-review gate. AS OF 2026-08-05 THERE IS NO
  MAINTAINER AVAILABLE FOR THAT REVIEW, so a builder dispatched here will finish
  the extraction and then stop.
  Two honest alternatives if the case is dispatched anyway:
    (a) build the standard two-parameter model itself, validate it against
        analytical limits and grid independence, transcribe the correlations, and
        report NO comparison against Martin & Nilles' data - saying so plainly;
    (b) wait for a maintainer.
  Do not fabricate a comparison, and do not quote numbers read off an axis as
  though they were printed.

related_on_disk: >
  A3.12 (Yagi & Kunii 1957) and A3.11 (Dixon & Cresswell 1979) are both about
  the same two parameters and both have their papers on disk; A3.12 HAS A LIVE
  BUILDER as of 2026-08-05. Martin & Nilles is in part a verdict on that
  literature, so whichever page is built last must read the others and reconcile.
