language_warning: >
  IN GERMAN, and it must be treated with the same care A3.15's builder is
  currently applying to the 1882 Graetz paper. Specific traps in this file:
    * The OCR STRIPS EVERY UMLAUT AND ESZETT. "Wärmeleitung" comes back as
      "Warmeleitung", "durchströmten" as "durchstromten", "Schüttungsrohren" as
      "Schuttungsrohren", "Einfluß" as "EinfluB". Do not conclude the paper uses
      unaccented spellings; it does not.
    * GERMAN DECIMAL COMMA. "L/D = 0,43 bis 2,5" means 0.43 to 2.5. A
      decimal-point substitution applied blindly will corrupt every number, and
      a reader expecting a point will read "0,43" as two values.
    * SUPERSCRIPT POWERS OF TEN COLLAPSE INTO THE LETTERS "lo". Axis labels
      10^3, 10^4, 10^5 come back as "lo3", "lo4", "lo5". Every figure axis in
      this paper is logarithmic.
    * Figures are "Abb." (Abbildung), not "Fig." - a grep for "Fig" finds
      nothing and will make you think the paper has no figures. It has eleven.

text_layer:
