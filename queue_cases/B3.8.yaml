what_it_carries: >
  Both named models, in their origin papers, plus the coal-type generalisation:
  * CPD 1989: percolation lattice statistics in CLOSED FORM, explicitly to avoid
    Monte Carlo; the critical bridge population depending only on site
    coordination number; tar identified with finite clusters and light gases with
    bridge material; predictions for a lignite, a subbituminous and a
    high-volatile bituminous coal.
  * CPD 1992 (part 3): vapour-liquid equilibrium, cross-linking/metaplast
    reattachment, a generalised vapour-pressure correlation for high-molecular-weight
    hydrocarbons, COAL-INDEPENDENT kinetic parameters, and structure coefficients
    taken from NMR - the paper stresses this is "in contrast to the previous and
    common practice of adjusting input coefficients to precisely match measured
    tar and total volatiles yields", which is precisely the anti-circularity the
    gallery cares about.
  * FG-DVC 1988: the functional-group + statistical tar model, with one cross-link
    per CO2 or CH4 molecule evolved, compared against Pittsburgh Seam coal and
    North Dakota (Beulah) lignite for volatile yields, extract yields, cross-link
    densities and tar molecular weight distributions, over pressure, temperature,
    rank and heating rate.
validation_route: >
  PRINTED PARAMETER TABLES in all three, and the CPD 1992 paper's whole argument
  is that its inputs are measured (NMR) rather than fitted - so the page can
  state the inputs' provenance without circularity. The yield comparisons
  themselves are largely FIGURES; a page that exercises the models on the printed
  structure coefficients is fine, one that validates against the measured yield
  curves needs the review gate, and no maintainer is available as of 2026-08-05.
notes: >
  P3/T2 - this is a large extraction (three papers, 42 pages, a lattice
  statistics model) for a low-priority case. Do not dispatch it ahead of the
  T0/P1 work in this drop. Its value is that it is now COMPLETELY sourced, which
  is rare; park it as a known-good future build.
  Cluster with B3.7 (Kobayashi, the two-reaction model these supersede - and
  CPD 1989's own introduction cites it by name) and B3.9 (Di Blasi, biomass).
