notes: >
  BUILT AND READY. Nothing waits on a maintainer. Figures 1-5 hold the only
  measurements in the review and are DELIBERATELY NOT DIGITISED, because that
  would need an overlay review and none is available; the page claims nothing
  that would need them and calls itself reproduction, not validation, in those
  words. The figure LEGENDS are transcribed and shipped - typeset tables that
  happen to sit inside plot frames - and the sidecar is explicit about the
  difference.

  Should a maintainer ever become available, the one thing figure digitisation
  would add is a fit quality for eqs. 8 and 9 against the data they were fitted
  to (a goodness of fit, correctly labelled) and evidence on the one internal
  inconsistency the page reports unresolved: the eq. 9 / eq. 8 ratio falls to
  1.30x in the high-v_s, low-P/V corner of the printed box, below the 2x floor
  the review argues for mechanistically four pages earlier. Figures 3 and 4 are
  where that would be settled. This is NOT a blocker - the page is complete
  without it.

  Related cases built concurrently on 2026-08-05: A3.6 (Calderbank & Moo-Young)
  and A3.8 (Onda). Calderbank 1958/1959 supplies three of the pure-water data
  sets in Figures 1-3 of this review; the page states explicitly that A3.6
  should own any comparison between Calderbank's k_L correlation and van 't
  Riet's k_L*A, because A3.6 will carry Calderbank's own definitions and this
  page does not. No other page's dataset is loaded here.
