text_layer:
  quality: >
    Franckaerts & Froment: 1964 Pergamon scan, poor - even the by-line extracts
    with corruption ("G. F. FROMENT t"). Every rate constant, every adsorption
    constant and every table cell must come off the image.
    Tayrabekova et al.: born-digital and clean, but the PDF substitutes 'e' for
    en-dashes in page ranges ("194e209") and drops diacritics from author names
    in the extracted text; harmless for numbers.
  render_at: >
    Franckaerts & Froment: 300 dpi, CCITT-G4 bilevel at 300 x 300 ppi native.
    Tayrabekova et al.: JPEG at 300 ppi; text is a real text layer, no render
    needed except for figures.
what_it_carries: >
  * Franckaerts & Froment 1964 is the classical LHHW kinetic study of ethanol
    dehydrogenation to acetaldehyde over a copper catalyst - integral-reactor
    data, model discrimination among LHHW candidates, and the fitted rate and
    adsorption constants. It is the paper the suite's teacher exercise
    descends from, and it is by the same author as C2.1's and C2.10's sources.
  * Tayrabekova et al. 2018 is a modern mono- and multicomponent Cu/ZnO/Cr2O3
    study on industrial-size alumina beads, with characterisation and
    activity/selectivity data - a second, independent dataset seventy years
    later on the same reaction.
validation_route: >
  PRINTED TABLES in both. Confirm the exact inventory off the 1964 renders
  before promising a parity plot.
notes: >
  Franckaerts & Froment 1964 is ALSO the natural source for B1.11
  (multicomponent pellet with MS/DGM, whose catalogue row literally names
  "Ethanol dehydrogenation ... pellets"). B1.11 has NOT been flipped by this
  pass, because whether the paper reports the pellet-scale information B1.11
  needs has not been checked. Check that before dispatching B1.11, and do not
  dispatch both cases onto the same transcription.
  The 1964 + 2018 pairing is the "one reaction, two eras, one page" shape that
  A1.1 and A4.9 use well.
