  spine: 'Discrimination, not fit. Section I of the paper is a quantitative refutation of the
    polarization theory and every input to it is printed, so it is reproduced chain by chain: C =
    -0.010223 from the polarizability against the 0.989 Bradley''s fitted k = 0.615 needs, a factor
    96.75 in the dipole ratio and 9361 in the energy. Confirmed a second way by assembling the
    recursion (1a) itself rather than quoting its closed form (1b): at the computed k the measured
    decay ratio is eq. (1b) to 8.5e-14 and is independent of truncation; at Bradley''s k the ladder
    oscillates, changes sign and has truncation spread 4.48.

    '
  headline_computed_twice: 'The BET inflection point cannot exceed 2/sqrt(3) = 1.154700538379 v_m for
    any c, attained at c = 27 + 15 sqrt(3) and x = 3 sqrt(3) - 5. Route 1 a symbolic Lagrange
    condition, route 2 a bracketing root-find on a numerically differentiated root-find; bit-identical
    on the ceiling, 1.2e-8 on c*. Not in the 1938 paper. It deflates the authors'' best-looking
    corroboration (v_m vs point B, "seldom differing by as much as 10 %" - a claim journal page 315
    makes about the TWELVE isotherms of Table I) into a near-guarantee of their own equation''s shape.
    THE BOUND IS ONE-SIDED: it caps how far a landmark can sit ABOVE v_m, not below, and the paper''s
    own Table III butane row is point B / v_m = 0.4828, i.e. 51.72 % BELOW. Over the eighteen
    non-butane pairs mean(inflection / point B) = 1.148812, so the inflection sits 14.881 % ABOVE
    point B, equivalently point B sits 12.954 % below the inflection.

    '
  printed_defect_found: 'Journal page 315, "For nitrogen E1 - EL is uniformly 840 +- 70 cal. Since EL
    is about 1330 cal., E1 is therefore 2170 +- 70 cal. for nitrogen on all twelve adsorbents", is the
    ELEVEN-row number. The paper''s +- convention is pinned exactly by Table II, and the two halves are
    NOT rounded alike: centre to the nearest 10 cal (4 of 4, worst residual 4 cal), half-width to the
    nearest 5 (4 of 4, worst residual 2.5 cal - argon''s printed 55 is not a multiple of 10, which is
    what pins it). On that convention the twelve rows give 824.5 +- 86.5 -> 820 +- 85 (820 +- 90 on a
    nearest-10 half-width) and two fall outside the printed band, while omitting Cr2O3 gel (738) gives
    841.5 +- 69.5 -> 840 +- 70 under BOTH rules - and that is the ONLY one of the twelve possible
    single-row omissions that reproduces it, under both rules, asserted in the cell.
    E1 = 2170 +- 70 inherits the basis. Five smaller defects also reported and not repaired:
    footnote 10''s "(8.357 - 8.823/r^3)" is mis-grouped; Table IV''s E1 column is 5 cal out on one row
    at a rounding half-way point; catalyst 954''s v_m disagrees by 15.59 % between Table I and Fig. 4
    with no sample mass printed for Table I''s row; Table V''s two argon rows repeat one v_m (215.5)
    and one solid surface (746) across a 13 K interval; and the worst cross-table sigma disagreement
    (0.6631 %, CO at -183 C liquid packing) is 3.0005 times what the printed rounding can produce -
    NOT "the rounding of the integer surface columns", which is what the first build called it -
    cause unknown. Plus the c inconsistency in the next block.

    '
  scope_declined: 'Fig. 6 (ethyl chloride on charcoal, three temperatures) is a fully specified
    eq. (E) prediction but needs vapour pressures the paper does not print - declined rather than
    closed with an outside correlation. The Darco statement (n = 2.2, x = 0.02 to 0.93, 4 %) refers to
    an isotherm that appears nowhere in the paper. Footnote 18''s eqs. (C) and (D) are transcribed and
    deliberately NOT exercised, because the paper never evaluates them either. No curve is digitised
    anywhere and no review/ directory exists, so this case needs no figure review and cannot stall on
    one.

    '
  for_the_verifier: 'Attack these first. (1) The seven-gas surface-area consistency is the page''s
    "not a fit" claim, and it rests on Emmett & Brunauer (1937) - NOT on disk - for the assertion that
    the molecular cross-sections come from bulk densities rather than from a fit. The page now bounds
    that risk with a MEASUREMENT (a silica-tuned sigma set leaves charcoal spread 14.379 % against the
    printed set''s 7.366 % on the six shared non-butane rows, a factor 1.95) and states that on the
    butane-inclusive basis the test has no power at all; it cannot remove the risk. (2) Every c is
    RECONSTRUCTED from E1 - EL through footnote 16, which is the AUTHORS'' OWN operation run backwards
    (journal p. 313: "From c one can obtain an approximate value for E1 - EL"), so the prefactor is not
    measurable in this paper and the inversion returns their fitted c to 0.28 %. The real doubt is the
    paper''s own Fig. 3 / Fig. 4 clash, a factor 2.2359 on one isotherm; applied as a sensitivity it
    BREAKS section 7 (7 of 12 rows past 5 %) and cannot touch section 6 (a maximum over all c).
    (3) The whole polarization block is the rival theory as its OPPONENT restates it; de Boer, Zwicker
    and Bradley are not on disk. (4) 54 metrics, 79 break rows, full coverage, TWO declared blind spots
    plus one row labelled STRUCTURAL and cited as evidence for nothing - the c-rescaling row aimed at
    the ceiling, which no change to c could ever move.

    '
