notes: 'BUILT 2026-08-07 and staged at queue_cases/J1.3/page/. VERIFIED 2026-08-07 ("safe after fixes")
  and the fixes applied the same day; review/verification.md holds the verifier''s report.

  THE ONE FINDING THAT CHANGED A CONCLUSION: the page had claimed to measure footnote 16''s prefactor
  as 0.447 and asserted that sections 6 and 7 "were built to survive" the resulting factor-2
  uncertainty. Settled against the paper''s own text on fresh 300 ppi crops: journal p. 313 says the
  energies were obtained FROM c through footnote 16 with the prefactor already set to 1, Fig. 4''s
  900 and 700 cal are Table I''s 894 and Table II''s 704 rounded, and p. 316 says the -195.8 C curves
  were CALCULATED from the -183 C ones holding E1 - EL fixed. So the prefactor is not measurable in
  this paper at all; the 0.447 is an internal inconsistency between Fig. 3''s direct fit and Fig. 4''s
  calculated curve for the same isotherm. Applied as a sensitivity it leaves section 6 untouched
  (a maximum over all c) and BREAKS section 7 (7 of 12 rows past the paper''s 5 %, smallest c 27.583
  against the threshold 38). The "built to survive" sentence and the "factor 1.6 of margin" are gone
  from all five files and the page now reports the failure.

  The fixer overruled one non-blocking recommendation: the verifier''s tuned-sigma bound (31.28 %
  charcoal against 7.90 % printed) compares two different row bases. Like for like it is 14.379 %
  against 7.366 % on the six shared non-butane rows (factor 1.95), and on the butane-inclusive seven
  pairs the tuned set gives 31.283 % against the PRINTED set''s 31.036 % - no power at all. The
  measurement was added with the correct numbers and both bases printed.

  models.yaml has NO J1.3 entry of any status and J1.3 appears in no other entry''s related list, so
  queue_cases/J1.3/models_entry.yaml is an APPEND, not an upgrade in place. It declares one departure
  from this file: structures [S1, S10] rather than S1 alone, because the two objects the page solves
  (the BET layer-occupancy ladder and the polarization dipole ladder) are constrained algebraic
  systems. J3.1 is the precedent.

  '
