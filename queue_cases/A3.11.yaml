what_it_carries: >
  * The theory the case is for: effective axial and radial thermal
    conductivities and the apparent wall heat transfer coefficient, all derived
    from a TWO-PHASE continuum model containing separately measurable underlying
    processes, with the paper's own claim that "no empirical or adjustable
    constants are involved" (stated twice, in the abstract region and again in
    the body). The interdependence of lambda_er and h_w that the catalogue names
    is the paper's central point.
  * A full Notation section defining every dimensionless group used - apparent,
    fluid/wall and solid/wall Biot numbers, the interphase heat transfer groups,
    the effective and fluid Peclet numbers on both d_p and R bases. Transcribe
    from that section rather than assuming the usual definitions; the paper is
    explicit that all parameters are "defined in terms of total area (void +
    nonvoid) normal to the direction of heat transfer", which is not universal.
  * Table 1: "Comparison of Yagi and Wakao's method of data analysis with
    nonlinear least squares", showing that the older method gives Biot-number
    estimates with a large negative bias. That is a printed numeric table AND a
    ready-made break-table row: it is a defect-injection result the authors
    performed themselves.
  * An analytical solution due to Olbrich (1970) that the theory is checked
    against, and an appendix-numbered equation (A.M.) defining a further axial
    Peclet number.

  Table 1 is the only data table; everything else is figures. That is enough for
  one printed-number validation without a maintainer, but not for a rich data
  page. Rank accordingly.

related_on_disk: >
  A3.12's source - Yagi & Kunii, AIChE J 3(3) 1957, "Studies on effective thermal
  conductivities in packed beds" - is on disk and A3.12 HAS A LIVE BUILDER as of
  2026-08-05. Dixon & Cresswell's Table 1 is explicitly a critique of the Yagi
  and Wakao data-analysis method. Coordinate: whichever page is built second must
  read the first and reconcile, per AGENTS.md's rule on borrowed datasets. Do not
  build both in ignorance of each other.

validation_route: printed numbers (Table 1) plus the Olbrich analytical solution; the rest is figures
