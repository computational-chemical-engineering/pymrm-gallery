# Block to splice into models.yaml. J3.1 is NOT yet present there, so this is a
# NEW entry (append in section-J order, before J3.3). slug and title are identical
# to page/meta.yaml.
#
# Note on the reference block, which is deliberate and is stated on the page:
#   `reference` is Doyle, Fuller & Newman (1993) because that is the paper
#   actually read - Eqs. 6, 8, 16, 17, 18, 28, 29 and 30 off 600 dpi renders of
#   journal pages 1527, 1528 and 1530. `also` carries Marquis et al. (2019), read
#   for the hyperbolic-sine form and its printed inversion.
#   The HISTORICAL ORIGIN of the law - Tafel (1905), J. A. V. Butler (1924,
#   1932), Erdey-Gruz & Volmer (1930) - was NOT consulted, is not on disk, has no
#   open-access route, and carries NO DOI here on purpose: the citation is
#   conventional attribution and was never verified against an original. It is
#   recorded in `origin_not_consulted` rather than in `also`, so that no tooling
#   can mistake it for a source that was read. The same pattern as B1.6 and F1.3,
#   with the extra step of withholding a DOI that could not be checked.
#
# No new pip dependencies. The page ships NO data/ directory and digitises no
# figure; it loads J3.4's parameter and stated-results CSVs cross-page via
# load_data(page="J3.4-doyle-fuller-newman"), so J3.4 must stay published.
- id: J3.1
  slug: butler-volmer-tafel
  title: "Butler–Volmer kinetics and its linear and Tafel limits"
  description: >
    The interfacial charge-transfer law as Doyle, Fuller and Newman print it,
    with the exchange current density derived from their own equations rather
    than quoted, and the overpotential at which each of its two standard
    approximations goes wrong by 1, 5 and 10 % - closed form for Tafel, and
    checked against the overpotentials the published J3.4 cell actually runs at.
    Its two electrodes turn out to be in different regimes.
  section: J
  status: published
  tier: T0
  priority: P1
  structures: [S1, S10]
  phases: [liquid-solid]
  reference:
    authors: ["Doyle, M.", "Fuller, T. F.", "Newman, J."]
    year: 1993
    container: "Journal of the Electrochemical Society 140(6) 1526–1533"
    doi: 10.1149/1.2221597
  also:
    authors: ["Marquis, S. G.", "Sulzer, V.", "Timms, R.", "Please, C. P.", "Chapman, S. J."]
    year: 2019
    container: "Journal of the Electrochemical Society 166(15) A3693–A3706"
    doi: 10.1149/2.0341915jes
  origin_not_consulted: >
    Tafel, J. (1905); Butler, J. A. V. (1924, 1932); Erdey-Grúz, T. and
    Volmer, M. (1930). Conventional attribution, recorded without a DOI because
    no copy was available and no citation could be verified against an original.
    Not consulted; nothing on the page derives from them.
  predicts:
    - current density from surface overpotential
    - exchange current density from the rate parameter and the surface composition
    - charge-transfer resistance
    - Tafel slope
    - the overpotential at which the Tafel approximation deviates by a stated fraction
    - the overpotential at which the linear approximation deviates by a stated fraction
    - the surface overpotential distribution in a porous electrode
  pymrm_api:
    - construct_grad
    - construct_div
    - NumJac
    - stencil_block_diagonals
    - newton
  data: {tier: 6, method: analytical, status: complete}
  page: pages/J3.1-butler-volmer-tafel/
  related: [J3.4, J3.5, J3.3, J3.2, B1.6, D1.4]
