what_it_carries: >
  Checked against what the case is FOR (the E1.1 test), by rendering.

    * Section 2.6 "The EMMS Model" (book p. 39) states the model itself: a
      nonlinear optimisation in eight variables under nine constraints, named in
      the text as the Energy-Minimization Multi-Scale (EMMS) model, "from which
      the parameter vector X and various energy consumptions can be calculated
      without using any adjustable parameters". Model LG is written out - the
      N_st extremum with its two branches about the saturation carrying capacity
      K*, the six conservation equations F_i(X) = 0, and the non-negativity
      conditions - followed by the dense-, dilute- and inter-phase slip
      velocities U_sc, U_sf, U_si.
    * Chapter 3 "Solution of the EMMS Model" gives the analytical and numerical
      solutions, the GRG-2 algorithm actually used, and the stability conditions.
    * Section 5.2.1 "Drag Coefficient and Slip Velocity" (book p. 163) is the
      part the case title names: Figure 5-4 plots C_D and U_s for the cluster,
      dilute, inter and global phases against gas velocity, showing the
      meso-scale correction the case exists to demonstrate.
    * A PRINTED NUMERIC TABLE to validate against. Book p. 158, inside the
      worked example of section 5.1.3, tabulates (W_st)_PFC, (W_st)_FD,
      eps_PFC, eps_FD, eps_ideal, eps_a and eps* at U_g = 2.0, 3.21 and
      4.0 m/s - nine independent numbers plus the transition velocity
      U_pt = 3.21 m/s. That is a deterministic reproduction target for the
      solver, not a curve to digitise.
    * Chapter 4 "Experimental Evidence" (book pp. 103-152) carries the measured
      axial and local voidage profiles, phase structures and regime transitions.

  Verdict: the book carries the result the case is for. A1.9 is buildable, with
  a printed-number validation route in section 5.1.3.

caveats: >
  * "EMMS drag" as a CFD closure in the modern sense (the Yang/Wang
    heterogeneity-index formulation used inside two-fluid models) POSTDATES this
    book. What is here is the 1994 EMMS model and the drag coefficients it
    produces. The page must say which one it is building and must not describe
    the 1994 model as though it were the CFD closure.
  * Everything is read off images. Budget for that: 214 pages, no search.

validation_route: printed numbers (book p. 158 worked example, 3 velocities x 7 quantities)
