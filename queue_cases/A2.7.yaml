what_it_carries: >
  * The model the case is for, derived twice: first from a minor extension of
    Taylor's heuristic equilibrium analysis, then more generally from a
    generalisation of Fick's law that admits a finite velocity of fluid
    elements. The result is a quasilinear HYPERBOLIC system of two first-order
    equations for the mean concentration and the dispersion flux, in place of
    one second-order parabolic equation.
  * The three parameters, stated as depending only on flow conditions, fluid
    properties and geometry.
  * The boundary-condition claim that is the whole point of the case: for
    unidirectional flow the conditions are imposed ONLY at the reactor inlet -
    contrasted explicitly with Danckwerts (1953), whose paper is already on disk
    and whose page (A2.1) is already published.
  * A critique of Sundaresan et al. (1980), and an Appendix (Eqs. A19-A28)
    proving D_e > 0 and tau > 0 for arbitrary non-uniform flow.

  IT IS A PURE THEORY PAPER. Checked on renders as well as text: there is NO
  data table and NO figure anywhere in the 16 pages. That is good news, not bad -
  it means the validation route is analytical and needs no maintainer:

    * the hyperbolic model must reduce to the Fickian model in the small-tau
      limit (the paper's own Eq. 33 route);
    * signal propagation speed must be finite and must match the model's own
      characteristic speed, where the parabolic model gives infinity;
    * no upstream signalling for unidirectional flow - a tracer injected at the
      inlet must leave the domain upstream of the injection point untouched,
      which is exactly the defect the paper says the Fickian model has;
    * the inlet-only boundary condition must be well posed, and imposing an
      outlet condition as well must over-determine the system.

  A2.1's published page supplies the parabolic comparison and its dataset. Per
  AGENTS.md, reading that page is mandatory before borrowing anything from it,
  and any number that also exists in its CSV must be printed side by side.

validation_route: analytical limits and structural checks (no dataset in the paper; none needed)
notes: >
  Catalogue says "AIChE J/Chem. Eng. Sci. (1995)" because the series was split
  across two journals. ONLY THE AIChE J PART IS ON DISK. The companion analysis
  and application papers are not, and are not needed for the model itself - but
  do not cite them as read.
  This is the strongest "pymrm shows something the original could not" candidate
  in the batch: a hyperbolic two-equation system beside the parabolic one, on the
  same grid, with the finite signal speed visible.
