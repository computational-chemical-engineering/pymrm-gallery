  2. THE 1/delta "OUT-OF-SAMPLE TEST" WAS VACUOUS. delta, rho_MFI, the unit-cell
     mass and N_A cancel identically out of all four mixture fluxes: the
     conversion collapses to N_i = 34 J_i / (D_C1 psi_C1(95 kPa)). Swinging
     rho_MFI 1800 -> 1200 -> 3600 -> 900 (delta 40.0 -> 26.6 -> 79.9 -> 20.0 um)
     leaves all four bit-identical. It was the delta-free flux-ratio check
     printed ten lines below it, restated: flux_worst_rel_dev 0.0040656 against
     flux_ratio_delta_free_worst 0.0040675. The claim is withdrawn; the check is
     KEPT and labelled as a powerless-check disclosure, with the rho sweep and
     both deviations printed on the page, because it does test the MIXTURE
     physics. So delta is tested on ONE power, not two - and on that one power
     it fails by ~10 %.

     NOTE FOR THE NEXT READER: the verification report's own consequence for
     finding 1 - "delta would have to move +6 %, which WOULD move every steady
     flux by -6 % and WOULD break the flux agreement" - is wrong, and wrong by
