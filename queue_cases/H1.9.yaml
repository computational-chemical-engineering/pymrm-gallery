notes: |
  METADATA CORRECTED 2026-08-02 — the previous DOI did not source this case.

  10.1016/0009-2509(95)00102-B is van den Broeke & Krishna, "Experimental
  verification of the Maxwell-Stefan theory for micropore diffusion", CES 50
  (1995) 2507-2522. It reports breakthrough experiments in a **packed bed** of
  Kureha microporous activated carbon and a Takeda carbon molecular sieve. It
  contains no membrane, no permeation model and no zeolite experiment: every
  occurrence of "membrane", "zeolite" and "silicalite" in its full text is in
  the introduction or the reference list (Kapteijn/Bakker/Zheng on silicalite
  membranes, Rao & Sircar on carbon membranes). A page on a Maxwell-Stefan
  *zeolite membrane* cannot be sourced from it. Same failure mode as F3.5 and
  G1.7: a crossref-auto DOI that resolves cleanly to the wrong document.

  The catalogue's other named reference does carry the case. Krishna & Baur
  (2003) states as its second objective "to show how the M-S approach can be
  incorporated into the modelling and design of practical devices such as
  membrane permeation units and fixed bed adsorbers", and works the MFI-membrane
  separation of hexane isomers (nC6 / 3MP) explicitly, with a transient model
  whose solution follows "the transience in permeation flux N1 as steady state
  is approached".

  SOURCE QUALITY: good, and unusually so. The 2003 text is born-digital, not a
  scan. Ð, Θ, θ, Γ and "Pa−1" survive; the Nomenclature block is intact; Tables
  1-5 arrive with headers and numbers (Table 1 DSL parameters for alkanes in MFI
  at 300 K; Table 2 for C5/C6 isomers at 362 K; Table 3 transition probabilities
  and zero-loading diffusivities; Table 4 Langmuir parameters and M-S
  diffusivities for N2 and CH4 in 4A at 193 K). The "API text is unusable for
  numbers" warning in docs/pdf-findings.md is about pre-1980 scans and does not
  apply here. Spot-check a few values against the published PDF anyway.

  In AGENTS.md terms this is the reprint route: the review is by the same
  authors, prints the model, names it and applies it. Where a page cites an
  earlier origin for an equation, record the review as reference_read_from.

  Do NOT confuse with H1.4 (Itoh 1987, Pd membrane reactor), whose PDF was filed
  under this ID until 2026-07-31.
