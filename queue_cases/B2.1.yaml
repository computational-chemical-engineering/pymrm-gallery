what_it_carries: >
  The origin of C = A t^n, stated in the abstract in the form the case is about:
  "there is an intrinsic uniformity in the way the carbon deposit on the catalyst
  increases with the time elapsed since the catalyst was last regenerated. For
  all the data examined, the amount of carbon deposited on the catalyst at given
  conditions is, within limits, INDEPENDENT OF THE HYDROCARBON FEED RATE." It
  then derives correlations relating conversion, feed rate and regeneration
  interval, and offers a mechanistic hypothesis.
  The feed-rate independence is the non-obvious claim and is the one a page
  should test, not just restate.
validation_route: >
  PRINTED DATA - the paper's whole argument is "for all the data examined", so
  it reports coke-vs-time results. Confirm off the renders whether these are in
  tables or only in figures BEFORE promising a fit; if figure-only, this case
  hits the review gate and there is no maintainer available as of 2026-08-05.
  Ranked accordingly in docs/source-map-2026-08-05b.md.
notes: >
  Voorhies is upstream of two other files in the same drop: B2.2's Froment &
  Bischoff paper builds coke-dependent activity on it, and B1.7's Mears file
  opens with the tail of a paper discussing "The Voorhies (1945) relationship
  between catalyst coke and catalyst residence time" - which is itself a
  reminder that a first-page glance is not an identification.
  Build B2.1 -> B2.2 -> B2.3 in that order; they are one story (empirical coking
  law, then coke-dependent activity in a reactor, then deactivation order).
