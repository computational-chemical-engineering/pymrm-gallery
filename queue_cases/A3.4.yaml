notes: 'Page built and executing in queue_cases/A3.4/page/ (31 cells, ~25 s). The
  spine is that eq. (4) - steady 1-D convection-diffusion-reaction with Danckwerts
  boundary conditions - is a genuine S3 pymrm problem whose closed form is the paper''s
  own eq. (7), so the correction the paper performs by hand becomes a root find on
  a solved BVP.

  Four data-free results, all reproducing the paper: (1) the pymrm discretisation
  converges onto eq. (7) at first order (error ratios 2.00 over four doublings) and
  one Richardson step lands within 2.0e-6; (2) eq. (2) and the Pe = 2 assumption it
  replaces differ by exactly 1 + 40/(Sc.Re), so the re-analysis can only bite below
  Sc.Re = 40 - Re < 67 for a gas, Re < 0.04 for a liquid - which predicts both halves
  of conclusion 1 before any number is computed; (3) the liquid-phase correction is
  at most 1.33 % over 3 <= Re <= 1e4; (4) pushing Petrovic-Thodos eq. (11) through
  eq. (7) at their Pe = 2 and re-inverting with eq. (2) returns eq. (12) to 1.8 %
  mean and 4.5 % worst over 100 <= Re <= 900, nothing fitted, moving under half a
  per cent when L/d_p goes from 10 to 40. The paper never prints this comparison.

  Against the 81 digitised Figure 2 markers, eq. (12) sits at 26.5 % mean absolute
  deviation with a +4.9 % bias - that scatter belongs to 1943-1969 gas-phase data,
  not to the correlation. The number that matters is the trend: eq. (11)''s bias runs
  -36 % below Re = 30 through -21 %, -2 % and +13 % above Re = 300, while eq. (12)''s
  stays flat. That is exactly what the paper claims about its own figure.

  Extraction notes for whoever picks this up: the Elsevier PII full text is excellent
  for prose and useless for numbers on this scan (eq. 12 comes back as "2 + 1 1 Sc
  3 Re 6"); every constant was read off 600 dpi renders. The trick worth reusing is
  that when a figure draws curves whose equations are printed, those curves calibrate
  the axes exactly AND can be erased at their computed position before marker detection
  - the dashed Ranz-Marshall curve scores as markers otherwise, because its dashes
  are compact ink.

  '
