notes: |
  Page complete and executing (54 cells, ~5 s). Both answers from the 2026-08-02
  review are acted on: "worth the effort" -> Figure 3 digitised and Figure 2's dense
  band worked again; "the marker is often off centre, fit the shape and take the
  centre of the shape" -> implemented, and MEASURED rather than asserted.

  SENT BACK BY ADVERSARIAL REVIEW 2026-08-02 (review/verification.md) AND REWORKED.
  The page's headline was that a free fit to Figure 3 rejects the printed alpha and
  beta by five to six standard errors. That claim is WITHDRAWN. It did not survive
  three things, all now on the page:
   * the fitting metric. Unweighted least squares in LINEAR y on the same markers -
     an equally defensible loss function - gives 1.157 / 0.5844 rather than 1.344 /
     0.5496. Theil-Sen gives 1.190 / 0.5558. The disagreement was a property of the
     estimator as much as of the data. NOTE for whoever reads verification.md: the
     reviewer justified the linear metric by saying the paper's Figure 4 is a
     linear-axis plot. It is not - read on the 600 dpi render of page 1383 (right
     column), Fig 4 is log-log like every other figure in the paper, with
     (Sc^1/3 Re^0.6)^2 running 1 to 1e6 and Sh 1 to 1e4, and the square is taken
     "to enlarge the plot in the x-axis direction". The page therefore argues the estimator point on its
     own merits and does NOT claim the authors fitted in linear space;
   * the error model. The residuals carry a 5.0-sigma quadratic term and positive
     autocorrelation; Newey-West standard errors are 1.4-1.9x the ordinary ones and
     a cluster bootstrap over the Reynolds bins is 2.5x, giving a 95 % interval for
     alpha of 1.04 to 1.53, which CONTAINS 1.1;
   * a real calibration bug, and fixing it was the most valuable thing in the pass.

  THE CALIBRATION BUG. Figure 3's left- and right-hand decade ticks disagree by
  5.6 px: the render is rotated by 0.203 deg. The first pass averaged the two sides,
  which is right in the middle of the plot and wrong at both ends, and because the
  error is a TILT it fed straight into beta. The symptom was already in the sidecar
  and had been recorded as CONFIRMATION: fitting the drawn correlation's own ink -
  an object known to be exactly 1.1 Re^0.6 - returned alpha 2.4 % high and beta
  0.9 % low, the same signs as the accusation. With a column-dependent row origin
  the control returns 1.107 / 0.598 (so the line WAS drawn from the printed
  constants) and the marker fit moves 1.367 / 0.5460 -> 1.344 / 0.5496. The drawn
  line is now shipped as its own dataset so the control RUNS on the page.

  THE HEADLINE IS NOW THE NUMBER THAT DOES NOT MOVE: alpha with beta held at the
  printed 0.6, whole sample, = 1.1000 against the printed 1.1 in the same log metric
  the free fits use. It stays inside 1.0976-1.1179 across all six erasure-band
  settings AND both axis calibrations, and inside 1.0067-1.1179 once the estimator is
  varied as well: within 9 % of the printed value, never more than 2 % above it,
  against 1.05 to 1.47 for the free alpha over the same choices. THAT CONTRAST is the
  result. Do not overclaim it, as an intermediate draft of this pass briefly did: the
  beta-fixed alpha is not a fixed point of the analysis. Linear-y least squares gives
  1.047 where the log metric gives 1.100, and Re >= 50 gives 1.0199. Both columns are
  printed. Everything else is reported as a sensitivity family.

  THE ERASURE BAND IS NOW SHIPPED AS DATA. wakao-funazkri-1978-fig3.csv carries six
  marker sets, band_hw = 0, 3, 5, 7, 10, 14 -> n = 210, 195, 182, 166, 147, 126, free
  alpha 1.296 -> 1.440. That spread is a half-width of 0.072 against an iid standard
  error of 0.052 and a clustered one of 0.132: the extraction dominates the error bar
  the page was quoting and is comparable with the honest one, so the two together are
  about 3x what was reported. band_hw = 5 is shipped, justified on a measurement
  (turning the band off gains 35 centres that sit a median 3.6 px from the drawn
  line and score 0.684 against 0.793), and disclosed as a judgement.

  THE BREAK TABLE NOW RECOMPUTES EVERY COLUMN UNDER EVERY DEFECT. It previously
  copied untouched columns from the baseline row - the repository's signature defect,
  inside the table built to guard against it - so "each defect moves the metric it
  should and only that one" was asserted, not measured. Measured, the off-diagonal
  is exactly 0.0e+00 over 30 cells, because the three metric groups share no input;
  and the free-fit alpha and beta are in the table now as well as the beta-fixed
  alpha. Worth recording, because the earlier draft had it backwards: against an AXIS
  defect the beta-fixed alpha is the MOST sensitive of the three (+47.6 % under the
  decade-swap, against +0.0 % for the free alpha), not the least. It is the most
  stable against the erasure band and against everything in the bed model, which is a
  different statement and is the one result 5 makes.

  Deviation of eq. (12) from the data it was FITTED on: 17.6 % mean absolute,
  +2.3 % bias, against 27.2 % and +9.7 % on the gas data it was CHECKED against.

  Also fixed this pass: the citation named Kaguei, S., who is not an author of this
  paper (title page reads "N WAKAO and T FUNAZKRI"); the re-centring statistics are
  now reported on the 65 markers that actually moved as well as on all 81 rows, 16
  of which are zero by construction; "random, not systematic" retired for the 2.6-SEM
  row shift; the NMS explanation of the double counts dropped (eight of the twelve
  merged pairs were 1.4-5.0 px apart, so 8 px suppression cannot be the cause);
  "three known functions" corrected to two plus a slope; Figure 2's ~4 px common
  curve offset (~2.7 % in Sh) measured and disclosed but deliberately NOT corrected,
  because the only evidence for it is the three curves one of which supplied eps_b;
  and the eq. (9) dashed-band erasure count printed.

  The technique write-up is in queue_cases/A3.4/review/README.md and is meant for
  promotion into docs/handoff.md. Short version: score a parametric glyph template
  (body coverage minus an outer margin annulus, weighted by a don't-care mask)
  instead of a density peak, fit (shape, size, sub-pixel centre), and detect by
  matching pursuit so merged glyphs are explained one at a time. Four traps, each of
  which cost a cycle: the margin annulus must be several px wide or every fit
  collapses onto the smallest template and scores 1.00; SciPy's default Nelder-Mead
  simplex is degenerate when the start is the origin, so the polish silently does
  nothing; a normalised coverage score is unbounded when most of the template is
  masked away, so a second "evidence" gate with a support floor is needed; and
  erasing a curve as absent ink rather than as don't-care destroys every marker
  sitting on it. Two further lessons were added after the review and are the most
  transferable part: a printed curve is a free calibration control, and a control
  that fails in the direction of your result is a symptom; and the erasure width
  must be swept and every marker set shipped.

  Extraction notes for whoever picks this up: the Elsevier PII full text is excellent
  for prose and useless for numbers on this scan (eq. 12 comes back as
  "2 + 1 1 Sc 3 Re 6"); every constant was read off 600 dpi renders.
