blocker:
  kind: figure-digitisation-review
  question: 'Figure 2 (journal page 1382) has been digitised: 81 marker positions
    kept out of 87 automatic candidates, six rejected by visual audit at 600 dpi.
    Two questions. (1) Do all 81 kept crosshairs sit on real glyphs? The contact sheet
    shows every one of them at 2x, numbered. (2) Recall in the band above Re = 100
    is the real issue - of order 110 markers appear to be drawn and 81 were kept,
    so roughly a quarter are missed where glyphs overlap each other and the eq. (12)
    curve. The page uses those points ONLY for the trend in the residual with Reynolds
    number, which a missing marker does not move. Is that use acceptable with the
    recall as it stands, or should the dense band be completed by hand before the
    page is published?

    '
  detail: 'The axis calibration is not in doubt and does not need reviewing. All three
    curves drawn on Figure 2 are known functions - eq. (12), Ranz-Marshall eq. (9),
    and Petrovic-Thodos eq. (11) - and recomputing them from their own equations puts
    all three on the printed curves to within a line width (see A3.4-fig2-axis-calibration.png).
    That check also settles two things the paper leaves unstated: that j_D in eq.
    (11) is defined on the superficial velocity, so Sh = j_D Re Sc^(1/3), and that
    the voidage used to draw the line is eps_b = 0.40.

    A second decision is wanted on Figure 3, the liquid-phase plot that alpha and
    beta were actually fitted on. It carries ~250 filled markers of eleven shapes,
    heavily merged in the dense band; distance-transform splitting of merged blobs
    was judged too unreliable to attempt and it was NOT digitised. Without it the
    values 1.1 and 0.6 are tested here only against the gas data they were checked
    against. A free refit on the 81 gas points gives alpha = 1.17 +/- 0.22, beta =
    0.555 +/- 0.037, so both printed values sit within 1.22 standard errors - but
    that is a weak test compared with Figure 3. Worth the effort, or leave it?

    Nothing else blocks the page. The results that carry it need no data at all: the
    pymrm solve of eq. (4) against eq. (7), the liquid/gas asymmetry, the Sh -> 2
    limit, and the reproduction of the paper''s own recalculation.

    '
