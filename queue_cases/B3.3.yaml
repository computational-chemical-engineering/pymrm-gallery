what_it_carries: 'From the abstract: a random pore model allowing arbitrary pore size distributions,
  which "can represent the behavior of a system that shows a maximum in reaction rate as well as one
  that does not", identifies an optimal pore structure for either, and "subsumes several earlier treatments
  as special cases". Two of those special cases are already published pages and are therefore free
  structural checks: it derives a relationship between the effective GRAIN shape factor and its own
  pore-structure parameter (against B3.2), and at zero variance of the pore size distribution it approaches
  Petersen (1957) over a large conversion range. Validation data: the char gasification data of Hashimoto
  et al. (1979).'
not_on_disk: Part II (non-isothermal / diffusion control) did not arrive.
check_before_dispatch: 'ANSWERED 2026-08-13 by the coordinator, all eight pages rendered at 110 ppi
  and read. THE PAPER CONTAINS NO TABLE AT ALL - eight figures, and the string "table" occurs nowhere
  in the document outside words like "suitable" and "inevitable". The Hashimoto et al. (1979)
  comparison is FIGURE 8 (p. 384), a scatter of S/(1-X) against ln[1/(1-X)] for CS and VC char.
  BUT THIS DOES NOT FORCE DIGITISATION, and that is what separates this case from J2.3 (Nyvlt),
  which was demoted for exactly this shape. Nyvlt prints NO number from his fits; Bhatia & Perlmutter
  print theirs IN PROSE on p. 385: "Estimates of initial BET surface areas obtained from the
  intercept of Figure 8 give 520 m2/cm3 for both VC and CS chars. The two slopes give psi = 6.9 and
  psi = 13.7 for the VC and CS chars, respectively." They also print, in prose or in captions: the
  best-fit m range (0.49 <= m <= 1 for 0 <= psi <= 2, with m very close to two-thirds at psi = 1,
  from the explicitly printed squared-deviation integral I); the structural claim that a rate maximum
  must develop when psi > 2; the Petersen agreement window ("good agreement up to about 75%
  conversion"); the three Fig. 7 parameter sets (S_o = 2500 and 12500 cm2/cm3, L_o = 3.14e6 cm/cm3,
  eps_o = 0.3); the Petersen-consistent set (S_o = 2425, eps_o = 0.26, psi = 5) - CORRECTED BY THE
  BUILD 2026-08-13: that set is the FIG. 4 CAPTION and the p. 384 body text, not Fig. 7 as this note
  first said, and the page uses the correct attribution; and the claim that
  Thiele moduli give effectiveness factors over 0.98, which is what justifies the kinetic-control
  assumption.
  SCOPE PINNED FOR THE DISPATCH: build the printed structure and the printed derived scalars; do
  NOT digitise Figure 8 or any other figure, and say plainly that the empirical comparison with
  Hashimoto is figure-only and therefore out of scope, so the page does not establish empirical
  adequacy. The two special-case reductions the abstract claims (the effective grain shape factor
  against the published B3.2, and Petersen 1957 at zero pore-size variance) are free structural
  checks and are the substance of the page. This is a J1.4-shaped prove-the-printed-structure page
  with more testable content than J1.4 had.'
