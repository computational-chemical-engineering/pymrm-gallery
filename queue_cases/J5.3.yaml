first_page_trap: 'PDF page 1 opens with the "References and Notes" of the PRECEDING article (a Zambelli
  stereochemistry paper, references 1-12 visible); Chiu et al. start below it.
  AND IT HAPPENS AT THE OTHER END TOO - found 2026-08-14 by the coordinator, before dispatch. The
  file is 10 pages covering book pp. 348-357, but Chiu ends ON p. 357 and PDF page 10 therefore
  OPENS THE NEXT ARTICLE ("Macromolecules 1983, 16, 357-359"). That next article has a Table I of
  its own, about the chain length of normal alkanes, and the text layer''s later "Table I"
  references (its results, its comparisons) belong to IT, not to Chiu. A grep for "table" over the
  whole file conflates the two papers. Chiu''s own tables are Table I (the numerical values -
  reaction rate constants - used in the calculation) and Table II (the model parameters for each
  experimental condition); both are inside PDF pages 1-9. Verify every table you use sits on a page
  whose running head reads "Gel Effect in Free-Radical Polymerization" or "Chiu, Carratt, and
  Soong", and read the numbers off crops.'
