what_it_carries: 'IAST as originally stated: the ideal adsorbed solution, the Raoult''s-law analogue
  in which the partial pressure of an adsorbed component is its adsorbed-phase mole fraction times
  the pressure it would exert as a pure adsorbed component at the same temperature and SPREADING PRESSURE,
  and the claim that mixture isotherms follow from pure-component data alone. The abstract names four
  validation systems: methane-ethane and ethylene-carbon dioxide on activated carbon, carbon monoxide-oxygen
  and propane-propylene on silica gel.'
