reference_read_from_required: >
  *** THIS IS NOT THE CATALOGUED PAPER. *** B3.5 names Grasa & Abanades, IECR 45
  (2006) - the origin of the widely used CaO deactivation (carrying-capacity
  decay) curve - and THAT PAPER IS NOT ON DISK. The document on disk is the same
  group, twelve years later, READJUSTING the parameters of that same curve for
  carbonation temperatures below 650 C. Its own abstract: "The parameters on the
  CaO deactivation curve THAT IS WIDELY EMPLOYED have been readjusted to accord
  with a more general decay model that takes into account the effect of the
  carbonation temperature on the thickness of the CaCO3 product layer".
  So this is the AGENTS.md REPRINT ROUTE, not the origin: use
  `reference_read_from` for every constant taken from the 2018 note and
  `origin_not_consulted` for Grasa & Abanades 2006. Say on the page which
  document each number came from.
  BEFORE BUILDING, apply the E1.1 test explicitly: a 5-page research note that
  refits a curve does not necessarily PRINT the original curve's functional form
  and its original parameters. If it does not, the page can only build the 2018
  model, and must say the 2006 baseline was not read.
priority_note: >
  P1/T1 on the catalogue, but the reprint caveat above lowers its real
  readiness. Ranked below the clean origin-paper unlocks in
  docs/source-map-2026-08-05b.md.
