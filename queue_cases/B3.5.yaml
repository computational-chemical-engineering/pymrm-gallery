what_it_carries: >
  Carrying capacity of a high-purity natural Ca material measured across
  450-725 C, i.e. across and below the 650 C / 10-15 vol % CO2 reference
  conditions almost all published work uses; a general decay model in which the
  carbonation temperature sets the CaCO3 product-layer thickness that ends the
  fast kinetically controlled regime; and the readjusted parameters of the
  standard deactivation curve.
  Motivation stated in the abstract and worth putting on the page: recent process
  schemes propose operating the carbonator BELOW 650 C, and "there is a lack of
  correlations for estimating the evolution of the carrying capacity along
  cycling at temperatures below 650 C".
validation_route: >
  PRINTED PARAMETERS at minimum (the readjusted decay-curve constants are the
  paper's deliverable). The cycle-by-cycle capacity data are likely FIGURES in a
  5-page note - check before promising a comparison, because a figure route
  needs the review gate and no maintainer is available as of 2026-08-05.
notes: >
  Cross-links: B3.10 (oxygen-carrier reduction/oxidation) was unblocked in the
  same drop from another Spanish CSIC paper, and I1.8 (chemical looping
  combustion reactor) stays needs-paper. The three are one looping cluster;
