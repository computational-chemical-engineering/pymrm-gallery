# Block to splice into models.yaml.
#
# H1.1 ALREADY EXISTS there as `status: planned` (currently at lines ~687-702).
# This is an IN-PLACE UPGRADE of that entry, not an append. `slug` and `title`
# are unchanged from the planned entry and match page/meta.yaml.
#
# Two deliberate changes the integrator should notice:
#   * `structures` becomes [S3, S5]. The planned entry said [S7], but S7
#     (multi-domain coupling) is what H1.4 does. This page is a 1-D steady BVP
#     (the wall) plus a 1-D convection problem with a nonlinear sink (the
#     channel). The permeate side is a prescribed boundary value, not a second
#     solved domain.
#   * `reference` is Itoh (1987) with a DOI, and the three classics he cites are
#     recorded under `origin_not_consulted` - the J3.1 form. Itoh does NOT
#     reprint Bohmholdt & Wicke's result (he cites them for the exponent and then
#     writes his own Eq. 1 with his own cylindrical permeance and his own
#     constants), so the AGENTS.md reprint test is not met for them; their
#     citation is transcribed from Itoh's reference list, has no DOI and could
#     not be verified against an original; and B&W is not the origin of the law
#     this case is named for. H1.4 and B1.6 likewise keep the paper actually read
#     in `reference`. The attribution itself is unchanged and is stated on the
#     page, in the CSV sidecar and in `origin_not_consulted` below.
#     The planned entry's `note` promised a comparison of the exponent n = 0.5 vs
#     1 against data via Caravella et al. (2010); that paper is not on disk, is
#     NOT used, and the promise is replaced by a derivation-based treatment plus
#     a follow-up on the case file.
id: H1.1
slug: sieverts-permeation
title: "Sieverts-law hydrogen permeation through Pd membranes"
description: >
  The exponent is one half because the molecule splits in two, and that single
  fact decides how a palladium membrane behaves. The permeance Itoh prints as a
  formula is derived here instead - a pymrm radial solve of the wall lands on
  his 4.47e-5 mol/s - and the half-power law is then given the two consequences
  it is usually quoted without: a permeator empties in a FINITE length (on a
  clean permeate side), where an exponent of 1 never does, and spare membrane
  capacity is worth its square. Those numbers put Itoh's own membrane 18x from
  being the limiting resistance, which is the condition that puts the reactor of
  H1.4 on its fast-permeation ceiling and leaves the permeance no observable to
  move.
section: H
status: published
page: pages/H1.1-sieverts-permeation/
tier: T0
priority: P1
structures:
- S3
- S5
phases:
- gas
predicts:
- the permeation rate constant of a cylindrical Pd tube from D, C_0 and the radii
- the dissolved-hydrogen profile through the wall (logarithmic in r)
- axial hydrogen depletion in a membrane channel, and the finite length at which it ends
- the capacity ratio at which permeation stops being the limiting resistance
- the apparent pressure exponent produced by a finite surface step in series with the wall
pymrm_api:
- construct_grad
- construct_div
- construct_convflux_upwind
- NumJac
reference:                     # the paper actually read, and the source of every equation
  authors:
  - Itoh, N.
  year: 1987
  container: "AIChE Journal 33(9) 1576-1578"
  doi: 10.1002/aic.690330921
  note: >
    Names the law and uses it: "The permeation rate of hydrogen gas through the
    palladium membrane, Q_H, was assumed to obey the half-power pressure law
    (Bohmholdt and Wicke, 1967), i.e., it is proportional to the difference
    between the roots of the hydrogen partial pressures in the reaction and
    separation sides". Prints it as Eq. 1 together with the cylindrical
    permeance alpha_H = 2 pi l_0 D C_0 / ln(r_o/r_i), and evaluates it:
    D = 9.23e-10 m2/s (his citation: Nagamoto & Inoue 1985), C_0 = 1280 mol/m3
    (his citation: Sieverts & Danz 1936), alpha_H = 4.47e-5 mol/s at 473 K.
    Every character verified on the native 300 dpi bitmap; no misprint anywhere
    in the permeation law. Itoh prints NO permeation measurement and NO
    temperature dependence, and never tests the exponent. Same source as H1.4.
origin_not_consulted: >
  Bohmholdt, G. and Wicke, E. (1967), Z. physikalische Chemie, Neue Folge 56,
  133 - the half-power pressure law, as Itoh attributes it; Sieverts, A. and
  Danz, W. (1936), Z. physik. Chem. (B) 34, 158 - the solubility constant
  C_0 = 1280 mol/m3, which is the ONLY thing Itoh cites them for; Nagamoto, H.
  and Inoue, H. (1985), Chem. Eng. Commun. 34, 315 - the diffusivity
  D = 9.23e-10 m2/s. All three are recorded without DOIs: no copy was available
  and no citation could be verified against an original, so the container and
  year come from Itoh's reference list only. None was consulted, and nothing on
  the page derives from them beyond the two constants Itoh quotes. Itoh does not
  reprint any of their results - he cites Bohmholdt & Wicke for the exponent and
  then writes his own Eq. 1 - which is why the read paper, not the origin, is in
  `reference`.
data:
  tier: 2
  method: stated in text
  status: complete
note: >
  Promoted into the first wave after H1.12 was deferred. Built from the
  permeation closure Itoh (1987) prints and evaluates; the catalog's second
  citation, Caravella et al. (2010) on the empirical pressure exponent, is not
  on disk and is not used. The page therefore treats the exponent by derivation
  (dissociative equilibrium; a series surface resistance giving an apparent
  exponent from 1/2 to 1) and never claims to test it against data. A future
  page comparing measured exponents with the half-power law needs a permeation
  dataset and is recorded as a follow-up on queue_cases/H1.1.yaml.
related:
- H1.4
- H1.3
- H1.5
- H1.7
