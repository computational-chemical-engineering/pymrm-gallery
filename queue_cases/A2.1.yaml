notes: 'Scope discrepancy worth flagging to whoever dispatches cases. This case was handed
  out as "A2.1 — axial dispersion in packed beds", slug axial-dispersion-packed-bed. The catalogue
  assigns A2.1 to Danckwerts boundary conditions (S4, T0, P1); packed-bed axial dispersion
  is A2.5 (Edwards–Richardson) and A2.6 (Gunn). The catalogue was followed, per the instruction
  to take the exact title and canonical reference from docs/catalog-A-foundations.md. A2.5
  is already independently marked needs-paper, so the dispatch appears to have crossed the
  two IDs.

  When the paper arrives, the page is cheap and needs no figure digitisation. Danckwerts 1953
  is analytic, so the validation should come from checks the paper itself pays for rather
  than from data: the closed-vessel solution must collapse to plug flow as Pe→∞ and to a CSTR
  as Pe→0; the RTD must integrate to unity with a mean of exactly the space time for any Pe
  (the property that makes the closed BCs the right ones — the open-vessel BCs fail this);
  and the first-order conversion must reproduce the Wehner–Wilhelm closed form. Cross-link
  A2.3, which is published and supplies the D_ax that these BCs then close.'
