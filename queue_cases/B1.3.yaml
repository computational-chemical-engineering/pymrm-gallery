what_it_carries: >
  The general asymptotic solution and the generalised modulus that collapses the
  eta-vs-modulus curves for arbitrary rate forms onto a narrow band - stated in
  the abstract as the paper's whole point: "a general asymptotic solution ...
  leads to the definition of a general modulus somewhat different in form from
  the standard one. The use of this general modulus tends to approximately bring
  together all of the various curves." It also derives "a few new exact
  solutions for simple order reactions" and combines them with existing
  solutions for simple-order and adsorption (LHHW-type) rate forms.
  Passes the E1.1 test outright - this is the origin, by the person the case is
  named after. Bischoff cites Thiele (1939) and Zeldovich (1939) as the classical
  treatments, so the page can state the lineage from the source rather than from
  memory.
validation_route: >
  The eta-vs-generalised-modulus collapse is the result, and the "narrow range"
  claim is a quantitative claim a page can test directly: solve each rate form
  in pymrm, plot on the generalised modulus, and MEASURE the band width rather
  than asserting it. That is an analytical/derived route needing no data and no
  maintainer. Whether the paper prints the collapse as a table or only as
  figures has NOT been checked off the renders - but the page does not depend on
  it, because the curves are computable.
notes: >
  Excellent fit for the gallery: B1.1 (Thiele) and B1.5 (Weisz-Hicks) are already
  published and B1.2 (Aris shape modulus) is published, so B1.3 completes the
  modulus quartet and can reuse all three. The strongest version of the page is
  the one that quantifies how narrow "narrow" is, including where it fails.
  SECONDARY SOURCE, on disk, mapped to no case of its own:
  `Pan1998-cylindrical-pellet-effectiveness-CES53-933.pdf` = Pan, T. & Zhu, B., "Study on
  diffusion-reaction process inside a cylindrical catalyst pellet", Chem. Eng.
  Sci. 53(5) 933-946 (1998), born-digital-era scan at 600 ppi native. It
  proposes an approximate analytical effectiveness factor for ARBITRARY KINETICS
  in a cylinder with a claimed maximum deviation below 1.5 %, and reproduces
  Weisz-Hicks multiplicity for a cylinder. That is a competing generalised
  approximation and an out-of-sample check on Bischoff's collapse. Use it as
  comparison, not as the source of the modulus.
