  summary: >
    Analytical route as planned; no figure digitised, no maintainer gate.
    Both printed spread claims measured and confirmed under a pinned reading:
    14.61% at m = 1.270 (root-found) for n in [1/2, 3] as eta_max/eta_min - 1
    ("about 15%"); with n = 0 included the max sits at the eq.-22 kink m = 1
    exactly, 40.55% max/min = 28.85% of the upper curve ("about 30%" is the
    fraction-of-upper reading). LHHW band 30.16% ("again about the same" holds
    vs the 30% figure only); volume-change family within 3.18% of the n = 1
    curve; standard-modulus contrast 120.6% peak / 41.4% forever. Dead-zone
    onset m* = (n+1)/(1-n) derived (not in the paper). Out-of-sample finite
    cylinder (Z = 1, n = 2, exact 2-D pymrm): Aris+Bischoff combination 0.030
    abs / 4.4% rel; slab-curve reading 0.099; Pan & Zhu 0.090 = 6x their
    claimed 1.5% (their own printed Table 6 already caps the claim: worst
    absolute gap a tie at 0.013, Z = 2 phi = 4 and 6, whose phi = 6 member is
    3.7% relative). FIVE printed defects, all proven from the papers' own
    numbers, none repaired: Bischoff Table 1 cell (0.905 vs exact 0.9107,
    11x its half-ULP rounding radius); Bischoff eqs. (27)-(28) as printed
    inconsistent with eq. (20) by 29-41% (amended form labelled as inference;
    the printed 15% shows Fig. 1 used the correct reduction); Bischoff
    eq. (14) denominator bracket exponent -1/2 where eqs. (8)+(13) force +1/2
    (m a factor n+1 low as printed, against printed eq. 21; +1/2 reading
    labelled); Pan & Zhu Table 5 mu2(Z=2.5) = 2.50 vs their eq. (30)'s 2.40;
    Pan & Zhu eq. (36) sign (-405 printed, +405 forced by their stated
    matching, printed sign sends their own Table 6 negative).
    Three routes agree to 2e-12 / 2e-6 (pymrm, order 2.01); 12-row break
    table incl. a null; coverage map asserted key-for-key; 3 sub-ABS_FLOOR
    metrics named. Deterministic (double-execution content-identical).
