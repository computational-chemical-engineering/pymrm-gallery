  detail: 'ACQUISITION ROUTE FOUND, NUMBERS STILL BLOCKED.


    Text layer: prose good and unusually clean for 1964 (335 well-formed decimals, no table
    captions at all — this paper is theory, not data). The moment-reduction argument reads
    intelligibly. Equations still need the page image.


    The Elsevier /content/article/pii endpoint returns text only; /content/object/pii returns
    {"choices":null} for this article, and the PDF endpoint returns a one-page preview with
    an AUTHENTICATION_ERROR entitlement. So there is no page image to render at 600 dpi, which
    is what docs/pdf-findings.md requires for every constant on a scanned original. The case
    therefore stays needs-paper.


    What the API text DID buy: a verified citation and DOI (previously absent or unchecked),
    and a reliable account of what is in the paper and where — enough to rank the request.'
