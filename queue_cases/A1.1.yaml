former_blocker:
  kind: figure-review
  question: 'The page is built, executes, and passes every check available to me,
    but the figure digitisation has not been through the maintainer''s visual review,
    which the gallery requires for every extraction. Three specific questions, all
    answerable in about fifteen minutes from the overlays: (1) is any red ring on
    something that is not a marker? (2) in the dense chain of Fig. 7''s top panel,
    are the ringed centres on markers, or sliding onto the drawn eq. (14b) line where
    the two merge? (3) roughly how many markers per panel did the detector miss -
    random misses cost precision only, a systematic one would bias the refit. If all
    three come back clean, set status to ready, fill the review block of data/ergun-1952-fig7-markers.meta.yaml,
    and move queue_cases/A1.1/page/ to pages/A1.1-ergun-pressure-drop/.'
  detail: 'Nothing scientific is unresolved. The extraction is self-consistent to
    an unusual degree: refitting Ergun''s two constants from the 244 recovered markers
    gives k1 = 151.9 and k2 = 1.697 against his printed 150 and 1.75 (+1.3 %, -3.0
    %); the three panels, which are three different laboratories with three independently
    fitted axis calibrations, give k1 = 146.6, 154.6, 151.0; and an independent second
    digitisation of the same runs from Fig. 5''s other ordinate agrees on binned median
    f_v to 2.9 % with no trend. The round trip is provably not circular - detection
    keys on the enclosed white interior of an open circle, Ergun''s drawn line has
    none, and the marker-free half of the top panel returns zero points. The one shape
    question that could have caused a systematic miss (Fig. 5''s Morcom panel uses
    four symbols) was resolved by direct inspection at 4x: Fig. 7 is all open circles
    and carries no shape legend.

    Also correct the catalog while you are here. docs/catalog-A-foundations.md says
    "Ergun''s original data are tabulated in the 1952 paper and are digitisable".
    They are not tabulated. The paper contains NO tables at all, and no text layer
    either - pdftotext returns four bytes for four pages. Everything on the page was
    read off 600 dpi renders and the dataset came out of the figures.'
