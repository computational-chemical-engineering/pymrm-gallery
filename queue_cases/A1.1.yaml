notes: 'Built as the comparison page the catalog asks for, so it COVERS A1.1, A1.2
  (Kozeny-Carman), A1.3 (Darcy-Forchheimer) and A1.4 (Eisfeld-Schnitzlein wall correction)
  in one. Mark all four when it is promoted.

  Page in queue_cases/A1.1/page/, slug ergun-pressure-drop, 25 cells, runs in about
  6 s. Five datasets with sidecars: 244 markers from Ergun''s Fig. 7 (three panels),
  74 from Fig. 5''s top panel as a cross-check, his constants plus the measured level
  of the line he labels Kozeny-Carman, and two files from Eisfeld & Schnitzlein (2001).

  Three findings worth carrying beyond this page.

  (1) The Eisfeld paper came whole out of the Elsevier PII endpoint (S0009250900005339)
  and, being born-digital 2001, does NOT suffer the lost-decimal-point failure recorded
  in pdf-findings.md for the pre-1980 scans. Its Table 1 turned out to be the key
  to the whole page: it re-catalogues the same primary sources Ergun plotted and gives
  each one''s D/dp range, which is the only way to locate the wall-effect regime on
  Ergun''s axes - his own plot carries no such term. Morcom''s spheres, tablets and
  nodules sit at D/dp = 3.7-10.6, exactly the range Ergun discarded from Burke & Plummer
  and kept in Morcom.

  (2) A new extraction method that is worth promoting into scripts/. For open circular
  markers on printed graph paper, do not build a shape detector at all: label the
  connected WHITE regions and keep the small ones, i.e. the hole inside each ring.
  It is immune to grid lines and to the model curve by construction - neither encloses
  anything - which is exactly what makes a "refit the paper''s own constants" round
  trip non-circular. It cost nothing and beat two attempts at ring template matching,
  which drowned in grid intersections. Mask the in-panel series label first: letter
  counters are enclosed white regions of the same size as a marker interior.

  (3) On log-read data, state the fit weighting. Unweighted least squares in Ergun''s
  own linear coordinates gives k1 = 168.5 (+12 %) because f_v spans two and a half
  decades; equal relative weight gives 151.9 (+1.3 %). The page prints both. This
  generalises to every gallery page that fits a correlation to digitised log-axis
  points.

  Not done, and cheap if wanted later: Figs. 6 and 8 hold the full 640-experiment
  set including Oman & Watson, but Fig. 6 is a single band 640 markers deep and the
  low-Re half is unresolvable. Figs. 5 and 7 were chosen because they separate the
  sources. Fig. 5''s Burke & Plummer and Morcom panels print too faintly in this scan
  to calibrate, so only its top panel was used.'
