text_layer:
  quality: BORN-DIGITAL with embedded TrueType subsets - the text layer is clean, including equation
    numbers and most Greek and sub/superscripts. The only monograph in the library besides Rawlings
    & Ekerdt whose equations survive extraction. Still worth spot-checking a constant against the
    page.
  render_at: not needed. The only image in the file is the 200 ppi cover JPEG.
scope_decision: 'ANSWERED BY THE MAINTAINER 2026-08-17. ONE PAGE WITH FIVE CONFIGURATIONS, not five
  pages. The maintainer agreed with the reasoning put on the decisions dashboard: the five sections
  of Froment, De Wilde & Bischoff Ch. 11 are a deliberate LADDER, each adding one transport mechanism
  to the previous, so five separate pages would repeat most of their assembly while one page can show
  WHAT EACH RUNG ACTUALLY BUYS - which is what the ladder is for, and which the 2026-08-13/15 batch
  established is the more valuable shape (J4.1 found Contois and Monod are the same model on
  constant-yield runs; F3.2 found an approximation whose stated assumption does not predict where it
  fails). The comparison IS the page.
  D1.1 IS THE OWNING CASE. D1.2, D1.3, D1.4 and D1.5 are to be flipped to `status: covered` with
  `covered_by: D1.1` AT INTEGRATION TIME, not before - the precedent is C2.10/D3.4, where the covered
  case was flipped once the covering page existed. Until then all five stay unclaimed so the queue
  does not claim coverage that has not been built.
  THE FIVE RUNGS, with their sections and structures:
    D1.1  S2  basic one-dimensional pseudo-homogeneous plug flow      sec. 11.5 (book p. 505)
    D1.2  S4  + axial dispersion, Danckwerts boundary conditions      sec. 11.6 (book p. 548)
    D1.3  S7  heterogeneous: gas and solid phases, film resistance    sec. 11.8 (book p. 585)
    D1.4  S8  + intraparticle profiles (nested particle model)        sec. 11.9 (book p. 597)
    D1.5  S6  two-dimensional pseudo-homogeneous, radial dispersion   sec. 11.7 (book p. 565)
  The page therefore carries structures S2, S4, S6, S7 and S8 - the widest of any page in the gallery.
  Note the BOOK ORDER is not the ladder order: 11.7 (two-dimensional) sits between the heterogeneous
  sections in the book but is the fifth rung of the ladder, so the page must say which ordering it
  uses and why.'
