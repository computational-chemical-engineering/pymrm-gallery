what_it_carries: >
  The origin of the redox (Mars-van Krevelen) mechanism, in the authors' own
  words: oxidation of benzene, toluene, naphthalene and anthracene over vanadium
  oxide in a FLUID BED (chosen, as the summary says, because these reactions are
  so exothermic that a uniform temperature is otherwise unobtainable), with the
  partial pressures of both reactants varied as widely as possible. Both
  reactants are shown to influence the rate; the rate expression is derived and
  interpreted as two successive steps - reaction of the aromatic with surface
  oxygen, and re-oxidation of the partly reduced surface. The paper then shows
  the same form describes literature SO2-oxidation data, and uses it to compute
  the optimum temperature profile of a fixed-bed SO2 converter and the catalyst
  split between the stages of a multi-stage reactor, comparing against practice.
  Passes the E1.1 test outright: derives, names and tests the result.
validation_route: >
  PRINTED TABLES plus the paper's own multi-stage SO2 converter calculation,
  which is a worked design the page can reproduce end to end. Confirm the table
  inventory off the renders before promising it - the api-text's table
  reconstruction cannot be trusted and was not used for this note.
notes: >
  C1.3 is now the strongest T0/P1 kinetics build available: an origin paper, a
  real scan, a mechanism that is one line of pymrm source term, and a printed
  reactor calculation to check against. Build it after C1.1 so the LHHW page
  exists to contrast the redox form with.
