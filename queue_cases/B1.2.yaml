notes: 'BUILT AND VERIFIED, staged at queue_cases/B1.2/page/. Not promoted: B1.2 has
  no models.yaml entry and models.yaml was not touched. Promotion = move the directory
  to pages/B1.2-aris-shape-factor/ and add the matching entry.

  Scope: B1.2 alone. The catalogue''s B1 gallery-angle note asks for no comparison
  page here; it flags B1.1+B1.5 as the flagship and notes that B1.12''s deferral leaves
  S13 undemonstrated. This page partly fills that gap - construct_div with nu on a
  radial domain that does not start at the origin (spherical shell), plus multi-axis
  assembly in 2-D and 3-D - though not the callable-nu form B1.12 was to demonstrate.

  Complements rather than duplicates B1.1, which already plots the Aris collapse for
  Thiele''s three geometries. This page is about the shapes with no closed form: four
  spherical shells, five finite cylinders, a square rod and a cube.

  Headline results. The band over 14 shapes is 0.1164 at Lambda = 1.12 against Aris''s
  plate-sphere 0.0918 - 27% wider. The sphere is NOT the lower envelope: at the same
  v_p/s_x = a/3 the cube lies 0.0261 (3.7%) below it, with the cylinder of length
  2a between them. Aris''s own equal-volume claim (the Leva shape factor) still holds;
  the page shows the two are different questions.

  Resolved a genuine ambiguity in the paper. His case (iv) double series is never
  evaluated, and his p is defined two incompatible ways (nomenclature: radius:length;
  running text: length = 2a/p), differing by the factor of 2 the axial eigenvalue
  is most sensitive to. A 2-D axisymmetric pymrm solve matches the series as printed
  to 4.2e-4 under the nomenclature reading and is out by 47% under the running-text
  reading. The series is right as printed; the running text is the error.

  REUSABLE LESSON FOR THE GALLERY: Chemical Engineering Science reprinted a dozen
  pre-1970 classics verbatim in its 1995 Golden Jubilee issue (vol. 50). Those reprints
  are clean re-typesettings with usable text layers. For an old CES paper whose scan
  OCRs badly, look for the reprint BEFORE resorting to page-image reading - search
  CrossRef for the same title and filter to volume 50 (1995). This is a candidate
  addition to docs/pdf-findings.md.

  Validation summary: Table 1, 19/21 entries to 7.8e-4; the shell expression against
  its 5 printed values to 4.1e-4 plus both stated limits (1.1e-16, 5.8e-10); pymrm
  1-D vs the closed forms 2.4e-4; 2-D vs the printed series 4.2e-4; 2-D square rod
  and 3-D cube vs independent eigenfunction expansions 8.2e-6 and 7.5e-5 with second-order
  refinement (ratio 2.29); eq. 18 extrapolates to 1 within 0.0011; eqs. 19-20 reproduce
  1.316 and 0.658 exactly.

  Numerical caveat carried on the page: beyond Lambda ~ 5 the cube curve is its eigenfunction
  series, not a pymrm solve, because a 24^3/32^3 grid does not resolve the O(1/lambda)
  reacting layer (the two differ by 11% at Lambda = 20).

  '
