blocker:
  kind: review
  question: Two printed numbers in Aris 1957 could not be confirmed, and neither is
    used by any model on the page - both are simply printed as discrepancies. (1)
    Table 1's cylinder column at Lambda = 5 and 10 reads 0.197 and 0.100, where the
    paper's own eq. 16 gives 0.1897 and 0.0975; the plate and sphere columns are correct
    at those same points, so these look like arithmetic slips - but that cannot be
    asserted from arithmetic alone. (2) The third number in section 4's mixture example
    is 0.397 in the 1995 reprint, 0.897 in the 1957 OCR, and recomputes to 0.4936,
    while the other two numbers in the same sentence reproduce exactly. If printing
    them as discrepancies is acceptable, this page goes to ready unchanged.
  detail: '(a) Table 1, cylinder column: printed 0.197 at Lambda = 5 and 0.100 at
    Lambda = 10, against 0.1897 and 0.0975 from the paper''s own eq. 16 (+3.8% and
    +2.6%). The plate and sphere columns are correct at those moduli and the other
    19 entries agree to 0.0008, so this looks like two arithmetic slips in the original
    rather than a transcription error - but that cannot be asserted from arithmetic
    alone. The 1957 scan and the 1995 reprint show the same digits.

    (b) Section 4''s mixture example, third number: the 1995 reprint prints 0.397,
    the 1957 scan''s OCR gives 0.897, and eq. 19 recomputed gives 0.4936. The other
    two numbers in the same sentence (mean modulus 1.316, eta 0.658) reproduce EXACTLY,
    which pins down both the formula and the fact that the example uses the flat-plate
    curve - so the third number is the anomaly. The page prints all three candidates
    and uses none of them.

    Neither number is used by any model on the page; both are reported as discrepancies.
    If the maintainer is content with that, status becomes ready with no code change.

    '
