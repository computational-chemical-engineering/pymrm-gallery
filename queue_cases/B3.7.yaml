text_layer:
  quality: >
    Poor. The scan's OCR inserts spaces inside words throughout the body ("has
    long been recognized to have a p r o f o u n d influence") and renders
    exponents as "104 - 2 * 105 K/s" and "6.6 * 104 s -1". THE EXPONENTS ARE THE
    WHOLE POINT of a two-competing-rate model - read every pre-exponential and
    every activation energy off a cropped image, and treat any implausible
    magnitude as a lost decimal, never "fix" it by inference (the D2.2 rule).
  render_at: 300 dpi. CCITT-G4 bilevel at 300 x 300 ppi native.
what_it_carries: >
  The measurements and the model, both. Devolatilisation of a lignite and a
  bituminous coal in a flow furnace at heating rates 1e4-2e5 K/s, 1000-2100 K,
  millisecond time resolution; volatile yields rising from ~30 % (d.a.f.) at
  1260 K/20 ms to ~63 % at 2100 K/25 ms, well above the 46 % ASTM proximate
  value. A single first-order Arrhenius fit is reported (apparent frequency
  factor ~6.6e4 s^-1, apparent activation energy ~25 kcal/mol) AND THEN SHOWN TO
  BE INSUFFICIENT: "An empirical model based on TWO COMPETING overall reactions
  gave a better fit of the data over all of the conditions of the present study
  than was obtained using the single-reaction model."
  That sentence is the case, and it is the origin, by the people the case is
  named after. Passes the E1.1 test outright.
validation_route: >
  POTENTIALLY EXPERIMENTAL - the paper reports measured yields against
  temperature and residence time, and the single-vs-two-reaction comparison is a
  quantitative claim a page can re-run. Whether the yields are tabulated or only
  plotted has NOT been checked off the renders. CHECK FIRST: if figure-only this
  case reaches the review gate, and no maintainer is available as of 2026-08-05.
notes: >
