follow_up:
  kind: optional-figure-digitisation
  question: 'Figure 4''s three CALCULATED curves were digitised as a trial and are
    staged unreviewed. With the reconstructed K_p(473) = 2.357e11 Pa^3 the page''s
    model matches the 25 traced points to rms 0.023 in conversion (0.012 over the
    19 points away from the steep near-origin region); dividing or multiplying K_p
    by 1.58 degrades that to 0.047 / 0.044, and by 3 to 0.100 / 0.094. So the
    authors'' own curves discriminate K_p at the factor-1.6 level and select the
    reconstruction - which is exactly what the one measured point cannot do
    (validation check 1 shows K_p is unconstrained there to within an order of
    magnitude). Adopting this would give the page its only K_p-discriminating
    check. It needs a visual review of the 25 numbered points on the overlay
    first. Worth it?'
  detail: Not blocking - the page ships without it and is complete as staged. These
    are the authors' own CALCULATED curves, so even after review this is reproduction,
    not measurement, and the page stays tier 6 on the data side; no experimental tier
    is gained. Artifacts are in queue_cases/H1.4/review/ - extract_figure4.py (deterministic,
    tick pixel coordinates recorded in the source and re-asserted at run time), fig4_digitised.csv
    (25 points) and fig4_overlay.png (numbered, git-ignored as a page image). WARNING
    for the integrator - .gitignore covers only *.png/*.jpg/*.pdf under queue_cases/*/review/,
    so fig4_digitised.csv is NOT ignored and must not be committed while unreviewed;
    do not run 'git add -A' in that directory. Regions deliberately skipped by the
    extraction - the merged near-axis region below 0.41 scale units, the flat right-hand
    two-thirds of the 0.29 curve where it lies on the frame rule, and every column
    where an experimental marker or the 'calc.' leader line crosses a curve. Stated
    digitisation uncertainty 0.005 in X on the shallow parts and 0.015-0.02 for the
    six steep near-origin points (ids 1, 2, 8, 9, 17, 18). The verifier reached the
    same conclusion independently from its own 23-point digitisation (rms 0.0105 /
    0.0370 / 0.0484).
  artifacts:
  - queue_cases/H1.4/review/extract_figure4.py
  - queue_cases/H1.4/review/fig4_digitised.csv
  - queue_cases/H1.4/review/fig4_overlay.png
