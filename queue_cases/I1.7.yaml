  kind: paper
  question: >
    Does the Vanden Bussche & Froment (1996) reversed-flow paper now on disk
    carry enough of the reverse-flow reactor model to source I1.7 by the
    AGENTS.md reprint route? It states the principle ("a bell shaped temperature
    wave is generated in a fixed bed, by alternating the direction of the feed
    flow at fixed intervals"), simulates a reversed-flow reactor as its baseline,
    and reports its drawbacks quantitatively - but it is about the STAR
    variant, on one chemistry, and it does not review or derive the general
    reverse-flow model that I1.7 names. ANSWER THIS BEFORE REQUESTING MATROS &
    BUNIMOVICH.
  detail: >
    Matros & Bunimovich, Catal. Rev. 38 (1996), is not on disk and no
    open-access copy has been found.
