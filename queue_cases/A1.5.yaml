  - scripts/check_metadata.py was NOT run: it validates pages/ against models.yaml
    and A1.5 is in neither yet. Run it after the splice.
  - THE CITATION NEEDS A DECISION. The document on disk is the 1997 Jubilee
    Supplement reprint and the original page numbers 35-53 are nowhere printed on
    it. models_entry.yaml cites the 1954 original (as the reprint's own running
    footer does) with reference_read_from carrying the reprint and its DOI, per the
    AGENTS.md reprint convention. The catalogue's "32, 35-53" is left as the
    catalogue has it; the page explicitly declines to assert that range as read. If
    the maintainer wants it verified, the 1954 printing itself is needed.
  - queue_cases/A1.5/review/ holds the adversarial verification report only; this
    case is NOT gated on a figure review and nothing on the page is digitised. The
    findings of that report (the eq. (37) claim, the Table II identity, the
    restricted-range interval, the eq. (39)/(34) relabelling, the unseeded
    bootstraps, the cite_data range and the doubled 4.2 x 15^-1 glyph) have all
    been applied to the page, the four sidecars and the CSV.
  - agreement.json carries 90 metrics; notebook runtime ~20 s. Every bootstrap is
    seeded and two consecutive executions produce byte-identical outputs and an
    identical agreement.json.
  - Two origins are cited but not consulted, and both are in models_entry.yaml
    under origin_not_consulted: Steinour (ref. 4) and Lewis, Gilliland and Bauer
    (ref. 9), whose slopes also enter Fig. 18. Nothing on the page separates their
    contribution from the authors' own, because the paper does not.
  - A1.6 (Wen-Yu) appeared under queue_cases/ while this case was being built, so
    it is evidently in flight in parallel. It supplies the minimum-fluidisation
    velocity at which a bed stops obeying A1.1 and starts obeying A1.5, and the
    Reuse section of this page names that gap and marks A1.6 as "not built here".
    If A1.6 lands first, that sentence is the only thing on this page that needs
    re-reading.

