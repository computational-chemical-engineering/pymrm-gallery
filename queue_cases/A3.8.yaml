review_note: >
  No figure is digitised, so there is nothing for a maintainer figure review to
  answer. The paper prints its constants, its reduced Table 1 and its four error
  bands as numerals; Figs. 1, 2, 3 and 7 are scatter plots of the fits, Fig. 8 is
  Z_cal against Z_act and Fig. 9 is the resistance split for distillation, and all
  are explicitly scoped out on the page.

headline_numbers:
  eq4_identity: >
    Eq. (4) recovered from eq. (3) two independent ways (sympy reduction; 4000-
    sample numerical evaluate-and-regress): prefactor 0.774443 and exponent
    -0.300000 against Onda's printed 0.771 and -0.30, i.e. +0.447 % and 1.7e-16,
    with the two routes agreeing to 2.2e-16.
  exponent_window: >
    Eqs. (1)+(2) force dln(k_L a)/dlnL into (0.666667, 0.800000]. Table 1's six
    printed exponents: 4 inside, 2 above the ceiling (both spheres, 0.86 and
    0.83), worst excess +0.060. Null baselines: Onda's ceiling scores 0.0667 mean
    |error|, n = 2/3 scores 0.0967, n = 1 scores 0.2367, and a single FITTED
    constant n = 0.7450 scores 0.0533 - and Onda's own window MIDPOINT (0.7333,
    zero free parameters) scores the same 0.0533, so the comparison cannot
    separate a fitted constant from Onda's window; only the ceiling
    representative loses. What it bounds is the evidential value of six rows.
  shulman: >
    Eq. (4) vs Shulman's eq. (5) over the paper's own stated 100 < X < 10,000:
    -14.95 % / cross at 1485.6 / +12.12 %, worst 14.95 %, mean 6.97 %, against a
    constant-j_D null that is ~100 % out at each end.
  inert_exponents: >
    eq. (1)'s 0.75 is EXACTLY inert at sigma_c = sigma (relative change 0 to
    twelve digits); eq. (3)'s 1/3 moves packed height by 0.73 % when doubled,
    since Sc_G = 0.971 for air.
  column: >
    Z = 0.8063 m for 95 % removal at the illustrative operating point; branch
    factor 2.615 on the constant and 2.024 on the height; pymrm vs closed form at
    order 1.990, 1.90e-6 at n = 800, extrapolated 1.04e-8; the A2.6 cell-centre
    reading is 384x worse at order 1.007.

