# FIGURE REVIEW OWED - published without one, deliberately, and this records why.
#
# Two of the six datasets on this page are digitisations, and unlike every other
# digitisation in the gallery (A1.1, A3.4, F3.5, G1.7, G1.8, A2.5) neither has had
# a maintainer overlay review:
#
#   yagi-kunii-1957-figure12-endpoints.csv       10 endpoint readings, Fig. 12
#   yagi-kunii-1957-figures13to17-curve-ends.csv 17 curve-end readings, Figs. 13-17
#
# Both are readings of the AUTHORS' OWN COMPUTED CURVES and of profile endpoints,
# not of their measured data - the measured markers in Figures 13-17 are
# deliberately scoped out and the sidecar says so. So this is reproduction, not
# validation, and the page's tier and framing reflect that.
#
# They are still load-bearing: Figure 12's endpoints fix the Delta t = 195-260 C
# range at which the reduction-bias headline is quoted, and the curve-ends carry
# the p = 1 bound (2.44 % mean over 14 non-firebrick readings). If either
# extraction is wrong, both numbers move.
#
# The builder also ran an INTERIOR-point comparison and correctly did NOT publish
# it, because reading the interior thermocouples is a digitisation needing the
# review that is unavailable. Its result is in the fixer's report.
#
# ASK: overlays for both, on the established pattern.
