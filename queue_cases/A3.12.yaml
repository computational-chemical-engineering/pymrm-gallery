  break_table: >
    Rebuilt for this page's physics, not inherited. A single recompute() function
    rebuilds all 53 published metrics under 20 injected defects; 53 of 53 are moved
    by at least one, and an assertion checks recompute() reproduces the narrative
    cells before any injection. Five metrics sit below check_agreement.py's
    ABS_FLOOR = 1e-12 and are named on the page as outside the CI regression suite.
  scoped_out: >
    Figures 13-17, the authors' ONLY measurements of their own (ke0/kg against mean
    bed temperature for five packings, 0-1000 degC). They are figures; digitising
    them needs a maintainer review and none is available. Figures 9 and 10, which
    carry phi(eps) and phi/phi_air(kg/kair), are also not digitised - Table 4 prints
    four (eps, phi) pairs from line B of Figure 9 and those are used instead. The
    complete tabular material is deposited as American Documentation Institute
    document 5305, which is not in hand.
  findings:
  - "Eq. (17) as printed is a factor of two low: it sets pi*l where the steady
     cylindrical solution requires 2*pi*l. Proved from the paper's own Eq. (19)
     constant 0.743 and its three printed dimensions - ratio 2.00095. Eq. (19)
     itself is correct, so no measurement in the paper is affected."
  - "gamma = ls/Dp = 1.2 mm/9.0 mm is printed as 0.0134 on journal page 379; the
     division gives 0.1333. Table 4 carries the ratio 1.2/9, so the paper's own
     calculations are unaffected; using the printed decimal shifts ke0/kg by
     +9.2 % at 400 degC."
  - "THE HEADLINE: with phi read off Figure 9 per row, the solid-to-solid radiation
     coefficient h_rs is algebraically degenerate with it. Deleting Eq. (7)
     outright and re-solving for phi reproduces every printed Calcd. value to
     2.2e-16 (0 of 14 rows lose reachability); the same holds for the gamma(kg/ks)
     solid-conduction term. h_rv resists deletion on only 2 of 14. A control -
     halving the numerator - is flagged on 6 of 14, so the test is not blind. The
     paper's central claim (radiation dominant above 400 degC) concerns a regime
     no row of Table 3 reaches; its hottest is 300 degC."
  - "Table 3's calculated column cannot be reproduced from printed material: at
     eps = 0.40 it implies phi from 0.0077 to 0.0582, a factor of 7.6, while
     Table 4 assigns that voidage the single value 0.034. Forward calculation from
     Table 4's printed phi(eps) line misses the paper's own column by 10.6 % mean."
  - "The emissivity p is never printed anywhere in the paper. p = 1 is assumed on
     the strength of Figure 3's 'black body surface A'/B'' wording; p = 0.8 moves
     the 1000 degC iron-sphere value by -16.4 %."
  - "Reference 5 (Coberly & Marshall, Celite cylinders) is a genuine outlier in
     Table 3: its measured value appears TWICE in the paper, as Table 1's Eq. (6)
     intercept (10.4) and Table 3's Exp. column (11.4), agreeing to 8.8 %, while
     the calculated value is 5.5 - 52 % below both. The outlier is the calculation,
     not a bad measurement."
  - "The theoretical alpha = 0.179 for rhombohedral spheres over-predicts the
     lateral-mixing slope actually observed in Table 1 by 1.33 to 1.63 times even
     at the most favourable beta. The paper says so in words but never numerically."
