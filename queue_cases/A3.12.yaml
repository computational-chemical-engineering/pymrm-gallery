  metrics: 77
  break_table: >
    Rebuilt for this page's physics, not inherited. A single recompute() function
    rebuilds all 77 published metrics under 25 injected defects; 77 of 77 are moved
    by at least one. TWO assertions tie the narrative cells to recompute() at rtol
    1e-8 - one in Validation for the 65 metrics defined by then, one at the end of
    'What pymrm adds' for all 77 - plus an assertion that the two metric SETS are
    identical, so nothing escapes the sweep and nothing is swept but unreported.
    Three injections attack the p-structure of Eqs. (7) and (8), which every p = 1
    evaluation is blind to; one pairs Table 1 to Table 3 by row order instead of
    packing; one perturbs the Figure 12 endpoints by their stated reading error.
    Six metrics sit below check_agreement.py's ABS_FLOOR = 1e-12 and the page states
    the exposure precisely (CI skips only when BOTH values are below the floor).
    The page also states what the table CANNOT detect, first among them a baseline
    that is wrong rather than insensitive - which is what S1 below was.
  scoped_out: >
    The MEASURED points of Figures 13-17, the authors' ONLY measurements of their own
    (ke0/kg against mean bed temperature for five packings, 0-1000 degC). They exist
    only as plotted markers; digitising them needs a maintainer review and none is
    available. Figures 9 and 10, which carry phi(eps) and phi/phi_air(kg/kair), are
