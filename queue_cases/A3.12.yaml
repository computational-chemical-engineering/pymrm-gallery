    not read, and neither is a marker digitisation of measured data.
  findings:
  - "Eq. (17) as printed is a factor of two low: it sets pi*l where the steady
     cylindrical solution requires 2*pi*l. Proved from the paper's own Eq. (19)
     constant 0.743 and its three printed dimensions - ratio 2.00095. Eq. (19)
     itself is correct, so no measurement in the paper is affected. The pymrm nu=1
     solve is NOT independent evidence for this and the page no longer says it is:
     its 2*pi is typed in, and substituting pi returns the disputed printed value."
  - "gamma = ls/Dp = 1.2 mm/9.0 mm is printed as 0.0134 on journal page 379; the
     division gives 0.1333. Table 4 carries the ratio 1.2/9, so the paper's own
     calculations are unaffected; using the printed decimal shifts ke0/kg by
     +9.2 % at 400 degC."
  - "THE HEADLINE: with phi read off Figure 9 per row, the solid-to-solid radiation
     coefficient h_rs is algebraically degenerate with it. Deleting Eq. (7)
     outright and re-solving for phi reproduces every printed Calcd. value to
     2.2e-16 (0 of 14 rows lose reachability), and the compensating phi runs
     0.0075-0.054 - the same span the baseline inversion already occupies, and
     inside Figure 9's axis on every row, so the degeneracy is not an artefact of a
     wide search. h_rv resists deletion on only 2 of 14 at 14.2 %. A control -
     halving the numerator - is flagged on 6 of 14 at 46.7 %, so the test is not
     blind. The paper's central claim (radiation dominant above 400 degC) concerns a
     regime no row of Table 3 reaches; its hottest is 300 degC."
  - "CORRECTED on the fixer pass: gamma(kg/ks) is NOT degenerate in the same way, and
     the first draft's 'three of five ingredients are unidentifiable' was an artefact
     of searching phi up to 1. Absorbing the gamma deletion demands phi up to 0.4195,
     with 12 of the 14 rows above every value Table 4 prints (0.034-0.060) and 2 off
     the top of Figure 9's ordinate (0.2). A film 42 % of the particle diameter
     contradicts the paper's own words. ONE ingredient is invisible on Table 3, not
     three."
  - "CORRECTED on the fixer pass: Table 1's intercept and Table 3's Exp. column are
     NOT two independent tabulations. Table 3's footnote daggers all five shared
     references as 'Extrapolated values, N_ReM -> 0' - both columns are the authors'
     own zero-flow extrapolation of the same third-party flow experiments - and three
     of the five agree to EXACTLY 0.000000 % because they are one number printed
     twice. The evidence was already in the page's own CSV (exp_extrapolated) and
     unread. The comparison is kept as a transcription and internal-consistency check.
     The Celite argument survives in a narrower form: ONE measurement, reduced twice
     by the same authors, 8.8 % apart, with their calculation 52 % below both. Rows
     are now paired by PACKING; pairing reference 15 by row order gives -70 %."
  - "CORRECTED on the fixer pass: the reduction-bias headline is now quoted at the
     temperature drops the apparatus actually ran. Figure 12's five profiles have
     endpoints on a labelled 0-900 degC ordinate giving dt = 195-260 degC, where the
     bias is a nearly CONSTANT +9.8 to +11.5 % from a mean bed temperature of 110 to
     690 degC. The old '2.4 % to 21.7 % over dt = 50-800' is kept as a labelled
     extrapolation - 800 degC is about 3x the largest drop in Figure 12 and t_m = 500
     was arbitrary. Straightness likewise: a factor of 1.7-1.9 at the real drops, not
     the 4.5 the swept minimum at dt = 600 gives. And the remark is strong evidence
     AGAINST a constant conductivity but only partial evidence FOR Eq. (15), which
     still bows by 7.4-8.3 % of dt where a constant k bows by 13.7 %."
  - "NEW, and the page's one check that can catch a wrong BASELINE rather than an
     insensitive one: Eq. (15) evaluated from Table 4's parameters reproduces the ENDS
     of the paper's own printed THEORETICAL curves in Figures 13-17 to a mean of 2.4 %
     over 14 readings, worst 4.2 %. That includes both curves Figure 13 prints for the
     iron-sphere bed (beta = 1.0 and 0.9) and both Raschig-ring curves, whose beta is
     argued from geometry and is nowhere near 1. It is far stronger evidence that
     p = 1 is what the authors used than Figure 3's caption - though it is equally
     consistent with p = 0.9 (-1.3 % mean) and only excludes p <~ 0.8 (-4.9 %)."
  - "NEW: for the two insulating-firebrick rows the authors held Table 4's printed
     ks/kg = 4.48 constant, not its ks = 0.20. Holding ks misses their own Figure 16
     curve by 50-61 % at the low-temperature end; holding the ratio matches to
     0.9-6.6 %. That is presumably why ks/kg is printed for those rows and an em dash
     for every other. The page keeps ks = 0.20 as base case and reports the firebrick
     radiation crossover both ways, 265 and 233 degC; the paper's conclusion is
     unaffected either way."
  - "NEW: at p = 1 both radiation coefficients collapse to the same 0.1952(T/100)^3,
     so before this pass exchanging Eqs. (7) and (8) wholesale moved exactly 1 of 53
     metrics - and that one was the output of the assumption under test. Four p != 1
     metrics and three p-structure injections were added; the exchange now moves 6."
  - "Table 3's calculated column cannot be reproduced from printed material: at
     eps = 0.40 it implies phi from 0.0077 to 0.0582, a factor of 7.6 - or 2.3 with
     the one pathological row (ref 5's 12.7 mm Celite bed) removed, which is the row
     the page separately argues is the paper's worst calculation. Table 4 assigns that
     voidage the single value 0.034. Forward calculation from Table 4's printed
     phi(eps) line misses the paper's own column by 10.6 % mean."
  - "The emissivity p is never printed anywhere in the paper. p = 1 is assumed;
     p = 0.8 moves the 1000 degC iron-sphere value by -16.4 %."
  - "The theoretical alpha = 0.179 for rhombohedral spheres over-predicts the
     lateral-mixing slope actually observed in Table 1 by 1.33 to 1.63 times even
     at the most favourable beta. The paper says so in words but never numerically."
  - "delta is printed as smaller than 10^-5 on journal page 376, not 10^-6. No
     numerical effect (delta is set to 0 either way) but it was a printed constant
     read wrong and is corrected."
