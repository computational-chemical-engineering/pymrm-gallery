origin_not_consulted: >
  Bohmholdt, G. and Wicke, E. (1967), Z. physikalische Chemie, Neue Folge 56,
  133 - the half-power pressure law, as Itoh attributes it; Sieverts, A. and
  Danz, W. (1936), Z. physik. Chem. (B) 34, 158 - the solubility constant
  C_0 = 1280 mol/m3, the only thing Itoh cites them for; Nagamoto, H. and Inoue,
  H. (1985), Chem. Eng. Commun. 34, 315 - the diffusivity D. Recorded without
  DOIs: no copy was available and no citation could be verified against an
  original, so container and year come from Itoh's reference list alone. Not
  consulted; nothing on the page derives from them beyond the two constants Itoh
  quotes. Itoh does not REPRINT any of their results - he cites Bohmholdt &
  Wicke for the exponent and then writes his own Eq. 1 - so the reprint test of
  AGENTS.md is not met for them and the paper actually read stays in
  `reference`, as on H1.4 and B1.6.
