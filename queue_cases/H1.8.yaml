why_the_2008_paper_and_not_the_1991_one: >-
  This is exactly what papers-requested.yaml asked for and why. The 1991 paper was only ever
  reachable through the Elsevier api-text route, whose Table 2 of Lennard-Jones kinetic diameters
  comes back as "2 6 2 89 3 3 3 46 3 64 3 8" for 2.6, 2.89, 3.3, 3.46, 3.64, 3.8 - the decimal point
  rendered as a space, so a six-value row becomes an eleven-value row and nothing looks wrong until
  you count. This file retires that route. The 2008 paper restates the 1991 upper bounds throughout,
  so it is also the reprint route for them; the page uses `reference_read_from` accordingly. The
  hazard in the 2008 PDF is different and was handled: comma thousands separators inside table cells
  (1,073,700; 30,967,000; 5,369,140), read at digit scale on 300 dpi crops.
what_it_carries: >-
  P_i = k*alpha^n over the modern dataset. Table 12 tabulates k and n for THIRTEEN gas pairs, prior
  and present - but only NINE support a comparison (H2/O2 and He/O2 have present = NA; CO2/N2 and
  N2/CH4 have prior = NA), and the paper's own Conclusions classify exactly those nine. Tables 1-11
  tabulate 117 near-bound experimental points; Tables 13a/13b a Knudsen-transition analysis computed
  from Table 12 and therefore usable as an internal identity. Figures carry data clouds only and were
  not digitised. Fig. 12 (-1/n vs gas diameter) and Freeman's eq. (2) are out of scope: the paper
  prints neither kinetic diameters nor solubility constants.
built_summary: >-
  Nine comparable pairs. Front-factor share of the shift, at each pair's own geometric-mean
  selectivity: median 0.98, range 0.59-1.39 - and 0.5647 to 1.0334 on the four references Robeson's
  OWN Table 13 supplies; the two ranges are kept apart everywhere. The two lines are near-parallel
  (spread/shift < 0.20) for 6 of 9, i.e. THREE fail: H2/N2 0.34, H2/CH4 0.93, H2/CO2 2.05, and only
  H2/CO2 is one the paper itself attributes to a slope change. The paper's three "significant" pairs
  are reproduced 3 of 3 by the SELECTIVITY gain at fixed permeability and only 2 of 3 by dlog k or
  by the permeability gain at fixed selectivity; 3 of 3 holds at every evaluation point inside the
  permeability range all nine pairs share, but the third-to-fourth gap is itself reference-dependent
  and runs 0.011 to 0.111 decades across them. H2/CO2's two bounds cross at alpha = 37.47, inside its
  own tabulated range, where the 2008 bound sits 30.4 % below the 1994 one - and that "inside its own
  range" verdict rests on a SINGLE tabulated point (alpha = 100.9, next one down 23.1), which break
  row (T1) removes. 19 of 117 tabulated points lie above the bound they are tabulated against (r up
  to 3.49, geometric mean 0.478). V1: Tables 13a/13b reproduce from Table 12, median 0.017 %, 25 of
  26 inside a generous printing band, the exception 13a O2/N2 at -0.612 %. V2 IS A CONSISTENCY
  IDENTITY, NOT A SECOND ROUTE: its residual is the difference of the two corresponding V1 residuals
  (measured, agreeing to 4e-16 decades), so it cannot fail unless V1 fails; its real power is over
  this page's decomposition code. Given Table 12 the decomposition is a rearrangement and no
  arithmetic on Table 12 can corroborate it - the data-side shift is shown to be the same identity to
  5e-16 decades. THE SECOND ROUTE IS V3: a covering line re-estimated from the 117 points replaces
  the present bound. AT EACH PAIR'S GEOMETRIC-MEAN SELECTIVITY the two routes agree on the sign for
  9 of 9 pairs and to 0.0857 decades on the seven pairs spanning more than 1.5 decades of
  selectivity - and BOTH of those numbers are themselves reference-dependent, so both are swept:
  across each pair's own alpha_min, alpha_gm, alpha_median and alpha_max the wide-span worst case
  runs 0.0857 to 0.5431 decades (factor 6.3), the median over nine 0.0379 to 0.3151, and the sign
  count is 8 of 9 at alpha_min (He/N2 envelope -0.0117 vs decomposed +0.2016). The substituted route
  reproduces Result 3's ranking 3 of 3 at the same reference and at five of the seven references the
  PRIMARY route is swept over, 2 of 3 at each pair's own P_median and P_max where He/H2 falls to
  fourth - against 3 of 3 at all seven for the primary route; that asymmetry is stated, not glossed.
  It does NOT agree on the front-factor share (median 0.434 vs 0.982, range -0.0306 to 1.5494, all
  three now metrics) - the page's own caveat from the other side; the NEGATIVE share is explained in
  words (He/N2's envelope k is 12,239 against the prior 12,500 while the bound moved up 0.2988
  decades, so the whole shift is slope). Scope: the present line only; both routes read the prior
  block from the same restatement AND both use the same alpha_0 from Tables 1-11. Point selection
  limits the route's baseline agreement, not its detecting power: the residual responds 1:1 to a
  vertical error in the printed line, measured under break row (DD) at 0.07341 -> 1.07341.
  58 metrics, 14 break rows (three of them perturbing a single cell of Tables 1-11, not Table 12),
  coverage map BUILT FROM MEASURED MOVERS with the clean row recomputing all 58 by a separate code
  path and asserted equal to the reported values, bit-identically on every key - a second
  implementation of the page's ASSEMBLY, with the shared primitives (including envelope_fit) written
  once and the page saying so. Runtime ~8.7 s wall (measured, two consecutive in-place runs: 8.66 and
  8.66 s including kernel startup; four further runs in an isolated copy fall between 8.92 and
  9.26 s). Deterministic: two consecutive executions in an isolated tree give identical cell content,
  an identical figure (sha256 f95d1727bb70...) and a byte-identical agreement.json, all three also
  matching the staged files; build_page.py regenerates all 37 cell sources identically.
printed_defects_found: >-
  (1) Conclusions p. 399 name the significantly shifted pairs as "He/CH4, He/CO2 and He/H2" and then
  as "He/CO2, He/CO2 and He/H2" [sic] - He/CO2 twice, He/CH4 dropped. (2) p. 392 says "the one data
  point above the present upper bound" for O2/N2; Table 1 has two above the printed line. (3) Table
  13a's O2/N2 row misses k*alpha^n by -0.612 % against a worst-case propagated printing band of
  +-0.279 %. (4) Table 2 prints "Polypyrrole" where Tables 1/5/6 print "Polypyrrolone" for the same
  material from the same reference [21]; Table 12's prior block prints "He/CO2" without the final
  subscript. (5) The author repairs a compiled CH4 permeability in prose (80.2 -> 180.2) but not in
  Table 9, which still carries alpha = 1.9. All reported verbatim, none repaired.
integrator_notes: >-
  models.yaml has NO H1.8 entry (only a `related:` mention inside H1.7), so queue_cases/H1.8/models_entry.yaml
  is an APPEND, not an upgrade-in-place. `structures` is deliberately EMPTY and `pymrm_api` is
  deliberately empty - this is a correlation audit with no discretised model, and the page's "PyMRM
  implementation" section says so rather than manufacturing one. scripts/check_metadata.py does not
  constrain the contents of `structures`, and nothing in the site build reads it, so an empty list is
  safe; the page's front-matter `categories` deliberately carries no `struct:` tag. Nothing was
  written outside queue_cases/H1.8/; no git commands were run. review/ holds the verification report
  only - no figure was digitised anywhere on this page, so there is no overlay image to gate and
  nothing in review/ is copyrighted page imagery.
