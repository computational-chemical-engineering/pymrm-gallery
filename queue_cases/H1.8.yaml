doi_source: Elsevier full text fetched and read 2026-08-02 with the authorised API key (PII 037673889180060J).
  Identity confirmed from the article's own header — title, journal, volume, issue and page range
  — and from the author list in the body. Text saved to ~/papers/pymrm-gallery/api-text/Robeson-1991-JMembrSci-62-165-upper-bound.ELSEVIER-API-TEXT.txt
why_the_2008_paper_and_not_the_1991_one: This is exactly what papers-requested.yaml asked for and
  why. The 1991 paper was only ever reachable through the Elsevier api-text route, whose Table 2 of
  Lennard-Jones kinetic diameters comes back as "2 6 2 89 3 3 3 46 3 64 3 8" for 2.6, 2.89, 3.3, 3.46,
  3.64, 3.8 - the decimal point rendered as a space, so a six-value row becomes an eleven-value row
  and nothing looks wrong until you count. This file retires that route. The 1991 PDF is still not
  on disk, and this paper restates the 1991 upper bounds throughout, so it is also the reprint route
  for them - use reference_read_from if the page quotes a 1991 bound.
what_it_carries: P_i = k alpha_ij^n over the full modern dataset, with the finding that the 1991 bounds
  moved only slightly except where perfluorinated polymers are involved, and that the shift is almost
  entirely in the FRONT FACTOR k rather than the slope n - a testable decomposition. Two new gas pairs
  (CO2/N2 and N2/CH4) are added.
