notes: >-
  NOTE, 2026-08-08: the previous `notes:` block on this case said the 2008 paper was "NOT reachable"
  because the Elsevier API returned 404 for the PII derived from its DOI. That was written when only
  the 1991 api-text route existed. IT IS OBSOLETE. The 2008 PDF has been on disk since 2026-08-05
