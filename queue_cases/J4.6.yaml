e1_1_test: PASSED, and it covers BOTH halves of the case's "(1913); (1925)". The equilibrium derivation
  gives eq. (1.5.1-8), "the Michaelis-Menten equation for the rate of a simple enzymatic reaction",
  with K_M = k_-1/k_1 named as the Michaelis-Menten constant; then "In the second approach, formulated
  by Briggs and Haldane, the formation of the complex A-E does not necessarily reach equilibrium",
  giving eq. (1.5.1-13) "which is exactly the form of the Michaelis-Menten equation with K_M now given
  by (k_-1 + k_2)/k_1". Both named, both attributed, both derived - and the two K_M definitions differ,
  which is a discriminating test a page can run rather than a restatement.
e1_1_target_pinned: 'PINNED BY THE COORDINATOR 2026-08-13, BEFORE DISPATCH. THREE books on disk
  carry this case, which is exactly the unpinned-target situation that parked C1.5 - so it is
  decided here, once, and the page does not adjudicate between them.
  THE E1.1 TARGET IS FROMENT, DE WILDE & BISCHOFF 3rd edn, SECTION 1.5.1 (book pp. ~50-53, PDF
  66-67), eqs. (1.5.1-7) to (1.5.1-14). It is chosen over Levenspiel because it is the only source
  on disk that DERIVES BOTH HALVES of what this case actually is - the case reference is
  "(1913); (1925)", and Froment gives the equilibrium route to eq. (1.5.1-8) with K_M = k_-1/k_1
  AND the Briggs-Haldane route to eq. (1.5.1-13) with K_M = (k_-1 + k_2)/k_1, each named and
  attributed. Levenspiel Ch. 27 also passes E1.1 but covers only the M-M half plus inhibition; he
  is NOT a second target and is not to be adjudicated against Froment. Cite him only if the page
  uses something specific to him, and say so.
  SEPARATELY, AND NOT AS AN E1.1 SOURCE: Rawlings & Ekerdt Exercise 9.15 prints c_S-versus-time
  MEASUREMENTS. That is a DATA source, not a canonical source, and its E1.1 status is therefore
  irrelevant to the role it plays - use the printed numbers as an empirical test if they hold up,
  and label them for what they are (an exercise dataset in a textbook, whose provenance the book
  may or may not state - check and say which). Most gallery pages are tier 6 for want of any
  measurement, so this is worth the effort; but if the data turn out to be synthetic or unsourced,
  report that and let the page stand on the structural result.
  THE DISCRIMINATING TEST THE CASE OWNS: the two derivations give the SAME functional form with
  DIFFERENT K_M, so the question a page can actually settle is whether steady-state rate-versus-
  substrate data can separate them at all - and what extra information (k_2 relative to k_-1) would
  be needed. Do not let the page claim to have validated "the Michaelis-Menten mechanism" when what
  the data can support is far narrower.
  NEITHER ORIGIN IS ON DISK: Michaelis & Menten, Biochem. Z. 49, 333-369 (1913) and Briggs &
  Haldane, Biochem. J. 19, 338-339 (1925). Use reference_read_from and origin_not_consulted per
  AGENTS.md, and attribute to the origins nothing beyond what Froment prints about them - the A3.2
  attribution-drift defect (six statements crediting Higbie with what BSL printed) is the failure
  mode for exactly this kind of page.'
other_sources_on_disk: Levenspiel Ch. 27 section 27.1 "Michaelis-Menten Kinetics" plus 27.2 on competitive
  and non-competitive inhibition, and he attributes the special analysis to "Michaelis and Menten
  (1913)" by name and year in Ch. 2. Rawlings & Ekerdt give Michaelis-Menten as Exercise 9.15 with
  PRINTED c_S-versus-time measurements for parameter estimation - a ready validation set, but an exercise
  rather than a derivation, so their E1.1 status is unchecked.
