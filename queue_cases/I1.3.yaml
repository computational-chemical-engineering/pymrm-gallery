  actually solved; two retyped literals removed; the spectral "lower bound" renamed and its
  reasoning corrected; the coverage cell now asserts a PARTITION and works per (row, metric)
  pair; the sidecar's Re.Pr fixed to 400 under the X* scaling the page itself establishes.
  A latent NON-DETERMINISM the verifier's stream-only check missed was also fixed: pandas
  Styler emitted a random table uuid in text/html and its memory address in text/plain, so two
  runs differed byte for byte. Tables now go through a `show()` helper with pinned uuids. THIS
  IS LIKELY REPO-WIDE - every page that calls display(df.style...) has it.
  FINAL FIXER PASS 2026-08-15 (second verification, verdict "safe after fixes", 4 items; no
