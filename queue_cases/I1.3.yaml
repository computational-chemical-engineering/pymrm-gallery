  Also fixed: T_up_2d_strict had no continuum limit and is now reported as
  T_up_2d_first_step_dG1em4 with its divergence printed and a dG break row; the reconstruction's
  "two checks" are restated as one transcription check on the kinetics and one number with no
  printed referent; the shape/dimensionality split is redone like-for-like on one threshold
