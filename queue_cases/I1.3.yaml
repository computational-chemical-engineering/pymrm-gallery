what_it_carries: 'Simultaneous heat transfer, mass transfer and reaction for CO oxidation over Pt-containing
  monoliths, with NEGATIVE reaction order in CO and a strongly exothermic reaction. Steady state and
  transients, 1-D and 2-D. The abstract states the finding worth building the page around: "A two-dimensional
  model is shown to predict unusual behavior of the Nusselt number in the presence of rapid reaction.
  However, a simpler one-dimensional model is adequate for predicting monolith behavior." That is
  a testable claim about when the cheaper model is enough - which is exactly what pymrm adds here.'
related: I1.2 (Oh & Cavendish 1982 monolith transients) is already published and is the natural comparison.
check_before_dispatch: >-
  ANSWERED 2026-08-14 by the coordinator, text-layer structure scan only (no numbers taken). 8
  pages, 300 ppi. EXACTLY ONE PRINTED TABLE: Table 1, 'ASYMPTOTIC NUSSELT NUMBERS FROM
  ANALYTICAL SOLUTIONS'. Everything else is figures. But the abstract states the two claims this
  case exists to test, and neither needs a figure: 'A two-dimensional model is shown to predict
  unusual behavior of the Nusselt number in the presence of rapid reaction. However, a simpler
  one-dimensional model is adequate for predicting monolith behavior.' Table 1's asymptotic
  values are the anchor for the first; the second is a 1-D vs 2-D comparison the page can run
  itself. Scope the figure comparisons OUT and say so. This is the S6 case in the batch and the
  heaviest - build it last.
