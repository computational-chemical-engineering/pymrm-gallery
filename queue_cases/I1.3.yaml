  FIXED 2026-08-15 after verification (verdict "safe after fixes", 11 findings). The one that
  mattered: the page claimed on five surfaces that the paper's two light-off windows
  "contradict the mechanism it derives on p. 482". THEY DO NOT - the two windows are quoted
  for two figures whose abscissae stop at 0.20 (Fig. 2) and 0.50 (Fig. 11), and run at each
  figure's own length the page's own models reproduce both statements and the apparent 11 degC
