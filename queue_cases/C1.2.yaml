what_it_carries: >
  * The Langmuir isotherm theta = KP/(1 + KP) and its centenary framing.
  * The Langmuir-Hinshelwood rate law written out in full, denominator and all:
    r = k theta_A theta_B = k(K_A P_A K_B P_B - K^-1 K_C P_C K_D P_D) /
    (1 + K_A P_A + K_B P_B + K_C P_C + K_D P_D)^2 , with the explicit remark
    that in the US chemical engineering community this is called
    Langmuir-Hinshelwood-HOUGEN-WATSON kinetics "because Hougen and Watson
    extended the mathematical treatments and indicated that the reaction rate is
    a product of three terms, the rate constant of the surface reaction, the
    number of unoccupied active sites and the thermodynamic driving force".
    That sentence makes this file a direct cross-check on C1.1 and vice versa.
  * All THREE mechanisms Langmuir proposed for surface reactions, distinguished:
    two chemisorbed species reacting on neighbouring sites; the two-step redox
    route; and a gas-phase molecule colliding with a chemisorbed one - the last
    being what C1.2 is about. Langmuir's own application of it to CO oxidation
    on a Pt wire is cited and described.
  * Section 3, "The Real Eley-Rideal Mechanism", on what Eley and Rideal
    actually studied (para-ortho hydrogen conversion and H2/D2 exchange on
    tungsten) - a reaction with a molecule held in a van der Waals layer, not
    one colliding from the gas phase.

scope_caveat: >
  *** READ THIS BEFORE DISPATCHING. *** This is a HISTORICAL AND TERMINOLOGICAL
  paper, not a kinetics derivation. Its thesis is that the mechanism universally
  called Eley-Rideal should be called LANGMUIR-Rideal, and that the mechanism
  Eley and Rideal really studied is a different one entirely.

  Applying the AGENTS.md E1.1 test honestly: the paper NAMES the result the case
  is about, DISTINGUISHES it from its neighbours, and ATTRIBUTES it - to
  Langmuir, not to Eley and Rideal. What it does not do is derive or test an
  E-R rate expression in the way it derives the L-H one. So:
    * A page that builds the E-R / L-R rate law, contrasts its kinetics with the
      L-H law from C1.1, and reports what the attribution actually is, is
      DEFENSIBLE and is arguably the most interesting version of this page.
    * A page that presents this document as the origin of the Eley-Rideal rate
      law is NOT. That is the E1.1 failure in reverse.
  Whichever is built, the page must say plainly that the source it read argues
  the case's own NAME is wrong. That is a feature, not a problem - it is the
  same class of finding as B1.4 ("It was shown by WEISZ [9]") and H1.1
  (half-power law attributed to Bohmholdt & Wicke, not Sieverts), both of which
  are recorded in handoff.md as expected outcomes of reading the source.
validation_route: >
  NO DATA OF ITS OWN. This is a review; it contains no measurements and no
  tables. The page's quantitative content must be analytical: the L-H and
  L-R/E-R rate laws solved and contrasted over coverage and partial pressure,
  with the limits derived. That needs no maintainer and no figure work, but it
  also means the page cannot claim experimental validation. Say so.
notes: >
