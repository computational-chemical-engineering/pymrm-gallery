what_it_carries: >
  The paper sets out to test the reliability of the ONE-DIMENSIONAL plug-flow
  fixed-bed model against a TWO-DIMENSIONAL model with radial gradients, on a
  complex hydrocarbon-oxidation scheme, and reviews the basic data each approach
  needs. That makes it the source for BOTH C2.10 (the kinetics) and D3.4 (the
  multitubular reactor), and it is unusually well matched to the gallery,
  because the 1D-vs-2D comparison it argues in 1967 is precisely a pymrm
  S2-vs-S6 diff.
  CALDERBANK, the second name on the catalogue row, is NOT on disk. Say on the
  page which document each number came from.
validation_route: >
  PRINTED constants and printed axial/radial profiles for the worked case.
  Whether the profile comparisons are tabulated or only plotted has NOT been
  established off the renders; check before promising a quantitative overlay.
  The kinetic constants themselves are printed and are enough for a page.
notes: >
  SHARED FILE with D3.4. C2.10 is the kinetics, D3.4 is the multitubular
  reactor and the hot spot. Build C2.10 first. Both are T0/P1 and this is one of
  the two strongest reactor opportunities in the drop (the other is
  C2.3 + D3.2).
  Natural sibling to D2.2 (Van Welsenaere-Froment runaway, published) - same
  author, same hot-spot problem, and the published page already has the
  machinery.
