what_it_carries: >
  The paper sets out to test the reliability of the ONE-DIMENSIONAL plug-flow
  fixed-bed model against a TWO-DIMENSIONAL model with radial gradients, on a
  complex hydrocarbon-oxidation scheme, and reviews the basic data each approach
  needs. That makes it the source for BOTH C2.10 (the kinetics) and D3.4 (the
  multitubular reactor), and it is unusually well matched to the gallery,
  because the 1D-vs-2D comparison it argues in 1967 is precisely a pymrm
  S2-vs-S6 diff.
  CALDERBANK, the second name on the catalogue row, is NOT on disk. Say on the
  page which document each number came from.
validation_route: >
  RESOLVED on build (2026-08-05): the profile comparisons are FIGURES ONLY
  (Figs. 7-14, on coated color pages); nothing tabulated. But the running text
  states eleven numerical results (hot spot ~30 at 357; 2-D runaway at 360;
  1-D rises 40/48 at 362/363; 1-D runaway 365; U = 82.7/86/88; tm ~35 for both
  10%-heat-transfer variants; Pe_hR = 5.25; Re = 121), which is a tier-3
  stated-results route - no figure digitisation, no maintainer gate. The page
  reproduces all of them, plus the paper's printed Bessel-series exchanger
  solution as an analytic operator check.
scope_decision: >
  ONE PAGE covering both C2.10 and D3.4, staged here; D3.4 flipped to covered.
  The argument (the A2.1/A2.2 standard, recorded in full in D3.4.yaml): the
  paper prints NO kinetic data - the three Arrhenius lines are asserted as
  "fairly representative", nothing is fitted or compared to measurement - so a
  kinetics-only page would have no validation route except the reactor solves,
  which are exactly D3.4's content; and a reactor-only page would have to
  transcribe the whole kinetics anyway. The kinetics and their use are one
  result. The staged page builds both models, reproduces every stated number,
  and hosts the 1D-vs-2D comparison that is the paper's point.
notes: >
  BUILT 2026-08-05, staged at queue_cases/C2.10/page/, status ready for
  verification. Key findings recorded on the page: p. 24's "G = 4.684" and
  "dH3 = -1.090 kcal/gram mole" are European thousands separators (proved from
  the paper's own printed Pe_hR = 5.25, p. 19's "4684", and the physics);
  "44 gram moles/cu. meter" means 44 g/Nm3 (Figure 11's own axis unit).
  M_m = 29.48 and c_p = 0.25 are printed on p. 19, not p. 24; c_p is
  additionally pinned by the printed Pe_hR. k1's constants have an independent
  witness in D2.2's CSV (27000/1.98 = 13636, lnA = 19.837 - Van Welsenaere &
  Froment 1970 reuse them); k2 and k3 have NO independent witness on disk, and
  the page's k2<->k3 break row is labelled as their only guard.
  Natural sibling to D2.2 (published) - same author, same reactor, same k1;
  shared constants reconciled against D2.2's CSV on the page (8/9 rows <0.1%).
