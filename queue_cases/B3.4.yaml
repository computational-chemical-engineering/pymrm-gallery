what_it_carries: >
  The law itself, with its scope stated precisely in the abstract: the time to
  reach a given conversion is the SUM of the time in the absence of intrapellet
  diffusion resistance and the time under intrapellet-diffusion control; EXACT
  for a nonporous solid, a useful approximation for a porous one. The stated
  limitations are equally explicit and must go on the page: isothermal solid,
  intrinsic kinetics at least approximately first order in the fluid reactant,
  and effective diffusivity unchanged during reaction.
  It also gives the DIFFERENTIAL form (rate at a given conversion, not just
  conversion vs time), which the abstract notes remains valid when bulk
  temperature and concentration vary with time - the property that lets the
  single-particle law be dropped into packed-, moving- and fluidised-bed models.
  And it reports that with an appropriate fluid-solid reaction modulus the
  numerical criteria for the chemical-control and diffusion-control asymptotic
  regimes "remain identical for all systems considered".
  Passes the E1.1 test outright.
validation_route: >
  ANALYTICAL, and unusually strong. The law is an additivity claim that can be
  tested against a directly solved fluid-solid particle problem in pymrm across
  the regime map, with the ERROR of the approximation measured rather than
  asserted, and the "exact for a nonporous solid" claim confirmed as an
  identity. Both B3.1 (published) and B3.2 (unblocked in the same drop) are the
  two limits it bridges. No data needed, no figures, NO MAINTAINER.
notes: >
  This is the best-shaped page in the section-B half of this drop: a closed-form
  claim with explicitly stated validity limits, two sibling cases already or
  newly available to bound it, and a validation route that is a measurement of
  the approximation's own error. Build after B3.2.
  Watch the handoff.md "check that cannot fail" trap: if the additivity residual
  is computed from the same solve that generated both limits, it may be
  structural. Use an independently discretised particle solve for the reference.
