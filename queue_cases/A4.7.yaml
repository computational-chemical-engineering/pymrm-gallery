data_tier: |
  TIER 6 - REPRODUCTION, NOT VALIDATION. (The `tier: T1` field above is the
  COMPLEXITY tier and is a different axis; do not read it as a data tier.) Every
  target on this page is a number Krishna & Baur themselves computed. Every
  experimental comparison inside the page's scope lives only in a figure - Garg &
  Ruthven's ethane uptake, Shah's benzene diffusivities, Millot's Arrhenius data
  - none is digitised, and no claim on the page rests on one. Reproducing these
  numbers establishes that the page implements the review's equations and reads
  its parameters correctly; it says nothing about whether the Maxwell-Stefan
  description of zeolite diffusion is right. The same sentence appears in the
  notebook, meta.yaml, models_entry.yaml and the page README.

  NOT REPRODUCED: the review's Fig. 10(a) reports an inflection in the 3MP
  desorption kinetics. Neither of the review's two stated loading dependences of
  eth produces a turning point in the desorption rate here; the review does not
  say which one 3MP follows; the claim lives in an undigitised figure. Reported
  as a non-reproduction and left unresolved.

  NOTE ON THE H1.9 TIER REFERENCE BELOW: text-printed numbers are TIER 2 on
  docs/data-strategy.md's ladder, method `table`. Tier 4 means DIGITISED FROM A
  FIGURE. An earlier version of this file and of H1.9.yaml said H1.9 "can reach
  tier 4"; that was wrong on the repo's own ladder and is corrected.
