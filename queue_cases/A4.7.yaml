  The catalogue's crossref-auto DOI (the 1995 paper) resolves correctly; what
  was wrong was which of the two references actually carries this case.
notes: |
  BUILD FROM THE 2003 REVIEW, NOT THE 1995 PAPER. Two reasons.

  1. Subject. The 1995 paper's adsorbents are Kureha microporous *activated
     carbon* and a Takeda *carbon molecular sieve* — there is no zeolite
     experiment in it. Every occurrence of "zeolite" or "silicalite" in its text
     is in the introduction or the reference list. The 2003 review is about
     zeolites throughout (MFI, 4A, CBMC/MD-derived parameters).
  2. Text quality. The 2003 review is born-digital: the API text preserves
     Ð, Θ, θ, Γ, "Pa−1" and subscripted symbols, and Tables 1-5 (DSL isotherm
     parameters for alkanes in MFI at 300 K; C5/C6 isomers at 362 K; transition
     probabilities and zero-loading diffusivities; pure-component Langmuir
     parameters and M-S diffusivities for N2/CH4 in 4A at 193 K) come through
     with their headers intact. The 1995 paper is a scan: species labels are
     corrupted ("CaH6" for C3H6, "C3Hs" for C3H8, "COz" for CO2), the corrected
     diffusivity D-bar renders as "/)~(0)", and **Table 4 — the very table of
     single-component M-S diffusivities the case needs — is absent from the API
     text altogether**, present only as cross-references from the body. Its
     Table 1, 2 and 3 do survive with decimal points intact.

  If the 1995 experiments are wanted, request the PDF; UvA-DARE holds an open
  copy at the open_access URL above (repeated HTTP 503 on 2026-08-02, so it is
  an availability problem, not an access problem — retry).

  Note H1.9 was mapped to the same 1995 PII and is now corrected; see that file.
