doi_source: |
  Both DOIs verified 2026-08-02 against the Elsevier full text the authorised
  API key returned, reading the article header (title, journal, volume, issue,
  page range) and the author list in the body:
    * 10.1016/S1383-5866(03)00008-X -> "Modelling issues in zeolite based
      separation processes", Sep. Purif. Technol. 33(3) 213-254, Krishna, R.;
      Baur, R. Matches the catalogue's "Krishna & Baur (2003)".
    * 10.1016/0009-2509(95)00102-B -> "Experimental verification of the
      Maxwell-Stefan theory for micropore diffusion", Chem. Eng. Sci. 50(16)
