what_it_carries: >
  Part Three, "Kinetics and Catalysis", is 350 book pages in five chapters:
  XVIII Homogeneous Reactions (805), XIX Catalytic Reactions (902), XX Mass and
  Heat Transfer in Catalytic Beds (973), XXI Catalytic Reactor Design (1007),
  XXII Uncatalyzed Heterogeneous Reactions (1049).

  For C1.1 specifically, Chapter XIX derives the LHHW apparatus from the
  Langmuir isotherm rather than quoting it: single-site and DUAL-SITE
  adsorption, the concentration of dual adsorption sites c_l2 built from the
  fraction of unoccupied centres and the number s of equidistant adjacent sites
  (s = 4 for a square lattice, s = 6 for a triangular one, with the factor of
  one half for double counting), chemisorption with dissociation, and then the
  rate equations for surface-reaction control, adsorption control and
  desorption control in the kinetic-term / driving-force / adsorption-group
  form the catalogue names. Book p. 957 works a full example: "reaction
  controlled by a dual site with surface reaction in a pure feed", with the
  least-squares parameter estimation carried out on printed data.

  It passes the E1.1 test at the strongest possible level: this is not a
  restatement of someone else's result, it is the authors' own, by the two
  people the case is named after.

  BEYOND C1.1 - what else this book carries, checked deliberately, because a
  textbook is the lever `handoff.md` has been asking for:
    * Thiele's effectiveness factor, book p. 1013 (Chap. XX), stated with
      attribution ("E. W. Thiele, Ind. Eng. Chem., 31, 916 (1939)"), the
      modulus defined and the eta-vs-modulus curve plotted. B1.1 IS ALREADY
      PUBLISHED, so this changes nothing there - but it is a second independent
      witness to B1.1's central relation if that page is ever re-audited.
    * Chapter XX also carries the Gamson-Thodos-Hougen and Wilke-Hougen
      packed-bed j-factor correlations with their Trans. AIChE citations - i.e.
      section A3 material. NOT checked against any A3 case; do not claim it
      without doing so.
    * Chapter XXI Catalytic Reactor Design and Chapter XXII Uncatalyzed
      Heterogeneous Reactions overlap D1 and B3 respectively. Same caveat.
  Every one of those is a SEPARATE E1.1 question and none of them has been
  asked. Ask before dispatching, do not assume the book unlocks a class.

validation_route: >
  PRINTED WORKED EXAMPLES AND PRINTED DATA TABLES. Chapter XIX's illustrations
  give the rate data, the fitted constants and the intermediate arithmetic, so
  a page can reproduce the authors' own parameter estimation and compare
  constant for constant. No figure digitisation, no maintainer needed.
notes: >
  Dispatch order note: C1.1 is the LHHW *formalism* page, so it should be built
  before C2.3/C2.4/C2.10/C2.19, all of which are LHHW instances whose sources
  arrived in the same drop and which can then import from it.

  SECONDARY SOURCE, on disk, not the case's citation: `90131.pdf` = Kiani, D. &
  Wachs, I. E., "The Conundrum of 'Pair Sites' in Langmuir-Hinshelwood Reaction
  Kinetics in Heterogeneous Catalysis", ACS Catalysis (2024),
  doi:10.1021/acscatal.4c02813, born-digital and clean. It is a critical modern
  analysis of exactly the adjacent-pair assumption Hougen & Watson build on
  p. 913, and it is the strongest "pymrm/the gallery adds something" angle
  available here: the page can derive the dual-site rate law as printed and
  then show what the pair-site assumption costs. Use it as commentary, not as
  the source of the rate law.
