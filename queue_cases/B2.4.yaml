  Same author as B2.2 (Froment & Bischoff 1961), unblocked in the same drop, and
  the natural fourth page of the B2 deactivation series
  (B2.1 Voorhies -> B2.2 Froment-Bischoff -> B2.3 Levenspiel -> B2.4 Beeckman-Froment).
  All four sources arrived together on 2026-08-05; that whole series is now
  sourced end to end, which is unusual and worth exploiting as a connected set
  rather than four unrelated pages.
