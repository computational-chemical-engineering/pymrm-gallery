what_it_carries: >
  Deactivation by two distinct mechanisms treated together - coverage of active
  sites, and BLOCKAGE of the pore itself, which is the percolation-type
  mechanism the catalogue names and which produces a qualitatively different
  activity-vs-coke curve from site coverage alone.
validation_route: >
  To be established off the renders. The qualitative signature (site coverage vs
  pore blockage giving different activity decay shapes) is reproducible without
  any of the paper's data and is the safer page.
notes: >
