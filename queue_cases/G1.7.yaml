former_blocker:
  kind: needs-input
  question: >
    Figure digitisation review (the only human gate left): do the numbered
    crosses in queue_cases/G1.7/review/fig7_overlay.png (16 markers, dynamic
    hold-up) and fig6_overlay.png (20 markers, pressure gradient) each sit on a
    real data marker, one cross per marker, none missed, and are the four
    series correctly told apart by shape (open/filled circle/square)? The four
    touching-marker pairs to check specifically: fig7 crosses 13/14 (v_l = 4)
    and 15/16 (v_l = 2); fig6 crosses 17/18 (leftmost cluster) and 19/20
    (rho_g about 1.6).
  detail: >
    The page is otherwise complete and executes in ~5 s: coupled Eqs. (8)+(9)
    reproduce the 16 hold-up points to 2.9 % mean |dev| (paper's own stated
    error 8 %) and the 20 pressure points to 10.4 % (paper: 12 %), nothing
    fitted. If the overlays pass, flip the two sidecars' review blocks and
    publish; if any marker is wrong, only the affected CSV rows change.
  artifacts:
  - queue_cases/G1.7/review/fig7_overlay.png
  - queue_cases/G1.7/review/fig6_overlay.png
  - queue_cases/G1.7/page/data/wammes-1991-fig7.meta.yaml
  - queue_cases/G1.7/page/data/wammes-1991-fig6.meta.yaml
resume:
  staged_at: queue_cases/G1.7/page/
  established: >
    Paper identity verified (CET 14 (1991), not the CES companion - see
    identity_note). All equations and both tables read from 600 dpi renders and
