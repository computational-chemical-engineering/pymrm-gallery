identity_note: >
  The catalogue's "Chem. Eng. Sci. (1991)" citation points at the Wammes,
  Mechielsen & Westerterp CES 46 (1991) 409-417 atmospheric companion. The
  fetched OA copy is the same group's Chem. Eng. Technol. 14 (1991) 406-413
  synthesis paper, verified against its own header on the 600 dpi renders. It
  derives the high-pressure hold-up (Eq. 9) and pressure-gradient (Eq. 8)
  correlations itself, states their fitted ranges and error statistics, and
  carries the validation figures, so it is the right paper for this case; the
  CES companion is NOT needed. models_entry.yaml, meta.yaml and the page all
  record the actual CET reference and note the catalogue's original citation.
blocker: null
