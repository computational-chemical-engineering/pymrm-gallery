    CO2-absorption plug-flow model verified against Eq. (3) at first order.
    Do not re-digitise, re-derive, or re-transcribe anything.
  answer_changes:
    overlays_pass: >
      Set both sidecars' review blocks (reviewed_by/date/verdict), change their
      status from pending-review to complete and models_entry data.status to
