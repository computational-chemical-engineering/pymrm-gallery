  - queue_cases/G1.7/page/data/wammes-1991-fig6.meta.yaml
  - queue_cases/G1.7.yaml
  do_not_redo: extraction, equation transcription, model closure, page build
notes: >
  Deviation convention (model - measured)/measured throughout. Known honest
  limitations recorded in meta.yaml caveats: correlations tested on their own
  data (reproduction, not independent validation); tall-bed porosity assumed
  equal to the printed short-bed value (the +10 % pressure bias sits inside
  that uncertainty and the page shows the sensitivity); Fig. 6 gas identity
  ambiguous for the two middle density clusters (<= 4 % effect via viscosity).
