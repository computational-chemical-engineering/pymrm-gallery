  answer: 'The overlays look very good.'
  applied: >
    Both overlays confirmed - the 16 Fig. 7 crosses and the 20 Fig. 6 crosses,
    including the four split touching pairs that were flagged for specific
    attention (fig7 13/14 and 15/16; fig6 17/18 and 19/20). Verdict recorded in
