the_companion_is_not_C2.5: >
  *** DO NOT USE THIS FILE FOR C2.5, AND DO NOT LET IT CLOSE C2.5's REQUEST. ***
  C2.5 is catalogued to Vanden Bussche & Froment, J. Catal. 161:1 (1996), the
  CO2-based kinetic model. The paper on disk is a different 1996 paper in a
  different journal on a different problem, and - the decisive point - it does
  not use its authors' own kinetics at all. Its own text says the reactor model
  "was combined with a set of kinetic equations ... proposed by Graaf et al.
  (1988)". Its reference list carries Graaf, not J. Catal. 161.
  So for D3.3 this file is a genuine bonus: it is a methanol-synthesis reactor
  paper that runs on the SAME kinetics D3.3's primary source supplies. For C2.5
  it is worth nothing. Full record on queue_cases/C2.5.yaml.

what_it_carries: >
  * Graaf et al. 1988: the three-reaction LHHW kinetics (CO hydrogenation, CO2
    hydrogenation, water-gas shift) with fitted rate and adsorption constants -
    the source term for any methanol reactor page.
  * Vanden Bussche & Froment 1996: a transient fixed-bed methanol reactor,
    operated with periodic flow reversal, with the drawback of the plain
    reversed-flow reactor (strongly varying exit concentrations, which "disturb
    the operation of downstream equipment" and "significantly decrease the time
    averaged conversion") stated as the motivation, and the STAR configuration
    introduced to fix it. Reports that STAR exceeds the single reversed-flow
    reactor's conversion "by at least 5 percent", and gives operating conditions
    in its Table 2.
  Together they are a kinetics source plus a transient reactor study on the same
  chemistry.

scope: >
  D3.3's title names a LURGI / QUASI-ISOTHERMAL reactor. Neither document is
  that: Graaf is a spinning-basket kinetics study and Vanden Bussche is a
  reversed-flow reactor. A page can legitimately build the quasi-isothermal
  tubular reactor from Graaf's kinetics and then use Vanden Bussche's transient
  case as a contrasting operating mode - but it must not claim to reproduce a
  published Lurgi design, because no such design is on disk. A1.8 / A3.13
  discipline: name the missing component on the page.

validation_route: >
  PRINTED TABLES from Graaf (constants) and Vanden Bussche's Table 2 (operating
  conditions) plus its stated "+5 percent" conversion result, which is a
  reproducible target for a transient solve. The concentration-vs-time curves
  in the 1996 paper are FIGURES; a page can stand without them.
notes: >
