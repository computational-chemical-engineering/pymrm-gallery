    10, printed 0.197 and 0.100 against 0.1897 and 0.0975 from eq. 16, and
    (b) the section 4 mixture example's third number, printed 0.397 in the 1995
    reprint and 0.897 in the 1957 scan against 0.4936 recomputed.
