  validation_rank: >-
    Ranks 2 and 3 of the builder brief's ladder, and no figure was digitised. The
    paper prints (a) two THEORETICAL derivations of eq. (1)'s constant that the
    authors do themselves and that owe nothing to any fit - 0.28 and 0.34,
    reproduced here as 0.276000 (-1.4 %) and 0.339599 (-0.12 %); (b) two complete
    algebraic chains from eq. (4) to packed-bed and pipe j-factors, every
    constant printed; and (c) a Range of Variables table carrying the two sides
    of the regime split. All six figures are scatter correlation plots and none
    was touched: the digitisation route needs a maintainer review, none is
    available, and nothing this page claims requires one.
  headline_findings:
  - >-
    EQ. (6) AS PRINTED CANNOT PRODUCE EQ. (7). The chain forces the voidage as
    (1-Sigma)^0.36 Sigma^(-1) - Sigma^(-1) because P/v carries Sigma^(-4) and
    eq. (4) takes its fourth root - while eq. (6) prints ((1-Sigma)/Sigma)^(1/3),
    the same exponent on both. At the paper's own Sigma = 0.41 the printed form
    gives j_d = 0.359 Re^(-1/3), -48.0 % on the printed eq. (7) constant of 0.69,
    and the corrected form 0.651, -5.7 %. Neither reaches eq. (7). The prefactor
    is NOT in doubt: 0.13 x 35.4^(1/4) = 0.317098 against the printed 0.318.
  - >-
    EQ. (9) DOES NOT MEET CHILTON-COLBURN WHERE THE PAPER SAYS IT DOES. They
    cross at N_Re = 4480 (3716 with the exact -5/16 exponent), not 10,000, and
    the worst deviation over 2000-20,000 is 15.2 % (17.2 % exact), larger than
    the "+/- 12 per cent" claimed - though the +/- itself is right, the
    deviation taking both signs inside the range. The eq. (9) constant itself
    reproduces exactly: 0.13 x 0.0396^(1/4) = 0.0579919 against a printed 0.058.
    THAT EXACT REPRODUCTION IS WHAT LOCALISES THE PACKED-BED PROBLEM to the
    voidage rather than to eq. (4), the flow-work argument or the j_d definition.
  - >-
    THE SMALL-BUBBLE ROW'S D_L EXPONENT IS A MISPRINT. Printed 10^-4; eq. (1) on
    that row's own property corners then stands 21.2x above the row's own printed
    k_L ceiling. 10^-6 lands 1.7 % below it; 10^-5 is ruled out at 4.56x. The
    test has a CONTROL and it passes: the large-bubble row, printed 10^-6,
    reproduces its printed k_L window with no adjustment at all.
  - >-
    THE TRANSITION, WHICH THE PAPER DESCRIBES THREE TIMES AND MODELS NOWHERE, IS
    NOW A CURVE. One group Lambda = u_s/(gdot delta_Leveque) carries it;
    d ln k_L / d ln D_L interpolates monotonically from 2/3 to 1/2, is halfway
    (7/12) at Lambda = 0.2721 and within 10 % of the mobile value by
    Lambda = 1.507.
  - >-
    THE PAPER'S OWN THEORY BRACKETS ITS OWN FIT. Froessling + Allen gives 0.276,
    Friedlander + Stokes gives 0.340, and the fitted constant is 0.31. Both
    recomputed from scratch; the Froessling route is done in both directions
    because its coefficient is not printed in this article.
  scope_declared:
  - >-
    NOTHING ON THE PAGE JUDGES 0.31, 0.42 OR 0.13. They are regression lines
    through Figs 1, 2 and 6 (eq. (4)'s is stated to be one, with a standard
    deviation of 66 per cent). The corner evaluations against the Range of
    Variables table are labelled a GOODNESS OF FIT, not a validation, in the
    notebook and in all four metadata files, because 0.42 was fitted to the very
    runs whose k_L range it is compared against.
  - >-
    The two pure boundary-layer exponents are fixed by dimensional analysis once
    the velocity profile is set, so they test the implementation and not the
    physics. Stated where the numbers are printed, not in a footnote. The break
    table shows what they DO catch: swapping the profiles swaps them.
  - >-
