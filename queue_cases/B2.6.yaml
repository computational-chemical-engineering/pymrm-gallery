what_it_carries: >
  THREE deactivation mechanisms modelled and their parameters ESTIMATED from
  measurements: the homogeneous (uniform) mechanism with one type of active site,
  the homogeneous mechanism with TWO types of active site, and the SHELL
  PROGRESSIVE mechanism - which is the one B2.6 names. A method for estimating
  the parameters from rotating-basket reactor data is proposed, and illustrated
  on hydrogenation of benzene over a nickel catalyst with thiophene as the
  poison.
  The paper also states the physical discriminant a page should carry: the
  uniform mechanism applies to small pellets with large pore diameters and slow
  poison chemisorption; the shell-progressive mechanism applies when the poison
  has high affinity for the surface, so it deposits at the pore mouth and leaves
  a moving deactivated shell that itself slows reactant diffusion.
validation_route: >
  PRINTED PARAMETER ESTIMATES on a real system (benzene/Ni/thiophene). This is
  potentially an EXPERIMENTALLY validated page, which the gallery has only four
  of - but confirm off the renders whether the underlying rotating-basket
  measurements are tabulated or only plotted. If figure-only, the page can still
  reproduce the parameter estimation from printed intermediate results, but not
  the raw fit.
notes: >
  S12 (moving internal boundary) is what the shell-progressive mechanism is, so
  this shares machinery with the published B3.1 (Yagi-Kunii shrinking core) and
  with B3.2/B3.4 unblocked in the same drop. Build after those.
  It is "part IV" of a series; parts I-III are NOT on disk. Check whether the
  model equations are self-contained in part IV before promising a derivation -
  this is the A2.6 situation (the 1993 note deferred p(Re) to the 1987 paper).
