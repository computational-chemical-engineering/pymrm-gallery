scope_caveat: >
  *** THIS IS A PROPOSAL, NOT A MATCH - DECIDE BEFORE DISPATCHING. ***
  B1.13's catalogue line predicts "two-scale intraparticle resistance". This
  paper does contain that - a bimodal porous catalyst with a given nanoporosity
  and an optimised large-pore network, for diffusion-limited first-order
  reactions - but its purpose is OPTIMISATION, not description: it asks what
  pore-size distribution maximises yield, finds that a hierarchical network with
  a BROAD pore-size distribution wins, and then shows that self-similar
  fractal-like hierarchies achieve the same effectiveness factor as the true
  optima and so "operate very near optimality".
  A page that builds the two-scale pellet and validates it against this paper's
  optimisation results is defensible. A page that presents this paper as the
  canonical statement of the bimodal pellet model is not. The honest version is
  probably the more interesting one: the near-optimality of fractal hierarchies
  is a striking, checkable claim, and re-deriving it is a real pymrm exercise.
  If a plainer bimodal-pellet source is wanted instead, B1.9's Wakao & Smith
  (1962) - unblocked in the same drop - is the non-reactive bidisperse
  diffusion model, and the pair could be built as one page.
validation_route: >
  DERIVED/COMPUTATIONAL. The paper's results are optimisation outcomes and
  effectiveness-factor comparisons, which pymrm can reproduce from the stated
  problem definition without needing any digitised curve. Confirm off the
  document whether the optimal distributions are tabulated. Born-digital-era
  scan with a good text layer, so this check is cheap.
