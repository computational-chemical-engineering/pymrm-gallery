what_it_carries: 'The Haldane inhibition function used as the growth-rate expression, and two claims
  a page can test rather than merely illustrate, both stated in the Summary: in BATCH culture the
  primary effect of substrate inhibition is an increase in the LAG TIME, whereas in CONTINUOUS culture
  it "may result in process instability". The stability claim is the interesting one - it is a statement
  about multiple steady states and washout that a continuation sweep can confirm or refute.'
