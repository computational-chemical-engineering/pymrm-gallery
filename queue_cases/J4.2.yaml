check_before_dispatch: 'ANSWERED 2026-08-13 by the coordinator. 17 pages, 300 ppi CCITT-G4, one
  landscape page (15). THE PAPER PRINTS NO TABLE — every "table" hit in the text layer is inside the
  word "unstable". At least nine figures.
  BUT IT IS NOT FIGURE-GATED, because THE FIGURE LEGENDS PRINT THE FULL PARAMETER SETS as typeset
  text. Fig. 9''s legend (p. 721) carries what reads at 100 ppi as mu-hat or D = 1.0 HR^-1,
  K_S = 0.03 GM/L, K_I = 2.0 GM/L, a yield-like K_Y = 0.5 GM/GH, a holding time theta = 3 HRS and
  S_o = 5 GM/L — READ EVERY ONE ON A DIGIT-SCALE CROP, my reading is from a 100 ppi render and the
  symbol/units on two of them are not settled. That is the same allowance B3.3 used for Fig. 7''s
  caption parameter sets: reading typeset constants out of a legend is NOT digitising a curve.
  SO THE ROUTE IS: re-run Andrews'' own simulations with Andrews'' own printed constants, and TEST THE
  TWO CLAIMS HE STATES IN HIS SUMMARY rather than illustrating them. Do NOT digitise any curve; the
  page must say the figure comparison itself is out of scope and that it therefore does not establish
  empirical adequacy against his plotted results.
  The steady-state multiplicity and stability content (two substrate concentrations for each growth
  rate, the higher one unstable) is analytic and needs no figure at all.'
what_it_carries: 'The Haldane inhibition function used as the growth-rate expression, and two claims
  a page can test rather than merely illustrate, both stated in the Summary: in BATCH culture the
  primary effect of substrate inhibition is an increase in the LAG TIME, whereas in CONTINUOUS culture
  it "may result in process instability". The stability claim is the interesting one - it is a statement
  about multiple steady states and washout that a continuation sweep can confirm or refute.'
built: 'READY 2026-08-14. Staged at queue_cases/J4.2/page/ ; models.yaml has NO J4.2 entry, so
  queue_cases/J4.2/models_entry.yaml is an APPEND, not an upgrade in place. Slug
  andrews-substrate-inhibition -> pages/J4.2-andrews-substrate-inhibition/. Notebook executes clean
  in ~45 s, deterministic (identical content hash and byte-identical agreement.json over two
  consecutive executions; nothing stochastic, and the one sweep-shaped calculation uses a
  deterministic per-tau initial guess, not a warm start).
  THE COORDINATOR''S PRE-DISPATCH READ OF FIG. 9''S LEGEND IS CORRECTED ON TWO SYMBOLS, both settled
  on a digit-scale 300 ppi crop of the rotated landscape page: the first line is MUHAT (mu with a
  circumflex), "maximum specific growth rate in the absence of inhibition", NOT D; and the fourth is
  Y = 0.5 GM/GM, the yield coefficient, NOT "K_Y = 0.5 GM/GH". The rest of the read stands exactly:
  K_s = 0.03 GM/L, K_i = 2.0 GM/L, theta = 3 HRS, S_o = 5 GM/L. Also: there are TEN figures, not
  "at least nine", and THREE pages are landscape in the file (PDF 8, 12, 15 = Figs. 4, 7, 9), not one.
  THE PAPER PRINTS NO TABLE - confirmed, two hits for "table" in the text layer and both inside
  "unstable" - and it is not figure-gated, as dispatched. NOTHING IS DIGITISED and the page says so.
  BETTER THAN EXPECTED: the paper also prints TWO NUMERICAL RESULTS IN RUNNING TEXT on book p. 715
  (12.5 hr and 36 hr) and SIX STATED OUTCOMES on p. 719, so the validation ranks at brief level 3
  (stated numerical results) plus level 2 (internal identities), not at level 4. All eight reproduce.
  Five printed defects were found beyond the dispatch: eq. (9) printed with a bare + (so it returns
  the root the paper itself calls unstable), eq. (10) printed with the inoculum''s subscript X_i,
  Y given as GM/L in the legends of Figs. 4 and 7, "Recherces" [sic] in reference 1, and "step
  chances" [sic] on p. 719. None repaired.'
