  note: >
    The earlier `needs-paper` block is lifted and removed. The catalogue records
    no citation for J3.1 at all, and the historical primary sources are 1900s-30s
    papers with no route to them. They are not needed: Doyle, Fuller & Newman
    (1993) - already on disk and already the source of the published J3.4 page -
    prints the law twice, as Eq. 6 with the exchange current density of Eq. 8
    (flat electrode) and as Eq. 17 with Eq. 30 (insertion reaction). Eqs. 6, 7, 8,
    16, 17, 18, 28, 29 and 30 were read off 600 dpi renders of journal pages 1527,
    1528 and 1530; that scan's text layer mangles all of them (Eq. 17 comes out as
    `i = Fk2(emax - c)~~ ... ~R~01 - U'))`, Eq. 8 as
    `io~ = F(kal) ~cl (kc~)aal (Cmax--C)""I(C)~al`). Marquis et al. (2019),
    already on disk for J3.5, prints the same kinetics in hyperbolic-sine form
    (its Eqs. 1g-1h: 1g is the sinh law, 1h its exchange current density) with the
