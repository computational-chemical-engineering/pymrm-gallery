notes: 'OPEN-ACCESS ROUTE FOUND BUT NOT USABLE. The Jagiellonian Digital Library holds a free
  127-page scan at http://jbc.bj.uj.edu.pl/Content/513757/NDIGORP032281.pdf (downloaded and
  opened 2026-08-02; its cover sheet is Smoluchowski''s own archive envelope, hand-lettered
  "M. Smoluchowski / Versuch einer mathematischen Theorie der Koagulationskinetik kolloider
  Lösungen", and p. 5 is the first manuscript page, dated "Eingelaufen am 8. Sept. 1916" and
  annotated "Zeitschr. f. phys. Chem. 1917, 92, S 129-168"). It is the HANDWRITTEN GERMAN
  MANUSCRIPT, not the printed article: no text layer at all (127 characters of extractable
  text in the whole file) and several leaves are verso bleed-through. Not kept on disk. The
  printed article is at De Gruyter behind a subscription.'
