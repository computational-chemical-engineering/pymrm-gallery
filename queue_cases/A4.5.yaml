blocker: null

still_needed: >
  THE ERRATUM IS STILL NOT ON DISK and the page was built without it, which is
  the right outcome rather than a blocker. 10.1021/ie50680a601, "Errata: A New
  Method for Predicting Gas Diffusivities", Ind. Eng. Chem. 58 (1966). Checked
  again during the build: the ten pages of the article contain no correction
  notice and the strings "errata"/"erratum" do not occur.

  The page therefore carries the 1966 atomic diffusion volumes exactly as
  printed, says on the page and in all four metadata files that an erratum
  exists and has not been consulted, and does NOT apply any "corrected" table
  from memory. A widely-circulated alternative increment set (C 15.9, H 2.31,
  O 6.11, N 4.54) appears on the page ONLY as an injected defect in the break
  table, explicitly labelled as not being in any document on disk and not
  vouched for.

  If the erratum arrives: re-read Table I against it, and if any volume changed,
  re-run `build_page.py` - the whole reproduction is driven from
  `data/fuller-1966-table1-diffusion-volumes.csv` and nothing else needs
  touching. A changed volume shows up immediately as a jump in
  `max_abs_delta_pp` (currently 0.043; the break table shows that C 16.5 -> 16.0
  alone takes it to 1.65).

text_layer:
  quality: >
    Best scan in the 2026-08-05 batch, and the earlier warning was right: the
    table LOOKS clean in the text layer and is not. The bounding-box parse of
    Table III, checked against eq. (4) row by row, found 23 rows (verification found a 24th beneath the net) in which the
    text layer had silently altered a digit - 298.2 -> 296.2, -8.17 -> -0.17,
    287.9 -> 207.9, 288.5 -> 268.5, 0.0860 -> 0.0060, 1.2890 -> 1.2690, and
    more. Every one was re-read on a 300 dpi crop. Diffusion-volume Table I did
    survive OCR intact, but it was read off the image anyway and the text layer
    used only as a cross-check.
  render_at: >
    300 dpi. `pdfimages -list` gives 300 x 300 ppi native (JPEG RGB on pages
    1-2, CCITT-G4 bilevel on 3-10), so 600 dpi interpolates. Confirmed during
    the build.

what_it_carries: >
  ALL DELIVERED. Eq. (4) and Table I's 27 diffusion volumes; Table II's
  comparison against eight other correlations; Table III in full as a 340-row
  CSV of measured binary diffusivities; the authors' honesty caveat, quoted on
  the page. The printed numbers named in the earlier note check out: HBS 6.4 %,
  Gilliland "the most erratic" at 21.1 %. Only the FSG column of Table III was
  transcribed, so the other methods are reported from Table II rather than
  recomputed.

built:
  date: '2026-08-05'
  runtime_s: 3.4
  notes: >
    Validation route taken: printed tables, as planned - no figure work, no
    maintainer input needed at any point. 338 of 340 printed FSG errors
    reproduce to 0.043 percentage points; twelve printed aggregates fall out of
    the transcription (eight Table II category means, AVE. ERROR 4.32, the 7.4 %
    tail, the undocumented STANDARD DEVIATION 6.71, and the count of 153 binary
    systems). The page's own contribution is a genuinely held-out number the
    paper does not contain: leave-one-organic-compound-out gives 6.61 % against
    5.04 % in sample.

findings_for_the_integrator: >
  1. TWO PRINTED ROWS OF TABLE III ARE IRREPRODUCIBLE from eq. (4) + Table I and
     are reported on the page: He-H2O at 352.5 K (printed FSG error -5.33,
     recomputed +0.21) and CO2-ethylene oxide at 298.0 K (printed 15.09,
     recomputed 14.27). Both confirmed as printed at 3x magnification. The first
     is flagged independently by a second route that uses no volumes at all.

  2. THE PAPER'S STATED phi' DOES NOT MATCH ITS OWN PUBLISHED TABLE. Computed
     from Table III's error column phi' = 1.4048, from eq. (4) with the printed
     volumes 1.3996, and a free refit reaches 1.3701 - all below the stated
     constrained minimum of 1.4762, which is impossible since eq. (4) is a
     special case of eq. (2). Reported, not resolved.

  3. THE SUMMARY ROWS AT THE FOOT OF TABLE III ARE IN TABLE II's METHOD ORDER,
     not in the order of Table III's own column headings. One of the two is
     wrong. The page uses only column 1 (FSG), whose identity is settled by 338
     rows reproducing eq. (4), and it warns anyone using the other eight.

  4. TWO CHOICES ON THE PAGE ARE INFERENCES from the printed error column, both
     labelled as such and both excluded from the count of independent tests: the
     -20.2 term is applied to AROMATIC rings only despite Table I's caption
     reading "Aromatic or Heterocyclic rings", and M(D2) = 4.00 rather than
     4.028. 22 rows; 318 remain free tests, of which one fails (CO2-ethylene oxide is among the excluded rows).

  5. SCOPE HELD. A4.6 (Chapman-Enskog) is being built concurrently and should
     own the Chapman & Cowling Table 22 comparison of the two routes on one
     measured-D12 axis. Nothing on this page comes from Chapman & Cowling. The
     other secondary source named on this case, Wilke & Lee 1955
     (MISC-Wilke1955-binary-diffusion-coefficient-estimation-IEC47-1253.pdf), was NOT needed and NOT used - the page reports the
     Wilke-Lee column from Table II rather than recomputing it.

  6. models.yaml entry is at queue_cases/A4.5/models_entry.yaml; `slug` and
     `title` match page/meta.yaml exactly. No new dependency - numpy, scipy,
     pandas, matplotlib and pymrm only.

  7. One metric, `flux_spread_structural` (2.3e-20), sits below
     check_agreement.py's ABS_FLOOR = 1e-12 and is therefore outside the
     regression suite. It is labelled structural on the page. Every other one of
     the 32 metrics is above the floor.

validation_route: printed tables (diffusion volumes; Tables II and III comparison errors)
