  THE ERRATUM IS NOT ON DISK. The 2026-08-02 note on this case flagged a
  published erratum - 10.1021/ie50680a601, "Errata: A New Method for Predicting
  Gas Diffusivities", Ind. Eng. Chem. 58 (1966) - and asked for both documents.
  Only the article arrived. Checked: the 10 pages contain no correction notice
  and the strings "errata"/"erratum" do not occur.
  CONSEQUENCE, and it is not a blocker but it must reach the page: the ATOMIC
  DIFFUSION VOLUMES are exactly what an erratum to this paper would correct, and
  they are the whole content of the correlation. Build the page, transcribe the
  volumes off the page image, and say on the page that a 1966 erratum exists and
  has not been consulted. Do not silently apply a "corrected" table from memory -
  that is the fabrication route for this case.

