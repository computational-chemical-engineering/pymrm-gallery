what_it_carries: >
  * The correlation itself, with its special "diffusion volumes" and the
    additive-atomic-volume scheme, derived from the Stefan-Maxwell hard-sphere
    model.
  * The atomic and molecular diffusion volume table - the constants without
    which the correlation cannot be evaluated.
  * A COMPARISON AGAINST EIGHT OTHER CORRELATIONS with printed average errors,
    summarised in Table II and detailed in Table III. Numbers quoted in the
    Conclusion that a page can reproduce and check against: the diffusion-volume
    correlation gives the best fit to the data used; the Hirschfelder-Bird-Spotz
    method averages 6.4 % error; using estimated force constants the average is
    8.9 %, or 5.4 % excluding the starred points; the Gilliland method is "the
    most erratic".
  * The authors' own honesty caveat, which the page must repeat: "the present
    method can be no more reliable than the diffusion data used in its
    development. Any systematic errors in the data would be reflected in the
    atomic diffusion volumes."

  Printed-table validation route throughout. No maintainer needed.

related_on_disk: >
  `ie50546a056.pdf` = Wilke, C. R. & Lee, C. Y., "Estimation of Diffusion
  Coefficients for Gases and Vapors", Ind. Eng. Chem. 47(6) 1253-1257 (1955).
  It is on disk, it maps to NO catalogue case of its own, and Fuller et al.
  benchmark against it by name in their comparison ("Wilke and Lee's
  modification of the HBS method is seen to improve results in some cases, but
  the average overall error is increased by its use"). It is therefore a
  legitimate secondary source for this page. IT IS NOT A4.1 - see
  queue_cases/A4.1.yaml.
  A4.6's source (Chapman & Cowling) is also on disk and gives the kinetic-theory
  route the Hirschfelder-Bird-Spotz column of Fuller's comparison rests on, plus
  its own Table 22 of measured D12 for ~45 gas pairs. A combined A4.5 + A4.6
  page - one measured-D12 axis, the Chapman-Enskog prediction and the
  Fuller-Schettler-Giddings prediction overlaid - is the strongest single
  opportunity this batch creates. Decide scope before dispatching two builders.

validation_route: printed tables (diffusion volumes; Tables II and III comparison errors)
