    - {date: 2026-08-02, answer: "mostly yes; the marker is often off centre - fit the shape"}
  artifacts:
    - "queue_cases/A3.4/review/A3.4-fig2-recentred-overlay.png"
    - "queue_cases/A3.4/review/A3.4-fig2-recentred-audit.png"
    - "queue_cases/A3.4/review/A3.4-fig2-axis-calibration.png"
  question: >
    Three things, all new since the 2026-08-02 answer. (1) Do the re-centred
    positions look right? The contact sheet shows every glyph at 2x with the
    fitted outline in green and the old crosshair as an orange x. (2) Are the 9
    added markers real? They are drawn in red. (3) Are the 11 crosshairs that
    the shape fit merged into another really double counts rather than two
    markers drawn on top of each other - the F2.3 case, where overlapping
    squares were mistaken for one glyph, ran the other way and is the reason
    this is asked.

