     glyphs against an estimated 100-110 drawn, so recall is still short. The
     page uses these points for a residual TREND with Reynolds number and for a
     deliberately weak refit; neither is moved much by a missing marker."
  - "Markers hidden inside the legend box region, if any. The legend occupies
     the upper-left quarter of the plot area and was excluded wholesale."
  - "Markers lying on the dashed Ranz-Marshall curve, which is removed by
