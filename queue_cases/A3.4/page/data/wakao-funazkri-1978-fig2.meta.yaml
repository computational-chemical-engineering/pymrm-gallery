dataset_id: wakao-funazkri-1978-fig2
title: Reevaluated gas-phase Sherwood numbers for water evaporation (Figure 2)
status: provisional          # extraction complete, maintainer review NOT yet done

source:
  authors:
    - "Wakao, N."
    - "Funazkri, T."
  year: 1978
  container: "Chemical Engineering Science 33(10) 1375-1384"
  doi: 10.1016/0009-2509(78)85120-3
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; figure image not reproduced)"

conditions:
  quantity: >
    Sh, the particle-to-fluid Sherwood number REEVALUATED by the authors with
    the axial effective dispersion coefficient of their eq. (2),
    eps_b D_ax / D_v = 20 + 0.5 Sc Re. These are not the Sh' values the original
    investigators published; the difference is the whole subject of the paper.
  Schmidt_number: 0.6
  Schmidt_number_source: "printed inside the plot area of Figure 2"
  system: "evaporation of water into a gas stream, steady state, packed beds"
  Reynolds_definition: "Re = d_p U eps_b / nu, i.e. on the superficial velocity"
  sources_pooled:
    - "Wilke and Hougen [6]"
    - "Hobson and Thodos [10]"
    - "Galloway et al. [7]"
    - "De Acetis and Thodos [8]"
    - "McConnachie and Thodos [12]"
    - "Sen Gupta and Thodos [13, 14]"
    - "Malling and Thodos [11]"
    - "Petrovic and Thodos [3]"
  note: >
    The eight sources are distinguished only by marker shape. No shape
    classification was attempted and no series labels are carried, because
    nothing on the page needs them: eq. (12) contains no term that distinguishes
    the sources, so the correlation is tested against positions alone.

acquisition:
  method: digitised
  figure: "Figure 2, journal page 1382 (PDF page 8)"
  tool: "poppler pdftoppm at 600 dpi + scipy.ndimage"
  passes:
    - date: 2026-07-30
      what: >
        First pass. Detection by local ink excess: box-filtered ink density
        minus the largest value explainable by a locally straight structure
        (grey-scale opening with a long line element, maximised over six
        orientations), then non-maximum suppression at 8 px. 87 candidates, 81
        kept after a visual audit at 600 dpi which rejected four line junctions,
        one annotation leader and one axis label.
      review: >
        Maintainer, 2026-08-02: "Mostly symbols are identified well, but often
        the marker is off centre. It might be helpful to try to fit the shape
        and then take the center of the shape."
    - date: 2026-08-02
      what: >
        SHAPE FIT. Every one of the 81 crosshairs was re-located by fitting a
        parametric glyph template - open circle, square, triangles at three
        orientations, plus - to the ink at sub-pixel resolution, and the
        reported coordinate is the CENTRE OF THE FITTED SHAPE. The score of a
        template of size s placed at (y, x) is

            <ink over the glyph body> - <ink over an outer margin annulus>,

        both weighted by a mask that is zero wherever the ink is known not to be
        a marker. Sliding the template off-centre loses body ink and gains
        margin ink, so the optimum is a registration of the shape rather than a
        peak of ink density.

        A marker keeps its fitted centre only when the fit scores at least 0.50;
        12 of the 81 scored below that - all of them glyphs the curve removal
        had eaten into - and kept the 2026-07-30 crosshair instead. Both
        coordinates are in the file for every one of them.

        The same detector was then run as a matching pursuit over the whole plot
        area with the 81 as seeds. It proposed 11 further markers; 2 were
        rejected by visual audit (one on the "Single spheres" leader, one where
        that leader crosses the eq. 11 line) and 9 kept.

        Removed before detection, as `don't care` rather than as absence of ink:
        locally straight ink over 37 px at any of 18 orientations (the eq. 12
        and eq. 11 curves, the two annotation leaders); ink connected to the
        frame within 30 px of it (the frame and every tick); and a band of
        half-width 9 px about the COMPUTED position of eq. (9). That last one
        has to be done by position: the Ranz-Marshall curve is dashed and its
        dashes are 12-20 px of compact ink, which no shape test can tell from a
        marker.
      effect: >
        Measured on the page, on the 81 paired positions: the fitted centre lies
        -0.01 +/- 2.59 px from the crosshair along Re and +0.62 +/- 2.19 px
        along Sh, a median distance of 2.3 px. The column shift is consistent
        with zero; the row shift is 2.5 standard errors from zero and amounts to
        -0.41 % in Sh. Refitting eq. (12) on the same 81 markers moves alpha
        from 1.168 to 1.152 and beta from 0.5550 to 0.5572 - under a tenth of
        one standard error either way. The displacement was scatter, not bias.

        It also changed the COUNT in both directions. 11 of the 81 crosshairs
        turned out to be a second or third mark on a glyph another crosshair
        already had: two crosshairs on one glyph produce two fits at the same
        point, which is how a shape fit detects a double count and a density
        threshold cannot. 81 recorded positions are 70 distinct glyphs; with the
        9 added, the figure yields 79.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-08-02
  procedure: >
    Only the experimental markers were extracted. The three curves drawn on the
    figure - eq. (12) solid, Ranz-Marshall eq. (9) dashed, Petrovic-Thodos
    eq. (11) straight - are the authors' models and were excluded at their
    COMPUTED positions, never traced.

    Axes are logarithmic and were calibrated from the printed decade ticks on
    all four sides: Re = 1 at column 442.0 with 405.2 px per decade,
    Sh = 1 at row 1225.25 with 337.67 px per decade (crop origin at
    0.50*width, 0.70*height of the 4592 x 6000 page render). This calibration is
    unchanged from the first pass and was not re-derived.
  estimated_error: >
    Positions: about +/- 0.5 % in Re and +/- 0.5 % in Sh from placing the fitted
    centre of a ~22 px glyph on axes with ~400 and ~340 px decades, plus up to
    1 % of systematic axis error from the ~5 px skew between the tick rows on
    opposite sides of the frame. Markers clipped by a removed curve are worse;
    those are the low `fit_score` rows, and the 16 with fit_score < 0.50 carry
    the older crosshair instead (`recentred = False`). Those 16 have zero
    displacement BY CONSTRUCTION and must be excluded from any statistic about
    how far the re-centring moved a marker; on the 65 that did move, the median
    displacement is 3.29 px, not the 2.28 px of all 81 rows together.

calibration_check:
  method: >
    All three curves printed on Figure 2 are known functions, so the axis
    calibration is testable without any assumption. Recomputed from their own
    equations and drawn on the source image at 600 dpi, all three fall on the
    printed curves to within a line width:
      eq. (12)  Sh = 2 + 1.1 Sc^(1/3) Re^0.6      -> the printed solid curve
      eq.  (9)  Sh = 2 + 0.6 Sc^(1/3) Re^0.5      -> the printed dashed curve
      eq. (11)  Sh = (0.357/eps_b) Sc^(1/3) Re^0.641, eps_b = 0.40
                                                  -> the printed straight line
  consequence: >
    The third of these also fixes two things the paper does not state next to
    eq. (11): that j_D is defined on the superficial velocity, giving
    Sh = j_D Re Sc^(1/3), and that the voidage used to draw the line is 0.40.
  caveat: >
    TWO known functions plus a slope, not three. eq. (11) contains eps_b, and
    eps_b is fitted to the very line it is checked against, so it constrains the
    calibration in slope but not in offset.
  residual_offset: >
    Measured 2026-08-02 by `setup2.trace_curves`, which takes the ink centroid
    column by column wherever the straight ink near the computed curve is a
    single run no wider than 8 px (that filter is what keeps markers sitting on
    a curve out of the measurement). Drawn ink minus computed row, negative
    meaning the ink is ABOVE the computed position:
      eq. (12)  n = 701   -4.06 +/- 2.30 px   = +2.80 % in Sh
      eq. (11)  n = 582   -5.06 +/- 1.89 px   = +3.51 % in Sh
      eq.  (9)  n = 206   -2.08 +/- 6.27 px   = +1.43 % in Sh
    Each is inside a line width on its own; all three the SAME WAY is an
    ordinate origin about 4 px low, which makes every extracted Sh in this file
    roughly 2.7 % high and moves the page's +9.7 % eq. (12) bias to about
    +12.7 %. NOT CORRECTED, deliberately: the only evidence for it is those
    three drawn curves, one of which supplied eps_b, so correcting the ordinate
    on it would make this whole check circular. Contrast Figure 3, where the
    analogous skew is measured on eight printed decade ticks and the drawn line
    is an independent control - there it IS corrected.
  artifact: "queue_cases/A3.4/review/A3.4-fig2-axis-calibration.png"

