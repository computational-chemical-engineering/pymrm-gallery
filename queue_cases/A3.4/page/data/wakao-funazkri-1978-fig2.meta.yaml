columns:
  - {name: marker_id, unit: "-", description: "distinct glyph. Rows sharing an id are the same glyph recorded more than once by the 2026-07-30 pass; the page uses one row per id"}
  - {name: Re, unit: "-", description: "particle Reynolds number of the GLYPH, on the superficial velocity"}
  - {name: Sh, unit: "-", description: "Sherwood number of the glyph, reevaluated with the axial dispersion coefficient of eq. (2)"}
  - {name: Re_prev, unit: "-", description: "Reynolds number of this row's 2026-07-30 crosshair; blank for markers found on 2026-08-02"}
  - {name: Sh_prev, unit: "-", description: "Sherwood number of this row's 2026-07-30 crosshair; blank for markers found on 2026-08-02"}
  - {name: col_px, unit: px, description: "reported centre, column, in the 600 dpi crop"}
  - {name: row_px, unit: px, description: "reported centre, row, in the 600 dpi crop"}
  - {name: col_px_prev, unit: px, description: "2026-07-30 crosshair, column"}
  - {name: row_px_prev, unit: px, description: "2026-07-30 crosshair, row"}
  - {name: shape_fitted, unit: "-", description: "template that fitted best. ADVISORY ONLY - not a series label; the eight sources are not resolved"}
  - {name: fit_score, unit: "-", description: "body coverage minus margin coverage of the fitted template, in [-1, 1]"}
  - {name: recentred, unit: "-", description: "True if the shape fit was accepted (score >= 0.50); False means the row carries the 2026-07-30 crosshair"}
  - {name: pass, unit: "-", description: "the extraction pass this row's crosshair came from"}

