notes: >
  Built 2026-08-02; framing revised 2026-08-02 after adversarial verification
  (queue_cases/A1.6/review/verification.md). Staged page executes in ~4 s and
  calls report_agreement("A1.6") with 48 metrics. Validation route taken, highest first: (2) internal identities
  - the derivation of eq. (1) reconstructed from the Ergun force balance recovers
  the printed 33.7 and 0.0408 to -0.079 % and +0.040 %, and Wen & Yu's own Table 1
  is pooled against itself; (3) EXPERIMENTAL - eq. (1) against 21 minimum
  fluidisation velocities from Geldart (1973) Table 1, loaded cross-page from
  A1.7's data directory, held out by construction. Route (4), digitising the
  paper's Figure 4, was NOT used and NO REVIEW OVERLAY EXISTS - nothing was
  digitised, so there is no page image anywhere under queue_cases/A1.6/.
  queue_cases/A1.6/review/ contains only verification.md, the adversarial
  verifier's text report; it holds no copyrighted page image and must not be
  treated as one. No maintainer input is needed.

  Headline results: eqs. (2) and (3) solved simultaneously imply phi_s = 0.669 at
  eps_mf = 0.474, which is not a sphere; forced to phi_s = 1 they contradict each
  other by 8.4 %, and the branch that survives into the viscous term is 0.383,
  below the paper's own stated eps_mf floor of 0.385. Against the unapproximated
  balance for spheres at eps_mf = 0.42, eq. (1) is 28.9 % low in the viscous limit
  and 1.9 % low in the turbulent one. A1.1's refit of Ergun's own constants moves
  the prediction by -1.27 % viscous and +1.55 % turbulent, so LIKE FOR LIKE the
  voidage approximation outweighs the friction-law uncertainty by 22.7x at the
  viscous limit and by only 1.21x at the turbulent one - the page quotes both and
  explicitly rejects the single "18x", which pits the worst voidage cost (viscous)
  against the worst Ergun cost (turbulent). Measured: bias -17.4 %, rms 38.1 % over
  21 rows against the authors' claimed 34 % - but the paper defines neither
  statistic, and a standard deviation about the mean gives 33.9 %, an exact match;
  both readings are printed. On the 8 spherical Diakon cuts eq. (1) is low on
  EVERY row, by 25.2 % on average and by -5.5 % to -54.5 % row by row (rms 29.0 %,
  no row near the mean).

  TWO FRAMING CORRECTIONS MADE AFTER ADVERSARIAL REVIEW, both now on the page.
  (1) The inversion to a "demanded voidage" (median 0.409) is a reparameterisation
  of the bias, not an independent closure, and the page says so; and Geldart's own
  table contradicts it. He prints eps_MB and H_MB/H_0, and on the two coarsest
  Diakon cuts U_MB = U_0 with H_MB/H_0 = 1.000, so eps_mf = eps_MB = 0.444 with no
  inference at all. At that voidage the exact Ergun balance is +58.4 % biased over
  the eight rows (+47.5 % and +61.1 % on those two), worse than eq. (1)'s -25.2 %
  in the other direction, and sphericity cannot explain it because the exact Ergun
  u_mf written in d_sv is exactly phi_s-independent. The page therefore no longer
  claims "the bias belongs to eqs. (2) and (3), not to the Ergun equation"; it
  reports both voidages and leaves the question open, and the Reuse advice about
  ergun_re_mf is qualified accordingly. (2) phi_s = 1 for Diakon rests on six
  words of Geldart's prose; the headline scales as phi_s^-2 while the reference is
  phi_s-free, so the break table now carries phi_s = 0.95 (-17.2 %) and 0.90
  (-7.8 %), and phi_s = 0.864 would erase the bias entirely.

  Three break tables and a resolving-power cell. The largest blind spot is stated:
  every measured row is at (N_Re)_mf < 0.83 where eq. (1)'s inertial term
  contributes at most 1.22 %, so the measured verdict covers the viscous half of
  the correlation and nothing else. Wen & Yu's Table 1 is shown not to close ON
  THE PRINTED COUNTS (-1572 variance required); the stronger "cannot close at all"
  is NOT claimed, since an unconstrained split of the 284 can reach the printed 34.

  NO pymrm operator appears - both routes are closed-form roots - and the page
  says so in its "PyMRM implementation" section, following A1.1 and F1.4.
  pymrm_api is therefore [] in models_entry.yaml.
