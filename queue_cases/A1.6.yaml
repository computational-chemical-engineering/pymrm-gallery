catalog_reference_correction: >
  WRONG DOCUMENT, and the correction matters. "Chem. Eng. Prog. Symp. (1966)" is
  a real Wen & Yu paper - it is reference 23 of the paper that was read, and it
  contains the derivation - but it is NOT on disk and was NOT consulted. The
  paper on disk and the one the page is built from is the A.I.Ch.E. Journal
  communication, 12(3) 610-612 (May 1966), doi:10.1002/aic.690120343, which
  prints eq. (1), its two voidage-group approximations, their validity ranges and
  the accuracy comparison but NOT the derivation and NOT the Ergun equation.
  Both citations are recorded in the page's meta.yaml (reference and
  origin_not_consulted) and in models_entry.yaml. Do not conflate them.
