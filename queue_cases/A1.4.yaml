notes: Not a page of its own. The catalogue explicitly asks for one page overlaying
  Ergun, Kozeny-Carman, Forchheimer and the Eisfeld wall correction against a single
  dataset, and A1.1 is built that way - so Eisfeld–Schnitzlein wall correction is
  covered there. Eisfeld & Schnitzlein (2001) was obtained whole from the Elsevier
  PII endpoint S0009250900005339 and is born-digital, so it does not suffer the lost-decimal
  failure; its Table 1 is what makes the wall-effect regime locatable at all. Publishes
  when A1.1 clears its figure review.
