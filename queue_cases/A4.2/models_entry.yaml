    year: 1997
    container: "Chemical Engineering Science 52(6) 861–911"
    doi: 10.1016/S0009-2509(96)00458-7
  predicts: [Fick matrix from MS diffusivities, effective diffusivity breakdown, osmotic diffusion, reverse diffusion, diffusion barrier]
  pymrm_api: [construct_grad, construct_div, NumJac, newton]
  data: {tier: 6, method: table, status: complete}
  page: pages/A4.2-maxwell-stefan-vs-fick/
