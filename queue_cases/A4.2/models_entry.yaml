- id: A4.2
  slug: maxwell-stefan-vs-fick
  title: "Maxwell–Stefan vs Fick for multicomponent mixtures"
  description: >
    The Maxwell-Stefan diffusivities and the composition-dependent Fick matrix
    are the same physics in two bookkeepings — shown to machine precision —
    while the scalar effective diffusivity fails structurally: osmotic
    diffusion, uphill diffusion, and the diffusion barrier.
  section: A
  status: published
  tier: T0
  priority: P1
  structures: [S9]
  phases: [gas]
  reference:
