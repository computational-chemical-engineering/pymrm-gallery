# codehealth adoption for pymrm-gallery (advice of pymrm-health, 2026-11-20).
# index.py is out of scope: only functions are scored, and a jupytext notebook
# is long by nature. Thresholds come from the profile; there is no [gate]
# section, because accept_page.py does the acceptance.
schema = 1
profile = "python@1"

[scope]
include = ["pages/*/model.py", "pages/*/test_model.py", "scripts/*.py", "shared/*.py"]
