# A3.5 (Ranz-Marshall / Froessling) is NOT unblocked by this batch - read this
# before adding it to a request list or dispatching a builder.
#
#   A1993LB49000001.pdf is a ONE-PAGE "This Week's Citation Classic" commentary
#   ON Ranz & Marshall (1952), written by Ranz in 1993. It is a reminiscence, not
#   the paper, and carries none of its correlations or data.
#
#   "AIChE Journal - March 1960 - Charlesworth ..." is Charlesworth & Marshall,
#   Evaporation from drops CONTAINING DISSOLVED SOLIDS - a companion study by the
#   same group, not the origin, and about a different problem (crust formation).
#
# The paper itself is Ranz & Marshall, Chem. Eng. Progr. 48, 141-146 and 173-180
# (1952). Still needed. Whether Charlesworth & Marshall reprints enough of the
# correlation to source A3.5 by the AGENTS.md reprint route is an open question
# nobody has checked - ask that before requesting the original.
