# *** ALL 115 PDFs WERE RENAMED ON 2026-08-06. ***
#
# They used to be named by publisher PII or an opaque export id
# (`Kunii1968-bubbling-bed-model-IECFund7-481.pdf`, `Ergun1952-fluid-flow-through-packed-columns-ChemEngProg48-89.pdf`, `Kiani2024-pair-sites-langmuir-hinshelwood-ACSCatal14-10260.pdf`, `Onda1968-gas-liquid-mass-transfer-packed-columns-JCEJ1-56.pdf`) with
# no author, year or journal in the name, so nothing could be inferred from a
# filename and automatic matching could not find them. They now follow
#
#   papers  <FirstAuthor><Year>-<short-slug>-<JournalAbbrev><Vol>-<FirstPage>.pdf
#   books   BOOK-<Authors>-<Year>-<short-title>-<edition>.pdf
#   MISC-   kept for the record, maps to no catalogue case
#   -pt1 / -pt2  multi-part papers
#
# THE AUTHORITATIVE CATALOGUE IS NOW `docs/papers-inventory.yaml`: one entry per
# file, with `old_names`, the identity, how it was verified, the native ppi, what
# the text layer can be trusted for, and every case it supports. THIS file stays
# because `scripts/find_papers.py` reads it and reads nothing else - it is the
# ID -> filename lookup, not the catalogue. Keep the two in step: add a line
# here AND an entry there whenever a PDF arrives.
#
# The rename also means the fallback matcher in find_papers.py (surname + year
# in the filename) now works for most of the library, where before it worked for
# almost none of it. The hand map still wins and still matters.
#
# `pages/**`, `models.yaml` and `docs/handoff.md` still cite the OLD names in
# their provenance prose; `old_names` in the inventory is what connects them.

