#
# *** THE VANDEN BUSSCHE TRAP - this is A3.5 repeating, read it before
# touching C2.5. ***
#
# `Can J Chem Eng - October 1996 - Vanden Bussche - The STAR configuration for
# methanol synthesis in reversed flow reactors.pdf` is Vanden Bussche, K. M. &
# Froment, G. F., Can. J. Chem. Eng. 74 (October 1996) 729-734.
#
# C2.5 is catalogued as "Vanden Bussche & Froment, J. Catal. 161:1 (1996)" -
# the CO2-based steady-state kinetic model for methanol synthesis and the water
# gas shift on Cu/ZnO/Al2O3. SAME TWO AUTHORS, SAME YEAR, DIFFERENT JOURNAL,
# DIFFERENT PAPER, DIFFERENT PROBLEM. The file on disk is a reactor-
# configuration simulation study.
#
# AND IT IS NOT A REPRINT ROUTE EITHER, which is the part that would be easy to
# get wrong: the STAR paper does not use the authors' own kinetics at all. Its
# own text says the reactor model "was combined with a set of kinetic equations
# ... proposed by Graaf et al. (1988)", and its reference list carries Graaf,
# not J. Catal. 161. So it prints the COMPETING model - C2.4's - and C2.5's
# rate equations appear nowhere in it. C2.5 STAYS needs-paper.
#
