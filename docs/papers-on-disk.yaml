# page images for either PII (1957: no objects; 1995: two 40x30 GIFs of the
# inline symbol v_p/s_x). There is no API route to the table. Only a full PDF
# from the maintainer closes B1.2's blocker - listing it here as "on disk" without
# this note would make the next agent think it already had been.

