# ---------------------------------------------------------------------------
# Everything below is `api-text/<name>.ELSEVIER-API-TEXT.txt` — the *text* the
# authorised Elsevier key returns for a PII. THESE ARE NOT PAPERS. Read this
# before treating any of them as a source:
#
#   * There is no page image. `content/object/pii` returns {"choices":null} for
#     every one of them and the `application/pdf` endpoint returns a one-page
#     entitlement preview (same finding as B1.2 above). So the 600 dpi route
#     that docs/pdf-findings.md requires for constants on a scan is NOT
#     available for these.
#   * On every pre-1995 item the text is the publisher's OCR of the original
#     scan and the decimal points are gone. Details per file in
#     docs/pdf-findings.md; the extreme cases are Mars & van Krevelen (four
#     different glyphs used for one decimal point inside a single table row)
#     and van Deemter (decimal point rendered as a space, digits as '?').
#   * They are still worth having: each one verified its case's citation and
#     DOI, and tells you which table a page would need. That is what ranks the
#     request list.
#
# The one exception is Krishna & Baur 2003, which is born-digital and whose
# tables and Greek symbols survive intact — it is genuinely usable for numbers.
