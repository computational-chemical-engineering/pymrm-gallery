# `ie50546a056.pdf` is Wilke, C. R. & Lee, C. Y., "Estimation of Diffusion
# Coefficients for Gases and Vapors", Ind. Eng. Chem. 47(6) 1253-1257 (1955).
#
# IT IS NOT A4.1. A4.1 is the Wilke MIXTURE rule for the effective diffusivity
# of one species in a multicomponent gas, Wilke, Chem. Eng. Prog. 46 (1950) 95 -
# a different paper, in a different journal, five years earlier, about a
# different equation. Wilke & Lee 1955 is a critical review of binary-diffusivity
# ESTIMATION methods (Gilliland, Arnold, Hirschfelder-Bird-Spotz) plus a new
# correlation of their own. Do not file it under A4.1 and do not let its arrival
# close A4.1's request.
#
# Its real value is as a comparison source for A4.5 and A4.6: it prints the
# Hirschfelder-Bird-Spotz engineering form of the Chapman-Enskog equation with
# attribution, and Fuller et al. 1966 (the A4.5 file above) benchmarks against
# it explicitly. Its first page also opens with the tail of the PRECEDING
# article (a soil-stabilisation / electro-osmosis paper); Wilke & Lee starts
# halfway down journal page 1253.
#
# `1-s2.0-S0009250912007099-main.pdf` is Mills, A. F. & Chang, B. H.,
# "Two-dimensional diffusion in a Stefan tube: The classical approach", Chem.
# Eng. Sci. 90 (2013) 130-136, doi:10.1016/j.ces.2012.12.018. Born-digital,
# clean.
#
# IT DOES NOT CLOSE A4.8. A4.8 is catalogued as the "classic MS validation
# EXPERIMENT" - the ternary Stefan-tube measurement. Mills & Chang is a BINARY
# (water vapour into air) 2-D Navier-Stokes + Maxwell-Stefan computation whose
# purpose is to rebut Salcedo-Diaz et al. (2008) and the Kerkhof-Geboers
# equations. It contains NO experimental data and NO tables of any kind; every
# result is a figure. A4.8 still needs a paper with the measurements in it
# (Carty & Schrodt 1975 is the usual one). Recorded on queue_cases/A4.8.yaml.

# --- THE A3.13 CAVEAT: WHAT THE TWO ZBS FILES DO AND DO NOT CARRY ---
#
# A3.13 is catalogued as "Zehner-Bauer-Schlünder ... Stagnant bed conductivity
# INCL. RADIATION". Neither file on disk delivers the radiation term.
#
#   * Kandula (2010) is about Zehner & SCHLÜNDER (1970) - the point-contact
#     ZS model. Bauer's 1978 radiation and contact-conduction extensions are the
#     part that makes it "ZBS", and they are not in the 1970 model.
#   * Mou et al. (2025) print, as their Eq. (7), the SIMPLIFIED ZBS (S-ZBS)
#     model with the Smoluchowski correction folded in. Their own §1 says
#     plainly that Syamlal & Gidaspow simplified ZBS "by ignoring the
#     Smoluchowski AND RADIATION effects" to get S-ZBS. The full ZBS with
#     radiation appears in their SUPPLEMENTARY MATERIALS (Eq. S2 / Table S2),
#     WHICH ARE NOT ON DISK - the PDF is the 17-page main article only.
#
# So A3.13 is buildable for the ZS / S-ZBS core against Mou's printed Tables
# 1-3, and NOT for the radiation term its own title names. That is the A1.8
# situation again: build what the documents carry, say on the page which named
# component is missing, and name the document that would complete it (Bauer &
# Schlünder 1978, Int. Chem. Eng. 18, 189, or the German original Zehner &
# Schlünder, Chem. Ing. Tech. 42 (1970) 933-941).

