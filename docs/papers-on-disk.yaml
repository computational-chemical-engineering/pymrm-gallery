# B1.2 is on disk but is NOT a full paper - checked 2026-08-02, do not re-check.
#
# `1-s2.0-0009250957850283-main.pdf` is Aris 1957, and it is ONE PAGE: journal
# page 262, the first page. It is byte-size identical to what the Elsevier API
# returns for `application/pdf` on that PII, i.e. it is the entitlement preview,
# not a scan someone obtained separately. The 1995 verbatim reprint (PII
# 0009250996818197) returns a one-page preview too, its page 3899.
#
# This matters because B1.2's open question is two cells of Table 1, on journal
# page 265 / 3901. Neither preview reaches it, and `content/object/pii` has no
# page images for either PII (1957: no objects; 1995: two 40x30 GIFs of the
# inline symbol v_p/s_x). There is no API route to the table. Only a full PDF
# from the maintainer closes B1.2's blocker - listing it here as "on disk" without
# this note would make the next agent think it already had been.
