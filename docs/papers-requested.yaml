# The curated ask. Rendered at the TOP of docs/dashboards/papers-needed.html,
# above the raw list of every blocked case.
#
# Why this file exists: the dashboard's full list is a wall rather than a
# request. This is the ranked version - what to send first, and what sending it
# unblocks. Ordered so that the marginal cost of a second paper inside one login
# is near zero.
#
# Maintained BY HAND. Rewritten 2026-08-06 after the drop that cleared most of
# the previous ask. Verified against queue_cases/*.yaml and the 115 PDFs on disk;
# every entry below was checked NOT to be on disk already.
#
# THE FILES ON DISK WERE ALL RENAMED ON 2026-08-06 and the authoritative
# catalogue is now docs/papers-inventory.yaml. If you are checking whether
# something has already been supplied, grep that, not a filename you remember.

intro: >
  The 2026-08-05/06 drop was the most valuable one so far and it changed the shape
  of this list. Blocked T0/P1 cases went from 53 to 18. All FOUR textbook-canonical
  monographs arrived, which finally made the class approved on 2026-08-02 live -
  thirteen cases were unblocked from books rather than papers. The whole ACS and
  Wiley batches arrived, and so did the three pre-DOI Chemical Engineering Progress
  papers that no reprint route could reach: Ranz & Marshall, Toomey & Johnstone
  and - correctly this time, at the third attempt - Wilke 1950.
  What is left is a short list, and the top of it is a DECISION rather than a
  document.

groups:

  - name: "Answer these questions before buying anything else"
    why: >
      Each is a case where a file that LOOKS like the paper is already on disk.
      Forcing any of them would produce a page attributed to the wrong person.
      This is the discipline A3.5, B3.6 and C2.5 established, and it has now paid
      off three times.
    items:
      - "F2.1 — is Lehrer (1984) an acceptable source? `Lehrer1984-turbulent-axial-dispersion-bubble-column-AIChEJ30-654.pdf` is on disk and IS a turbulent-axial-dispersion-in-a-two-phase-bubble-column paper, but it is Lehrer's own correlation, not Deckwer's; he uses Deckwer's 1974 data only to test himself against. If no, the real paper is Deckwer, Burckhart & Zoll, 'Mixing and Mass Transfer in Tall Bubble Columns', CHEM. ENG. SCI. 29, 2177 (1974) — REQUEST BY TITLE AND CONTAINER. The DOI recorded on the case was wrong and already bought Lehrer once."
      - "B3.6 — does I. W. Smith's 1982 review print the Field (1967) and Baum & Street (1971) correlations with attribution well enough to pass the reprint test? The review is on disk and carries the subject (intrinsic char reactivities corrected for pore diffusion); carrying the subject is exactly what E1.1 shows is not enough. Its text layer is the worst in the library (37 characters on page 3), so the check needs renders. Answer it before requesting Field and Baum & Street."
      - "I1.7 — same shape. The Vanden Bussche STAR paper on disk states the reverse-flow principle and simulates a reversed-flow reactor as its baseline, but is about the STAR variant on one chemistry. Matros & Bunimovich, Catal. Rev. 38 (1996) is the catalogued source and is not on disk."

  - name: "The papers still worth buying outright"
    items:
      - "C2.5 — REQUEST BY TITLE, NOT DOI. Vanden Bussche, K. M. & Froment, G. F., 'A Steady-State Kinetic Model for Methanol Synthesis and the Water Gas Shift Reaction on a Commercial Cu/ZnO/Al2O3 Catalyst', JOURNAL OF CATALYSIS 161(1) 1-10 (1996). The recorded DOI was a Can. J. Chem. Eng. DOI on a row naming J. Catal., and the wrong paper was bought on it — the STAR configuration paper, which runs on the RIVAL Graaf kinetics. T1/P1, and the only blocker on the C2.4-vs-C2.5 comparison page the catalogue asks for."
      - "Voltz, Morgan, Liederman et al. (1973), Ind. Eng. Chem. Prod. Res. Dev. — doi:10.1021/i360048a006 — C2.13, the self-inhibited CO oxidation kinetics used in every converter model. The only survivor of the ACS batch, and now that I1.2 and I1.3 are both sourced it is the missing kinetics for both."
      - "Akita & Yoshida, Ind. Eng. Chem. Process Des. Dev. 12 (1973) and 13 (1974) — F1.1, T0/P1, gas holdup / k_L a / bubble diameter in bubble columns. Nothing on disk touches it and the published F1.4 (Krishna & Ellenberger) is the natural comparison."

  - name: "Part II / companion papers — each completes something already on disk"
    why: >
      Every one of these has its Part I in hand and built or buildable. Three of
      them would retire the last remaining api-text routes, which drop decimal
      points on every pre-1995 scan.
    items:
      - "Froment & Bischoff, Chem. Eng. Sci. 17 (1962) 105 — fouling Part II. Part I is on disk as a scan; Part II is api-text ONLY. B2.2."
      - "Szekely & Evans, Chem. Eng. Sci. 26 (1971) 1901 — grain model Part II. Same situation. B3.2."
      - "Uppal, Ray & Poore, Chem. Eng. Sci. 31 (1976) 205 — the sequel. The 1974 paper arrived; the sequel is api-text only. D2.4."
      - "Bhatia & Perlmutter, AIChE J — random pore model Part II (non-isothermal / diffusion control). Part I arrived. B3.3."
      - "Rocha, Bravo & Fair, Ind. Eng. Chem. Res. 35 (1996) 1660 — structured packing Part 2, the MASS-TRANSFER model. Part 1 (hydraulics) is on disk and A3.10's catalogue row names both."
      - "Billet & Schultes, Chem. Eng. Res. Des. 71 (1993) — the 1993 half of A3.9. The 1999 half is on disk."
      - "Bezzo, Macchietto & Pantelides — hybrid multizonal/CFD Part I (three authors). Part II is on disk and derives its framework in Part I. A2.10."
      - "Westerterp, Dil'man & Kronberg — 'Wave model for longitudinal dispersion: Analysis of the model'. Part 1 is on disk. A2.7."
      - "CPD part 2 — B3.8 has parts 1 and 3 plus FG-DVC."

  - name: "Origins that a reprint currently stands in for"
    why: >
      Each of these cases is now BUILDABLE from a document on disk that restates
      the result with attribution, so none is urgent. Supplying the origin would
      turn a reprint-route page into an origin page.
    items:
      - "Grasa & Abanades, Ind. Eng. Chem. Res. 45 (2006) — B3.5. On disk is Criado et al. 2018, which REFITS the 2006 curve."
      - "Van Krevelen & Hoftijzer, Rec. Trav. Chim. 67, 563 (1948) — F3.2. Both Froment 3rd edn (secs 6.3.2/6.3.4) and Levenspiel (Ch. 23/24) restate the enhancement factor with attribution, so the case was flipped; the origin is still not on disk."
      - "Higbie, Trans. AIChE 31, 365-389 (1935) — A3.2. Bird/Stewart/Lightfoot sec. 18.5 and Froment sec. 6.4 both derive it with full attribution, so the case was flipped. Getting the original would let A3.2 own the film / penetration / surface-renewal three-way comparison as an origin page rather than a reprint one."
      - "Carty & Schrodt, Ind. Eng. Chem. Fundam. 14, 276-278 (1975) — A4.8. Taylor & Krishna reproduce the experiment with its conditions and computed fluxes PRINTED, which is enough to build; only the measured PROFILES are a figure in their book. Worth having only if the page wants the raw scatter."
      - "Wheeler, Adv. Catal. 3 (1951) — B1.8 and B2.6. Froment 3rd edn carries the Wheeler selectivity types with the exact citation, but the PORE MODEL treatment has not been checked; check before requesting."

  - name: "Monographs — the class is live, and these would extend it"
    why: >
      Five monographs are now on disk (Bird/Stewart/Lightfoot, Levenspiel, Taylor &
      Krishna, Froment/De Wilde/Bischoff, and Rawlings & Ekerdt, which nobody asked
      for and which is the only one whose equations survive text extraction). The
      per-case E1.1 results, with the chapter and section each verdict rests on,
      are in the `e1_1_evidence` blocks of docs/papers-inventory.yaml. These four
      would cover most of what is still unchecked.
    items:
      - "Ruthven, 'Principles of Adsorption and Adsorption Processes' — J1.2 (Freundlich/Sips/Toth/Dubinin), J1.6 (Thomas/Bohart-Adams), J1.9, J1.11, J1.12, J1.14. Section J1 is the single largest unsourced block left, and no monograph on disk touches it."
      - "Randolph & Larson, 'Theory of Particulate Processes' (1971, 1988) — J2.2 (MSMPR steady-state CSD). Froment cites it for the population-balance form but does not develop MSMPR."
      - "Newman & Thomas-Alyea, 'Electrochemical Systems' — J3.2 (Nernst-Planck + electroneutrality). T0/P1 and nothing on disk addresses it."
      - "Danckwerts, 'Gas-Liquid Reactions' (1970) — F3.4. Froment cites it constantly and reproduces several of its results, so CHECK FROMENT FIRST: the E1.1 test on it has not been run, and it may already be covered."

not_a_paper_problem:
  intro: >
    These will never be unblocked by a document, and should not sit in the paper
    queue. They need a decision from you.
  items:
    - "D1.1-D1.5 — RESOLVED AS A SOURCE PROBLEM, STILL OPEN AS A SCOPE PROBLEM. All five were flipped to unclaimed on 2026-08-06 because Froment, De Wilde & Bischoff Chapter 11 is the canonical treatment of all five structures and passes the E1.1 test on each (11.5 -> D1.1, 11.6 -> D1.2, 11.8 -> D1.3, 11.9 -> D1.4, 11.7 -> D1.5, with worked industrial examples throughout). But the catalogue rows are still STRUCTURE CODES rather than citations, four of the five structures are arguably already covered by published pages, and D1.5's is the genuine gap - the only published S6 page is A2.3 (Taylor-Aris), which has no reaction and no wall heat transfer. Decide which of the five you want built before any are dispatched. Decision page: https://claude.ai/code/artifact/8f5d6624-e867-4468-9220-65268f44add8"
    - "A figure-review decision, or a maintainer. Still the binding constraint on several already-unblocked cases (A3.14 is figure-only; half of A3.10; A3.12 has an owed review). Four of the cases flipped on 2026-08-06 have an unconfirmed table-versus-figure split — J1.4 (Myers & Prausnitz name four validation systems), B3.3 (the Hashimoto gasification comparison), A4.8 (Taylor & Krishna's measured profiles are Fig. 2.5) and J4.4. In every case the check is one render away and should be done BEFORE dispatch, not after."
    - "A1.8 remains the precedent for a third outcome: its origin turned out to be an UNPUBLISHED 1987 report, so the DOE Theory Guide already on disk is the citable published source and the case is closed, not parked. Check the reference list of what you already have before adding to this list — that is how the real Deckwer citation was recovered from Lehrer's reference list, and how Van Krevelen & Hoftijzer's was recovered from Levenspiel's."

