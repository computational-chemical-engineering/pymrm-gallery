      20B.2 (nonisothermal). States + attributes + carries a printed table. NOTE this covers the
      ARNOLD half of A4.8; the ternary MEASUREMENT half is Taylor & Krishna's Example 2.1.1 (Carty &
      Schrodt 1975).
    A3.2: >-
      PASSED. sec. 18.5 (book p. ~560): "This approach for studying gas absorption was apparently
      first proposed by Higbie. The problem discussed in this section illustrates the 'penetration
      model' of mass transfer", with the full citation R. Higbie, Trans. AIChE 31, 365-389 (1935)
      and a biographical footnote on Higbie, and the model developed further in Chapters 20 and 22
      (sec. 20.4 gives the boundary-layer form at a deforming interface). States + attributes +
      derives.
    A4.1: >-
      FAILED, and it is the Chapman & Cowling trap repeating - read this before assuming BSL covers
      A4.1. Every Wilke in BSL is a DIFFERENT Wilke result: the VISCOSITY mixture rule (J. W.
      Buddenberg and C. R. Wilke, Ind. Eng. Chem. 41, 1345 (1949); C. R. Wilke, J. Chem. Phys. 18,
      517-519 (1950) - note the journal, it is not Chem. Eng. Prog. 46); the Wilke-Chang LIQUID
      diffusivity correlation; Wilke & Hougen packed-bed j-factors; Wilke, Tobias & Eisenberg on
      free convection; and Wilke & Lee cited as a source for someone else's data. The 1950 Chem.
      Eng. Prog. gas-mixture DIFFUSION rule is not stated. A4.1 is closed by the ORIGINAL, which
      arrived in this drop, and independently by Taylor & Krishna Eq. 6.1.14.
    C1.5: >-
      UNCHECKED.
    J1.2: >-
      UNCHECKED.
  notes: >-
    COMPLETE BOOK, 914 PDF pages. PDF page = book page + 22 in the body (PDF p.5 = title, PDF p.7 =
    Preface). PDF pp. 1-4 are the endpaper tables of vector/tensor operations, not the front matter
