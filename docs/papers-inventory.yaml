      tortuosity of 2. Check the pore-model treatment before claiming this one.
    C1.5: >-
      UNCHECKED. Ch.1 is the rate-equation chapter and the Arrhenius form is used throughout, but
      C1.5 has no citation at all ("-") so what "the result" is has not been pinned down.
    D2.4: >-
      UNCHECKED, and moot: Ch.10 sec. 10.4.1 "Stability of Operation" and 10.4.2 "Transient
      Behavior" cover CSTR multiplicity, but D2.4's own origin paper (Uppal, Ray & Poore 1974)
      arrived in this drop, so the book is a secondary here at best.
    D3.6: >-
      UNCHECKED. sec. 11.5.4 "The Multibed Adiabatic Reactor" is the right structure for SO2
      oxidation, but whether the book works the SO2 case specifically has not been checked.
    E1.1: >-
      FAILED, and this is the negative worth recording. Searching the book for "Toomey" returns
      nothing. Its fluidised-bed treatment expresses the bubble-emulsion interaction through
      Davidson and Harrison's cross-flow and diffusion contributions, not through the Toomey-
      Johnstone two-phase postulate, and it neither names nor attributes that postulate. Exactly the
      E1.1 failure mode. E1.1 is closed by the ORIGINAL, which arrived in this drop.
  notes: >-
    COMPLETE BOOK, 902 PDF pages. NOT WHAT THE FILENAME SAYS in one respect that matters for
    citation: the filename is "Froment_Bischoff" but this is the THIRD edition (2011) and its
    authors are Froment, DE WILDE and Bischoff - Bischoff is marked deceased on the title page. The
    catalogue and papers-requested.yaml ask for "Froment & Bischoff", which is the 1st (1979) or 2nd
