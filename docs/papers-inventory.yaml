  e1_1_evidence:
    A4.8: >-
      PASSED. Two independent treatments. Steady: sec. 18.2 "Diffusion through a Stagnant Gas Film"
      (book p. 545), with Example 18.2-2 "Determination of Diffusivity" - the Stefan tube used as a
      measuring instrument, which is the case's own subject. Unsteady: sec. 20.1, Example 20.1-1
