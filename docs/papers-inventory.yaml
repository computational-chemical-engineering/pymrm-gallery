      k_2)/k_1, both named. Covers both halves of the case's "(1913); (1925)".
    B1.8: >-
      UNCHECKED. The reference list carries Wheeler, A., Adv. Catal., 3, 313 (1951) - the case's own
      citation - and Ch.3 derives the Wheeler Type I/II/III selectivity framework with attribution.
