# THE CATALOGUE OF THE LIBRARY - one entry per file in ~/papers/pymrm-gallery/.
#
# Written 2026-08-06 by the library-curation pass, when every PDF was renamed to
# a scheme that carries its identity:
#
#   papers  <FirstAuthor><Year>-<short-slug>-<JournalAbbrev><Vol>-<FirstPage>.pdf
#   books   BOOK-<Authors>-<Year>-<short-title>-<edition>.pdf
#   kept for the record, maps to no case   MISC-<...>.pdf
#   multi-part papers get -pt1 / -pt2
#
# `old_names` is load-bearing, not decoration: `pages/**`, `models.yaml` and
# `docs/handoff.md` still cite the OLD names in their provenance prose, and this
# file is what connects the two. `scripts/update_paper_references_2026-08-06.py`
# reads the old->new map straight out of this file.
#
# THE STANDING RULE, restated because it has cost this repository seven separate
# incidents: A FILENAME IS NOT A PAPER. Every identity below was established by
# reading the document's own title page, running head or publisher download
# stamp - never from the filename, never from a DOI, never from publisher
# metadata (which once named a DIFFERENT FILE IN THE SAME DROP).
#
# Three traps recur often enough to check for by default:
#   * FIRST-PAGE TRAP - the file opens with the PREVIOUS article's text. Eleven
#     files here do it. Always scroll past the first screen.
#   * NATIVE RESOLUTION - run `pdfimages -list` and believe it. The library
#     spans 150 to 600 ppi. Rendering above native upsamples a 1-bit image and
#     invents grey that is not in the file.
#   * TEXT LAYER LIES QUIETLY - it substitutes plausible wrong digits (24 in one
#     table on A4.5), reads Greek tau as the digit 7, drops decimal points, and
#     reports the wrong volume number. Crop and read the image for every
#     numeric.
#
# Fields:
#   file          current filename
#   old_names     every name it has had in this repository
#   kind          paper | book | misc
#   identity      full citation as the DOCUMENT gives it
#   doi           null where none is known or none exists
#   verified_by   how and when the identity was established
#   native_ppi    from `pdfimages -list`; null for born-digital / no images
#   text_layer    what the extracted text can and cannot be trusted for
#   supports      catalogue cases, each with the relationship
#   notes         traps, page-numbering quirks, anything a reuser needs
#
# `role` values used in `supports`:
#   origin              the document the case's result comes from
#   canonical-source    a monograph used under the textbook-canonical class,
#                       always with the E1.1 test result recorded
#   reprint             reprints the origin's result with attribution
#   secondary           companion, comparison or context; not the source
#   near-miss           looks like the case's paper and is not
#   commentary-about    a commentary or review ABOUT the case's paper
#   comparison-source   used to check another document's numbers

