validation:
  - "A STATED RESULT REPRODUCED: Jackson's pellet-centre pressure p_0 = sqrt(nu_B) p, quoted by Krishna & Wesselingh on p. 892 with 'a 40% increase' for nu_B = 2, comes out of a dusty-gas solve that encodes it nowhere as a 41.421 % <!-- claim: jackson_nu2_solved_increase --> increase, with a departure of 1.08e-6 <!-- claim: jackson_centre_pressure_dev --> at worst over nu_B = 1 to 4 at Kn = 1e6. The departure is the finite-Kn term of the model: departure times Kn varies by at most 1e-2 <!-- claim: jackson_dev_x_kn_spread_1e5_to_1e8 --> from Kn = 1e5 to 1e8 on a fixed grid. Spread over geometry, Thiele modulus and grid at most 1e-6 <!-- claim: jackson_invariance_spread -->."
  - "WHAT THAT CHECK CANNOT SEE, measured: in the Knudsen limit a sign flip of the [B^e] off-diagonals, a slab for the sphere and a five-cell grid move the centre pressure by at most 1e-5 <!-- claim: jackson_shift_b_offdiag_flipped -->, 1e-9 <!-- claim: jackson_shift_slab --> and 1e-6 <!-- claim: jackson_shift_five_cells -->; the break table shows each at Kn = 1 or phi = 3."
  - "GRAHAM'S LAW (eq. 107, an identity of eqs. 82 and 85 at grad p = 0) predicted by the isobaric slab, not imposed: residual at most 1e-10 <!-- claim: graham_law_residual -->. The finite-volume slab against eq. (109) with Graham's ratio integrated in closed form: at most 1e-5 <!-- claim: isobaric_fv_vs_closed_form -->."
  - "THE REVIEW'S p. 887 EXPONENTS as local slopes of the slab flux in ln p and ln d0: departures 9.00e-4 <!-- claim: scaling_slope_dev_knudsen --> under Knudsen control (20 nm, 1 kPa) and 1.30e-3 <!-- claim: scaling_slope_dev_bulk --> under bulk control (20 um, 1 MPa), falling with Kn at rates -1.00 <!-- claim: scaling_rate_knudsen --> and 1.00 <!-- claim: scaling_rate_bulk -->."
  - "TWO CLOSURES THAT DIFFER ONLY IN THE CONSTITUTIVE RELATION: the 2x2 [B^e] route against eq. (109) with the stoichiometric flux ratio agree to at most 1e-12 <!-- claim: dgm_vs_eq109_correct_rho --> (an identity of the scheme), and differ by at least 0.1 <!-- claim: dgm_vs_eq110_wrong_rho --> when the ratio is forced to 1."
  - "GRID: order 2.04 <!-- claim: grid_convergence_order --> on the effectiveness factor (finest triple of 50 to 6400 cells); the quoted errors extrapolated to zero cell size, finest grid within 1e-4 <!-- claim: eta_extrapolation_worst --> of the extrapolated value."
  - "GEOMETRY INDEX nu of construct_div against the classical first-order effectiveness factor of slab, cylinder and sphere: at most 1e-5 <!-- claim: geometry_eta_vs_closed_form_dev -->."
  - "ALGEBRA, labelled as algebra: eq. (109) re-derived from eq. (82) and reduced to eq. (110), 0 <!-- claim: symbolic_nonzero_residuals --> nonzero residuals; the Bosanquet centre pressure against nu_B D_A/D_B at most 1e-10 <!-- claim: bosanquet_p0_vs_closed_form -->; the error map against the solver's coefficients at most 1e-14 <!-- claim: closed_form_error_map_dev -->."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (eq. 85 mass exponent, eq. 87 off-diagonals, eq. 109 ratio misread, source coefficient, face-composition rule, Newton tolerance, pressure dependence of the pair diffusivities, pore-size dependence of the Knudsen diffusivity, phi, nu_B, Kn, ladder)."

adds: >
  pymrm supplies the transport skeleton of the binary solver (construct_grad,
  construct_div with nu, construct_boundary_value_matrices for the boundary face
  compositions, NumJac with a cell-and-species stencil, newton) and
  observed_orders for the refinement ladders. On top of that the page turns the
  review's "very restricted in its applicability" into a closed form for the
  error, D_Bos/D_1 = 1 + (rho-1) x_1/(1+Kn), and measures its consequence: for a
  spherical pellet running A -> 2B at phi = 30, Bosanquet overestimates the
  effectiveness factor by 26.96 % <!-- claim: bosanquet_eta_error_bulk --> at
  Kn = 1e-3, 14.12 % <!-- claim: bosanquet_eta_error_kn1 --> at Kn = 1 and
  2.97e-7 <!-- claim: bosanquet_eta_error_knudsen --> at Kn = 1e6, and the
  isobaric H2/N2 flux error is -41.33 %
  <!-- claim: bosanquet_flux_error_isobaric_bulk --> at Kn = 1e-3. Condition
  (iii) is shown symbolically to be "the viscous term of eq. (109) vanishes".

agreement: >
  Against printed results: Jackson's sqrt(nu_B) to 1.08e-6
  <!-- claim: jackson_centre_pressure_dev --> at Kn = 1e6, the finite-Kn term;
  Graham's law to at most 1e-10 <!-- claim: graham_law_residual -->; the p. 887
  exponents as local slopes with departures 9.00e-4
  <!-- claim: scaling_slope_dev_knudsen --> and 1.30e-3
  <!-- claim: scaling_slope_dev_bulk --> that fall with Kn at the predicted
  rates. Internal: the [B^e] route against eq. (109) at most 1e-12
  <!-- claim: dgm_vs_eq109_correct_rho -->; the classical effectiveness factor of
  three geometries at most 1e-5 <!-- claim: geometry_eta_vs_closed_form_dev -->;
  grid order 2.04 <!-- claim: grid_convergence_order -->.

caveats: >
  Data tier 6: nothing on this page is compared with a measurement. The review's
  Fig. 44 comparison with Remick & Geankoplis (1974) is ternary and belongs to
  A4.3. The origins (Knudsen 1909, Bosanquet's BR-507, Jackson 1977, Mason &
  Malinauskas 1983) are not consulted; every equation reaches the page through
  Krishna & Wesselingh (1997). Binary and scalar by design. Viscous flow, surface
  diffusion and pore-size distributions are set aside. Most results are
  dimensionless because the review prints no pore size, porosity or rate constant
  for a reacting pellet; the dimensional scaling check uses the review's p. 872
  pair diffusivities, loaded cross-page from A4.2, at Duncan & Toor's 35.2 C and
  1 atm (page A4.9's sidecar; the review prints no temperature or pressure with
  them), and is re-run at T = 400 K and with the diffusivities scaled by 1.3.
  eps/tau = 1 is eq. (84)'s tau = 1 with an assumed porosity of 1. The
  effectiveness-factor errors are quoted at a named Thiele modulus and vary with
  it. The Knudsen number is defined here as D^e_12/D^e_1M, which the review never
  defines. The Jackson check is blind to the friction terms, the geometry and the
  grid in the Knudsen limit, all measured.
