pymrm_min_version: "3.4.0"
runtime_seconds: 190
datasets:
  - smith-ewart-1948-printed-numbers.csv
  - check_values.csv

validation:
  - the truncated recursion of eq. 1 against the closed form at the test condition and over a map of m and alpha, with the n_max table and a round-off companion
  - Case 1, Case 2 and Case 3 limits, half-integer m in tanh and coth form, the limit of eq. 7
  - the Stage I population balance on five grids with observed orders, extrapolated stage end against the closed forms and a round-off companion
  - every function against independent check values from a second route
  - every number the page states is a registered claim with a break row that moves it

adds: >
  Not the model: eq. 1, its closed form and the Stage I bounds are special functions and
  exact arithmetic. pymrm contributes the second Stage I route, a population balance in
  particle volume (construct_convflux_upwind with the inflow through shapes_d,
  construct_div, pymrm.newton per implicit Euler step), and the checks
  (pymrm.checks.find_roots for every threshold and root, pymrm.checks.observed_orders).

agreement: >
  Every printed Stage I constant follows from the paper's premises within
  1.6244 <!-- claim: r34_hu_max --> half-units of its last digit; 3 <!-- claim: r34_n_round --> of
  the 5 <!-- claim: r34_n_printed --> round correctly and the constants of eq. 30 and of t_1 are
  truncated. The exact bounds are 0.52774 <!-- claim: r3_k_upper --> and
  0.37040 <!-- claim: r4_k_lower -->. Case 2 within 10 % needs beta of
  9.6723 <!-- claim: r1_beta_10pct_m0 --> or more, not the stated beta > 1, and the plateau reaches a slope of
  0.1 only for m up to 0.0057763 <!-- claim: r1_m_plateau_01 -->.

caveats: >
  The page tests the paper's derivations, not the physics: no physical value is printed,
  so where a real system lies on the map, and whether real particle numbers fall inside
  the bracket, are not tested. The closed form of eq. 1 is later work (Stockmayer 1957,
  O'Toole 1965). Eq. 8 is read with re-entry of desorbed radicals, a reading the paper
  does not state.
