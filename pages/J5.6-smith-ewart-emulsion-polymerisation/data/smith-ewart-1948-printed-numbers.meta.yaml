dataset_id: smith-ewart-1948-printed-numbers
title: "Printed constants, exponents, series coefficients and recursion expressions of Smith and Ewart (1948)"
status: complete

source:
  authors: ["Smith, W. V.", "Ewart, R. H."]
  year: 1948
  title: "Kinetics of emulsion polymerization"
  container: "The Journal of Chemical Physics 16, 592-599"
  doi: "10.1063/1.1746951"
  access: >
    Scanned journal PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    access. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: table
  figure: "abstract (p. 592), eqs. 12 to 14 and their text (p. 595), eqs. 22 and 23 (p. 597), eqs. 26, 29, 30 and the t_1 expression (p. 598), eq. 26a and the bracket for k (p. 599)"
  resolution: "PDF pages 2 to 9 (journal page = PDF page + 590; PDF page 1 is a publisher cover sheet) rendered at 300 ppi; values read from 300 ppi crops"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-24
  estimated_error: >
    None beyond the printed precision; entries are kept as printed strings (read with
    dtype=str), expressions written in plain text. The OCR text layer is unusable for
    formulas and numbers (it prints the exponent of eq. 22 as "!") and is not used for
    any entry. The paper prints no table, no figure and no physical parameter value:
    nothing is digitised.

conditions: >
  The paper states no units; the constants are pure numbers of the Stage I bounds and of
  the Case 2 series in beta = k_t N/(v rho').

columns:
  - {name: item, unit: "-", description: "short name"}
  - {name: printed, unit: "-", description: "the entry as printed, a string"}
  - {name: page, unit: "-", description: "journal page"}
  - {name: meaning, unit: "-", description: "what the entry is"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure or page image is reproduced.
