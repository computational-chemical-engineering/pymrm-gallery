validation:
  - the transcriptions of two differently typeset 1950s papers (Danckwerts eqs. 33 and 34, Wehner & Wilhelm eqs. 20, 21 and 22) agree to round-off, and the sensitivity of that agreement to a single mis-read digit is measured, not asserted (2.9e-2 for one wrong coefficient)
  - pymrm against Danckwerts' closed form eq. (34) at the parameters printed on Wehner & Wilhelm's Fig. 4, with van Leer TVD by Newton (ConvFluxTVD) and the exit read on the outlet face, 3.9e-8 at n = 1600 at observed order 1.97 approaching 2 from below; the last-cell read is second order too but 5.8 times larger at n = 1600, and larger on every rung; bare upwind is order 1.00
  - the bare-upwind error is numerical diffusion u*dz/2; comparing against eq. 34 at Pe_eff = 1/(1/Pe + dz/2) leaves a second-order residual
  - a Peclet sweep from 1e-4 to 1e4 against eq. 34, worst 3.6e-7 on the outlet face; the last cell centre misses the outlet boundary layer at high Pe and reads 1.9e-4 there, first order in the cell size
  - Danckwerts' two exact limits of the closed form, eq. 35 (plug flow) to 4.5e-8 and eq. 36 (stirred tank) to 2.2e-9, and his eq. 37 asymptote confirmed as exact to first order in 1/Pe by an observed decay exponent of 2.00 fitted over Pe >= 1e3 (1.95 over the whole plotted range, and the page says why)
  - "Wehner & Wilhelm's three-section problem solved as one pymrm domain, imposing NO Danckwerts condition anywhere: it reproduces the closed-vessel profile to 7.8e-6 with Pe_a and Pe_c swept, and the exit value spreads by 5.0e-8 across the runs"
  - the fore section against their eq. 19 to 9.0e-7 and the exit value against their eq. 21 to 8.1e-7; the zero gradient at z=1 is recovered rather than imposed, and the 3-point fit that recovers it is calibrated against the same fit applied to the exact eq. 33, which shows 84 % of the reported gradient to be the estimator's own truncation error and the remaining residual to fall at order 2.00
  - "identities of the discrete equations claimed as bounds, each with a break row that fails it: the after section being flat, the bed being independent of the after-section length and the last bed cell equalling the first after-section cell (all three fail once the reaction runs on past z = 1), and the outlet sign being absent from the assembled system (fails with an outlet d = 0.05). The fore-section flux is constant by construction; only its value informs, as a domain-truncation check"
  - "the harmonic face average of D at a jump is worth an ORDER, not a factor: refining only the bed, the arithmetic mean converges at observed order 1.00 in the fore section and the harmonic at 2.00, so the error ratio grows in proportion to n (84x at n_b=100, 172x at 200, 347x at 400 and about 700x at 800, where round-off on the 32800-cell uniform grid leaves the last digit unresolved), and it fails silently, the exit value moving by only 9.3e-10"
  - "defect sensitivity measured by injection: a mis-signed inlet condition moves the agreement to 1.97, the naive Dirichlet inlet to 0.497, a wrong nu and a Dirichlet outlet to 1.00, a mis-signed reaction to 26.1; every claim on the page has a break row that fails its own check"
  - "the same measurement names two blind spots: the sign of `a` at the outlet is undetectable by any test, shown in the strongest available form rather than by a null result (with b = d = 0 the assembled matrix and right-hand side are bit-identical for a = +1, -1 and 1e7, while a flipped inlet sign moves the matrix by 1.8e3, and setting d = 0.05 makes the outlet sign matter again, f(exit) 0.2470 against 0.2219); and under-resolution is only weakly detected where the grid is not strained (n = 10 costs 6.3e-5 at Pe = 2.667 but 3.2e-3 at Pe = 200)"
  - the naive Dirichlet-inlet solve against its own closed form (Hulburt = Danckwerts / f(0), with f(0) from Wehner & Wilhelm eq. 22) to 9.4e-7 over four decades of Peclet number
  - "two solver routes on the same discrete equations: Newton with the residual written as the correction to the upwind solution, against deferred correction: the correction form brings Newton onto the deferred-correction state of the shared upwind factorisation, and the closed-vessel exit reproduces to about 2e-13 under a second column ordering; about 1e-11 on the stretched three-section grids; with the Newton residual written in full, the closed-vessel exit sits about 1e-12 off, at a round-off floor that moves with the BLAS kernel"

adds: >
  Nothing to the result: Danckwerts' conditions are right, Wehner & Wilhelm's
  derivation is correct and the closed form is exact. What the page measures is
  the size of the mistake and where the checks run out. The naive inlet condition
  c(0) = c* is wrong by 179 % in f at Pe = 0.1, 50 % at the Peclet number Wehner
  and Wilhelm printed on their own Figure 4, and 1 % at Pe = 200; as Pe tends to
  zero it predicts no conversion at all where the answer must be a stirred tank.
  Both papers had that algebra, neither plotted it. The outward-normal trap is
  measured and found to be asymmetric: a flipped sign at the inlet is a 197 %
  error, at the outlet it is undetectable by any test whatsoever because b = d =
  0 there makes the assembled matrix and right-hand side bit-identical for
  a = +1, -1 and 1e7, so verifying the outlet condition proves nothing about the
  inlet condition. Bare upwind convection adds a numerical diffusivity u*dz/2
  that is indistinguishable from a lower Peclet number (a 200-cell grid at
  Pe = 200 really runs at Pe_eff = 133), and at high Peclet number reading the
  exit at the last cell centre misses the outlet boundary layer, so a
  boundary-condition study can measure its own discretisation or read-off error
  and call it physics. From pymrm the page uses the boundary dictionaries with
  describe_bc, ConvFluxTVD with newton, compute_boundary_values and
  construct_coefficient_matrix.

agreement: >
  Not applicable in the experimental sense: this is a tier 6 analytical page and
  neither source paper reports a measurement bearing on the boundary conditions.
  The check with the most power is Wehner & Wilhelm's three-section problem,
  which never writes a Danckwerts condition and still reproduces the closed
  vessel to 7.8e-6 with the two end-section Peclet groups swept. The check with
  the most resolution is the closed form: 3.9e-8 at n = 1600 on the outlet face,
  and 3.6e-7 or better across the Peclet sweep. Danckwerts' limits of the closed
  form come out at 4.5e-8 (plug flow) and 2.2e-9 (stirred tank). The
  transcription is verified across two papers to round-off, and injecting one
  wrong digit lifts that to 2.9e-2.

caveats: >
  Tier 6 and emphatically NOT experimental validation. Neither paper measures
  anything that tests these boundary conditions; Danckwerts' one experimental
  figure (water through Raschig rings) belongs to his open-vessel residence-time
  analysis, which he says himself cannot be carried into the reactor problem, so
  it is not used and no figure on either paper is digitised. Nothing here tests
  whether a real packed bed obeys the axial-dispersion model, only what the
  model means once adopted. The demonstration that df/dz = 0 emerges at the bed
  exit is a reproduction of Wehner & Wilhelm's chain of reasoning, not an
  independent proof of its premise: imposing boundedness at the far downstream
  truncation is itself a zero-gradient condition applied one section away, and
  the page says so. Nor is the three-section route independent CODE: it shares
  the whole operator stack and the solver with the closed-vessel solve, and its
  effective condition at z = 1 shares the zero diffusive flux of bc_out = {a:1,
  b:0, d:0} but carries c_N where the closed vessel's outlet face carries
  (9 c_N - c_(N-1))/8, 1.0e-6 apart at n = 800; what it establishes is that the Danckwerts closure is the right
  reduction of a different problem statement. The identities of the discrete
  equations are claimed as bounds with break rows that fail them. The recovered df/dz(1) is 84 % the truncation
  error of the 3-point fit that recovers it, measured by applying the same fit
  to the exact eq. 33. And Wehner & Wilhelm's own qualification of the inlet
  discontinuity, "not necessarily correct", is quoted and reconciled: in their
  three-section model f is continuous at z = 0 and the closed-vessel step is the
  Pe_a to infinity limit, with the measured cell-to-cell fall running from
  3.0e-3 at Pe_a = 1 to 2.7e-1 at Pe_a = 1000 against a full step of 0.332. The
  closed-form comparison has weak power against under-resolution at the
  reference Peclet number, measured at 6.3e-5 for a 10-cell grid, and grid
  convergence is therefore reported as a table rather than a tolerance. The
  residence-time half of Danckwerts 1953 (the F- and C-diagrams, hold-back,
  segregation, the laminar-pipe distribution) is not built here; A2.4 is the
  catalog entry for it.
