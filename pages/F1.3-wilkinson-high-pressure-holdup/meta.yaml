validation:
  - dimensional identity - 4 of the 4 groups of eqs. 3 and 4 come out exactly dimensionless by exponent arithmetic on (kg, m, s), while the 3 groups of the transition equations of Wilkinson (eq. 2) and Reilly (eq. 8) do not, so their constants carry units; the source's own Notation list on its page 2634 declares sigma in N/m, mu_L in Pa s and rho_G in kg/m3, so SI is the paper's stated convention rather than an inference. The identity constrains exponents INSIDE the groups only - an exponent on an already dimensionless group (0.757, -0.273, -0.077, 0.03, 0.077) is unconstrained by it and rests on the 600 dpi render alone
  - continuity identity - eps_b -> (U - U_trans)/V_small and eps -> eps_trans as U -> U_trans, so eq. 4's first term is exactly eq. 3's V_small and the correlation is C1 across its own regime boundary. This is a structural identity and NOT a transcription check, because the exponent 0.757 is an input to the arithmetic
  - monotonicity and invertibility of eps_b(U), with every inverse solve done by pymrm.checks.find_roots on a physical range that must return exactly one root, and eps < 1 over the whole useful range (eps = 1 only at U = 12.2 m/s)
  - reproduction of the authors' own computed lines, on two different figures - on Figure 4's LOGARITHMIC axes eq. 2 gives 0.0102 for air-water and 0.0028 for air-tetradecane, matching where the authors draw their own evaluation (one significant figure, no coordinates extracted); on Figure 6's LINEAR axes eq. 8 reproduces (0.057 and 0.174 against lines read at ~0.055 and ~0.17 at rho_G = 0.18 and 1.83) while eq. 2 is drawn indistinguishable from zero, which corroborates the collapse without quantifying it. Labelled reproduction, not validation. Recorded there too - Reilly's U_trans as printed comes out about 20 % below (-18 % and -22 % at the two densities read) the authors' own drawn Reilly curve in Figure 6's velocity panel while their eps_trans curve reproduces, which is an inconsistency in the source and not a transcription error here
  - measurement - the 63 digitised Figure 11 markers, giving Wilkinson a mean absolute deviation of 63.9 % with a bias of +63.9 % at air density, +46.8 % to +79.4 % across the four gases, and a fitted power-law slope of 0.621 against the data's 0.636. Evaluated end to end from a physical velocity instead of at the plotted abscissa, the bias at air is +106 % (+99 % with the U_df read off Figure 6), so the abscissa convention matters at the small excess velocities of the markers (up to a factor 2.4 in eps_b) although it is worth at most 15 % at 0.15 and 0.30 m/s
  - break table - 42 injected defects (a published constant mistyped, or an input changed) and 2 control rows, every claim but one structural identity failed by at least one row, and no control row fails a claim

adds: >
  Nothing to the correlation itself, which is algebra; the one pymrm call is
  pymrm.checks.find_roots, used for every threshold, crossing, extremum and inverse
  solve, which demands exactly one root on a physically possible range and so
  replaces hand-picked brackets and grid read-offs. Krishna and Ellenberger report
  that Wilkinson underpredicts the dense-phase parameters and overpredicts the
  large-bubble holdup, and give a statistic for each. Running the four equations
  end to end - which needs eq. 2, the one equation the F1.4 page never evaluates -
  shows these are two defects that can be separated. Eq. 2 puts the regime
  transition 1.7 decades too low at air and 1.4 at argon, and 6.8 decades too low
  at helium (eps_trans = 0.0028 for air-tetradecane against a measured 0.139, and
  1.5e-8 against 0.089 for helium), which empties the small-bubble population; that
  defect is entirely eq. 2's. At the measured excess velocity eq. 2 does not enter
  at all, so the +64 % on eps_b belongs to eqs. 3 and 4 JOINTLY - V_b is 39 % low on
  average, and V_b's first term is eq. 3's V_small, which supplies 46 % of V_b on
  average over these points (23-77 %, and 77 % at the lowest excess velocity), while
  eq. 4's second term is the larger one at 42 of the 63 points. Running end to end
  from a physical velocity adds eq. 2's transition error on top: +106 % at air. The
  gas labels on Figure 11 are unreliable, so all 63 points are evaluated at air
  density; redoing it at the other three gases gives +46.8 % (helium) to +79.4 %
  (SF6), a 33 pp span and a V_b shortfall of 32-44 %. What is not wrong is the
  shape: over the window Figure 11 covers, the power-law slope Wilkinson predicts
  (0.621) is closer to the measured 0.636 than the replacement correlation's 0.58 is.
  Two further results are in neither source. First, the two transition closures are
  NOT complementary: Reilly's eq. 8 exceeds Wilkinson's eq. 2 at every gas density,
  the ratio bottoming out at 2.85 near 29 kg/m3 and rising again, so the curves
  never cross and there is no density at which Wilkinson takes over. They fail in
  opposite directions instead - eq. 2 is low wherever it can be tested and is
  hard-bounded by its prefactor 0.5, while eq. 8 is the better-supported of the two
  but passes its authors' stated ceiling of 0.32 just past SF6 at 6.7 kg/m3, turns
  non-monotone at 15 kg/m3 and exceeds 1 at 70 - so above 6.7 kg/m3 neither closure
  has support in this source. Second, Table 3's pattern follows from the split: eq. 2
  underpredicts eps_small by about twice as much (0.128) as eq. 1 overpredicts eps_b
  (0.066), the signs are opposite, so roughly two-thirds of the absolute error
  cancels in the total, which is why Wilkinson is 7.8 times worse than its
  replacement on eps_b and level with it on the total. That cancellation figure is
  close to a restatement of the two terms it is built from, and its small-bubble
  term uses Reilly's eps_df - a model - as the stand-in for a measured small-bubble
  holdup that is not published.

agreement: >
  Deviation is (model - measured)/measured throughout, the same convention as
  F1.4, so the two pages are directly comparable. Against the 63 digitised
  Figure 11 markers, Wilkinson eqs. 1-4 have a mean absolute deviation of 63.9 %
  with a bias of +63.9 % - it is high at every single point. F1.4 commits the same
  number, and the page checks the two agree, but it retypes eqs. 3 and 4 from the
  same source and applies them to the same 63 rows, so the match is a transcription
  cross-check between two pages, not an independent computation. Evaluating all 63
  points at air density is itself an assumption forced by the unreliable gas labels:
  the four-gas span is +46.8 % (helium) to +79.4 % (SF6), i.e. a V_b shortfall of
  32-44 %. The fitted log-log slope over that window is 0.621 against the data's
  free-fit 0.636, and the deviation correlates with log(U - U_df) at only -0.11, so
  the error is mostly in the level and not the shape. Nothing here reproduces
  Table 3, whose raw runs are not published: the printed deltas are quoted as the
  authors' own and used only for pattern. What carries the transcription is the
  dimensional identity on eqs. 3 and 4 plus the source's own Notation list for the
  units, and the reproduction of the authors' plotted evaluation of eq. 2 on
  Figures 4 and 6. The C1 identity does NOT carry it.

caveats: >
  The primary source, Wilkinson et al. (1992), was not available. Eqs. 1-4 are
  taken from Krishna and Ellenberger's (1996) reprint of them and verified on
  600 dpi renders of that paper, so a mis-set exponent there would be inherited
  here. The defence is the dimensional identity plus the reproduction of the
  authors' own plotted lines on Figures 4 and 6 - NOT the C1 continuity check,
  which is structural and labelled as such on the page. The dimensional identity
  also does not reach an exponent applied to an already dimensionless group
  (0.757, -0.273, -0.077, 0.03, 0.077); those five numbers rest on the 600 dpi
  render alone. Wilkinson's own stated range of validity is therefore unknown -
  every statement about where eq. 2 behaves is a statement about the formula, not
  a quotation of its authors, and 14 kg/m3 is only where eq. 2 crosses a FIXED
  0.15, which is a lower bound on adequacy rather than a crossover, because the
  measured dense-phase voidage rises with density too. Krishna and Ellenberger
  are replacing this correlation, so they are a hostile witness, and every claim
  of theirs used here is attributed. This is an algebraic closure, not a
  discretised model; no pymrm operator appears and the page says so rather than
  inventing a PDE. The only measurements used are the 63 Figure 11 markers - one
  column, one liquid, four gases - loaded cross-page from F1.4, whose maintainer
  review found the marker positions trustworthy and the gas labels not, so no test
  here depends on series identity. The liquid-property and column-diameter
  behaviour is discussed and not tested; those are Figures 7 and 9 and neither is
  digitised, and the largest column diameter (0.63 m) is quoted from F1.4, not from
  a dataset. Six numbers are read by eye off Figure 6 to two significant figures
  - eps_df 0.089/0.139/0.192 from panel (a) and U_df 0.0161/0.0230/0.0269 m/s from
  panel (b), at rho_G = 0.18/1.30/1.83 - and are used as plot markers and to put a
  scale on a trend the paper states in words; the panels carry no (a)/(b) marks and
  the velocity panel is printed above the voidage one, so the caption is the only
  authority. They are not a dataset: no CSV, no sidecar. The claims resting
  on them are the decades below the measurement (1.7 at air, 1.4 at argon, 6.8 at
  helium), the Reilly U_trans range against the measured U_df, the end-to-end bias
  with the U_df read off Figure 6, and the extrapolated measured level near 14 kg/m3,
  which is labelled a three-point reconstruction. The end-to-end bias uses Reilly's U_trans
  (or the three Figure 6 readings) in place of each marker's measured U_df, which
  is not published point by point. The total-holdup comparison uses a reference
  built from the measured eps_b plus Reilly's eps_df, because no total holdup is
  published for these runs, and is labelled indicative. The column-diameter
  argument propagates the measured bias with eq. 19's own diameter exponent and is
  an internal-consistency argument between two of the paper's results, not a
  reproduction of either. The pressure sweep is an extrapolation with nothing here
  to test it; beyond 6.5 kg/m3 it also runs Reilly outside its stated range, and
  the figure marks where.
