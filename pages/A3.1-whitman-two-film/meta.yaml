id: A3.1
slug: whitman-two-film
title: "Whitman's two-film theory, and what his three runs can actually test"
section: A
status: published
tier: T0
priority: P1
structures: [S3]
phases: [gas-liquid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "3.3.0"
runtime_seconds: 9
datasets:
  - whitman-1923-table1.csv
  - whitman-1923-printed-results.csv

validation:
  - "over-determined transcription check: Table 1 holds four equilibrium pairs by Whitman's own subscript convention; the two-parameter semi-log line of his Fig. 3 fits them to 0.383 % in p, and a lost mid-dot (p3 of run 1 read as 5.5) moves that above 100 %. Runs 2 and 3 share p1 and print the same c1, which corroborates the reading with no fit"
  - "Fig. 3's printed top axis corner recovered to 0.0081 log units; the bottom corner is not a target (an identity: box shortfall plus the top deviation)"
  - "Whitman's worked example reproduced from Table 1 alone with his printed numbers held out (all but the first depend on the reconstructed curve); the held-out run-2 rate is 0.558 % below the observed one"
  - "three models on the three runs: single gas film 41.7 % rms, single liquid film 59.5 %, two films 0.379 % with one degree of freedom left, which the two-film model misses by 0.934 % where a parameter-free gas film misses by 0.319 %"
  - "power analysis: run 2 is 99.4 % gas-film controlled; deleting the liquid film (closed form, checked by Richardson extrapolation of the root solve) moves the prediction to 0.054 % above the observation; every subset with run 1 admits k_c only in 1.126 to 1.244 (root-found edges), without run 1 every k_c above 0.396"
  - "the linearised overall coefficient 1/K_p = 1/k_p + m/k_c against the exact nonlinear interface: run 1 off by 34.1 % (tangent m) and 12.8 % (secant m); exact with a linear equilibrium and with the chord from c3 to the solved interface"
  - "pymrm two-film solve against the algebra: an identity (a linear profile is exact in the finite-volume scheme), labelled as such; it moves for nu = 1 and for a missing equilibrium jump"
  - "a first-order reaction in the liquid film against the exact reacting-film profile: second order on a resolved layer; at a fast reaction the rate tends to k_p (p1 - f(0)), the gap set by the intercept of the reconstructed line, not by the grid"
  - "every non-structural claim has a break-table row that fails its own check; the counts are printed by the page"

adds: >
  Not the two-film answer: for Whitman's problem the pymrm solve reproduces the
  algebra to round-off by construction, and the page says so. The worked
  example, the model fits, the map of the overall coefficients over the
  operating plane (K_p over a factor 3.80, K_c over 13.59 at fixed k_p and k_c)
  and the error of the linearised overall coefficient all need only the scalar
  root of eq. 4, and the page says that too. What pymrm contributes is the film
  as a coupled finite-volume object: a reaction in the liquid film checked
  against the exact reacting-film profile at second order, the check that
  carries the same model to kinetics with no closed form, and the coupling
  pattern itself (two films on one BlockLayout, the interface values as
  shapes_d unknowns, the one nonlinear row with an exact derivative). The most
  useful output, the power analysis of what three runs can test, needs no
  solver at all.

agreement: >
  Against printed results: Whitman's worked example reproduced from Table 1
  alone, the held-out run-2 rate 0.558 % low; his three stated ratios recomputed
  (the "twelvefold" is 12.99). Internal: four printed equilibrium pairs on one
  semi-log line to 0.383 % in p. Model comparison: two films 0.379 % rms over
  the three runs against 41.7 % and 59.5 % for a single gas or liquid film, the
  one remaining degree of freedom off by 0.934 % where a parameter-free gas film
  is off by 0.319 %. Identities (pymrm against the algebra, the bottom axis
  corner, the K_p disagreement of runs 2 and 3) are bounds, labelled as such.

caveats: >
  TIER 3 for Table 1 and TIER 6 for everything derived from the worked example.
  The measurement is three absorption runs at 30 deg C, with no apparatus
  description, no interfacial area, no flow rates, no replicates and no error
  estimate. The paper's own subtitle is "A Preliminary Experimental
  Confirmation" and Whitman writes that the data "are insufficient to prove
  definitely the truth of the two-film theory".

  REPRINT ROUTE. The 1923 original in Chemical and Metallurgical Engineering is
  pre-DOI and unreachable and was NOT consulted. Everything on this page was read
  off renders of the verbatim reprint in Int. J. Heat Mass Transfer 5 (1962)
  429-433 at that scan's NATIVE resolution (pdfimages -list reports CCITT-G4
  bilevel images at 300 ppi, so rendering larger only interpolates), with every
  numeric cropped and re-read at that resolution rather than read at page scale.
  The reprint carries its own DOI and states its origin in its own header. ALL
  PAGE REFERENCES ON THE PAGE ARE TO THE 1962 REPRINT. The 1923 page range
  146-148 appears only in that header; it is inherited, not verified, and no
  individual 1923 page is cited. NO ISSUE NUMBER IS GIVEN ANYWHERE: the header
  prints volume, pages and year only. The PDF's text layer is an OCR of the scan
  and is not used for any number: it renders eq. (7) as "2,$~=PL~~2Lz" and run
  3's K_c as "om7", and the 1962 typesetting uses a mid-dot decimal separator
  that the OCR discards.

  THE EDITOR'S FOREWORD IS NOT WHITMAN. The 1962 reprint opens with a foreword
  signed "D.B.S." quoting Sherwood and Pigford's 1951 preface. It is quoted on
  the page as 1962 editorial commentary and is never attributed to Whitman.
  Sherwood and Pigford's book is not on disk and is cited only through that
  foreword, which gives it as "Absorption and Extraction (McGraw-Hill, 1951)"
  and states NO EDITION, so none is asserted on the page.

  EQS. (2) AND (3) ARE RE-SUBSCRIPTED, and the page says so where it does it.
  Whitman prints them as p_g - p_l and c_g - c_l on reprint page 430 and
  re-writes the same two potentials as (p1 - p3) and (c1 - c3) in his own eqs.
  (5) and (6) on page 431. The page uses the numbered subscripts throughout,
  quotes his definitions of p_l and c_g verbatim, and flags the substitution
  because it is the one place a subscript convention carries an extraction
  claim.

  THE EQUILIBRIUM RELATION IS A RECONSTRUCTION, not a digitisation and not a
  thermodynamic correlation. It is fitted to the four (c, p) equilibrium pairs
  Whitman prints in Table 1's own columns and validated against four numbers he
  read off Fig. 3 and against Fig. 3's printed axis ticks. No pixel of Figs 2 or
  3 is measured and no figure is reproduced; the Dolezalek (1898) and Bates &
  Kirschman (1919) points plotted on Fig. 3 are not transcribed. It should be
  used inside this page's argument and nowhere else.

  k_p, k_c, K_p and K_c ARE PER-APPARATUS CONDUCTANCES, not per-unit-area film
  coefficients. No area, thickness or diffusivity can be recovered from them and
  none is invented: the pymrm films are given unit thickness so that D/delta
  equals the printed coefficient, which is a gauge choice that nothing depends
  on. Whitman's printed k_c should not be quoted as a measured liquid-film coefficient: the
  page shows the three runs admit only a band, and that removing the single run
  which sets it leaves it unbounded above.

  WHAT THE PAGE DOES NOT SETTLE. It establishes that a single film of either
  kind cannot describe these three runs and that two films can with one degree
  of freedom to spare. It cannot choose between film, penetration and surface
  renewal: the diffusivity exponent that separates those pictures is not
  something Whitman's data can see. THAT COMPARISON IS MADE ON A3.2
  (pages/A3.2-higbie-penetration/), the page that holds all three sources at
  once: film and surface renewal each fit A3.2's one measured coefficient by
  construction, and penetration alone predicts it with no free constant, but
  A3.2 does not settle the underlying diffusivity exponent either, since one
  measured coefficient at one diffusivity cannot resolve an exponent. The
  reaction cell is a limit check, not an enhancement model; F3.1 owns Hatta.
  k_p and k_c are assumed equal across all three runs, which
  Whitman explicitly says need not hold ("the values of k_p and k_c will, of
  course, be dependent on experimental conditions") and which three runs cannot
  check.
