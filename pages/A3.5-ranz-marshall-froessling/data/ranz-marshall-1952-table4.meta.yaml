  - {name: D_p_cm,               unit: cm,     description: "drop diameter, 0.110 cm throughout"}
  - {name: air_vel_cm_s,         unit: cm/s,   description: "air velocity"}
  - {name: air_temp_C,           unit: degC,   description: "air temperature"}
  - {name: drop_temp_C,          unit: degC,   description: "drop temperature; every value is below benzene's melting point"}
  - {name: press_mmHg,           unit: mmHg,   description: "atmospheric pressure"}
  - {name: Nu_apparent,          unit: "-",    description: "N_Nu, apparent; no corrected column is printed for benzene"}
  - {name: Nu_prime,             unit: "-",    description: "N_Nu', mass transfer"}
  - {name: Re,                   unit: "-",    description: "N_Re"}

