folio_note: >
  PART I'S PAGE RANGE IS RECORDED BOTH WAYS AND THIS PAGE SAYS WHICH IT READ. Part
  I's scan frames carry TWO folio lines: one at the very top of the frame, above the
  black edge of the leaf, and one at the bottom inside the leaf. They differ by
  exactly two. BOTH ARE LEGIBLE ON ONLY FOUR OF THE SIX FRAMES (139/141, 140/142,
  141/143, 144/146); on frame 4 the upper line is cut off at the leaf edge and on
  frame 5 there is no upper line at all, so those two pairs are inferred from the
  sequence rather than read. Part II settles which is the page's own: its first page has a BLANK top
  margin and prints "Vol. 48, No. 4 | Chemical Engineering Progress | Page 173" at
  the FOOT of the text block, so in this issue the folio line is a footer, not a
  running head. The line at the top of a Part I frame is therefore the footer of the
  preceding leaf, caught in the same frame. Read that way Part I is folios 141-146,
  which is the universal citation and the one Ranz himself gives in his 1993 ISI
  "Citation Classic" ("Chem. Eng. Progr. 48:141-6; 173-80, 1952"). The 139-144
  reading recorded against this file comes from taking the upper line as a running
  head. Every folio cited in these sidecars is the one printed at the FOOT of the
  page the value appears on.

validation:
  internal_consistency: >
    THIS TABLE CARRIES ITS OWN ABSCISSA, which is why it is on the page: the last
    column is N_Re^(1/2) N_Pr^(1/3) as printed, so eqs. (21) can be evaluated on it
    with no property data of any kind. Two further identities hold inside it and are
    checked in the notebook. (i) The nine rows are five motion-picture runs read at
    two drop diameters each (four pairs) plus one single, and within a pair the air
    velocity, air temperature and drop temperature are identical, so the abscissa
    ratio must be (D_p1/D_p2)^(1/2): it holds to 1.78 % on the worst of the four
    pairs. (ii) Within a pair the driving temperature difference and the conductivity
    are the same, so eq. (19) makes N_Nu proportional to -d(D_p^2)/dtau: the printed
    N_Nu ratios reproduce the printed derivative ratios to 1.82 % on the worst pair.
    Both sit inside the roughly 2.5 % that two-figure printing allows, so the table
    is self-consistent; what disagrees with it is the correlation, by up to 21.9 %
    on a within-run N_Nu ratio.
  what_it_tests: >
    These rows are inside Figure 9 and so inside the fit for the 0.60, but they are
    the only high-temperature transfer data in either part, and the notebook uses
    them as the out-of-range set: the coefficient is refitted on Table 1's
    room-temperature runs alone and then applied here.

printed_defects: []

caveats: >
  THE DROP TEMPERATURES ARE AVERAGES OVER A RANGE, NOT POINT MEASUREMENTS. Part II
  states that for air temperatures above 85 C the experimental drop temperatures in
  Table 3 were averaged over temperature ranges of about 5 C, the lag being caused by
  the drop starting near 10 C and needing a high heat flux to reach the steady value.
  With driving differences of 50-170 C a 5 C ambiguity is 3-10 % on N_Nu on its own.

  NO REYNOLDS COLUMN IS PRINTED, so this table cannot join the Re-consistency check
  that Tables 1, 2 and 4 support.

  TWO SIGNIFICANT FIGURES on both N_Nu and the abscissa.

