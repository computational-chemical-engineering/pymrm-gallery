validation:
  - "FIT VERSUS TEST, LABELLED EVERYWHERE. The correlation contains four numbers with four statuses: 2.0 is THEORETICAL (Part I eq. 7), 0.60 is FITTED to Figures 6, 7 and 9, which are Tables 1-4, and the exponents 1/2 and 1/3 are ASSUMED from Froessling. Every rms against Tables 1-4 is marked IN-SAMPLE, with null baselines beside it: 1.72 % <!-- claim: t1_heat_eq24_rms_pct --> for eq. (24) against a best null of 39.8 % <!-- claim: t1_heat_null_best_rms_pct -->."
  - "THE INTERCEPT IS THE ONE TESTABLE CONSTANT. The same free two-parameter fit, extrapolated to Re = 0, with the intercept's standard error from the fit's own scatter: heat (Table 1) 2.0582 <!-- claim: t1_heat_intercept_free --> +- 0.0538 <!-- claim: t1_heat_intercept_se -->, t = 1.08 <!-- claim: heat_intercept_t -->; benzene mass transfer (Table 4) 2.0523 <!-- claim: t4_benzene_intercept_free --> +- 0.1245 <!-- claim: t4_benzene_intercept_se -->, t = 0.42 <!-- claim: mass_intercept_t_benzene -->; water mass transfer (Table 1) 1.7322 <!-- claim: t1_mass_intercept_free --> +- 0.0870 <!-- claim: t1_mass_intercept_se -->, t = -3.08 <!-- claim: mass_intercept_t_water -->, beyond the two-sided 5 % point of Student t with 13 dof. The still-air pair has an analogy ratio of 1.2458 <!-- claim: stillair_analogy_ratio --> where the correlation demands 1."
  - "A CONVENTION RECOVERED FROM THE TABLES. The Reynolds column, over-determined by the columns beside it, puts the air-property reference temperature at w = 0.4996 <!-- claim: re_reference_temperature_weight --> between air and drop (a root of the exact derivative of the residual), the film temperature, with temperature exponent -1.765 <!-- claim: re_law_T_exponent -->. It matches Part II's one stated reference temperature to 0.15 <!-- claim: stillair_film_minus_stated_K --> K and predicts Table 3, which prints no Reynolds column, to 0.82 % <!-- claim: t3_heldout_rms_pct --> rms against 1.77 % <!-- claim: t3_heldout_rms_pct_free_stream --> at the free stream."
  - "TABLE 4 RUN 11 SETTLED BY ARITHMETIC: both transfer numbers come from one measured rate, so the ratio identity of runs 10 and 12 brackets run 11's N_Nu' in [9.73 <!-- claim: t4_run11_Nuprime_lower_bound -->, 10.06 <!-- claim: t4_run11_Nuprime_upper_bound -->]; read 10.0 the three ratios agree to 1.03 % <!-- claim: t4_ratio_spread_runs_10_12_pct -->, read 10.6 they would spread 6.93 % <!-- claim: t4_run11_alt_ratio_spread_pct -->."
  - "THE STAGNANT FLOOR, WITH pymrm: the sphere in a shell of 1e4 radii, one sparse solve per grid, compute_boundary_values for the surface flux; second order on nested geometric grids, Richardson limit below 1e-6 <!-- claim: pymrm_conduction_dev_from_2 --> from 2, surface and shell fluxes equal to the solve's residual."
  - "STEFAN FLOW AGAINST ITS CLOSED FORM: diffusion with the radial convection it drives (first-order upwind), the total flow the one root of the flux balance. 9.62e-4 <!-- claim: stefan_pymrm_vs_closed_rel --> from the closed form at 600 cells; with the first- and second-order errors removed together, below 1e-8 <!-- claim: stefan_extrap_vs_closed_rel -->. The log-mean p_f returns 2.0 exactly; the arithmetic mean is 0.41 % <!-- claim: pf_arith_dev_at_y020_pct --> out at y = 0.20."
  - "A DEFECT-INJECTION TABLE: the analysis of the tables is one function of the tables and the printed-constant dictionary, rerun under every misread cell, column or constant; the solver claims have rows through call arguments (geometry code, outer condition, grid, ladder, convection, quadrature range, targets, Lambert-W branch). Every claim but one structural identity fails at least one row."

adds: >
  The operators of the two linear spherical problems and the flux reads. The 2.0
  of eq. (7) becomes a computation, and a far field of ten radii shifts it by
  11.1 % <!-- claim: pymrm_conduction_b10_excess_pct -->, a correction the
  correlation cannot express. The Stefan solve settles which average Part II's p_f
  is (the logarithmic mean) and confirms the closed form that sizes the radial convection Ranz said
  in 1993 the papers underplayed: +1 % on Sh at a surface mole fraction of
  1.97 % <!-- claim: stefan_y_for_01pct -->. The fit/test split and the recovered
  reference temperature are NumPy and owe pymrm nothing.

agreement: >
  The heat and benzene intercepts are consistent with the theoretical 2.0; the
  water mass-transfer intercept is -13.39 % <!-- claim: mass_intercept_dev_water_pct -->
  from it, -3.08 <!-- claim: mass_intercept_t_water --> standard errors. Table 1
  reproduces the fitted 0.60 to +0.34 % <!-- claim: t1_heat_K_recovered_dev_pct -->,
  and the released Reynolds exponent is 0.4933 <!-- claim: t1_heat_Re_exponent_fitted -->.
  Table 3 sits 11.0 % <!-- claim: t3_eq21_rms_pct --> rms from the correlation
  inside its own fit set. pymrm against two closed forms, each on a refinement
  ladder with its order.

caveats: >
  TIER 3, TABLE TRANSCRIPTION, NO DIGITISATION: every digit was read off 400 dpi
  renders of scans without a text layer. Three N_Nu' cells of Table 1 (runs 12-14)
  are covered by an ink blot and left empty; Table 4 run 11's degraded digit is
  settled by the table's own ratio identity, not by the glyph.

  NOTHING HERE TESTS THE 0.60 OR THE EXPONENTS: the 0.60 was fitted to the very
  tables compared with, every heat-transfer run is in air so the 1/3 cannot be
  identified, and the paper's own graphical test of it (Figure 12) is not
  digitised. Figures 5, 13 and 14 are not used, so the free-convection form of
  eqs. (10) and (11) is never exercised.

  THE DIFFUSIVITY: the page measures the size of the water deficit and the factor
  on D_v that would close it, 1.155 <!-- claim: dv_factor_from_intercept -->, not
  its cause, and does not say which of the authors' two diffusivity statements is
  right.

  CITATION: Part I's folios are 141-146, the scan frames carrying a second folio
  line two lower; the alternative reading 139-144 takes the upper line as a running
  head. Pre-DOI, no DOI exists.
