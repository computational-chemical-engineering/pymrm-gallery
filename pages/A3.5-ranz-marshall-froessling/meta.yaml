adds: >
  NOT THE CORRELATION. Eqs. (21) and (22) are algebra and need no solver, and the
  page says so rather than dressing an evaluation up as a simulation. Four things
  are added, and the two most important of them need no solver at all.

  (1) THE 2.0 BECOMES A COMPUTATION INSTEAD OF A CITATION. Part I asserts eq. (7);
  pymrm solves the spherical BVP it comes from, refined in grid and extrapolated in
  domain, and gets 2.000000904, which sits 4.52e-07 relative from the exact answer
  that adaptive quadrature of the resistance integral supplies. That is not
  decorative: the same solve says a finite far field of ten drop radii shifts the "2"
  by 11.1 %, which is the correction anyone applying Ranz-Marshall inside a dense
  spray needs and which the correlation cannot express. (Packed beds are A3.4,
  Wakao-Funazkri; this page does not go there.)

  (2) A NUMBER ON THE RADIAL-CONVECTION FACTOR RANZ SAID THE PAPERS UNDERPLAYED.
  Adding construct_convflux_upwind to the same spherical solve turns "which average
  is p_f?" - a real ambiguity in Part II's own notation - into a settled question:
  the logarithmic mean, and the arithmetic mean is 0.41 % out at y = 0.20. The
  correction itself is quantified where the papers only gesture at it: +1 % on Sh at
  a surface mole fraction of 1.97 %, +10 % at 17.61 %, both root-found.

  (3) A CONVENTION THE PAPERS DO NOT STATE FOR THE TABLES, RECOVERED FROM THOSE
  TABLES AND THEN CORROBORATED TWICE. The Reynolds column is over-determined by the
  columns printed beside it, and asking it at what temperature the air properties
  were evaluated returns w = 0.4996 - the film temperature - with the fitted
  temperature exponent landing on kinetic theory's -1.7 and Table 1's residual
  collapsing to 0.126 %. Two independent corroborations follow. Part II states a
  reference temperature once, for the still-air run ("an average temperature of
  290 deg K."), and that row's printed air and drop temperatures average to 290.15 K.
  And Table 3, which prints no Reynolds column and so cannot enter the fit,
  reproduces its printed abscissa to 0.823 % at the recovered w against 1.769 % at
  the free stream, at 330-410 K against the 281-329 K the law was fitted on. That is
  also a reuse instruction: evaluating N_Re at the free stream instead moves it by up
  to 15.5 % on the paper's own rows and the predicted N_Nu by up to 5.4 %, worst
  exactly where drying calculations live.

  (4) THE FIT/TEST SPLIT, AND THE ARITHMETIC THE AUTHORS DID NOT DO. Separating the
  theoretical 2.0 from the fitted 0.60 and the assumed exponents, and extrapolating
  three sets of runs to N_Re = 0, turns "the correlation fits the data to a few per
  cent" into "the heat and the benzene sets land together at about +3 % and the water
  mass-transfer set misses by 13.4 %". The authors state the direction - "Data for
  mass transfer show a steeper slope and a lower intercept" - and name the cause -
  "(1) inaccurate values of diffusivity". The page does not claim otherwise. What is
  new is the SIZE, per species, against the authors' own replicate scatter, and the
  tension it creates with the two conclusions they did draw: the abstract's
  "verified the simple expression for the Nusselt number at zero Reynolds number",
  and folio 174's implication that their D_v "may be more accurate than any reported
  in the literature".

agreement: >
  IN-SAMPLE (the 0.60 was fitted to these tables, and every one of these numbers is
  labelled a goodness of fit on the page): eq. (24) against Table 1's 18 corrected
  Nusselt numbers, 1.72 % rms and 3.65 % worst, against a best null of 39.81 %;
  Table 1's own coefficient taken back through the paper's Prandtl number, 0.6020
  against the printed 0.60 (+0.34 %, which is the SAME statement as eq. (24)'s 0.54
  against the same 18 rows and is reported once); the released Reynolds exponent
  0.4933 against Froessling's assumed 0.5.

  THE TESTABLE CONSTANT: free two-parameter extrapolations to N_Re = 0 give 2.0582
  (heat, water, +2.91 %), 2.0523 (mass, benzene, +2.61 %) and 1.7322 (mass, water,
  -13.39 %) against the theoretical 2.0, with a measured run-to-run repeatability of
  0.68 % mean and 1.87 % worst. The paper's own still-air pair, 2.23 and 1.79, has a
  ratio of 1.2458 where eqs. (21) and (22) demand exactly 1.

  OUT OF RANGE: Table 3 (85-221 C) sits 11.05 % rms and 19.11 % worst from eq. (21)
  on the paper's own printed abscissa, a factor 6.4 on Table 1; predicted from a
  Table-1-only refit it is 11.19 %. Inside a single motion-picture run the measured
  N_Nu ratio differs from the predicted one by up to 21.9 %.

  OUT OF SAMPLE (the one thing on this page that is): Table 3 prints no Reynolds
  column, so its nine rows cannot enter the reference-temperature fit; predicted from
  the recovered law they reproduce their printed abscissa to 0.823 % rms against
  1.769 % at the free stream and 7.201 % at the drop surface, and Table 3 alone
  prefers w = 0.514 against the 0.4996 the other 36 rows give - at 330-410 K against
  the 281-329 K of the fit.

  INTERNAL: 36 printed Reynolds numbers on one rho/mu = C P T_ref^n law to 0.695 %
  rms and 2.46 % worst once the reference temperature is recovered (Table 1 alone
  0.126 % rms, 0.288 % worst), against 1.141 % at the free stream; nine isothermal,
  isobaric rows of Table 1 give Re/v to a 0.492 % spread against 0.578 % from their
  film-temperature variation alone and a 0.612 % peak-to-peak rounding bound;
  Table 4's rate-independent N_Nu'/N_Nu ratio agrees across runs 10-12 to 1.03 %;
  Table 3's two within-pair identities hold to 1.78 % and 1.82 %; Part I's test
  No. 80 recomputes to 4.2e-04 relative; the still-air row's film temperature is
  290.15 K against the 290 K Part II prints.

  CHECKED AGAINST THE EXACT ANSWER: the theoretical intercept, 2.000000904 from the
  refined and extrapolated pymrm finite-volume solve against the analytic 2 obtained
  by adaptive quadrature of the resistance integral, 4.52e-07 relative. The page
  states that the quadrature route is identically 2 and is therefore the exact
  answer, not a second independent estimate. The spherical Stefan solve agrees with
  its closed form to 9.6e-04 with observed grid order 0.92.

caveats: >
  TIER 3 THROUGHOUT, AND NO FIGURE IS TOUCHED. Every number on this page comes from
  a printed table or a displayed equation. Figures 5 (transport properties), 12 (the
  five-decade master correlation), 13 (free convection) and 14 (vapour pressure)
  carry content that exists only as curves; no maintainer figure review is available
  for this case, so nothing is digitised and no page image is reproduced anywhere.

  THERE IS NO HELD-OUT SET FOR THE CORRELATION IN EITHER PART AND THE PAGE CLAIMS
  NONE. Figures 6, 7 and 9 - the fit set for the 0.60 - are exactly Tables 1, 2, 3
  and 4. Where the page needs an out-of-range test it refits the coefficient on
  Table 1's room-temperature runs alone and applies it to Table 3, and says so. There
  IS a held-out set for the reference-temperature convention - Table 3 again, which
  prints no Reynolds column and so cannot enter that fit - and its scope is stated
  where it is used.

  THE PRANDTL EXPONENT CANNOT BE IDENTIFIED FROM THE TRANSCRIBED TABLES, BUT PART II
  DOES TEST IT. Every heat-transfer run in Tables 1, 2 and 3 is in air, so
  N_Pr^(1/3) is a constant absorbed into the 0.60 and cannot be identified here. It
  is NOT untested in the papers: Figure 12's legend lists, under HEAT TRANSFER DATA,
  "STEEL TO OIL (17)" and "STEEL TO WATER (17)" alongside "AIR TO WATER (PRESENT
  WORK)" - Kramers's spheres in oil and in water, plotted on the
  N_Pr^(1/3) N_Re^(1/2) abscissa - and folio 174 concludes that "the over-all success
  of this correlation gives credence to the values of the exponents on N_Pr, N_Sc,
  and N_Re". That test is graphical and lives in a figure this page deliberately does
  not digitise, so the page neither reproduces nor contradicts it, and the Reuse
  section says exactly that instead of calling the exponent unverified. The SCHMIDT
  exponent is touched only by benzene, the single second species, and one species
  pair cannot separate a coefficient from an exponent: the Schmidt-number ratio of
  2.818 that the two fitted slopes imply is a CONSEQUENCE of assuming the 1/3, not a
  test of it, and closing it would need the two diffusivities, which appear only in
  Figure 5.

  THE FREE-CONVECTION EXPONENT 1/4 (eqs. 10 and 11, Fig. 13) IS NEVER EXERCISED. The
  only zero-Reynolds datum in any table is the single still-air row, and the
  free-convection data live in Figure 13. Anyone citing that form from this page is
  citing something this page did not test.

  THREE N_Nu' CELLS ARE MISSING, NOT GUESSED. An ink blot on the microfilm covers the
  mass-transfer entries of Table 1 runs 12, 13 and 14; they are left empty and the
  mass fits use the 15 rows that remain. None can be read to the three significant
  figures the column prints: run 12 retains a leading "3." with both remaining digits
  drowned, run 13 a leading "2", and run 14 nothing clean. The break table shows that
  filling all three in by eye moves the water intercept from 1.7322 to 1.8576, which
  would weaken but not remove the finding; every physically consistent set of fills
  stays well below 2.0. No specific value is asserted for any of the three - an
  earlier draft named 3.32 and 2.96, and 2.96 is impossible because it would put
  N_Nu' above the corrected N_Nu, which happens on no legible row of this table.

  ONE DIGIT IS SETTLED BY THE TABLE'S OWN ARITHMETIC, NOT BY THE GLYPH. Table 4 run
  11's N_Nu' final glyph is degraded and does not decide the question: its surviving
  counter is 3 px across at 0.55 of the glyph height, between this font's 6 and 0
  clusters, and the adjacent unambiguous 0 of the same "10." is over-inked almost as
  badly. An earlier draft of this page read it 10.6 on that counter alone and was
  wrong. What decides it is that both of Table 4's transfer numbers come from the
  SAME measured evaporation rate, so their ratio depends only on the printed air
  temperature, drop temperature and pressure - and runs 10, 11 and 12 are printed
  within 0.2 K at one pressure. Runs 10 and 12 give 1.2535 and 1.2529; propagating
  the printed rounding their brackets intersect in [1.2400, 1.2659], putting run 11's
  N_Nu' in [9.73, 10.06]. A printed 10.6 needs 1.3418, 6.0 % outside a 1 % rounding
  budget. The first two glyphs read "10." and the last is 17 px wide, the width of
  this column's round digits (16-18) and not of its 1s (10-12). The value is 10.0.
  The drift the wrong reading caused was 1.5 % - UNDER CI's 5 % tolerance - which is
  why the three-row ratio spread is now a reported metric (1.03 % as read, 6.93 % if
  10.6 is used) with its own break row.

  APPARENT AND CORRECTED NUSSELT NUMBERS ARE NEVER MIXED. Table 4 has no corrected
  column at all - for benzene the sensible-heat term is about 20 % of the heat flow
  and the authors did not attempt one - so the benzene intercept is an APPARENT-N_Nu'
  extrapolation while Table 1's heat intercept is a corrected one. The comparison
  between them is between two mass-transfer numbers, which are on the same footing.

  THE p_f IDENTIFICATION IS AN INFERENCE AND IS LABELLED ONE. Ranz's 1993 commentary
  names a "D_f factor"; no D_f appears in the notation of either part. The page takes
  p_f - "average value of (pi - p_A) across the transfer path" - as the object meant,
  because it is the only one in the papers that accounts for radial convection at
  the boundary. Everything that follows from that identification is presented as
  following from it.

  PART I'S PAGE RANGE IS RECORDED BOTH WAYS AND THE PAGE SAYS WHICH IT READ. Part I's
  scan frames carry two folio lines differing by exactly two, legibly on FOUR of the
  six frames (139/141, 140/142, 141/143, 144/146); on the fourth frame the upper line
  is cut off at the leaf edge and on the fifth there is none, so those two pairs are
  inferred from the sequence rather than read, and the page says so. Part II's first page has a blank top margin and prints its folio at
  the FOOT of the text block, so in this issue the folio is a footer and the upper
  line on a Part I frame is the preceding leaf's footer caught in the same frame.
  Read that way Part I is 141-146, which is the universal citation and Ranz's own in
  1993. All folios cited on this page are the ones printed at the foot of the page
  the value appears on. Part II is 173-180 either way.

  THE STATED REYNOLDS RANGE IS 0 TO 200 AND TABLE 4 REACHES 220. Part I's abstract
  claims "a Reynolds number range of 0 to 200" and the Reuse section quotes it as the
  range of validity, but Table 4's last benzene run is printed at N_Re = 220. The
  page notes the overshoot rather than smoothing it over.

  NEITHER FILE HAS A TEXT LAYER (pdftotext returns one byte per page), so nothing
  was read from one; the files are JPEG RGB at 400 x 400 ppi native and every numeric
  column was cropped and magnified at that resolution, with ambiguous glyphs compared
  against unambiguous instances of both candidate digits in the same column.

  THE REFERENCE TEMPERATURE IS AN INFERENCE, WITH A WIDTH - BUT NO LONGER AN
  UNCORROBORATED ONE. Neither part states at what temperature the air properties in
  the Reynolds COLUMNS were evaluated; w = 0.4996 is what minimises the residual of
  the Reynolds over-determination, and the band of w within 5 % of that minimum is
  0.178 wide, which is a width and not a confidence interval. So the finding is "the
  film temperature, not the free stream and not the drop surface", and it is NOT
  "exactly the arithmetic mean". The four rows of Table 2 with no measured drop
  temperature are excluded from it. Two independent corroborations are on the page:
  Part II's printed "average temperature of 290 deg K." for the still-air run against
  that row's film temperature of 290.15 K, and Table 3 held out. They matter, because
  leave-one-TABLE-out is not stable - dropping Table 1 or Table 4 sends w to about
  0.92 - so the identification rests on the Table 1 / Table 4 contrast rather than on
  36 rows equally.

  WHAT THE PAGE DOES NOT SETTLE. It cannot say whether the water mass-transfer
  deficit is entirely a diffusivity error: that would need an independent D_v for
  water vapour in air, and the only one in the papers is Figure 5. It cannot test the
  extrapolation "five times beyond the experimental range of Reynolds numbers" that
  PART I'S ABSTRACT claims (Part II folio 174 puts it as "remarkably accurate even
  when extrapolated five times beyond the experimental range in which they were
  determined"), because that claim rests on Figure 12. It says nothing about packed beds (A3.4) or
  about drops containing dissolved or suspended solids, which is the second half of
  Part II and needs Figure 14.
