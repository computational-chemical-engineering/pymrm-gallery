dataset_id: gallucci-2013-fig16-reads
title: "Figure reads: boundaries of the stacked relative pressure drop at four feed pressures (Fig. 16, reproduced from Peters et al. 2008)"
status: complete

source:
  authors: ["Gallucci, F.", "Fernandez, E.", "Corengia, P.", "van Sint Annaland, M."]
  year: 2013
  title: "Recent advances on membranes and membrane reactors for hydrogen production"
  container: "Chemical Engineering Science 92, 40-66"
  doi: "10.1016/j.ces.2013.01.008"
  access: >
    Publisher PDF held outside the repository, lawful access. No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (facts extracted; figure and table not reproduced)"

acquisition:
  method: digitised
  tool: "pixel script on the embedded image (684 x 435 px, 200 ppi RGB), extracted with pdfimages from PDF page 17"
  figure: "Fig. 16, p. 56"
  resolution: >
    200 ppi (native). Ordinate 0 % to 100 % by least squares on the six major tick centres
    (352.54 px per 100 %, residuals below 0.5 px). Each boundary is the darkness-weighted
    centroid of the outline between two coloured segments, averaged over the interior
    columns of the bar (spread between columns below 0.02 px).
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: >
    u = 0.005 per boundary (about 1.8 px), so 0.007 per share (two boundaries). The support
    share (pd_top to support_top, about 1 %) is near one line width and is not used in any
    verdict.

conditions: >
  Feed pressures 10, 15, 20, 26 bar. Categories as in the legend: depletion, concentration
  polarisation, Pd membrane, membrane support; their definitions (which bulk average) are not
  printed. The source is a permeation cell with sweep gas (Caravella et al. 2009, p. 622),
  not a catalyst bed.

columns:
  - {name: P_feed_bar, unit: bar, description: "feed pressure (axis label)"}
  - {name: depletion_top, unit: "-", description: "top of the depletion segment, fraction of the total drop (read)"}
  - {name: cp_top, unit: "-", description: "top of the concentration-polarisation segment (read)"}
  - {name: pd_top, unit: "-", description: "top of the Pd-membrane segment (read)"}
  - {name: support_top, unit: "-", description: "top of the support segment (read; 100 % by construction)"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure, table or page image is reproduced.
