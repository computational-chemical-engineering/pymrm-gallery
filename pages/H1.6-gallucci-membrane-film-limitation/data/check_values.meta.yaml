dataset_id: check-values
title: "Independent check values for the page's functions at one test condition"
status: complete

source:
  authors: ["Gallucci, F.", "Fernandez, E.", "Corengia, P.", "van Sint Annaland, M."]
  year: 2013
  container: "Chemical Engineering Science 92, 40-66"
  doi: "10.1016/j.ces.2013.01.008"
  access: >
    The review prints no model equation. The equations are the page's resistances-in-series model
    (Sieverts membrane behind a bed-to-wall film, the module balances, the figure conversions) as
    stated in the build plan's equations file, built to test the review's statements on p. 55 to 57.
    The values are not read from the review but computed from those equations by a second route.
  licence: "computed values (no text, figure or page image reproduced)"

acquisition:
  method: computed by a second route, not by the page
  resolution: "12 significant digits (rounding up to 5e-12 relative); each row's rtol (1e-11 or looser) is the agreement the page must reach"
  operator: "Claude Opus 5.5 (assisted): plan agent's script h16_check_values.py (numpy and scipy, no pymrm, no page code; closed forms cross-checked against quadrature, Gauss-Legendre, brentq, an RK4 march and Richardson differences, as listed in the equations file), 2026-11-28"
  date: 2026-11-28
  estimated_error: "none beyond floating point for the closed-form rows; looser rows carry the route's own error (root finding, quadrature, finite differences)"

conditions: >
  Test condition TC: feed H2 mole fraction 0.575 at 26 bar (review p. 46), permeate pure H2 at
  1 bar (page assumption), theta = 1/14.95; beta = 1; module membrane number N = 2; target
  recovery 0.8. Figure-conversion rows use test inputs, not figure readings: Fig. 16 shares
  c = 0.80, m = 0.12, sigma = 0.01, interface ratio s = 0.5; Fig. 15 last-cell depletion 0.30;
  p. 57 effectiveness factors 0.90 and 0.98.

columns:
  - {name: name, unit: "-", description: "quantity; dimensionless as defined in the equations file"}
  - {name: value, unit: "-", description: "value computed by the second route"}
  - {name: rtol, unit: "-", description: "relative tolerance the page must meet"}
