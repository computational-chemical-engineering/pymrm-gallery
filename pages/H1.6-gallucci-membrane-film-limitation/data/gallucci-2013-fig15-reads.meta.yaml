dataset_id: gallucci-2013-fig15-reads
title: "Figure reads: relative H2 weight fraction against r/R at z/L = 0.10, three permeabilities (Fig. 15, reproduced from Tiemersma et al. 2006)"
status: complete

source:
  authors: ["Gallucci, F.", "Fernandez, E.", "Corengia, P.", "van Sint Annaland, M."]
  year: 2013
  title: "Recent advances on membranes and membrane reactors for hydrogen production"
  container: "Chemical Engineering Science 92, 40-66"
  doi: "10.1016/j.ces.2013.01.008"
  access: >
    Publisher PDF held outside the repository, lawful access. No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (facts extracted; figure and table not reproduced)"

acquisition:
  method: digitised
  tool: "pixel script on the embedded image (684 x 507 px, 200 ppi greyscale), extracted with pdfimages from PDF page 16"
  figure: "Fig. 15, p. 55"
  resolution: >
    200 ppi (native). Calibration by least squares on the major tick centres (dark-weighted
    centroids): ordinate 0.0 to 1.0 at 390.22 px per unit, abscissa 0.0 to 1.0 at 489.06 px
    per unit, tick residuals below 0.5 px. Markers sit at r/R = (i - 1/2)/12, i = 1..12 (the
    square centres fall on these columns). Open squares (quadrupled) are drawn on top: centre
    = bottom edge centroid at the marker column less half the square (3.97 px, from the
    isolated squares). Left triangles (experimental flux expression): midpoint of the top and
    bottom edges at the marker column (cells 8 to 12), or of the vertical edge's two ends where
    the edges merge with a neighbour (cells 5 and 7). Up triangles (doubled): midpoint of apex
    and base (cells 8 to 12) or base less 3.17 px (cells 5 to 7, the apex merged). The
    triangle centre is taken as the centre of its bounding box; the centroid would sit about
    1 px lower (0.003).
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: >
    u = 0.005 per point (about 2 px). Cells 1 to 4 of the experimental and doubled curves are
    hidden behind, or merged with, the square markers and are not read. Cell 1 of the
    quadrupled curve reads 1.0000 (calibration check: every curve equals 1 there).

conditions: >
  Tiemersma et al. (2006) packed-bed membrane reactor model as reproduced in the review:
  axial position z/L = 0.10; "experimental flux expression", "doubled permeability",
  "quadrupled permeability". The ordinate is a weight-fraction ratio, not a partial-pressure
  ratio; bulk composition, bulk H2 pressure and permeate pressure are not printed.

columns:
  - {name: curve, unit: "-", description: "experimental, doubled or quadrupled (legend of Fig. 15)"}
  - {name: cell, unit: "-", description: "marker index i, 1 at the axis"}
  - {name: r_over_R, unit: "-", description: "radial position (i - 1/2)/12 of the marker"}
  - {name: rel_H2_wt_fraction, unit: "-", description: "relative H2 weight fraction (figure read)"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure, table or page image is reproduced.
