data:
  tier: 2
  method: >
    Two transcriptions, no digitising. (1) The seven c_S-versus-time pairs
    printed in Exercise 9.15 of Rawlings & Ekerdt, "Chemical Reactor Analysis
    and Design Fundamentals", 2nd edn (2025 printing), the page's only empirical
    input. (2) Eqs. (1.5.1-1) to (1.5.1-15) of Froment section 1.5.1 plus the
    prose claims the page tests or reports, quoted verbatim; the competitive
    inhibition equations that follow are out of scope.
  status: complete
  provenance_of_the_measurements: UNSTATED_BY_THE_SOURCE
  provenance_note: >
    Exercise 9.15 introduces its table with one sentence, "The following
    measurements of cS versus time were taken in your laboratory.", and gives no
    citation, enzyme, loading, temperature, pH or solvent. The tier describes
    the acquisition route, not a claim that these are measurements. The table is
    not an exactly-rounded evaluation of the model it is set to fit (maximum
    residual 13.87 <!-- claim: mm_fit_maxres_over_print_resolution --> times the
    5e-4 cmol/L print resolution), and K_M sits within
    0.61 % <!-- claim: mm_fit_KM_rel_dev_from_half --> of 0.5 cmol/L, with K
    pinned at 2 L/cmol costing 0.108 % <!-- claim: mm_fit_sse_penalty_K_pinned_at_2 -->
    in sum of squares. Nothing the page concludes depends on the table.

fit_or_test: >
  Both kinds, kept apart. FITTED: r_m = 0.162583 <!-- claim: mm_fit_rm_cmol_per_L_min -->
  cmol/(L min) and K_M = 0.503055 <!-- claim: mm_fit_KM_cmol_per_L --> cmol/L
  (Exercise 9.15's k = 0.323192 <!-- claim: mm_fit_k_per_min --> 1/min and
  K = 1.987853 <!-- claim: mm_fit_K_L_per_cmol --> L/cmol) on the same seven
  points the agreement is reported against, so that agreement is a goodness of
  fit. Three best-fitted one-parameter nulls: zero order
  5.34e-2 <!-- claim: null_zero_order_rms_cmol_per_L --> (13.29 <!-- claim: null_zero_order_rms_ratio -->
  times), first order 3.90e-2 <!-- claim: null_first_order_rms_cmol_per_L -->
  (9.71 <!-- claim: null_first_order_rms_ratio --> times), second order
  1.05e-1 <!-- claim: null_second_order_rms_cmol_per_L --> (26.04 <!-- claim: null_second_order_rms_ratio -->
  times) against the fit's 4.02e-3 <!-- claim: mm_fit_rms_cmol_per_L --> RMS.
  That ratio is a claim about saturation, not about a mechanism. STRUCTURAL:
  the symbolic identities closing eqs. (1.5.1-2) to (1.5.1-15), the symbolic
  proof that the steady-state rate law does not contain rho, and the exact
  linearity of 1/r in 1/C_A. COMPUTED PROPERTIES OF THE PRINTED MODEL:
  everything else. The misfit of a wrong-rho model to right-rho data comes from
  an optimiser, an upper bound on a minimum, so "cannot be separated" is the
  safe direction; one least-squares start instead of two moves the compensated
  eps* by below 1e-5 <!-- claim: eps_star_single_start_rel_move --> relative.

validation:
  - "THE DEGENERACY IS ALGEBRAIC. Substituting k_2 = r_m/C_E0, k_-1 = k_2/rho, k_1 = (k_-1+k_2)/K_M into eq. (1.5.1-13) returns eq. (1.5.1-15) identically and d r/d rho = 0 in sympy. The numerical sweep checks the code: with r_m and K_M fixed the rate law from the elementary constants agrees to below 1e-14 <!-- claim: rate_law_rho_degeneracy_max_rel --> on the nine swept rho and to below 1e-14 <!-- claim: rate_law_rho_degeneracy_random_draws_max_rel --> over random (rho, C_E0) draws, while K_M(Briggs-Haldane)/K_M(Michaelis-Menten) = 1 + rho reaches 1e4 at the top of the sweep."
  - "A batch transient sees rho: the maximum spread of C_A(t) across eight decades of rho is 0.9773 <!-- claim: rho_spread_induction_over_eps --> eps, at t = 2.011e-7 <!-- claim: rho_spread_induction_peak_min --> min inside the induction layer, whose time scale runs from 2.09e-8 <!-- claim: induction_time_rho_lo_min --> to 2.09e-4 <!-- claim: induction_time_rho_hi_min --> min. A uniform 181-point scan reads that maximum 66.3 % <!-- claim: sampled_max_shortfall_uniform_scan --> low; the page locates it as a root of the analytic time derivative. Over t >= 3 min only 0.242 <!-- claim: rho_spread_over_eps_trace_limit --> eps survives; against the 5e-4 cmol/L print resolution that needs eps = 2.069e-3 <!-- claim: eps_star_rho_visible_at_print_resolution -->, and with r_m, K_M and C_E0 free eps = 5.798e-2 <!-- claim: eps_star_discrimination_with_compensation -->, where the quasi-steady-state approximation is itself off by 0.04443 <!-- claim: qssa_error_at_discrimination_eps_cmol_per_L --> cmol/L, 88.9 <!-- claim: qssa_error_at_discrimination_eps_over_resolution --> times the resolution (38.8 <!-- claim: qssa_error_at_discrimination_eps_total_over_resolution --> times against the total substrate)."
  - "THE PRICE OF COMPENSATION, LIKE FOR LIKE. The same RMS on the same 25-point grid with nothing free gives eps = 3.185e-3 <!-- claim: eps_star_rms_25pt_grid_no_compensation -->, so of the raw ratio 28.0 <!-- claim: eps_star_raw_ratio_unlike_statistics --> a factor 1.539 <!-- claim: eps_star_statistic_and_window_factor --> is the change of statistic and window and 18.20 <!-- claim: eps_star_compensation_penalty --> is compensation. eps* is a property of its conventions: the resolution doubled gives 8.757e-2 <!-- claim: eps_star_comp_res_doubled -->, a 13-point grid 6.954e-2 <!-- claim: eps_star_comp_grid13 -->, and the like-for-like eps* with the rho pair narrowed to [0.5, 2] is 9.622e-3 <!-- claim: eps_star_rms_rho_narrow -->."
  - "On the seven points: pinning rho anywhere in [1e-4, 1e4] and re-optimising r_m, K_M and C_E0 changes the achievable sum of squares by 8.6 % <!-- claim: rho_profile_sse_span_fraction -->, monotonically, and the four-parameter model gives F = 1.9009 <!-- claim: full_model_F_statistic --> against F(2, 3) = 9.5521 <!-- claim: full_model_F_crit_95 --> at 95 %, so the two elementary-step parameters are not justified."
  - "eps = C_E0/(c_A0 + K_M) is derived, not taken: at fixed C_E0/c_A0 with K_M swept over three decades, C_E0/c_A0 mispredicts the quasi-steady-state error by a factor 95.0 <!-- claim: qssa_group_spread_CE0_over_cA0 --> while eps holds it inside 1.91 <!-- claim: qssa_group_spread_CE0_over_cA0_plus_KM -->; the coefficient is 0.9541 <!-- claim: qssa_error_over_eps_KM_0p05 --> at K_M = 0.05 cmol/L, Froment's substrate-only corner. The error is first order in eps (mean observed order 0.9988 <!-- claim: qssa_error_order_in_eps --> over three decades)."
  - "Conservation in the pymrm mass-action marcher, which integrates all four fields independently: both balances below 1e-13 <!-- claim: pymrm_substrate_balance_max --> cmol/L, and doubling the product row breaks the substrate one."
  - "Time-step refinement: backward Euler first order, the observed order farthest from 1 over successive differences 0.996 <!-- claim: pymrm_be_time_order -->, Richardson extrapolation against Radau 4.19e-7 <!-- claim: pymrm_richardson_vs_radau --> cmol/L, and LSODA, the sweep solver, against Radau below 1e-9 <!-- claim: lsoda_vs_radau_reference --> cmol/L."
  - "Two second routes. The fit through the pymrm backward-Euler marcher with Richardson extrapolation instead of the Lambert W closed form: k and K agree to below 1e-5 <!-- claim: fit_second_route_k_rel_diff --> and below 1e-6 <!-- claim: fit_second_route_K_rel_diff --> relative. rho* from the analytic sensitivity ds/dK_M = s ln(s_0/s)/(s+K_M), its maximum root-found at s = 0.228461 <!-- claim: dsdKM_peak_s_cmol_per_L --> cmol/L, gives 2.1934e-3 <!-- claim: rho_star_equilibrium_analytic --> against the nonlinear root-find's 2.1951e-3 <!-- claim: rho_star_equilibrium_route -->, 0.080 % <!-- claim: rho_star_equilibrium_two_route_rel_diff --> apart, with no ODE solver in the second route."
  - "A defect-injection table: every non-structural claim fails at least one row, each row injecting its defect through an argument of the study that computes the claim; the structural claims are named identities, a float spread under an identity, a definitional ratio and a linear invariant of the source."

caveats:
  - "Neither origin was consulted. Everything the page says about Michaelis & Menten (1913) and Briggs & Haldane (1925) is bounded by the clauses the book prints."
  - "The page does not validate 'the Michaelis-Menten mechanism'. What the data support is that a two-parameter saturating law describes one seven-point batch run better than the best first-order alternative, which every mechanism in the page's two-parameter family does equally well."
  - "Printed defect 1, reported not repaired (p. 24, verbatim): 'At high reactant concentration (CA much larger than KM), the rate levels off and becomes zero order with respect to the reactant, rA = k1CE0.' [sic] The limit of the book's eq. (1.5.1-8) is k_2 C_E0, its eq. (1.5.1-15) calls r_m = k_2 C_E0 'the maximum possible rate', its Problem 2.4(b) asks for that limit, and k_1 C_E0 has units of 1/s."
  - "Printed defect 2, reported not repaired (p. 25, verbatim): 'One example is the Lineweaver-Burke plot of 1/r versus CA.' [sic] 1/r is exactly affine in 1/C_A (below 1e-13 <!-- claim: lineweaver_correct_axes_nonlinearity --> of its range off a line) and strictly convex in C_A. No straight line comes closer than 31.72 % <!-- claim: lineweaver_printed_axes_nonlinearity_minimax --> of the curve's range over 0.05 to 1.0 cmol/L (the Chebyshev floor, closed form, equioscillation checked); the best least-squares line is 50.32 % <!-- claim: lineweaver_printed_axes_nonlinearity --> away under logarithmic weighting and 66.88 % <!-- claim: lineweaver_printed_axes_nonlinearity_uniform_measure --> under uniform weighting. Levenspiel p. 615 prints the reciprocal axes and no surname."
  - "Extracting eq. (1.5.1-17) from the text layer drops its leading term; the render shows the printed equation is correct. A clean text layer is still not a page."
  - "The source section prints no numbers. The empirical half comes from a different book with unstated provenance, and C_E0 is not printed in Exercise 9.15, so eps cannot be evaluated for that run; every eps on the page belongs to a designed experiment."
  - "rho* is the rho at which route 1, given the true elementary constants, mispredicts C_A(t) by the 5e-4 cmol/L resolution at this substrate loading; a break row that measures the error on C_A + C_A-E instead of free C_A moves it."
  - "The F test's nesting is non-regular: the null sits on the boundary C_E0 = 0 and rho is unidentified under it, so F(2, 3) approximates the null distribution. A boundary null makes the true null distribution stochastically no larger, so 'not justified' holds a fortiori."
  - "Scope: competitive inhibition (eqs. 1.5.1-16 to 1.5.1-18) and section 1.5.2 are out; product formation is irreversible as eq. (1.5.1-1) prints it."
  - "What pymrm adds here is small: a well-mixed batch of four species is 0-D and solve_ivp integrates it as the reference. pymrm gives a Jacobian assembled as elsewhere in the gallery, so the rate law transplants unchanged into J4.7 or B1.1, the NumJac((1, n_c)) pointwise block, newton with its convergence checked at every step, and the root finding and order checks of pymrm.checks."

agreement: >
  Three kinds, kept apart. STRUCTURE: the symbolic identities close eqs.
  (1.5.1-2) to (1.5.1-15) and the steady-state rate law is proved independent
  of k_2/k_-1 in sympy. FIT: r_m = 0.162583 <!-- claim: mm_fit_rm_cmol_per_L_min -->
  cmol/(L min), K_M = 0.503055 <!-- claim: mm_fit_KM_cmol_per_L --> cmol/L at
  4.02e-3 <!-- claim: mm_fit_rms_cmol_per_L --> RMS on the seven points they
  were fitted to, against 3.90e-2 <!-- claim: null_first_order_rms_cmol_per_L -->
  for the best first-order null; the two elementary-step parameters give
  F = 1.90 <!-- claim: full_model_F_statistic --> against
  F_crit,95 = 9.55 <!-- claim: full_model_F_crit_95 -->. NUMERICS: backward
  Euler first order, Richardson against Radau 4.19e-7 <!-- claim: pymrm_richardson_vs_radau -->,
  both balances below 1e-13 <!-- claim: pymrm_substrate_balance_max -->, the fit
  reproduced by a second forward model to below 1e-5 <!-- claim: fit_second_route_k_rel_diff -->,
  and rho* reproduced through an analytic sensitivity to
  0.080 % <!-- claim: rho_star_equilibrium_two_route_rel_diff -->. Two printed
  defects settled from the book's own equations and reported without repair.

