dataset_id: froment-1.5.1-printed
title: "Froment, De Wilde & Bischoff (2011) section 1.5.1: the first fifteen of its eighteen numbered equations, and the prose claims this page tests"
source:
  authors: ["Froment, G. F.", "De Wilde, J.", "Bischoff, K. B."]
  year: 2011
  container: "Chemical Reactor Analysis and Design, 3rd edition, John Wiley & Sons, section 1.5.1 'Enzymatic Kinetics', book pp. 23-26"
  doi: null
  isbn: "978-0-470-56541-4"
  access: "copy on the reading machine, BOOK-FromentDeWildeBischoff-2011-chemical-reactor-analysis-and-design-3ed.pdf"
  licence: "all rights reserved (equations and short verbatim quotations for verification and criticism; no page image reproduced)"
acquisition:
  method: table
  figure: >
    born-digital PDF with embedded TrueType subsets; equations and equation
    numbers survive text extraction. Every row here was extracted from the text
    layer AND checked against a 300 ppi render of its own page, cropped to the
    line. Two lines were read at digit scale specifically because the page's
    conclusions rest on them: p. 24's "rA = k1CE0" (the subscript is a 1, not a
    2, and there is no minus sign) and p. 25's "1/r versus CA" (it is C_A, not
    1/C_A). The only raster image in the whole file is the 200 ppi cover JPEG.
  operator: builder agent (J4.6)
  date: 2026-08-13
  estimated_error: >
    Quotes are verbatim, including the book's own hyphenation and the spelling
    "Lineweaver-Burke". Subscripts are written inline (k_-1, C_E^0, C_A-E)
    because CSV has no typography; the mapping is one-to-one and is stated in
    the page's "The published model" section.
