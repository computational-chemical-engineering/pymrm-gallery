  - {name: key, unit: "-", description: "stable key used by the page and by the prose-number assertion cell"}
  - {name: page, unit: "-", description: "book page number (not PDF page; PDF = book + 42 in this file)"}
  - {name: kind, unit: "-", description: "equation | quote"}
  - {name: as_printed, unit: "-", description: "the book's own expression or words, verbatim, defects included"}
  - {name: note, unit: "-", description: "what the page does with it; printed defects are flagged here and are NOT repaired in the as_printed column"}
notes:
  the_origins_were_not_consulted: >
    NEITHER ORIGIN IS ON DISK AND NEITHER WAS READ: Michaelis, L. & Menten,
    M. L., Biochemische Zeitschrift 49, 333-369 (1913), and Briggs, G. E. &
    Haldane, J. B. S., Biochemical Journal 19, 338-339 (1925). Everything this
    page says about them comes from this book and is limited to what this book
    prints, which is two clauses: p. 24 names eq. (1.5.1-8) "the
    Michaelis-Menten equation" and K_M = k_-1/k_1 "the Michaelis-Menten
    constant"; p. 24 introduces the second route as "formulated by Briggs and
    Haldane". No sentence of the form "Michaelis and Menten showed/assumed/
    argued" appears on the page, because no such sentence appears in the book.
  the_book_prints_no_citation_for_either: >
    A CHECKED NEGATIVE CLAIM, and here is the search. (1) A full-text search of
    the book's own (clean, born-digital) text layer, all 902 PDF pages, case
    insensitive, for michaelis|menten|briggs|haldane returns FOURTEEN lines -
    the same fourteen in all three pdftotext modes (default, -layout, -raw):
    FIVE in sections 1.5.1-1.5.2 (PDF 66 x3, PDF 67, PDF 69), THREE in Problem
    2.4 (book p. 144, PDF 186), THREE in later running text and problem sets
    (PDF 436, 494, 503 - book pp. 394, 452, 461, the last of these citing
    "Bischoff [1966]", not the origins), and THREE in the Subject Index
    (PDF 899). None is a bibliographic entry. The index's fourth
    enzyme-related entry, "Lineweaver-Burke plot, 25", contains none of the
    four search terms and is not counted in the fourteen. (2) The
    Chapter 1 REFERENCES list (book pp. 58-59, PDF 100-101) was read in full at
    the alphabetical positions where the entries would fall: between "Boudart"
    and "Caddell" for Briggs, and between "Mc Laughlin" and "McQuarrie"/"Monod"
    for Michaelis. Neither is there - although Graef & Andrews [1973], Monod
    [1949] and Williams [1967], the other named results of section 1.5, all are.
    (3) The Subject Index (book p. 857, PDF 899) lists "Michaelis-Menten
    constant, 24", "Michaelis-Menten equation, 24", "Michaelis-Menten kinetics,
    27, 461" and "Lineweaver-Burke plot, 25" - page numbers only, which is what
    a subject index is. So the two results this case is named for are the only
    named results in section 1.5 that the book attributes without citing.
  the_second_book_is_used_for_one_thing: >
    Levenspiel, "Chemical Reaction Engineering", 3rd edn (Wiley, 1999), p. 615,
    prints "1/(-r_A) versus 1/C_A ... the Lineweaver plot" - read on a 600 ppi
    native render, this file's own resolution. HE PRINTS NO SURNAME: the string
    "Burk" occurs nowhere in that 684-page file (case-insensitive search in all
    three pdftotext modes; "Lineweaver" occurs twice, on p. 615 and in the
    index), so the two books do not differ over a trailing -e. Froment prints
    "Lineweaver-Burke"; Levenspiel prints "the Lineweaver plot". It is cited on the page ONLY as
    independent corroboration of the axes in the p25_lineweaver defect row, and
    for its own printed claim that fitting C_A versus tau directly "is direct,
    is less prone to fiddling, and is more reliable" than the reciprocal plots,
    which the page measures. It is NOT a second canonical source and no
    derivation is adjudicated between the two books.
redistribution_basis: >
  Equations and facts are not protected (Feist, 1991); the prose rows are short
  verbatim quotations for verification and criticism (Art. 15a Auteurswet /
  quotation right). No page image is reproduced anywhere in this repository.
