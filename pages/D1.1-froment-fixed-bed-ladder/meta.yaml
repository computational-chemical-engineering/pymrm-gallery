honesty:
  what_pymrm_adds: >
    Not accuracy. Every rung is a system Froment solved with a Crank-Nicolson code
    in the 1960s, and section 11.7.4 says outright that present-day computers
    remove any reason not to use the two-dimensional model. What pymrm adds is
    that the five models are five ARGUMENTS to one assembly rather than five
    programs - rung 2 adds a grad/div pair on the same axis, rung 5 a second pair
    on a second axis with nu = 1, rungs 3 and 4 two algebraic fields masked out of
    the divergence by a coefficient matrix - so a difference between two rungs is a
    difference between two models and not between two codebases. That is what makes
    the comparison possible at all. Also: eta is read from the surface-flux row of
    the gradient operator, the same quantity the film balance uses, so eq.
    (11.9.1-11) is checked against the equation it solves.
  is_this_a_fit: >
    NO. Nothing is fitted anywhere on this page. Every constant is either printed
    in Chapter 11, loaded from D2.2's or C2.10's CSV of a printed original, or - in
    the three cases the chapter does not print (lambda_ea, k_g/h_f, D_e) - varied
    over decades with the crossover root-found and the gap stated as a gap.
  caveats:
    - "Tier 6. No experimental comparison exists anywhere in Chapter 11."
    - "The rung-4 magnitude is not decidable from the chapter: D_e is not printed for this catalyst. Its SIGN and its crossover are established; its size is not."
    - "The rung-2 magnitude (+0.1665 % extrapolated; agreement.json's coarse-grid value is +0.1657 %) depends on lambda_ea, of which the chapter says 'little information is available'; Pe_ma and Pe_ha are varied together."
    - "The film coefficients come from A3.4's correlation, not from the chapter, and the root-found crossover is at 4.93x the correlated coefficients - so that rung's size depends on which correlation is chosen. (4.08x against the Richardson-extrapolated rung-1 baseline; the table now uses the same-grid baseline in every row and prints both readings. This file previously said ~2x, which no cell of the notebook prints, and then 4.1x, which was the mixed-baseline value.)"
    - "Rung 2's 1 % point is a ROOT: Pe_a* = 0.2488 +/- 0.0002, factor 4.02, located between two validated sweep points and itself carrying the control's certificate (414.98 C below, 415.02 C above). The +/- is the grid, measured same-grid on 600/900/1200 cells, not the refinement tolerance. Earlier versions published 0.0969, then a bound of 'at least 3.2 times', then 0.24883362; all three were shaped by a cold-started threshold search whose result near rung 2's threshold was decided by round-off (see validation.root_found_never_swept). The value is now 0.24883179."
    - "Rung 5's signed shift passes through zero between R_t = 0.0098 m (-0.169 %) and 0.00975 m (+0.015 %), so the two-dimensional correction is negative on this tube and positive on a narrower one. |shift| stays under 1 % from R_t* = 0.01003 m down to 0.0096 m (+0.572 %) and is past 1 % again, positive, by 0.0094 m (+1.327 %); at 0.0090 m it is +2.879 %. All of these thresholds pass the control. The earlier version reported 'speckle' here (0.0096875 m refused) and both control sides near 1060 C at 0.0090 m; both were the cold-started search."
    - "No stored output carries a machine path any more. The earlier version kept four (a pymrm MatrixRankWarning and a NumJac RuntimeWarning from Newton solves that failed in the cold-started search); the branch-following search no longer produces them."
    - "The magnitudes of all four shifts belong to section 11.5.2's pseudo-first-order simplification, which the notebook shows is k_1 alone used as the total o-xylene consumption rate. Only the ordering and the signs transfer."
