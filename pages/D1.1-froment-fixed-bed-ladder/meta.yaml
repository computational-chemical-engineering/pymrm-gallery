reference:
  authors: ["Froment, G. F.", "De Wilde, J.", "Bischoff, K. B."]
  year: 2011
  title: "Chemical Reactor Analysis and Design, 3rd edition"
  container: "John Wiley & Sons, ISBN 978-0-470-56541-4"
  doi: null
  note: >
    CANONICAL-CLASS (textbook) source, read directly: the book is on the
    maintainer's disk and every equation and number on this page was read from a
    300-450 ppi render of its own pages. Chapter 11 "Fixed Bed Catalytic
    Reactors", sections 11.5 (book p. 505), 11.6 (p. 548), 11.7 (p. 565), 11.8
    (p. 585) and 11.9 (p. 597), with Examples 11.5.1.A (p. 510), 11.5.3.A
    (p. 519) and section 11.8.2 (p. 590). NOT the "Froment & Bischoff" of the
    catalogue citation: this is the THIRD edition and De Wilde is a full author.
    The E1.1 test passes for all five rungs - the chapter states, derives and
    works each model on printed data, not merely mentions it.

