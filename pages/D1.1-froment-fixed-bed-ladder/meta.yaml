      re-read here: its printed values are loaded from published D2.2's CSVs,
      which is how the atm-to-bar audit was done.
  - authors: ["Froment, G. F."]
    year: 1967
    container: "Industrial & Engineering Chemistry 59(2) 18-27"
    role: >
      The origin of sections 11.7.3 and 11.7.4. NOT re-read here: its printed
      values are loaded from published C2.10's CSVs.
  - authors: ["Young, L. C.", "Finlayson, B. A."]
    year: 1973
    container: "Industrial & Engineering Chemistry Fundamentals 12, 412"
    role: >
      The origin of criteria (11.6-3) and (11.6-4). Not on disk. The page reports
