fit_or_test: >
  ENTIRELY TEST, with zero fitted quantities. The model has exactly one input,
  the dimensionless group K = k c0 tau, and it is read from Zwietering's own
  column heading. Nothing is calibrated, no constant is adjusted, no property is
  looked up, and no figure is digitised. All 44 printed conversions and all 8
  printed degrees of segregation are held-out predictions from two integers - the
  number of tanks and K. The one place where a choice was made is the assignment
  of each table's conversion body to a residence-time distribution, and that
  choice is decided by three closed forms Zwietering printed himself rather than
  by which assignment scores better; both assignments are scored and both numbers
  are reported.

validation:
  - "all 44 printed values of ce/c0 in Tables 1 and 2 reproduced with zero fitted parameters: worst 4.5e-03, rms 8.3e-04, 40 of 44 inside 0.001, and every cell outside it in the two-tank maximum-mixedness row; read as captioned the worst is 3.5e-02 and 0 of 44 are inside 0.001"
  - "the interchange of the two tables' conversion bodies established from Zwietering's OWN printed closed forms and no model of ours: eq. (42), derived from eq. (41)'s 2/tau and therefore unambiguously the two-vessel chain, reproduces Table 2's ideally-mixed row to 4.1e-04 and Table 1's only to 3.3e-02; eq. (38) gives 5.3e-04 against 2.4e-02 and eqs. (39)+(40) give 7.7e-04 against 2.1e-02. Table 1 prints the smaller value in all 22 paired cells, as the narrower three-tank RTD must. The J column does NOT move with the body, which is what makes it an interchange rather than a relabelling"
  - "the maximum-mixedness value computed a SECOND way: van Leer finite volume on the conservative form solved by Newton with the exact Jacobian (ConvFluxTVD), against the non-conservative eq. (31) integrated as an initial-value problem by DOP853 with no grid and no flux, agreeing to 8.6e-07 over twelve cases, the 800-cell grid error, which is 0.02 % of the deviation being measured against Zwietering's own numbers; the Richardson limit of 1600 and 3200 cells lies within 1e-8 of the reference. Van Leer deferred correction solves the same discrete equations and lands on the Newton solution to below 1e-11 in every cell"
  - "BOTH refinement axes measured, with the ladder printed: grid at observed order 2.00 with van Leer (successive orders 2.00 to 2.14 from 200 cells, every rung of one sign) and 1.00 with bare upwind; domain truncation decaying at 8.44 per unit of X at K = 10; over all printed cases the difference is 3.5e-10 at X = 4 (K = 3, two tanks, the slowest) and below 1e-13, the floor set by the DOP853 tolerance, at the production X = 6. The decay is predicted rather than fitted (a perturbation at X is damped by exp(-int mu dx) with mu = 2 K gamma + E/w, and the far-field error itself falls like 1/X), and observed over predicted lands within 8 % across four windows. The reference solver's tolerance is a third axis, converged to below 1e-12"
  - "the discrete balance (outflow on the exit face, inflow at X, integrated source) closes to below 1e-12 in all twelve cases; with the exit read at the first cell centre it fails by 4.1e-07"
  - "four analytical limits, each able to fail: the exponential RTD collapsing onto the stirred-tank root (his eq. II,12) to below 1e-12; a first-order reaction collapsing both bounds onto (1+K/n)^-n to below 1e-12 (the two routes share the RTD functions, so the anchor is the exact closed-form value, not route independence); the plug-flow limit closing the bracket from 83 % of the segregated value at 2 tanks to 4.0 % at 300; and the bracket REVERSING through order one, +8.3e-03 at p = 1.1 and -7.4e-03 at p = 0.9"
  - "seven of the eight printed degrees of segregation reproduced to 4.3e-05, four of them as exact rationals: (n-1)/(n+5) and 1 - 6(n-1)/((n+1)(n+5)) give 1/7, 1/4, 5/7 and 5/8 against the printed 0.1429, 0.2500, 0.7143 and 0.6250, and the two-tank maximum-mixedness quadrature meets its closed form (2e E1(1) - 1)/7 = 0.027528 to below 1e-8. J is a property of the RTD and the mixing state alone, so this exercises the age and life-expectation machinery that the conversion columns never touch"
  - "how tight the bounds actually are, measured rather than asserted: the widest of the twelve printed cases is 2.12x (two tanks, K = 50) and the narrowest 1.12x, and Zwietering's two INTERMEDIATE reactors occupy mu = 0.23 to 0.85 of the band, coming no closer than 0.15 of the bracket width to either bound. So the bracketing check can fail"
  - "Zwietering's Appendix I variance identity, var alpha = var between + var within, closes to below 1e-12 for both RTDs; the two sides share alpha_P, so it tests that the age quadratures are consistent with each other and with the RTD, not the shape of alpha_P, and a within-point age distribution taken from the three-tank RTD breaks it"
  - "a defect-injection table in which every claim is failed by at least one row: physics defects in the solve (side feed deleted, face velocity -1, first order against second-order tables, reaction sign flipped, for which no steady solution exists), discretisation defects (short domains, coarse, uniform and first-order grids), defects in the reference (forward integration, which blows up, and E/w replaced by its far-field constant), the tables assigned as captioned, the closed forms compared with the other table, the J column assigned as the bodies, a wrong mean age in eq. (28), and the filled dashes divided by the printed segregated value"
  - "UNTESTED and labelled as such: the far-field boundary condition. Replacing the root of K g^p + n(g-1) = 0 by g = 1 moves the answer by below 1e-12 at the production X = 6, against the same solve with the root: the backward integration is contracting, so by x = 6 every trace of the starting value is gone. Shortening the domain to X = 0.5 makes the same defect worth 1.7e-02, which is what shows the insensitivity belongs to the domain length and not to the check"

adds: >
  Nothing to the physics. Zwietering's bounds are right, his four states of mixing
  are correctly formulated, and 40 of his 44 printed conversions are reproduced to
  within 0.001, the four that are not being the four cells of the one row he had
  to integrate by hand.

  What is new is arithmetic he could not afford in 1959, and three things that
  follow from it. First, the conversion bodies of Tables 1 and 2 are interchanged
  with respect to their captions, established from three closed forms he printed
  himself, confirmed by the physical ordering (three tanks are a narrower RTD and
  must convert more), and pinned down by the J column not moving with the body.
  Second, his own hand-integration error is measurable: his two-tank
  maximum-mixedness row carries a systematic +1.10 % bias, all four printed
  deviations of one sign, while his three-tank row is exact to the printed
  precision and every algebraic row in both tables is inside one unit in his last
  printed decimal. Third, the dashes are filled in: he integrated eq. (31) only for
  K = 5, 10, 20 and 30, and the K = 50 two-tank value, 0.0753 against a segregated
  0.0355, is the widest bracket in either table.

  The pymrm-shaped contribution is the reformulation. Eq. (31) is normally
  presented and solved as an initial-value problem in life expectancy. Written
  conservatively as div(v gamma) = E - K w gamma^p with v = -w it is an ordinary
  convection-reaction boundary-value problem with a decaying velocity field and a
  distributed side feed: construct_convflux_upwind, construct_div, van Leer face
  fluxes with their exact Jacobian from ConvFluxTVD and newton, so the
  life-expectation coordinate behaves like any other spatial axis. The van Leer
  solve converges at second order, conserves the side feed to round-off when the
  exit is read on the face, and needs a handful of Newton iterations, against
  tens of sweeps of deferred correction for the same discrete solution. It is not
  the faster or more accurate route for this scalar equation: DOP853 at a loose
  tolerance is as fast and more accurate than the 800-cell solve. What it adds is
  the closed discrete balance, the profile as one Newton system, and an operator
  stack that a model with side feeds, a second phase or a measured RTD on a grid
  can reuse.

agreement: >
  Not applicable in the experimental sense; this is a tier 6 analytical page and
  the source contains no measurement of any kind. The strongest check is the 44
  printed conversions, reproduced with zero fitted parameters to a worst 4.5e-03
  and an rms 8.3e-04, with 40 of 44 inside one unit in his last printed decimal.
  The check with the most resolution is the second computation of the
  maximum-mixedness value, 8.6e-07 between a conservative finite-volume solve and
  a gridless adaptive integration of the non-conservative form, the grid error of
  the first. The check with the most power over the RTD machinery is the degree
  of segregation, seven of eight to 4.3e-05 including four exact rationals. The
  headline result the page exists for is not an agreement at all but a width: the
  two bounds differ by a factor 2.12 at the widest of Zwietering's twelve cases,
  and both of his intermediate reactors sit well inside that band.

caveats: >
  Tier 6, and emphatically NOT experimental validation. Zwietering 1959 measures
  nothing; its three figures are schematics of pipe-and-tank arrangements and
  nothing is digitised. Every number here is checked against his arithmetic or
  against an analytical limit.

  The bounds are not shown to be ATTAINABLE by a real vessel. Both extremes are
  imaginary reactors. What the page shows is that two ordinary reactors with the
  same RTD sit at 0.23 to 0.37 and 0.70 to 0.85 of the band; whether anything
  physical approaches either edge is not addressed here or in the paper.

  One printed value is not reproduced and is not repaired. The three-tank degree
  of segregation under maximum mixedness computes to 0.080296 against the printed
  0.0831, a 3.4 % discrepancy. The two-tank companion meets its closed form and
  Appendix I's variance identity closes, so the quadrature is probably right and
  the printed value probably a slip, but the page says "probably" and adjusts
  neither number.

  The interchange of the tables is an inference about typesetting, not about
  physics. The evidence is strong and paper-internal, but what happened in 1959 is
  not recoverable, and the page scores both readings rather than only the one it
  argues for.

  The far-field boundary condition is untested, not weakly tested. Measured, it
  makes no difference whatsoever at the production domain length. The page says so
  and does not claim it as a check.

  A2.4, tanks in series, loads none of this page's data, publishes no dataset
  this page could consume, and contradicts none of its findings (it finds the
  macrofluid converting further than the microfluid for second order, as complete
  segregation does here). The residence-time distributions used here are analytic
  Erlang distributions verified in place. No other page's dataset is loaded: A2.1
  publishes none, and the dispersion data on A2.3, A2.5 and A2.6 bear on measured
  RTDs rather than analytic ones. The one sibling finding that does bear on this
  page is A2.6's outlet-face trap, and it is measured on the page.

  The page range is 11(1), 1-15, not the 1-11 that is universally cited. Read off
  the printed folio on a 300 dpi render of the last page.
