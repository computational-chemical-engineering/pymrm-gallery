dataset_id: bischoff1965-table1
title: "Bischoff (1965) Table 1 - modulus correction factors for volume change, as printed"
status: complete

source:
  authors:
    - "Bischoff, K. B."
  year: 1965
  container: "AIChE Journal 11(2) 351-355"
  doi: 10.1002/aic.690110229
  access: "closed access; scan on maintainer disk, CCITT-G4 bilevel at 300 ppi native"
  licence: "short factual table transcribed for scholarly comparison"

acquisition:
  method: transcribed
  procedure: >
    All eight value cells and the four omega*Co labels read from digit-scale
    crops of a native-resolution (300 ppi) render of journal page 355. The text
    layer of this scan is unreliable (sub/superscripts mangled) and was not
    used for any digit. Every glyph was crisp; no cell was inferred.
  tool: "pdftoppm -r 300 + PIL crops at 2-3x magnification"
  operator: "Claude (Fable 5, assisted), gallery build agent"
  date: 2026-08-08
  estimated_error: "none expected at 3 significant figures; glyphs unambiguous"

provenance_tier: 6

not_experimental: >
  THIS IS NOT MEASURED DATA. Table 1 contains the author's own evaluations of
  his closed-form equations (33) and (34). Reproducing it tests transcription
  and the author's arithmetic, not physics against nature. Note: the page
  finds that the eq. (33) entry at omega*Co = -0.25 (printed 0.905) disagrees
  with exact evaluation of eq. (33) as printed (0.9107: 0.0057 absolute,
  0.62 % relative - 11x the half-ULP rounding radius of the 3-decimal cell
  whichever way the ratio is taken), while the other seven cells agree to
  within printed rounding. The printed value is retained here unaltered.

columns:
  - {name: omega_co,      unit: "-", description: "omega*Co, volume-change group (Bischoff eq. 32)"}
  - {name: eq33_printed,  unit: "-", description: "m/M correction factor from eq. (33), as printed"}
  - {name: eq34_printed,  unit: "-", description: "Hawthorn's empirical factor from eq. (34), as printed"}

redistribution_basis: >
  Eight numeric values from a 1965 journal table, transcribed (not scanned)
  for verification; factual data of this kind is not a copyrightable
  expression, and the page recomputes every value from the printed equations.
