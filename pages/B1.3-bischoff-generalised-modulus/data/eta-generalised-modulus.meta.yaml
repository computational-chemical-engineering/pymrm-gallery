dataset_id: bischoff-eta-generalised-modulus
title: "Exact effectiveness factor vs Bischoff's generalised modulus, 14 rate forms"
status: complete

source:
  authors:
    - "Bischoff, K. B."
  year: 1965
  container: "AIChE Journal 11(2) 351-355"
  doi: 10.1002/aic.690110229
  access: "not required - the values are computed here from the paper's eqs. (14)-(15)"
  licence: "n/a - mathematical results, not a copyrightable dataset"

acquisition:
  method: analytical
  procedure: >
    Generated by the page notebook (deterministically: re-execution
    reproduces the file byte-identically): adaptive quadrature of Bischoff's
    parametric exact solution, his eqs. (14)-(15), with the inner rate
    integral in closed form per rate form (written without cancellation as
    the two limits approach), the centre concentration solved by Brent's
    method in logit(C_L/C_o) at each of 61 log-spaced moduli m in [0.1, 20],
    and the dead-zone branch (n < 1, m > (n+1)/(1-n)) set to the exact
    eta = 1/m. The power-law rows are checked against the paper's closed
    forms, eqs. (21)-(28) with the page's documented n = 1/2 amendment, at
    every exported modulus (below 1e-9 before rounding, claim
    export_power_rows_vs_closed_forms); the LHHW and volume-change rows have
    no closed form and are checked against the pymrm slab at m = 0.3, 1 and 3
    for zeta* = 0.1, 10 and omega*Co = 1, -0.5.
  tool: "scipy.integrate.quad / scipy.optimize.brentq (model.py Curve; written by index.py)"
  operator: "Claude (Fable 5, assisted), gallery build agent"
  date: 2026-08-08
  estimated_error: "power-law rows below 1e-9 relative against the closed forms; eta stored to 10 decimals"

provenance_tier: 6

not_experimental: >
  THIS IS NOT MEASURED DATA. Bischoff (1965) is an analytical paper with no
  experiments; these are exact solutions of his model, exported for reuse.

columns:
  - {name: rate_form, unit: "-", description: "power | lhhw | volchange"}
  - {name: param,     unit: "-", description: "n for power; zeta* = zeta/Co for lhhw; omega*Co for volchange"}
  - {name: m,         unit: "-", description: "generalised modulus, Bischoff eq. (13)"}
  - {name: eta,       unit: "-", description: "effectiveness factor (slab), 10 decimals"}

redistribution_basis: >
  Values generated here from the published equations. Mathematical results
  are not copyrightable and no third-party dataset is reproduced.
