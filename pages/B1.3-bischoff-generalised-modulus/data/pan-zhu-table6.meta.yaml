dataset_id: pan-zhu-1998-table6
title: "Pan & Zhu (1998) Table 6 - first-order effectiveness factors for a finite cylinder, as printed (Z = 1.0 and 2.0 columns)"
status: complete

source:
  authors:
    - "Pan, T."
    - "Zhu, B."
  year: 1998
  container: "Chemical Engineering Science 53(5) 933-946"
  doi: 10.1016/S0009-2509(97)00385-0
  access: "closed access; scan on maintainer disk, CCITT-G4 bilevel at 600 ppi native"
  licence: "short factual table transcribed for scholarly comparison"

acquisition:
  method: transcribed
  procedure: >
    The phi column and the (eta_a, eta*) pairs for Z = 1.0 and Z = 2.0 read
    from a crop of a native-resolution (600 ppi) render of journal page 939.
    The Z = 0.5, 0.7 and 1.5 columns of the printed table were not
    transcribed (not used by the page). eta_a is the authors' approximate
    analytical treatment, their eq. (32); eta* is the exact double-series
    solution, their eq. (37).
  tool: "pdftoppm -r 600 + PIL crops"
  operator: "Claude (Fable 5, assisted), gallery build agent"
  date: 2026-08-08
  estimated_error: "none expected at 3 decimals; 600 ppi born-digital-era scan, crisp glyphs"

provenance_tier: 6

not_experimental: >
  THIS IS NOT MEASURED DATA. Both columns are the authors' own computed
  values. They are used on the page (a) to verify this page's independent
  implementation of their eqs. (32) and (37), and (b) to establish, from the
  authors' own printed numbers, how their "deviation of less than 1.5%" claim
  must be read: the worst printed absolute gap is a tie at 0.013 (Z = 2.0,
  phi = 4.0: 0.477 vs 0.490, and phi = 6.0: 0.343 vs 0.356), 1.3 % of the
  eta scale; the phi = 6.0 member of the tie is also the worst RELATIVE pair
  over all transcribed pairs, 0.013/0.356 = 3.7 %. The claim therefore holds
  only in the absolute reading, already for first order.

columns:
  - {name: Z,                unit: "-", description: "aspect ratio Hp/(2 Rp), their eq. (39)"}
  - {name: phi,              unit: "-", description: "Thiele modulus built on pellet radius Rp, their eq. (18)"}
  - {name: eta_a_printed,    unit: "-", description: "approximate analytical effectiveness factor, their eq. (32), as printed"}
  - {name: eta_star_printed, unit: "-", description: "exact series effectiveness factor, their eq. (37), as printed"}

redistribution_basis: >
  A subset of numeric values from a journal table, transcribed for
  verification; factual data, and the page recomputes both columns from the
  printed equations.
