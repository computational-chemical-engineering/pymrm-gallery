dataset_id: pan-zhu-1998-table5
title: "Pan & Zhu (1998) Table 5 - mu1 and mu2 shape coefficients vs aspect ratio Z, as printed"
status: complete

source:
  authors:
    - "Pan, T."
    - "Zhu, B."
  year: 1998
  container: "Chemical Engineering Science 53(5) 933-946"
  doi: 10.1016/S0009-2509(97)00385-0
  access: "closed access; scan on maintainer disk, CCITT-G4 bilevel at 600 ppi native"
  licence: "short factual table transcribed for scholarly comparison"

acquisition:
  method: transcribed
  procedure: >
    Both rows of the printed table read from a crop of a native-resolution
    (600 ppi) render of journal page 938. mu1 is defined by their double
    series eq. (26) (alpha_m the positive zeros of J0, theta_n their
    eq. (24)); mu2 by their eq. (30), mu2 = 2 + 1/Z.
  tool: "pdftoppm -r 600 + PIL crops"
  operator: "Claude (Fable 5, assisted), gallery build agent"
  date: 2026-08-08
  estimated_error: "none expected at the printed precision; crisp glyphs"

provenance_tier: 6

not_experimental: >
  THIS IS NOT MEASURED DATA. Both rows are the authors' own evaluations of
  their closed-form/series definitions. The page recomputes both rows
  independently and finds the mu2 entry at Z = 2.5 (printed 2.50) disagrees
  with the authors' own eq. (30), which gives 2.40 exactly - most likely a
  copy of the neighbouring Z = 2.0 cell. The printed value is retained here
  unaltered. All mu1 entries are reproduced by the series to within printed
  rounding.

columns:
  - {name: Z,           unit: "-", description: "aspect ratio Hp/(2 Rp)"}
  - {name: mu1_printed, unit: "-", description: "shape coefficient, their eq. (26) double series, as printed"}
  - {name: mu2_printed, unit: "-", description: "shape coefficient, their eq. (30) = 2 + 1/Z, as printed"}

redistribution_basis: >
  Eighteen numeric values from a journal table, transcribed for verification;
  factual data, and the page recomputes every value from the printed
  definitions.
