validation:
  - pseudo-first-order E against the exact Ha/tanh(Ha)
  - grid convergence order
  - limiting behaviour E -> 1 and E -> E_i
  - second-order solve reduces to first order when the co-reactant is in excess
adds: >
  An error bar on the two enhancement-factor approximations that absorber design
  runs on. Van Krevelen-Hoftijzer is within 2.1% of the full film solution;
  DeCoursey reaches 8.7%, worst around Ha ~ 1.5 in the transition between the
  fast and instantaneous regimes - which is the operating region of a real amine
  absorber.
agreement: >
  6.3e-3 max relative error against the exact first-order solution over
  0.02 <= Ha <= 200 (concentrated at high Ha where the reaction layer is thinner
  than a cell); the second-order solve reproduces the first-order limit to
  5.4e-6 when E_i -> infinity.
caveats: >
  Provenance tier 6 - validated against exact solutions and limiting cases, not
  against experiment. Hatta's regimes and the first-order enhancement are
  analytical; VKH and DeCoursey are published approximations, not measurements.
