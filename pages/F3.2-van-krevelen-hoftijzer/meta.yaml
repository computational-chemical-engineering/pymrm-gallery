id: F3.2
slug: van-krevelen-hoftijzer
title: "Van Krevelen–Hoftijzer: the chart replaced by a solve, and the assumption behind it measured"
section: F
status: published
tier: T0
priority: P1
structures: [S3]
phases: [gas-liquid]
authors:
  - name: "PyMRM Gallery contributors"
    orcid: null
pymrm_min_version: "3.4.0"
runtime_seconds: 360
datasets:
  - vkh-printed-claims
  - enhancement-chart-labels
validation:
  - "THE FILM EQUATIONS SOLVED TWICE: pymrm finite volumes on a graded grid against scipy's adaptive collocation, which share no assembly; one n_x = 800 solve agrees to at most 1e-5 <!-- claim: fv_vs_bvp_max_rel_diff --> over 20 chart points."
  - "THE REFERENCE ITSELF CHECKED: the Richardson extrapolation (n_x = 400, 800) agrees with collocation to at most 1e-7 <!-- claim: ref_vs_bvp_max_rel_diff --> and with a finer extrapolation (800, 1600) to at most 1e-7 <!-- claim: ref_self_refinement_max_rel_diff -->."
  - "GRID REFINEMENT at (gamma, q) = (10, 4): observed order 2.00 <!-- claim: fv_convergence_order --> from successive differences on 100 to 800 cells, on the graded grid."
  - "THE FIRST INTEGRAL q beta(0) = 1 + q - F_A, never told to the discretisation, holds to at most 1e-8 <!-- claim: first_integral_max_abs_resid -->."
  - "THE IMPLICIT RELATION SOLVED TWICE, for F_A and for gamma', agreeing to at most 1e-12 <!-- claim: vkh_two_routes_max_rel_diff -->; its two limits, q to infinity and gamma to infinity, reproduced."
  - "F3.1's own definition of the same error recomputed and reconciled against its stored agreement.json, and F3.1's first-order check reproduced on its own grid to at most 1e-12 <!-- claim: f31_first_order_reproduced_rel --> relative."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (the sign, offset and group of (6.3.5-1), the depletion of B, the grid, the reference, the bulk boundary condition, the extremum search, the label set, Levenspiel's four constants, three solver tolerances)."
adds: >
  pymrm solves the film equations the enhancement chart exists to avoid
  (construct_grad and construct_div on a graded grid, per-species boundary
  conditions, newton with NumJac on the pointwise rate, compute_boundary_values
  for beta(0)), and pymrm.checks supplies the root scans and the refinement
  ladder. The approximation itself needs nothing from pymrm. With the reference
  in hand, the worst error of Van Krevelen-Hoftijzer over the printed chart is
  -2.7955 <!-- claim: vkh_worst_rel_error_pct --> % at gamma =
  4.728 <!-- claim: vkh_worst_gamma -->, q = 1.522 <!-- claim: vkh_worst_q -->,
  root-found in both directions, a margin of
  3.577 <!-- claim: froment_10pct_claim_margin --> against the "within 10
  percent" printed for it. Neither wording of the stated assumption orders the
  error: at the worst point beta(0) is 0.1647 <!-- claim: beta_interface_at_worst -->
  and the rate-weighted mean of beta is 2.115 <!-- claim: beta_constancy_at_worst -->
  times beta(0), while where B is gone the approximation is exact to
  -0.00037 <!-- claim: vkh_error_at_full_depletion_pct --> %. Levenspiel's
  instantaneous correction E_i^2(E_i-1)/M_H^2 is the large-gamma asymptote of
  the approximation only when E_i is large too: it tracks the VKH deficit to
  0.9953 <!-- claim: lev_inst_asymptote_ratio_vkh --> at M_H = 400, while the film's
  own deficit is q beta(0), exponentially small, so at M_H = 800 the printed
  correction is 44.24 <!-- claim: lev_inst_overstatement_factor --> times too large.
  On F3.1's first-order check, grading at the same n_x is worth a factor
  124.8 <!-- claim: grading_worth_ratio --> and the refinement from 400 to 800 cells
  a further 7.163 <!-- claim: refinement_worth_ratio -->.
agreement: >
  Provenance tier 6: both sides of every comparison are equations, so the
  numbers say how far an approximation departs from the film equations it
  approximates, never how far a model is from a measurement. The reported
  baseline, the Richardson extrapolation, agrees with scipy's collocation to at
  most 1e-7 <!-- claim: ref_vs_bvp_max_rel_diff --> over 20 points of the chart;
  the film's first integral holds to at most
  1e-8 <!-- claim: first_integral_max_abs_resid -->; the implicit relation solved
  for F_A and for gamma' agrees to at most
  1e-12 <!-- claim: vkh_two_routes_max_rel_diff -->, a bound set by Brent's
  tolerance.
caveats: >
  The 1948 origin was not consulted: Van Krevelen & Hoftijzer, Rec. Trav. Chim.
  Pays-Bas 67, 563 (1948), is not on disk, and every equation is transcribed from
  Froment, De Wilde & Bischoff (2011) sections 6.3.2 and 6.3.5, read on 300 ppi
  renders because that file's equations lose every operator to Private-Use-Area
  glyphs under text extraction. The issue number, end page and DOI printed for
  the 1948 origin come from a Crossref record lookup, not from any document on
  disk; both books print only "67, 563 (1948)". Froment's Fig. 6.3.2-1 is an
  embedded 148 ppi raster, so its curve labels were read at that native
  resolution. Levenspiel (1999) Ch. 23 is used only as an independent check on
  the constants and to reconcile the two notations. Nothing here is evidence
  about what the 1948 paper says, only about the equation two monographs
  attribute to it, and nothing here is evidence about a real absorber.
