validation:
  - "INDEPENDENT COLLOCATION ROUTE (V1): eq. (82) as an ODE system in the concentrations with the constant fluxes as unknown parameters (solve_bvp), sharing no transport code with the finite-volume route, agrees to at most 1e-5 <!-- claim: collocation_worst_dev --> over six decades of pore size on 100 cells and to at most 1e-9 <!-- claim: collocation_extrapolated_dev --> once the finite-volume flux is extrapolated to zero cell size; grid order 2.01 <!-- claim: grid_order --> at worst from successive differences on 25 to 800 cells."
  - "PRINTED CLOSED FORMS: eq. (103), single component with the viscous term, recovered to at most 1e-10 <!-- claim: eq103_viscous_dev -->; page A4.4's eq. (109) recovered face by face to at most 1e-10 <!-- claim: eq109_collapse_worst -->; eqs. (105), (107) and (103) derived from eq. (101) symbolically with 0 <!-- claim: symbolic_nonzero_residuals --> nonzero residuals."
  - "GRAHAM'S LAW (an algebraic identity of eq. 82, labelled as one) predicted, not imposed, to at most 1e-9 <!-- claim: graham_residual_worst -->."
  - "ASYMPTOTES: the free-molecule departure is 1.76e-4 <!-- claim: free_molecule_limit_dev --> at d0 = 0.01 nm and falls at rate 1.00 <!-- claim: free_molecule_rate --> in d0; the Maxwell-Stefan departure is at most 5.8e-4 <!-- claim: maxwell_stefan_limit_dev --> at 1 mm and falls at rate -1.00 <!-- claim: maxwell_stefan_rate --> in d0."
  - "THE FOUR EXPONENTS stated in words on p. 887 recovered as log-log slopes to 0.0205 <!-- claim: p887_exponent_worst_dev --> at worst."
  - "MEASURED BLIND SPOT: eq. (85)'s d0/3 broken to d0/2 in every route at once moves the collocation gap by a factor of at most 20 <!-- claim: prefactor_v1_ratio --> (the discretisation error's change with Kn) and leaves eq. (103) and Graham's law at the solve's tolerance; the prefactor and eq. (83)'s eps/tau are pinned by nothing on the page."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (eq. 87 off-diagonals, wall term, eq. 85 mass exponent and prefactor, a pair diffusivity, eq. 91's 32, alpha', face-composition rule, Newton tolerance, scalar closure, stoichiometric mass ratio, study grids)."

adds: >
  pymrm supplies the transport skeleton of the n-component solver
  (construct_grad, construct_div with nu, construct_boundary_value_matrices for
  the boundary face compositions, NumJac with a cell-and-species stencil, newton)
  and pymrm.checks for the root scans and refinement ladders. On top of that the
  page turns four of the review's qualitative statements into numbers. The
  viscous screening group D_visc/D^e_iM = 3 p d0/(32 eta v_bar_i) cannot be swept
  alone because Kn depends on the same d0; tying both to d0, viscous flow changes
  the pellet-centre pressure by 0.634 % <!-- claim: viscous_relief_1um_pore --> at
  1 um and by 0.640 % <!-- claim: viscous_relief_worst_over_pore_sizes --> at most
  from 1 nm to 100 um, while freezing Kn overstates the 1 um figure
  10.9 <!-- claim: viscous_fixed_kn_overstatement --> fold. Uphill diffusion has
  no critical pore size: the threshold moves by a factor
  4650 <!-- claim: uphill_threshold_range_over_window --> across compositions
  inside the window, and the window half-width falls nearly in proportion to d0
  (log-log slope 0.976 <!-- claim: uphill_window_width_slope_in_d0 -->). Jackson's
  p0 = sqrt(nu_B) p is the Knudsen corner of a closed form, with a departure of
  -1/(2 Kn) at finite Kn. An inert species with zero flux varies by
  24.4 % <!-- claim: inert_concentration_variation_kn1 --> at Kn = 1 where any
  scalar closure with a finite positive diffusivity gives a flat profile.

agreement: >
  Against printed results: eq. (103) to at most 1e-10
  <!-- claim: eq103_viscous_dev -->; the four p. 887 exponents to
  0.0205 <!-- claim: p887_exponent_worst_dev -->; Jackson's sqrt(nu_B) to the
  finite-Kn departure, Kn times which is -0.4999
  <!-- claim: jackson_dev_times_kn -->; A4.4's eq. (109) to at most 1e-10
  <!-- claim: eq109_collapse_worst -->. Internal: an independent collocation
  solution of the same equations to at most 1e-9
  <!-- claim: collocation_extrapolated_dev --> after extrapolation in the grid.

caveats: >
  Data tier 6: nothing on this page is compared with a measurement; the review's
  Fig. 44 comparison with Remick & Geankoplis (1974) is not used. The page tests
  no diffusivity value: the pair diffusivities are the review's printed numbers
  for H2/N2/CO2 (p. 872, cross-page from A4.2, printed to two or three
  significant figures) and every route is handed the same ones. Eq. (85)'s d0/3
  prefactor and eq. (83)'s eps/tau are pinned by nothing on the page; they rest
  on the transcription, with the review's own sentence naming d0 the pore
  diameter. eps/tau = 1 combines the printed tau = 1 for a cylindrical pore with
  an assumed eps = 1. The gas viscosity in the viscous screening group is a
  representative value, not from the review. Near the bulk limit the fluxes are
  sensitive to the total-pressure gradient, so the Newton tolerance limits how
  close to the Maxwell-Stefan limit the solver can be driven; its effect grows
  with d0 (measured at 1 mm). Surface diffusion, pore-size distributions,
  viscous selectivity, thermal diffusion and non-ideal mixtures are not
  implemented. The uphill-diffusion example is not Kaza & Jackson's.
