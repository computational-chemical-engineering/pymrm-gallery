validation:
  # PRIMARY - external references
  - "homogenisation closure against Taylor's Eq. 25: 1.9e-9 relative at n_r = 200 with the grid's own mean subtracted from the velocity, observed order 4.00, and the pinned cell of the singular system changing k by round-off only; with the exact mean u0/2 subtracted the system is inconsistent, the error is 1.0e-4 at order 2.00 and moving the pin from the axis to the wall changes k by 1.5e-4"
  - "the same closure across 2.5 decades of Peclet number, as an identity: k is proportional to Pe^2 exactly, so the relative error is the grid error -3/n_r^4 at every Pe, spread across Pe at round-off (structural)"
  - "direct 2-D transient simulation against Eq. 25 on five meshes, n_z = 400 to 6400: over the window tau = 0.6 to 1.2 the extrapolated limit is -0.0024 %, over the window tau = 0.2 to 1.0 it is -0.416 %, which the modal series of the closure predicts as the start-up deficit inside that window (-0.407 %)"
  - "the numerical-dispersion floor of first-order upwind against its closed form Pe dz/8 over 1 + Pe^2/192, plus the 24-cell radial error of k: ratio 0.99999 at n_z = 3200, observed order 1.001"
  - Taylor's own capillary run recomputed (k to 0.04 %, the inferred diffusivity to 0.38 %), and that diffusivity checked against Furth and Ullmann's independently measured range, inside it with a margin of 0.374 relative to the nearer end
  # THE PAGE'S OWN RESULT
  - "settling times of the growth rate into bands of 10, 5, 3, 2 and 1 % of Taylor's value from the modal series of the closure, against the 2-D simulation: per-step rates from the semi-discrete derivative, crossings by root finding, and the floor's shift ln(1 + floor/b)/lambda removed; the corrected times agree across the meshes to 5.7e-6 (3 % band, n_z 1600 and 6400) and 2.4e-4 (10 % band, n_z 400 and 6400) and lie 0.58 % above the series in every band; that bias is the decay rate, which equals ln(1 + lambda_h dt)/dt for the 24-cell radial eigenvalue lambda_h = 14.6508 to 1e-5 at two time steps and two radial grids, 0.576 % below j_1^2"
  # IDENTITIES
  - "mass conservation in the transient solve to round-off on every mesh, with closed ends (no diffusive flux and zero face velocity on the end faces) so that the column sums of the volume-weighted operator are zero to round-off; both are bounds with break rows (a wall uptake b = 0.03 loses 6.9 % of the mass, open ends give column sums of 2.1)"
  # DEFECT INJECTION
  - "a defect-injection table in which every claim is failed by at least one row: a plane-channel geometry and a dropped mean subtraction in the closure, the exact mean in place of the grid's, a coarser mesh, a doubled time step, a wall uptake on one and on both rungs, open ends, absorbing-wall modes in the series, the slab eigenvalue in the floor shift, digit slips in Taylor's tube radius and elapsed time, and Eq. 25 read with the mean velocity, which also flips the Furth-Ullmann acceptance test"

adds: >
  Taylor could only bound when his result applies: radial equilibration takes
  about a^2/(3.83^2 D), so wait "much longer than" that. The page turns the
  inequality into numbers by two routes. The modal series of the closure, derived
  on the page, gives the time after which the variance growth rate stays within
  a band b of Taylor's value: 0.1498, 0.1970, 0.2318, 0.2594 and 0.3066 a^2/D for
  10, 5, 3, 2 and 1 %, that is 2.20, 2.89, 3.40, 3.80 and 4.50 equilibration
  times, close to ln(A/b) with A = 0.901 at Pe = 50: each factor e of accuracy
  costs one equilibration time. The 2-D pymrm simulation reproduces these once
  its upwind numerical-dispersion floor is removed, 0.58 % above the series in
  every band. Read off a single mesh, the same settling times are biased low by
  the floor (0.2115 instead of 0.2318 for the 3 % band at n_z = 3200), and a
  band narrower than the floor is never entered. The series is a derivation in
  scipy, not a pymrm feature; pymrm supplies the operators of the closure and of
  the 2-D transient.

agreement: >
  The closure reproduces Eq. 25 to 1.9e-9 relative at n_r = 200, at fourth
  order, identically at every Pe because k scales as Pe^2. The direct 2-D
  simulation converges onto Eq. 25 at first order in dz over a window opened
  after the start-up (extrapolated limit -0.0024 %), with mass conserved to
  round-off. Taylor's worked capillary run recomputes to 0.04 % in k and 0.38 %
  in the inferred diffusivity, and that diffusivity, 5.98e-6 cm2/s, lies inside
  the 4.35e-6 to 1.50e-5 range measured independently by Furth & Ullmann.

caveats: >
  Data tier 2 and the comparison is indirect: Taylor's raw concentration
  profiles are not transcribed, only his worked inference and the literature
  range it is checked against. His second inferred value (Eq. 42) is left out
  because the tube radius for those runs is not stated beside the calculation.
  The direct simulation uses first-order upwind, whose numerical dispersion
  (1.11 % of the rate at n_z = 3200) is measured, checked against its closed form
  and removed from the settling times by a correction, not by the scheme. The
  settling times hold for a slug released uniformly across the section at
  Pe = 50; another release or Peclet number changes the amplitudes of the modal
  series. The corrected simulated times keep a 0.58 % bias from the time step
  and the radial grid, which the page measures but does not remove.
