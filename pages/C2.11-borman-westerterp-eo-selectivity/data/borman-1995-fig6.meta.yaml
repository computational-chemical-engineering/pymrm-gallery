dataset_id: borman-1995-fig6
title: Model III selectivity curves of Figure 6 (the authors' calculation, digitised)
status: complete

source:
  authors: ["Borman, P. C.", "Westerterp, K. R."]
  year: 1995
  container: "Industrial & Engineering Chemistry Research 34(1) 49-58"
  doi: "10.1021/ie00040a002"
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

provenance_tier:
  tier: 4
  note: >
    Points on the authors' own calculated curves ("Selectivity calculated according to
    model III"), not measurements: selectivity to ethene oxide against the partial pressure
    of CO2, ethene oxide or water at 476 K with the other pressures of the caption. Used to
    test whether the page reproduces the authors' calculation.

acquisition:
  method: digitised
  figure: "Figure 6, journal page 56 (PDF page 8)"
  tool: "poppler pdftoppm at 400 dpi, grey; ink runs along pixel columns"
  script: "pages/C2.11-borman-westerterp-eo-selectivity/extract_figures.py"
  procedure: >
    Axes calibrated by least squares on the frame lines and the tick marks (12 on the
    pressure axis, 9 on the selectivity axis); largest tick residual 1.8e-4 bar and 0.020
    selectivity points. Every 6th pixel column scanned for line runs (at most 10 px thick),
    18 px clear of every frame line (the ticks on all four sides); curves assigned by their
    order on the flanks of the crossing region; the crossing region (0.045 to 0.085 bar) and
    the labels excluded. 105 points: 40 on the CO2
    curve, 29 on the ethene oxide curve, 36 on the water curve.
  operator: "Claude Opus 5.5 (assisted), reviewed by the gallery maintainers"
  date: 2026-11-27
  estimated_error: >
    Reading band 0.08 selectivity points: half the median line thickness (4 px, 0.044
    points at 45.9 px per point) plus the largest selectivity tick residual (0.020) plus the
    largest pressure tick residual times the steepest curve slope (1.8e-4 bar times 92
    points per bar), rounded up.
  reading_band_points: 0.08

columns:
  - {name: curve, unit: "-", description: "C (CO2 varied), EO (ethene oxide varied), W (water varied)"}
  - {name: P_bar, unit: bar, description: "partial pressure of the varied component"}
  - {name: selectivity_pct, unit: "%", description: "selectivity to ethene oxide read from the curve"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v. Rural
  Telephone, 1991). Extraction for scientific research by a research organisation with lawful
  access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU) 2019/790 Art. 3).
  The original figure image is NOT reproduced.
