caveat: >
  TIER 2 (tables printed in a paper), and the limit here is legibility rather than the measurement.
  The dP_ke/dP_mf column is too incomplete at the ends of each series to refit
  the paper's own equation (11) intercepts, which is why this page takes the
  four u_mf/u_e ratios the authors print instead of recomputing them.
