dataset_id: toomey-johnstone-1952-table3-wall-velocities
title: Average velocities of particles at the wall and the corresponding pressure losses (Table 3)
status: complete

source:
  authors: ["Toomey, R. D.", "Johnstone, H. F."]
  year: 1952
  container: "Chemical Engineering Progress 48(5) 220-226, May 1952"
  doi: null
  doi_note: >
    NO DOI EXISTS; see the Table 1 sidecar for the verification. None is invented.
