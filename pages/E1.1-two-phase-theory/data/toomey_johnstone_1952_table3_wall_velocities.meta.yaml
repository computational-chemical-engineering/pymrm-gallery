  - {name: up_ft_s, unit: ft/s, description: "average particle velocity at the wall, from 16-mm Fastax film"}
  - {name: up_over_sqrt_dp_printed_ft05_s, unit: "ft^0.5/s", description: "the AUTHORS' derived column, stored as printed; an output to compare against, never an input"}
  - {name: dPke_over_L_lb_ft3, unit: "lb/(ft^2)(ft)", description: "pressure loss in excess of the bed weight, per unit bed height"}
  - {name: flags, unit: "-", description: "semicolon-separated legibility tokens; empty means a clean read"}

