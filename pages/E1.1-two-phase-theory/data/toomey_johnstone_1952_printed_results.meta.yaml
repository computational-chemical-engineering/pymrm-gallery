  - {name: units, unit: "-", description: "units as printed"}
  - {name: where_printed, unit: "-", description: "journal page and column"}
  - {name: description, unit: "-", description: "what the quantity is"}
  - {name: flags, unit: "-", description: "semicolon-separated tokens; empty means printed unambiguously and with no inference"}

