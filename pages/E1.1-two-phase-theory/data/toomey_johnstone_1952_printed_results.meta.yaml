caveat: >
  TIER 2 (tables printed in a paper). The four u_mf/u_e ratios describe Lewis, Gilliland and Bauer's
  particles, not the beads of Tables 1-3, and any conclusion drawn from them is a
  statement about the two-phase postulate rather than about this apparatus.
