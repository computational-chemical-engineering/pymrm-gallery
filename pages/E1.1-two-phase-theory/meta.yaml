# READ FIRST, because every headline below depends on it: the four u_mf/u_e
# intercept ratios this page turns on are printed by Toomey and Johnstone but are
# read off LEWIS, GILLILAND AND BAUER's four particle sizes, not off the five bead
# sizes of Tables 1 to 3. The paper says so ("Only the data of Lewis, Gilliland
# and Bauer extend to low enough velocities to obtain an accurate indication of
# the point of intersection") and Figure 3 separates the two sets in its own
# legend: three filled curves "AUTHORS' DATA" at D_p = 0.0148, 0.00861, 0.00418
# in., four open curves "DATA OF LEWIS, GILLILAND AND BAUER" at 0.0224, 0.0178,
# 0.0112, 0.00881 in. So this page tests THE POSTULATE on numbers this paper
# printed; it does not measure u_e for this apparatus. The notebook says the same
# thing in its title cell, in Results section 4 and in the Reuse section, and
# README.md says it too.
#
# Every number the notebook states is a Claims entry in agreement.json (format 2),
# and every claim is failed by at least one row of the defect-injection table; the
# count line under the table is printed by the code.
validation:
  - "the bed-weight identity, dP_mf/L_mf from Table 2 against (1-eps)(rho_s-rho_g)g from Table 1, over 25 runs and four independently printed voidages: worst single run 0.49 %, worst bead mean 0.28 %, the worst run sitting on its own Table-2 rounding floor of 0.38 %. Bead 3 is excluded because its illegible voidage is recovered from this identity (0.41929). Break rows: a misread voidage, a misread solid density, a wrong in.H2O conversion"
  - "Table 3's derived column u_p/D_p^0.5 recomputed from u_p and Table 1's diameters: beads 3 and 4 within 0.79 % over nine rows; bead 2's four rows all off by +3.96 % with a spread of 0.089 %, which implies D_p = 0.0160 in. where Table 1 (both columns) and Figure 3's curve label print 0.0148 in. Bead 4 carries the same signature six times weaker (+0.69 %, implied 0.00424 in.). Reported, not repaired. Break rows inject the implied and a -2 % and +2 % diameter, and a misread u_p"
  - "the exponent contradiction: the five printed Re_mf give u_mf ~ D_p^1.51 (least squares; 1.47 from the end points), against the D_p^0.5 the paper's p. 225 sentence plus its D_p-independent u_mf/u_e require; the gap is 7.9 standard errors of the slope, read as an order-of-magnitude statement because the single power law misses a point by a factor 1.39. Break rows reverse the inferred bead assignment and drop the smallest bead"
  - "the visible bubble flow factor Y = (u_f-u_e)/(u_f-u_mf) from the four printed intercept ratios (Lewis, Gilliland and Bauer's particles): 0.765 at u_f = 2 u_mf, 0.646 (200 F) and 0.756 (70 F) at the lowest of the authors' own robustly bubbling runs (bead 3, 5.7 % clear of the threshold at its closest). Forcing u_mf/u_e to 1 is the break row"
  - "Table 3's dPke/L against Table 2's legible dPke/dPmf over ten runs: RMS 9.4 %, worst 24.5 %, scattering about zero, which decides that Table 3's L is L_mf and not the expanded L_f (that would bias every row by +18.5 %). The only check on the dPke/L column: the Figure 5 collapse metric drifts inside its own 5 % tolerance for 8 of 13 single-cell errors of +30 %"
  - "the compressible bed (pymrm finite volumes, first-order upwind, n = 1600): L_f against the closed form 2.5e-5, observed order 1.000 on a six-rung ladder (pymrm.checks.observed_orders), Richardson limit below 1e-7 of the closed form, finest difference far above the round-off and root-tolerance floor. The closed form and an adaptive Runge-Kutta route share the end condition P(L_f) = P_top + w L_mf and agree below 1e-10. The distributor face pressure from compute_boundary_values meets P_top + w L_mf below 1e-9 of the bed pressure drop. The excess-velocity spread from face values agrees with quadrature of the closed form below 1e-6; read at cell centres it is 1.5e-4 low. Break rows: a wrong inlet value, the reversed upwind direction, a coarse grid, an unrefined finest rung, a loose root tolerance, a loose Runge-Kutta tolerance"
  - "what the pymrm claims are blind to, measured: the atmospheric datum moves L_f/L_mf by 3.8 % (inside its tolerance) while collapsing the excess-velocity spread by 90 %; the spread is nearly blind to u_e and to eq. (1)'s coefficient"

adds: >
  On two of the three results, nothing, and the page says so. The bed-weight
  identity and the Table-3 recomputation are arithmetic on printed tables; there
  is no operator, no grid and no Newton solve in them, and manufacturing one
  would have been dishonest. They are also the strongest results here, because
  they are the ones a measurement can fail.

  What the reimplementation adds is three things the paper does not contain.

  A number for the curvature the authors predict and drop. They write that the
  gas must expand as the pressure changes through the bed and that this "would
  cause the data in Figure 3 to show a slight curvature near the abscissa", and
  then never compute it. The pymrm solve sizes it: in a deep bed near the
  threshold the excess velocity u_f - u_mf, the quantity equation (3) is about,
  varies by 25.8 % between distributor and surface at the paper's stated 200 F
  and by 20.5 % at 70 F. Both exceed the shortfall the intercepts report on the
  additive reading, 1 - u_mf/u_e = 19.0 %; on the multiplicative reading
  u_e/u_mf - 1 = 23.5 % only the 200 F figure does, and the page states which it
  means. Applying equation (1) with a single u_f
  over-predicts the expansion by 4.2 % at the reference run. And there is a band
  of superficial velocities exactly as wide as the bed's pressure ratio - 1.235
  to 1.358 times u_mf - in which the top of the bed bubbles and the bottom does
  not. That band straddles the bubbling threshold, which is where the Figure-3
  intercepts are extrapolated to.

  A separation of the postulate into a half that survives and a half that does
  not. The paper, and every restatement of it since, treats "the dense-phase flow
  is constant" and "that constant is u_mf" as one statement. The first is what
  equation (11)'s straight lines demonstrate. The second is an identification the
  printed intercepts - Lewis, Gilliland and Bauer's four particle sizes,
  replotted and extrapolated by Toomey and Johnstone - contradict by 15 to 45 %,
  and it is the one that propagates: the delta = (u_0-u_mf)/u_b of the E2.1 page,
  and every conversion computed from it, inherits the half that fails.

  A measurement of why those borrowed intercepts are the only usable ones. The
  page runs the refit it declines to rely on: fitting equation (11) on Toomey and
  Johnstone's own beads, restricted to runs sharing a bed height and to legible
  cells, gives u_mf/u_e = 2.05, 0.93, 0.47 for beads 2, 3 and 4 - a factor 4.4
  spread STRADDLING 1, so their own apparatus cannot fix even the sign of the
  effect. That is a result, not an excuse, and it is what makes the borrowed
  ratios load-bearing rather than incidental.

  A range of validity for equation (4). The bubble velocity D_p^0.5/0.065 is the
  paper's cleanest-looking result. It is an expansion correlation divided by the
  postulate; the correlation is linear in (u_f-u_mf) and reaches delta = 1 at
  exactly that velocity. Table 2's own runs go 11.8x past it, and the paper's own
  Fastax films have particles at the wall moving 4.6x faster than the bubbles
  equation (4) gives.

agreement: >
  Tier 2 - tables printed in a paper, and they are measurements. That is the
  distinction from E2.1, which is tier 6 and states that nothing on it is
  compared with a measurement.

  The strongest number on the page is the bed-weight identity: 0.49 % worst
  single run over 25 runs and four independently printed voidages, against a
  claim Toomey makes in the printed Discussion and never quantifies. Next is
  Table 3's derived column, reproduced to 0.79 % on nine rows while four rows of
  one bead size are uniformly 3.96 % out with 0.089 % scatter - a printed defect,
  reported and not repaired. Third is the exponent contradiction: u_mf ~
  D_p^1.51 from the five printed Reynolds numbers against the D_p^0.5 that the
  paper's p. 225 sentence plus its own claim of D_p-independence requires, a gap
  of one full unit at 7.9 standard errors.

  The headline about the postulate itself is not a fit and not a residual. It is
  the four intercept ratios the paper prints, 0.85, 0.69, 0.83, 0.87 - read off
  LEWIS, GILLILAND AND BAUER's particles, see the header of the validation block
  - taken for what they say: the dense phase carries 1.23 times u_mf on average,
  so the visible bubble flow is Y = 0.765 of the postulate's at u_f = 2 u_mf and
  0.646 (200 F) / 0.756 (70 F) at the lowest of Toomey and Johnstone's own runs
  that robustly bubbles. Nothing is fitted to those ratios; they are used as
  data, and the page states whose data they are everywhere it uses them.

  The compressibility result is a computation with no measurement to check it
  against, and it is labelled as such: the finite-volume solve converges at
  first order to a closed form that an adaptive Runge-Kutta route reproduces,
  both branches and both switches are exercised, but the only external anchor is the authors' qualitative statement that the
  curvature exists.

caveats: >
  THE LOAD-BEARING ONE. The four u_mf/u_e ratios are Lewis, Gilliland and Bauer's
  four particle sizes, not the five bead sizes of Tables 1 to 3. The paper says
  why: only their data "extend to low enough velocities to obtain an accurate
  indication of the point of intersection", and Figure 3 separates the two sets
  in its own legend (three filled curves "AUTHORS' DATA", four open curves "DATA
  OF LEWIS, GILLILAND AND BAUER"). This page therefore makes a statement about
  the two-phase postulate, NOT about this apparatus, and it cannot locate u_e for
  these beads. It is stated in the notebook title cell, the front-matter
  description, Results section 4, the Reuse section, README.md and
  models_entry.yaml, because a reader who takes away "their own beads refute
  their own postulate" has been misled.

  Refitting equation (11) to Table 2 was considered and rejected as a basis for
  the headline - and then run anyway, so the decision is measured rather than
  asserted. The scan has no text layer at all and the dP_ke/dP_mf column is set
  tighter than the rest; seventeen of its 41 cells are empty, several of them at
  the ends of the series where a straight-line intercept is most sensitive.
  Those cells are empty in the CSV rather than guessed. Fitting what remains, on
  runs sharing a bed height, gives u_mf/u_e = 2.05, 0.93, 0.47 for beads 2, 3 and
  4: a factor 4.4 spread straddling 1, which cannot fix even the sign. The loss
  from the illegible cells is real.

  A partial recovery of the illegible dP_ke/dP_mf cells through Table 3's dP_ke/L
  IS computed in the notebook (section 5b) and reported as an inference, never
  stored as data. Ten runs have both columns legible and an unambiguous row
  match; median deviation 5.25 %, worst 24.5 %, RMS 9.41 %. It doubles as the
  only check on this page that can see a transcription error in the dP_ke/L
  column, and its deviations scatter about zero rather than about +18.5 %, which
  is what decides that Table 3's L means L_mf and not the expanded L_f.

  Bead 3's void fraction is an inference. Its printed middle digit is illegible;
  it is recovered from the bed-weight identity as 0.41929 and stored as 0.420,
  and bead 3 is excluded from the test of that identity.

  The assignment of the five printed Reynolds numbers to bead sizes 5, 4, 3, 2, 1
  is an inference from their ascending order; the paper prints them unlabelled.
  The break table injects the reversed assignment so the reader can see what it
  is worth.

  Air temperature is assumed to be the 200 F the paper states for the delivered
  air. Every velocity ratio depends on gas viscosity alone and is given with its
  70 F counterpart, including the two the compressibility and postulate sections
  rest on: the excess-velocity spread is 25.85 % at 200 F and 20.52 % at 70 F,
  and Y at the lowest robustly bubbling run is 0.646 at 200 F and 0.756 at 70 F
  (the same run, bead 3, at both temperatures). L_f/L_mf is 1.1845 and 1.2378.
  One further consequence is visible on the page: bead 2's lowest run sits below
  the bubbling threshold at 200 F and above it at 70 F, so its Y is either
  negative (meaning no bubbles at all) or 0.371 - while Table 3 records a
  measured wall particle velocity of 0.28 ft/s there.

  Figure 5's claim that "the square root of the particle diameter correlates the
  data" survives weakly and fails strongly. Normalising by D_p^0.5 cuts the log
  scatter by a third against not normalising, but the one-sigma interval on the
  free exponent is [0.47, 0.77] and with three bead sizes and thirteen points a
  per-bead offset and a power of D_p are nearly the same degree of freedom.

  Why the intercept sits ABOVE u_mf is not answered here. Bubbles reduce the
  bed-average pressure gradient, so a naive Darcy argument predicts a dense-phase
  flow below u_mf, which is the opposite sign. Resolving that needs the flow
  field around a single bubble, which is E1.2's subject and is deliberately not
  touched.

  No DOI exists for this article and none was invented. It predates DOI
  registration and CrossRef resolves nothing for it; the citation was verified
  against the printed title page and running footers of the scan itself.
