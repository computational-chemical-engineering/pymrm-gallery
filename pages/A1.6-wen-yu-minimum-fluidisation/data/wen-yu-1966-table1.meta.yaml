dataset_id: wen-yu-1966-table1
title: Standard deviations of Wen and Yu's Equation (1) and of Narsimhan's correlations against literature minimum-fluidization data, by particle class
status: complete

source:
  authors: ["Wen, C. Y.", "Yu, Y. H."]
  year: 1966
  container: "A.I.Ch.E. Journal 12(3) 610-612 (May 1966)"
  doi: 10.1002/aic.690120343
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no figure or page image reproduced)"

conditions: >
  Journal page 611. The deviations are computed by the authors against 284
  minimum-fluidization data points collected from the literature, shown as
  scatter in their Figure 4 and covering, per journal page 611,
  (N_Re)_mf from 0.001 to 4000; per journal page 611 the underlying fractions
  cover d_p from 0.002 to 1.97 in., eps_mf from 0.385 to 0.935, phi_s from 0.136
  to 1.0 and a particle-to-column diameter ratio from 0.000807 to 0.25.

  Narsimhan's correlations could be tested on only 267 of the 284, "due to the
  lack of information pertaining to the shape factor" (journal page 611);
  Equation (1) needs no shape factor and was tested on all 284.

  THESE ARE NOT MEASUREMENTS. They are the authors' own arithmetic comparing two
  correlations against data collected from twenty-odd other laboratories. No
  page may describe agreement with this table as experimental validation. The
  underlying 284 points exist in this paper only as markers in Figure 4 and were
  deliberately not digitised - see the page's Validation section for the routes
  taken instead.

acquisition:
  method: table
  figure: "TABLE 1, journal page 611"
  tool: "poppler pdftoppm at 600 dpi, read visually"
  procedure: >
    Read character by character off a 600 dpi render of journal page 611 and
    cross-checked against the PDF text layer, which for this Wiley scan happens
    to be good on this table (both agree on all eight numbers and on the two
    footnotes).

    ONE TRAP IN THIS FILE, recorded rather than repaired. The scan's first page
    of extracted text belongs to a DIFFERENT article - a communication on
    activity coefficients whose notation and literature-cited block precede
    Wen and Yu's title on the same journal page. The Wen and Yu communication
    begins partway down journal page 610 at "C. Y. WEN and Y. H. YU". Anyone
    re-extracting this paper must confirm the page before transcribing.

    The prose of journal page 611 also states, in words, an average deviation of
    +/- 25 % for Equation (1) over the 284 points and +/- 34 % for Narsimhan's
    over the 267. Those two numbers are recorded here in the notes below rather
    than in the CSV, because they are not columns of the printed table.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-08-02
  estimated_error: >
    None beyond the printed precision. The three row entries carry three
    significant figures; the two overall entries are printed as bare integers,
    46 and 34, with footnote markers.

columns:
  - {name: row, unit: "-", description: "row index in the printed table, top to bottom"}
  - {name: particle_characteristics, unit: "-", description: "the printed row label"}
  - {name: n_points, unit: "-", description: "printed 'No. of data points'; blank on the overall row, where the two columns use different bases (267 and 284)"}
  - {name: std_dev_narsimhan_pct, unit: "%", description: "standard deviation of Narsimhan's correlations, per cent"}
  - {name: std_dev_eq1_pct, unit: "%", description: "standard deviation of Wen and Yu's Equation (1), per cent"}

notes:
  prose_average_deviations:
    equation_1_pct: 25
    narsimhan_pct: 34
    note: >
      Stated in words on journal page 611 as "an average deviation of +/- 25 %"
      and "an average deviation of +/- 34 %", alongside the standard deviations
      of 34 % and 46 % that appear in the table. The paper does not define
      either statistic.
  footnotes:
    star: "Calculation based on 267 data points."
    dagger: "Calculation based on all the 284 data points."

licence_note: >
  Numerical values are facts and are not protected by copyright (Feist, 1991);
  extraction for scientific research is covered by Art. 15n Auteurswet
  (DSM Art. 3). No page image or figure is reproduced.

caveat: >
  TIER 6 - the authors' own reported statistics, not measurement. Reproducing a
  number in this table is reproduction, never validation. The one genuinely
  checkable thing in it is internal: the three row entries and their point
  counts should pool to the printed overall, and the page checks exactly that,
  for the Narsimhan column where the basis is stated.
