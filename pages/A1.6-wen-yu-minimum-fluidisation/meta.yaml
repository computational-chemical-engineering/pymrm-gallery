adds: >
  Nothing to the correlation, and the page says so in the section where a reader
  would expect a solver. Equation (1) is the positive root of a quadratic, the
  unapproximated Ergun balance is the positive root of another, and no operator,
  grid or Newton solve appears anywhere. Sections 1 to 5 would run with pymrm
  uninstalled, exactly as on A1.1 and F1.4. What the reimplementation adds is
  four things, none of which is a solver.

  The derivation, made explicit and made falsifiable. This communication says
  eq. (1) came from the Ergun equation and prints the two approximations, but the
  algebra between them is in a companion paper that is not on disk. Doing it
  recovers 33.7 and 0.0408 to -0.08 % and +0.04 %, and every alternative reading
  of the inputs moves the answer by tens of per cent - which fixes, from the
  outside, which friction-law constants the correlation encodes. The same table
  states the limit: it cannot separate 150 from A1.1's refitted 151.9.

  The effective particle. Equations (2) and (3) are usually quoted as two
  independent conveniences. They are not independent: together they determine
  phi_s = 0.669 and eps_mf = 0.474 uniquely, which is not a sphere; and forced
  onto a sphere they contradict each other by 8.4 % in eps_mf, with the branch
  that survives into the viscous term sitting at 0.383, below the paper's own
  stated eps_mf floor. That single number is the whole explanation of the
  measured bias, and it is computed here rather than asserted.

  The error budget, split, using A1.1's refit of Ergun's own constants to Ergun's
  own figure - and split ONE LIMIT AT A TIME, because the two costs move in
  opposite directions across the range. The voidage approximation is 28.9 % in
  the viscous limit and 1.9 % in the turbulent one at eps_mf = 0.42; the
  friction-law uncertainty is 1.3 % viscous and 1.6 % turbulent. Like for like
  that is 22.7x at the viscous end and 1.21x at the turbulent end, where the two
  are the same size. Neither the asymmetry nor that crossover is visible from the
  form of eq. (1), and both are what a reader needs in order to set a design
  margin: expect underprediction for fine powders, and for coarse ones expect an
  answer no better than Ergun's own constants are known.

  A measurement the correlation never saw, and a contradiction inside it. The
  paper contains no data - the 284 points exist only as scatter in its Figure 4,
  which was deliberately not digitised. Geldart's Table 1, already in the gallery
  for A1.7, supplies 21 measured u_mf from another laboratory seven years later.
  Inverting the unapproximated balance on the eight spherical cuts asks what
  voidage would reproduce them, and the answer sits in the same band as the
  literature values Wen and Yu quote and above the one their correlation uses.
  That inversion is a reparameterisation of the bias, not an independent
  corroboration - it shares phi_s = 1, the sizes, the gas properties and Ergun's
  k1 with the thing it is compared to - and the page says so. Its one falsifiable
  element is whether the demanded voidage is physically sensible, and there the
  same table supplies contrary evidence: Geldart's own reported bed voidage is
  higher (0.444 on two rows where U_MB = U_0 and H_MB/H_0 = 1.000, so no
  inference is needed at all), and at that voidage the unapproximated balance
  overpredicts his velocities by 58 % - worse than eq. (1) underpredicts them.
  What this page adds is that both numbers are computed from the same table, on
  the same page, with neither hidden and neither resolved. A1.7 named this
  comparison as its own obvious next move; this is it.

agreement: >
  Two kinds, kept apart. The internal one is a reconstruction of the authors'
  algebra that recovers their two printed constants to -0.079 % and +0.040 %, and
  a pooling identity inside their Table 1 that closes to 0.5 % on the column
  whose basis the footnotes state.

  The experimental one is Wen and Yu's equation (1) against 21 minimum
  fluidization velocities Geldart measured in 1973 and they never saw: bias
  -17.4 %, MAD 33.3 %, rms 38.1 % over all rows, against their own claimed
  +/- 25 % average and 34 % standard deviation. The paper defines neither
  statistic, and the comparison flips with the definition: rms about zero is
  38.1 % (worse than their 34 %), a standard deviation about the mean is 33.9 %
  (an exact match). Both are printed. On the eight spherical cuts, where the
  density is printed exactly and the diameter definitions coincide IF Diakon is
  a perfect sphere, it is low on every row, by 25.2 % on average and by anything
  from 5.5 % to 54.5 % row by row. Davies and Richardson's competing expression,
  which A1.7 uses, is -0.75 % biased on the same eight rows with MAD 15.8 %,
  against a 14.7 % floor set by refitting a single constant to those rows.

  Two things must be read beside those numbers and are on the page, not in a
  footnote. FIRST, the unapproximated Ergun balance is not a settled reference
  here. At the per-row voidage those cuts demand it is unbiased BY CONSTRUCTION,
  which is not a check that can fail; at the bed voidage Geldart himself reports
  it is +58 % biased, including +47.5 % and +61.1 % on two rows where he prints
  U_MB = U_0 and H_MB/H_0 = 1.000 so that eps_mf = eps_MB = 0.444 needs no
  inference. Which of those is right is left open. SECOND, phi_s = 1 for Diakon
  is an assumption read off six words of prose, and the headline scales as
  phi_s^-2 while the reference does not move with phi_s at all: 0.95 gives
  -17.2 %, 0.90 gives -7.8 %, and 0.864 would erase the bias entirely.

  Read the deviation numbers with the resolving-power result beside them too:
  every row is at (N_Re)_mf below 0.83, where eq. (1)'s inertial term contributes
  at most 1.22 %, and section 3 shows that is the corner of the correlation's
  range where the approximation is worst. The measured result is a verdict on the
  viscous half of equation (1) and on nothing else.

caveats: >
  THE CATALOGUE CITATION POINTS AT A DIFFERENT PAPER. A1.6 was catalogued as
  "Chem. Eng. Prog. Symp. (1966)". That is a real Wen and Yu paper of the same
  year - it is this communication's reference 23 - and it contains the
  derivation, but it is not on disk and was not consulted. The page is built from
  the A.I.Ch.E. Journal communication, 12(3) 610-612. The correction is recorded
  in reference.note and in origin_not_consulted, and both citations appear on the
  page.

  THE DERIVATION IS RECONSTRUCTED, NOT TRANSCRIBED. The communication states that
  eq. (1) was obtained "by employing the fixed-bed pressure drop equation of
  Ergun" and cites Ergun and Orning, Ind. Eng. Chem. 41 (1949) 1179 - a paper
  also not on disk - but prints neither that equation nor the algebra. The Ergun
  constants used here are Ergun's 1952 pair, read on A1.1, and the sphericity is
  written into the Ergun form as D_p = phi_s d_p, which is a convention this page
  adopts and neither paper states. The evidence that this is what Wen and Yu did
  is the recovery of both constants to under 0.1 %, which is strong and is
  circumstantial.

  NOTHING IN FIGURE 4 WAS CHECKED. The 284 points behind every statistic the
  paper reports exist only as scatter in that figure and were not digitised; the
  routes taken instead are all higher up the ladder in docs/agent-brief.md.
  Table 1 is the authors' own arithmetic and reproducing anything in it would be
  reproduction, not validation - the page checks it against itself instead.

  THE MEASURED COMPARISON DOES NOT TEST THE SHAPE-FACTOR CLAIM, which is
  eq. (1)'s main selling point. That would need non-spherical powders with a
  known phi_s, and neither paper supplies one. Geldart's two cracking catalysts
  have no printed sphericity, so on their 13 rows his surface/volume d_sv is
  substituted for Wen and Yu's volume-equivalent d_p; since d_sv = phi_s d_p this
  UNDERSTATES d_p and therefore the predicted velocity, by an amount that is not
  known. The direction is stated, no correction is applied, and the headline is
  taken on the eight Diakon rows. Both catalyst densities are printed by Geldart
  as approximate ("~= 1", "~= 1.5") against Diakon's exact 1.18; the spent
  catalyst in particular has measured velocities so low for its stated density
  that BOTH correlations overpredict it badly, which is a property of those six
  rows and not a result about either. Three catalyst rows are also finer than the
  smallest particle eqs. (2) and (3) were fitted over.

  AND THE SAME GAP REACHES THE HEADLINE ITSELF: phi_s = 1 FOR DIAKON IS AN
  ASSUMPTION, NOT A MEASUREMENT, AND THE REPORTED NUMBER IS A STRONG FUNCTION OF
  IT. It is read off Geldart's section 4.2 sentence "a plastic moulding powder
  having spherical particles", verified on a 600 dpi render of journal page 287;
  he prints no numerical sphericity anywhere. Because eq. (1) is built on
  d_p = d_sv/phi_s while the unapproximated reference is exactly phi_s-free, the
  headline moves as phi_s^-2 and the reference does not move at all: the break
  table gives -25.2 % at phi_s = 1, -17.2 % at 0.95, -7.8 % at 0.90, and
  phi_s = 0.864 would account for the whole bias. An ordinary 0.95 for sieved
  suspension-polymerised beads removes a third of the headline. The measured
  verdict is therefore a JOINT test of the voidage approximation and of Diakon's
  sphericity, and nothing on the page separates them; the number is quoted at
  phi_s = 1 with that sensitivity printed beside it, not with an error bar it
  does not have.

  THE UNAPPROXIMATED ERGUN BALANCE IS NOT A SETTLED REFERENCE ON THIS DATASET,
  AND THE PAGE'S OWN DATA SAY SO. Geldart's Table 1 prints eps_MB and H_MB/H_0;
  on the two coarsest Diakon cuts it prints U_MB = U_0 and H_MB/H_0 = 1.000, so
  minimum bubbling is minimum fluidisation at the settled height and
  eps_mf = eps_MB = 0.444 with no inference at all - against 0.3994 and 0.3891
  from the inversion on those same rows. At the printed eps_MB the exact balance
  is +58.4 % biased over the eight rows (+47.5 % and +61.1 % on the two clean
  ones); at the settled eps_0 it is +42.1 %. Both are worse than eq. (1)'s
  -25.2 %, in the other direction, and sphericity cannot explain it because the
  exact Ergun u_mf written in d_sv is exactly phi_s-independent. The page
  therefore does NOT claim that the bias belongs to eqs. (2) and (3) rather than
  to the Ergun equation: it reports the inverted voidage, the reported voidage,
  and the fact that nothing here chooses between them. Caveat alongside: Geldart
  states a measurement method for U_0 and U_MB only, and A1.7's data sidecar
  records eps_MB and H_MB/H_0 as REPORTED, method unstated - but they are the
  only bed voidages either paper prints.

  THE ALGEBRA/MEASUREMENT "CLOSURE" IS A REPARAMETERISATION, NOT AN INDEPENDENT
  AGREEMENT, and the page labels it as one. Inverting a measured U_0 for the
  voidage the same balance needs is a change of variables on that measurement:
  the gap between eq. (2)'s 0.383 and the inverted value IS the deviation, by
  construction, for any data whatsoever, and both sides use phi_s = 1, the same
  d_sv/mu/g/drho and Ergun's k1 = 150. Its only falsifiable content is whether
  the demanded voidage is physically plausible, which the previous caveat puts in
  doubt. Davies and Richardson's -0.75 % is not independent corroboration either:
  its constant 1250 corresponds to k1(1-eps)/eps^3 at eps = 0.413, essentially
  the voidage the dataset demands, which is why the page frames it as a null
  baseline already at the one-parameter floor rather than as a second witness.

  THE INERTIAL HALF OF EQ. (1) IS UNTESTED HERE and this is the page's largest
  blind spot. Every measured row is a group A powder at (N_Re)_mf below 0.83; the
  inertial term contributes at most 1.22 %, and changing the turbulent constant
  by a factor of four in either direction moves the reported bias by less than
  0.9 points. Section 3's finding that the approximation is at its BEST in the
  turbulent limit is algebra against the Ergun equation, not a measurement, and
  the page says so where it is stated.

  rho_f = 1.2e-3 g cm-3 is not printed by either paper; it is air at ambient,
  inherited from A1.7. The break table measures its influence - 0.08 points on
  the reported bias if it is dropped from the density difference, 0.28 for a
  decade error - and the page therefore makes no claim about it rather than
  presenting insensitivity as a result.

  THE SIZE TREND IN THE DIAKON RESIDUALS IS REPORTED, NOT EXPLAINED. The viscous
  constant each cut demands rises with size (Spearman rho = +0.833, p = 0.010,
  n = 8) - rises, not monotonically: the printed sequence 752/1091/1330/1079/
  1389/1274/1429/1581 has two reversals. Sphericity, cohesion at the fine end,
  wall effects and the voidage of a sieved cut all vary along that axis and
  nothing here separates them. It is why no standard error is quoted on the
  refitted constant, and it is also why the per-row deviations span a factor of
  ten rather than sitting at a constant offset.

  Nothing on this page is digitised, and no figure was traced. Every constant,
  equation and table value from Wen and Yu was read visually off 600 dpi renders
  of journal pages 610-612. THE PDF TEXT LAYER OF THIS SCAN OPENS WITH A
  DIFFERENT ARTICLE - a communication on activity coefficients whose notation and
  literature-cited block occupy the top of journal page 610 - and anyone
  re-extracting this paper must confirm the page before transcribing. Geldart's
  equation (3), his Table 1 rows and his mu and g were re-read from the source
  PDF for this page rather than taken on trust from A1.7.
