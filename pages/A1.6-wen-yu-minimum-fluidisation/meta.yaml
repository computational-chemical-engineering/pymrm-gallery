origin_not_consulted:
  authors: ["Wen, C. Y.", "Yu, Y. H."]
  year: 1966
  container: "Chem. Eng. Progr. Symposium Series No. 62, 62"
  note: >
    Reference 23 of the communication, cited there as the source of eq. (1).
    Not on disk. The derivation of eq. (1) from the Ergun force balance is
    therefore RECONSTRUCTED on this page, not transcribed; the evidence that the
    reconstruction is the authors' is that it recovers 33.7 and 0.0408 to
    -0.08 % and +0.04 %.

validation:
  - "the derivation is reconstructed and recovers the printed constants: substituting eqs. (2) = 11 and (3) = 14 into the Ergun force balance with Ergun's printed 150 and 1.75 gives 24.5 Re^2 + 1650 Re = N_Ga, whose positive root is eq. (1) with C1 = 33.6735 against a printed 33.7 (-0.079 %) and C2 = 0.040816 against a printed 0.0408 (+0.040 %). Wrong readings of the inputs move the constants by at least 19.9 % (253 times the deviation of the reading used), but A1.1's refit of Ergun's constants moves them 4.4 %, so the check resolves 150 from 180 or 154 and not from 151.9"
  - "eqs. (2) and (3) pin the effective particle down uniquely (pymrm.checks.find_roots on the paper's phi_s range): eps_mf = 0.474 at phi_s = 0.669, not a sphere. Forced to phi_s = 1 they demand 0.383 (eq. 2) and 0.415 (eq. 3), 8 % apart"
  - "the cost of the approximation against the unapproximated balance, in closed-form limits, depends on the voidage: at eps_mf = 0.42 eq. (1) is 28.9 % low in the viscous limit and 1.8 % low in the turbulent one; at 0.385 and 0.386 the turbulent end is the worse one (high by about 11 %). The viscous end is the worse one at 3 of the 5 voidages the paper quotes. Like for like at 0.42, the voidage cost outweighs the uncertainty in Ergun's constants (A1.1's refit) by 22.7 times in the viscous limit and 1.17 times in the turbulent one"
  - "Wen and Yu's Table 1 against itself: the Narsimhan column pools to 46.24 % against a printed 46 %; the Equation (1) column does not close on the printed counts (negative variance, -1572), which does not show the column is unreachable"
  - "EXPERIMENTAL. Equation (1) against 21 minimum fluidization velocities Geldart measured in 1973: bias -17.4 %, MAD 33.3 %, rms 38.1 % against the authors' claimed 25 % average and 34 % standard deviation; the paper defines neither statistic, and a standard deviation about the mean is 33.9 %. On the 8 spherical Diakon cuts it is low on every row, by 25.2 % on average (-54.5 % to -5.5 %). Davies and Richardson's eq. (3) is -0.75 % biased there with MAD 15.8 %"
  - "phi_s = 1 for Diakon is an assumption read off six words of prose and the headline depends on it: -25.2 % at 1, -17.2 % at 0.95, -7.8 % at 0.90, and 0.864 would erase it"
  - "the inversion for the voidage the exact balance needs (median 0.409) is a reparameterisation of the bias. Geldart's reported eps_MB = 0.444 needs no inference on two rows and there the exact balance is +58 % biased over the eight rows, worse than eq. (1). Which reading is right is left open"
  - "every measured row is at (N_Re)_mf below 1, so the dataset tests the viscous half of eq. (1) only"
  - "every claim has a break row (unit errors, a wrong column, shifted rows, wrong constants, a wrong sphericity) that fails it"

adds: >
  To the correlation, nothing. The page uses pymrm.checks.find_roots for its
  five crossings (the effective particle, the sphere voidage of eq. 2, the
  voidage each Diakon row demands, the voidage hidden in Davies and Richardson's
  constant, the sphericity that erases the bias); it raises unless exactly one
  root is found. The reimplementation adds the explicit derivation, the
  effective particle, an error budget split by limit and by voidage, and a
  comparison with 21 held-out measurements together with the contrary evidence
  in the same table.

agreement: >
  Internal: the reconstruction recovers the two printed constants to -0.079 %
  and +0.040 %. Experimental: bias -17.4 %, MAD 33.3 % and rms 38.1 % over 21
  rows, -25.2 % on the 8 Diakon rows, with the sphericity and voidage caveats
  above.

caveats: >
  The catalogue citation points at the companion paper (reference 23), which was
  not consulted; the page is built from the A.I.Ch.E. Journal communication. The
  derivation is reconstructed. The Ergun constants are the 1952 pair read on A1.1,
  with sphericity written in as D_p = phi_s d_p, a convention. Nothing in
  Figure 4 was checked or digitised. The measured comparison does not test the
  shape-factor claim, the inertial half of eq. (1), or sphericity (phi_s = 1 is
  assumed). rho_f is not printed by either paper. The unapproximated Ergun
  balance is not a settled reference on this dataset. The PDF text layer of the
  communication opens with a different article; confirm the page before
  transcribing.
