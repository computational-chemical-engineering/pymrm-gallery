validation:
  - every equation transcribed from 600 dpi renders of Weisz and Hicks (1962), journal pages 265, 267, 268, 269, 272 and 273, because the scan's text layer renders eq. (1) as "$:$<I" and eq. (10a) as "expCrBK1 + LOI"; references [5] and [9] read from the literature-cited block on journal page 274, which prints no chapter title for [5] and so none is given on the page
  - the shooting reference reproduces the closed-form isothermal effectiveness factor below 1e-9 over three geometries and seven states each, on an integration-tolerance ladder; this licenses every branch result, because the branch tracer is the only route to the unstable middle branch
  - pymrm (exact Jacobian through construct_coefficient_matrix, newton with stagnation and bounds, every solve required to report success) reproduces the same closed form to 8.3e-06 on 400 cells, observed orders 2.00 to 2.97 over the twelve cases with phi_0 > 0.1 on 100 to 200 cells (phi_0 = 0.1 is left out of the orders: its error is within a factor 1e2 of the round-off of eta), each order backed by a bound that the finest-grid error is at least 1e3 times that round-off
  - pymrm reproduces the shooting solution in the non-isothermal case to 5.0e-05 on 800 cells over 18 branch states including unstable ones, observed orders 1.98 to 2.03 from 200, 400 and 800 cells over the ten states with |eta - 1| > 0.1, with the finest difference at least 1e3 times the round-off of eta; the two share only the algebraic rate law
  - the Phi = 1 threshold located by a find_roots scan on pymrm agrees with the closed form to 1.1e-07, and pymrm seeded on every Phi = 1 state of the shooting branch agrees for five rate laws to 2.0e-07
  - "three printed statements reproduced and used as inputs to nothing: the worked gamma = 20, beta = 0.3 case gives phi_0 = 0.099491 against the paper's 'phi_0 ~ 0.1'; the multiplicity onset, located as the cusp of the branch, is beta*gamma = 4.91 to 5.56 against the paper's 'beta*gamma >~ 5'; and Q'/Q falls monotonically from 1 to 0.5005 over phi_0 = 1e-3 to 1e3 against the paper's 'between Q and Q/2'"
  - "a break table of one injected defect per row (wrong geometry index, a 3-cell grid, a 1 % rate error, a first-order surface-gradient read, a misread exponent, coarse branch traces, ladder-read turning points, interpolated etas); every claim but one structural identity is failed by at least one row"
  - "the flux/volume form of eq. (11) is the volume-weighted residual of the solve, not a second route: it catches a 1 % rate mismatch and a stopped newton and is blind to a wrong geometry index and to a 3-cell grid, as the break table shows"

adds: >
  Nothing to the criterion or to Weisz and Hicks' extension of it; both are
  reproduced as printed. What is added is the part left as an order of
  magnitude. What Phi < 1 guarantees, computed exactly: eta = 0.9353 for a
  first-order sphere, 0.6948 for a slab; the spread across geometries falls
  from 0.240 to 0.132 on the volume-to-surface length. Across kinetics on one
  shape it runs from exactly 1 (zero order, where eta = 1 identically up to
  Phi = 6) through 0.8796 (second order) to 1.0483 for a self-inhibited
  Langmuir-Hinshelwood rate, where eta exceeds 1 with no heat effect. A
  false-negative map over the exothermic plane: eq. (1) admits eta up to 3136,
  eq. (10a) passes none of the unclean measurements and holds eta within
  1.3 % of 1 at its threshold, paying with a conservatism up to a factor
  1.0e+05 in Phi. Applied to an endothermic pellet eq. (10a) inverts: its
  threshold is reached only at eta of 0.29 or less, and it passes 369 of the
  384 unclean endothermic measurements. A quantitative limit on the paper's
  Section V claim that the observable "has removed the multiplicity": it
  postpones it, from beta*gamma = 4.91 to 5.56 in phi_0 to 10.84 to 21.74 in
  Phi, so Phi is multivalued in 4 of the 32 swept cases, inside the range the
  paper says it computed. Every fold sits below Phi = 1 (largest turning
  point 0.8055), inside the band eq. (1) certifies as safe; Phi = 1 keeps a
  unique root in 32 of 32. The 14 ambiguous measurements on the page's grid
  all have Phi < 1, the worst admitting eta from 2.19 to 220 (a factor 100.7).
  One of the four panels of Fig. 7 draws a curve in the folded regime
  (gamma = 40, beta = 0.3); its fold spans 6.9 px on a 600 dpi render against
  a 6 to 7 px stroke, so the figure neither shows the fold nor rules it out.
  A limit on the claim, not a refutation: the criterion works everywhere the
  authors apply it.

agreement: >
  Not applicable in the experimental sense: tier 6. The checks with resolving
  power are the two solver comparisons: pymrm against the exact isothermal
  effectiveness factor, 8.3e-06 on 400 cells at second order, and pymrm
  against the shooting reference over 18 non-isothermal branch states,
  5.0e-05 on 800 cells at second order. The shooting reference matches the
  closed form below 1e-9. The Phi = 1 threshold agrees between pymrm and the
  closed form to 1.1e-07 and between pymrm and the shooting branch across
  five rate laws to 2.0e-07. Three printed statements are reproduced:
  phi_0 = 0.099491 against "phi_0 ~ 0.1", multiplicity onset at
  beta*gamma = 4.91 to 5.56 against "beta*gamma >~ 5", and Q'/Q between 1 and
  0.5005 against "between Q and Q/2". Everything else on the page is a
  prediction rather than an agreement, and is labelled that way.

caveats: >
  Provenance tier 6 and NOT experimental validation. Neither source reports a
  measurement. Weisz and Prater (1954) itself was not consulted (no copy on
  disk, no open-access route, pre-DOI), so every equation is transcribed from
  Weisz and Hicks (1962) as printed. Weisz and Hicks attribute eq. (1) to
  their reference [9], Weisz, Z. Phys. Chem. 1957 11 1, which was also not
  consulted; reference [5], Weisz and Prater 1954, is named and used in the
  same paper for the shape-insensitivity of eta(phi) and for the Q'/Q
  relation. Two quantities are measured off the 600 dpi render of
  Fig. 7(d), one decade of the Phi axis (357.9 px) and the printed curve
  stroke (6 to 7 px), only to establish resolving power; no curve is
  digitised and no value is read off an axis, so the tier is still 6. That
  measurement supports a negative conclusion only. Two non-isothermal states
  with phi_0 > 30 are left out of the pymrm-versus-shooting comparison: the
  uniform grids do not resolve their boundary layer (eta off by 0.94 on 800
  cells at phi_0 = 4.8e4). Where eq. (10a)'s endothermic threshold lies beyond
  the traced branch, eta there is the boundary-layer limit of the branch. The
  confusion counts depend on the grid of synthetic measurements and are
  secondary to the continuous quantities. The film-free, steady,
  single-reaction, constant-property assumptions are carried without test
  here; the film and transient breakdowns are on B1.6. Gamma is held fixed
  while phi_0 varies, which is what the printed Q'/Q relation assumes.
