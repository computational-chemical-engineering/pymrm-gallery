# Page metadata. Validated against models.yaml by scripts/check_metadata.py.
# models.yaml is canonical; this file must not contradict it.
id: A3.3
slug: danckwerts-surface-renewal
title: "Danckwerts surface renewal"
section: A
status: published
tier: T0
priority: P1
structures: [S4]
phases: [gas-liquid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "3.3.0"
runtime_seconds: 200
datasets:
  - danckwerts-1951-printed-numbers.csv

validation:
  - >-
    All six numerical statements in the paper's running text reproduce. Three are
    looser than they look and the page says so rather than rounding them away:
    the equivalent saturated layer is 2.141 mm against "about 2 mm" (+7 %), the
    depth-of-penetration coefficient is 3.6428 against the printed 3.6 (+1.19 %),
    and the depth at 1 hour is 6.83 mm using the paper's OWN 3.6 against "about
    6 mm" (+14 %). Both of his millimetre figures sit below what his own formula
    gives, so both are roundings down: 2.141 to "about 2" is ordinary rounding,
    while 6.83 to "about 6" is a truncation where rounding would have given 7.
    The falling-film criterion gives L = 0.05097 against "about 0.05" (+1.9 %).
    The truncated age average is short of sqrt(Ds) by 8.33 % at s*theta_c = 1.5
    ("within 10 %" holds; the exact 10 % point is 1.3528), and surfaces older
    than 0.33 s carry 6.93 % of the rate ("less than one tenth" holds).
  - >-
    The pymrm transient element (operators from construct_grad and
    construct_div, assembled once and kept in banded form; backward Euler on age
    steps uniform in sqrt(theta), Richardson-extrapolated in the step), averaged
    over ages by eq. 7, reproduces eq. 8 to 4.0e-5, eq. 10/30 to 1.6e-5 and
    eq. 12/34 to 3.9e-5 relative (raw at 1600 steps, eq. 8 is 6.8e-4 off). Each
    of these deviations, and those of the four finite layers against coth z, is
    the grid error plus the extrapolated step error to below 3e-8; for the three
    closed forms the grid error is at least 10 times the step error. The two
    routes share the equations, not the arithmetic.
  - >-
    Both axes refined, orders from successive differences of three levels
    (pymrm.checks.observed_orders): 0.99 to 1.00 in the age step (backward
    Euler), 2.0 for the extrapolated pairs, and 2.00 in the grid (stretched by
    e^10 from surface to base). Raw, the step error dominates (6.4e-4 at 1600
    steps against a grid error of 3.9e-5 on 400 cells); every production value is
    extrapolated in the step, and then the grid error is what is left (the
    extrapolated step error is below 1e-6). The grid ladder's limit agrees with
    sqrt(Ds) up to the step error of its own pair, so the finite depth and age
    range of the element are invisible.
  - >-
    The surface flux that enters the age average is the discrete mass balance;
    compute_boundary_values reads the same flux at the surface face, and the two
    agree to below 1e-8 on a deep element, a reacting one and a layer over a
    well-mixed bulk. The gap is the volume-weighted residual of the banded solve,
    not a second solution. A Dirichlet base instead of the no-flux one changes
    the reacting element's rate by less than 1e-9 at 45 diffusion lengths and by
    -2.3e-3 on an element 3 deep (same grid). Reading the base outflow of the layer from the last
    cell centre instead of the face breaks it, as do the first-cell-centre read
    at the surface and a balance without the reaction.
  - >-
    A PRINTED DEFECT IN EQ. 25, proved from the paper's own equations and
    reported rather than repaired. Eq. 25 prints its exponent as kG^2 theta / HD
    while the erfc argument in the same equation is (kG/H) sqrt(theta/D), and
    eq. 29, which eq. 25 cites, fixes it at k^2 theta / D with k = kG/H. Eq. 9 is
    eq. 25's own special case, so the corrected form must reproduce it at every
    (H, kG/H): over a 15-point sweep it does to below 1e-13 with the quadrature at
    a relative tolerance of 1e-12, while the printed form reproduces it nowhere,
    its closest approach being 4.2 % off. Divergence is conditional: the printed
    integrand behaves as exp{[k^2(H-1)/D - s]theta}/sqrt(theta), so it diverges
    only where k^2(H-1) > sD, at 7 of the 15 points.
  - >-
    Eq. 36's illustration is 6 % optimistic. At the printed c0'/c* = 50 the
    paper's own ratio expression gives 0.94186 where eq. 36 demands more than
    0.95; the exact threshold is 53.01. The printed closed form and a quadrature
    of eq. 31 agree to below 1e-13, which certifies the two transcriptions
    against each other.
  - >-
    THE CASE DANCKWERTS SAYS HE COULD NOT SOLVE. The second-order pair (two
    fields, an analytic Jacobian of the pointwise source checked against central
    differences, one newton solve per age step with success checked) is solved
    directly and extrapolated in the age step and in the grid. At his own
    illustrative point (r'c0'/s = 1, c0'/c* = 50) the pseudo-first-order
    substitution is in error by +0.210 % (+0.313 % raw at 250 cells and 400 steps,
    +0.220 % extrapolated in the step only). It reaches 10 % at c0'/c* = 0.856
    (root-found), so eq. 36's demand of 53 is conservative by a factor of 62 in
    the concentration ratio. It is below 1 % only from c0'/c* = 25 upward of the
    sweep (1.04 % at 10). A case whose answer is known exactly (c0'/c* = 1e6,
    answer sqrt(2)) shows the solver at 250 cells and 400 steps inventing
    +0.1006 % raw and +0.0104 % after the step extrapolation, which is grid error,
    and below 0.002 % after both.
  - >-
    A SECOND ROUTE TO EQS. 15 AND 16. Driving r'c0'/s to 3000 in the second-order
    solver, which never forms beta and never evaluates an error function, lands
    on eq. 15 with beta from eq. 16 to within 0.48 % over three rows, all below
    it, and the deviation shrinks with r'c0'/s (4.15 % at 300, 0.146 % at 10000),
    the finite-rate approach to an instantaneous reaction. The rows are
    (D'/D, c0'/c*) = (0.5, 1), (1, 3) and (2, 1): at c0' = c* with D' = D eq. 16
    is symmetric in erf and erfc, so a row there could not see that
    transcription error; all three rows move under the swap. The eq. 15 to
    eq. 17 collapse at D = D' is an algebraic identity (below 1e-13) and is
    labelled one.
  - >-
    Break table of 84 rows, every non-structural claim failed by at least one,
    each defect injected through an argument, an input or a formula: the Robin
    sign flip, the base outflow
    read from the last cell centre (which alone moves the reacting element by
    +3.8 %), the reaction dropped from the flux balance, the age integral cut at
    the paper's s*theta_c = 1.5, the element truncated, the transcription traps
    (D read as 1e-3, the fraction as 1/10, eq. 16 swapped, eq. 25 as printed),
    the reagent frozen, eq. 31 without its second term, and the ladders broken.
    Four claims are structural (eq. 13 against eq. 12, and the exponents 1/2 of
    eqs. 8, 21 and 22, which differentiate closed forms that sqrt(D) factors out
    of). A break table measures sensitivity, not correctness; the closed forms,
    the known-answer case and the instantaneous limit are the second routes.

adds: >
  Three things, and one refusal.
  (1) The second-order reaction Danckwerts states "no solution has so far been
  found" for is solved directly, which turns eq. 36 from an assumption into a
  measurement: his 10 % bound holds, and the error reaches 10 % only at
  c0'/c* = 0.856, a factor of 62 below the 53 eq. 36 demands (+0.210 % at his own
  illustrative point, extrapolated in step and grid, and checked against a case
  whose answer is known exactly).
  (2) That same solver gives eqs. 15 and 16 a second route that can fail,
  because it reaches them without ever forming beta.
  (3) The film picture and surface renewal are two ends of ONE calculation. A
  layer of depth d over a well-mixed bulk, with the surface still renewed at
  rate s, gives kL = sqrt(Ds) coth(d sqrt(s/D)), a closed form the paper does
  not contain, whose limits are its eq. 8 (z to infinity) and eq. 1 with
  x_L = d (z to 0). The exponent n = dln kL/dln D = 1/2 + z/sinh(2z)
  interpolates: half-way between the theories at z = 1.089, within 10 % of 1/2
  only beyond z = 2.250. Danckwerts' own depth-of-penetration rule reads as
  z > 3.6, where n = 0.5054. pymrm reproduces coth z to 7.4e-6 across the
  crossover, its grid and step error.
  The refusal: the sqrt(D) exponent is the paper's discriminating prediction and
  NOTHING here tests it. The page maps where the exponent survives (any age
  distribution, any patchwork of s, a first-order reaction at fixed r: all
  exactly 1/2, because sqrt(D) factors out of eqs. 21 and 22) and where it does
  not (any resistance in series with the liquid), and shows why a test is
  impossible from this source.
  pymrm computes the operators (construct_grad, construct_div,
  construct_coefficient_matrix), the face fluxes (compute_boundary_values), the
  nonlinear steps (newton) and the checks (pymrm.checks.check_jacobian,
  observed_orders); the march, banded solves, extrapolations, age average and
  root searches are numpy and scipy, and the closed forms and quadratures are
  scipy.special and scipy.integrate.

agreement: >
  Six printed targets reproduced, worst +14 %, and that worst case is the
  paper's own rounding of its own formula, reported as such. Internal: pymrm
  against eqs. 8, 10/30 and 12/34 at 4.0e-5, 1.6e-5 and 3.9e-5, the grid error
  of 400 cells; against coth z at 7.4e-6; against eq. 15 in the instantaneous
  limit at 0.48 %, the finite-rate residue. Eq. 25 with H squared collapses onto
  eq. 9, eq. 36's closed form onto a quadrature of eq. 31, and eqs. 15 and 16
  onto eq. 17, each to below 1e-13, registered as bounds with break rows that
  fail them. Nothing is fitted.

caveats: >
  TIER 6, AND NOT EVEN REPRODUCTION OF A COMPUTATION: THE PAPER IS PURE THEORY.
  It contains no figures, no tables and no measurements, and Danckwerts says so:
  "No attempt has been made to compare the expressions derived here with
  published experimental measurements." Every target on this page is an
  arithmetic statement he makes about his own equations.

  THE PAGE CANNOT TEST THE sqrt(D) EXPONENT, WHICH IS THE THEORY'S ONLY
  DISCRIMINATING CLAIM. The single physical number in the paper, s ~ 5 s^-1, is
  obtained from published CO2/water coefficients that are not printed here, in a
  handbook that is not on disk. THAT THE CALCULATION IS THE INVERSION OF
  kL = sqrt(Ds) IS AN INFERENCE AND IS FLAGGED AS ONE, on the page and in the CSV
  sidecar: the paper says only "tentative values of s, calculated from published
  values of kL", and eq. 8 is the only relation in it joining the two. Film
  theory fits the same datum exactly as well by inverting kL = D/x_L: at
  D = 1e-5 cm2/s the two give kL = 7.07e-3 cm/s and x_L = 14.1 um, one free
  constant each, zero residual each. Separating them needs at least two solutes
  at the same hydrodynamics, the comparison Danckwerts recommends and does not
  perform, and the page computes how demanding that is (a factor 1.53 in D at
  5 % scatter, for a 3-sigma separation).

  TRANSCRIPTION PROVENANCE. pdfimages -list reports every page of this scan as
  CCITT-G4 bilevel at 300 ppi NATIVE, so the renders were made at 300 ppi. The
  two constants the PDF text layer gets wrong, the D = 1e-5 and the stacked
  1/100, were re-read on nearest-neighbour zoomed crops at that native
  resolution, where both are unambiguous.

  RECONSTRUCTED INPUTS, FLAGGED. The falling-film criterion L = l D mu / (g rho
  d^4) is checked with mu = 0.01 P, rho = 1.0 g/cm3 and g = 981 cm/s2. None of
  the three is printed anywhere in the article; "for water" is the whole
  specification. The printed 0.05 comes back to 1.9 %; a mis-read d exponent
  would move it by 1e4, and the PDF text layer's D = 1e-3 by 1e2.

  SCOPE. Whitman's two-film theory (A3.1) and Higbie's fixed-contact-time
  penetration (A3.2) are separate cases with separate sources, and neither is
  built here. Eq. 1 is used only as Danckwerts prints it; his "nonrandom packing"
  case, which reduces to a fixed contact time, is described without attaching a
  name, because this paper cites Higbie only for evidence on interfacial
  resistance. The three-way comparison is taken on A3.2, which holds all three
  sources at once.

  The pointwise element flux at very short ages is NOT converged (5 % at
  s*theta ~ 1e-3, 0.54 % beyond s*theta = 0.1, raw backward Euler) and no claim
  rests on it. What is converged is the age average, because the quadrature runs
  on the cumulative uptake, which is exactly zero at theta = 0.

  The error of the pseudo-first-order substitution at finite c0'/c*, its 10 %
  point and the instantaneous-limit residue have no second route: they rest on
  the second-order solver, checked at its two limits and refined in both axes.

  Two earlier Danckwerts papers are cited by this one and are NOT on disk and NOT
  consulted: Research 2, 494 (1949) and Trans. Faraday Soc. 46, 300 and 701
  (1950). Eqs. 29, 31, 35 and the error bound behind eq. 36 are quoted by the
  1951 paper from them; the 1951 text is the transcription source for all of
  them. They are recorded under origin_not_consulted in models.yaml.
