origin_not_consulted:
  - citation: "Langmuir, I., J. Am. Chem. Soc. 40, 1361 (1918); Trans. Faraday Soc. 17, 607 and 621 (1922)"
    note: >
      The origin of the isotherm, of the three surface-reaction mechanisms
      (the third being this page's), and of its application to CO oxidation
      on Pt. Read only as quoted by Prins (2018). J1.1 reproduces the 1918
      paper from its own text.
  - citation: "Rideal, E. K., Proc. Camb. Philos. Soc. 35, 130 (1939)"
    note: "The chemisorbed + physisorbed (van der Waals layer) proposal. Not consulted."
  - citation: "Eley, D. D. & Rideal, E. K., Nature 146, 401 (1940); Proc. R. Soc. Lond. A 178, 429 and 452 (1941)"
    note: >
      What Eley and Rideal actually studied (para-ortho H2 and H2/D2 exchange
      on tungsten). Not consulted; the case's naming finding rests on Prins's
      reading of them, and the page says so.
  - citation: "Eley, D. D., Q. Rev. Chem. Soc. 209 (1948); Adv. Catal. 1, 157 (1948)"
    note: "Eley's own attribution of the collision mechanism to Langmuir, quoted by Prins."
  - citation: "McNaught, A. D. & Wilkinson, A., IUPAC Compendium of Chemical Terminology, 2nd ed. (1997), p. 149"
    note: "The Gold Book's Langmuir-Rideal definition, quoted by Prins (p. 720)."
  - citation: "Mullins, C. B. & Weinberg, W. H., in Handbook of Heterogeneous Catalysis, vol. 3, p. 972 (1997)"
    note: "The 10^12-10^13 vs 10^9 flux comparison, printed by Prins (p. 716)."
  - citation: "Hougen, O. A. & Watson, K. M., Chemical Process Principles, Part Three (1947)"
    note: >
      NOT re-read for this page: the L-H law's derivation, the codimer data
      and the mechanism-(d) constants are imported from the published page
      C1.1, which read the book at native resolution and whose findings on
      the imported rows are listed in this page's data section.

