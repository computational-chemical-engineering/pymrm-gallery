validation:
  - eq. (19) against all 63 digitised Figure 11 markers, gas labels not used since the correlation has no gas-density term, and split at the excess velocity above which a marker is certainly inside the fitted window
  - the scatter checked against the sidecar's digitisation error, which explains about 0.1 percentage points of it
  - the same points against Wilkinson et al. (1992) at air density and, for the span, at each other gas, and the ratio of the two deviations compared with the ratio of Table 3's
  - the gas-independence claim tested by extrapolation, a free power law on the unlabelled markers used to predict the SF6 markers, with a standard error, against what Wilkinson implies for each possible light gas
  - every number the page states is a registered claim with a break row that moves it

adds: >
  Nothing to the correlation itself; the page is algebra and calls no pymrm
  operator. What it adds to the paper's argument is a measurement of what Figure 11
  can and cannot show. Eq. (19) describes the markers with a mean absolute deviation
  of 13.8 % and a bias of +2.8 %, 11.1 % and -2.1 % for the 33 markers certainly
  inside the fitted window. Wilkinson is biased high by 47 to 79 % whichever gas the
  markers are assumed to be, so its error is a level error. The SF6 markers sit
  11.7 % above a free power law fitted on the other markers, with a standard error of
  about 8 % in logs, and Wilkinson implies 6 to 17 % depending on which light gas the
  unlabelled markers are: the figure cannot separate gas independence from
  Wilkinson's weak dependence.

agreement: >
  Deviation is (model - measured)/measured throughout. Eq. (19) reproduces all 63
  digitised Figure 11 markers with a mean absolute deviation of 13.8 % (median
  11.0 %, worst 40 %) and a bias of +2.8 %, against the delta of 0.16 the authors
  report over their own larger set. Wilkinson evaluated at the same points, all at
  air density, is biased high by 64 % and deviates 4.6 times as far as eq. (19);
  Table 3 gives 7.8 times. The SF6 group cannot be compared with the rest by group
  bias, because the two occupy disjoint velocity windows. Tested instead by
  extrapolation of a free power law fitted on the 51 unlabelled markers, the 12 SF6
  markers sit 11.7 % above the extrapolation, 1.2 standard errors from zero, inside
  the 5.9 to 17.5 % that Wilkinson requires for the possible light gases.

caveats: >
  This is an algebraic correlation, not a discretised model; pymrm's operators play
  no part, and the page says so rather than inventing a PDE to justify them. The
  comparison rests on one figure of eleven, so it tests the shape of eq. (19) in one
  column and one liquid, and not the column-diameter or liquid-property claims, which
  are Figures 7 and 9. Marker shapes could not be read reliably in the dense band, so
  gas labels are carried only for the SF6 group, which the reviewer confirmed; see
  the dataset sidecar for the review findings. The SF6 markers all lie below the
  velocity window eq. (19) was fitted over, and the independence test cannot
  distinguish zero gas dependence from Wilkinson's. Wilkinson is evaluated at the
  plotted abscissa, which is what the figure caption prescribes but is not the same
  as running it end to end from operating conditions; F1.3 does that.
