dataset_id: nist-n-hexane-298k
title: "n-Hexane liquid density and viscosity at 298 K and the four pressures of the page"
status: complete

source:
  authors: ["Lemmon, E. W.", "Bell, I. H.", "Huber, M. L.", "McLinden, M. O."]
  year: 2026
  container: "Thermophysical Properties of Fluid Systems, NIST Chemistry WebBook, NIST Standard Reference Database 69 (eds. P. J. Linstrom and W. G. Mallard)"
  doi: "10.18434/T4D303"
  access: >
    Retrieved 2026-11-28 from webbook.nist.gov (fluid.cgi, ID C110543, isobaric data at
    298.000 K, 6 digits) at 0.101325, 0.31, 3.55 and 4.93 MPa. The values are those the
    WebBook prints for pure n-hexane.
  licence: "US government work (NIST Standard Reference Data); numeric values"

acquisition:
  method: transcribed
  tool: "the WebBook's tab-separated data output, copied digit for digit"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: >
    As stated by the WebBook for its reference correlations (density well under 0.5 %,
    viscosity a few per cent for the liquid); eq. 9 depends on them only as
    (mu_L rho_L^2)^(-1/9).

conditions: >
  External input of the page: the paper prints no liquid property and names its liquid
  "commercial grade hexane" (p. 2384). Pure n-hexane at 298 K stands in for it; the
  nitrogen dissolved at 3.55 and 4.93 MPa is not represented.

columns:
  - {name: p_MPa, unit: MPa, description: "absolute pressure"}
