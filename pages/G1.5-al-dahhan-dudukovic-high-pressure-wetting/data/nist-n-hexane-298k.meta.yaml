  - {name: rho_kg_m3, unit: kg/m3, description: "liquid density"}
  - {name: mu_Pa_s, unit: Pa s, description: "liquid dynamic viscosity"}

redistribution_basis: >
  Numerical property values; NIST Standard Reference Data, cited with its DOI.
