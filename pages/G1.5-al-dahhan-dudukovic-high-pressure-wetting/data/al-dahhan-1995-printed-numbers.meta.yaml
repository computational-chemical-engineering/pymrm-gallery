dataset_id: al-dahhan-1995-printed-numbers
title: "Constants, ranges, legend values and stated errors printed by Al-Dahhan and Dudukovic (1995)"
status: complete

source:
  authors: ["Al-Dahhan, M. H.", "Dudukovic, M. P."]
  year: 1995
  container: "Chemical Engineering Science 50(15), 2377-2389"
  doi: "10.1016/0009-2509(95)00092-J"
  access: >
    Publisher PDF (a 300 ppi scan with an OCR text layer) held outside the repository
    (~/papers/pymrm-gallery/). No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: transcribed
  figure: "eqs. 1 and 9, abstract, Tables 3 and 4, legends of Figs 4 and 5, pp. 2386-2387"
  tool: "page images rendered at 300 ppi (pdftoppm); every entry read from the image, since the text layer garbles formulas and digits"
  procedure: >
    Each number copied as printed (string, fractions kept), one row per number, with
    the place it is printed. Journal page N is PDF page N - 2376. Read the file with
    dtype=str.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: "none beyond the printed precision: half a unit of the last printed digit"

conditions: "As printed; Table 3 gives T approximately 298 K."

columns:
  - {name: name, unit: "-", description: "key used by the page"}
  - {name: printed, unit: "-", description: "the number exactly as printed (string)"}
  - {name: where, unit: "-", description: "equation, table or page (journal pages)"}
  - {name: meaning, unit: "-", description: "what the number is, with its unit"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3).
