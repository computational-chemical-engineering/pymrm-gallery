acquisition:
  method: digitised
  figure: "Fig. 7, journal p. 2387 (PDF page 11)"
  tool: "pdftoppm -r 300 (the native resolution of the scan); marker boxes from connected components of the thresholded image, touching markers separated by eye on pixel printouts; the solid line by its centre row in pixel columns away from the markers, the dashed line by the centroids of its six dashes; calibration and conversion by data/digitise.py (committed)"
  procedure: >
    Logarithmic eta_CE and L axes although the labels read linear: L ticks 0.5 (left frame,
    column 422.5), 1 (670.5), 2 (919.5), 3 (right frame, 1065); eta ticks 1 (top frame, row
    1274.5), 0.9 (1407), 0.8 (1554), 0.7 (1722), 0.6 (bottom frame, 1913.5). 358.6 px per
    unit ln L, 1251.3 px per unit ln eta; largest tick residual 0.37 px (L), 0.81 px (eta).
    4 open circles (exp. 0.31 MPa, 1.02 cm/s), 3 open squares (exp. 3.55 MPa, 8.75 cm/s); 13
    points of the solid line (pred. 0.31 MPa; residual SD 0.68 px about a straight line, 241
    columns) and 6 dash centroids of the dashed line (pred. 3.55 MPa).
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: >
    Markers +/-1 px, circles on the solid line +/-1.5 px; line rows +/-0.7 px, dash
    centroids +/-1 px (the sd columns, relative).

conditions: "Bed of extrudates; the cases 2 and 5 (3.55 MPa) of Fig. 5."

