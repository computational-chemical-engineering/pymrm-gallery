# Provenance sidecar. Schema: docs/data-strategy.md
dataset_id: larkins1961-printed-constants
title: >
  Every constant page G1.1 takes from Larkins, White & Jeffrey (1961), with the
  book page it appears on and the string as printed.

READ_THIS_FIRST: >
  THIS FILE IS THE PAGE'S TRACEABILITY LEDGER.  If a number is used on G1.1 and
  is not here and is not one of the three physical constants the page names
  (standard atmosphere, the Rankine offset, the centipoise), it is a defect.
  THREE (alpha, beta) PAIRS ARE PRINTED IN ONE SENTENCE on book p. 236 and only
  ONE of them belongs to the packing Tables 3 and 4 are for.  The Raschig-ring
  pair is (266, 2.33).  The sphere pair (118.2, 1.0) and the cylinder pair
  (150, 1.75) - the latter being Ergun's own, which the paper says its cylinder
  data agree with - are carried here for completeness and are NOT exercised by
  any printed data on the page.
  THE g_c ENTRY IS PRINTED WITH UNITS THAT DO NOT WORK.  Verbatim: "g_c =
  conversion factor, 32.17 pdl./lb.-mass in English units", while the same
  notation gives mu in lb-mass/(ft.-min.).  Eq. (17) then needs the conversion
  factor per MINUTE squared.  The page measures the factor Table 4 actually
  requires and gets 3600 back; it reports this and does not repair it.
  TABLE 2's PARENTHESES ARE TEMPERATURES AND THEY DIFFER WITHIN A ROW: air is
  "0.0808 (32)" for density and "0.0192 (80)" for viscosity.
  EQ. (23) IS PRINTED TWICE ON BOOK P. 237 WITH TWO DIFFERENT CONSTANT TERMS, and
  this file carries both because the page adopts neither.  `eq23_c0` is the
  typeset equation's; `eq23_c0_figure7` is the annotation printed inside
  Figure 7 on the facing column of the same page.  Every other coefficient
  agrees between the two printings, and so does the whole of Eq. (22), which
  Figure 7 also prints in full.  Both were read on 300 ppi crops enlarged to
  digit scale.  Figures 3, 5 and 6 carry the same curves but print only the
  labels "EQUATION (22)" and "EQUATION (23)", not the coefficients; each was
  cropped and read.

source:
  authors: ["Larkins, R. P.", "White, R. R.", "Jeffrey, D. W."]
  year: 1961
  title: "Two-Phase Concurrent Flow in Packed Beds"
  container: >
    AIChE Journal 7(2) 231-239 (1961); Table 2 and the packing paragraphs on
    book p. 233, the correlation constants on book p. 236, Eqs. (22) and (23)
    and Table 5 on book p. 237, the notation on book p. 239, the equipment
    description on book p. 232 and the pressure limit on book p. 234
  doi: 10.1002/aic.690070213

acquisition:
  method: transcription
  detail: >
    Each value read on a 300 ppi crop of its own page, enlarged.  The
    `printed_as` column carries the surrounding string so that a reader can
    find it without the PDF; where the scan's text layer and the crop disagreed
    the crop won, and the text layer is not the source of any digit here.
  ppi_native: 300
  ppi_used: 300
  figure: null

columns:
  quantity: "identifier used in the notebook"
  value: "the printed numeral"
  units: "units as printed, or '-' for dimensionless"
  book_page: "printed page number in AIChE Journal 7(2)"
  printed_as: "the string the value appears in, as printed"

review:
  verdict: not-required
  detail: "Nothing digitised."
