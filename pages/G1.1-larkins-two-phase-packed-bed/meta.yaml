id: G1.1
slug: larkins-two-phase-packed-bed
title: "Larkins two-phase concurrent flow in packed beds"
section: G
status: published
tier: T0
priority: P1
structures: [S3]
phases: [gas-liquid-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "3.3.0"
runtime_seconds: 35
datasets:
  - larkins1961-table3-measured.csv
  - larkins1961-table4-calculated.csv
  - larkins1961-printed-constants.csv

validation:
  - The paper's own worked example, redone. Table 4 is the authors' arithmetic on the eight Table 3 rows, and every column of it is recomputed from Eqs. (17)-(21) with the constants printed on book pp. 233 and 236. Over the seven rows that close, liquid Reynolds numbers agree to 0.174 % worst, delta_l to 0.218 %, delta_g to 0.416 % and delta_lg to 0.639 %.
  - The eighth row does not close, and it is reported rather than repaired. Run 5 has no gas, so Eq. (20) reduces to delta_lg = dP/dL; Table 3 prints 2.321 and Table 4 prints 2.469 for the same run. Taking Table 3's cell makes the two-phase parameter 0.9408, -5.92 % off unity, inside the 13 % scatter the paper prints for its correlation (run 160 at chi -> 0 is itself +0.90 % off unity); taking Table 4's requires Table 3's cell to be wrong. Run 5's 2.469 sits 0.081 % from Ergun's delta_l, 11.5 times closer than run 160's 0.93 %, but that is the same statistic read twice, and it is evidence only under the named hypothesis that Table 4's cell was back-computed. The page does not choose. Run 160 is not the same reduction with the phases swapped - nothing cancels there, and dropping the manometer correction alone moves it by +22.29 %.
  - A constant the paper never prints, recovered from its own two tables and checked out of sample. The air viscosity behind Table 4's Reynolds column is linear in temperature to 0.0259 % worst residual over seven rows, and extrapolated to 80 degF it lands 0.819 % from Table 2's printed 0.0192 cP (0.672 % once the offset measured on the liquid rows is removed).
  - The Reynolds column's systematic offset is inside the paper's own rounding. N_Re = 6G/(S mu); seven rows spanning a 28-fold range of mass rate agree on +0.1454 % to within 0.0515 points, which is exactly a specific surface of 148.22 against a printed 148.
  - Eq. (17) evaluated in two unit systems that share no expression agrees to round-off (below 1e-13), and the g_c factor Table 4 requires comes back as 3593.8 against 60^2 = 3600.
  - The average-pressure claim of book p. 236, proved and then measured. For one phase in horizontal flow delta_g = K/P exactly, so the arithmetic mean of the terminal pressures is an identity, confirmed at round-off (below 1e-11) against 1.12e-05 for the geometric mean of the same terminals.
  - With the two-phase correlation in the loop the identity goes. One section over a 4 ft bed is 0.332 % wrong in the pressure drop and the error reaches 1 % at 5.6012 ft, root-found on a bracket checked for monotonicity, on run 63, the largest-friction-loss row. Over every two-phase row of Table 3 the same length spans 5.6012 ft to 466.9537 ft; 1 of the 6 is inside the paper's 7-ft column and 4 inside its 40-ft commercial reactor. Sectioning converges at second order (observed 1.9999).
  - Three independent routes to the column profile - the paper's sectional march, pymrm finite volumes with the outflow outlet (first order, observed 1.0003), and z(P) by adaptive quadrature inverted by brentq. The Richardson pair (800, 1600) lands on the quadrature to 1.47e-08, 5.35 orders below the recipe error it measures, and that remainder is O(h^2) (observed order 2.00). The pymrm outflow solve equals a hand-written backward-Euler march to round-off and closes its own discrete balance (both below 1e-10).
  - The outlet condition measured. A zero-gradient outlet folds dP/dz = 0 into the flux operator ([..., -1/8, +9/8]), shortens the last step to 8/9 h, and its face value lands on the outflow solve to O(h^2); its last-cell value is 3.84 times closer to the quadrature by a cancellation of two O(h) errors (errors of opposite sign), and a balance written on it fails by 1.2e-3 of the pressure drop at 100 cells (pitfall P8).
  - A second printed defect, not repaired. Eq. (23) is printed twice on book p. 237 with constant terms -0.774 (typeset) and -0.744 (inside Figure 7), a 7.15 % shift in R_l. Against the six Table 4 rows inside the declared range the Figure 7 reading is better in r.m.s. (18.33 % against 19.55 %) and worse on the paper's "within 20 %" count (3 rows against 2), so the page adopts neither. Both put the ceiling below a full column (0.7730 and 0.7214) and both give a negative discriminant at R_l = 1.
  - Eq. (23)'s ceiling, root-found at chi = 256.010, beyond the upper limit of 30 the fit is declared for, at a liquid saturation of 0.7214; no chi makes the fit return a full column (discriminant -0.0618). This quantifies a caveat the paper prints.
  - Every number is a registered claim with a break-table row that re-runs the computation with one defect injected (a misread constant or table cell, a modelling choice, a numerical setting) and fails the claim's own check.

adds: >
  Nothing for the correlation itself: Eqs. (17)-(23) are arithmetic and the
  reproduction of Table 4 is plain NumPy. What pymrm buys is the question the
  1961 procedure could only answer by judgement. The paper's design outline
  (book p. 239, step 1) tells the reader to break a bed into sections "if the bed
  is of great length or the friction loss is large" without saying how long or
  how many. Written as dP/dz = rho_m/144 - delta_lg(P) and discretised with
  construct_convflux_upwind + construct_div + NumJac + newton, with the
  {"outflow": True} outlet read by compute_boundary_values, the same physics
  answers both: the one-section recipe is exact for a single phase in horizontal
  flow, reaches 1 % at 5.6012 ft with the two-phase correlation in the loop on
  Table 3's largest-friction-loss row (466.9537 ft on its mildest), and the
  sectional march converges at second order, so the number of sections for a
  target accuracy follows from one number. The assembly is also the point of
  entry for what the paper does not do - a reaction, a species balance, a heat
  balance.

agreement: >
  Deviation is (this page - printed)/printed throughout. The headline is the
  worked example: over the seven of eight runs that close, the liquid Reynolds
  column is reproduced to 0.174 % worst (0.147 % r.m.s.), delta_l to 0.218 %
  (0.176 % r.m.s.), delta_g to 0.416 %, and delta_lg - a measurement corrected
  by two densities - to 0.639 % worst and 0.260 % r.m.s. Run 5 is out by
  -5.99 % and is an inconsistency between the paper's two tables; it is excluded
  from every quoted figure and reported separately. The correlations are a
  goodness of fit and are labelled so: Eq. (22) is 25.53 % worst and 12.81 %
  r.m.s. against these rows, Eq. (23) 33.90 % and 19.55 % over the six inside
  its declared range. Eq. (22) beats the best single constant by 4.05 times in
  log units over eight rows, but two of those are the chi limits where it
  returns 1 for any constants; on the six rows that discriminate the gain is
  2.48 times and the r.m.s. 14.79 %, the figure to set beside the paper's 13 %.
  The column numbers are arithmetic, not validation: the paper reports no axial
  pressure profile.

caveats: >
  Data tier 2: Table 3's rates, pressures, temperatures, viscosities, pressure
  drops and saturations are measurements printed in a table; Table 4 is the
  authors' arithmetic on them. Reproducing Table 4 tests a transcription, a set
  of equations and a unit system against numbers the authors computed, not a
  model against nature. The only place a model meets a measurement is Eqs. (22)
  and (23) against Table 3, and that comparison is inside the correlations' own
  fit. No figure is digitised: the 600+ points behind the correlations are not
  tabulated, so nothing is said about the scatter of Figure 7, the foaming
  deviations of Figure 8, or the Lockhart-Martinelli comparison of Figure 9.
  Reference 4, Larkins's 1959 thesis, is not on disk; it is the support the
  paper gives for the average-pressure claim, and nothing here rules out that it
  addresses run 5. The column is a design calculation on run 63's rates at the
  printed 90 psig equipment limit, not a reproduction; run 63 is the extreme
  row, so the 1 % length is a worst case and the spread over all two-phase rows
  is printed. Three constants come from outside the paper (standard atmosphere,
  Rankine offset, centipoise). Only the Raschig-ring (alpha, beta) pair is
  exercised by data. The run-5 finding is an inconsistency, not a correction,
  and the CSV sidecars forbid reusing that row as a measurement.
