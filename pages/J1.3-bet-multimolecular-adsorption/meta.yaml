  - "THE PAGE'S SPINE IS A DISCRIMINATION, NOT A FIT, because the paper supplies the rival. Section I of Brunauer, Emmett & Teller is a quantitative refutation of de Boer and Zwicker's polarization theory, carried out before any BET algebra appears, and every input to it is printed. Reproduced chain by chain: 8.357 - 8.823 = -0.466 exactly, d = -0.466/(1 + 11.1 x 0.029) = -0.352523 against the printed -0.35, C = d (alpha/r^3) = -0.010223 against the printed -0.01, K1 = C^2 = 1.045e-4 against the printed 1e-4. Against that, Bradley's fitted k = 0.615 gives C = 0.989104 through eq. (1c) - the paper's own 0.99 - so the polarization theory needs an inter-layer dipole ratio 96.75 times larger than the polarizability of argon admits, and a per-layer binding-energy ratio 9361 times larger. Eq. (7) is confirmed symbolically to follow from eqs. (5) and (6), which the paper does not state"
