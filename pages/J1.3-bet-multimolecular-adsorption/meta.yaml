adds: >
  Nothing to the BET equation, and the page says so in the section where a
  reader would expect a solver. Equations (26), (28), (A), (B) and (E) are
  closed forms; there is no grid, no time step and no transport anywhere, and
  most of the page would run with pymrm uninstalled, exactly as on A1.6 and
  A1.1. What newton and NumJac do here is narrow and real, and it is four
  things.

  (1) A ROUTE TO THE ISOTHERM THAT SHARES NO ALGEBRA WITH THE ISOTHERM. Eq. (B)
  is two geometric series summed by hand in 1938. Solving the layer equilibria
  (10)-(12) for the occupancies and forming eq. (15)'s sums term by term is a
  different computation with the same answer, and it CATCHES a wrong closed
  form: mistyping the (n+1) in eq. (B)'s numerator moves the agreement from
  6.7e-16 to percent level. Exercised on every branch the paper uses, n = 1, 2,
  5, 6, 7, 20 and the infinite limit, at four relative pressures.

  (2) THE SAME TREATMENT APPLIED TO THE RIVAL THEORY, which is the point of the
  page. The polarization theory's closed form (1b) is quoted by BET from a paper
  nobody here has read, so the recursion (1a) is assembled and the decay ratio
  measured off the solution instead. That removes the dependence entirely, and
  it does something the closed form cannot: at k > 1/2 it SHOWS what goes wrong,
  the moments oscillating and the answer depending on where the ladder is cut,
  where eq. (1b) merely returns a complex number.

  (3) ROOT-FINDS WHERE A SWEEP WOULD HAVE BEEN WRONG - the inflection point, the
  c that maximises it, the c at which the single-point rule reaches exactly 5 %,
  and the continuous n behind each printed percentage. The break table carries
  the row that shows this matters, at its honest size: sampling the ceiling on a
  40-point log grid moves the ceiling only in the sixth significant figure
  (1.1546960 against 1.1547005) but moves c* by 1.4307 PER CENT (52.233451
  against 52.980761). The maximum is quadratic, so the location degrades far
  faster than the value, and it is the location a reader would quote.

  (4) AND ONE THING THAT IS NOT PYMRM AT ALL, and is the most useful output on
  the page: the ceiling v(x_infl) <= (2/sqrt(3)) v_m. It is not in the 1938
  paper and it converts the authors' strongest-looking corroboration - v_m
  agreeing with point B, a claim journal page 315 makes about the TWELVE
  isotherms of Table I and which the page extends to the eighteen non-butane
  pairs of Tables I and III - into a statement about the shape of their own
  equation. One-sidedly: it caps how far the knee can sit ABOVE v_m, not below.
  It needed a Lagrange condition and a root-find, not a solver.

agreement: >
  Against printed results, all reproduced from the paper's own inputs: the
  polarization chain (-0.466, -0.352523 vs -0.35, -0.010223 vs -0.01, 1.045e-4
  vs 1e-4, and 0.989104 vs the printed 0.99 from Bradley's k); the four surface
  statistics of Tables III and V (437.857 vs 440, 15.106 % vs 15 %, 506.286 vs
  500, 10.609 % vs 10 %, 707.714 vs 708, 8.720 % vs 9 %, 828.571 vs 829, 7.897 %
  vs 8 %); eq. (B)'s two printed percentages (+5.6206 % vs +5 %, -6.8464 % vs
  -7 %); Table IV's two ratios (1.430131 vs 1.43, 1.152572 vs 1.15) and its E1
  column to 5 cal; Palmer & Clark's two comparisons (+20.26 % and -8.53 % vs
  "about 20 % larger" and "about 8 % smaller"); the butane anomaly (v_m/B =
  2.0712 vs "twice"); and the v_m-against-point-B tolerance (worst 16.667 %,
  one row of twelve above 10 %, against "seldom ... as much as 10 %").

  Discrimination rather than fit: C from the polarizability is 96.75 times
  smaller than Bradley's fit needs, 9361 times in energy; the polarization
  ladder has no fixed decay ratio at his k (truncation spread 4.4824 against
  0.000e+00 at the computed k). Not-a-fit test with null baseline printed
  beside it: a 46.877 % spread in fitted v_m collapses to 10.609 % in derived
  area on silica gel (factor 4.4184) and 18.562 % to 7.897 % on charcoal
  (factor 2.3506).

  Headline computed twice: the ceiling 2/sqrt(3) = 1.154700538379 from a
  symbolic Lagrange condition and from a bracketing root-find on a
  numerically differentiated root-find, bit-identical; c* = 27 + 15 sqrt(3) =
  52.9807621135 to 1.2e-8. Structural, below ABS_FLOOR and named as such: five
  symbolic identities at 0, the layer ladder against eq. (B) at 6.7e-16 over 28
  (n, x) pairs, the dipole ladder against eq. (1b) at 8.5e-14.

  Circularity bound, measured rather than argued: a sigma set tuned to flatten
  the silica-gel areas EXACTLY leaves the charcoal areas spread by 14.379 %
  against 7.366 % for the printed set on the six non-butane isotherms the two
  tables share - a factor 1.9521, real but modest. On the butane-inclusive seven
  pairs the test has no power at all (31.283 % tuned against 31.036 % printed);
  both bases are printed and the bound is quoted only on the six-row one.

  Printed defects: "840 +- 70 cal. [...] for nitrogen on all twelve adsorbents"
  is the ELEVEN-row number (twelve give 824.5 +- 86.5, i.e. 820 +- 85 or 820 +- 90
  depending on the half-width rule; two rows outside the printed band; the
  omission is unique among the twelve under both rules); footnote 10's lattice
  sum is mis-grouped; Table IV's E1 column is 5 cal out on one row; catalyst
  954's v_m disagrees by 15.593 % between Table I and Fig. 4; Table V's two argon
  rows repeat one v_m across 13 K; and the worst cross-table sigma disagreement
  (0.6631 %, CO liquid packing) is 3.0005 times what the printed rounding can
  produce, cause unknown. Nitrogen on catalyst 954 at 77.3 K carries two c a
  factor 2.2359 apart (Fig. 3 fitted 156.7 against Fig. 4's calculated curve,
  which implies 350.364).

caveats: >
  TIER 6 THROUGHOUT, AND THIS MATTERS MORE HERE THAN USUAL. Not one number in
  any of the five tables is a measurement. Every entry is a constant the authors
  DERIVED from an isotherm - v_m and c from their own eq. (A) plot over
  0.05 < p/p0 < 0.35, point B read by eye, E1 - EL from c through footnote 16,
  the surface columns from v_m and an external cross-section. Reproducing one of
  them is reproduction, never validation, and the page says so at each such
  comparison. The underlying isotherms exist in this paper only as drawn curves.

  NO CURVE IS DIGITISED AND NO FIGURE IS REPRODUCED. Where a figure is used it
  is a block of hand-lettered CONSTANTS typeset inside the plot frame (Figs. 3,
  4 and 6), read as characters off a crop, and the page says so at every such
  use. Fig. 3's constants are used because it is the only place in the paper
  where v_m and c are printed for the same isotherm; Fig. 4's because it is the
  only place a v_m is printed as calculated rather than fitted.

  THE RIVAL THEORY IS JUDGED IN ITS OPPONENT'S WORDS. De Boer & Zwicker (1929),
  de Boer (1931, 1931, 1932) and Bradley (1936) are all read THROUGH Brunauer,
  Emmett & Teller's restatement (eqs. 1-4a and footnotes 3 and 10). None is on
  disk and none was consulted. What the page establishes is that the
  polarization theory AS BET STATE IT cannot carry the binding energy Bradley's
  fitted k assigns it. That is a real limitation and it is stated in the
  Results, in Reuse and here. What makes the judgement worth something anyway is
  that its inputs - a refractive index, a solid density, three lattice sums -
  are checkable physics rather than assertions.

  ORIGIN NOT CONSULTED, and nothing on the page derives from any of them:
  Emmett & Brunauer, THIS JOURNAL 59, 1553 (1937), the table of molecular
  cross-sections behind Tables III and V - recovered here by inverting those
  tables' own columns instead; McGavack & Patrick (1920), the SO2 isotherms of
  Table IV; Palmer & Clark (1935), the HF-dissolution areas; Goldman & Polanyi
  (1928), the ethyl-chloride isotherms of Fig. 6; McBain (1932); International
  Critical Tables Vol. I p. 103 and Vol. VII p. 11, the density of solid argon
  and the refractive index of argon gas - the density is likewise recovered by
  inverting eq. (7) against the printed 0.029, giving 1.652 g/cm3 and a
  nearest-neighbour distance of 3.844 Angstrom, both stated as recoveries.

  TWO SCOPE DECISIONS, BOTH DECLINED RATHER THAN CLOSED WITH OUTSIDE DATA.
  Fig. 6 (ethyl chloride on charcoal at three temperatures) is a fully specified
  eq. (E) prediction but needs vapour pressures the paper does not print. The
  Darco statement (n = 2.2 from x = 0.02 to 0.93, no point off by 4 %) refers to
  an isotherm that appears nowhere in the paper. Footnote 18's eqs. (C) and (D)
  are transcribed and NOT exercised, because the paper never evaluates them
  either; the page says so rather than leaving them looking supported.

  c IS A RECONSTRUCTION WHEREVER IT APPEARS, inverted from E1 - EL through
  footnote 16 - which is the authors' own operation run backwards, since journal
  page 313 says the energies were obtained FROM c with the prefactor already set
  to 1. So footnote 16's prefactor is not measurable anywhere in this paper, the
  inversion returns the authors' fitted c to 0.2793 %, and the page does not
  claim to have measured a prefactor. The honest size of the doubt is the
  paper's own: nitrogen on catalyst 954 at 77.3 K carries two c a factor 2.2359
  apart (Fig. 3's direct fit against Fig. 4's calculated curve). Applied as a
  sensitivity: the inflection ceiling cannot move under ANY rescaling of c
  because it is a maximum over all c - a structural insensitivity, not evidence -
  while the single-point margin of section 7 DOES NOT SURVIVE it (seven of twelve
  rows past 5 %, smallest c 27.583 against the threshold 38). Section 7's
  conclusion is claimed on the paper's own numbers and its fragility is stated
  beside it.

  WHAT THE PAGE DOES NOT SETTLE. It does not show that the BET model is right -
  its isotherm agreement is a two-parameter fit over a fifth of the range and is
  labelled one everywhere, and the page never reports it as a metric. It shows
  that the surface areas the model yields are mutually consistent across seven
  gases and consistent with one non-adsorption measurement, and that the rival
  theory cannot be asked either question. It says nothing about capillary
  condensation, the other explanation of the S-shape named in the paper's own
  first paragraph, because the paper offers no number that separates them. And
  it is not a rate: adsorption dynamics is J1.5.
