  - "AND WITHOUT THE RIVAL'S CLOSED FORM: the recursion (1a) solved as a tridiagonal system returns eq. (1b) to below 1e-12 <!-- claim: ladder_vs_eq1b_reldev --> at the computed k, independent of truncation, and at Bradley's k has no decaying solution (spread over 100 to 600 layers 4.48 <!-- claim: ladder_truncation_spread_bradley -->)."
  - "EQ. (B) ON EVERY BRANCH BY A ROUTE THAT SHARES NO ALGEBRA WITH IT: the layer equilibria solved with newton and summed term by term agree to below 1e-12 <!-- claim: ladder_vs_eqB_max_reldev -->; the printed +5 % and -7 % come out 5.62 <!-- claim: eqB_n6_over_n5_at_058_pct --> % and -6.85 <!-- claim: eqB_n6_over_n7_at_072_pct --> % at Fig. 3's constants."
  - "THE TEST THAT IS NOT A FIT, WITH ITS NULL BASELINE: a 46.9 <!-- claim: t3_vm_maxdev_pct --> % spread in fitted v_m collapses to 10.6 <!-- claim: t3_liquid_maxdev_pct --> % in area on silica gel, and 18.6 <!-- claim: t5_vm_maxdev_pct --> % to 7.9 <!-- claim: t5_liquid_maxdev_pct --> % on charcoal; a sigma set tuned on silica gel leaves charcoal spread by 14.38 <!-- claim: sigma_tuned_charcoal_spread_pct --> % against 7.37 <!-- claim: sigma_printed_charcoal_6_pct --> % for the printed set."
  - "THE PAGE'S OWN RESULT, COMPUTED TWO WAYS: the BET inflection value is capped at 2/sqrt(3) = 1.1547 <!-- claim: bet_inflection_ceiling --> v_m for every c, by a symbolic Lagrange condition and by a root-find on a central-difference derivative (two-route gap below 1e-12 <!-- claim: bet_inflection_ceiling_two_route_reldev -->; c* to below 1e-9 <!-- claim: c_star_two_route_reldev -->, the derivative step measured at an observed order between 1.9 and 2.1 <!-- claim: c_star_fd_order -->). The bound is one-sided: Table III's butane point B is only 0.4828 <!-- claim: lowest_pointB_over_vm --> of v_m."
  - "ONE PRINTED STATEMENT DOES NOT SURVIVE: Table II pins the paper's +- convention, and '840 +- 70 cal. [...] for nitrogen on all twelve adsorbents' is the eleven-row number; the twelve rows give 824.5 <!-- claim: t1_band_twelve_row_centre_cal --> +- 86.5 <!-- claim: t1_band_twelve_row_half_cal -->, with 2 <!-- claim: t1_rows_outside_printed_band --> rows outside the printed band."
  - "THE SINGLE-POINT RULE'S EXACT CONDITION: c >= 38 <!-- claim: single_point_c_threshold --> at 5 % and x = 1/3, met on Table I (worst 3.14 <!-- claim: single_point_worst_underestimate_pct --> %) but not robust to the factor 2.24 <!-- claim: c_two_routes_factor_77K --> by which the paper's own two routes to one c disagree."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (misread constants and table cells, wrong branches and forms, wrong bases, a sampled maximum, a forward difference), and three documented rows move nothing: two blind spots and one structural insensitivity of the ceiling to any rescaling of c."

adds: >
  Nothing to the BET equation: eqs. (26), (28), (A), (B) and (E) are closed
  forms with no grid and no transport. pymrm's newton on a
  NumJac((n, 1), axes_diagonals=[0]) Jacobian solves the layer equilibria as a
  route to eq. (B) that shares no algebra with it (agreement below
  1e-12 <!-- claim: ladder_vs_eqB_max_reldev -->, and it catches a mistyped
  (n+1)); newton on NumJac((1, 1)) gives the continuous n behind each printed
  percentage; pymrm.checks supplies the root-finds and the observed order of the
  one finite-difference step. Sampling the ceiling on a 40-node grid instead of
  root-finding it moves c* by 1.43 <!-- claim: c_star_sampled_grid_pct --> %.
  The inflection ceiling itself is sympy and a root-find, not a solver.

agreement: >
  Against printed results, all reproduced from the paper's own inputs: the
  polarization chain (-0.352523 <!-- claim: polar_d_recomputed --> against the
  printed -0.35); eq. (B)'s two printed percentages
  (5.62 <!-- claim: eqB_n6_over_n5_at_058_pct --> % and
  -6.85 <!-- claim: eqB_n6_over_n7_at_072_pct --> %); Table IV's E1 column to
  5 <!-- claim: t4_E1_closure_max_cal --> cal; v_m against point B, worst
  16.7 <!-- claim: t1_worst_vm_vs_B_pct --> % on Table I, against "seldom ... as
  much as 10 %". Printed defects, reported and none repaired: the 840 +- 70 band,
  footnote 10's grouping, Table IV's E1 row, catalyst 954's v_m
  (15.6 <!-- claim: t1_954_two_places_pct --> % apart between Table I and Fig. 4),
  Table V's repeated argon row, and a cross-table sigma disagreement
  3.0 <!-- claim: sigma_cross_table_max_over_envelope --> times what the printed
  rounding allows.

caveats: >
  Tier 6 throughout: every table entry is a constant the authors derived from an
  isotherm, so reproducing one is reproduction, never validation. No curve is
  digitised; where a figure is used it is a block of typeset constants. The
  rival theory is judged in its opponent's words: de Boer, Zwicker and Bradley
  are read only through this paper's restatement. c is a reconstruction wherever
  it appears, inverted from E1 - EL through footnote 16 with the prefactor the
  authors set to 1, so the prefactor is not measurable in this paper; the
  inversion costs 0.28 <!-- claim: c_rounding_cost_pct --> % in c. The molecular
  cross-sections behind Tables III and V are recovered by inversion, not read
  (Emmett and Brunauer 1937 is not on disk). Fig. 6 and the Darco statement are
  scoped out for want of printed inputs, and footnote 18's eqs. (C) and (D) are
  transcribed but not exercised. The page is not a rate: adsorption dynamics is
  J1.5.
