caveat: >
  TIER 6 throughout. Every value here is something the authors state, not
  something they measured; several are their arithmetic on other people's data
  (McGavack & Patrick, Palmer & Clark, Goldman & Polanyi, Bradley) and none of
  those originals is on disk or was consulted.

  IN PARTICULAR the whole polarization-theory block is de Boer & Zwicker's and
  Bradley's theory AS BRUNAUER, EMMETT AND TELLER RESTATE IT. Neither original
  was consulted. The page discriminates against the rival theory in the form its
  opponent gives it, and says so wherever it does.
