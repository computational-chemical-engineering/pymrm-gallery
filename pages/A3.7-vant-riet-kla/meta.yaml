validation:
  - "FIGURE 5'S TOPOLOGY FROM THE PRINTED CONSTANTS. Nine pure-vs-ionic curve pairs can cross, each a closed-form root; exactly 1 <!-- claim: fig5_crossings_in_window --> does so inside the plotted window, the pure-water 4 cm/s curve meeting the ionic 0.5 cm/s curve at P/V = 826.5 <!-- claim: fig5_crossing_pv --> W/m3, which is what the printed figure shows. No figure coordinate is measured: the count and the pair are compared. The window's left edge is Figure 5's printed axis label 4.10^2, transcribed text; the count holds for any left edge from 328.0 <!-- claim: fig5_next_crossing_pv --> W/m3 up to the crossing."
  - "THE PRINTED ELECTRODE CEILING RECOVERED from the two printed probe criteria: 1/(5 x 2 s) = 0.1000 <!-- claim: electrode_ceiling_from_linek --> 1/s against the printed 0.1 1/s. Three independently transcribed numbers close on a fourth."
  - "EQ. 3'S TWO PRINTED FORMS, eps*V/(v_s*pi*T^2/4) and eps*H_t/v_s, agree below 1e-12 <!-- claim: eq3_forms_gap --> for the vessel the page builds; the row that writes the tank diameter where the height belongs fails it."
  - "THE PYMRM GAS COLUMN against a closed form derived independently of any discretisation, phi = (1 - exp(-N_G))/N_G, on a cell ladder of 100 to 1600 cells: first-order upwind with an outflow outlet, 9.33e-5 <!-- claim: pymrm_vs_closed_n1600_pure --> and 2.00e-4 <!-- claim: pymrm_vs_closed_n1600_ionic --> relative at 1600 cells, the Richardson limit below 1e-6 <!-- claim: pymrm_vs_closed_richardson_pure --> on both branches."
  - "THE TRANSIENT ON TWO LADDERS: backward Euler on a step ladder at 800 cells and upwind on a cell ladder at 4000 steps, each first order, every reported k_app/k their two-axis limit. The ionic (0.2, 0.8) fit closes before tau_G and does not depend on the cells (below 1e-8 <!-- claim: kapp_space_effect_ionic -->). An independent Lagrangian route along the gas characteristics, with no spatial operator and no pymrm matrix, refined on its own ladder, meets the two-axis limit below 1e-4 <!-- claim: lagrangian_limit_gap_pure --> on both branches."
  - "EQ. 2'S FIT WINDOW IS A CHOICE AND ITS SENSITIVITY IS PRINTED. On the ionic branch tau_G = 29.8 <!-- claim: tau_G_worked --> s exceeds the liquid time constant 1/(k*phi) = 12.0 <!-- claim: liquid_time_ionic --> s, the response is not a single exponential, and k_app/k runs from 0.435 <!-- claim: kapp_over_k_ionic_w19 --> to 0.659 <!-- claim: kapp_over_k_ionic_w37 --> over the windows (0.1, 0.9), (0.2, 0.8) and (0.3, 0.7)."
  - "A TWO-PHASE OXYGEN BALANCE from the face values the operator transported, read with compute_boundary_values: below 1e-8 <!-- claim: o2_balance_pure -->. It fails when eps is written where (1-eps) belongs, when the transfer sign is flipped and when the faces are read from the end cells."
  - "A DEFECT-INJECTION TABLE: every claim has a row that fails its own check. The closed-form claims rerun one function of the printed-number dictionary under each mis-read constant or changed input; the pymrm claims have rows through call arguments (geometry code, transfer sign, phase weight, boundary conditions, face reads, fit window, ladders and the ratio they are read with). Feeding the gas at the top is not a row: the profile is exactly mirrored, below 1e-12 <!-- claim: top_feed_mirror_gap -->, so phi cannot see the feed end, and that is registered as structural."

adds: >
  To the correlation, nothing: eqs. 8 and 9 are five lines of arithmetic and the
  exponent, ratio and ceiling analyses are numpy. To the measurement, a number.
  The pymrm operators discretise a plug-flow gas column exchanging with a
  well-mixed liquid, which gives the governing group N_G = (1-eps) k H_t/(v_s H),
  not the review's tau_G k_L A (they differ by (1-eps)/(eps H), 0.300 <!-- claim: criterion_factor --> here), and the bias in a k_L A measured with
  eq. 2 at the centre of the printed window in a 2600 L vessel: 19.1 % <!-- claim: bias_pure_transient --> on eq. 8's branch and 45.4 % <!-- claim: bias_ionic_transient --> on eq. 9's in the full transient, against
  16.0 % <!-- claim: bias_pure_quasisteady --> and 45.6 % <!-- claim: bias_ionic_quasisteady --> quasi-steady. Starting the gas inert
  lowers the recovered ionic k_L A to 0.284 <!-- claim: kapp_over_k_ionic_inert_start -->
  of the true value.

agreement: >
  Nothing is compared against a measurement, and no fit quality is computed for
  eqs. 8 and 9: their data live only in Figures 1-5, which are not digitised.
  Reproduced from printed numbers: Figure 5's crossing topology (one crossing,
  pair c x d) and the electrode ceiling (0.1000 <!-- claim: electrode_ceiling_from_linek -->
  1/s from 1/(5 x 2 s)). Internal: the pymrm column against its closed form on a
  first-order cell ladder, the transient on separate step and cell ladders, an
  independent Lagrangian route meeting its limit below 1e-4 <!-- claim: lagrangian_limit_gap_ionic -->, and a two-phase oxygen balance
  below 1e-8 <!-- claim: o2_balance_ionic -->. Nothing on the page is fitted.

caveats: >
  TIER 6, AND REPRODUCTION RATHER THAN VALIDATION. Eqs. 8 and 9 were fitted by
  van 't Riet to the literature data he compiles; any agreement with those data
  would be a goodness of fit, not a test, and this page cannot compute even that.

  FIGURES 1-5 ARE NOT DIGITISED. They hold the only measurements in the review;
  extracting them needs a maintainer overlay review and none is available. The
  figure legends are used: they are typeset tables inside the plot frames,
  transcribed exactly as the running text was, and the sidecar says so. Nothing
  is traced and no axis is calibrated; the Figure 5 check compares a count and a
  pair, never an abscissa.

  THREE INPUTS ARE NOT PRINTED IN THE REVIEW and the page marks all three. The
  Henry constant H is the load-bearing one: N_G is inversely proportional to it,
  no source for it is on disk, the page reports the H-free group N_G*H and sweeps
  H over 20-40 (phi_ionic 0.424 <!-- claim: phi_ionic_H20 --> to 0.625 <!-- claim: phi_ionic_H40 -->). The gas holdup eps cancels except through
  (1-eps). The aspect ratio is taken at the centre of the review's printed
  0.5 < T/H < 1.5, both extremes swept at constant vessel volume with the implied
  volume printed: the ionic quasi-steady bias is 59.3 % <!-- claim: bias_ionic_TH05 -->
  at T/H = 0.5 and 38.0 % <!-- claim: bias_ionic_TH15 --> at 1.5.

  V DOES DOUBLE DUTY as the correlation's basis volume and the dispersion
  volume: the page sets H_t from V = pi T^2 H_t/4 and uses it as the dispersion
  height in N_G; at eps = 0.1 the dispersion height is larger by (1-eps)^(-1/3),
  +3.6 % <!-- claim: dispersion_height_NG_effect --> on N_G.

  THE GAS-DEPLETION RESULT IS A SELF-CONSISTENCY STATEMENT, NOT A CORRECTION. If
  the underlying measurements were biased low by phi, eq. 9 as fitted already
  contains that bias. What is established is that eq. 9 taken at face value
  predicts conditions under which the method that produced most of its data does
  not measure what it is assumed to measure.

  TWO PRINTED DEFECTS ARE RECORDED AND NEITHER IS REPAIRED: "where N = stirrer
  diameter" under eq. 7, against a Nomenclature giving N = stirrer speed; and an
  equation number one lower than the text in the four figure legends that cite
  one (Figure 5's cites none).

  WHAT THE BREAK TABLE CANNOT DETECT is stated on the page: a transcription error
  made consistently, a wrong physical model shared by both computational routes,
  the unprinted inputs, and anything depending on the underlying measurements.

  A3.6 (Calderbank & Moo-Young) is published and A3.8 (Onda) is staged.
  Calderbank 1958/1959 supplies three of the data sets in Figures 1-3; A3.6
  should own any comparison between his k_L correlation and van 't Riet's
  k_L*A. No other page's dataset is loaded.
