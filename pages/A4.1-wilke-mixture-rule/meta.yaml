adds: >
  The page does not need pymrm to get the answer and says so: the exact problem
  is a 2x2 linear system with a closed-form solution, derived here. What the
  finite-volume route adds is an independent check on that derivation (it knows
  only N = -c [B]^-1 grad(y) and div N = 0 and converges onto the closed form at
  second order) and the formulation that survives when the linearity does not;
  pymrm.checks.find_roots finds every flux pair with its root count.

  What the page adds beyond the paper is separable from the solver. Wilke
  prints the Method-1-versus-exact comparison but never reduces it to a number.
  Quantified: 86.6 % <!-- claim: wilke_rule_max_err_vs_exact --> worst case,
  21.6 % <!-- claim: wilke_rule_median_err_vs_exact --> median, split by flux
  share: 7.7 % <!-- claim: wilke_rule_median_err_majority_flux --> median on the
  majority species against 66.2 % <!-- claim: wilke_rule_median_err_minority_flux -->
  on the minority. The failure is attributed: the weighted arithmetic mean that
  J. H. Arnold attributes to Hougen and Watson in the paper's printed Discussion
  moves the median to 22.2 % <!-- claim: arithmetic_null_median_err_vs_exact -->
  and the worst case to 212.7 % <!-- claim: arithmetic_null_max_err_vs_exact -->;
  keeping the harmonic mean and moving the composition (Wilke's own Method 2)
  takes the worst case to 12.1 % <!-- claim: method2_max_err_vs_exact -->. The
  paper's accuracy claim for Method 2 (quoted as printed: "a maximum derivation
  [sic] of less than 10%") holds on Wilke's own two printed columns
  (9.07 % <!-- claim: method2_max_dev_on_printed_columns -->) and fails against
  the true solution.

agreement: >
  Reproduction of what the paper prints: the sample calculation to
  0.29 % <!-- claim: sample_calc_max_reldev -->; Table 1 to
  5.80 % <!-- claim: table1_method2_repro_max_reldev --> (Method 2) and
  10.42 % <!-- claim: table1_method3_repro_max_reldev --> (Method 3) over all
  printed cells, and to 1.92 % <!-- claim: table1_method1_repro_max_reldev -->
  for Method 1 over the cells that are not one of the three printed defects;
  the Example-VI Method-1 film pressure factor to
  0.21 % <!-- claim: pf_A_exampleVI_method1_reldev -->; Taylor and Krishna's
  intermediates to 9.8e-5 <!-- claim: taylor_krishna_851_max_reldev -->.
  Internal: the pymrm film reaches the closed form to
  5.50e-6 <!-- claim: pymrm_vs_closed_form_reldiff_n320 --> at 320 cells at
  second order.

  The headline is NOT an agreement: it is a disagreement, measured. Wilke's
  rule against the exact solution of his own eight problems is
  86.6 % <!-- claim: wilke_rule_max_err_vs_exact --> wrong at worst.

caveats: >
  NOTHING ON THIS PAGE IS TESTED AGAINST A MEASUREMENT. Every dataset is tier 6,
  the authors' own computations. The paper's only experimental content is
  Figure 1 (Fairbanks's M.S. thesis), which is a figure, is scoped out and is
  not digitised; the paper's own Comment section states that validity of the
  Stefan-Maxwell equations "has not been established experimentally in
  multicomponent systems for other than the stagnant gas case cited here". The
  exact solution is used as the REFERENCE, so if the Stefan-Maxwell equations
  are wrong for these mixtures then so is every error bar here.

  Table 1's own footnote says the diffusion coefficients "are estimated and do
  not correspond to true values", so no number here is a statement about carbon
  dioxide, water or hydrogen.

  Every example is ternary with exactly one stagnant species; Wilke's own
  extrapolation of Method 2 to more components is quoted and not tested.

  Example I's third printed Method-3 set is left as printed: eq. (23) proves
  one of its two digits is wrong and does not say which. Example III's printed
  Method-3 pair misses eq. (23) and no single-digit repair reconciles it. The
  Method-3 N_B of Examples VII and VIII have alternative readings that eq. (23)
  does not discriminate; Example VII's moves the printed-column deviation of
  Method 2 to 9.95 % <!-- claim: method2_max_dev_on_printed_alt_reading -->,
  still under the paper's ceiling.

  R and T are chosen, not printed. Every method-versus-method error is a ratio
  of fluxes at one c = P/RT, so c cancels from it; the reproduction of the
  printed table is not a ratio, and a misread R is a break-table row.
