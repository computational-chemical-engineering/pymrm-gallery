why_this_page_uses_it:
  attribution: >
    This book is the independent second witness for the case. Printed p. 126,
    sec. 6.1.3 "Limiting Cases", item 3: "When species i diffuses through a
    n - 1 stagnant gases and we have N_j = 0, i != j (Wilke, 1950)", followed by
    eq. (6.1.14), D_i,eff = (1 - x_i) / sum_{j != i} x_j / D_ij. Printed p. 204,
    sec. 8.6: "The oldest, simplest, and still widely used methods, pioneered by
    Hougen and Watson (1947) and by Wilke (1950), employ the concept of an
    effective diffusion coefficient." The book's reference list gives
    "Wilke, C. R., 'Diffusional Properties of Multicomponent Gases',
    Chem. Eng. Prog., 46, 95-104 (1950)" - the same article, independently
    confirming the identity of the file on disk.
    NOTE: the pedigree sentence is in section 8.6, not 8.7 as
    docs/papers-inventory.yaml records; the exact/linearized comparison is
    sub-section 8.6.1 (printed p. 208) and sec. 8.5.5 (printed p. 203).
  the_regime: >
    This example is the ONE regime in which Wilke's rule is the exact pointwise
    effective diffusivity - a single species evaporating through two genuinely
    stagnant gases. The page uses it to show what "exact" does and does not buy:
    the flux still needs an integration, and freezing the rule at an average
    composition is a second approximation that costs 0.08 % here and 31 % when
    the driving force is widened.

known_issues:
  printed_slip: >
    Printed p. 203 reads "Ethyl propionate is not present in the bulk gas phase
    (at least initially), so y_1delta = 0.0". The problem statement on p. 201
    gives y_10 = 0.0 (bulk) and p. 202 gives y_1delta = 0.0634 (interface), so
    the subscript in that sentence is a slip for y_10. Reported, not repaired;
    the stored values are the problem statement's.
  D_in_notation: >
    Eq. (8.5.35) is printed as N_1 l / (c_t D_in) = ln(y_i,delta / y_i0), i != 1.
    Substituting the printed interface compositions recovers D_12 = 8.50 mm2/s
    and 37.3 mm2/s against the printed D_13 = 37.4, so "D_in" there is the
    diffusivity of species i against species 1, the transferring species.

