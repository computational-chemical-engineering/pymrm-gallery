id: J1.5
slug: ldf-breakthrough
title: "Linear driving force and adsorption breakthrough"
section: J
status: published
tier: T0
priority: P1
structures: [S3, S4]
phases: [gas-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "2.3"
runtime_seconds: 3
datasets: []

validation:
  - pymrm sphere against the exact series solution, refined in space and in time
  - volume weights sum to one
  - the LDF error quantified separately at early, intermediate and late times
  - the long-time decay constant of the exact solution recovered as pi^2

adds: >
  Glueckauf compared candidate rate expressions at a handful of tabulated
  points. With the exact solution in closed form the question can be asked
  continuously: what coefficient would the LDF need at each instant? That
  k_eff(tau) is computed analytically - both the deficit and its rate come from
  the series, so nothing is differentiated numerically - and it is not flat. It
  diverges as tau^-1/2 at short time, where uptake grows as a square root and no
  exponential can follow it; it passes through Glueckauf's 15 at tau = 0.022,
  with the particle 44 % loaded; and it settles onto pi^2 = 9.8696 to five
  figures. So 15 is exactly right at one instant, and the paper's own domain of
  validity - near equilibrium, mildly curved isotherms - is precisely the region
  where the particle stays there.

agreement: >
  The pymrm solution matches the exact series to 6.6e-5 relative at n_r = 400
  and to 2.6e-3 at worst across tau = 0.001 to 0.5, the worst case being the
  earliest time where the internal profile is steepest. Spatial refinement runs
  into the backward-Euler time-error floor, which the time-step study then
  measures directly. The recovered long-time decay constant is 9.8696 against
  pi^2 = 9.8696.

caveats: >
  Provenance tier 6: the reference is the analytic series, not measurement.
  Glueckauf's Tables 3-5 are not transcribed - this 1955 scan drops decimal
  points wholesale, rendering 0.8647 as "8647" - and nothing is lost by that,
  since the exact series is a stronger reference than his tabulated
  approximation to it. The page treats a step in surface concentration with a
  linear isotherm; the coupled case, where the surface value tracks a bulk the
  particle is itself depleting, is the S8 problem of D1.4 and is not solved here.
