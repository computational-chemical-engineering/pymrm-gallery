validation:
  - >-
    BSL PROBLEM 18A.4 REPRODUCED TWO WAYS, AND EACH NUMBER SCOPED TO WHAT IT
    TESTS. Eq. 18.5-18 in closed form gives 0.27351 g-mol/hr against the printed
    0.273 (+0.188 %); a pymrm finite-volume march of Eq. 18.5-11, read as the
    outlet mixing cup (BSL's own Problem 18C.3 route) and touching no error
    function, gives 0.27351 (+0.187 %). The two agree to 4.6e-4 %, the march's
    grid error (it falls 3.9x when the cells double). THE TWO ROUTES ARE NOT
    INDEPENDENT END TO END: W = 2 pi R, the 3/2, the solubility conversion and
    the 3600 enter both, and delta_ref = sqrt(D L / (v_max Lambda)) carries the
    dimensional prefactor back out of the marching route, so
    pymrm_vs_eq18518_rel is exactly invariant to v_max, rho and M(Cl2); break
    rows inject all three and it does not move. The cross-route gap tests the
    DIMENSIONLESS solve, Phi(Lambda) against sqrt(4 Lambda / pi); the PREFACTOR
    is tested only by the +0.188 % against BSL's printed 0.273.
  - >-
    A PRINTED DEFECT IN THE PINNED SOURCE, PROVED FROM ITS OWN INPUTS. Problem
    18A.7(a) instructs "Use Eq. 18.5-20" (the creeping-flow form with 3 pi D),
    but its printed answer 1.17e-6 g-mol/(cm2 s) is what Eq. 18.5-19, the
    potential-flow form with pi D, gives (+0.220 %). Eq. 18.5-20 gives 6.77e-7,
    low by exactly sqrt(3). Reported, not repaired; the page does not decide
    which of the instruction and the answer is the error.
  - >-
    THE ONE EMPIRICAL TEST AVAILABLE. Part (b) reproduces from Hammerton &
    Garner's measured surface-averaged k_c = 117 cm/hr (+0.188 % on the printed
    1.33e-6), which pins the units of the measurement; the penetration
    prediction for the same bubble, with NO adjustable constant (t_exp = D/v_t),
    is 102.96 cm/hr, i.e. 12.0 % low. Creeping flow would be 49.2 % low.
  - >-
    A PRINTED DEFECT IN THE CROSS-CHECK SOURCE, PROVED FROM THE PRINTED DIGITS.
    Froment's Table 6.4.2.1 penetration column does not round from the closed
    form printed at the head of that same column at any of the six gamma (worst
    6.4 %), and two of the six cells are impossible against the other two columns
    of their own rows: 0.94 at gamma = 0.01 (below 1, where film and renewal both
    read 1.00) and 10.39 at gamma = 10 (above renewal's 10.05). The bracket test
    uses no closed form at all. The film column is high by one unit in the last
    printed place at two of six; the surface-renewal column rounds correctly
    everywhere. Each cell's rounding window is read from the cell as printed.
    Beek [1968], whom Froment credits, is not on disk.
  - >-
    FROMENT'S EQ. 6.4.2-8 RE-DERIVED FROM HIS EQ. 6.4.2-4 by quadrature over a
    uniform surface age, below 1e-12 over eight gamma (round-off: the gap is the
    same at quadrature tolerances of 1e-10 and 1e-13), which is what makes the
    disagreement above a defect in the table rather than in the reading.
  - >-
    BSL TABLES 20.1-1 AND 22.8-2 REPRODUCED, phi by root-finding Eq. 20.1-18
    rather than by reading the printed phi back in: every interior cell of the
    four columns rounds correctly from the recomputed value (worst 0.042 %).
    Table 22.8-2's penetration column is NOT an independent check: it is (1-x_A0)
    times Table 20.1-1's psi column, the two deviation sets differing by
    round-off.
  - >-
    AN EXACT EIGENFUNCTION SERIES, NOT IN EITHER BOOK, for the plug-flow case
    with a no-flux wall: Phi = 1 - sum 2/lam_n^2 exp(-Lam lam_n^2),
    lam_n = (n+1/2) pi. The pymrm march reproduces it to 7.2e-6 over three
    decades of Lambda on 600 cells; that is the grid error, which falls 3.9x
    when the cells double.
  - >-
    BOTH AXES REFINED SEPARATELY, ORDERS FROM SUCCESSIVE DIFFERENCES
    (pymrm.checks.observed_orders). Observed orders 1.000 in the marching step
    and 2.00 in the grid. Raw, the marching step is the larger error (1.04e-4
    at n_t = 1600); after the Richardson extrapolation every production value
    uses, the grid error is the larger: 2.8e-6 against 3.3e-8 on that case, and
    at least 46 times the step error on the production film over Lambda from
    1e-4 to 0.2. Orders taken
    from errors against the exact value on a one-axis ladder carry the other
    axis's error; that is a break row. Backward Euler with extrapolation is
    measured against BDF2 and Crank-Nicolson at equal cost: BDF2 2.9x less
    accurate on the outlet cup, Crank-Nicolson 1.4x more accurate on the cup
    but converging pointwise only by 2.4x for four times the steps.
  - >-
    The mixing-cup identity of backward Euler on the conservative scheme (outlet
    inventory equals the integrated interfacial flux, read with
    compute_boundary_values) holds below 1e-11, in the deep plug-flow solve and
    in the full film; break rows move it.
  - >-
    Every claim has a break-table row that fails its own check; the counts and
    the rows that do not fail are printed by the page.

adds: >
  Three things, and one refusal.
  (1) THE EQUATION BSL SETS UP AND THEN DECLINES TO SOLVE. Section 18.5 writes
  Eq. 18.5-7 in full (parabolic velocity profile, finite film, no-flux wall),
  says its analytic solution is "in the form of an infinite series" in Pigford's
  1941 thesis, does not print it, and replaces it by Eq. 18.5-11. Solving
  Eq. 18.5-7 directly turns that replacement into a number: the penetration
  formula is within 1 % of the full equation for Lambda = D L/(v_max delta^2)
  below 0.05643, i.e. whenever the penetration depth stays below 0.475 delta;
  for Problem 18A.4's column, any water film thicker than 105 um. The threshold
  is root-found with pymrm.checks.find_roots (one sign change on the scanned
  range), and refining the grid moves it by about 1e-6 relative.
  (2) AND IT SEPARATES THE TWO HALVES OF BSL'S JUSTIFICATION, WHICH ARE NOT
  EQUAL. BSL gives two reasons for Eq. 18.5-11 (the solute does not sense the
  wall, and it thinks the film moves at v_max) as one argument. Switching them
  independently at Lambda = 0.1, where the front has crossed 0.63 of the film,
  the velocity profile costs 1.92 % and the finite film 4.0e-6, a factor 4810
  apart. The wall effect comes from the exact series; the solver's own estimate
  on the 600-cell production grid is dominated by its grid error, and refined
  to 4800 cells with steps 6400/12800 it reproduces the series to 1.0e-4, the
  remainder being the extrapolated step error. The reason is visible in the
  series: a reflecting wall only returns solute a semi-infinite film would have
  kept anyway. This decomposition is in neither book.
  (3) THE THREE-WAY COMPARISON A3.1 AND A3.3 BOTH DECLINED, TAKEN. Two things on
  disk make it possible: Froment's Table 6.4.2.1, the only place in either book
  putting film, surface renewal and penetration side by side (and whose
  penetration column turns out to be wrong); and Hammerton & Garner's single
  measured k_c, on which penetration is the ONLY one of the three that predicts
  anything; the film needs delta and surface renewal needs s, one free constant
  and one datum each, zero residual each, which is A3.3's argument inherited
  rather than re-derived. Inverting the measurement through the other two gives
  the constants they would need: a 4.49 um film, or s = 72.3 s^-1.
  THE REFUSAL: the sqrt(D) exponent is still not tested, and the page says so at
  length with the search that backs the claim. One (k_L, D) pair cannot resolve
  an exponent.
  Which parts are pymrm: the transverse operator (construct_grad,
  construct_div), the interfacial flux (compute_boundary_values), the refinement
  studies (observed_orders) and the threshold search (find_roots). The march,
  the extrapolation and the banded solves are numpy and scipy; the closed forms,
  the series and the quadrature need no solver.

agreement: >
  Every printed target reproduced. Problem 18A.4: 0.27351 g-mol/hr against the
  printed 0.273 (+0.188 %) by closed form and +0.187 % by a finite-volume
  march, the two agreeing to 4.6e-4 %, the march's grid error. Problem 18A.7:
  +0.220 % on part (a) FROM EQ. 18.5-19, not the Eq. 18.5-20 the problem names
  (which is 42.1 % low, a factor sqrt(3)); +0.188 % on part (b). BSL Tables
  20.1-1 and 22.8-2: every interior cell rounds correctly (0.042 % worst).
  Froment's Table 6.4.2.1: surface renewal rounds correctly everywhere (0.50 %
  worst), film high by one unit in the last place at two of six (0.98 % worst),
  penetration wrong at all six (6.4 % worst) with two cells impossible on the
  printed digits alone. Froment's Eq. 6.4.2-8 re-derived from his Eq. 6.4.2-4
  to below 1e-12. pymrm against the exact eigenfunction series, 7.2e-6 over
  three decades on 600 cells (the grid error). The one number that is a
  comparison with a MEASUREMENT rather than a reproduction: the penetration
  prediction is 12.0 % below Hammerton & Garner's k_c, with no fitted constant.

caveats: >
  TIER 6, AND THE ORIGIN WAS NOT CONSULTED. R. Higbie, Trans. AIChE 31, 365-389
  (1935) is pre-DOI, is not on disk, and was NOT read. The model is read from
  Bird, Stewart & Lightfoot, "Transport Phenomena", 2nd edn (Wiley, 2002),
  section 18.5 (book pp. 558-561), which states the result, names the
  penetration model, attributes it to Higbie in the same paragraph and prints the
  full citation in a footnote that also credits him with having "provided the
  basis for the 'penetration model' of mass transfer". Every equation number on
  the page is BSL's. NOTHING ON THE PAGE IS ATTRIBUTED TO THE 1935 PAPER BEYOND
  WHAT BSL PRINTS, ONE SENTENCE AND THAT FOOTNOTE, AND, WHERE THE FROMENT
  CROSS-CHECK IS BEING DESCRIBED, WHAT FROMENT PRINTS ABOUT IT: his "Higbie's
  uniform age tbar" above Eq. 6.4.1-10, and his opening of section 6.4 treating
  "Higbie's [1935] so-called 'penetration theory'" as the uniform-age special
  case of surface renewal. In particular the two geometries
  the contact time is read off, the falling film with t_exp = L/v_max, and the
  rising bubble with t_exp = D/v_t, are BSL's section 18.5 and BSL's Example
  18.5-1 respectively; BSL does not say which geometries Higbie treated, and the
  page does not say so either. The Background section states this limit
  explicitly.

  THE E1.1 TARGET IS BSL SECTION 18.5, AND ONLY THAT. Froment, De Wilde &
  Bischoff, "Chemical Reactor Analysis and Design", 3rd edn (Wiley, 2011),
  section 6.4 is a CROSS-CHECK: it supplies an independent statement of the same
  constant (their Eq. 6.4.1-10's "N_A = 2 C_Ai sqrt(D_A/pi tbar)"), the
  closed-form enhancement factor for Higbie's uniform age (Eq. 6.4.2-8) and
  Table 6.4.2.1. The page does not adjudicate between the two books' scopes.
  Levenspiel (3rd edn, 1999) is on disk, mentions Higbie and cites him, but
  neither derives nor tests the model, the E1.1 failure mode, and is not used.

  TRANSCRIPTION PROVENANCE. The BSL file is a JBIG2 bilevel scan at 300 x 300
  ppi native whose ABBYY text layer destroys every equation and all vector
  notation ("[V x v]" for the curl); it was used only to locate pages, and every
  digit and every equation was read on 300 dpi renders, cropped to digit scale.
  PDF page = book page + 16 in this part of the body. The Froment file is
  born-digital with a clean text layer, but the column heads of Table 6.4.2.1
  are equations that do not survive extraction, so that page was rendered and
  read as an image too.

  ONE ASSUMED CONSTANT, FLAGGED, AND SHOWN TO SIT AT THE RESOLUTION OF THE
  PRINTED ANSWER. Converting Problem
  18A.4's "0.823 g Cl2 per 100 g water" needs the density of water, which the
  problem does not print; it is taken as exactly 1.000 g/cm3 with the solution
  treated as dilute. The page re-evaluates the answer at 0.999 and with
  M(Cl2) = 71.0 instead of BSL Table E.1's 70.905, and BOTH MOVE the reproduction
  by about a tenth of a percent, which is the whole size of the residual, and is
  the point. On 1.000 and 70.905 the closed form gives 0.273513, which rounds to
  0.274 rather than to BSL's printed 0.273: the +0.188 % is a hair OUTSIDE the
  +/-0.183 % that three printed decimals allow, not inside it. Either unprinted
  choice closes it, 0.999 gives 0.273239 and M = 71.0 gives 0.273147, each
  rounding to 0.273, but THE EXCESS IS NOT THEIRS ALONE AND THE PAGE DOES NOT
  CLAIM IT IS: only 1.28e-5 g-mol/hr (0.0047 % of the value) lies outside the
  window; the inputs 18A.4 DOES print are three-figure as well, and half a unit
  in the last printed place of D alone moves W_A by +/-0.199 %, more than the
  whole window;
  and truncation rather than rounding to three decimals would put 0.273513
  inside. The page prints that arithmetic while concluding only that a
  three-figure answer cannot decide between any of them. NEITHER UNPRINTED VALUE
  IS ADOPTED. The
  factor 3/2 relating v_max to the printed average velocity is DERIVED by
  averaging BSL's own printed Eq. 18.5-1, not taken from memory.

  DELTA IS NEVER INVENTED. Problem 18A.4 prints no film thickness, no viscosity
  and no flow rate. The finite-thickness correction is therefore reported as a
  threshold in Lambda and as the delta at which it reaches 1 %; the page states
  no correction for that column, because the printed data do not support one.

  THE MEASUREMENT IS QUOTED, NOT CONSULTED. D. Hammerton and F. H. Garner,
  Trans. Inst. Chem. Engrs. (London) 32, S18-S24 (1954) is NOT on disk. Its
  surface-averaged k_c = 117 cm/hr is recorded exactly as BSL quotes it, with no
  error bar, no bubble-size distribution and no statement of how many bubbles it
  averages, because BSL prints none of those. BSL's own words for the agreement
  are "approximately confirmed", and the page does not upgrade that to a
  validation. THE 12 % THEREFORE HAS NO UNCERTAINTY ATTACHED TO IT AND NONE IS
  INVENTED.

  THE sqrt(D) EXPONENT IS STILL NOT TESTED, AND THE CLAIM IS BACKED BY A SEARCH
  THAT IS DESCRIBED. Section 18.5 contains no numbers; its problems 18A.3, 18A.4
  and 18A.7 were each read in full on renders, as was every problem statement
  from 18A.1 to 18D.2 (book pp. 568-581), and 18A.7(b) is the only measured
  coefficient among them,
  at a single diffusivity. BSL's Table 22.8-2 compares film and penetration on
  the HIGH-NET-FLUX correction theta_x, not on D^n, and carries no measurement.
  Froment section 6.4 is theory throughout and section 6.5 describes how k_L, s
  and A_v are measured without printing measured values. One (k_L, D) pair
  cannot resolve an exponent, so the question stands exactly where A3.3 left it.

  BEEK [1968] IS NOT ON DISK. Froment credits Table 6.4.2.1 to him; every
  statement the page makes about those eighteen cells is a statement about
  FROMENT'S PRINTING, and nothing is attributed to Beek.

  A4.8 OWNS THE ARNOLD PROBLEM. Table 20.1-1's phi and psi solve BSL section
  20.1 (J. H. Arnold, Trans. AIChE 40, 361-378 (1944)) and appear here only
  because Eq. 22.8-41 needs psi. Nothing else on this page uses them and no
  claim is made about that problem.
