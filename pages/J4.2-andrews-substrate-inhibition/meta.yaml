data:
  tier: 1
  method: >
    Transcription only. Every equation, figure-legend parameter set and stated
    result was read on a 300 ppi render of the page that prints it and re-read
    on a crop enlarged to digit scale. NO CURVE IS DIGITISED anywhere on this
    page.
  status: complete
  the_paper_prints_no_table: >
    Confirmed two ways. `pdftotext -layout` over all seventeen pages gives 51484
    characters and a case-insensitive search for `table` returns exactly two
    hits, BOTH inside the word "unstable"; and all seventeen 300 ppi renders
    were read, with no ruled block, no column head and no "Table N" caption
    anywhere. The paper prints TEN figures, Figs. 1-10, and every parameter set
    is typeset inside a legend, which is why this case is not figure-gated:
    reading a typeset legend is transcription, not digitising. Figs. 2 and 3 are
    PACTOLUS block diagrams and carry no parameter set; the other eight carry one
