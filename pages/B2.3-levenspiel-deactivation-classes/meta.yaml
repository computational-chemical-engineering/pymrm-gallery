data:
  tier: 6
  method: >
    The 29 printed equations this page uses and the 17 printed prose claims it
    tests, transcribed from cropped 300 ppi (native) renders at glyph scale.
    NO EXPERIMENTAL DATA EXIST IN THE SOURCE and none is used: all eight pages
    were rendered at native resolution and read; there is no table anywhere in
    the document, and Figs. 2-6 are schematic test plots (unlabelled axes, no
    tick values, circles drawn to illustrate a straight line - Fig. 6's own
    caption says "A straight line on this plot indicates that the guessed order
    of deactivation is correct"). The only numerals outside equation numbers are
    the timescales on p. 267 and the orders "n = 1; n' = 0,1; d = 1,3" on
    p. 272, which are attributed to the paper's refs. 3 and 4 (neither
    consulted). No figure was digitised; none could have been.
  status: complete

fit_or_test: >
  NOTHING IS FITTED TO MEASUREMENT AND NOTHING IS VALIDATED AGAINST
  MEASUREMENT, because the source publishes none. Every number on the page is
  one of three things and is labelled as such wherever it appears:
  (i) exact reproduction of printed algebra - the 26 symbolic identities that
  re-derive eqs. (12)-(32) from their printed predecessors, and the four
  reactors' agreement with the paper's own closed forms (15), (19), (22) and
  (28)-(31); (ii) an exact algebraic identity between the printed rate forms -
  the five degeneracy families, which are proofs, not fits, and which are evaluated at their own exact parameter vectors rather than searched for by the optimiser; (iii) a computed property
  of the printed rate forms in a reactor - the separability matrices, the
  held-concentration span, the pseudo-steady cost.
  DIRECTION OF THE SEPARABILITY CLAIM: D(T->C) is the MINIMUM misfit of class C
  to a response generated by class T, and an optimiser returns an UPPER BOUND on
  a minimum. So every "not separable" result (D = 0) is safe and is additionally
  backed by an algebraic identity, while every "separable" result means "no
  better fit was found by this multistart" - separation could be worse than
  reported, never better. A break row widens the multistart to bound the bound.

validation:
  - "HEADLINE, AND IT IS NEGATIVE: at a 0.2-percentage-point conversion resolution exactly ONE of the twelve class pairs is separable in ONE of the four devices (plug flow, parallel vs independent, 2.20e-3). Parallel vs series in a bed is 8.07e-4. The discriminating measurement is not the effluent but the activity PROFILE, and both bed inlet values are EXACT rather than read off the grid: at the feed face c = 1, so C_R = 0 and the series inlet never decays at all (a = 1 identically), while the parallel inlet is a = exp(-lambda theta) = 0.049787. The finite-volume first cell centre approaches each at FIRST order (errors 2.19e-2 / 1.11e-2 / 5.59e-3 / 2.80e-3 at m = 100/200/400/800 for series), so the m = 200 cell-centre value 0.9889 is NOT reported as the inlet activity. Outlets, which have no closed form, are extrapolated TWICE - in space from the two finest grids, and then in TIME, because the space extrapolation at a fixed step count is still time-limited by 9.8e-6 (parallel), an order more than its own spatial residual of 1.8e-7. Doubly-extrapolated outlets 0.19017 (parallel) and 0.17711 (series), quoted to the five decimals the two refinements resolve, giving gradients of opposite sign (+0.1404 vs -0.8229)"
  - "the pymrm bed against an independent exact route (the pseudo-steady bed is a first-order cascade in the weight coordinate, hence a quadrature sharing no operator, grid or solver): second order in space at both n = 1 and n = 2, second order in time, both axes swept separately"
  - "the production bed against that quadrature, for the descending (parallel) and ascending (series) profiles alike, far below the conversion resolution the separability verdicts are read at - which is what licenses the sweep to run on the quadrature"
  - "each device against the PAPER'S OWN closed forms: eq. (15) (batch fluid), eq. (19) (mixed flow), eq. (22) (plug flow, solved on the pymrm bed), and eqs. (28)-(31) at d = 0, 1, 2, 3 - so every printed branch of the deactivation order is exercised, including d = 0 where the activity reaches zero in finite time"
  - "26 symbolic identities re-derive eqs. (12)-(32) and Fig. 6's slope and intercept from the numbered predecessors the paper derives them from; these are IDENTITIES and are labelled structural - what they protect is the transcription, which on this scan is the real risk"
  - "FIVE exact degeneracy families are proved algebraically and then measured by subtraction, each with a control that steps off its condition - and they reach ALL FOUR devices, the plug-flow bed included. The bed is NOT 'the only device that is not exactly degenerate' (an earlier version of this page said so on six surfaces and it was false): it carries the same side-by-side-is-parallel collapse the batch does, for every sigma, at the base orders n = n' = d = 1 (the identity needs n' = 1 as well as n = d = 1, and the off-condition controls at n' = 0.5 and n' = 2 show it failing by 5.8e-2 and 1.1e-1 in the bed). What the bed and the batch keep, and the two well-mixed devices do not, is a distinction between parallel, series and independent; what the bed alone has is a spatial coordinate"
  - "the paper's pseudo-steady assumption (p. 269) dropped: the bed re-solved with the fluid accumulation term retained, the cost first order in eps and root-found against the stated conversion resolution"
  - "a defect-injection table with a row for every reported metric - 24 movers plus three robustness rows: wrong nu, TVD off, Euler for Heun (observed order against observed order, 1.97 vs 1.01 on the same refinement pair), inlet bc not imposing the feed, the wrong rate form substituted unfitted, a mis-read subscript in eq. (5), n. moved off 0, degeneracy 5 evaluated in the wrong device, degeneracy 2 re-integrated at rtol 1e-13, the separable count of each device re-read at another resolution (and, for the held-C_A device where no resolution can move it, at d = 2 where the a^(d-1) cancellation fails), the required span started at another C_LO, NT_CONV halved (which moves the bed outlet's space-only reading by 2.9e-5 and does NOT move the doubly-extrapolated one), and the multistart widened"

caveats:
  - "THE SOURCE CONTAINS NO DATA. No comparison against any measured reaction or deactivation order is made or promised. The page is a prove-the-printed-structure page plus a measured separability study of the printed rate forms."
  - "sigma, the poison-consumption group in eq. (6)'s 'P -> P(down)', is NOT printed anywhere in the paper. It is a declared reconstruction (a mass balance is unavoidable once the poison deposits), it is swept, and the sigma -> 0 limit is reported separately because it is exactly degenerate with independent deactivation."
  - "separability numbers are optimiser upper bounds (see fit_or_test). The non-separability results are algebraic proofs and do not share that weakness."
  - "the recycle contacting of Fig. 1d is out of scope, as the paper itself says it 'offers no particular advantage'; so are the flowing-solids devices of Fig. 1's lower row, which are for deactivation 'in the order of seconds or less'."
  - "PRINTED DEFECT, REPORTED NOT REPAIRED: eq. (24) prints ln tau' = k_d t + ln((1/k_d) ln(C_A0/C_A)). The paper's own eq. (21), one line above, requires 1/k; the residual between the printed form and eq. (21) is exactly ln(k_d/k), and 1/k_d is dimensionally impossible inside ln tau' (seconds, where tau' is g cat sec/liter, both from the paper's Nomenclature). It shifts the intercept of the Fig.-5 test plot - i.e. the recovered k - and leaves the slope, and hence k_d, untouched. The CSV carries the printed form."
  - "an over-determination the AUTHOR flags rather than misses, AND a protocol he does not prescribe. The paper's instruction for eq. (6) is 'For side-by-side deactivation (Eq. 6) keep C_P constant', with C_A as the conditional extra: 'for side-by-side deactivation if C_P and, IF POSSIBLE, C_A are kept constant. If C_A cannot be kept constant in side-by-side deactivation, analysis is still not particularly difficult' (p. 271, both sentences in levenspiel-1972-printed-claims.csv as p271_keep_constant and p271_side_by_side_hedge, and both now quoted in full on the page - the earlier version quoted only the first half of the hedge). Section 8 holds C_A and lets C_P drift, which is the INVERSE of that priority and is what a single flow-rate knob forces. Under the author's own protocol - the sigma = 0 row, poison in such excess that C_P never moves - the recovered order comes back unbiased to 5.4e-9 relative. What section 8 prices is the cost of the other choice."
  - "THE MULTISTART ALONE UNDERSTATES THE DEGENERACIES, so it is not what the matrix reports. 44 of the 64 entries have an exact identity behind them (a specific parameter vector at which the candidate reproduces the truth), and on NINE of those the fit alone stopped more than 1e-6 short - up to 1.31e-3 for a plug-flow entry whose exact minimum is zero. Every entry is therefore evaluated both ways and the matrix reports min(fit, identity twin), with the identity-backed entries flagged. All nine errors were in the safe direction and none crossed a threshold, so no verdict changes; but printed as fits they would have read as measured separations. Worst twin residual over the 44: 1.5e-9, which is the ODE tolerance"
  - "eq. (6)'s own constants are not separately identifiable, and this is now a printed result rather than an assertion: fitting side-by-side to its OWN response (exact minimum zero by construction) the multistart stalls at 8.55e-6 (batch) and 2.38e-5 (mixed flow), at recovered parameters 3.6 % and 10.5 % from the truth in the worst coordinate, while a 1 % move along any SINGLE parameter costs 17x to 311x the stall. The five constants trade along a valley. A non-zero diagonal is an optimiser stall, NOT a result - an earlier version of this page called it 'a result, not a solver failure', which is wrong - and the identity twin sets the diagonal to zero exactly"
  - "THE 20x FITTER FLOOR HAS BEEN REMOVED because it never bound: 20x the stall is 1.7e-4 (batch), 1.7e-8 (plug), 4.8e-4 (mixed) and 5.2e-13 (constC), every one below its device's instrument resolution (worst case 0.24 of it). Every threshold equalled the resolution exactly, so removing the floor changes no count and no verdict - the notebook prints that check on all four devices. The thresholds are now the instrument resolution and nothing else"
  - "the one-knob/two-constraint cost of the recommended device has an EXACT blind spot at d = 1: the poison consumption rate goes as a^(d-1), so at d = 1 C_P never drifts and the recovered order is unbiased to 5.5e-7 for every sigma up to 20. The cost is real only for d != 1 (at d = 2: -30.8 % in the recovered order at the base sigma, 5 % bias at sigma = 0.076)"
  - "THE REQUIRED SPAN IS A PROPERTY OF TWO UNPRINTED CHOICES and is reported as an order, not a design constant. wrong_class_misfit fixes the starting held level C_LO and the number of levels L_LEVELS; neither is in the paper. Root-found at 5 % precision on k'_d over C_LO in 0.05-0.40 and L in 3-9, the span ranges 0.073 to 0.382 - a factor of five, monotone in the starting level. The base case (C_LO = 0.15, L = 5) gives 0.204 and the sweep table is printed beside it"
  - "every conclusion is stated with the (n, n', d) it was computed at, and the ones that depend on those orders are mapped rather than asserted; the mixed-reactor boundary d = n'/n is analytic and tested on both sides - and the test shows it is necessary but nowhere near sufficient for the mixed reactor to separate parallel from series (a point half a unit below the line is still fitted to 4.2e-5)"

agreement: >
  Two kinds, kept apart. Exact reproduction of printed structure: 26 symbolic
  identities close eqs. (12)-(32) and Fig. 6 with no nonzero residual; the four
  devices meet the paper's own closed forms (15), (19), (22), (28)-(31); the
  pymrm bed meets an independent quadrature at observed order 2 in space and
  order 2 in time (against order 1 for Euler on the same refinement pair).
  Measured properties of the printed rate forms: the separability
  matrices of four contactings (64 fits, each entry min(fit, identity twin)),
  the five exact degeneracy families, the
  analytic boundary d = n'/n where the mixed reactor stops being degenerate, the
  span of held concentration a class assignment needs (swept over the two
  unprinted design choices it depends on), the bias in the recovered
  deactivation order when the poison is consumed, and the cost of the paper's
  pseudo-steady assumption. Plus one printed defect settled from the paper's own
  two lines and its own Nomenclature.

