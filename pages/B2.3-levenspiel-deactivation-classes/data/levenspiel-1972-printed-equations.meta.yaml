dataset_id: levenspiel-1972-printed-equations
title: "Levenspiel (1972): the numbered equations of the four deactivation classes and their four batch-solids performance relations"
source:
  authors: ["Levenspiel, O."]
  year: 1972
  container: "Journal of Catalysis 25(2) 265-272"
  doi: 10.1016/0021-9517(72)90227-8
  access: institutional subscription (lawful access; Elsevier PII 0021951772902278)
  licence: all rights reserved (equations and facts extracted; no page image reproduced)
acquisition:
  method: table
  figure: >
    equations (4)-(32), pp. 266-271, plus the Nomenclature of p. 265; each read
    from a cropped native-resolution (300 ppi) render at glyph scale.
  operator: builder agent (B2.3)
  date: 2026-08-08
  estimated_error: >
    None from transcription of the algebra, and the transcription is
    self-checking: 26 symbolic identities on the page re-derive the numbered
    rows from the rows above them, so a mis-read subscript or prime would
    surface as a nonzero residual rather than as a plausible wrong number. What
    that cannot check is the four rate FORMS themselves (eqs. 4-7),
    which are definitions - their C_A / C_R / C_P subscripts and the n / n' / d
    exponents were each cropped and read individually, and they are exactly
    where this scan can mislead. Eq. (24) is transcribed AS PRINTED and is
    reported as a printed defect, never repaired.
columns:
  - {name: eq,          unit: "-",     description: "the paper's own equation number"}
  - {name: page,        unit: "-",     description: "journal page (265-272)"}
  - {name: ascii_form,  unit: "-",     description: "the equation as printed, in the ASCII convention noted at the head of the CSV"}
  - {name: describes,   unit: "-",     description: "what the equation is for"}
  - {name: status,      unit: "-",     description: "verified (re-derived symbolically on the page) or a printed-defect note"}
notes:
  fit_test_label: >
    NOTHING HERE IS FITTED AND NOTHING HERE IS VALIDATED. These are printed
    equations. Every agreement the page reports against them is either exact
    reproduction of printed algebra or an internal-consistency check between
    printed lines. The paper contains no measurement of any kind, so no
    quantity on this page can be compared against data.
  the_defect: >
    Eq. (24) prints ln tau' = k_d t + ln((1/k_d) ln(C_A0/C_A)). The paper's own
    eq. (21), one line of algebra above it, gives 1/k, not 1/k_d: the residual
    between the printed form and eq. (21) is exactly ln(k_d/k). It is also
    dimensionally impossible as printed - the Nomenclature (p. 265) gives tau'
    in g cat sec/liter while 1/k_d for n' = 0, d = 1 is in seconds. Reported,
    not repaired; the CSV carries the printed form.
redistribution_basis: >
  Equations and numerical facts are not protected by copyright (Feist, 1991);
  extraction for scientific research is covered by Art. 15n Auteurswet
  (DSM Art. 3). No page image is reproduced anywhere in this repository.
