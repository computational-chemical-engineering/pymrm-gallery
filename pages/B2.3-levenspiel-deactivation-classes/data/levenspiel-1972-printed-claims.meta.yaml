dataset_id: levenspiel-1972-printed-claims
title: "Levenspiel (1972): the prose claims about reactor choice, quoted verbatim"
source:
  authors: ["Levenspiel, O."]
  year: 1972
  container: "Journal of Catalysis 25(2) 265-272"
  doi: 10.1016/0021-9517(72)90227-8
  access: institutional subscription (lawful access; Elsevier PII 0021951772902278)
  licence: all rights reserved (short quotations for verification; no page image reproduced)
acquisition:
  method: table
  figure: >
    prose, pp. 265-272, read from cropped native-resolution (300 ppi) renders.
    The scan's OCR text layer is badly damaged ("detrrmination", "ordrrs",
    "particlrs", "parallrl", "rractor") and was used for NOTHING; every quote
    was read off the image.
  operator: builder agent (B2.3)
  date: 2026-08-08
  estimated_error: >
    Quotes are verbatim including the paper's own punctuation. The p. 271
    "keep constant" row compresses the paper's four-item indented list onto one
    line with semicolons; the wording of each item is unchanged.
columns:
  - {name: claim_id,  unit: "-", description: "stable key used by the page"}
  - {name: page,      unit: "-", description: "journal page (265-272)"}
  - {name: quote,     unit: "-", description: "the paper's own words, verbatim"}
  - {name: tested_as, unit: "-", description: "how (or whether) this page tests the claim"}
notes:
  no_data_in_the_source: >
    THIS PAPER PUBLISHES NO EXPERIMENTAL DATA. All eight pages were rendered at
    native resolution and read: there is no table anywhere in the document, and
    Figs. 2-6 are schematic test plots - unlabelled axes, no tick values, open
    circles drawn to illustrate a straight line ("A straight line on this plot
    indicates that the guessed order of deactivation is correct", Fig. 6). The
    only numerals outside equation numbers are the orders "n = 1; n' = 0,1;
    d = 1,3" on p. 272 (attributed to refs. 3 and 4, which were not consulted)
    and the timescales "0.1-1 sec" and "minutes" on p. 267. The Discussion says
    so itself: "we ask in particular whether experiments can be devised so as
    to give simply the orders and rate constants of these equations". No
    comparison against any measured order is attempted anywhere on this page,
    because there is none to compare against.
  fit_test_label: >
    Nothing is fitted to any measurement and nothing is validated. Every number
    on the page is either exact reproduction of printed algebra, an exact
    algebraic identity between the paper's own rate forms, or a computed
    property of those rate forms in a reactor.
redistribution_basis: >
  Short verbatim quotations for the purpose of verification and criticism
  (Art. 15a Auteurswet / quotation right); facts and equations are not
  protected (Feist, 1991). No page image is reproduced.
