validation:
  - "THE FIT IS A FIT AND IS LABELLED ONE: eqs. (31)/(33)/(19) at the printed constants reproduce the printed q_cal cells to 0.434 <!-- claim: qcal_max_abs_cu_mm --> cu.mm, a transcription check and never evidence for the model."
  - "THE DISCRIMINATION, THE PAPER'S OWN: with both forms refitted on q, the best two-parameter Freundlich is 3.82 <!-- claim: t7_F_over_L --> times worse in RMS than the best Langmuir on Table VII (median over the tables 2.12 <!-- claim: disc_median_ratio -->), and the zero- and one-parameter nulls are 19.4 <!-- claim: t7_null_mean --> and 26.8 <!-- claim: t7_null_kp --> times worse."
  - "THE OUT-OF-SAMPLE BOUND: beta below one on every entry, worst 0.857 <!-- claim: beta_max -->, a headroom 1/beta of 1.1667 <!-- claim: beta_headroom -->."
  - "CASE VI IS THE BET ISOTHERM: eqs. (26), (29) and (30) with sigma_3.. = sigma_2 minus BET simplify to zero in sympy, and a 4000-layer ladder summed term by term agrees with the closed form to below 1e-13 <!-- claim: caseVI_series_vs_closed_form -->."
  - "THE ISOTHERM COULD NOT HAVE DECIDED THE QUESTION: every pressure in the paper lies below p/p0 = 1.6e-3 <!-- claim: x_max_anywhere -->, where Case VI and Case I differ by at most 0.160 <!-- claim: departure_max_pct --> %, against observational scatter at least 12.2 <!-- claim: scatter_over_sep_min --> times larger; refitting both models to Table VII with both parameters free gives an RMS ratio 0.99999 <!-- claim: t7_BET_free_over_L -->."
  - "EQ. (15) DISPROVED BY MARCHING EQ. (14): implicit Euler steps solved by newton reach the corrected branch to 1.78e-3 <!-- claim: eq14_vs_eq15corrected_max_abs --> at 1600 steps, observed order 0.987 <!-- claim: eq14_time_order --> from successive differences, and the half-coverage time root-found on the marched trajectory converges to eq. (16), its Richardson value at most 5e-5 <!-- claim: t_half_richardson_vs_eq16_rel --> from it."
  - "THE CONSTANT CHAIN: eqs. (3), (37), (38) and the cu. mm. conversion are mutually consistent to 0.136 <!-- claim: chain_max_rel_pct --> %, which is what caught the text layer's 25.2e16."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (mistyped constants and coefficients, misread table cells, a different estimator, a coarser or different march, loosened solver tolerances)."

adds: >
  Nothing to the Langmuir isotherm: eqs. (9), (26), (29), (31) and (33) are
  closed forms in one variable, with no grid and no transport. pymrm's newton on a
  NumJac((1, 1)) Jacobian root-finds the stationarity condition of each fit on q,
  cross-checked by Brent on the same derivative to below 1e-9
  <!-- claim: fit_two_route_max_rel -->; it solves the implicit Euler steps of
  eq. (14), which is how eq. (15) is disproved; and pymrm.checks supplies the root
  scans (the 1 % separation point at p/p0 = 0.0098993
  <!-- claim: x_1pct_rootfind -->, which a 40-point grid misses by
  6.26 <!-- claim: x_1pct_sampling_error_pct --> %) and the observed orders. The
  Case VI = BET identity is sympy, not pymrm.

agreement: >
  Against printed results, all reproduced from the paper's own inputs. The q_cal
  columns are a goodness of fit (0.434 <!-- claim: qcal_max_abs_cu_mm --> cu.mm at
  worst). Internal identities that can fail: the constant chain to
  0.136 <!-- claim: chain_max_rel_pct --> %; eq. (38) to
  3.77 <!-- claim: sigma_max_abs_rel_pct --> %; Table XXII to
  2.27 <!-- claim: t22_single_max_pct --> %; the monolayer chain to
  0.451 <!-- claim: mono_n_rel_pct --> %. Discrimination: Freundlich
  3.82 <!-- claim: t7_F_over_L --> times worse on Table VII. Printed defects,
  reported and none repaired: eq. (15); Table IV's b, 1.40
  <!-- claim: t4_b_printed_dev_pct --> % from the two-point solution; Table XX's
  beta for methane on glass; the "(100 bars) ... 0.20" pair, where 0.20 belongs
  to 25.64 <!-- claim: p_for_slope_020 --> bars.

caveats: >
  Tier 5, and only one column of it is measurement: q_obs is measured; a, b, b',
  sigma, N0, beta and Tables XXI, XXII and XXV are constants Langmuir derived from
  those measurements, so reproducing one is reproduction, never validation. The
  mica numbers are uncorrected (the paper: "10 to 30% too high") and no correction
  is applied. Scope, decided before transcription: the theory of journal pages
  1368-1376 and Tables II-XI, XIII-XXII, plus Table XXV for eq. (37); Tables I,
  XII, XXIII and XXIV are not transcribed. Only nitrogen's molecular volume is
  printed; the other monolayer counts are used as printed. No curve is digitised.
  Origins cited but not consulted: Freundlich, Kapillarchemie (1909), read only
  through Langmuir's restatement and Table VII's q_F column; Eucken (1914); Bakker
  (1915); Haber (1914); Knudsen (1910); Meyer (1899); Langmuir's own Parts I and
  II. No dataset of J1.3 is loaded and no number of J1.3 is retyped. The page does
  not show that the films are one molecule thick; it shows that the isotherm data
  cannot discriminate that from Langmuir's own multilayer alternative.
