adds: >
  Nothing to the Langmuir isotherm, and the page says so in the section where a
  reader would expect a solver. Eqs. (9), (26), (29), (31) and (33) are closed
  forms in one variable; there is no grid, no time step in space, no boundary
  condition and no transport anywhere, and most of the notebook would run with
  pymrm uninstalled, exactly as on A1.6, A1.1 and J1.3. newton and NumJac do
  three specific jobs and each was chosen because the cheap alternative is WRONG,
  not slow.

  (1) A FIT THAT SHARES NO ALGEBRA WITH THE PAPER'S FIT. Langmuir drew a line
  through p/q against p, which is linear least squares on a TRANSFORMED variable,
  and the transform is not innocent - it reweights the residuals towards the
  low-pressure points, where q is small and p/q is most sensitive. In both eq.
  (31) and Freundlich's law the amplitude enters linearly, so it is eliminated
  exactly and the stationarity condition in the one remaining parameter is
  root-found with newton on a NumJac((1, 1)) Jacobian, and again with a
  bracketing Brent solve; the two agree to 3.4e-11 over 29 fits. READ THAT
  NARROWLY, AND THE PAGE DOES: both solvers are handed the same objective, the
  same profiled amplitude and the same central-difference derivative and differ
  only in how they iterate, so it is a ROOT-FINDER CROSS-CHECK, not an
  independent computation of the fit. The independence in this item is the one in
  its heading - fitting on q rather than on Langmuir's p/q linearisation.
  Fitting by Langmuir's linearisation instead MOVES the page's
  discrimination metric (median 2.1211 -> 1.9137), which is the break row that
  shows this matters. It also lets Freundlich be beaten at ITS best rather than
  at Langmuir's rendering of it, which is the only version of that contest worth
  reporting - his own 8.4 p^0.417 is so far from optimal that using it would make
  the median ratio 29.4 instead of 2.12.

  (2) THE RATE EQUATION INTEGRATED INSTEAD OF QUOTED. Eq. (15) is printed
  wrongly. The way to establish that without asserting it is to integrate eq.
  (14), which march_eq14 does with a newton-solved implicit step. The march
  reaches the corrected branch to 1.78e-3 at 1600 steps, converging at first
  order in dt (observed 0.995, and dt is the one axis that carries error here),
  and cannot reach the printed branch at all, because the printed branch puts
  t = -infinity at the start of the integration. That is a proof rather than a
  reading of the glyph. The half-coverage time is then root-found ON THE MARCHED
  TRAJECTORY (0.110160 against eq. (16)'s 0.109954, gap 1.875e-3, halving with
  dt, observed order 1.00); the inversion of the CLOSED FORM is shown beside it
  and is labelled an algebraic identity that could not have failed, not a fourth
  route.

  (3) ROOT-FINDS WHERE A SWEEP WOULD HAVE BEEN WRONG. The relative pressure at
  which Case VI departs from Case I by 1 % is root-found; reading it off a
  40-point log grid gives a value 6.26 % out, and both numbers are printed in the
  same sentence. The pressures corresponding to the printed log-log exponents are
  root-found for the same reason, the p0 error that would bring scatter and
  separation to parity is root-found rather than swept, and the maximum of the
  departure over each table is licensed by a proof of monotonicity rather than by
  sampling.

  (4) AND THE THING THAT IS NOT PYMRM AT ALL, AND IS THE MOST USEFUL OUTPUT ON
  THE PAGE. Langmuir's Case VI, eqs. (29) and (30), IS the BET isotherm. That
  needed sympy and a change of variables the paper itself supplies through eq.
  (39). It converts the paper's central conclusion from "the isotherm shows the
  film is one molecule thick" into "the isotherm could not have shown anything of
  the kind, and the film being one molecule thick is what beta shows". The
  separation between Langmuir's two theories, over his entire data set, is at
  most 0.16 %, against observational scatter 12 to 1100 times larger.

  WHAT THE PAGE DELIBERATELY DOES NOT DO: it does not fit eq. (29) to Langmuir's
  data. That would be meaningless - at p/p0 < 1.5e-3 the parameter c is not
  identifiable and any fit would return the Case I answer with an arbitrary c.
  Saying so is the finding.

agreement: >
  Against printed results, all reproduced from the paper's own inputs. GOODNESS
  OF FIT, labelled as such and never reported as evidence: eqs. (31)/(33)/(19) at
  the printed constants reproduce all 101 printed q_cal cells to 0.434 cu.mm.
  INTERNAL IDENTITIES, which can and do fail: the four-constant chain to 0.136 %;
  b' = b/s recovering the printed adsorbent area on 21 of 23 rows to 0.48 %;
  eq. (37) on 23 rows to 1.63 % and on all eight platinum cells exactly; the beta
  column exact on 22 of 23; eq. (38) on 21 cells to 3.77 %; Table XXII on
  fourteen cells to 2.27 %; the monolayer chain 35.5 -> 3.88e-8 cm -> 0.66e15 to
  0.45 %; the "Number of obs." column against the transcription on all twenty
  tables.

  DISCRIMINATION RATHER THAN FIT, with null baselines printed beside it: the best
  two-parameter Freundlich is 3.8235 times worse in RMS than the best
  two-parameter Langmuir on Table VII and worse on 13 of 14 tables (median
  2.1211), the one exception being the table the paper itself excludes; the
  zero-parameter and one-parameter nulls are 19.4 and 26.8 times worse on the
  same data, and never better than 3.7 and 1.8 anywhere.

  OUT-OF-SAMPLE BOUND: beta < 1 on all twenty entries, worst 0.857143, i.e. only
  16.7 % of headroom, and the paper's own uncorrected-blank caveat moves that
  worst value to 0.600-0.771.

  HEADLINE COMPUTED SYMBOLICALLY AND CONFIRMED NUMERICALLY: Langmuir's Case VI
  (eqs. 29+30 with sigma_3.. = sigma_2) minus the BET isotherm is identically
  zero in sympy, and a term-by-term ladder sharing no algebra with either closed
  form agrees to 5.6e-16 at 4000 layers. The 1 % separation point is root-found
  at p/p0 = 0.00989933 against the c -> infinity closed form 1/101, differing by
  1.68e-4 (the finite-c correction). Highest relative pressure anywhere in the
  paper 1.5035e-3; largest Case VI vs Case I departure 0.16022 %; smallest ratio
  of observational scatter to that separation 12.197, and 1104.4 on Table VII.

  PRINTED DEFECTS, reported and none repaired: eq. (15)'s logarithm, which gives
  t_half = 0 where eq. (16) two lines below gives tau ln2 / (alpha(1+sigma1 mu));
  Table IV's b = 58.3, where the two observations and the paper's own b' both
  give 57.49-57.50; Table XX's beta = 0.36 for methane on glass, where the
  paper's own N0 and monolayer count give 0.4571 and where the printed value
  breaks the paper's own ordering claim; the pair "(100 bars) ... 0.20", where
  0.20 corresponds to 25.641 bars under the paper's own a; and the systematic
  truncation of the sigma column (18 of 21 printed values below the computed one).

caveats: >
  TIER 5, AND ONLY ONE COLUMN OF IT IS MEASUREMENT. q_obs is measured - pressures
  read on a McLeod gauge, gas volumes obtained by difference. Everything else in
  the paper (a, b, b', sigma, N0, beta, and Tables XXI, XXII, XXV) is a constant
  Langmuir DERIVED from those measurements, so reproducing one of them is
  reproduction and never validation, and the page says so at every such
  comparison.

  THE FIT IS A FIT. The q_cal agreement of Tables II-XVII is a two-parameter fit
  compared against its own training data. It is stated as a goodness of fit in
  the notebook, in this file, in models_entry.yaml, in README.md and on the case
  yaml; it is never reported as an agreement metric; and a null baseline is
  printed beside every agreement quoted anywhere on the page.

  THE MICA NUMBERS ARE UNCORRECTED. Journal page 1385: "The results therefore
  obtained from bulb A are to be considered as being 10 to 30% too high", because
  the blank bulb A' adsorbed measurably and no subtraction was made. Every mica
  beta on this page is therefore an over-estimate - the direction that helps
  Langmuir's conclusion - and no correction is applied anywhere. One point is
  disowned by the paper (q at p = 12.8 in Table IX, "undoubtedly in error"); it
  is kept, flagged, and the discrimination is reported with and without it
  (2.2453 -> 3.1191).

  SCOPE, DECIDED BEFORE TRANSCRIPTION. Forty-three journal pages, twenty-five
  tables. This page is about the isotherm and the constants derived from it: the
  theory of journal pages 1368-1376 and Tables II-XI, XIII-XXII. Table XXV is
  carried for one reason only - it exercises eq. (37) on a third adsorbent - and
  Tables I, XII, XXIII and XXIV (outgassing inventories and the platinum
  oxygen/carbon-monoxide bookkeeping) are SCOPED OUT AND NOT TRANSCRIBED. Journal
  pages 1393-1401 are irreversible chemisorption with no isotherm in them.

  ONE EXTERNAL INPUT, AND IT IS WHAT MAKES BETA A TEST. The monolayer counts of
  journal page 1391 come from LIQUID DENSITIES, and only nitrogen's molecular
  volume (35.5 cu. cm.) is printed. The other four are RECOVERED by inverting the
  printed counts and are labelled recoveries wherever they appear; nothing on the
  page depends on them, because beta uses the printed counts. Table XXII's
  combining rule for the three multi-sigma cells is likewise not printed and the
  geometric mean is stated as a reconstruction, not as the paper's rule.

  NO CURVE IS DIGITISED AND NO FIGURE IS USED FOR ANYTHING. The paper's only
  figure with content is Fig. 1, a schematic checkerboard of surface atoms with
  no numbers on it. No page image is committed anywhere.

  ORIGINS CITED BUT NOT CONSULTED, and nothing on the page derives from any of
  them: Freundlich, Kapillarchemie (1909), the rival isotherm, read only through
  Langmuir's own restatement on journal page 1375 and through Table VII's q_F
  column; Eucken (1914); Bakker (1915); Haber (1914); Knudsen, Ann. Physik 31,
  205 (1910); Meyer's Kinetic Theory of Gases (1899), the source of eq. (1); and
  Langmuir's own Part I (This Journal 38, 2221 (1916)) and Part II (39, 1848
  (1917)), which carry the monomolecular-film evidence this paper leans on.

  THE CROSS-PAGE RELATION TO J1.3, HANDLED WITHOUT LOADING ANYTHING. Brunauer,
  Emmett & Teller (1938) is on disk and is the subject of J1.3, whose README,
  meta.yaml and findings were read before this page was built. NO DATASET OF J1.3
  IS LOADED AND NO NUMBER OF J1.3 IS RETYPED: the identity of section 6.8 is
  verified against Langmuir's own eq. (30), symbolically, and the only thing
  taken from the 1938 paper is one section heading read on a 300 ppi crop.

  WHAT THE PAGE DOES NOT SETTLE. It does not show that adsorbed films on glass
  and mica are one molecule thick; it shows that Langmuir's isotherm data cannot
  discriminate that from his own multilayer alternative, and that the evidence
  which does discriminate is beta, whose margin is thin. It says nothing about
  porous adsorbents, for which Langmuir's own eq. (21) is written and never
  evaluated. And it is not a rate: adsorption dynamics is J1.5.
