dataset_id: check-values
title: "Independent check values for the page's functions at the stated test conditions"
status: complete

source:
  authors: ["Borman, P. C.", "Westerterp, K. R."]
  year: 1995
  container: "Industrial & Engineering Chemistry Research 34, 49-58"
  doi: "10.1021/ie00040a002"
  access: >
    The kinetics are the paper's model III (Table 5, Table 6) as used by page C2.11, with the
    combustion factor F_fig6 loaded from C2.11's claims (row F_fig6_used); the tube is a 1-D
    pseudo-homogeneous wall-cooled plug-flow model with page choices borrowed from C2.10 (U,
    d_t, c_p) and a stated bed voidage; the runaway criterion is Morbidelli and Varma (1988),
    Chem. Eng. Sci. 43, 91-102, eq. 34b. The values are not read from any paper but computed by
    a second route.
  licence: "computed values (no text, figure or page image reproduced)"

acquisition:
  method: computed by a second route, not by the page
  resolution: "12 significant digits (rounding up to 5e-12 relative); each row's rtol (1e-11 or looser) is the agreement the page must reach"
  operator: "Claude Opus 5.5 (assisted): plan agent's script d35_check_values.py (numpy and scipy solve_ivp Radau with forward sensitivities, no pymrm, no page code; shortcut rows cross-checked against the ODE route as listed in the plan's equations file), 2026-11-27"
  date: 2026-11-27
  estimated_error: "below 1e-7 relative for the ODE rows, floating point for the algebraic rows; the tube and MV rtols (1e-5, 1e-4) are sized for the page's Richardson-extrapolated first-order finite volumes; S*_min is a near-cliff peak height (rtol 1e-2)"

conditions: >
  B (base): T_in = T_c = 500 K, P 5 bar, y_E 0.018, h = h_C210, c_p 1046 J/(kg K), a = 1.
  S (frozen validation): as B but T_c = 476 K. M (runaway): as B but y_E = 0.03 (the lower
  explosion limit), F = F_fig6. F = 1 is Table 6 as printed.

columns:
  - {name: name, unit: "-", description: "quantity; units as defined in the plan's equations file"}
  - {name: value, unit: "-", description: "value computed by the second route"}
  - {name: rtol, unit: "-", description: "relative tolerance the page must meet"}
