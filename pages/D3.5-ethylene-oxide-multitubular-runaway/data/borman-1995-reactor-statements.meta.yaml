  note: >-
    Seven short quotes (S1 to S7) on the purpose of the reaction, the explosion limit, the
    tube work, the catalyst pre-exposure, extrapolation and activity, each with its page and
    what this page does with it.
acquisition:
  method: table
  figure: journal pages 49, 53, 55 and 56 (PDF pages 1, 5, 7 and 8), as listed per row
