dataset_id: borman-1995-reactor-numbers
title: Reactor-relevant numbers printed in the text and the Table 4 footnote
status: complete
source:
  authors:
  - Borman, P. C.
  - Westerterp, K. R.
  year: 1995
  container: Industrial & Engineering Chemistry Research 34(1) 49-58
  doi: 10.1021/ie00040a002
  access: institutional subscription, TU Eindhoven (lawful access)
  licence: all rights reserved (facts extracted; no page image reproduced)
provenance_tier:
  tier: 2
  note: >-
    Heats of reaction, ring dimensions with tolerances, the kinetic batch, the lower explosion
    limit, the kinetic temperatures and pressures, the Table 4 standard condition and the
    activity remark. The kinetics (Table 6) are not repeated here: the page loads them from
    page C2.11.
acquisition:
  method: table
  figure: journal pages 49, 51, 53 and 55 (PDF pages 1, 3, 5 and 7), as listed per row
  tool: poppler pdftoppm at 150 and 200 dpi; every value read from the rendered page image, not the
    text layer (it substitutes digits)
  procedure: >-
    Read from the page images; each row names its journal and PDF page and quotes the printed
    words. Kept as printed strings (read with dtype=str).
  operator: Claude Opus 5.5 (assisted; transcribed by the planning agent, every row and quote
    spot-checked against the page image by the build agent), reviewed by the gallery maintainers
  date: '2026-11-27'
  estimated_error: None beyond the printed rounding.
columns:
- name: quantity
  unit: '-'
  description: identifier
- name: value
  unit: see unit column
  description: printed value (string)
- name: unit
  unit: '-'
  description: unit
- name: where
  unit: '-'
  description: section of the paper
- name: journal_page
  unit: '-'
  description: journal page
- name: pdf_page
  unit: '-'
  description: PDF page (journal page minus 48)
- name: quote
  unit: '-'
  description: the printed words the value comes from
