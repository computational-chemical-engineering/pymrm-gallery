# Provenance sidecar. Schema: docs/data-strategy.md
dataset_id: chiu1983-stated-results
title: >
  The six numerical results Chiu, Carratt & Soong (1983) state in running text
  and figure captions about their OWN model output - the three gel-effect onset
  conversions, the two activation energies of the mass-transfer parameters, and
  the factor by which the quasi-steady-state assumption overestimates the
  radical concentration.  Each row carries the sentence it was read from.

READ_THIS_FIRST: >
  THESE ARE THE PAPER'S OWN COMPUTED RESULTS, NOT MEASUREMENTS.  Reproducing
  them tests that this page has transcribed and implemented the published model
  correctly; it is REPRODUCTION, not validation against nature, and the page
  labels it so everywhere.  The measurements the paper compares against are
  Marten & Hamielec's (ref 7) and appear only as plotted points in Figures 3-9,
  which are not digitised.
  THE ONSET NUMBERS DESCRIBE A GRAPHICAL CONSTRUCTION, NOT A FORMULA.  The
  sentence they come from defines the onset as the intersection of a line
  extrapolated from "the sloped region" of the log k_t curve with "the initial
  value".  The paper prints no rule for which straight line, and calls the
  result a "qualitative impression".  The page therefore reconstructs the
  construction, states the reconstruction, root-finds it rather than sampling
  it, and reports the spread over 7 defensible readings - 6 of "the sloped
  region" and 1 of "the initial value" - as a band beside the number.  The band
  is a spread over those 7 and NOT a bound over every reading of the sentence:
  the steepest-slope tangent falls outside it and is reported separately, with
  the measured reason it is excluded - and the same measurement is applied to
  the readings that are kept in, including the 4-6-decade window, which was
  itself outside the band until 2026-08-14.
  THE COUNT IN THE PRECEDING PARAGRAPH SAID "three" UNTIL 2026-08-14 while every
  other file on the page said five, and the page's own prose sweep could not see
  it: word-spelled integers are outside the sweep's token classes, which the
  notebook states and counts.  That is a demonstrated blind spot, not a
  hypothetical one, and it is now named as such on the page.
  THE FACTOR-OF-2 ROW IS A LOWER BOUND, NOT AN EQUALITY.  The sentence says
  "more than a factor of 2", so the comparison on the page is an inequality
  test, and the row's value is the bound.
  WHICH CONDITION EACH ROW BELONGS TO.  The onset rows name their temperatures
  and are read off Figures 10-12, which plot BOTH initiator loadings; the paper
  quotes ONE onset per temperature and remarks that "initiator loading has very
  little effect on both curves", so the page computes both loadings and prints
  the pair.  THE HEADLINE USES I_0 = 0.0258 mol/L - the loading listed first in
  all three legends and the one Figures 16-18 plot - and the page says so and
  prints what the choice costs: the same construction on the 0.01548 curve of
  the same figures misses the printed onsets by up to 0.03126.  The paper gives
  no basis for preferring either curve.  The QSSA row belongs to the single
  condition of Figures 16-18,
  PMMA at 50 degC with I_0 = 0.0258 mol/L.  The two activation energies are read
  off Figure 13, which carries both loadings.

source:
  authors: ["Chiu, W. Y.", "Carratt, G. M.", "Soong, D. S."]
  year: 1983
  container: >
    "A Computer Model for the Gel Effect in Free-Radical Polymerization",
    Macromolecules 16(3) 348-357 (1983)
  doi: 10.1021/ma00237a002
  location: >
    Book p. 354 (PDF page 7), right column, running text - the onsets.
    Book p. 355 (PDF page 8), left column, running text, and the caption of
    Figure 13 on the same page - the two activation energies, stated twice.
    Book p. 356 (PDF page 9), left column, running text - the QSSA factor.

acquisition:
  method: transcription
  detail: >
    PDF pages 7, 8 and 9 rendered at the file's native 300 ppi and each sentence
    cropped and read at digit scale.  Every page carries a running head naming
    this article, checked before reading.
  ppi_native: 300
  rendered_at_ppi: 300

columns:
  key:
    units: "-"
    description: >
      Identifier of the stated result, used verbatim as the lookup key in the
      notebook so that no printed value is retyped in a cell.
  value:
    units: "-"
    description: >
      The number as printed: 0.26, 0.35, 0.45 (conversion, dimensionless),
      34 and 28 (kcal/mol), 2 (a dimensionless lower bound).
  units:
    units: "-"
    description: Units of the value, "-" where dimensionless.
  book_page:
    units: "-"
    description: >
      Printed page of Macromolecules 16 on which the sentence appears; the PDF
      page is the book page minus 347.
  quote_as_printed:
    units: "-"
    description: >
      The sentence the value was read from, transliterated (degC for the degree
      sign).  Kept so that the reading can be audited without the crop, and so
      that the hedges the paper itself uses - "around", "more than" - travel
      with the number.

rows: 6
