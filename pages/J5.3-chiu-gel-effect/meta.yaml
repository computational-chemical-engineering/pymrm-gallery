fit_vs_test: >
  EVERY PARAMETER IN TABLE II IS A FITTED NUMBER AND THE PAGE LABELS IT ONE
  EVERYWHERE.  The table's own title is "Model Parameters Used in Fitting
  Experimental Data" and Figure 13's caption repeats it - "Model parameters
  theta_t and theta_p chosen for the best fit of experimental data".  So
  anything computed from those cells and compared with the paper is a
  CONSISTENCY CHECK on the authors' own fit and on this page's transcription,
  never a validation of the model against nature.
  THE PAPER'S STATED NUMERICAL RESULTS ARE ITS OWN MODEL OUTPUT, so
  reproducing them is REPRODUCTION: two computations of the same published
  equations, which tests transcription and implementation and nothing else.
  THE ONE COMPARISON THAT WOULD BE A TEST IS NOT AVAILABLE.  The measurements
  are Marten & Hamielec's (ref 7) and appear in this paper only as markers on
  Figures 3-9, so the page establishes NOTHING about the model's empirical
  adequacy.
  A NULL BASELINE IS COMPUTED BESIDE THE ONE AGREEMENT THAT COULD HAVE FAILED
  FREELY: Figure 15's "all three points fall on the same straight line" holds to
  8.819e-04 <!-- claim: A_linear_in_Tgp2_max_rel --> relative in A, against
  1.535e-02 <!-- claim: A_null_linear_in_T_max_rel --> for the same three points
  fitted linearly in T, a gain of 17.4057 <!-- claim: A_null_gain -->.  The two
  forms have the same number of parameters and neither nests inside the other,
  so the direction of that ratio is evidence rather than algebra.
  WHAT THAT RATIO IS EVIDENCE FOR IS CONCAVITY IN T, NOT THE QUADRATIC FORM.  The
  three printed A values cannot determine T_gp: at the two ends of the interval
  they admit the gain is 3.6124 <!-- claim: A_gain_at_Tgp_band_lo --> and
  3.5347 <!-- claim: A_gain_min_at_Tgp_band_ends -->, and it diverges at
  111.42857 <!-- claim: Tgp_implied_C --> degC, where the three points are
  exactly collinear by construction.  Two other non-nested two-parameter
  regressors beat linear-in-T as well (the notebook prints them); what all of
  them read is the second difference of A,
  -0.007000 <!-- claim: A_second_difference -->.

scope_out:
  the_experimental_comparison: >
    FIGURES 3-9 CARRY EVERY MEASUREMENT IN THE PAPER AND NONE OF IT IS
    DIGITISED.  Conversion histories and average molecular weights, all plotted
    as markers taken from Marten & Hamielec (ref 7).  The paper's own tables and
    stated results support everything claimed here.  THE COST IS STATED PLAINLY:
    this page shows that the model was transcribed and implemented correctly and
    that its own internal correlations hold, and shows nothing about whether it
    describes PMMA.
  r_m_and_r_D: >
    THE PAPER PRINTS NO NUMBER FOR EITHER RADIUS, so the size of the correction
    the page derives for eq. 22 cannot be evaluated for PMMA.  r_m appears only
    inside the derivation of eq. 21-27 on book pp. 351-352 and in the caption of
    Figure 2, never beside a numeral, on a `pdftotext` sweep restricted to the
    pages whose running heads name this article, all of which were also read as
    images.  theta_t = r_m^2/(3 D_0) is fitted as a whole and never split.
  the_molar_mass: >
    NOT PRINTED, AND RECONSTRUCTED RATHER THAN GUESSED.  M_0 = d_m/MW is needed
    by eq. 13, 14, 16 and 17; the paper gives d_m and, on book p. 356, the
    Registry No. 80-62-6, and MW follows from C5H8O2 and standard atomic
    weights.  The notebook DEMONSTRATES that this cannot reach a headline:
    doubling MW leaves the conversion history unchanged to less than
    1e-10 <!-- claim: mw_reconstruction_x_maxdiff --> and scales the molecular
    weights by exactly the factor it should.

