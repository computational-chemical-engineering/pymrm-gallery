  status: complete
  note: >
    THREE PRINTED SOURCES, TRANSCRIBED, NOTHING DIGITISED.  Table I, Table II
    and the numerical results the running text and Figure 13's caption state
    about the model's own output, each stored with the sentence it was read
    from.  NO CURVE ON ANY OF THE PAPER'S FIGURES IS TRACED AND NO VALUE OFF A
    FIGURE ENTERS ANY DATASET, FIT OR METRIC.  One reading inside figures is
