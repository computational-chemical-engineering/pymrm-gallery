validation:
  ranked: >
    Strongest first, and the strongest one available is NOT a comparison with
    measurement, because this paper contains none in numerals.
    (1) INTERNAL IDENTITIES: eq. 24 and eq. 26 re-derived symbolically from
    eq. 21 with the paper's own boundary conditions, both exactly zero; eq. 22's
    "Since r_D >> r_m" shown to cost EXACTLY r_m/r_D, symbolically and through
    the flux a pymrm spherical-shell BVP computes, to
    1.858e-05 <!-- claim: eq22_rm_over_rD_max_dev -->; and the moment equations
    12-17 reproduced from eq. 4a, 4b and 5 summed over a seeded finite
    population, a relative residual below
    1e-14 <!-- claim: moment_identity_ktc_max_rel --> with a non-zero k_tc.
    (2) THE PAPER'S OWN CORRELATIONS recomputed from its own Table II: Figure
    13's activation energies (34.908161 <!-- claim: dE_theta_t_0258_kcal --> and
    34.516600 <!-- claim: dE_theta_t_01548_kcal --> for theta_t,
    27.771564 <!-- claim: dE_theta_p_kcal --> for theta_p) and Figure 15's
    straight line.
    (3) THE PAPER'S STATED RESULTS reproduced from the model: the onset
    conversions, the activation energies and the QSSA factor.
    (4) REFINEMENT STUDIES to observed order (the shell BVP, the backward-Euler
    marcher and the shell's own flux), each against a reference that shares no
    assembly with it, plus a refinement of the resampling grid the onsets are
    read on, which moves them by
    1.311e-05 <!-- claim: onset_resample_floor_max_rel --> relative, so five
    decimals are quoted.
    (5) DEFECT INJECTIONS with a coverage map generated from measured moves.
  headline: >
    THE ONSET CONVERSIONS.  Book p. 354 defines the onset as the intersection of
    a line extrapolated from "the sloped region" of the log k_t curve with "the
    initial value", and states one onset per temperature.  Reconstructed as a
    least-squares line over the decades L_0-2 to L_0-4 and extrapolated to
    L_0 = log10 k_t^0, the model gives 0.25516 <!-- claim: onset_x_50C -->,
    0.34838 <!-- claim: onset_x_70C --> and 0.44034 <!-- claim: onset_x_90C -->,
    off by -0.00484 <!-- claim: onset_dev_50C -->,
    -0.00162 <!-- claim: onset_dev_70C --> and
    -0.00966 <!-- claim: onset_dev_90C -->, with the increase with temperature
    reproduced.
    THE HEADLINE IS AT THE HIGHER INITIATOR LOADING AND THE PAGE SAYS SO.  The
    paper quotes one onset per temperature while Figures 10-12 plot both
    loadings; the higher one is listed first in all three legends and is the one
    Figures 16-18 plot.  The same construction on the other loading's curve
    misses by up to 0.03126 <!-- claim: onset_dev_other_loading_max -->,
    3.24 <!-- claim: onset_other_over_headline --> times the headline miss.
    THE LIMIT ON THAT NUMBER IS THE SENTENCE, NOT THE ARITHMETIC: the defensible
    readings of the construction spread the answer by up to
    0.09009 <!-- claim: onset_definition_band_max -->,
    9.33 <!-- claim: onset_band_over_max_dev --> times the largest miss, while an
    independent integration reproduces the onsets to below
    1e-10 <!-- claim: onset_two_route_max_rel --> relative, which prices the
    attracting manifold lambda_0(x) rather than the accuracy of either
    integration.  The band is a spread over the readings the notebook lists, not
    a bound over every reading of the sentence: the steepest-slope tangent lies
    outside it and is excluded because its tangent point sits at the right edge
    of this page's window, and the same test is applied to the readings kept in.
  second_routes: >
    QUANTITIES COMPUTED A SECOND WAY, AND WHAT EACH ONE TESTS.  The constitutive
    curve from the ODEs re-parametrised by conversion with a different solver
    family (below 1e-10 <!-- claim: onset_two_route_max_rel -->), which prices
    the attracting manifold; the shared start state against the algebraic
    quasi-steady root of eq. 12 (7.36e-06 <!-- claim: qss_start_max_rel -->);
    eq. 26 against sympy's own integration of eq. 21 (exactly zero); eq. 22's
    error against the symbolic r_m/r_D, read off the discrete flux of the pymrm
    shell solve (1.858e-05 <!-- claim: eq22_rm_over_rD_max_dev -->); the moment
    equations against the chain-length equations summed (below
    1e-14 <!-- claim: moment_identity_max_rel -->); the same identity with its
    truncation deliberately violated
    (3.13e-02 <!-- claim: moment_identity_trunc_max_rel -->, a companion, not an
    independent check); and the conversion through the gel region by the pymrm
    backward-Euler marcher against BDF
    (2.12e-05 <!-- claim: march_err_finest -->).
  break_table: >
    The coverage map is GENERATED from measured moves: each row returns the
    claims recomputed under its defect, and the notebook fails to execute if any
    claim is uncovered and not named structural, or any row moves nothing.  The
    notebook prints the number of rows and links.  A row breaks a claim when the
    claim's own check fails on the injected value.  Ratios and means the prose
    quotes are recomputed from each row's own outputs.
    STRUCTURAL CLAIMS SAY WHAT THEY CANNOT DETECT: moment_identity_broken_max_rel
    is exactly 2 by construction, because flipping the sign of a moment term
    that matches its chain-length sum exactly turns |rhs-lhs|/|lhs| into
    |-2c|/|c| on any population, which is why moment_identity_trunc_max_rel
    exists beside it and is covered; and three counts are fixed by the paper
    (the named parameters, the rows of Table II, and the size of the paper's own
    compression).
    Round-off quantities are BOUNDS with a stated basis, checked on every machine
    and in CI; the observed orders are bounds from theory; every other metric is
    a value held to 5 % of its baseline in CI.
  determinism: >
    Nothing on the page is stochastic except the test population of the
    moment-closure identity, which is drawn from a SEEDED generator (seed
    19830348, the year and first page of the article).  Every integration starts
    from the same t = 0 state, so no answer can depend on a sweep order.

what_pymrm_adds: >
  HONESTLY, VERY LITTLE TO THE PHYSICS, AND THE PAGE SAYS SO.  This is a
  zero-dimensional batch model; its eight equations are an ODE initial-value
  problem, and every headline number is arithmetic on printed cells or an ODE
  solution with pymrm nowhere in the causal chain.
  WHAT PYMRM DOES BUY, IN TWO PLACES, BOTH MEASURED.  (1) A residual-and-Jacobian
  form for the eight-field source term: NumJac((1, 8)) plus newton gives a
  backward-Euler step that is first order (observed
  1.0277 <!-- claim: march_order --> from successive differences,
  2.12e-05 <!-- claim: march_err_finest --> against the BDF reference) and gives
  the model the shape a nonisothermal or spatially resolved version would need,
  which is what the paper's own conclusion asks for.  NO SUCH EXTENSION IS
  COMPUTED, because nothing in this paper would test it.  (2) The paper's own
  eq. 21 SOLVED instead of approximated: construct_grad and construct_div(nu=2)
  on the shell r_m <= r <= r_D reproduce the exact first integral (the same flux
  at every face to less than 1e-8 <!-- claim: bvp_K_spread_rel --> relative,
  structural for a conservative finite-volume scheme with no source) with its
  flux at observed order 1.7483 <!-- claim: bvp_order -->, and the VALUE of that
  flux agrees with eq. 22 understating K by exactly r_m/r_D to
  1.858e-05 <!-- claim: eq22_rm_over_rD_max_dev -->.  Setting nu = 0 moves that
  by orders of magnitude.
  AND WHAT IT DOES NOT ADD: no extension to conditions the paper did not
  compute, no spatial resolution, no comparison with any measurement, and no
  resolution of the half of the case that lives in Figures 3-9.

