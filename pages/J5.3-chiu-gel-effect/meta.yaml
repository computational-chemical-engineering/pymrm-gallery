data:
  tier: 6
  method: table
  status: complete
  note: >
    THREE PRINTED SOURCES, TRANSCRIBED, NOTHING DIGITISED.  Table I (8 lines),
    Table II (6 rows) and the six numerical results the running text and
    Figure 13's caption state about the model's own output, each stored with the
    sentence it was read from.  NO CURVE ON ANY OF THE PAPER'S EIGHTEEN FIGURES
    IS TRACED AND NO VALUE OFF A FIGURE ENTERS ANY DATASET, FIT OR METRIC.
    One reading INSIDE figures is declared where it is used and is a
    corroboration, not a data source: Figures 10-12 plot log k_t and log k_p
    against conversion on an axis labelled 0 to 12, and their plateaux at about
    9.3 and about 4.5 agree with what Table I's constants give (9.2952/4.5256 at
    50 degC, 9.3229/4.6972 at 70, 9.3475/4.8499 at 90).  That corroborates the
    transcription of four pre-exponentials and two activation energies; no
    number from it is in a CSV or a metric.

fit_vs_test: >
  EVERY PARAMETER IN TABLE II IS A FITTED NUMBER AND THE PAGE LABELS IT ONE
  EVERYWHERE.  The table's own title is "Model Parameters Used in Fitting
  Experimental Data" and Figure 13's caption repeats it - "Model parameters
  theta_t and theta_p chosen for the best fit of experimental data".  So
  anything computed from those cells and compared with the paper is a
  CONSISTENCY CHECK on the authors' own fit and on this page's transcription,
  never a validation of the model against nature.
  THE PAPER'S SIX STATED NUMERICAL RESULTS ARE ITS OWN MODEL OUTPUT, so
  reproducing them is REPRODUCTION and the page says so in those words: two
  computations of the same published equations, which tests transcription and
  implementation and nothing else.
  THE ONE COMPARISON THAT WOULD BE A TEST IS NOT AVAILABLE.  The measurements
  are Marten & Hamielec's (ref 7) and appear in this paper only as markers on
  Figures 3-9.  The page therefore establishes NOTHING about this model's
  empirical adequacy, and does not digitise a curve to manufacture a claim it
  cannot support.
  A NULL BASELINE IS COMPUTED BESIDE THE ONE AGREEMENT THAT COULD HAVE FAILED
  FREELY: Figure 15's "all three points fall on the same straight line" holds to
  8.819e-04 relative in A, against 1.535e-02 for the same three points fitted
  linearly in T instead - 17.4057x worse.  The two forms have the same number of
  parameters on the same three points and neither nests inside the other, so the
  DIRECTION of that ratio is evidence rather than algebra, which the page states
  explicitly (unlike the nested-null case on J4.4).
  WHAT THAT RATIO IS EVIDENCE FOR IS CONCAVITY IN T, NOT THE QUADRATIC FORM, and
  the page says so with its own measurements rather than letting 17.4057x stand
  alone.  The gain is a strong function of T_gp, and this page has already shown
  that the three printed A values cannot determine T_gp: at the two ends of the
  interval they DO admit the gain is 3.6124x and 3.5347x, and it diverges at
  111.42857 degC where the three points are exactly collinear by construction.
  Nor is the quadratic singled out - A against 1/T beats linear-in-T by 5.5926x
  and A against (T - 130)^2 by 3.2607x, both two-parameter and neither nested.
  With three points and one residual degree of freedom what all of them read is
  the second difference of A, -0.007000, which linear-in-T cannot represent.

scope_out:
  the_experimental_comparison: >
    FIGURES 3-9 CARRY EVERY MEASUREMENT IN THE PAPER AND NONE OF IT IS
    DIGITISED.  Conversion histories at three temperatures and two initiator
    loadings, and average molecular weights against conversion at four of those
    six conditions, all plotted as markers taken from Marten & Hamielec (ref 7).
    Reading them would need a figure review, and the page is built so that it
    does not need one: the paper's own tables and stated results support
    everything claimed.  THE COST IS STATED PLAINLY - this page shows that the
    model was transcribed and implemented correctly and that its own internal
    correlations hold, and shows nothing at all about whether it describes PMMA.
  r_m_and_r_D: >
    THE PAPER PRINTS NO NUMBER FOR EITHER RADIUS, so the size of the correction
    the page derives for eq. 22 cannot be evaluated for PMMA.  The search behind
    that negative claim: r_m appears only inside the derivation of eq. 21-27 on
    book pp. 351-352 and in the caption of Figure 2, never beside a numeral, on
    a `pdftotext` sweep restricted to PDF pages 1-9 (the pages whose running
    heads name this article), and all nine of those pages were also read as
    images.  theta_t = r_m^2/(3 D_0) is fitted as a whole and never split.
  the_molar_mass: >
    NOT PRINTED, AND RECONSTRUCTED RATHER THAN GUESSED.  M_0 = d_m/MW is needed
    by eq. 13, 14, 16 and 17; the paper gives d_m and, on book p. 356, the
    Registry No. 80-62-6, and MW = 100.117 g/mol follows from C5H8O2.  The
    notebook DEMONSTRATES that this cannot reach a headline rather than
    asserting it: doubling MW moves the conversion history by 1.34e-12 and
    lambda_0 by 1.57e-11 - both solver noise - and mu_1 by 0.499939, exactly the
    factor it should.

