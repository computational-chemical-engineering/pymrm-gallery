dataset_id: hufton-1999-printed-numbers
title: "Printed equilibrium numbers, Table 1, the bench-scale numbers and the Langmuir constant of Hufton, Mayorga and Sircar (1999)"
status: complete

source:
  authors: ["Hufton, J. R.", "Mayorga, S.", "Sircar, S."]
  year: 1999
  title: "Sorption-enhanced reaction process for hydrogen production"
  container: "AIChE Journal 45, 248-256"
  doi: "10.1002/aic.690450205"
  access: >
    Publisher PDF (9 pages; text layer plus 300 ppi figure images) held outside the
    repository, lawful access. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: table
  figure: "Text of p. 251 (the f = 0 equilibrium and the claims on Fig. 3), Table 1 and its footnote (p. 255), the text of p. 254 to 255 (bench-scale SERP run) and p. 253 (Langmuir fit)"
  resolution: "pages rendered at 150 ppi and 300 ppi from the PDF; every entry read from the page image, not the text layer; journal page = PDF page + 247"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    None beyond the printed precision: entries are kept as printed strings (read with
    dtype=str) and compared in half-units of their last printed digit. The text layer
    mangles symbols (Greek letters, the degree sign, inequality signs) and is used for
    no entry. Inequalities ("> 95%", "< 100 ppm", "< 50 ppm") are stored as the bare
    number, with the sign in the meaning column.

conditions: >
  The p. 251 numbers and Fig. 3 are the batch equilibrium of Eqs. 3 to 10 (p. 250) at
  450 C, 50 psig and H2O/CH4 = 6. Table 1's SMR rows are labelled 55 psig. The SERP row of
  Table 1 and the p. 254 to 255 numbers are an experiment (an averaged product of a
  single bench-scale reactor), not an equilibrium calculation. The Langmuir constant is
  for 400 C with dry CO2/N2, not for the 450 C steam condition of the SERP run.

columns:
  - {name: item, unit: "-", description: "short name"}
  - {name: printed, unit: "-", description: "the entry as printed, a string"}
  - {name: unit, unit: "-", description: "unit of the entry"}
  - {name: page, unit: "-", description: "journal page"}
  - {name: meaning, unit: "-", description: "what the entry is, with the wording where it matters"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure or page image is reproduced.
