dataset_id: krishna-baur-2003-printed-results
title: Results Krishna & Baur (2003) print as numbers, used as the targets this page is checked against
status: complete

source:
  authors:
    - "Krishna, R."
    - "Baur, R."
  year: 2003
  container: "Separation and Purification Technology 33(3) 213-254"
  doi: 10.1016/S1383-5866(03)00008-X
  access: >
    Elsevier full-text API (article/pii/S138358660300008X) with an authorised
    institutional key held outside the repository. Lawful access; no PDF and no
    page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

conditions:
  karger: >
    Section 2.2. Applying the Karger relations eq. (23) to 2-methylhexane in
    MFI, with the jump frequencies of Table 3 and the cell dimensions printed
    on the same page, the review prints the three directional zero-loading
    diffusivities and then their orientation average from eq. (24). Table 3
    prints the same average again, as its D_i(0) column. THE TWO PRINTED
    AVERAGES DISAGREE: 6.58e-14 in the text, 6.85e-14 in the table. The page
    resolves which is which; see `validation` below.
  karger_CH4: >
    Same section, and it is the review's SECOND application of eq. (23). It
    takes CH4 in MFI at 300 K with a straight-channel jump frequency of 4.2e11
    and a zig-zag-channel frequency of 3.6e11 s^-1 and reports Ð(0) = 2.75e-7
    m2/s where the KMC simulations give 1.5e-8 - i.e. the Karger formula breaks
    down for a molecule that also sits in the channel interiors. Stored for two
    reasons: it is the review's own statement of where its own formula fails,
    AND it is a second, independent witness to the factor of two the page finds
    in eq. (23c). The page prints it and reconciles it rather than using it only
    for a ratio.

    PRINTED DEFECT, FLAGGED NOT SILENTLY REPAIRED. The review prints "nu_str"
    for BOTH channel systems in the sentence that supplies these frequencies
    ("for transport along the zig-zag channels nu_str = 3.6x10^11 s^-1"). The
    second must be nu_zz. Reading it as nu_zz is a repair by inference and is
    recorded as such here, in the parameter CSV's own note and sidecar, and on
    the page beside the eq. (23c) denominator and the sign of eq. (25). An
    earlier version of this file asserted nu_zz = 3.6e11 without saying it was a
    repair; that was the defect AGENTS.md forbids and it is corrected here.
  dsl_3MP: >
    Section 2.4. The crystals are equilibrated with 3MP vapour at 100 kPa,
    giving a uniform loading of 5.596 molecules per unit cell; at t = 0 the
    external pressure drops to 0.5 Pa, whose equilibrium surface loading is
    0.093. Both numbers are printed in the running text, and both follow from
    the Table 2 DSL row for 3MP alone.
  sherwood: >
    Section 2.3. The review defines a time-averaged Sherwood number in eq. (31)
    and states that "in the adsorption literature a constant value of Sh = 10,
    corresponding to a 75% approach to equilibrium, is usually taken to model
    uptake in batch adsorbers". The 75% is a claim about the constant-diffusivity
    series solution eq. (30), and is checkable against it.
  permeation: >
    Section 4.1. Single components permeating an MFI membrane at 300 K from a
    well-mixed upstream compartment to a swept downstream compartment held at
    vanishing partial pressure. C1 at 95 kPa upstream with D_MS = 1e-9 m2/s
    reaches a steady flux of 34 mmol/m2/s; nC4 at 5 kPa with D_MS = 1e-11 m2/s
    reaches 3.1. The review then forms the selectivity these two would imply,
    (3.1/34.0)/(5/95) = 1.73, in order to show in Section 4.2 that the actual
    mixture value is nothing like it. THE MEMBRANE THICKNESS IS NOT PRINTED,
    which is why this page checks the flux RATIO, in which it cancels.
  asymmetry: >
    Section 2.4. "The desorption kinetics are much slower than the adsorption
    kinetics; this is evidenced by the fact that at Fo = D_1 t/rc^2 = 0.04, the
    adsorption process is nearly at equilibrium whereas the desorption process
    has still a long way to go to equilibration." Stored as a Fourier number,
    with the two approaches to equilibrium computed on the page rather than
    stored, because the review does not print them.
  density: >
    The only density the review prints for MFI, 1800 kg/m3, appears in the
    caption of Fig. 40 (a packed-bed calculation unrelated to the membrane).
    It is stored because it is the only route to an absolute permeation flux,
    and the page uses it only to RECONSTRUCT the unprinted membrane thickness,
    never to produce a number it then compares against the review.

acquisition:
  method: table
  figure: "in-text stated results, Sections 2.2, 2.3, 2.4 and 4.1; Table 3; the caption of Fig. 40"
  tool: "Elsevier full-text API, text/plain, transcribed by hand"
  procedure: >
    These are NOT measurements. Each row is a number the authors computed and
    printed, collected so that an independent implementation of the review's own
    equations can be scored against them. No value in this file was adjusted,
    reconciled or inferred; where two printed values of the same quantity
    disagree (karger_avg against karger_table3) BOTH are stored as printed and
    the page reports which one follows from eq. (23).
  operator: "Claude Opus 5 (assisted)"
  date: 2026-08-02
  estimated_error: >
    None beyond the printed precision (two to three significant figures).
    Transcribed characters, not digitised positions. The permeation fluxes are
    printed to two figures, so the flux ratio 34/3.1 carries up to about 3%
    of rounding on its own (1.5% from each).

validation:
  karger_xy: "eq. (23) reproduces karger_Dx to 0.002% and karger_Dy to 0.29%"
  karger_z: "eq. (23) gives 1.654e-14 for D_z(0), EXACTLY twice the printed 0.827e-14"
  karger_average_resolved: >
    The two printed averages are both consistent, with different inputs:
    (5.05 + 13.86 + 1.654)/3 = 6.855e-14 = Table 3's printed 6.85e-14, while
    (5.05 + 13.86 + 0.827)/3 = 6.579e-14 = the text's printed 6.58e-14. So
    Table 3 was computed from eq. (23) and the running text was computed from
    the printed D_z; the factor of two sits in the text's D_z and propagates
    into the text's average. The page reports the discrepancy as 4.1% and does
    not pick a physical winner, because the origin of the factor 2 cannot be
    settled from the review alone.
  dsl_3MP: "eq. (32) with the Table 2 3MP row gives 5.5958 and 0.09282 against the printed 5.596 and 0.093"
  sherwood: "eqs. (30) and (31) put Sh = 10 at F = 0.7559, against the printed 75%"
  permeation_ratio: "the flux ratio from eqs. (12), (15) and (32) is 10.949 against the printed 34/3.1 = 10.968, a deviation of -0.17%"
  sp_pure_arithmetic: "(3.1/34.0)/(5/95) = 1.732 against the printed 1.73"
  karger_CH4_second_application: >
    eq. (23) + (24) on the CH4 frequencies, with the same MFI cell dimensions,
    gives 2.743e-7 m2/s with D_z halved (-0.25 % from the printed 2.75e-7) and
    2.888e-7 without (+5.0 %). The review's PRACTICE therefore uses the halved
    relation in both of its worked examples, and Table 3's 6.85e-14 - the value
    consistent with eq. (23) as printed - is the odd one out. The page states
    this and still declines to say whether the factor of two originates with
    Karger or with the review, because the original is not on disk.

columns:
  - {name: result_id, unit: "-", description: "key used in the notebook"}
  - {name: where, unit: "-", description: "the numbered section, table or caption the value is printed in"}
  - {name: quantity, unit: "-", description: "symbol for the quantity"}
  - {name: value, unit: "see units column", description: "numeric value in SI units, except fluxes which are kept in the printed mmol/m2/s"}
  - {name: units, unit: "-", description: "units of value"}
  - {name: printed_as, unit: "-", description: "the value as it appears in the review"}
  - {name: description, unit: "-", description: "what the number is and under what conditions"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image, figure or
  full-text excerpt is reproduced.

caveat: >
  TIER 6. Every row is the authors' own computed output, not a measurement.
  Reproducing them establishes that this page implements the review's equations
  and reads its parameters correctly - it is REPRODUCTION, not validation, and
  the page says so in those words.

  The review does contain experimental comparisons, and they divide in a way the
  next builder needs to know. Within THIS page's scope - single-component
  diffusion - all of them live only in figures: Garg & Ruthven's ethane uptake
  (Fig. 5), Millot's Arrhenius data (Fig. 12), Shah's benzene diffusivities
  (Fig. 9c), Habgood's 4A uptake (Figs. 32-34) and Jolimaitre's breakthroughs
  (Figs. 38-39). None is transcribed here and none is claimed. But the MIXTURE
  membrane selectivities of Bakker (S_P = 380 and 60) and Funke et al. (24 and
  1.3) are stated in the review's RUNNING TEXT, not in a figure, so case H1.9
  can compare against measurement where this page cannot. Note the tier: on
  docs/data-strategy.md's ladder a number printed as text is TIER 2, method
  `table`; tier 4 means digitised from a figure. H1.9 would be tier 2 with the
  origin recorded under origin_not_consulted, not tier 4. That is recorded in
  queue_cases/H1.9.yaml.
