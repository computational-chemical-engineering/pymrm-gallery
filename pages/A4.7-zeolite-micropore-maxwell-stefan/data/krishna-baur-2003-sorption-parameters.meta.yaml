redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image, figure or
  full-text excerpt is reproduced.

caveat: >
  TIER 6. Nothing in this file is a measurement of a diffusivity. The DSL
  parameters of Tables 1 and 2 are fits to CBMC molecular simulations; Table 3's
  jump frequencies come from transition state theory; the two membrane
  diffusivities of Section 4.1 are stated constants with no source given in the
  review. The one row fitted to experiment is the benzene isotherm of the Fig. 9
  caption, and even there what is stored is the fit, not the measurements.
  Reproducing these numbers tests the reimplementation of the review's equations
  and the transcription; it says nothing about whether the Maxwell-Stefan
  description is right.
