validation:
  - "Karger eq. (23) reproduces the review's printed D_x(0) and D_y(0) to 0.29 % <!-- claim: karger_xy_max_rel_dev --> at worst from Table 3's jump frequencies and the cell dimensions printed beside them."
  - "The review prints two values for one orientation-averaged diffusivity, 4.1 % <!-- claim: karger_table3_vs_text_rel --> apart; eq. (24) recovers Table 3's to 0.070 % <!-- claim: karger_table3_rel_dev --> and the text's to -0.013 % <!-- claim: karger_text_rel_dev --> from the text's own printed D_z, and the gap is a factor of two in that D_z (printed over computed 0.50005 <!-- claim: karger_z_printed_over_computed -->, half the computed value within half a unit of the printed last digit)."
  - "OUT OF SAMPLE: the review applies eq. (23) a second time, to CH4, and prints only the average; the halved D_z reproduces it to -0.25 % <!-- claim: karger_CH4_halved_rel_dev --> and eq. (23c) as printed misses by +5.0 % <!-- claim: karger_CH4_unhalved_rel_dev -->."
  - "The DSL isotherm eq. (32) with Table 2's 3MP row gives the review's two worked loadings within half a unit of their printed last digit (at worst 0.41 <!-- claim: dsl_3MP_halfunits_max --> of it)."
  - "Eq. (33) against a central difference of ln P in ln Theta: worst gap 2.5e-6 <!-- claim: gamma_eq33_vs_numerical -->, inside the difference's truncation and round-off budget; an identity check that detects a mis-transcribed FORMULA (a dropped site factor) and never a mis-transcribed PARAMETER."
  - "The two-extrema survey has NO printed target, so its EXPOSURE is measured: of four injected transcription slips, 1 <!-- claim: extrema_survey_verdicts_moved --> rewrites the survey's count, another moves the 2MB minimum from 5.71 <!-- claim: extrema_2MB_thmin --> to 4.19 <!-- claim: extrema_2MB_thmin_slipped --> with every verdict unchanged, and the eq. (33) identity does not see any of them."
  - "Eqs. (30) and (31), both roots of the series: F at Sh = 10 is 75.59 % <!-- claim: F_at_Sh10 -->; Sh at three-quarters uptake is 10.078 <!-- claim: sh75_series_exact -->, the same deviation read the other way round."
  - "The single-component permeation flux RATIO, in which the unprinted membrane thickness and the framework density cancel, lies -0.17 % <!-- claim: flux_ratio_rel_dev --> from the printed fluxes' ratio; dropping the thermodynamic factor moves it by a factor of 3.73 <!-- claim: flux_ratio_gamma_lever -->."
  - "The pymrm crystal against the exact series eq. (30), cell size and step on separate ladders: observed orders 0.99 <!-- claim: dt_observed_order --> in step and 1.95 <!-- claim: space_observed_order --> in cell size; production time-integration error 1.54e-3 <!-- claim: production_rel_err -->. On the 3MP desorption the production value is 1.6e-3 <!-- claim: nl_production_err --> from the value extrapolated in both. Newton reports success on every implicit step."
  - "A defect-injection table: every claim that is not a named identity fails at least one row."

adds: >
  pymrm supplies the crystallite: construct_grad and construct_div for the
  sphere, construct_boundary_value_matrices for the boundary-face loadings,
  newton per backward-Euler step for the loading-dependent diffusivity,
  find_roots for the extrema of Gamma, the roots of eqs. (30) and (31) and the
  crossings on the solved model, and observed_orders for the refinement
  ladders. With it the page measures what the review states in words: the
  time-averaged Sherwood number under eq. (18) rises from
  12.75 <!-- claim: sh75_weak_03 --> to 35.8 <!-- claim: sh75_weak_09 --> with
  the surface occupancy, and the 3MP adsorption-desorption asymmetry holds
  under both loading scenarios. The algebra of eqs. (23), (32) and (33), the
  location of the factor of two in eq. (23) and the two-extrema survey are the
  page's own.

agreement: >
  The consistent printed targets reproduce to 0.78 % <!-- claim: targets_worst_rel_dev -->
  at worst; the running text's orientation-averaged diffusivity is out by
  4.2 % <!-- claim: karger_eq23_vs_text_rel --> and is reported as a printed
  inconsistency rather than scored. Nothing is fitted.

caveats: >
  TIER 6 AND REPRODUCTION, NOT VALIDATION. Every target is a number Krishna &
  Baur themselves computed. Every experimental comparison inside this page's
  scope lives only in a figure, and nothing here rests on one. The review's
  mixture membrane selectivities are stated in its running text and belong to
  case H1.9. Scope: single component only. The review's Fig. 10(a) reports an
  inflection in the 3MP desorption kinetics that the page does not reproduce
  under either stated loading dependence of the M-S diffusivity: the desorption
  rate rises at 0 <!-- claim: mp3_desorption_rate_rises --> steps. THREE printed
  defects are recorded and none is silently fixed: the sign of eq. (25); the
  nu_zz + nu_zz in the denominator of eq. (23c); and the symbol nu_str printed
  twice in the sentence that supplies the CH4 jump frequencies, where the second
  must be nu_zz, a repair by inference flagged on the page, in the CSV row's
  note and in both sidecars.
