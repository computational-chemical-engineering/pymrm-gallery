adds: >
  Nothing to the model, and the page says so plainly: the random pore model is
  two closed forms and most of the notebook would run with pymrm uninstalled,
  exactly as on J1.4, A1.6 and B1.7. What newton and NumJac do here is narrow
  and real. (1) Whole families of inversions as one Newton problem - eq. (32)
  inverted for tau across a (psi, sigma) block, eq. (35) inverted for the
  optimal initial porosity - with NumJac((K,1)), independent scalars and a
  diagonal Jacobian by construction; the shape is (K,1) and never (K,) per the
  house rule. (2) A residual written so it can be solved at all: eq. (32)'s
  direct residual UNDERFLOWS at psi = 100 and hands newton an exactly singular
  Jacobian (measured during this build), so the residual is written in log form
  with no exponential in it, and tau is carried through a sigmoid that cannot
  leave (0, sigma). (3) The rate law marched as an initial-value problem, so
  eqs. (32) and (37) check each other instead of being asserted equal -
  Crank-Nicolson, observed order 2.000. (4) Root-finds and closed forms
  everywhere a sweep would have been wrong: X_M, m*, the optimal eps_o, the
  divergence conversion, the overlap-law crossing, the psi at which m* reaches
  zero. The one output useful beyond reproduction is not pymrm at all: the
  NORMALISED MISFIT of the paper's own integral I, which turns "which grain
  shape factor fits this pore structure" into a curve with an error bar and
  says what Figure 6 cannot - that past psi = 2 the best available m already
  misfits by more than 8 %, rising through 20 % at psi = 5 and 32 % at
  psi = 10, because no order-of-reaction model can produce a rate maximum.

agreement: >
  Everything on this page is structural, printed-claim-versus-computed, or
  solver-versus-closed-form; nothing is experimental and nothing is fitted to
  data. Printed claims recovered: best-fit m = 1.0000000000 at psi = 0 and
  0.4905224 at psi = 2 (printed 0.49 <= m <= 1), 0.6638850 at psi = 1 (printed
  "very close to two-thirds", 0.417 % below); X_M -> 0.3934693 (printed
  < 0.393); psi = 4.965326 for the Fig. 4 set (printed 5, 0.69 %); the Petersen
  triple closing to 0.74 % in porosity and 0.21 % in surface; the 75 %
  agreement claim landing at X = 0.742325 with a worst deviation of 0.0218 up
  to X = 0.75, under the convention p. 384 prints for curve B (fixed by
  eps_o and L_o), with the other two pairings printed beside it (0.759878 under
  eps_o and S_o, 0.768736 under S_o and L_o, so the band is second-digit);
  tau_1/2 within 2.922 % of its plateau at sigma = 100 and
  spreading 7.158 % at sigma = 0.25. Cross-page: Bhatia's eq. (40) equals
  B3.1's Yagi-Kunii eq. (6) at omega = 0 to 1.1e-16, with B3.1's published
  3.848988e-10 reproduced to 3.5e-06 at that page's own omega = 1e-9.
  Solver-versus-closed-form: Crank-Nicolson march of eq. (37) against eq. (32),
  9.8e-08 at 800 steps, observed order 2.000; the pymrm block inversion of
  eq. (32) against scipy brentq, 6.6e-16 over 20 (psi, sigma) states; two
  routes to Petersen's surface, 4.4e-16; two routes to Petersen's conversion,
  1.0e-15 (both of these are round-off on an identity once G = 3/(2 u_o) is
  substituted, so what they test is the ROOT of eq. (7) and the transcription of
  eq. (4), not eq. (6) itself - said on the page); eq. (6) hitting X = 1 exactly
  at s = 2G/3 - 1 to 2.2e-16, which is an identity for EVERY root of eq. (7) and
  therefore tests the joint transcription of (6) and (7) rather than the root
  selection - also said on the page, with the row that does move it; the
  closed-form I against Gauss-Legendre, 7.6e-12. Printed defects: "This match
  at m = 1" [sic] where the least squares gives 0.6639 and m = 1 misfits 5.34x
  worse; the worked example's printed eps_o = 0.1 against eq. (35)'s root
  0.0852877 (residual -4.2e-03, surface cost 0.0028 %); Park & Levenspiel
  1976/1975. Found and reported, not printed by the paper: curve C's (S_o, L_o)
  pair exceeds the maximum Petersen surface at that length by 4.5956x, so
  eq. (3) has no root; the curve-D length is 7.746973e7 cm/cm3; and eq. (7)'s
  cubic has three real roots of which eqs. (3),(4),(6) select exactly one.

caveats: >
  NO EXPERIMENTAL CONTENT ANYWHERE, BY A SCOPE DECISION STATED UP FRONT. The
  paper's single comparison with experiment is Figure 8 - the CS and VC char
  data of Hashimoto et al. (1979), a paper not on disk here - and it is not
  digitised: no point, curve or axis coordinate is taken from it or from any of
  the paper's other seven figures. THIS PAGE MUST NOT BE CITED AS EVIDENCE THAT
  THE RANDOM PORE MODEL DESCRIBES ANY REAL SOLID. The three char numbers it
  uses (S_o = 520 m2/cm3, psi = 6.9, psi = 13.7) are transcribed from the
  PROSE of p. 385, and everything derived from them - the surface maxima at
  X = 0.2989 and 0.3475, the Figure-8 intercept and slopes, the length-averaged
  pore radii of 0.557(1-eps_o) and 0.281(1-eps_o) nm - is a PREDICTION of the
  model at those parameters, never a validation of it. Anyone with the
  Hashimoto tables can build the comparison this page leaves open.

  THE EFFECTIVENESS-FACTOR CLAIM CANNOT BE CHECKED HERE. "Thiele moduli based
  on the initial surface areas are small enough to assure effectiveness factors
  over 0.98 in all cases" (p. 385) is what justifies the kinetic-control
  assumption, and the paper prints no particle size, no diffusivity and no rate
  constant, so the moduli behind it cannot be reconstructed. What the page
  computes is only what the claim DEMANDS of the modulus - phi < 0.555707 for a
  sphere - and it says so.

  KINETIC CONTROL THROUGHOUT, which is the paper's own title. Part II
  (non-isothermal operation and diffusion control) is NOT on disk, was not
  consulted, and nothing here depends on it; B3.2 is the neighbouring page
  where intergrain diffusion is present and matters.

  PETERSEN (1957) IS READ ONLY AS THIS PAPER REPRINTS IT. Eqs. (3)-(5) are
  Bhatia and Perlmutter's transcription on p. 380 and eqs. (6)-(7) are theirs
  via Szekely, Evans and Sohn (1976); neither original was consulted, and every
  statement about "Petersen's model" on the page is a statement about that
  reprint. The same applies to Avrami (1940), whose eq. (19) is used as
  reprinted.

  ORIGIN NOT CONSULTED, and nothing here derives from them: Hashimoto et al.
  (1979); Petersen (1957); Szekely, Evans & Sohn (1976); Avrami (1940); Walker
  & Raats (1956); Kawahata & Walker (1962); Dutta et al. (1977); Dutta & Wen
  (1977); and the rest of the modelling literature the paper surveys.

  ONE NUANCE THE PAPER DOES NOT PRINT, stated as this page's own: the abstract
  says the model "is not consistent with the assumption of flat plate grains
  (m = 0) for any pore structure" and p. 384 that m = 0 "would be a grossly
  inadequate fit for any psi". Both hold as claims about fit QUALITY (at
  psi = 2, m = 0 misfits by 56.4 % against 8.0 % for the best m). But the
  unconstrained least-squares optimum does pass through m = 0, at exactly one
  value, psi = 16.804606 - well outside the printed window 0 <= psi <= 2 - and
  even there the misfit is 42.1 %, because past psi = 2 no order-of-reaction
  model fits at all. The page states this rather than letting the stronger
  reading stand.
