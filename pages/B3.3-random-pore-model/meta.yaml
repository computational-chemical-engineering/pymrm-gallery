  - "fifteen sympy identities close the derivation chain from eqs. (17)-(30) to (31)-(37), (39), (40) and Petersen's (3)-(7), (34), (35)-(36); labelled structural"
  - "the printed structural claims as numbers: best-fit m from the paper's integral I is 1.0000000 at psi = 0 and 0.4905224 at psi = 2 (printed 0.49 <= m <= 1) and 0.6638850 at psi = 1 (printed 'very close to two-thirds'); X_M tends to 1 - exp(-1/2) = 0.39347, so the printed X_M < 0.393 is a truncation, exceeded for psi above 1293; tau_1/2 at sigma = 100 within 2.92 % of its plateau and spreading 7.16 % across 0 <= psi <= 100 at sigma = 0.25 (57.7 % at sigma = 1)"
  - "Bhatia's eq. (40) equals the published B3.1's Yagi-Kunii eq. (6) at omega = 0 to round-off, and B3.1's committed eq6_to_reaction_limit (loaded, not retyped) is reproduced on B3.1's own grid to 2.9e-7 relative; the identity's blindness (all three omega coefficients, the value of gamma) is stated, and the two axes it can see each have a break row"
  - "the printed 'good agreement up to about 75 % conversion' of Figure 7: under the convention p. 384 prints for curve B (eps_o and L_o fixed), the curves differ by at most 0.0218 up to X = 0.75 and first part by 0.02 at X = 0.7423; the other two pairings of the over-determined triple part at 0.7599 and 0.7687. Crossings, extrema and the parting conversion are roots (find_roots on a log scan, the extrema as roots of the analytic derivative), the root count checked on 100, 400 and 1600 scan points"
  - "curve C's printed (S_o, L_o) is infeasible for Petersen's eq. (3): at that length no surface exceeds 2720 cm2/cm3 and curve C asks for 4.596 times that; the curve-D length the paper never prints is reconstructed, 24.672 times curves A and B's"
  - "the rate law eq. (37) marched by Crank-Nicolson (a pymrm newton solve per step for all psi, NumJac((K, 1))) reproduces eq. (32) to 9.8e-8 at 800 steps, observed order 2.00 from successive differences (pymrm.checks.observed_orders), the finest difference far above round-off; implicit Euler is 3198 times worse"
