  - "the reference table random-pore-reference.csv recomputed row by row, to 4.6e-12 relative (it is printed to 12 significant figures)"
  - "a break table of one injected defect per row, through an argument of model.py or a printed parameter (psi without (1 - eps_o), psi tau/2 for psi tau/4, the wrong root of eq. (7), eq. (4) misread, I without its (1 - X) factor, I truncated at X = 0.5, a 200-point sweep for a root, 25 quadrature nodes, implicit Euler, misread printed constants, a forgotten unit conversion, two misreadings of B3.1's eq. (6)); every claim except the symbolic identity count is failed by at least one row, and three candidate rows that cannot exist are printed with their measured reason"

adds: >
  Nothing to the model, and the page says so: the random pore model is two
  closed forms and most of the notebook would run without pymrm. What pymrm does
  is narrow and real. Blocks of independent scalar inversions (eq. 32 for tau
  over a block of psi and sigma, eq. 35 for the optimal initial porosity, one
  implicit step of eq. 37 for all psi) are each one newton solve with
  NumJac((K, 1)). The direct residual of eq. (32) from the start tau = sigma/2
  stops newton on an exactly singular Jacobian at 13 of 20 states, because the
  exponential vanishes against 1; the log form is solved instead. The rate law is
  marched so eqs. (37) and (32) check each other, with the order from
  pymrm.checks.observed_orders, and pymrm.checks.find_roots locates every root
  and extremum on the page from a scan, so the two crossings of Figure 7's
  curves, the two roots of eq. (35) and the single minimiser of I are counted
  rather than assumed from a hand-chosen bracket. The one output useful beyond
  reproduction is the normalised misfit of the paper's integral I, which says
  how badly the best grain shape factor fits a pore structure: 8.0 % at psi = 2,
  19.9 % at psi = 5, 32.3 % at psi = 10, because no order-of-reaction model can
  produce a rate maximum.

agreement: >
  Nothing is experimental and nothing is fitted to data; every number is
  printed-claim against computation, an identity, or solver against closed
  form. Printed claims: best-fit m 1.0000000 at psi = 0, 0.4905224 at psi = 2
  (printed 0.49 <= m <= 1), 0.6638850 at psi = 1 (0.417 % below two-thirds);
  psi = 4.965 for the Fig. 4 set (printed 5, 0.69 %), which satisfies eqs. (3)
  and (4) to 0.74 % in porosity and 0.21 % in surface; the 75 % agreement claim
  at X = 0.7423 with at most 0.0218 up to X = 0.75 (0.7599 and 0.7687 under the
  other two pairings); tau_1/2 within 2.92 % of its plateau at sigma = 100 and
  spreading 7.16 % at sigma = 0.25. Not borne out: X_M < 0.393 (the supremum is
  0.39347). Printed defects: "This match at m = 1" [sic] where m = 1 misfits
  5.34 times worse than the optimum at psi = 1; the worked example's eps_o = 0.1
  against eq. (35)'s root 0.0852877 (surface cost 2.8e-5 of the maximum); Park
  and Levenspiel 1976 in the text, 1975 in the reference list.

caveats: >
  No experimental content, by a scope decision stated up front: Figure 8 (the
  CS and VC char data of Hashimoto et al. 1979, not on disk) is not digitised,
  and no point, curve or axis coordinate is taken from any figure. This page
  must not be cited as evidence that the random pore model describes any real
  solid. The three char numbers (S_o = 520 m2/cm3, psi = 6.9 and 13.7) are
  transcribed from the prose of p. 385, and everything derived from them is a
  prediction of the model at those parameters. The effectiveness-factor sentence
  that justifies kinetic control cannot be checked: the paper prints no particle
  size, diffusivity or rate constant, so the page states only what it demands of
  the modulus. Kinetic control throughout; Part II (non-isothermal operation and
  diffusion control) is not on disk and nothing here depends on it. Petersen
  (1957), Szekely, Evans and Sohn (1976) and Avrami (1940) are read only as this
  paper reprints them. The unconstrained least-squares m passes through 0 at
  psi = 16.80, outside the printed window; the paper never evaluates m* there,
  so that statement is the page's.
