ons - -21.66 % at X = 0.75 against +4.54 % at X = 0.25 on the Fig. 4 / p. 384 Petersen set, and -21.00 % against +4.70 % on curves A and B's own set, both printed so neither is read as the other - and the structural reason is computed: the two models use DIFFERENT overlap laws, Avrami's 1-exp(-V_E) against Petersen's 3u^2-2u^3, which differ already at order V_E^(3/2) (the leading term 2(V_E/3)^(3/2) - V_E^2/2 accounts for the gap to 5e-04 relative at V_E = 0.01), cross once at u = 0.6508058 and reach a maximum porosity gap of 0.030118. No parameter choice makes the two models identical, which is why the abstract says 'approach' and not 'coincide'"
