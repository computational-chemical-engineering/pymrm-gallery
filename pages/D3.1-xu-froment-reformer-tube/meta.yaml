title: "Steam methane reformer tube"
section: D
status: planned
tier: T1
priority: P1
structures: [S2, S3, S8]
phases: [gas-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

reference:
  authors: ["Xu, J.", "Froment, G. F."]
  year: 1989
  container: "AIChE Journal 35(1) 97-103"
  doi: 10.1002/aic.690350110

pymrm_min_version: "3.4.0"
runtime_seconds: 280
datasets:
  - xu-froment-1989-ii-printed-numbers.csv
  - xu-froment-1989-ii-statements.csv
  - xu-froment-1989-ii-fig3.csv
  - xu-froment-1989-ii-fig5.csv
