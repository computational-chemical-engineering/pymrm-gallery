adds: >
  Nothing computational - no operator is assembled and no solve is run, which is
  the same call A1.1 and A1.6 make for a closure relation, and the page says so
  where a reader would look for a solver. The one pymrm call is
  pymrm.checks.find_roots: every crossing, threshold and extremum on the page is
  a root of a scalar function on its physical range, and each call raises unless
  it finds exactly the number of roots the page claims.

  What the page adds against reading the report is four things. It puts the two
  drag families on one axis: written as drag coefficients they can be divided,
  and the quotient behaves far worse in the middle than at either end - at
  eps_g = 0.44 the two agree to 19 <!-- claim: limit_gap_viscous_pct_eps044 --> % in the viscous limit and 4 <!-- claim: limit_gap_inertial_pct_eps044 --> % in the
  inertial one and disagree by a factor 1.73 <!-- claim: disagreement_factor_eps044 --> at Re_m = 4.1 <!-- claim: dip_Re_m_eps044 -->, which is a bubbling bed.
  (Qualification stated beside that headline: on Ergun's own abscissa the 0.44
  dip sits at Re/(1-eps) = 7.33 <!-- claim: dip_abscissa_ergun_eps044 --> and his 244 <!-- claim: ergun_markers_rows --> recovered markers start at 7.45 <!-- claim: ergun_markers_abscissa_min -->, so the worst point is
  1.6 <!-- claim: dip_below_markers_pct_eps044 --> % below his data; at eps_g = 0.50 the dip is at 9.49 <!-- claim: dip_abscissa_ergun_eps050 -->, inside it. No validity range for
  eq. (12) is available on disk either.) It identifies V_rm as a slip-velocity
  ratio and proves it from the momentum equations, a factor of eps_g the report
  never states and which is worth a whole unit on every index in the comparison
  that follows - and it shows that the report's own prose implies the OTHER
  reading, prints both, and states that the sign of the result depends on which
  is right. It costs the substitution the report makes - eq. (12) exists only
  because Richardson and Zaki's correlation is implicit, and nobody says what
  that convenience buys. And it quantifies the sentence everyone paraphrases:
  at Reynolds number one the Ergun form gives 7.9 <!-- claim: ergun_isolated_Re1_pct --> % of the drag on an isolated
  sphere and a hundredth of that Reynolds number it gives 0.10 <!-- claim: ergun_isolated_Re0p01_pct --> %, which is why a
  blend rule exists at all.

  One incidental correction to an expectation. Eq. (14) is a two-branch
  definition, but the branches meet to +0.049 <!-- claim: B_branch_jump_pct_at_switch --> % in B and the largest jump this
  produces in V_rm anywhere in Reynolds number is 0.049 <!-- claim: Vrm_branch_jump_max_pct --> %. It is a change of
  functional form, not a step - the discontinuous closure the catalogue names is
  a different one, switches at a different voidage, and is not on disk.


agreement: >
  Measured, against two datasets neither closure was fitted to. Richardson and
  Zaki's eighteen indices: +3.2 <!-- claim: check3_index_bias_pct_eps045 --> % bias at eps_g = 0.45 rising to +29.2 <!-- claim: check3_index_bias_pct_eps095 --> % at 0.95, on a
  15 <!-- claim: check3_row_spread_pts_eps045 -->-point row-to-row spread at 0.45, under the reading eq. (11) implements;
  under the alternative reading the same numbers are -26.3 <!-- claim: check3_alt_reading_bias_pct_eps045 --> % and -0.3 <!-- claim: check3_alt_reading_bias_pct_eps095 --> %. Geldart's eight
  spherical cuts at the derived voidage: every closure overpredicts, by +42.1 <!-- claim: check4_ergun_bias_pct --> %
  (Ergun), +101.2 <!-- claim: check4_syamlal_obrien_bias_pct --> % (Syamlal-O'Brien) and +111.1 <!-- claim: check4_richardson_zaki_bias_pct --> % (Richardson-Zaki).

  The page therefore validates none of the three, and attributes the absolute
  bias to a voidage nobody measured rather than to the closures: at a textbook
  voidage the same three are +4.8 <!-- claim: check4_ergun_bias_pct_at_eps042 --> % for Ergun and larger for the others. What the
  data do support is narrower: Ergun has the smallest absolute bias at 4 <!-- claim: check4_ergun_least_abs_bias_voidages --> of five
  voidages tried, needs the smallest change of voidage to be unbiased (0.4147 <!-- claim: check4_eps_erasing_ergun_bias -->
  against 0.3708 <!-- claim: check4_eps_erasing_richardson_zaki_bias --> and 0.3538 <!-- claim: check4_eps_erasing_syamlal_obrien_bias -->), and the order of the other two is not stable.

  Neither of the two closure-to-closure ratios is evidence: v_t cancels
  identically out of Syamlal-O'Brien/Richardson-Zaki, so 0.74 <!-- claim: ratio_SO_over_RZ_min_diakon --> to 1.12 <!-- claim: ratio_SO_over_RZ_max_diakon --> is Check 3
  restated in different symbols and would read the same if Geldart had never run
  the experiment. Geldart's U_0 enters only the per-cent columns.


caveats: >
  NOTHING IS CLAIMED ABOUT GIDASPOW'S DRAG CLOSURE OR ABOUT WEN-YU DRAG. Neither
  drag law is in the document on disk. The eps_g = 0.8 discontinuity a comparison
  of blended closures would be for is neither computed nor asserted.

  Both identity checks are labelled as identities and each is published with the
  break table that measures what it cannot see. Check 1 is blind to all three
  voidage exponents; Check 2 is blind to every constant of eqs. (12) and (16).
  Neither is offered as evidence that the closure describes anything.

  The Check-3 break table is swept over voidage, because eq. (14) is branched and
  the evaluation voidage decides which of its constants are live. What is still
  not settled by any data comparison is a small displacement of the switch, and
  that is bounded by the +0.049 <!-- claim: B_branch_jump_pct_at_switch --> % continuity of eq. (14) rather than assumed away.

  THE CENTRAL CHECK-3 RESULT IS CONDITIONAL ON A READING THE DOCUMENT DOES NOT
  SETTLE. Eq. (11) forces V_rm to be a slip-velocity ratio; the report's own
  sentence introducing V_rm implies Richardson and Zaki's superficial one. The
  two are one unit of index apart and the alternative reverses the sign of every
  number in Check 3. Both are printed and tracked.

  NEITHER CHECK-4 RATIO CONTAINS A MEASUREMENT. v_t cancels out of
  Syamlal-O'Brien/Richardson-Zaki to a relative gap below 1e-12 <!-- claim: check4_vt_cancels_out_of_SO_over_RZ -->. The Richardson-Zaki
  column is also not independent of Syamlal-O'Brien: both take their terminal
  velocity from the same eq. (16), and the Dalla Valle slope moves the
  Richardson-Zaki bias by 61 <!-- claim: check4_dalla_valle_slope_points_rz --> points while moving the Ergun bias by nothing.

  The index of Table VI is held constant outside its Reynolds range. 4 <!-- claim: check4_context_rows_clipped --> of the
  context rows fall outside it; 0 <!-- claim: check4_diakon_rows_clipped --> of the eight Diakon rows the result is taken on
  do.

  The headline dip at eps_g = 0.44 sits at Re/(1-eps) = 7.33 <!-- claim: dip_abscissa_ergun_eps044 -->, which is
  1.6 <!-- claim: dip_below_markers_pct_eps044 --> % BELOW the lowest of Ergun's own 244 <!-- claim: ergun_markers_rows --> recovered markers (7.45 <!-- claim: ergun_markers_abscissa_min -->). At
  eps_g = 0.50 the dip is at 9.49 <!-- claim: dip_abscissa_ergun_eps050 --> and inside them.

  The inertial half of every closure is essentially untested against
  measurement. Every Geldart row is a group A powder at a single-particle Re_t
  below 28 <!-- claim: check4_Re_t_max_diakon --> and a bed Reynolds number below 2 <!-- claim: check4_Re_mf_max_diakon -->. Table VI constrains eqs. (12)-(14) only - Check 3
  is exactly blind to the single-sphere drag curve, which is tested by Check 4
  and by nothing else here.

  Ergun is not treated as a reference standard, because A1.6 has shown it is not
  one on this dataset: at the voidage Geldart himself reports the same balance is
  +58 <!-- claim: check4_ergun_bias_pct_at_epsMB --> % biased, worse than the empirical u_mf correlation it was set up to
  judge. That number is recomputed here rather than quoted, as are A1.6's other
  numbers on these rows, including the one that argues against this page's own
  conclusion. Sphericity does not separate any of the comparisons: Ergun in d_sv
  is exactly phi_s-free and neither of the other two closures has a shape factor,
  so on these rows the only free assumption is the voidage.

  Richardson and Zaki's Table VI is tier 2 but one step from a raw measurement:
  each n_0 is a fitted slope, then extrapolated along a second fitted line to
  d/D = 0. The runs are liquid-solid while the report is a gas-solid code. And
  Garside and Al-Dibouni fitted their relation to overlapping literature, so the
  comparison measures the cost of one closed form standing in for another, not
  two independent witnesses agreeing.

  The non-Diakon Geldart rows carry no printed sphericity and Syamlal-O'Brien
  has no shape factor to give them, so whole-table numbers are printed as context
  and are not the page's result. The gas density used for that comparison is
  assumed - Geldart prints none - and the break table shows that a decade error in
  it is worth 7 <!-- claim: check4_rho_f_decade_points_so --> points of the Syamlal-O'Brien bias.

  No pymrm operator appears, and nothing on this page is digitised. The one
  digitised dataset it loads is A1.1's, used only to bound Ergun's own constants,
  and it inherits that page's stated recall limitation.
