scope: >
  The catalogue names three closures - Gidaspow, Syamlal-O'Brien and Wen-Yu. The
  document on disk (the MFIX Theory Guide) carries Syamlal-O'Brien complete and
  neither of the other two: the strings "Wen and Yu" and "Wen & Yu" do not occur
  in it, and it prints no Gidaspow DRAG closure and no blend rule - Gidaspow
  (1986) is cited exactly once in section 2.2.1, for the observation that a
  packed-bed correlation must be supplemented at low solids fraction. Do NOT
  restate that as "Gidaspow is cited only in passing": the name occurs 28 times
  in the extracted text across ten reference entries, and the report adopts a
  Ding & Gidaspow (1990) expression as its own eq. (88). Only the absence of a
  Gidaspow drag law is load-bearing, and only that is claimed. Nothing about
  either missing closure is written from memory. The page instead builds the pair
  the report's own paragraph on
  journal page 10 names - the packed-bed route (Ergun, via A1.1) and the
  terminal-velocity route (Syamlal-O'Brien, and Richardson-Zaki behind it) - and
  states in its opening paragraph, in its Reuse section and here exactly which
  two documents would complete the three-way comparison.

