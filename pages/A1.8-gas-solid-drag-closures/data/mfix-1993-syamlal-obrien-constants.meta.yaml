caveat: >
  TIER 6 as a dataset in its own right: these are the coefficients of a
  correlation, not measurements, and reproducing the correlation from them is
  reproduction, not validation. The page's measured comparisons come from two
  OTHER datasets - Richardson and Zaki's Table VI, shipped alongside this file,
  and Geldart's Table 1, borrowed from A1.7.

  What this file cannot support: any claim about Wen-Yu drag or about
  Gidaspow's blended closure. The strings "Wen and Yu" and "Wen & Yu" do not
  occur anywhere in this report, and Gidaspow is cited in section 2.2.1 only in
  passing, for the observation that a packed-bed correlation "must be
  supplemented with a drag correlation for low values of the solids volume
  fractions". Neither closure is printed here and neither may be written from
  memory.
