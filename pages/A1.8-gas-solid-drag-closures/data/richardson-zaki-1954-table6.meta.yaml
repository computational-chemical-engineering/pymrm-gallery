reprint:
  container: "Trans IChemE 75 (December 1997) S82-S100, Jubilee Supplement"
  doi: 10.1016/S0263-8762(97)80006-8
  note: >
    The 1954 original was not consulted. The Jubilee Supplement is a verbatim
    re-photograph of it: every page carries the 1954 typesetting, including the
    mid-dot decimal separator, under a 1997 running head. Table VI is on reprint
    page S94.

conditions: >
  The index n is defined by the paper's equation (29), V_c/V_i = eps^n, where
  V_c is the falling velocity of the suspension relative to a fixed horizontal
  plane and V_i is its value extrapolated to eps = 1. The paper's Summary and
  Conclusions states the equivalence the whole table rests on: "the falling
  velocity of a suspension relative to a fixed horizontal plane is equal to the
  upward velocity of liquid (based on the empty tube) required to maintain a
  suspension at the same concentration". So V_c is a SUPERFICIAL velocity in
  both processes, and V_i -> V_0, the single-particle terminal velocity, as
  d/D -> 0.

  n_0 is n extrapolated to d/D = 0, i.e. with the wall effect removed. It is
  read off Figure 18, which plots n against d/D with one line per Reynolds
  number; the Re values labelling those lines are exactly the Re column of this
  table. Re itself is defined in the table header as V_0 d rho / mu, i.e. it
  uses the SINGLE-PARTICLE terminal velocity, not the hindered one.

  The underlying measurements are the paper's own sedimentation and fluidisation
  runs together with those of Steinour (sedimentation) and Lewis, Gilliland and
  Bauer (fluidisation), which the paper says "have been joined". Two asymptotes
  bracket the table and are printed beside it: equation (33), n = 4.65 +
  19.5 d/D for Re < 0.2, and equation (34), n = 2.39 for Re greater than about
  500.

acquisition:
  method: table
  figure: "TABLE VI, reprint page S94"
  tool: "poppler pdftoppm at 300 dpi, read visually"
  procedure: >
    The embedded page image is a bilevel stencil at 300 dpi, so 300 dpi is this
    file's native resolution. Every value was read character by character off
    that render.

    The text layer is not trustworthy for digits here - it is the usual pre-1980
    mid-dot failure (docs/pdf-findings.md), rendering "4.17" as "4 ·17" and the
    log_n0 cell of that row as "0·1;2".

    THE TABLE CARRIES ITS OWN ROUND-TRIP CHECK AND IT IS WHY THAT CELL COULD BE
    READ AT ALL. Columns 2 and 4 are log10 of columns 1 and 3, so recomputing
    them tests the transcription of every row. The damaged cell resolves to 0.62
    because log10(4.17) = 0.6201 and no other two-decimal value is consistent.
    The check is run on the page.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-08-02
  estimated_error: >
    None beyond the printed precision, which is three significant figures on
    Re and n_0. Note the paper prints n_0 as "3.0" and "2.5" on two rows, i.e.
    two significant figures where the rest carry three.

