caveat: >
  TIER 2 - a table printed in the paper. But it is one step removed from a raw
  measurement and the page says so wherever it uses it: each n_0 is a SLOPE of
  log V_c against log eps, fitted by the authors to a run of measurements, and
  then EXTRAPOLATED along a second fitted line to d/D = 0. Comparing a closure
  with this column is a comparison against the authors' reduction of their own
  and two other laboratories' measurements. It is not reproduction of anyone's
  arithmetic - nothing in the MFIX closure was fitted to it, and Garside and
  Al-Dibouni's correlation is a different one, which is exactly why the MFIX
  report adopts theirs instead - but it is not a raw measurement either.

  Three further limits. (a) The runs are liquid-solid; the report the page is
  built from is a gas-solid code. Nothing in eq. (29) is phase-specific, but the
  data are not gas-fluidisation data. (b) The table gives no voidage range, so
  the window over which an implied index is computed is a choice made on the
  page and its sensitivity is printed. (c) n_0 has the wall effect removed,
  while a bed with finite d/D has a larger n by 19.5 d/D in the viscous regime;
  any comparison against a real column must add that back or state that it has
  not.
