validation:
  - "two of Table 1's eight cells in closed form from exact polynomial solutions of the cross-section problem, Nu_H1 = 48/11 (circle) and 28/9 (equilateral triangle), both reproducing the printed digits"
  - "the square-duct pair on two discretisations that share no code: pymrm finite volumes extrapolated over four grids and a Fourier-sine Galerkin solve; Nu_H1 = 3.607950 against the printed 3.608. The square duct at constant wall temperature comes out 2.977523 against a printed 2.976, outside the interval its printed digits allow, and is not attributed (Shah and London 1971 was not consulted)"
  - "the circular-duct Nu_T against A3.15's committed Graetz limit, a relative gap held below 1e-6"
  - "the Nusselt singularity from the two printed wall-flux functions, every landmark root-found: the flux zero, where eq. (19)'s numerator vanishes and Nu passes through zero, and the pole, the zero of T_w minus the mixing-cup mean, 8.7 % further downstream in both"
  - "on the paper's ten radial points the pole lies 2.2 % (van Leer, fine axial grid) to 2.4 % (the paper's axial step, first order) short of the 0.032 its sign statements imply, within 0.3 % of converged"
  - "the paper's printed check value Tbar(0.25) = 0.0224 settles that the 2-D results use eq. (15)'s X* and the mixing-cup mean, and lies inside the interval of two ten-point solves; it is 5.9 % above the converged 0.021147"
  - "the Grigull-Tratz constant-flux correlation reproduces the page's Graetz solve to 1.26 % with X* = 1000 x/(D Re Pr)"
  - "the deferred-correction Graetz solve against Newton with ConvFluxTVD on the same discrete equations: field and pole within 1e-9"
  - "light-off thresholds root-found on a common channel length, with light-off positions root-found inside the crossing axial step; the 2-D light-off position over four axial steps (observed order 0.96, first order expected)"
  - "the 1-D light-off position by an explicit march and by a Gauss-Legendre quadrature in C_w, within 0.93 axial steps; the same integral in C_G with adaptive quad is up to 0.97 % out"
  - "wall values from compute_boundary_values; for a Dirichlet wall the read value equals the boundary condition"
  - "a defect-injection table in which every claim that is not structural fails at least one row"

adds: >
  pymrm supplies the discretisation: constant gradient, divergence and upwind
  operators for the duct cross-sections and both tube models, van Leer face values
  with an outflow outlet, an array-valued wall flux, boundary values
  by compute_boundary_values, and ConvFluxTVD with a monotone-damped newton as an
  independent Graetz solver. The analysis is the page's own on top of scipy and
  sympy. Five of Table 1's eight cells are derived, two in closed form, and one
  printed cell disagrees with two converged routes. The Nusselt pole is root-found
  8.7 % downstream of the flux zero the text attributes it to; the paper's next
  paragraph gives the correct mechanism. The paper's light-off windows are sampled
  and quoted at two channel lengths; root-found at each figure's length the models
  reproduce both, and the -10.83 degC between them decomposes into -13.42 degC of
  length and +2.59 degC of model. On a common length the 2-D model needs a higher
  inlet temperature than either 1-D model (+4.13 degC over the constant-Nu 1-D at
  L* = 0.25), half of it channel shape. As a ratio of the equivalent inlet shift
  to the "less than 2 degC" claim: the Grigull-Tratz 1-D model of Fig. 12 gives
  1.43 at a 316 degC inlet and 1.09 to 3.41 over 310 to 340 degC; the constant-Nu
  model of the parametric figures gives 2.86 at 316 degC and 2.26 to 7.74.

agreement: >
  Against what the paper prints: four of the five reproducible Table 1 cells agree
  with every printed digit, the fifth (square Nu_T) does not; the stated flux zero
  near X* = 0.029 is 0.028680 and 0.028789; the stated rate maximum at C_w = 0.003
  is 0.00261; the stated Tbar = 0.0224 lies between the two ten-point solves; and
  both light-off statements hold at the length of the figure each is made about.
  Against limits the paper did not have: the pole 8.7 % downstream of the flux
  zero, the 1-D/2-D light-off difference on a common length, and the equivalent
  inlet shift of +2.85 degC (Grigull-Tratz 1-D) and +5.72 degC (constant-Nu 1-D)
  at a 316 degC inlet, against the paper's 2 degC.

caveats: >
  Data tier 6 - these are the paper's own printed values, not measurements, so
  nothing here is validation against experiment and the page never says otherwise.
  FIGURES ARE SCOPED OUT. Digitisation needs a maintainer review that is not
  available, so Figs. 1-13 are used only for PRINTED CHARACTERS inside their
  frames. The notebook ENUMERATES AND COUNTS every such row from the CSV itself
  rather than restating a number in prose, because that list is what the scope
  promise is audited against: 15 of the 33 rows name a figure, 11 of them were read
  inside a figure's frame (annotation boxes 6, abscissa tick labels 3, one curve
  label, one case label) and 9 of those 11 appear nowhere else in the paper. The
  three abscissa rows are Fig. 2 (0.20), Figs. 3-5 (0.25) and Fig. 11 (0.50): the
  first and third because the paper's two light-off windows are quoted for those
  two figures and they are not the same length, the second because it is the other
  length the paper fixes for its one-dimensional model, and the two together set
  the swept range. No curve is traced, no profile shape is checked, no light-off POSITION is
  compared against the paper's own, and none of the conversion curves of Figs. 4-6
  and 12 is checked. Every comparison is against a statement the paper makes in
  words.
  TWO DIMENSIONAL GROUPS ARE RECONSTRUCTED, not read: the paper prints neither the
  molar heat capacity nor the diffusivity, so dT_AD and beta come from ordinary
  gas properties. The Validation section measures what that costs: +/-10 % in
  dT_AD and a factor 1.5 in beta move the absolute upper threshold over 22.3 degC
  and the constant-Nu equivalent shift over 4.55 degC, so NO ABSOLUTE THRESHOLD ON THIS PAGE SHOULD BE READ AS THE
  PAPER'S NUMBER. The 303.5 degC that lands within a degree of the printed 304 is
  not evidence, and the notebook says so in the cell that prints it.
  THE 2-D INLET THRESHOLD DOES NOT EXIST as a continuum quantity (the local
  Sherwood number is infinite at X* = 0), so the number the page reports for it is
  named for the axial step it was computed at and is shown diverging under
  refinement. Every 2-D result is the value at the axial step 1e-4. It is not comparable with the paper's 1-D bracket and the page does
  not compare them.
  The channel length is not printed anywhere; the lower threshold needs one, so it
  is swept over 0.20-0.30 in Graetz units, the two ends the paper does fix for its
  1-D model (Fig. 2's abscissa at 0.20 and Figs. 3-5's at 0.25) with 0.30 as a
  margin past both, and every conclusion is checked to be independent of the
  choice.
  Three of Table 1's eight cells are not reproduced. The equilateral triangle at
  constant wall temperature needs a u-weighted eigenproblem on a non-tensor
  domain, which this page does not build. Both sinusoidal cells are
  UNDER-DETERMINED BY THE PAPER - the geometry column prints a glyph and no aspect
  ratio or wall profile appears anywhere - so there is no problem to solve.
  The transient model (eqs. 1-4, Fig. 7) is not built: its only quantitative
  statement needs the solid heat capacity and the monolith dimensions, none of
  which is printed. I1.2 (Oh & Cavendish 1982) does transient monolith light-off
  against a printed table.
  Printed defects are reported and none repaired. Equation (14) is printed with an
  "=" where a multiplication is required and is dimensionally impossible as
  printed; the form used here is derived from eq. (13) under the paper's own two
  stated approximations and is labelled an inference. Equations (17) and (18)
  cannot both carry the sign they are printed with, nor can eq. (10) and eq. (12)
  agree on the sign of dH. Figure 8 labels two different curves with the same Q_w
  formula. The delta_H annotation reads "mJ" where the figure's own temperature
  scale requires MJ. The reference list prints "Shar, R. K., and A. L. London"
  where Table 1's footnote says "Shah and London".
  Neither Shah and London (1971), nor Voltz et al. (1973), nor Grigull and Tratz
  (1965) was consulted; all three are used exactly as Heck et al. reprint them,
  which is the reprint route in AGENTS.md.
