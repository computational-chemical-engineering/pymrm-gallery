slug: grace-regime-map
title: "Grace's regime map: Geldart's boundaries for any gas, and where his two B/D criteria part"
section: E
status: planned
tier: T1
priority: P2
structures: []
phases: [gas-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

reference:
  - authors: ["Grace, J. R."]
    year: 1986
    title: "Contacting modes and behaviour classification of gas-solid and other two-phase suspensions"
    container: "Canadian Journal of Chemical Engineering 64(3) 353-363"
    doi: 10.1002/cjce.5450640301

