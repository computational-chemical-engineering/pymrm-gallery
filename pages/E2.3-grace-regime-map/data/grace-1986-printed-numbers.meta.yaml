dataset_id: grace-1986-printed-numbers
title: "The constants, derived table cells and stated boundary numbers of Grace (1986), as printed"
status: complete

source:
  authors: ["Grace, J. R."]
  year: 1986
  title: "Contacting modes and behaviour classification of gas-solid and other two-phase suspensions"
  container: "Canadian Journal of Chemical Engineering 64, 353-363"
  doi: "10.1002/cjce.5450640301"
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: >
    Journal pages 355 to 361 (PDF pages 3 to 9; journal page = PDF page + 352), read
    from crops of the 300 ppi scan and from 150 ppi renders. The text layer of the
    scan substitutes digits and is not used for any value.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision; every value is transcribed as printed and kept as a string"

conditions: >
  Signs are kept as printed where the paper prints a signed number (the Table 2
  polynomial coefficients of rows 2 to 4, the eq 13 and eq 16 exponents); the row 1
  coefficients of Table 2 are printed as magnitudes with the operator in the formula,
  and the `meaning` column says which. Powers of ten printed as "10^-2", "10^4" or
  "x 10^-4" are written in e-notation with the printed mantissa. "223,000" and
  "20,000" keep their thousands separators; the page reads the first as three
  significant figures. The Table 2 caption prints "Teminal" (a typo). The Fig 3
  label "for drho = 10^3 - 2 x 10^3" omits "/rho"; the text and eq 17 say drho/rho.

columns:
  - {name: name, unit: "-", description: "key used by the page"}
  - {name: printed, unit: "see meaning", description: "the number as printed"}
  - {name: where, unit: "-", description: "journal page, PDF page and equation, table or text place"}
  - {name: meaning, unit: "-", description: "what the number is"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced.
