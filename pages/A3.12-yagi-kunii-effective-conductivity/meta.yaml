adds: >
  Two results, both from putting the correlation back inside the apparatus it came
  out of, the cylindrical annulus solved with pymrm operators (nu=1, a
  temperature-dependent conductivity by pymrm.newton, wall values from
  compute_boundary_values). First, the paper's own reduction formula is biased
  against its own model: the conductivity Eq. (19) returns is the average of ke0
  taken uniformly in TEMPERATURE, while the abscissa is the VOLUME-weighted mean
  temperature, which sits 0.703 <!-- claim: tm_fraction_of_dT_constant_k --> of the
  drop below the hot face. At the drops Figure 12 shows, a bed obeying Eq. (15)
  exactly plots +9.8 <!-- claim: reduction_bias_min_pct --> % to
  +11.5 <!-- claim: reduction_bias_max_pct --> % above the Eq. (15) curve. Second,
  the authors' remark that their radial profiles "seem nearly straight" is evidence
  AGAINST a constant conductivity, which departs from a straight line by
  0.137 <!-- claim: nonstraightness_constant_k --> of the drop, but only PARTIAL
  evidence for Eq. (15), straighter by a factor of only
  1.66 <!-- claim: straightness_factor_at_fig12_min --> at the worst Figure 12 drop.
  The rest of the page is reproduction: Eq. (15) is algebra, nothing about the
  correlation is improved, no constant is re-fitted, and no new data are brought to
  it.

agreement: >
  The three printed identities close to round-off. Eq. (19)'s constant is recovered
  from the closed form and from a pymrm annulus solve, the latter
  +0.16 <!-- claim: V4_pymrm_constant_vs_printed_pct --> % from the printed value,
  the paper's 2.3 rounding of ln 10. Eq. (15) reproduces the ends of the paper's own
  printed theoretical curves to a mean of
  2.4 <!-- claim: fig13to17_curve_ends_mean_abs_pct --> %, all on the high side.
  Against measurement, Table 3 gives a mean |deviation| of
  15.3 <!-- claim: paper_calcd_vs_exp_mean_abs_pct --> %, with a mean deviation of
  -3.5 <!-- claim: paper_calcd_vs_exp_bias_pct --> % that is well inside its standard
  error of 5.5 <!-- claim: paper_calcd_vs_exp_bias_se_pct --> %.

caveats: >
  Data tier 2: all four printed tables are facts in numeric form, and Table 3's Exp.
  column is third-party measurement, but the validation against that measurement is
  WEAK, for a structural reason the page measures rather than hides. Eq. (15) needs
  phi, which the paper supplies only as Figures 9 and 10, not digitised here. With
  phi free per row, the solid-to-solid radiation coefficient h_rs is algebraically
  degenerate with it: deleting Eq. (7) and re-solving for phi reproduces every
  printed calculated value to round-off, while deleting gamma(kg/ks) needs phi up to
  0.42 <!-- claim: delete_gamma_max_phi_needed -->. What would break the degeneracy is
  a temperature sweep on one packing, which is what the measured points of Figures 13
  to 17 are; they are not read here. The emissivity p is never printed; p = 1 is
  assumed, and the curve-end comparison excludes only a large deficit. Table 3's
  calculated column implies phi spanning a factor of
  7.56 <!-- claim: phi_implied_spread_at_eps040 --> at eps = 0.40. Ranz (1952), the
  source of Eq. (1), is cited but not consulted.
