dataset_id: yagi-kunii-1957-figures13to17-curve-ends
title: "Figures 13-17 - the ends of the authors' own THEORETICAL curves"
status: complete

source:
  authors:
    - "Yagi, Sakae"
    - "Kunii, Daizo"
  year: 1957
  container: "AIChE Journal 3(3) 373-381"
  doi: 10.1002/aic.690030317
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

acquisition:
  method: figure-curve-ends
  figure: "Figures 13, 14, 15, 16 and 17, journal pages 378-380"
  tool: >
    poppler pdftoppm at the scan's NATIVE 300 ppi. Axis frames, tick ladders and curve
    ink located with numpy on the bilevel render.
  procedure: >
    Every one of the five figures carries a minor tick ladder of one ordinate unit and
    100 degC per tick, so both axes calibrate exactly without any curve fitting: for
    example Figure 13 has 51 ordinate ticks from y = 195.5 to 1986.5 px spanning 10 to
    60, and 11 abscissa ticks from x = 1330.5 to 2045.0 px spanning 0 to 1000 degC.
    A single pixel column was then sampled about 26 px inside each frame - far enough in
    to clear the inward-pointing ticks - and each connected run of ink taller than the
    tick marks was taken as a curve, its ordinate the centroid of the run. The abscissa
    recorded is the temperature of that column, not a round number, so the comparison
    needs no interpolation.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-08-05
  estimated_error: >
    About +-0.15 in ke0/kg (roughly half the drawn line width) and +-5 degC in t.
    That is under 1 % where the curves run high and about 5 % on the two Figure 16
    values near 3.

provenance_of_the_measurements: >
  NOT measurements. These are the smooth lines the figures themselves label
  "THEORETICAL" (Figures 13, 14, 15) and "CALCD." (Figure 17), i.e. Yagi & Kunii's own
  evaluation of Equation (15) from the Table 4 parameters. Comparing this page's
  Eq. (15) against them is REPRODUCTION of the authors' computed output, never
  validation against experiment. The measured points scattered around those curves are
  the paper's only measurement of its own; they are not recorded here and the page
  continues to scope them out.

validation:
  internal_consistency: >
    Figure 13 prints two curves for one bed, labelled beta = 1.0 and beta = 0.9, and
    Table 4 prints "1.0 and 0.9" in the beta cell of that same row. Both curve ends are
    recorded and both are reproduced, which is a stronger check than either alone.
  what_it_tests: >
    Whether the transcription of Eq. (15), the Table 4 parameter set and the assumed
    emissivity p = 1 together reproduce what the authors themselves computed. The paper
    never prints p, so this is the only quantitative evidence on the page about it.

known_issues:
  - "Figures 13, 14 and 16 each carry one curve that leaves the top of the ordinate
     before 1000 degC. Those curves are recorded at their low-temperature end only."
  - "In Figure 15 the 5.0, 3.6 and 2.6 mm cement-clinker curves are drawn on top of one
     another below about 200 degC, so only their 963 degC ends are separable. The
     0.18 mm curve is separable at both ends and both are recorded."
  - "The two Figure 16 low-temperature values are the only ones this page cannot
     reproduce from Table 4's ks column; see the page, which shows they are reproduced
     from Table 4's ks/kg column instead and argues that is what the authors used."

not_transcribed:
  - "Every measured point in Figures 13 to 17. They are the authors' own experimental
     data, they exist only as plotted markers, and extracting them is a digitisation
     needing a maintainer review that is not available."

columns:
  - {name: figure, unit: "-", description: "journal figure number"}
  - {name: solid, unit: "-", description: "packing, matching the solid column of table4.csv"}
  - {name: Dp_mm, unit: mm, description: "mean packing diameter, matching table4.csv"}
  - {name: beta_curve, unit: "-", description: "beta where the FIGURE labels the curve with one, i.e. Figure 13's two curves only. Blank means 'use the beta Table 4 prints for that packing' - which for the Raschig rings is 1/sqrt(3) and 1/3 + (2/3)/sqrt(3), not 1"}
  - {name: t_C, unit: degC, description: "mean bed temperature of the sampled pixel column"}
  - {name: ke0_over_kg_read, unit: "-", description: "ordinate of the theoretical curve at that column"}
