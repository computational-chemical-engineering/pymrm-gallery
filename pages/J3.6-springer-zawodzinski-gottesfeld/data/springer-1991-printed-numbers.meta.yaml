dataset_id: springer-1991-printed-numbers
title: "Table I, the membrane correlation constants and the numbers stated in the text of Springer, Zawodzinski and Gottesfeld (1991)"
status: complete

source:
  authors: ["Springer, T. E.", "Zawodzinski, T. A.", "Gottesfeld, S."]
  year: 1991
  title: "Polymer electrolyte fuel cell model"
  container: "Journal of the Electrochemical Society 138, 2334-2342"
  doi: "10.1149/1.2085971"
  access: >
    Scanned journal PDF held outside the repository, lawful access. No PDF and no page
    image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: table
  figure: "abstract (p. 2334), Eqs. 15 to 18 and the text beside them (p. 2336), Eqs. 21, 22, 25 and the text beside them (p. 2337), Table I and the text on the oxygen drop (p. 2338), the text on Fig. 6 (p. 2339), the text on n_drag, Fig. 8 and D (p. 2340), the list of symbols (p. 2341)"
  resolution: "PDF pages 2 to 9 (journal page = PDF page + 2332; PDF page 1 is a publisher cover sheet) rendered at 300 ppi; every entry read from the page image"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    None beyond the printed precision; entries are kept as printed strings (read with
    dtype=str). The scan's text layer garbles formulas and numbers and is not used for any
    entry. The paper does not print the dry membrane density, the equivalent weight, the
    gas constant, the D_lambda table for lambda <= 4 or the electrode porosity.

conditions: >
  Table I is the base case: J = 0.5 A/cm2, 80 C, 3 atm both sides, humidifiers at 80 C.
  The correlation constants are in the paper's units (cm, mol, s, atm, degC; D in 1e-6
  cm2/s). Text entries are the paper's own rounded statements, each with its page.

columns:
  - {name: item, unit: "-", description: "short name"}
  - {name: printed, unit: "-", description: "the entry as printed, a string (a printed 'a . 10^-n' is written aen)"}
  - {name: page, unit: "-", description: "journal page"}
  - {name: meaning, unit: "-", description: "what the entry is, with its unit"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure or page image is reproduced.
