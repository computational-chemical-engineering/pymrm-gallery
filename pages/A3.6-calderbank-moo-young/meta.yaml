validation:
  - "THE PAPER'S OWN TWO THEORETICAL DERIVATIONS OF EQ. (1), REPRODUCED. Froessling's `0.552` with Allen's printed `1/4` gives 0.276000 <!-- claim: c28_value --> against the printed `0.28` (-1.43 % <!-- claim: c28_rel_dev -->); inverted, the paper's own `0.28` and `1/4` imply a Froessling coefficient of 0.5600 <!-- claim: froessling_implied_by_paper -->. Friedlander's `0.89` with Stokes' law gives 0.339599 <!-- claim: c34_value --> against the printed `0.34` (-0.12 % <!-- claim: c34_rel_dev -->). The two bracket the fitted `0.31`. Allen's drag law `C_D = 10 Re^(-1/2)` gives 0.2610 <!-- claim: allen_quarter_from_drag_law --> for his printed `1/4`."
  - "THE PACKED-BED CHAIN, AND THE STEP THAT DOES NOT CLOSE. Eq. (5) applied to Chu's correlation reproduces the printed P/v as an exact identity (below 1e-12 <!-- claim: chu_identity_resid --> at exact rational points), and eq. (4) with it reproduces eq. (6)'s prefactor to -0.28 % <!-- claim: eq6_prefactor_rel_dev -->. The voidage group does not: the chain forces Sigma^-1, eq. (6) prints ((1-Sigma)/Sigma)^(1/3), and neither reading reaches eq. (7): -48.0 % <!-- claim: eq7_from_printed_eq6_rel_dev --> as printed and -5.7 % <!-- claim: eq7_from_sigma_inverse_rel_dev --> with Sigma^-1. Against Fallat's measured j-factor from Re = 100 to 10,000, eq. (7) is within 4.6 % <!-- claim: fallat_dev_printed_eq7 -->, the Sigma^-1 reading within 6.4 % <!-- claim: fallat_dev_sigma_inverse -->."
  - "THE PIPE CHAIN IS THE CONTROL: `0.13 x 0.0396^(1/4)` gives 0.0579919 <!-- claim: eq9_prefactor_derived --> against the printed `0.058`, which localises the packed-bed problem to the voidage."
  - "A STATED RESULT THAT DOES NOT REPRODUCE: eq. (9) and Chilton-Colburn cross at Re = 4480 <!-- claim: pipe_cross_Re --> (a root over Re = 1 to 1e9), not 10,000; at 10,000 they differ by -8.5 % <!-- claim: pipe_dev_at_claimed_Re -->, and the largest deviation over 2000-20,000 is 15.2 % <!-- claim: pipe_maxdev_over_range --> against the stated `12 %`. The deviation changes sign inside the range, so the '+/-' is right about the shape."
  - "A PRINTED TABLE EXPONENT PROVED WRONG, WITH A CONTROL: the small-bubble row's D_L x 10^-4 puts eq. (1) 21.2 <!-- claim: eq1_window_hi_printed_exponent --> times above the row's own k_L ceiling, x 10^-5 still 4.56 <!-- claim: eq1_window_hi_exponent_5 --> times, x 10^-6 at 0.983 <!-- claim: eq1_window_hi_over_printed --> of it. The control, eq. (2) on the large-bubble row as printed, reaches 0.896 <!-- claim: eq2_window_hi_over_printed --> of its printed ceiling with no adjustment."
  - "THE STAGNANT FLOOR, WITH pymrm: the sphere in a shell of 1e4 radii, one sparse solve, gives the floor Sh (1 - R/R_inf) to -3.34e-5 <!-- claim: sh_stagnant_rel_dev --> at 800 cells, second order on nested geometric cells, Richardson limit below 1e-6 <!-- claim: sh_richardson_rel_dev --> from the printed `2.0`."
  - "THE REGIME SPLIT AS A LINEAR MARCH, AGAINST TWO CLOSED FORMS: u(y) dc/dx = D d2c/dy2, backward Euler on one factorised operator, surface flux read with compute_boundary_values. At 800 cells and 800 steps the rigid limit is -1.43e-4 <!-- claim: leveque_rel_err_raw --> from Leveque and the mobile limit -1.60e-4 <!-- claim: higbie_rel_err_raw --> from Higbie; the step ladder is first order, the cell ladder second order, and the two-axis limit is below 1e-7 <!-- claim: leveque_rel_err_xy_extrap --> from each closed form. The exponents come back as 2/3 and 1/2 to round-off, fixed by dimensional analysis, so they test the implementation."
  - "A DEFECT-INJECTION TABLE: the paper's algebra is one function of the printed-number dictionary, rerun under every mis-read constant; the solver claims have rows through call arguments (geometry code, outer and interface conditions, velocity profile, flux read, far field, ladder). Every claim fails at least one row."

adds: >
  The transition as a number. The paper describes it three times (Fig. 3's
  intermediate bubbles, the decline of large-bubble coefficients in deep pools,
  surface-active agents) and models it nowhere. Written as u(y) = u_s + gdot*y,
  one group Lambda = u_s/(gdot*delta_Leveque) controls it, the exponent falls at
  every step of the scan from 2/3 to 1/2, halfway at Lambda = 0.2721 <!-- claim: lambda_half -->
  and within `10 %` of the mobile end by Lambda = 1.507 <!-- claim: lambda_within_10pct_mobile -->.
  pymrm supplies the operators of the two linear problems and the flux reads; the
  paper's algebra owes it nothing. The boundary layer does not predict `0.31` or
  `0.42`, which absorb bubble shape, slip velocity and swarm hindrance.

agreement: >
  Two printed theoretical predictions reproduced: -1.43 % <!-- claim: c28_rel_dev -->
  and -0.12 % <!-- claim: c34_rel_dev -->. Two derived prefactors reproduced:
  -0.28 % <!-- claim: eq6_prefactor_rel_dev --> and -0.014 % <!-- claim: eq9_prefactor_rel_dev -->.
  Two printed claims do not reproduce and are reported, not repaired: eq. (7) is
  -48.0 % <!-- claim: eq7_from_printed_eq6_rel_dev --> from eq. (6) as printed,
  and eq. (9) meets Chilton-Colburn at Re = 4480 <!-- claim: pipe_cross_Re -->,
  not 10,000. pymrm against the stagnant floor and two closed forms, on ladders
  per grid axis. Nothing on this page is fitted, and nothing judges the paper's
  three fitted constants.

caveats: >
  TIER 6: the paper contains no individual measurement. Several hundred k_L values
  appear only as points on Figs 1, 2 and 6, where the three fitted constants come
  from; no figure is digitised here, so this page cannot say whether they are good.

  THE CORNER-EVALUATION CHECKS ARE GOODNESS OF FIT, NOT VALIDATION: eq. (2)'s
  constant was fitted to the large-bubble runs whose k_L range it is compared
  against, eq. (1)'s to the small-bubble ones. They serve as transcription checks
  and as the demonstration that the small-bubble D_L exponent is misprinted.

  CITATION TRAP: the PDF's text layer prints the header as "1981 ... Vol 19"; the
  citation was established from the article's own printed header on a page image
  ("Chemical Engineering Science, 1961, Vol 16, pp 39 to 54"), confirmed by three
  running footers and the PII 0009-2509(61)87005-X.

  TRANSCRIPTION: every numeric was read off renders at the scan's native
  resolution and re-read at digit scale, because the 1961 typesetting's mid-dot
  decimal point is mostly lost. Eq. (4)'s constant is `0.13` (the English abstract's
  copy is OCR-ed as `0.18`) and its standard deviation is `66` per cent.

  CONSTANTS FROM OUTSIDE THIS ARTICLE, named where used: Froessling's `0.552`,
  the `18` of Stokes' law, Allen's C_D = 10 Re^(-1/2) (used only to check the
  printed 1/4), gravity, and water's properties for the Baird comparison.

  THE BOUNDARY LAYER IS A MECHANISM MODEL, NOT A BUBBLE MODEL: a flat interface
  with u = u_s + gdot*y. Its two pure limits are fixed by dimensional analysis.

  OVERLAP WITH A3.3: the mobile branch reduces to the penetration problem A3.3
  solves; this page checks against the closed form, not against A3.3, and reuses
  no number, dataset or sentence from A3.1, A3.3 or A3.4.

  SCOPE: Higbie, Froessling, Allen, Friedlander, Chu, Fallat, Baird, Kolmogoroff
  and Batchelor are cited by the paper and none is consulted; everything
  attributed to them is transcribed from what Calderbank & Moo-Young print. The
  heat-transfer halves of eqs. (1) and (4), the competing suspension-power laws
  and the sieve-tray material are not examined.
