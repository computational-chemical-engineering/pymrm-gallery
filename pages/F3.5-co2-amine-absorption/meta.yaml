validation:
  - "PSEUDO-FIRST-ORDER LIMIT: the film against the closed form E = Ha(cosh Ha - cb/ci)/(sinh Ha (1 - cb/ci)) over a Hatta sweep, at most 1e-4 <!-- claim: pfo_max_rel_err --> relative; grid doubling moves E of the stiffest case by at most 1e-4 <!-- claim: grid_delta --> and a further decade of k_inst by at most 1e-4 <!-- claim: kinst_delta -->."
  - "VAN KREVELEN-HOFTIJZER, an external approximation, within at most 1e-3 <!-- claim: vkh_dev --> at the DEA Hatta number, nothing tuned to it."
  - "PENETRATION INSTEAD OF FILM: the same network as a Higbie penetration model, backward Euler with newton per step, gives E larger by up to 11.3% <!-- claim: pen_vs_film_max --> at n_t = 640; time orders between 0.9 and 1.1 <!-- claim: pen_time_order --> on the ladder 160 to 1280, Richardson limit 11.57% <!-- claim: pen_vs_film_max_richardson -->."
  - "CONSISTENCY CHECKS, true by construction: physical absorption E = 1 to at most 1e-9 <!-- claim: physical_E1 -->; a dimensionless assembly sharing grid and operators, at most 1e-6 <!-- claim: second_order_cross -->; carbon-flux uniformity at most 1e-8 <!-- claim: carbon_flux_closure -->, testing the stoichiometry matrix; electroneutrality at most 1e-9 <!-- claim: electroneutrality -->, testing the equal ion diffusivities."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (Table 1 and Table 2 transcriptions, the reconstruction scalar, a diffusivity, the stoichiometry, the grid, the k_inst ladder, the film thickness, the penetration time grid, resolution, solver tolerance and contact time)."

adds: >
  The 1989 research code as model.py on pymrm operators (construct_grad with
  per-species boundary conditions on a graded grid, construct_div, NumJac on
  the pointwise network, newton with bounds continued in k_inst, the flux from
  the face-flux operator), running absorption, desorption and a penetration
  variant with newton per backward-Euler step; pymrm.checks supplies the roots
  of both fits and the time orders. With it, a forensic reading of the
  paper's parameter set: one scalar on K3 = Kw/Kc2,
  s = 1.4585 <!-- claim: k3_scale_fitted -->, fitted to the paper's own c_b
  identity, reproduces the unpromoted fluxes within
  3.8% <!-- claim: Ju_maxdev_reconstructed -->. It is a reconstruction, not a
  closure: the Kc2-versus-Kw split is undetermined and the paper's two
  out-of-sample numbers prefer the printed constants.

agreement: >
  Deviation is (model - paper)/paper throughout. With Table 1 exactly as
  printed, the twelve enhancement factors come out high by up to
  21.4% <!-- claim: E_maxdev_printed -->. With the scalar on K3 the four
  unpromoted fluxes agree within 3.8% <!-- claim: Ju_maxdev_reconstructed -->
  (the headline, because the fit residual lands in the flux), the eight
  promoted E within 7.6% <!-- claim: E_promoted_maxdev_reconstructed --> and the
  eight promotion factors within 5.6% <!-- claim: F_maxdev_reconstructed -->.
  The unpromoted E agree to 0.6% <!-- claim: Eu_maxdev_reconstructed -->, a
  flattered number: the fitted cb sits in E's denominator. ADVERSE: the
  desorption promotion factor misses by
  -2.3% <!-- claim: desorption_F_dev_printed_constants --> with the printed
  constants against -12.0% <!-- claim: desorption_F_dev --> reconstructed.

caveats: >
  Provenance tier 6: the comparison targets are the authors' own numerics; the
  only measured values in the paper are Savage et al.'s promotion factors,
  printed as "+-4" (DEA) and "+-6" (HDA). The reconstruction is a single fitted
  scalar, fitted to the implied cb = ci - J/(E kL), so it is not independent of
  the enhancement factors. On Kc1 instead it leaves E_u
  19.8% <!-- claim: Eu_max_branch_Kc1 --> high; Kc2 and Kw are the same change
  on every unpromoted quantity. Why K3 differs from its printed parts is not
  determined here. Figures 2 and 3 are labelled with twice the loading whose
  composition they plot; this page follows Table 2 and Figure 4. All figure
  readings are a cross-check pending maintainer visual review; no CSV is
  shipped and nothing on the page depends on them. H3O+ is eliminated
  analytically and the instantaneous equilibria are imposed as fast kinetics,
  continued in k_inst.
