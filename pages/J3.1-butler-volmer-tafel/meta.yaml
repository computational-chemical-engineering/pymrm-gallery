validation:
  - "Eq. 17 reduced with Eq. 16 reproduces the separately printed Eq. 30 to below 1e-10 <!-- claim: eq17_vs_eq30_max_rel --> relative, and only when alpha_a + alpha_c = 1; its root-found zero-current potential equals Eq. 16 to below 1e-13 <!-- claim: eq17_zero_current_vs_eq16_V --> V"
  - "what that check can and cannot detect, measured by injecting mis-transcriptions one at a time; at Doyle's alpha_a = alpha_c every exponent swap is a no-op, and a swap applied to both prefactors cancels and is undetectable"
  - "i = 0 at zero surface overpotential, the partial-current balance (structural), the exchange current density from the partial currents, R_ct = RT/(nFi_0) and the arcsinh inversion, each as a bound with its basis"
  - "the closed-form Tafel threshold against the single root of the full law located by pymrm.checks.find_roots, to below 1e-12 <!-- claim: tafel_threshold_closed_vs_numeric -->"
  - "Doyle's printed delta and nu, whose ratio removes the unprinted conductivity and tests Eq. 30's exchange current density (-15.7 % <!-- claim: nu2_over_delta_dev_frac -->), shown to be the same number as J3.4's kappa spread rather than a second test"
  - "the J3.4 cell re-solved with the standard form in place of Eq. 17 as printed, giving the same cell potential to below 1e-6 <!-- claim: bv_vs_eq17_cell_potential_mV --> mV"
  - "grid and time-step ladders measured separately, the time-step orders by pymrm.checks.observed_orders at least 0.8 <!-- claim: dt_observed_order --> and at most 1.2 <!-- claim: dt_observed_order_max -->, and the salt identity with the collector-leak row that moves it"
  - "a defect-injection table with a row for every non-structural claim"

adds: >
  Nothing to the law itself: Butler-Volmer is one line of arithmetic. pymrm
  contributes the root finds of every threshold (pymrm.checks.find_roots) and the
  operating envelope, J3.4's porous-electrode cell solved by newton on a NumJac
  Jacobian per implicit-Euler step, with the time-step orders from
  pymrm.checks.observed_orders. The Tafel threshold has an exact closed form that
  depends on the transfer coefficients only through their sum; the linear
  threshold depends on the split and is the first of several crossings. In the
  cell the two electrodes sit 2.9 <!-- claim: eta_separation_decades --> decades
  apart in |eta_s|.

agreement: >
  Thresholds at Doyle's 373.15 K with alpha_a + alpha_c = 1: Tafel is 10 % out
  at 77.1 <!-- claim: eta_tafel_10pct_mV --> mV and 1 % out at
  148.4 <!-- claim: eta_tafel_1pct_mV --> mV; the symmetric linear form is 5 %
  out at 35.9 <!-- claim: eta_linear_5pct_mV --> mV and 1 % out at
  15.8 <!-- claim: eta_linear_1pct_mV --> mV. In the J3.4 cell at I = 10 A/m2 the
  porous cathode runs at a mean surface overpotential of
  0.032 <!-- claim: cell_cathode_mean_eta_s_mV --> mV, while the lithium foil runs
  at 24.8 <!-- claim: cell_anode_eta_s_I10_mV --> mV, and at
  46.6 <!-- claim: cell_anode_eta_s_I20_mV --> mV at I = 20. Substituting Tafel in
  the cathode moves the cell potential by 519 <!-- claim: tafel_cathode_dV_mV -->
  mV, of the wrong sign.

caveats: >
  Provenance tier 6. Nothing on this page is compared with a measurement; every
  check is an algebraic identity or a number the paper prints. The historical
  sources of the Butler-Volmer equation were not consulted and no DOI is asserted
  for them. The nu^2/delta residual is reported, not explained, and it is the
  same disagreement as J3.4's kappa spread, not a second one. The peak cathode
  overpotential sits in the first cathode cell and the first time step and is
  converged in neither knob; with both refined it is
  1.519 <!-- claim: corner_peak_eta_mV --> mV, a margin of
  10.4 <!-- claim: corner_peak_margin_factor --> times to the 1 % linear threshold,
  and the sustained value past the transient is
  0.146 <!-- claim: sustained_peak_eta_mV --> mV. The absolute overpotentials
  belong to one cell at 100 C with a rate constant its authors chose as "a value
  corresponding to a nearly reversible situation"; the thresholds transfer, these
  overpotentials do not.
