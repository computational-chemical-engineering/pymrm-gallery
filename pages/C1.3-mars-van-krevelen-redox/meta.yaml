adds: >
  Nothing to the rate law; eqs. (1)-(16) are transcribed as printed and two of
  them are corrected from the paper's own neighbours. What is added is the
  audit and the reproduction. The paper's one complete worked calculation -
  the two-stage SO2 converter catalyst split along the optimum temperature
  curve - is reproduced end to end from printed inputs alone (Table 3's two
  rate groups, eq. 8, the 81/97 % targets, a printed Table 4 feed pair):
  23.6 : 76.4 against the paper's 23 : 77, by adaptive quadrature and by a
  pymrm plug-flow solve agreeing to 0.10 split-points, with nothing fitted in
  the chain and the result shown to move by at most 0.4 points across the
  whole printed feed-composition range - which is why the unstated plant feed
  does not undermine it. An equal-parameter discrimination on the reprinted
  Neumann data puts the MvK integrated form at 1.0 conversion-points rms
  against 2.85 for first-order-to-equilibrium and 3.80 for Boreskov's
  0.8-power law: the retardation term measurably earns its place. Four
  printed defects found: eq. (16)'s transposed RHS, the alpha_eq-power
  mismatch between (13a) and (14), the 425 C k'-average slip, and Table 4's
  unstated stoichiometry settled as pyrite-roaster gas (fitted nu = 1.386 vs
  11/8 = 1.375; sulphur burning excluded at 22x the rms). And an attribution
  result: the paper prints NO rate constant for any aromatic oxidation - the
  famous constants live in figures only - and its authors explicitly disclaim
  mechanistic proof in the printed discussion.

agreement: >
  Tier 2 in provenance (printed tables), but the measurements are Kuster's
  (1904) and Neumann's (1928) as REPRINTED by Mars & van Krevelen, with the
  authors' own computed k' columns. The quantitative results: catalyst split
  23.6 : 76.4 vs the printed 23 : 77 (two routes, 0.10 points apart);
  E_app = 8.58 kcal/mol vs "about 9"; van 't Hoff 22.60 vs 23 kcal/mol;
  Neumann k' held-out blocks 3.80 % mean deviation (2.00 % under the
  exact-integral reading); Kuster k' within 2.2 % (fit only); discrimination
  rms 1.01 / 2.85 / 3.80 conversion points for MvK / first-order / Boreskov.

caveats: >
  The aromatic oxidations - the reactions the mechanism is named for - are
  untested here because the paper prints no table to test them against:
  Figs. 2-10 are figure-only and no maintainer is available for figure
  review, so nothing on this page is read from a figure (Fig. 16's optimum
  curve is recomputed, not digitised, and is compared to nothing). Neumann's
  gas composition and velocity units are not printed; both are fitted, which
  is why the 475-550 C blocks are the held-out test and why the fitted
  6.4 % SO2 (or 8.0 % under the alpha_eq^2 reading) is a reconstruction, not
  a fact about 1928. The converter feed composition is likewise assumed (a
  printed Table 4 pair) with its sensitivity measured at <= 0.4 split-points.
  The two-point Arrhenius line through Table 3 is extrapolated above 570 C
  along the optimum curve exactly as the paper's own calculation must have
  done; capping at 600 C moves the split by 0.1 points. The discrimination
  compares equal-parameter forms only - a two-parameter LH form cannot be
  ranked fairly on 2-4 points per block and is not. Kuster's and Neumann's
  originals were not consulted (origin_not_consulted in the sidecars); every
  data value is as this paper prints it, which is the correct basis for a
  page about this paper's calculation but is NOT an endorsement of the 1904
  and 1928 measurements themselves.
