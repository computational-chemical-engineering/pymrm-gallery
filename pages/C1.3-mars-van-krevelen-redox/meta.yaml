# The notebook's break table re-runs every section with one defect injected.
validation:
  - >-
    Every number transcribed from cropped renders at the scan's native resolution
    (pdfimages -list, CCITT-G4 bilevel); the OCR text layer used for nothing numeric.
  - >-
    Fit and test declared: the Neumann recomputation fits its scale C and SO2
    fraction on the 325-465 C blocks only; the 475-550 C blocks are held out and
    probe the eq. (8) equilibrium machinery out of sample at
    3.80 % <!-- claim: neumann_test_mean_dev --> mean deviation. The Kuster
    recomputation is fit only, its conditions being unprinted. The catalyst-split
    reproduction fits nothing anywhere in its chain.
  - >-
    Printed intermediates recomputed and reconciled: E_app =
    8.58 <!-- claim: Eapp_kcal_per_mol --> kcal/mol from Table 3's two rate groups
    against the paper's "about 9 kcal/mol"; van 't Hoff slope of eq. (8) =
    22.6 <!-- claim: vantHoff_dH_kcal_per_mol_SO3 --> kcal/mol SO3 against the
    printed reaction heat 23; both k' tables reproduced to a few per cent; the
    paper's own 23:77 catalyst split reproduced as
    23.6 <!-- claim: split_converter1_pct_quad --> per cent for converter 1.
  - >-
    The k'-average column used as the paper's own checksum, in exact arithmetic on
    the printed digits: 4 <!-- claim: kavg_blocks_within_half_unit --> of the nine
    blocks agree to the last printed digit, 500 C is an exact rounding tie,
    2 <!-- claim: kavg_blocks_within_one_unit --> differ by at most one unit, 475 C
    carries a second small slip, and the 425 C block prints as its average exactly
    the mean of its first three rows, not of all four: a defect in the paper's
    arithmetic, reported not repaired.
  - >-
    The single bracketed k' (at 550 C) is not the row eq. (14) amplifies
    most: its conversion sits at alpha' = 0.968 <!-- claim: bracketed_row_alpha_prime -->,
    but 5 <!-- claim: table2_rows_more_sensitive_than_bracketed --> unbracketed rows
    sit closer to equilibrium.
  - >-
    Two printed equations proved wrong from the paper's own neighbouring
    equations: eq. (16)'s RHS is sign-inverted (the numeric integral of eq. (15)
    matches the corrected form to the quadrature tolerance and misses the printed
    form by up to 4.81 <!-- claim: eq16_printed_rhs_max_error -->), and eqs.
    (13a)/(14) disagree by one factor of alpha_eq (the k' recomputation is run both
    ways: as printed 3.80 % <!-- claim: neumann_test_mean_dev --> test mean, exact
    integral 2.00 % <!-- claim: neumann_test_mean_dev_power2 -->).
  - >-
    The pymrm plug-flow route against the quadrature: 0.08 <!-- claim: split_routes_gap_points -->
    split-points on 2000 cells, each converter's contact time the root of the
    profile's own crossing, observed order from 0.90 <!-- claim: split_order_min -->
    on 1000 to 16000 cells; the two routes share r(alpha), so their agreement
    tests the integration only.
  - >-
    Defect injection on every claim that is not structural: transcription slips
    in each table, the eq. (8) slope and intercept, the O2 content of air, the
    retardation term, alpha_eq set to 1, the rate form, the activation energy,
    the k window of the discrimination fits, quadrature tolerance, spline nodes,
    grid, crossing read and Newton iterations; each is failed by at least one
    row.
  - >-
    What no perturbation here can detect, stated on the page: the absolute scale
    of Neumann's velocity column (absorbed by the fitted C), anything multiplying
    all rates equally (the split is scale-invariant, registered as a bound), the
    value of n (inside Table 3's printed group), and the accuracy of eq. (8)
    against modern equilibrium data (every check is internal to the paper).

adds: >
  Nothing to the rate law; eqs. (1)-(16) are transcribed as printed and two of
  them are corrected from the paper's own neighbours. What is added is the audit
  and the reproduction. The paper's one complete worked calculation, the
  two-stage SO2 converter catalyst split along the optimum temperature curve, is
  reproduced end to end from printed inputs alone (Table 3's two rate groups,
  eq. 8, the converter targets, a printed Table 4 feed pair): converter 1 takes
  23.6 <!-- claim: split_converter1_pct_quad --> per cent against the paper's 23, by
  adaptive quadrature and by a pymrm plug-flow solve
  0.08 <!-- claim: split_routes_gap_points --> split-points apart, with nothing
  fitted in the chain. Across the six printed feeds that can reach the target the
  split runs from 22.47 <!-- claim: feed_split_min_pct --> to
  23.73 <!-- claim: feed_split_max_pct -->, so the unstated plant feed does not
  undermine it. An equal-parameter discrimination on the reprinted Neumann data
  puts the MvK integrated form at 1.01 <!-- claim: discrimination_rms_mvk -->
  conversion-points rms against 2.47 <!-- claim: discrimination_rms_boreskov -->
  for Boreskov's power law and 2.85 <!-- claim: discrimination_rms_first_order -->
  for first order to equilibrium: the retardation term measurably earns its
  place. Four printed defects found: eq. (16)'s transposed RHS, the
  alpha_eq-power mismatch between (13a) and (14), the 425 C k'-average slip,
  and Table 4's unstated stoichiometry settled as pyrite-roaster gas (fitted
  nu = 1.386 <!-- claim: table4_nu_bestfit --> against 11/8; sulphur burning
  excluded at 22 <!-- claim: table4_sulphur_over_pyrite --> times the rms). And an
  attribution result: the paper prints no rate constant for any aromatic
  oxidation (the famous constants live in figures only), and its authors
  explicitly disclaim mechanistic proof in the printed discussion.

agreement: >
  Tier 2 in provenance (printed tables), but the measurements are Kuster's
  (1904) and Neumann's (1928) as reprinted by Mars & van Krevelen, with the
  authors' own computed k' columns. The quantitative results: catalyst split
  23.6 <!-- claim: split_converter1_pct_quad --> per cent for converter 1 against
  the printed 23 (two routes 0.08 <!-- claim: split_routes_gap_points --> points
  apart); E_app = 8.58 <!-- claim: Eapp_kcal_per_mol --> kcal/mol against "about 9";
  van 't Hoff 22.6 <!-- claim: vantHoff_dH_kcal_per_mol_SO3 --> against 23 kcal/mol;
  Neumann k' held-out blocks 3.80 % <!-- claim: neumann_test_mean_dev --> mean
  deviation (2.00 % <!-- claim: neumann_test_mean_dev_power2 --> under the
  exact-integral reading); Kuster k' within 2.2 % <!-- claim: kuster_max_abs_dev -->
  (fit only); discrimination rms 1.01 <!-- claim: discrimination_rms_mvk -->,
  2.47 <!-- claim: discrimination_rms_boreskov --> and
  2.85 <!-- claim: discrimination_rms_first_order --> conversion points for MvK,
  Boreskov and first order.

caveats: >
  The aromatic oxidations, the reactions the mechanism is named for, are
  untested here because the paper prints no table to test them against: Figs.
  2-10 are figure-only, and nothing on this page is read from a figure (Fig.
  16's optimum curve is recomputed, not digitised, and is compared to nothing).
  Neumann's gas composition and velocity units are not printed; both are
  fitted, which is why the 475-550 C blocks are the held-out test and why the
  fitted 6.39 <!-- claim: neumann_fitted_SO2_pct --> % SO2 (or
  7.95 <!-- claim: neumann_fitted_SO2_pct_power2 --> % under the alpha_eq^2
  reading) is a reconstruction, not a fact about 1928. The converter feed
  composition is likewise assumed (a printed Table 4 pair); the Table 4 feed
  richest in SO2 cannot reach the converter-2 target at all. The two-point
  Arrhenius line through Table 3 is extrapolated above 570 C along the optimum
  curve exactly as the paper's own calculation must have done. The
  discrimination compares equal-parameter forms only; a two-parameter LH form
  cannot be ranked fairly on 2-4 points per block and is not. Kuster's and
  Neumann's originals were not consulted (origin_not_consulted in the sidecars);
  every data value is as this paper prints it, which is the correct basis for a
  page about this paper's calculation but is not an endorsement of the 1904 and
  1928 measurements themselves.
