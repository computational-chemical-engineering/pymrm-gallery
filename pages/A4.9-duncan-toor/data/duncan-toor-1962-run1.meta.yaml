parameters_verified: >
  All model parameters on the page were checked against the paper text on
  2026-07-25: bulb volumes 77.99 and 78.63 cc; capillary 8.59 cm long, 2.08 mm
  diameter; water bath 35.2 +/- 0.01 C; 1 atm; Maxwell-Stefan diffusivities at
  35.2 C and 1 atm of 0.833 (N2-H2), 0.680 (H2-CO2) and 0.168 (CO2-N2) sq cm/s.
  The paper uses an EFFECTIVE (L/A) of 258.1 1/cm measured from seven binary
  runs (Table 1), not the geometric 251.1 1/cm - a 2.80% difference - and states
  that Fig. 2 is computed with the effective value. The page follows this.
