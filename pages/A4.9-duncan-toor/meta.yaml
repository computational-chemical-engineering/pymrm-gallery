# Ranked by measured power. Every non-structural claim has a row in the
# notebook's break table.
validation:
  - "PRIMARY - mean and largest absolute deviation against the 28 <!-- claim: n_points --> digitised Figure 2 measurements, 0.59 % <!-- claim: mean_abs_deviation --> and 1.79 % <!-- claim: max_abs_deviation --> in mole fraction. Every one-digit transcription error of a diffusivity, of the effective (L/A) or of a bulb volume in the break table moves it; this is the only guard on the physics"
  - "capillary grid refinement n_z = 10 to 160 on the time-exact solve_ivp route, observed orders at least 1.8 <!-- claim: grid_observed_order --> and at most 2.2 <!-- claim: grid_observed_order -->; spatial error at the production n_z = 40 of 1.6e-6 <!-- claim: grid_error_nz40 --> in mole fraction"
  - "backward-Euler time-step refinement n_steps = 100 to 800, observed orders at least 0.9 <!-- claim: timestep_observed_order --> and at most 1.1 <!-- claim: timestep_observed_order -->; time error at the production 400 steps of 3.0e-4 <!-- claim: timestep_error_ns400 --> against solve_ivp on the same grid, 183 <!-- claim: time_over_grid_error_ratio --> times the spatial error"
  - "STRUCTURAL - flux uniformity along the capillary, below 1e-12 <!-- claim: flux_nonuniformity -->, and the closed-cell mole balance, below 1e-13 <!-- claim: mole_balance_error -->. One identity, the converged Newton residual over a scale; it catches an unconverged solve and a wrong construct_div geometry, never a wrong constant"

adds: >
  Qualitative correction of Fick's law, which cannot cross zero at all and is
  off by 9.1 % <!-- claim: fick_n2_dev --> in the N2 difference against 1.4 %
  <!-- claim: ms_n2_dev --> for Maxwell-Stefan; plus a quantitative correction
  of Toor's 1962 linearisation by resolving the composition dependence of [B]
  along the capillary (5.0 % <!-- claim: toor_dev_frac --> of the N2 difference
  at the barrier).

agreement: >
  0.59 % <!-- claim: mean_abs_deviation --> mean absolute deviation in mole
  fraction on 28 <!-- claim: n_points --> digitised points, nothing fitted.
  This comparison is the page's only guard on the physics. Flux uniformity and
  the mole balance are one structural identity that catches an unconverged
  solve and a wrong geometry, and nothing about the parameters.

caveats: >
  Two markers of Fig. 2 overlap another series and are absent from the dataset
  rather than guessed. The initial compositions are themselves the t = 0
  digitised points, so they carry the digitisation uncertainty of the sidecar.
