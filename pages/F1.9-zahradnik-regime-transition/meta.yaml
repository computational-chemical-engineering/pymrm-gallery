adds: >
  Checks only: the page is algebra, and pymrm contributes pymrm.checks.find_roots for
  the roots of eq. 5 with their count, the flux maxima, the branch crossings (an empty
  list is the result), the riser crossing, the flip velocity and the eq. 9 exponent.
  What the page adds to the paper is the test of the two model-intrinsic candidates
  for the transition and the measured consistency of the printed numbers with each
  other and with three of the paper's figures.

agreement: >
  Griffith-Wallis fits the 7 <!-- claim: r4_n_homog --> homogeneous Fig. 11(a) markers with an rms
  residual of 0.0078 <!-- claim: r4_rms_gw --> in the slip-velocity ratio, against 0.0343
  <!-- claim: r4_rms_marrucci --> for Marrucci (paired gap 0.0240 <!-- claim: r4_gap_mean --> with a standard
  error of 0.0069 <!-- claim: r4_gap_se -->). The printed pair is the last marker on that line, 0.6
  <!-- claim: r4_hu_eps_last --> half-units from the printed holdup, inside the marker's reading error; on the line, the printed holdup sits
  0.2027 <!-- claim: r1_hu_u_gw --> half-units from the printed velocity, and the printed velocity
  15.07 <!-- claim: r1_hu_eps_gw --> half-units from the printed holdup. The printed velocity is below the flux
  maximum (ratio 0.6809 <!-- claim: r2_ratio_u_gw --> for Griffith-Wallis,
  0.8641 <!-- claim: r2_ratio_u_rz --> for Richardson-Zaki), and the branches meet for 0
  <!-- claim: r3_n_forms_crossing --> of the 6 forms. Refitted on Fig. 12(b), eq. 10 gives C0 2.043
  <!-- claim: v3_C0 --> and u_d 0.2549 <!-- claim: v3_ud --> m/s, inside one standard error of the printed
  values. Eq. 14 misses its printed value by 49.7 <!-- claim: r3_hu_eq14 --> half-units.

caveats: >
  A correlation page, not a discretised model. The figures are read from a 300 ppi
  bilevel scan with the reading error in their sidecars; Fig. 11(a) carries the
  transition argument, and the markers are its plotted data, not a held-out set. The
  transition pair holds for air-water, one column, one aspect ratio and one plate. No
  stability theory is evaluated: the paper prints no coefficients for one. The water
  properties of eqs. 13 and 14 are this page's input; the paper states no temperature.
