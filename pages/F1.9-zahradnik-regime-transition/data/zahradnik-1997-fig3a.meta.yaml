dataset_id: zahradnik-1997-fig3a
title: "Gas holdup against superficial gas velocity, Fig. 3(a) of Zahradnik et al. (1997): plates A and B"
status: complete

source:
  authors: ["Zahradnik, J.", "Fialova, M.", "Ruzicka, M.", "Drahos, J.", "Kastanek, F.", "Thomas, N. H."]
  year: 1997
  title: "Duality of the gas-liquid flow regimes in bubble column reactors"
  container: "Chemical Engineering Science 52, 3811-3826"
  doi: "10.1016/S0009-2509(97)00226-1"
  access: >
    Publisher PDF (a 300 ppi bilevel scan whose text layer garbles symbols and numbers)
    held outside the repository (~/papers/pymrm-gallery/). Every value is read from the
    page images. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 3(a), journal page 3815 (PDF page 5)"
  tool: "pdfimages -png native bitmap (300 ppi, 1-bit); ring and disk template marker search; calibration and conversion by data/digitise.py (committed)"
  procedure: >
    Frame slopes: left frame +1.254 px per 100 rows, bottom frame -0.815 px per 100
    columns; iso-abscissa lines are taken parallel to the left frame and iso-ordinate
    lines parallel to the bottom frame. Abscissa from the five bottom ticks 0.04, 0.05,
    0.10, 0.125, 0.15 m/s (4583.4 px per m/s, largest residual 0.52 px); ordinate from
    the bottom frame and the left ticks 0.1, 0.2, 0.3 (2312.7 px per unit, largest
    residual 1.64 px). 14 open circles (plate A holdup) and 8 filled circles (plate B
    holdup); the k_L a triangles are not read.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "about 1.5 px per centre plus the 1.64 px tick residual: sigma_u 0.0005 m/s, sigma_eps 0.001"

conditions: "Air-water, semibatch, D_r 0.15 m, H0/D_r 10; plate A d0 0.5 mm, plate B d0 1.6 mm, free area 0.2 % (caption, p. 3815)."

columns:
  - {name: plate, unit: "-", description: "A (open circles) or B (filled circles)"}
  - {name: u_G, unit: m/s, description: "superficial gas velocity"}
  - {name: eps_G, unit: "-", description: "gas holdup"}
  - {name: px, unit: px, description: "centre column in the native bitmap"}
  - {name: py, unit: px, description: "centre row in the native bitmap"}

redistribution_basis: >
