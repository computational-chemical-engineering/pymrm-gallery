dataset_id: zahradnik-1997-printed-numbers
title: "Constants, limits and results printed in the text, Table 2 and eqs. 6 to 14 of Zahradnik et al. (1997)"
status: complete

source:
  authors: ["Zahradnik, J.", "Fialova, M.", "Ruzicka, M.", "Drahos, J.", "Kastanek, F.", "Thomas, N. H."]
  year: 1997
  title: "Duality of the gas-liquid flow regimes in bubble column reactors"
  container: "Chemical Engineering Science 52, 3811-3826"
  doi: "10.1016/S0009-2509(97)00226-1"
  access: >
    Publisher PDF (a 300 ppi bilevel scan whose text layer garbles symbols and numbers)
    held outside the repository (~/papers/pymrm-gallery/). Every value is read from the
    page images. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: transcribed
  tool: "pdfimages native page bitmaps (300 ppi), read by eye on zoomed crops"
  procedure: >
    Each value and its quote read from the page image (journal page = PDF page + 3810),
    pp. 3814, 3815 and 3821 to 3823. Quotes are short and exact up to symbol
    transliteration (eps_G for the Greek letter, u_OG for the subscripted u, u_b,inf for
    the subscript infinity). Read every column as str: values are printed strings,
    compared in half-units of their last printed digit. Table 2 prints the Joshi-Lali
    exponent as "1.2" and the Fig. 11(b) legend as "1/2"; both rows are kept.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision of each value"

conditions: "Air-water, bubble column D_r 0.15 m, H0/D_r 10 (Figs. 3, 11a, 12b); external-loop airlift riser (Figs. 11b, 12a). No temperature is printed."

columns:
  - {name: name, unit: "-", description: "key used by the page"}
  - {name: value, unit: "-", description: "the printed string (a fraction where the paper prints one)"}
  - {name: unit, unit: "-", description: "SI unit of the value"}
  - {name: where, unit: "-", description: "equation, table, figure or text passage"}
  - {name: journal_page, unit: "-", description: "page in Chem. Eng. Sci. 52"}
  - {name: pdf_page, unit: "-", description: "page in the publisher PDF"}
  - {name: quote_or_form, unit: "-", description: "short exact quote or the printed form"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
