dataset_id: zahradnik-1997-fig12b
title: "Zuber-Findlay drift-flux plot of the bubble column, Fig. 12(b) of Zahradnik et al. (1997): plate B"
status: complete

source:
  authors: ["Zahradnik, J.", "Fialova, M.", "Ruzicka, M.", "Drahos, J.", "Kastanek, F.", "Thomas, N. H."]
  year: 1997
  title: "Duality of the gas-liquid flow regimes in bubble column reactors"
  container: "Chemical Engineering Science 52, 3811-3826"
  doi: "10.1016/S0009-2509(97)00226-1"
  access: >
    Publisher PDF (a 300 ppi bilevel scan whose text layer garbles symbols and numbers)
    held outside the repository (~/papers/pymrm-gallery/). Every value is read from the
    page images. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 12(b), journal page 3822 (PDF page 12)"
  tool: "pdfimages -png native bitmap (300 ppi, 1-bit); disk template marker search; calibration and conversion by data/digitise.py (committed)"
  procedure: >
    Frame slopes: left frame +0.48 px per 100 rows, bottom frame -0.053 px per 100
    columns. Abscissa from the bottom ticks 0.05, 0.10, 0.15 m/s (4590.0 px per m/s,
    largest residual 0.33 px); ordinate from the bottom frame and the left ticks 0.1 to
    0.8 m/s (933.2 px per m/s, largest residual 1.67 px). 8 filled circles; the drawn
    regression line passes through each marker and is not read.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "about 1.5 px per centre plus the tick residual: sigma_u 0.0004 m/s, sigma of u_G/eps 0.002 m/s"

conditions: "Air-water, semibatch (u_OL = 0), bubble column D_r 0.15 m, H0/D_r 10, plate B (d0 1.6 mm, free area 0.2 %); the data behind eq. (10), p. 3823."

columns:
  - {name: u_G, unit: m/s, description: "superficial gas velocity"}
  - {name: uG_over_eps, unit: m/s, description: "ordinate u_OG/eps_G"}
  - {name: px, unit: px, description: "centre column in the native bitmap"}
  - {name: py, unit: px, description: "centre row in the native bitmap"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
