id: F2.3
slug: slurry-bubble-column-ft
title: "Slurry bubble column for Fischer–Tropsch synthesis"
section: F
status: published
tier: T1
priority: P1
structures: [S7, S8]
phases: [gas-liquid-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "3.3.0"
runtime_seconds: 20
datasets:
  - maretto-krishna-1999-fig2.csv

# Ranked by measured power: the notebook's break table re-evaluates every claim
# with one defect injected.
validation:
  - >-
    PRIMARY - the hydrodynamic model against the digitised Figure 2 markers above
    2 U_df, one set of constants, nothing fitted: 5.9 % <!-- claim: holdup_mad_eps_s_0 -->,
    6.3 % <!-- claim: holdup_mad_eps_s_016 --> and 4.9 % <!-- claim: holdup_mad_eps_s_035 -->
    mean deviation at eps_s = 0, 0.16, 0.35; eq. 9 with F1.4's 0.268 on the same
    markers for comparison
  - >-
    PRIMARY - the two printed-constant diagnoses against the paper's own results: of
    four decades of eq. 2's prefactor and two readings of eq. 1, only 8.8533e-3 read as
    the CO rate comes near both reported conversions, 93.3 % <!-- claim: conversion_U012 -->
    and 65.7 % <!-- claim: conversion_U040 --> against 96 % and 63 %; the paper's
    productivities imply 96.3 % <!-- claim: paper_implied_conversion_U012 --> and
    63.5 % <!-- claim: paper_implied_conversion_U040 --> for the page's feed basis
  - >-
    the paper's sensitivity test: doubling a adds 56.9 % <!-- claim: a_double_change -->
    to the productivity (paper +60 %); a 3-fold kLa reduction changes it by -6.8 %
    <!-- claim: kla_third_change -->, a 10-fold increase by 0.12 % <!-- claim:
    kla_tenfold_change -->
  - >-
    the pymrm finite-volume solve against an independent ODE route (solve_ivp DOP853
    and scipy root): first order on six nested grids, 3.9e-6 <!-- claim:
    pymrm_vs_ode_n1600 --> worst at 1600 cells, the Richardson limit within 1e-7, the
    finest differences far above round-off
  - >-
    the syngas balance (feed minus face exit equals the liquid uptake) and the
    equality of CO and H2 conversion hold to round-off on every solve; identities of
    the conservative scheme, blind to the contraction law, caught by the advective form,
    a last-cell exit read and an H2 coefficient off 2
  - >-
    STRUCTURAL - with C rescaled to hold C*D_T^n fixed, any eq. 9 exponent reproduces
    the figure exactly, because every marker is at one diameter

adds: >
  The reactor as one Newton system: gas profiles and liquid concentrations solved
  together with an exact Jacobian, the large-bubble balance written for the molar
  flux so the scheme is conservative for the contracting gas, the exit read on the
  outlet face, and an independent ODE route that the finite-volume conversion
  approaches at first order.

  Two printed constants are localised against the paper's own numbers rather than
  fitted round. Eq. 2's prefactor is printed as 8.8533e3 mol/(s kg_cat bar^2),
  which makes the rate at the feed 1.6e4 <!-- claim: rate_feed_printed --> mol
  CO/(s kg_cat) and the conversion 99.6 % <!-- claim: conversion_a+3_CO_U012 -->
  whatever the throughput; it is used as 8.8533e-3. Eq. 1's rate, labelled
  R_CO+H2, enters eqs. 19 and 20 as the CO rate; read as syngas it gives 72.8 %
  <!-- claim: conversion_a-3_syngas_U012 --> and 24.3 % <!-- claim:
  conversion_a-3_syngas_U040 -->.

  The contraction of eq. 21 is read as a molar conversion, the only reading under
  which the exit conversion is the one eq. 21 was evaluated at; read as a
  concentration ratio it gives 63.6 % <!-- claim: conversion_concentration_reading_U040 -->
  at U = 0.40 and is inconsistent with its own exit by 16.2 points. The dropped
  liquid outflow term cannot close the 3-point gap at low velocity: a liquid
  flowing out at 0.1 m/s adds 0.36 percentage points.

agreement: >
  Hydrodynamics: 5.9 % <!-- claim: holdup_mad_eps_s_0 -->, 6.3 % <!-- claim:
  holdup_mad_eps_s_016 --> and 4.9 % <!-- claim: holdup_mad_eps_s_035 --> mean
  absolute deviation at eps_s = 0, 0.16 and 0.35 over 79 markers, one set of
  constants, nothing fitted. Reactor: 93.3 % <!-- claim: conversion_U012 -->
  conversion at U = 0.12 m/s and 65.7 % <!-- claim: conversion_U040 --> at 0.40
  against the 96 % and 63 % the paper reports for eps_s = 0.30 (96.3 % and 63.5 %
  implied by its productivities). The pymrm conversion is 3.9e-6 <!-- claim:
  pymrm_vs_ode_n1600 --> from the independent ODE route at 1600 cells.

caveats: >
  The reactor is never compared with a measurement: no commercial FT slurry column
  data are public and the paper reports none, so every conversion is a check
  against the authors' own simulation. The model sits 3.0 percentage points below
  the paper at U = 0.12, and the page does not identify why; the dropped liquid
  outflow is not the cause. At U = 0.40 the concentration reading of eq. 21 matches
  the paper's 63.5 % and the molar reading, used here, gives 65.7 %; which one the
  authors' Fortran code used is not stated in the paper. The digitised holdup is from
  a 0.10 m column at ambient pressure while the reactor runs at 7 m and 30 bar, so
  eq. 11's pressure factor and the D_T cap at 1 m are used outside anything tested
  here; the -0.18 diameter exponent is untestable from this page in both
  directions, inert at 7 m because of the cap and inseparable from C at 0.10 m. 20
  detections in a merged cluster at the origin are carried in the CSV flagged
  resolved = no and excluded. Markers at U <= 2 U_df are excluded, a cut this page
  chose. Eq. 9 is stated for eps_s above 0.16 and is also used at eps_s = 0. Axial
  dispersion in the slurry is assumed away. Both constant corrections rest on the
  authors' reported conversions being right.
