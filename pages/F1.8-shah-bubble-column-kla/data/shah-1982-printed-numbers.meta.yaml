dataset_id: shah-1982-printed-numbers
title: "The kLa constants, stated ranges and figure conditions of the review, as printed"
status: complete

source:
  authors: ["Shah, Y. T.", "Kelkar, B. G.", "Godbole, S. P.", "Deckwer, W.-D."]
  year: 1982
  container: "AIChE Journal 28(3) 353-379"
  doi: 10.1002/aic.690280302
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: "pages 360, 365, 366 and 367 (PDF pages 8, 13, 14, 15), rendered at 150 ppi from the native 300 ppi bilevel scan; every exponent and range legible"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-23
  estimated_error: "none beyond the printed precision; every value is transcribed as printed, kept as a string"

conditions: >
  The `where` column gives the table, figure or text page. Two ranges of the same
  Akita-Yoshida correlation differ by a factor of ten between Table 2.1 no. 4 and
  Table 4-a.2 no. 1 (liquid velocity 0.044 against 0.44 m/s, height 1.26-3.5 m
  against 0.126-0.35 m); both are kept. The Nakanoh-Yoshida velocity group is
  printed uG/(g Dc), without a square root (ny_fr_exp is the printed power of that
  group). The Table 4-a.1 "Mean Error, %" is not defined in the review. The
  liquid-velocity basis of the nozzle row is 0.007 to 0.03 m/s in the text of
  p. 366 and 0.01-0.03 m/s in the label of Fig 6-a.1.

columns:
  - {name: name, unit: "-", description: "key used by the page"}
  - {name: printed, unit: "see meaning", description: "the number as printed (SI as in the review); fractions kept as printed"}
  - {name: where, unit: "-", description: "table, figure or text page of the review"}
  - {name: meaning, unit: "-", description: "what the number is"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
