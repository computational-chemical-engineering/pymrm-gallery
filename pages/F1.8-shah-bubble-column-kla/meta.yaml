validation:
  - the Akita-Yoshida constants as the review reprints them against F1.1's transcription of the original papers
  - every correlation function against independent check values from a second route
  - dimensional homogeneity of each correlation, in SI against cm-g-s, which exposes the printed Nakanoh-Yoshida velocity group
  - the local exponent of Akita-Yoshida in closed form against a central difference, and its maxima against the closed form by bracketed roots
  - the digitised lines of both figures against the formulas they draw, which measures the reading error
  - every number the page states is a registered claim with a break row that moves it

adds: >
  Nothing to the correlations; the page is algebra, and pymrm contributes only
  pymrm.checks.find_roots for the implicit holdup and the maxima of the Akita-Yoshida
  ratio. What the page adds to the review is a set of checks it does not print: its
  correlations set against each other in units of its own mean errors, a dimensional
  check of each correlation, and the scatter of its two kLa figures as numbers.

agreement: >
  Akita-Yoshida lies below the nozzle row of Table 4-a.1 over the part of the row's
  window it covers, at the row's diameter: at most 0.7336 <!-- claim: noz_max_ratio -->
  of it, and 0.518 <!-- claim: noz_ratio_lo --> at the low end, a gap of 1.51
  <!-- claim: noz_gap_over_err --> printed mean errors at the closest point. Against
  Hikita it is lower up to D = 0.2752 <!-- claim: hik_cross_D --> m. Its secant exponent
  over the nozzle window is 0.904 <!-- claim: secant_exp_noz_window -->, against the n
  of the fitted rows. In the held-out Figure 6-a.1, at matched gas velocity, the
  highest liquid velocity lies 0.222 <!-- claim: ul_pair_diff --> above the lowest in
  log ratio to the drawn line, at t = 6.7 <!-- claim: ul_pair_t --> over 5
  <!-- claim: ul_pair_n --> pairs (unmatched, all markers: 0.300
  <!-- claim: ul_all_diff -->), while the markers scatter about the line by a mean
  absolute deviation of 12.4 % <!-- claim: f1_mad_row -->.

caveats: >
  This is a correlation page, not a discretised model. Table 4-a.1 and Figure 6-a.2
  are fitted or selected data, so agreement with them is not validation; only Figure
  6-a.1 is held out, and it was taken in a 0.14 m column with a ring sparger, outside
  the basis of the nozzle row it is compared with. Both figures are digitised by
  hand from the 300 ppi scan with the error stated in their sidecars. The water
  properties are F1.1's (borrowed dataset); the air viscosity is a page input. The
  Nakanoh-Yoshida group is used with the square root restored (the printed form is
  not dimensionless) and only for comparison, since water lies outside its viscosity
  range. The Akita-Yoshida liquid-velocity range is printed twice, a factor of ten
  apart, and the page does not decide which is right.
