adds: >
  To the physics, nothing. Chapter 14 is right: three worked examples reproduce
  with zero deviation, the Fig. 14.3 annotations to 3e-15, and the chapter's
  assertion about the dispersion model is confirmed and quantified.

  Four things are new. FIRST, the identity AND the correction of the chapter's
  own conversion rule: N equal tanks in series IS construct_convflux_upwind plus
  construct_div on N cells, exactly, so the model's numerical diffusion is
  u*L/(2N) and the equivalent Peclet number is 2N. The chapter does print a rule
  - on Fig. 14.7, book p. 327 - and it is INVERTED; the derivation here is that
  rule the right way up, the book's own Ch. 13 settles it two independent ways,
  and the page then measures both what the printed form costs (138 % in
  conversion at N = 64, k tbar = 2, against 0.053 % de-inverted) and where the
  corrected rule stops holding.

  SECOND, the measurement of what a two-moment fit is worth: the 9,9,9,9,24
  chain, which is not in the chapter, and the closed-form supremum over the whole
  family of chains matching the same two moments, which is 83.1 % in outlet
  concentration at k tbar = 10 - a factor of 5.9.

  THIRD, five printed defects, each proved from the book's own arithmetic.

  FOURTH, a caution about pymrm itself: there is no pure-outflow boundary
  condition in the library. The nearest, zero-gradient, reconstructs the exit
  face to second order, which is right for a discretised PDE and wrong for a
  model whose cell count is a physical parameter. It costs 5.9 % at N = 2 and
  3.8 % at N = 4 and decays as N^-0.87, i.e. it looks exactly like ordinary
  discretisation error and is not one. The workaround (suppress the boundary flux
  with b=1,d=0 and add the outflow as a construct_coefficient_matrix sink on the
  last cell) is exact and cheap but had to be worked out rather than looked up.

agreement: >
  Not applicable in the experimental sense; this is a tier 6 analytical page and
  Chapter 14 contains no measurement of any kind.

  The strongest reproduction is the three worked examples, all exact. The check
  with the most resolution is first-order conversion by three routes sharing no
  assembly: 2.4e-15 (pymrm against Eq. 9) and 1.5e-10 (Eq. 11's quadrature
  against Eq. 9) over 48 cases. The sharpest printed claim tested is Fig. 14.3's
  "error < 2 % for N > 5", whose threshold root-finds to N = 5.2004.

  The headline result is not an agreement at all but a limit: two chains that
  match E14.4's fitted mean and variance EXACTLY differ by 23.2 % in OUTLET
  CONCENTRATION at k tbar = 10 (0.16 % in conversion), and the supremum over
  every chain matching those two moments is 83.1 % there.

caveats: >
  Tier 6, and emphatically NOT experimental validation. Chapter 14 measures
  nothing.

  ORIGIN NOT CONSULTED. The RTD, its means and variances, and the F curve of
  Fig. 14.7 are attributed BY THIS BOOK to MacMullin, R. B. and Weber, M., Jr.,
  Trans. AIChE 31, 409 (1935). That paper is not on disk and was not read.
  Everything here was read from the 1999 monograph and from nowhere else, on
  600 dpi renders (the scan's native resolution) - the text layer of this book
  destroys every equation and every subscript, returning Eq. 3 as
  "7. = (-&) NN e-tNli". Two values come from Chapter 13 (book p. 303) rather
  than Chapter 14, because Fig. 14.7's annotation names that figure by number.

  FIVE PRINTED DEFECTS, reported and not repaired. (0) Fig. 14.7, p. 327: the
  annotation inside its axes box, "When N > 50 the curve becomes symmetrical in
  which case use fig. 13-11 with N = 1/2 (D/uL)", has the ratio INVERTED - the
  book's own Ch. 13 gives N = 1/2 (uL/D) two independent ways. The most
  consequential of the five, because it is a modelling rule rather than a unit or
  a tick, and 138 % wrong in conversion at N = 64, k tbar = 2. (1) Section 14.2,
  p. 328: V_Ntanks/V_p = 1 + k tbar_i = 1 + k tbar/(2N); with the book's own
  tbar = N tbar_i these differ by a factor of EXACTLY 2, and expanding the book's
  own Eq. 9 shows the MIDDLE form is the wrong one. (The factor is a limit and is
  extrapolated to x = 0, not fitted over a window: a 400-point polyfit returns
  2.0003 and a wider one 2.03, and those trailing digits mean nothing.)
  (2) Fig. E14.4b, p. 334: the top axis tick reads 0.105 s^-1 on an axis ticked
  0, 0.005, 0.010, and the book's own PRINTED E(t) = 3.2922e-6 t^3 e^(-0.0667 t)
  peaks at 0.0149138 at t = 44.9775 s - the tick is 7.04x the whole curve and
  should read 0.015. (With the unrounded coefficients the peak is 0.0149361 and
  the ratio 7.03; the tick belongs to the printed curve.) (3) E14.2, p. 331:
  "L = 272 moles", where the Comment two lines below says "L <= 272 miles".
  (4) E14.4, p. 333: "Delta(sigma^2) = 1000 - 100 = 900 s", a variance carrying
  the unit of a time. A SIXTH item is a typesetting ambiguity rather than a
  defect: Eq. 11's denominator is set as (N-1)! tbar_N with a lowered N where
  tbar^N is required, and the book prints the raised form itself two pages later
  in E14.4.

  ONE ANNOTATION THE PAGE CANNOT SETTLE. Fig. 14.3 draws a single level
  E_theta,inf and labels it 0.55 E_theta,max for N = 4 and 0.61 for N >= 10. The
  two inflection points do not sit at the same height: at N = 4 they are at
  0.4267 and 0.6943 of the maximum, at N = 10 at 0.5225 and 0.6631. The printed
  value lies between them in both cases and the N >= 10 figure is the Gaussian
  limit e^(-1/2) = 0.6065. Both heights are reported and NEITHER IS SCORED.

  INDEPENDENCE IS ASSUMED, NOT TESTED. Levenspiel's own footnote flags laminar
  flow as a case where the fluid carries memory from vessel to vessel. Nothing
  here can detect that, and the additivity check would pass anyway.

  THE EQUAL-TANK ASSUMPTION CUTS BOTH WAYS. The page cannot say Levenspiel's
  vessel is four equal tanks either; it says only that four equal tanks and the
  five-stage chain are indistinguishable by his method.

  THE DISPERSION COMPARISON DEPENDS ON A MATCHING RULE. Pe = 2N is what the
  upwind scheme's numerical diffusion gives AND what Levenspiel's own
  small-deviation sigma^2_theta = 2(D/uL) gives, exactly - the two agree, which is
  what de-inverts Fig. 14.7's annotation. Matching the CLOSED-vessel variance, or
  the conversion, gives Peclet numbers a little below 2N: the offsets 2N - Pe are
  1.008 and 1.341 at N = 64, i.e. O(1) in Pe and O(1/N) relatively, and both are
  reported. Nothing in that section establishes that either model describes a
  real vessel.

  E14.3 IS SCOPED OUT. Its data live only in the curve of Fig. E14.3a, and no
  curve is traced anywhere on this page.

  26 OF 81 METRICS ARE BELOW check_agreement.py's ABS_FLOOR of 1e-12 and are
  therefore outside the regression suite entirely. That is high, and it is what
  an exact-arithmetic page looks like: several are exact reproductions of printed
  integers. Each is named on the page and each carries an above-floor companion
  that the companion string must NAME, asserted in code - an earlier draft had
  four whose companion strings named no metric, so their assert iterated over an
  empty set and proved nothing.

  THE BREAK TABLE'S ASSOCIATIONS ARE DECLARED, NOT MEASURED. Every row recomputes
  the one metric it is pinned to, and that row's baseline is asserted to equal the
  reported value of that metric; the wider mover list is a judgement, with every
  name checked to be a real key of agreement.json, and the coverage map is built
  from those lists rather than written by hand. An earlier draft had a row that
  reported a metric against zero, injected no defect, and was named as the mover
  of seven metrics.

  NO OTHER PAGE'S DATASET IS LOADED. A2.8 uses Erlang RTDs of N equal tanks and
  says in its own caveats that A2.4 was not built; it publishes no RTD dataset,
  so there is nothing to borrow. A2.8's finding that the RTD alone does not fix
  the conversion for a reaction order other than one is re-established here
  independently (the 25.4 % micro/macro gap) and is consistent.
