fit_or_test: >
  ONE FITTED NUMBER, and the page is built around what it is worth. Levenspiel's
  worked example E14.4 fits N to a pair of tracer curves using exactly two
  numbers - the difference of their means and the difference of their variances -
  and gets 4 tanks. Everything this page compares against is HELD OUT of that
  fit: the shape of the exit curve, the F curve, the first- and second-order
  conversions, the macrofluid conversion, and the additivity property. E14.1 and
  E14.2 fit nothing at all; they are arithmetic on printed inputs. The Fig. 14.3
  annotations are fitted to nothing anywhere.

  Reproducing the RTD from a fitted N would be a goodness of fit, so the page
  does not report one. It reports the ambiguity instead: a five-stage chain with
  residence times 9, 9, 9, 9 and 24 s matches E14.4's measured mean (60 s) and
  variance (900 s^2) EXACTLY - both deviations are 0 - and differs by 23.2 % in
  OUTLET CONCENTRATION at k tbar = 10, the right-hand edge of the sweep (6.1 %
  second order). Three qualifications are carried everywhere that number is,
  because each is a way of overstating it. (a) It is a concentration gap, NOT a
  conversion gap: the two chains convert 99.334 % and 99.488 %, and the relative
  gap in conversion never exceeds 0.38 % anywhere on the sweep. (b) It is
  monotone in k tbar - 1.53 % at 2, 69.7 % at 50 - so it is where the sweep
  stops, not a maximum over it. (c) It is ONE chain, hence a LOWER BOUND. The
  supremum over every chain matching both moments is closed form (the extremal
  chain has at most two distinct tank sizes, by Lagrange; the bound is
  ln(1+k sqrt(S)) + k(T - sqrt(S))) and equals 83.1 % at k tbar = 10, approached
  by one 30 s tank followed by 30 s of plug flow. That is the practical worth of
  a two-moment fit, measured rather than asserted.

  There is NO EXPERIMENT anywhere in Chapter 14. Nothing here is experimental
  validation; every comparison is against the book's own arithmetic or against an
  analytical limit, and the page is tier 6.

