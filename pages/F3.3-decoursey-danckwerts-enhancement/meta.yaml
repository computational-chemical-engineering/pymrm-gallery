id: F3.3
slug: decoursey-danckwerts-enhancement
title: "DeCoursey (1974): an explicit enhancement factor for the Danckwerts surface-renewal model, tested against the exact model"
section: F
status: planned
tier: T1
priority: P1
structures: [S4]
phases: [gas-liquid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

reference:
  - authors: ["DeCoursey, W. J."]
    year: 1974
    title: "Absorption with chemical reaction: development of a new relation for the Danckwerts model"
    container: "Chemical Engineering Science 29, 1867-1872"
    doi: 10.1016/0009-2509(74)85003-7

pymrm_min_version: "3.4.1"
runtime_seconds: 215
datasets:
  - decoursey-1974-printed-numbers.csv
  - check_values.csv

validation:
  - every function against independent check values from a second route (a scipy method-of-lines march, no pymrm), before the first claim
  - B frozen reproduces sqrt(1 + M) (Danckwerts) and Eq. (23) with f = 1 (Higbie); Eq. (21) at E_a = 1e12 meets the frozen solve; slow and fast limits
  - the equal-diffusivity identity of Eq. (15) holds for the exact Danckwerts model, falling at second order
  - cell and step ladders at the test case and at the worst case, each with observed orders, a frozen-B companion against the exact value and a solver-tolerance companion; domain, start age and quadrature
  - every number the page states is a registered claim with a break row that moves it

adds: >
  The exact surface-renewal model the paper could not test against: pymrm solves the
  coupled transient A/B equations in similarity variables (construct_grad, construct_div,
  construct_coefficient_matrix and two construct_convflux_upwind operators averaged into a
  central flux, assembled once on a graded grid; compute_boundary_values for the interface
  flux; pymrm.newton with NumJac per BDF2 step), and pymrm.checks supplies the extrema
  (find_roots) and the extrapolations (observed_orders). Eqs. (20) to (23) are closed forms.

agreement: >
  Over the paper's 12 cases the worst error of Eq. (21) against the exact Danckwerts model
  is 6.2705 <!-- claim: r1_worst_abs_pct --> % in magnitude, so the prediction "within about
  12 per cent" holds with a margin of 1.9137 <!-- claim: r1_margin -->. Recomputing Table 1
  with the exact Higbie average, 2 <!-- claim: r4_n_round --> of 7 printed corrections round
  from the recomputed value and 7 <!-- claim: r4_n_allow --> of 7 are within the charts'
  stated accuracy plus half a unit.

caveats: >
  Tested on the paper's grid only (E_a 3 to 21, D_B/D_A 0.02 to 10, plus E_a = 100 at
  D_B/D_A = 1). The corrections of Tables 1 and 2 are chart readings, compared only within
  the charts' stated accuracy. Nothing is measured (data tier 6). Brian et al.'s paper
  is not read; only DeCoursey's readings of it are used.
