dataset_id: decoursey-1974-printed-numbers
title: "Printed corrections of Tables 1 and 2 and the stated accuracies of DeCoursey (1974)"
status: complete

source:
  authors: ["DeCoursey, W. J."]
  year: 1974
  title: "Absorption with chemical reaction: development of a new relation for the Danckwerts model"
  container: "Chemical Engineering Science 29, 1867-1872"
  doi: "10.1016/0009-2509(74)85003-7"
  access: >
    Scanned journal PDF (6 pages, 300 ppi bilevel) held outside the repository, lawful
    access. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: table
  figure: "Table 1 and Table 2 (p. 1870), and the stated accuracies in the text of p. 1870 (section 'Closeness of approximation')"
  resolution: "PDF pages rendered at 150 ppi, the two tables cropped at 300 ppi; journal page = PDF page + 1866"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    None beyond the printed precision: entries are kept as printed strings (read with
    dtype=str); the scan prints decimal points as raised dots (0·02), written here as
    0.02. The OCR text layer is garbled and is not used for any entry. The corrections are
    not computed values: they are DeCoursey's readings of the correction charts of Brian,
    Hurley and Hasseltine (1961), whose stated accuracy is 3 % of the Higbie-model value
    (misprint/ambiguity M5 of the build notes), printed as integers. Table 2 does not
    print the M values over which each range was read (M3).

conditions: >
  Table 1: E_a = 6, D_B/D_A = 1.0; correction (%) = 100 (E_Higbie/E_Eq21 - 1) at the
  printed M, read as 'The corrections shown, when applied to the value from Eq. (21), give
  the values found numerically by Brian et al.' (p. 1870). Table 2: range of the same
  correction for E_a = 3, 6, 11, 21 and D_B/D_A = 0.02, 1, 10. M is the paper's
  D_A k2 B0/(k_L*)^2 with each model's own k_L*.

columns:
  - {name: item, unit: "-", description: "short name"}
  - {name: printed, unit: "-", description: "the entry as printed, a string (signs kept: '+8')"}
  - {name: page, unit: "-", description: "journal page"}
  - {name: meaning, unit: "-", description: "what the entry is"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure or page image is reproduced.
