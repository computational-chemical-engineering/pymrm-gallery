dataset_id: vandu-krishna-2004-fig2a-curves
title: "The five drawn sensor-response fit curves of Fig. 2a of Vandu and Krishna (2004)"
status: complete

source:
  authors: ["Vandu, C. O.", "Krishna, R."]
  year: 2004
  title: "Volumetric mass transfer coefficients in slurry bubble columns operating in the churn-turbulent flow regime"
  container: "Chemical Engineering and Processing 43, 987-995"
  doi: "10.1016/j.cep.2003.09.007"
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/). No PDF and no
    page image is stored in this repository; data/digitise.py takes a local PDF path.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 2a, journal page 989 (PDF object 16)"
  tool: "vector extraction by data/digitise.py (committed)"
  procedure: >
    The five stroked polylines inside the Fig. 2a axes ("The model fits using Eq. (3) are
    shown by continuous lines", caption p. 989); a curve split over two paths is joined at
    the shared vertex. Time axis 0 to 8 s, ordinate 0 to 1.0, piecewise linear between
    labelled ticks. Curves are numbered from the slowest; the page matches them to the
    caption values by rank.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "exact to 0.001 pt"

conditions: "Beaker step test, about 293 K (p. 990)."

columns:
  - {name: curve, unit: "-", description: "curve1 (slowest) to curve5"}
  - {name: x_pt, unit: pt, description: "PDF x of the vertex"}
  - {name: y_pt, unit: pt, description: "PDF y of the vertex"}
  - {name: t_s, unit: s, description: "time"}
  - {name: ratio, unit: "-", description: "C_sensor/C_L*"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
