dataset_id: vandu-krishna-2004-printed-numbers
title: "Constants and caption values printed by Vandu and Krishna (2004)"
status: complete

source:
  authors: ["Vandu, C. O.", "Krishna, R."]
  year: 2004
  title: "Volumetric mass transfer coefficients in slurry bubble columns operating in the churn-turbulent flow regime"
  container: "Chemical Engineering and Processing 43, 987-995"
  doi: "10.1016/j.cep.2003.09.007"
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/). No PDF and no
    page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: transcribed
  procedure: >
    Every value read from the page images rendered at 150 dpi (Tables 1 to 4, p. 988-989;
    the captions of Figs. 2 and 3, p. 989-990; the time axes of Fig. 3, p. 990), kept as
    printed. Read with dtype=str: the page compares a printed constant in half-units of its
    last printed digit.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed digits"

conditions: "Air, ambient pressure, about 293 K (p. 988)."

columns:
  - {name: name, unit: "-", description: "key used by the page"}
  - {name: printed, unit: "see meaning", description: "the value as printed"}
  - {name: where, unit: "-", description: "table, caption or text and journal page"}
  - {name: meaning, unit: "-", description: "what the value is, with its unit"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No text block, figure or page image
  is reproduced.
