acquisition:
  method: digitised
  figure: "Fig. 10f (p. 993): kLa/eps_G against U, Tellus oil in the 0.1 and 0.38 m columns"
  tool: "pdfimages -png (native 600 ppi stencil, no resampling); template matching by data/digitise_raster.py (committed)"
  procedure: >
    Axes: the longest ink runs of the panel; ticks refined from nominal places between
    labelled ticks; least-squares calibration through every tick found (x 2448 px per m/s, y 10280 px per 1/s; tick residuals 1.10 px (x) and 1.09 px (y)). Markers:
    peaks of the fraction of the legend marker's ink covered (threshold 0.86 unless set:
    cover {tellus_D0.10: 0.80} (circles on the drawn line)); one marker per place, the highest-scoring template. Centres: circle and square
    the box centre, triangle the vertex centroid (h/6 from the box centre toward the
    base; on the vector Figs. 7 and 11 the joining polylines meet the centroid to 0.07 pt).
    Drawn thick lines: rows with ink across at least a quarter of the panel, 6 or more rows
    thick; value at the mean row, ends where the line is unbroken by more than 60 px; each
    line labelled by the series whose markers above 0.08 m/s have the nearest median.
    The overlay of every read centre on the bitmap was checked by eye.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    About 2 native px per centre (2 px: 0.0008 m/s in U, 0.0002 1/s in P). The page measures the reading error empirically
    from the same series read in more than one figure.

