validation:
  - every function against independent check values from a second route
  - plotted Schmidt numbers, solids fractions and diameters of the vector figures against the printed tables, and the same plateau read from two vector figures
  - the drawn Fig. 2a curves against the caption sensor constants, with and without a time shift
  - eq. 5 against direct integration, the least-squares probe rate against quadrature, the dead-time sum of squares against quadrature
  - Table 2's diffusivities against the Wilke-Chang and Hayduk-Minhas estimates
  - the same series read from three raster figures, beside the tick-fit residuals of the sidecars
  - every number the page states is a registered claim with a break row that moves it

adds: >
  Little: the page is algebra and statistics, and pymrm contributes only
  pymrm.checks.find_roots for the least-squares probe rate, the half time of eq. 5 and
  the sensor-sensitivity root. What the page adds to the paper is the exponent with its
  uncertainty from the paper's own exact plateaus, the flatness test on its plotted
  points, and the size of the probe correction from its printed constants.

agreement: >
  From the four exact Figure 5 plateaus the free exponent is -0.409 <!-- claim: exp_free_slope -->
  ± 0.061 <!-- claim: exp_free_se --> on two degrees of freedom; the free slope differs from the paper's -1/3 by t = -1.24
  <!-- claim: exp_t_vs_minus_third --> standard errors (95 % interval -0.671
  <!-- claim: exp_ci_lo --> to -0.147 <!-- claim: exp_ci_hi -->), so the data neither
  confirm nor refute it. The drawn line misses the plateaus by -27.4 % <!-- claim: rule_miss_tetradecane -->
  to +29.6 % <!-- claim: rule_miss_tellus -->. Above the paper's threshold velocity, 4 <!-- claim: r3_n_t_beyond_2 -->
  of 6 <!-- claim: r3_n_series --> digitised series have a slope beyond two standard
  errors, a fitted change of +9.5 % <!-- claim: r3_delta_slurry25 --> to
  +19.7 % <!-- claim: r3_delta_tellus_D0.38 --> of the mean P across the markers; water is
  undecided (t = -1.99 <!-- claim: r3_t_water -->, -2.16 <!-- claim: r3_t_water_partial -->
  with its two half-hidden markers read, beyond two standard errors in
  42 % <!-- claim: r3_water_flip_frac --> of seeded redraws). An uncorrected evaluation would
  return 0.562 <!-- claim: probe_rate_min_wt --> to 0.879 <!-- claim: probe_rate_max_wt -->
  of the corrected kLa_L for water and tetradecane; for Tellus oil at most
  0.930 <!-- claim: probe_rate_max_tellus --> on the plotted window and
  0.985 <!-- claim: probe_tellus37_deadtime_rate_long --> on a much longer record.

caveats: >
  This is a correlation-and-data page, not a discretised model. The Figure 5, 7, 9 and
  11 values are exact (vector paths); Figures 4c, 8c and 10f are read by template
  matching with the error stated in their sidecars, and two half-hidden water markers
  of Figure 4c are read by hand (larger error) and kept out of the main statistics. Figures 4a and 6a are not digitised, so the holdups the
  captions imply are not compared with plotted holdups. The paper prints no constant
  for its rule; the page reads it from the drawn line. Ambient air only; nothing beyond the paper's largest column.
