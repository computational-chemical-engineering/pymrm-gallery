adds: >
  Nothing to the criteria themselves: each is one line of algebra, reproduced
  as printed. What is added is the exact solve behind each stated tolerance,
  so each "less than 5 %" becomes a measured number. Eq. 17, the most-quoted
  "Mears criterion", is exact at first order: the film balance makes the
  deviation omega/3 identically, and zero order is exactly unaffected. The
  intraparticle family (eqs. 1-3) is liberal by its own rounding of 0.75 to 1:
  at the printed bounds the deviation is 6.29-6.79 %, at the unrounded 0.75/n
  it is 4.78-5.07 %. Eq. 9 over-certifies even with the unrounded constant for
  gamma*beta in (0.222, 1.159) around n = 1 at gamma = 30, asymmetric about n,
  and Petersen's 13 there admits 37.8 %, a transition-region marker. Past
  gamma*beta = 1.95, where the band has three crossings and the unrounded bound
  overtakes the kinetic-side one, it re-admits a mild 5.03-5.22 % up to the
  paper's beta range edge. On the folded branch of gamma*beta = 24, eq. 1's
  band certifies a deviation of 3135 while eq. 9's band edge admits 7.20 %,
  because its bound has shrunk below the ignited branch's reach. Eq. 14 is
  liberal by construction but only just (5.10-5.12 %), and the film
  observables determine the deviation, so film multiplicity cannot produce a
  false pass. Eq. 21 fails structurally at low Biot number, and passing eqs.
  1, 17 and 21 at once still admits 11.15 % at an interior optimum
  Bi_m = 6.33 where two criteria bind. Mears' axial criterion (eqs. 30/32)
  holds: 3.91-4.95 % at first order, 4.81 % at most at second order
  (3.80-4.73 % under the co-varying-length reading), where Petersen's
  alpha < 1 admits 23-51 %.

agreement: >
  Not applicable in the experimental sense: tier 6. The checks with resolving
  power are the solver comparisons: the headline deviation by three routes,
  whose largest gap is pymrm's 800-cell grid error, 1.0e-7; pymrm against
  shooting at eight threshold states, 8.2e-8 on 800 cells at second order;
  the pymrm vessel against the closed form, 7.1e-8 on 1600 cells; and the
  dimensional film cross-checks below 1e-12. The paper's printed constants are
  reproduced from other printed constants (0.22, "four and a half", the Biot
  threshold 10), and its prose statements are given numbers: Petersen's 13
  admits 37.8 %; the 80 % compensation statement holds conservatively (centre
  value 0.45); eq. 12 is conservative in all six exothermic cases and admits
  27.6 % at gamma*beta = -1. Everything else on the page is an audit finding
  rather than an agreement, and is labelled that way.

caveats: >
  Provenance tier 6 and not experimental validation: the source contains no
  measurement, no figure and no table beyond its nomenclature. This paper is a
  review; the criteria "derived by the author" are derived in two companion
  papers (Mears 1971a Chem. Eng. Sci. "in press" for the axial criterion;
  Mears 1971b J. Catal. 20, 127 for the interphase and interparticle heat
  criteria), and neither companion was consulted: the page audits the criteria
  exactly as the review states them, which is how the literature cites them.
  The remaining criteria are attributed by the review to Weisz & Prater,
  Weisz, Hudgins, Anderson, Kubota & Yamanaka, Weisz & Hicks, Carberry,
  Satterfield et al., van den Bleek et al. and Petersen; none of those
  originals was consulted either. Three groups of printed criteria are stated
  but not audited, each with the reason on the page: eqs. 4-5 (volume-change
  modulus; the paper prints theta with opposite signs in eq. 4 and its
  nomenclature), eqs. 23-27 (interparticle; they test reactor-scale fields
  against correlations in other papers), and the thermal part of eqs. 21-22
  (needs the two-field film pellet). The eq. 9 window is measured at
  gamma = 30, n = 1 and depends mildly on both; eq. 9 thresholds are the
  deep-side band crossings unless stated, and above gamma*beta = 1.45 the band
  has three crossings, all printed. All pellet results assume the sphere,
  steady state, constant properties and the Prater relation (tested on B1.6).
