  - the transcription checked against four paper-internal identities with real resolving power, each relating printed constants that were read independently - 0.22 vs 1/sqrt(20), "four and a half times" vs sqrt(20), Carberry's 0.1 vs 2x Mears' 0.15 (under the bulk-referenced reading of Carberry's eta; the surface-referenced reading gives factor 1.8 and the page prints the deviation both ways, 9.1 and 10.0 %), and eq. 15's Biot threshold of 10 recovered as 2 x 0.75/0.15 from the unrounded constant, which pins 0.75, 0.15 and 10 at once
