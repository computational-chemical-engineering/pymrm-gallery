    missing at all in the sense meant here: it was simply absent, undisclosed,
    and is now in the file.

validation:
  internal_consistency: >
    The extracted Reynolds range is 0.00857 to 49.1, against the 0.008 to 50 the
    abstract and the conclusions both print - neither number was used in the
    calibration. Refitting Eq. (16)'s constant beta to these 55 points with gamma
    held at the paper's 0.73 returns 8.98 against the printed 9.7; refitting both
    - a different estimator - returns gamma = 0.702 and beta = 8.58. The
    extraction and the page-image transcription of Eq. (17) are therefore
    independent witnesses that agree. The notebook quotes each estimator's
    bootstrap interval beside its own estimate; the two are not interchangeable.

