adds: >
  Three things the paper does not contain. First, the location of the Peclet
  maximum: Edwards and Richardson bound it ("greater than 3") and never solve for
  it; Eq. (18) puts it at Pe = 3.186, Re = 3.195. Second, a numerical-dispersion
  budget for the measurement itself. Their Appendix B computes the second
  response curve from the first by explicit finite differences and tests
  convergence by halving the intervals; this page shows what the untested version
  costs, and that the error is not noise but a plausible dispersion coefficient -
  u h/2 + u^2 dt/2, predicted to 0.4 %. Third, and most substantially, their own
  shape diagnostic turned round. They report that with fine particles the
  computed second response curve peaks LATER than the measured one and attribute
  it to channels forming. A two-zone bed constrained to their measured D_L =
  0.503 cm2/s reproduces that sign when the minority zone by VOLUME is the
  slower one, and the opposite sign when it is the faster one - in 10 of the 12
  volume splits scanned, and in all 8 of the 8 where the peak moves by more than
  0.05 % of the transit time at all; the two exceptions sit at th1 = 0.35 and
  0.65, near an even split, and neither displaces the peak by as much as
  0.011 %. The claim is therefore
  conditional: WHEN such a bed displaces the peak measurably, the direction E&R
  report is the one a slow minority zone gives. The size of that displacement
  bounds nothing - it is at most 0.36 % of the transit time at the published
  th1 = 0.15 slice but 1.14 %, with an 18.7 % shape residual, once the volume
  fraction is allowed to move. What the page concludes is the either/or its own
  notebook states: a discrepancy large enough to see implies either a slow
  region rather than a channel, or structure coarser than any two-zone
  description tuned to 0.503 cm2/s can hold. The page also puts a number on
  their own qualitative explanation - the anomalous run sits at 88 % of the
  minimum fluidisation velocity tabulated for those same beads, from two printed
  values on different pages - and prints, beside it, the sentence in the same
  paragraph of the paper that cuts against that reading.

agreement: >
  Experimentally validated, with the usual caveat about which part is a
  prediction. Eq. (18) reproduces 55 marker positions digitised from Figure 9 to
  a mean absolute deviation of 11.75 % with a bias of +0.003 % over 3.7 decades of
  Reynolds number - but gamma and beta were fitted by the authors to those very
  markers, so that number is a goodness of fit. What is independent is the SHAPE:
  the correlation without its radial-mixing term misses by 29.9 % and cannot
  exceed Pe = 2 at all, where 30 of the 55 measured points do. And the refit is
  independent in the other direction: recovering beta = 8.98 against the printed
  9.7 from a fresh reading of the figure tests the digitisation and the page-image
  transcription against each other, and its bootstrap interval is wide enough
  that no difference from the printed value is claimed. On the solver side the
  two-point moment inversion returns its input to 1.4e-05, and the numerical
  dispersion of the cheaper schemes is predicted to 0.4 % from u h/2 + u^2 dt/2.

caveats: >
  The 11.75 % is a goodness of fit, not a prediction - see above. The page tests
  no particle-size dependence: Figure 9's five marker shapes were deliberately
  not extracted, because Eq. (18) contains no particle-size term, so the paper's
  claim of "no consistent trend with particle size" is untested here. Only one
  gas pair was ever run, so the kinematic viscosity in the Reynolds number is
  untested - the authors say so themselves. On the extraction: four merged
  clusters were re-fitted glyph by glyph after an audit, one row that had landed
  on a bare stretch of the dashed curve was moved onto the marker beside it, one
  marker that carried no row at all was added, and three glyphs remain fused
  into their neighbours and are listed in the sidecar with the measured effect of
  including the most nearly resolvable of them (11.75 % -> 11.62 %, 30 -> 31
  above Pe = 2). The maintainer review is pending and NON-BLOCKING, and the
  question it asks is now the right one - the sidecar no longer asks whether a
  row sits on a bare dash, because that has been answered. The moment-recovery
  check is about the solver, not the physics: it says nothing about whether a
  real packed bed obeys the dispersion equation. Two checks are labelled for what
  they are - the area ratio and the recovered velocity are near-structural, and
  the break table measures exactly what each is blind to rather than asserting
  it; the area ratio does catch a wrong geometry, which is why it is kept. And
  the break table now also records what the pair does NOT cover: the parameter
  chain, where a swapped Table 1 row moves every physical number by 6-7 % and no
  diagnostic on the page moves at all. The outlet boundary condition is a
  measured blind spot: with 80 cm of bed past the second detector, a Dirichlet
  outlet and a zero-gradient outlet return identical numbers. The 0.44 %
  agreement between Eq. (17) and Eq. (18) at one Reynolds number is arithmetic,
  not evidence - the two share every constant. The gas crossover Reynolds number
  is reproduced to 1.7 %, not exactly. One printed check does NOT come out at
  all: the liquid crossover Reynolds number 3e-4 requires a kinematic viscosity
  of 0.018 cm2/s where water at 20 C is 0.0100, and the discrepancy is stated
  rather than repaired. Figure 15's detector separation is not printed in the
  paper; the reconstruction assumes the 100 cm section of Figure 13, and the page
  reports what the paper's other test section, 21.3 cm, would give. The two-zone
  section is a demonstration of sufficiency, not an identification: one apparent
  D_L cannot fix three parameters, and the page claims only what the SIGN of the
  shape discrepancy implies, and only where that sign is resolvable. Gunn's 1993
  note on the same data is catalogued as A2.6 and is not built here, because it
  prints its Eq. (42) but not the p(Re) function that makes it evaluable.
