  # PRIMARY - against the measurements
  - "EXPERIMENTAL - Eq. (18) against 55 marker positions digitised from Figure 9: mean absolute deviation 11.75 %, median 9.96 %, bias +0.003 %, log scatter 0.1367 in ln Pe, over the whole printed Reynolds range. Deviations are (model - measured)/measured throughout"
  - "the informative null on the same 55 points: Eq. (15), which has the right molecular branch and the right high-Re limit but no radial-mixing correction, misses by 29.91 % with a -29.83 % bias, because its ceiling of Pe = 2 sits below 30 of the 55 measured points. Two further nulls are printed, at 670 % and 281 %"
  - "the digitisation and the page-image transcription as independent witnesses: refitting beta with gamma held at the printed 0.73 returns 8.98 against the printed 9.7, with a 95 % moving-block bootstrap interval [7.50, 9.94]; refitting both is a different estimator and returns gamma = 0.702, beta = 8.58. No exclusion is claimed: across block sizes 3, 6, 9 and 12 the gamma-fixed upper limit runs from 9.69 to 10.22, and every one of the bootstrap fits reports success"
  # TRANSCRIPTION CHECKS
  - "Eq. (18)'s printed constants derived from Eq. (17)'s to 1.28 % and 0.31 %; one mis-read digit moves these to 14.8 % and 10.6 %. The gas crossover Reynolds number 1.830 against the printed 1.8 (+1.7 %, not exact); gamma = 0.150/0.205 to 0.23 %; eps = 0.3716 as the mean voidage of Table 1's five large sizes; Table 1's eight voidages reproduce 1 - bulk/material density to at most 0.0018 absolute, mean 0.0006"
  - "the maximum of Eq. (18) located at Pe = 3.186, Re = 3.195, against the conclusions' 'a maximum, greater than 3'. Gunn (1993) puts a maximum 'at a Reynolds number of about 4', but for his Figure 1's combined gas-phase set, not for E&R's points alone"
  # THE SIMULATED EXPERIMENT
  - "the whole measurement simulated and inverted: a pulse propagated through a pymrm bed, sampled at two detectors 100 cm apart, and inverted with the paper's own Eqs. (6) and (7), returns the input dispersion coefficient to 1.38e-5 relative at n = 3200 with van Leer (limiter correction implicit) and Crank-Nicolson on the upwind and diffusive operator, at observed orders 2.99 to 3.05 on successive grids"
  - "the numerical dispersion of the cheaper schemes predicted before the runs, with no fitted constant: u h/2 for first-order upwind plus u^2 dt/2 for implicit Euler accounts for the measured excess to within 0.42 % over eight runs and a factor of eight in grid spacing. At n = 400 the bare upwind scheme reports a dispersion coefficient 4.5 times the truth"
  - "the TVD step equations solved two ways: deferred correction on one factorisation (the production route) and newton with the exact ConvFluxTVD Jacobian agree below 1e-7 in the recovered D_L on the Figure 13 run and on the two-zone bed; newton is slower here"
  - "the two-zone model against an independent closed form, D_add = th1^2 th2^2 (u1-u2)^2/kappa: 3.07e-5 at n = 2000, third order on successive grids; doubling kappa in the solve or dropping the volume fractions from the mass matrix fails the check"
  # DEFECT INJECTION
  - "a defect-injection table in which every claim is failed by at least one row: digit slips in gamma, beta, D_M and Eq. (18)'s coefficients, a 5 px extraction shift, a fused marker included, a wrong Table 1 row, a wrong geometry (nu = 1), an absorbing outlet behind a short bed, a truncated record, bare upwind, implicit Euler in place of Crank-Nicolson, a loose deferred-correction tolerance, a doubled exchange coefficient, and the coarse grids of the two-zone scans. The parameter chain stays blind to the solver diagnostics: the adjacent Table 1 row moves u by 6.1 % and D_L by 6.9 % and no diagnostic beyond its fifth decimal"

adds: >
  Three things the paper does not contain. First, the location of the Peclet
  maximum: Edwards and Richardson bound it ("greater than 3") and never solve for
  it; Eq. (18) puts it at Pe = 3.186, Re = 3.195 (a closed form, not a pymrm
  result). Second, a numerical-dispersion budget for the measurement itself.
  Their Appendix B computes the second response curve from the first by explicit
  finite differences and tests convergence by halving the intervals; this page
  shows what the untested version costs, and that the error is not noise but a
  plausible dispersion coefficient, u h/2 + u^2 dt/2, predicted to 0.42 %. Third,
  their own shape diagnostic turned round. They report that with fine particles
  the computed second response curve peaks LATER than the measured one and
  attribute it to channels forming. A two-zone bed constrained to their measured
  D_L = 0.503 cm2/s reproduces that sign when the minority zone by VOLUME is the
  slower one, and the opposite sign when it is the faster one, in all 8 distinct
  beds of a volume-split scan on 1000 and on 2000 cells, and all 8 of a
  flow-split scan. The size of that displacement bounds nothing: on matched
  3200-cell grids it is 0.49 % of the transit time at the published th1 = 0.15
  slice and 1.34 % once the volume fraction moves, a ratio of 2.73, with an
  18.0 % shape residual. The fast-minority lags change by up to 48 % from 1000 to
  2000 cells and are grid values good to about 50 %; the signs do not change. What
  the page concludes is the either/or: a discrepancy large enough to see implies
  either a slow region rather than a channel, or structure coarser than any
  two-zone description tuned to 0.503 cm2/s can hold. The page also puts a
  number on their own qualitative explanation (the anomalous run sits at 88 % of
  the minimum fluidisation velocity tabulated for those same beads) and prints,
  beside it, the sentence in the same paragraph of the paper that cuts against
  that reading.

agreement: >
  Experimentally validated, with the usual caveat about which part is a
  prediction. Eq. (18) reproduces 55 marker positions digitised from Figure 9 to
  a mean absolute deviation of 11.75 % with a bias of +0.003 %, but gamma and
  beta were fitted by the authors to those very markers, so that number is a
  goodness of fit. What is independent is the SHAPE: the correlation without its
  radial-mixing term misses by 29.91 % and cannot exceed Pe = 2 at all, where 30
  of the 55 measured points do. The refit recovers beta = 8.98 against the
  printed 9.7 from a fresh reading of the figure, with a bootstrap interval wide
  enough that no difference from the printed value is claimed. On the solver
  side the two-point moment inversion returns its input to 1.38e-5, and the
  numerical dispersion of the cheaper schemes is predicted to 0.42 % from
  u h/2 + u^2 dt/2.

caveats: >
  The 11.75 % is a goodness of fit, not a prediction. The page tests no
  particle-size dependence: Figure 9's five marker shapes were deliberately not
  extracted, because Eq. (18) contains no particle-size term. Only one gas pair
  was ever run, so the kinematic viscosity in the Reynolds number is untested.
  On the extraction: four merged clusters were re-fitted glyph by glyph after an
  audit, one row that had landed on a bare stretch of the dashed curve was moved
  onto the marker beside it, one marker that carried no row at all was added, and
  three glyphs remain fused into their neighbours and are listed in the sidecar
  with the measured effect of including the most nearly resolvable of them. The
  maintainer review is pending and non-blocking. The moment-recovery check is
  about the solver, not the physics. The solver diagnostics do not test the
  parameter chain, and the break table records it. The outlet boundary
  condition is a measured blind spot: with 80 cm of bed past the second
  detector, an absorbing outlet and an outflow face return identical numbers.
  The 0.44 % agreement between Eq. (17) and Eq. (18) at one Reynolds number is
  arithmetic, not evidence. The liquid crossover Reynolds number does not come
  out: it requires a kinematic viscosity of 0.0180 cm2/s where water at 20 C is
  0.0100, and the discrepancy is stated rather than repaired. Figure 15's
  detector separation is not printed in the paper; the reconstruction assumes
  the 100 cm section of Figure 13, and the page reports what the paper's other
  test section, 21.3 cm, would give. The two-zone section is a demonstration of
  sufficiency, not an identification, and its lags and residuals are values at
  their grid. Gunn's 1993 note on the same data is catalogued as A2.6 and is not
  built here.
