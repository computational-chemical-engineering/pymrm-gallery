dataset_id: robeson-2008-near-bound-points
title: >
  The 117 experimental (permeability, selectivity) points Robeson tabulates as lying close to the
  2008 upper bound, for eleven gas pairs
source:
  authors: ["Robeson, L. M."]
  year: 2008
  container: "Journal of Membrane Science 320(1-2) 390-400"
  doi: "10.1016/j.memsci.2008.04.030"
  title_as_printed: "The upper bound revisited"
  location: "Tables 1-11, pp. 392-396"
  caption_as_printed: >
    "Experimental data points close to the present empirical upper bound for <gas pair> separation"
    (the same caption on all eleven tables, with the gas pair substituted)
acquisition:
  method: >
    transcribed from the eleven printed tables. Born-digital PDF; every table was read from a
    300 dpi `pdftoppm` render cropped to digit scale (Tables 1-2 on p. 392, 3-5 on p. 393, 6-7 on
    p. 394, 8-9 on p. 395, 10-11 on p. 396) and cross-checked against `pdftotext -layout`. The two
    readings agree on all 234 numerals.
  date: "2026-08-08"
  digitised: false
provenance_depth: >
  These are NOT Robeson's measurements. Each row carries a bracketed reference to the primary
  paper that reported it; Robeson compiled them. NONE of those primary papers was consulted here,
  so this dataset is a faithful transcription of a compilation, and any error made in compiling it
  is inherited. The page says so wherever these rows carry a result.
columns:
  table: "the paper's table number, 1-11."
  gas_pair: "fast gas / slow gas, as printed."
  polymer: >
    the polymer designation as printed, with registered-trademark and trademark symbols dropped
    (the paper prints Hyflon(R), Teflon(R), Viton(R), Nafion(R), Cytop(TM)) and with the Table 1
    parenthetical gloss "(D = degree of)" dropped. Multi-line cells are joined onto one line.
    Otherwise verbatim, INCLUDING two printed inconsistencies left unrepaired: Table 2 prints
    "Polypyrrole 6FDA/PMDA (25/75)-TAB" where Tables 1, 5 and 6 print "Polypyrrolone" for the same
    material from the same reference [21], and Table 9 prints "Poly(pyrrolone)(6FDA-TAB)" where
    Tables 5 and 6 print "Polypyrrolone (6FDA-TAB)".
  P_fast_barrer: "permeability of the fast gas, in barrers, as printed."
  alpha: "separation factor P_fast/P_slow, dimensionless, as printed."
  ref_bracket: >
    the paper's own citation number(s) for the row, as printed. A pointer for a reader, not used in
    any computation on this page.
notes: >
  Row order is the printed row order, which is not always monotone in permeability - Table 1 prints
  PIM-1 (370) before PIM-7 (190), Table 11 prints Hyflon AD80 (430) before Hyflon AD60X (405).
  Preserved so a reader can find a row on the page.
  Two rows are flagged BY THE PAPER ITSELF and both are used on this page as printed, never
  repaired: (i) O2/N2, P = 18.0, alpha = 9.0, of which p. 392 says its position above the present
  upper bound "is questioned as only one significant figure was noted for nitrogen permeability";
  (ii) N2/CH4, P = 153, alpha = 1.9, of which p. 395 says the CH4 permeability "was listed as 80.2
  barrers where it would be more realistic to be 180.2 barrers". The tabulated alpha = 1.9 is
  consistent with the AS-LISTED 80.2 (153/80.2 = 1.908), not with the suggested 180.2 (0.849), so
  the table carries the unrepaired value and the repair lives only in the prose.
  The two gas pairs with no table at all are H2/O2 and He/O2 - consistent with their "NA" present
  bound in Table 12.
status: complete
