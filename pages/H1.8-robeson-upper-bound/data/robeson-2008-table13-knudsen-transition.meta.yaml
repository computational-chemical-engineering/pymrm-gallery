dataset_id: robeson-2008-table13-knudsen-transition
title: >
  Robeson's solution-diffusion-to-Knudsen transition analysis: solubility selectivity, molecular
  weight ratio, their product, and the permeability the upper bound gives at that selectivity
source:
  authors: ["Robeson, L. M."]
  year: 2008
  container: "Journal of Membrane Science 320(1-2) 390-400"
  doi: "10.1016/j.memsci.2008.04.030"
  title_as_printed: "The upper bound revisited"
  location: "Tables 13a and 13b, p. 398"
  caption_as_printed: >
    13a: "Transition permeability to Knudsen diffusion using critical temperature to calculate ks";
    13b: "Transition permeability to Knudsen diffusion using Lennard-Jones temperature to calculate
    ks". Shared footnote: "Pi for Tables 13a and b represents the permeability on the upper bound
    curve where the solution-diffusion Di/Dj value is equal to that predicted for Knudsen diffusion."
acquisition:
  method: >
    transcribed from the two printed tables, read from a 300 dpi `pdftoppm` render of p. 398 cropped
    to digit scale, cross-checked against `pdftotext -layout`. The two readings agree on all 104
    numerals.
  date: "2026-08-08"
  digitised: false
columns:
  table: '"13a" (ks from critical temperature, eq. 4) or "13b" (ks from Lennard-Jones temperature, eq. 5).'
  gas_pair: "fast gas / slow gas, as printed."
  dataset: >
    "prior" for the two rows each table labels "(prior data)" - He/H2 and H2/CO2 - which the paper
    evaluates on the PRIOR (k, n) of Table 12; "present" for every other row, evaluated on the
    present (k, n). This column is this page's encoding of the printed "(prior data)" label; it is
    not a separate printed column.
  ks: "solubility selectivity S_i/S_j, dimensionless, as printed."
  sqrt_M_ratio: "(M_j/M_i)^(1/2), the Knudsen diffusion selectivity, dimensionless, as printed."
  ks_D_ratio: >
    the printed product column, headed "ks(Di/Dj) = ks(Mj/Mi)^(1/2)". This is the separation factor
    at which solution-diffusion selectivity equals the Knudsen value.
  P_transition_barrer: >
    P_i in barrers: the permeability the upper bound of Table 12 gives at that separation factor.
    Robeson computed it as k * ks_D_ratio^n; this page checks that identity rather than assuming it.
notes: >
  THIS TABLE IS THE PAGE'S SECOND, INDEPENDENT ROUTE TO TABLE 12. Robeson computed the last column
  from Table 12's (k, n) by a chain that has nothing to do with how this page assembles Table 12, so
  reproducing all 26 rows is a real check on the transcription of every present (k, n) pair plus the
  prior pairs for He/H2 and H2/CO2. It shares Table 12 as an INPUT, so it cannot detect an error
  Robeson himself made in Table 12.
  The two "(prior data)" rows in each table are the only place in the paper where the same
  separation factor is evaluated on both the 1991/1994 and the 2008 bound, which makes their ratio
  a printed measurement of the shift at a stated selectivity.
  ks is NOT checkable from this paper: eqs. (4) and (5) need critical temperatures and Lennard-Jones
  temperatures, and the 2008 paper prints neither. ks is taken as an input.
  The (M_j/M_i)^(1/2) column IS checkable and reproduces exactly from INTEGER molecular weights
  (He 4, H2 2, O2 32, N2 28, CO2 44, CH4 16); IUPAC standard atomic weights do not reproduce it
  (H2/N2 would be 3.728, not the printed 3.742).
status: complete
