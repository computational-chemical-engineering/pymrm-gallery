dataset_id: robeson-2008-printed-claims
title: >
  Every prose claim of Robeson (2008) that this page tests, quoted verbatim, with the paper's own
  three-way classification of how far each gas pair's upper bound moved
source:
  authors: ["Robeson, L. M."]
  year: 2008
  container: "Journal of Membrane Science 320(1-2) 390-400"
  doi: "10.1016/j.memsci.2008.04.030"
  title_as_printed: "The upper bound revisited"
  location: "abstract (p. 390), sections 2-13 (pp. 391-396), section 14 'Upper bound analysis' (p. 397), Discussion and Conclusions (pp. 398-399)"
acquisition:
  method: >
    quoted from the born-digital text layer and then verified sentence by sentence against 300 dpi
    `pdftoppm` crops of the same sentences (abstract p. 390; "by eye" sentence and O2/N2 questioned
    point p. 392; He/H2 slope p. 395; N2/CH4 repair p. 395; H2/CO2 slope and skew p. 396; the
    PTMSP "reasonable proximity" sentence in section 14, p. 397; Conclusions pp. 398-399).
  date: "2026-08-08"
  digitised: false
columns:
  claim_id: "short handle used in the notebook prose and in the coverage map."
  gas_pair: >
    the pair the claim is about, blank where the claim is general. A quote that names five pairs is
    repeated once per pair, with the same claim_id and the same quote, so the classification can be
    joined onto Table 12 by gas pair.
  shift_class: >
    THIS PAGE'S ONE-WORD ENCODING of the paper's own Conclusions wording - "modest", "minor",
    "significant". It is a transcription of Robeson's classification, not a judgement made here.
    Blank for claims that classify nothing.
  page: "journal page number on which the sentence is printed."
  quote: >
    verbatim, including the paper's own quotation marks (doubled per CSV quoting) and its own
    typography. Two departures, both notational only: Greek alpha is written as the character α
    where the paper sets it in italic, and subscripts are set inline (P(O2), CO2/CH4). No [sic]
    marks appear inside these strings; the notebook prose adds them outside the quotation.
notes: >
  claim_id `concl_repeat_defect` is a PRINTED DEFECT, recorded and never repaired. The Conclusions
  first name the three significantly shifted pairs as He/CH4, He/CO2 and He/H2, and the very next
  sentence lists them as "He/CO2, He/CO2 and He/H2" - He/CO2 twice, He/CH4 dropped. The intended
  reading is fixed by the preceding sentence, and Table 12 confirms He/CH4 belongs in the list
  (its front factor moves 5,002 -> 19,800). It is reported here, and the page shows the arithmetic
  that identifies which pair the repeated name displaced; it is not silently corrected in the quote.
  claim_id `n2ch4_repair` is a repair BY THE AUTHOR of a value in a source he is compiling. The
  repair is stated in prose and is NOT applied to Table 9, which still carries alpha = 1.9
  consistent with the unrepaired 80.2 barrers. This page uses the tabulated value.
status: complete
