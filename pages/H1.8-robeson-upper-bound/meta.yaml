  status: complete

fit_or_test: >
  NEITHER. Robeson's (k, n) are not a fit: p. 391 states the line is "determined empirically
  ('by eye')". So nothing on this page is a goodness-of-fit statement, and the tabulated points
  that lie above the line are not fit residuals; they are what "by eye" amounts to. Three labels
  are used throughout: (a) TRANSCRIPTION, Tables 1-13 as printed; (b) INTERNAL CONSISTENCY, V1
  (Tables 13a/13b from Table 12) and V2 (the printed prior/present pairs of Table 13), which test
  this page's arithmetic and transcription and cannot test Robeson's; (c) INDEPENDENT ESTIMATE,
  V3's covering-line envelope, a different objective on a subset of the data, offered as a
  diagnostic and not as a correction. V2 is a consistency identity, not a second route: its
  residual is the difference of the two corresponding V1 residuals, which the page registers as
  an identity claim. The only second route to the shift is (c), whose scope is the present line
  only; both routes read the prior block from the same restatement and use the same reference
  selectivity. NOTHING on this page is validation against measurement: every number is Robeson's.

caveats:
  - "Only nine of Table 12's thirteen gas pairs support a prior-versus-present comparison. H2/O2 and He/O2 have no present bound; CO2/N2 and N2/CH4 have no prior one. The paper's own Conclusions classify exactly those nine, which the page asserts against the dataset rather than assuming"
  - "The front-factor share of a shift depends on the reference selectivity and has no meaning without one: dlog k is the shift at alpha = 1, where the membrane does not separate. That selectivity lies inside the tabulated range of five of the nine pairs and below every point of the other four, so it is neither outside the data nor representative of it. The two ranges must be kept apart: on the four references Robeson's own Table 13 supplies the share runs 0.5647 to 1.0334; across the nine pairs at this page's reference (the geometric-mean alpha of each pair's own points) it runs 0.59 to 1.39, the maximum being H2/CO2. It is undefined at alpha = 37.47, where the H2/CO2 lines cross"
  - "The reference-free form of Robeson's claim is that the two lines are near-parallel (spread/shift < 0.20), which holds for 6 of the 9 pairs. The three that fail are H2/N2 (0.34), H2/CH4 (0.93) and H2/CO2 (2.05). Only for H2/CO2 does the paper attribute the shift to a slope change ('primarily a slight slope change'); for H2/CH4 and H2/N2 it says only that the shift is modest or very minor"
  - "PRINTED DEFECT, REPORTED NOT REPAIRED: the Conclusions (p. 399) name the significantly shifted pairs as 'He/CH4, He/CO2 and He/H2' and then, in the next sentence, as 'He/CO2, He/CO2 and He/H2' [sic]: He/CO2 twice, He/CH4 dropped. Table 12 confirms He/CH4 belongs"
  - "PRINTED DEFECT, REPORTED NOT REPAIRED: Table 2 prints 'Polypyrrole 6FDA/PMDA (25/75)-TAB' where Tables 1, 5 and 6 print 'Polypyrrolone' for the same material from the same reference [21]; Table 9 prints 'Poly(pyrrolone)(6FDA-TAB)'. Table 12's prior block prints 'He/CO2' without a subscript on the final 2"
  - "PRINTED INCONSISTENCY, REPORTED NOT REPAIRED: p. 392 speaks of 'the one data point above the present upper bound' for O2/N2; Table 1 has 2 above the line Table 12 prints"
  - "ONE ROW OF TABLE 13a IS INTERNALLY INCONSISTENT, REPORTED NOT REPAIRED: O2/N2's transition permeability misses k*alpha^n by -0.612 %, against a worst-case propagated printing band of 0.279 % on the most generous reading of trailing zeros. Backing the printed permeability out needs alpha = 1.4714 where the table prints 1.473. The other rows are inside the generous band (25 of 26 in all, 24 inside the literal one). Changes no conclusion: Table 12's O2/N2 (k, n) are confirmed to -0.027 % by Table 13b"
  - "The author repairs a compiled value in prose and NOT in his table: p. 395 says an N2/CH4 point's CH4 permeability was listed too low, but Table 9 still carries the alpha consistent with the listed value. This page uses the tabulated value"
  - "The 117 points are a COMPILATION citing 44 distinct primary references, none of which was consulted. The page can show a point sits above the line Robeson drew; it cannot show the point is right"
  - "ks in Tables 13a/13b is an INPUT, not a checked quantity: eqs. (4) and (5) need critical and Lennard-Jones temperatures the paper does not print. Had Robeson mis-evaluated eq. (4), V1 and V2 would both still pass"
  - "V3's envelope re-fit is NOT a corrected bound and must not be quoted as one. It optimises a different objective on a subset of Robeson's data and is pinned by extreme points including, for O2/N2, the very point the paper says it distrusts. Its slope disagreement follows the lever arm: the 4 pairs whose points span the fewest decades of selectivity are exactly the 4 with the largest |dn|, as sets and not rank by rank. The pairs spanning more than 1.5 decades all agree to |dn| <= 0.278"
  - "Fig. 12's -1/n versus gas-diameter correlation and Freeman's eq. (2) are OUT OF SCOPE, for a searched reason: the inputs are not printed in this paper. No verdict is offered on either"
  - "H2/O2 and He/O2 appear in the paper ONLY as cells of Table 12 (searched: the full text layer, both the 'H2/O2' and extractor-inserted 'H2 /O2' spellings). No section, no table, no figure, no sentence, and no stated reason for dropping them"

agreement: >
  INTERNAL IDENTITY (V1): Tables 13a/13b reproduce from Table 12's (k, n) with a median absolute
  deviation of 0.017 % over 26 rows; 24 rows sit inside the literal half-unit printing band and 25
  inside a generous four-significant-figure band, the exception being 13a O2/N2 at -0.612 %. The
  (Mj/Mi)^(1/2) column reproduces to 1.5e-4 from integer molecular weights and only to 3.9e-3
  from IUPAC standard weights, which identifies the convention, and the product column to 1.6e-3.
  This certifies the transcription of every present (k, n) and of the prior (k, n) for He/H2 and
  H2/CO2; it certifies nothing about Table 12 itself, nor about the prior (k, n) of the other
  seven pairs.
  CONSISTENCY IDENTITY, NOT A SECOND ROUTE (V2): the ratio of the printed prior and present
  permeabilities at one selectivity agrees with the decomposition to 4.9e-4 decades over four
  comparisons, because its residual is the difference of two V1 residuals (equal below 1e-12
  decades). Its use is the reference-dependence on numbers Robeson printed: the front-factor share
  runs 0.5647 to 1.0334 across those four selectivities.
  THE SECOND ROUTE (V3): a covering line re-estimated from the 117 near-bound points by exact
  active-set enumeration replaces the printed present line. At each pair's geometric-mean
  selectivity the two routes agree on the sign of the shift for 9 of 9 pairs and on its size to
  0.086 decades on the 7 pairs whose points span more than 1.5 decades of selectivity; across
  each pair's own minimum, geometric-mean, median and maximum selectivity the worst residual on
  those pairs reaches 0.543 decades and the sign count falls to 8 of 9. The route reproduces the
  ranking of Result 3 (3 of 3) at 5 of the 7 evaluation points the primary route is held to, and
  2 of 3 at the others, against 3 of 3 at every one of them for the primary route. It does not reproduce
  the front-factor share (median 0.43 against 0.98, range -0.03 to 1.55).
  HEADLINE RESULTS: on the nine comparable pairs the front-factor share at each pair's own
  geometric-mean selectivity has median 0.98 (range 0.59 to 1.39) and the two lines are
  near-parallel for 6 of 9; the paper's three "significant" pairs are reproduced by the
  selectivity gain at fixed permeability (3 of 3, with a third-to-fourth gap of 0.011 to 0.111
  decades across the evaluation points) and by neither dlog k nor the permeability gain at fixed
  selectivity (2 of 3 each); H2/CO2's two bounds cross at alpha = 37.47, inside its own tabulated
  range, and at the largest tabulated alpha (100.9) the 2008 bound sits 30.4 % below the 1994
  one; the "inside its own range" verdict rests on 1 tabulated point, which a break row removes;
  and 19 of the 117 tabulated "close to the upper bound" points lie above the bound they are
  tabulated against, r up to 3.49, geometric mean 0.478.
  Every number is a registered claim (agreement.json, format 2), and a break table of
  single-cell and single-row transcription errors in Tables 12, 1-11 and 13, sign and log
  conventions and two algebra slips recomputes every claim; each claim fails at least one row.

