structures_note: >
  DELIBERATELY EMPTY, and the page says so in its "PyMRM implementation" section. The Robeson
  upper bound is a two-parameter algebraic relation between two scalars: no spatial or time
  coordinate, no conservation law, no boundary condition, no unknown field. None of S1-S13 in
  docs/taxonomy.md describes it, and no pymrm operator acts on it. `pymrm_api` is empty for the
  same reason. The page uses numpy for the algebra, scipy.optimize.brentq for thresholds (which
  are root-found, never swept), and an exact active-set enumeration for one envelope estimator;
  the reusable functions (P_bound, alpha_bound, excursion, envelope_fit) are in model.py.

