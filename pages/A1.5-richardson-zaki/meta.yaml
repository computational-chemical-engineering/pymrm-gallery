adds: >
  Nothing to the correlation. Equations (33)-(42) are algebra; sections 1 to 5 of
  the page would run with pymrm uninstalled, and the page says so in the pymrm
  section rather than manufacturing a solve. What the reimplementation adds is
  five things.

  THE TABLES, MACHINE-READABLE, WITH THE TRANSCRIPTION CERTIFIED. Richardson and
  Zaki is cited thousands of times a year and what is cited is one line of it.
  The 66 measured exponents, the 18 n0 values and the two intercept columns have
  not been available in any usable form; they are now four CSVs, and four
  identities the paper itself prints say how far they can be trusted - including
  the five places the printing is wrong.

  THE CORRELATION COSTED AGAINST A NULL MODEL, WINDOW BY WINDOW. The whole-table
  1.2 % is not the useful number. Eq. (38) beats a constant by a factor of seven
  and a half on 23 rows; eq. (33) beats it modestly; eq. (34) IS a constant; and
  eq. (37) is not distinguishable from a constant IN EITHER DIRECTION on the five
  rows in its window - the 0.021-point gap reverses if the two rows of disputed
  branch are re-placed, under 2 of 5 leave-one-outs, and if the in-sample null is
  charged for the parameter it fits. That last statement is not in the paper and
  it is what a reader needs before trusting the 0.2 < Re < 1 branch.

  THE TWO WALL LAWS DECIDED ON THE AUTHORS' OWN NUMBERS, ON THE ROWS THAT COULD
  HAVE DECIDED OTHERWISE. Fitting the single coefficient alpha separately to the
  sedimentation and fluidisation tables gives intervals that exclude each other
  and that pick, in each case, the equation the authors applied there. This is
  the page's strongest result and its limits are stated: Table II's intercept
  column reproduces its own log10 V_0 column on all 15 rows, so 14 of the 36
  sedimentation rows carry an identically zero residual and cannot detect a wall
  effect of any size - the sedimentation fit is quoted on Table I alone, at an
  interval 4.0x wider than the pooled one and with the same verdict. The
  fluidisation number is a refit of the data Fig. 21 was drawn from; the
  sedimentation number is not; the paired form that would remove V_0 altogether
  can only resolve 6 of 10 pairs; and on the d/D range the two data sets share
  the fluidisation interval EXCLUDES eq. (41)'s coefficient of 1, with alpha
  falling from +2.16 below d/D = 0.05 to +1.03 above it. The two-law verdict
  stands; the coefficient 1 does not hold across its own range.

  THREE ARITHMETIC FINDINGS, ALL SMALL AND ALL WORTH KNOWING. The 17.5 and 18 are
  17.4 and 17.8 rounded up, from the division displayed on the line above them.
  The mean of Table VII is 0.2457, not the 0.25 the text quotes. And the branch
  boundary at Re = 200 is discontinuous by up to 14 % in n because eq. (39) drops
  the wall term - which anyone sweeping Re through 200 in a solver will meet, and
  which is invisible at d/D = 0 where the correlation is usually plotted.

  THE FLUX FUNCTION INTEGRATED, WITH THE HONEST ACCOUNTING OF WHAT THAT SHOWS.
  F(phi) = phi V_0 (1-phi)^n is what the correlation becomes downstream, in every
  thickener and batch-settling model. The pymrm solve converges at order 1 and
  its global solids balance is exactly zero - and the break table shows that the
  balance is exactly zero for a wrong n, a wrong V_0, an unstable step and a
  16-fold-too-coarse grid as well. The solve tests the integration, not the
  physics, and the page states that rather than banking the 1e-16.

agreement: >
  Data tier 2 - printed tables of the authors' own measurements - BUT THE PAGE IS
  NOT EXPERIMENTALLY VALIDATED and does not claim to be. Eqs. (33)-(39) were
  fitted to the very slopes they are compared against, so the 1.20 % mean over 58
  rows is a fit residual. There is no hold-out set in this paper: the only rows
  the authors exclude, the two oils at high d/D, are excluded for a reason that
  is perfectly confounded with the correlation's own stated d/D limit.

  The numbers that can fail and do not: the wall coefficient alpha, fitted
  separately on the two halves of the data, comes out -0.235 [-1.776, +0.170] on
  the 22 Table I rows and +1.095 [+0.830, +1.508] on the 29 fluidisation rows,
  each excluding the other law; Tables VI and VII close to 0.635 % worst on 11
  rows; Table VIII's n equals the 2.44 in. slope exactly on all seven rows.

  The numbers that LOOK like they can fail and cannot, all labelled on the page:
  the 14 Table II rows inside the sedimentation alpha (their residual is
  identically zero, so they are excluded from the headline fit); eq. (39) meeting
  eq. (34) at Re = 500 to -0.015 % (the two share Table VI's last row, so this is
  a transcription check); the eq. (37)-vs-null comparison on five rows (it
  reverses under all three sensitivities the page prints); and the solids balance
  in the pymrm section.

  The numbers that can fail and do: three of the four transcription identities
  locate printed errors, on five named cells; K recomputed from the paper's own
  printed d_s, d_p and definition misses on 4 of 7 rows, worst -45.6 %; and
  Stokes' law, which reproduces Table I to 0.67 %, over-predicts Table II by 19 to
  66 % on its settling rows and returns the WRONG SIGN on the three rows where the
  particles rise - which is what a table headed Re > 0.2 should do.

  The pymrm numbers are discretisation numbers: L1 order 1.000, 2.27e-4 at
  nx = 400, and a solids balance of exactly zero that the break table shows to be
  blind to almost everything.

caveats: >
  THE DOCUMENT ON DISK IS THE 1997 JUBILEE SUPPLEMENT REPRINT, NOT THE 1954
  PRINTING. It is verbatim - every page's running footer reads "TRANS. INSTN
  CHEM. ENGRS, Vol. 32, 1954" - but it renumbers the paper S82-S100 and THE
  ORIGINAL PAGE NUMBERS 35-53 ARE NOWHERE PRINTED ON IT. Nineteen consecutive
  pages is consistent with 35-53; the page does not assert that range as read.
  Every page reference on the page and in the sidecars is a reprint page, marked
  as such. The two cite_data() lines in the notebook print the data sidecar's
  source.container, which carries the catalogue's "32, 35-53"; each is printed
  with a flag underneath saying that the range is inherited and not verified, so
  no output of this page asserts a page range it did not read.

  HALF THE SEDIMENTATION WALL DATA CANNOT FAIL. Table II's intercept column
  reproduces its own log10 V_0 column on all 15 rows (residual 0.0000 or 0.0004
  decades, across two and three tube diameters per group). Whether the authors
  tabulated the calculated V_0 as the intercept - reprint page S95 says "the
  intercepts ... agree with those calculated for the terminal falling velocity
  ... so that V_i = V_0" - or the agreement really was that exact cannot be told
  from the document. Either way those rows carry no information about a wall
  effect, so the headline sedimentation fit is Table I only and the pooled fit is
  printed beside it. The same question does not arise for Tables III and IV,
  whose intercepts differ from log10 V_0 by up to 0.147 decades.

  The correlation is a fit to the tables it is tested against, and Fig. 18 - from
  which eqs. (35)-(39) come - also carries Steinour's sedimentation slopes and
  Lewis, Gilliland and Bauer's fluidisation slopes. Neither of those papers is on
  disk or was consulted, and nothing on the page separates their contribution
  from the authors' own, because the paper does not.

  The authors' explanation for their own excluded rows CANNOT BE TESTED on this
  data set. Inside the eq. (38) window every one of the four rows above the
  stated d/D limit of 4e-2 is an oil row, and there are no non-oil rows there at
  all, so "the oil flocculated the spheres" and "the correlation was never
  claimed above d/D = 0.04" predict the same four failures. The paper asserts the
  first; the page reports that the tables support neither over the other.

  The page says nothing about eps outside roughly 0.42 to 0.96. Eq. (28) is a
  straight line in log-log over whatever range each run covered, and the tables
  record only its slope and intercept. The extreme printed abscissa ticks read on
  any of those figures are log eps = -0.38 and -0.02 (Fig. 12) - PRINTED AXIS
  LABELS, NOT DIGITISED COORDINATES. Everything the pymrm section does below that
  voidage, which is the whole basal sediment, is outside the correlation's
  measured range and is labelled so.

  TABLE V'S d_s COLUMN IS ILLEGIBLE at 600 dpi in this scan - the only column of
  the paper that is. No result on the page depends on it. That is why the K
  finding is stated as "eq. (42)'s abscissa cannot be reconstructed for those
  points" rather than as "the printed K is wrong". The recorded d_s values are
  the best visual reading and each is corroborated by the printed Re column and
  by the nominal dimensions in inches; both corroborations are in the sidecar.

  The wall verdict is about alpha, not about the mechanism. That the difference
  is "a velocity gradient created in the liquid because of the drag exerted by
  the walls" is the authors' explanation and nothing in the tables tests it.

  Three quantities used are not printed in the paper: water at 20 C (mu = 1 cP,
  rho = 1), used only to re-check Table III's Re column; the two column diameters
  in cm, fixed to 0.3 % by the printed d/D column; and g = 981 cm/s2, used only
  for the Stokes check. None enters a result.

  The batch-settling balance is NOT Richardson and Zaki's. They write no
  conservation law, measure only the constant rate of fall of the sludge line,
  and never model what happens when the settled bed grows up to meet the
  interface. The balance is derived on the page from a solids volume balance; the
  kinematic-wave treatment of batch sedimentation is standard and older than this
  paper, and no source is cited for it because none was consulted. What is theirs
  is F(phi).

  Nothing is digitised. No figure point was read, and the only figure-derived
  quantities anywhere on the page are printed axis tick labels, quoted as printed
  text. The PDF text layer of this pre-1980 scan renders eq. (1) as "F = 317 pVd"
  and was not used for any number; every value was read visually off 600 dpi
  renders, and every exponent whose glyph was not decisive was settled from
  printed arithmetic in the same row, not by inference.
