  liquid: "as printed"
  mu_cP: "liquid viscosity, centipoise, as printed"
  rho_g_cm3: "liquid density, g/cm3, as printed"
  V0_cm_s: "terminal falling velocity column, cm/s. TABLE I: computed from Stokes' law by the authors. TABLE II: source not stated."
  Re_printed: "the Re = V0 d rho / mu column as printed"
  log10_V0_printed: "the Log10 V0 column as printed"
  D_cm: "tube diameter, cm, as printed"
  d_over_D_printed: "the d/D column AS PRINTED (see anomalies 1 and 2)"
  intercept_log10_Vc_at_eps1: "the 'Intercept at eps = 1' column, i.e. log10 V_i"
  slope_n: "the 'Slope' column: THE MEASURED EXPONENT n. This is the measurement."
  exponent_resolved: "1 if any exponent in this group was settled from a row identity rather than read off the glyph"
  flag: "semicolon-separated anomaly tags, see acquisition.procedure"

not_printed_and_supplied_here: >
  Nothing. Every value in this file is a printed cell of Table I or Table II.
  g = 981 cm/s2, used on the page for the Stokes check, is NOT in this file and is
  not printed in the paper either.
