conditions: >
  THESE ARE NOT MEASUREMENTS. They are quantities the authors read off their own
  Fig. 18 (n against d/D, one curve per Reynolds number, reprint page S93). Fig.
  18 was built from the measured slopes of Tables I-V TOGETHER WITH the results of
  Steinour (sedimentation) and Lewis, Gilliland and Bauer (fluidisation), which
  are separate publications not on disk and not consulted. The paper says so on
  reprint page S94.

  So each row of Table VI is a curve intercept at d/D = 0, and each row of
  Table VII is that curve's slope and the d/D at which it would reach n = 0. Both
  columns of Table VII are stated to be graphical: "The slopes of the curves in
  Fig. 18 were measured and the intercepts at n = 0 were calculated".

  ANY PAGE USING THESE MUST CALL THEM FIGURE-DERIVED, NOT MEASURED. They are used
  on the gallery page for two things only: the exact transformation
  n0 = slope x |(d/D)_(n->0)| that relates the two tables, and the fit residual of
  eqs. (35) and (36) against the n0 column.

  THE MINUS SIGN IN THE THIRD COLUMN IS THE PAPER'S. The column head is printed
  "-(d/D)_(n -> 0)", so the tabulated 2.36e-1 means (d/D)_(n=0) = -0.236. The
  text confirms it: "(d/D)_(n=0) is approximately constant, with a mean value of
  -0.25". The column is stored here under the printed name
  minus_dD_at_n0_printed, i.e. as the POSITIVE numbers printed.

acquisition:
  method: table
  figure: "TABLE VI and TABLE VII, reprint page S94"
  tool: "poppler pdftoppm at 600 dpi, read visually"
  procedure: >
    Read character by character off 600 dpi renders; the PDF text layer was not
    used. These two tables render more cleanly than any others in the paper.

    THE TRANSCRIPTION IS FULLY CERTIFIED BY THE TABLE'S OWN LOG COLUMNS. Table VI
    prints "log Re" and "log n0" beside "Re" and "n0". On all 18 rows the printed
    log Re reproduces log10(printed Re) and the printed log n0 reproduces
    log10(printed n0) to better than 0.001. That is a pure transcription identity
    - it tests nothing physical - but it means every digit of all four Table VI
    columns has an independent witness.

    Table VII has no such internal witness. Its transcription is checked on the
    page instead against Table VI, through n0 = slope x |(d/D)_(n->0)|, which
    closes to better than 0.64 % on all 11 rows that both tables share (the
    Re = 0.2 row is checked against eq. (33)'s own intercept of 4.65 instead,
    since Table VI has no Re = 0.2 entry).

    THE TWO TABLES DO NOT LIST THE SAME REYNOLDS NUMBERS. Table VI has 18 rows
    from Re = 0.39 to 489; Table VII has 12 rows from Re = 0.2 to 489. They are
    merged here on Re, with blanks where one table has no such row. Table VII's
    Re = 489 row prints a slope of 0.0 and NO value in the third column, which is
    consistent - a line of zero slope never reaches n = 0 - and is left blank.

    No anomaly was found in either table.

