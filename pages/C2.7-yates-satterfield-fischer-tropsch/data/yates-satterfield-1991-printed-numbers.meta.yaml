dataset_id: yates-satterfield-1991-printed-numbers
title: Printed numbers of Yates and Satterfield (1991), Tables II to V, footnotes and text
status: complete

source:
  authors: ["Yates, I. C.", "Satterfield, C. N."]
  year: 1991
  container: "Energy & Fuels 5(1) 168-173"
  doi: 10.1021/ef00025a029
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

conditions:
  catalyst: "Co/MgO on SiO2, 21.4 wt % Co, 3.9 wt % Mg, 52-92 um, in a 1 L stirred slurry reactor (CSTR)"
  rate_basis: "rate of H2 + CO consumption per gram of unreduced catalyst (p. 168; Table II footnote a)"

provenance_tier:
  tier: 3
  note: >
    Printed table entries and stated numbers, copied as strings (load with dtype=str) so
    that the page can count half-units of the last printed digit. Each was read from the
    300 dpi page image, not from the text layer, which garbles formulas and table columns.

acquisition:
  method: transcribed
  figure: "Tables II (p. 170), III, IV and V with footnotes (p. 171); text pp. 168, 170 and 172"
  tool: "poppler pdftoppm at 300 dpi (native scan resolution), read by eye"
  operator: "Claude Opus 5.5 (assisted), reviewed by the gallery maintainers"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision (each entry is the printed string)"

columns:
  - {name: item, unit: "-", description: "name of the printed entry"}
  - {name: printed, unit: "-", description: "the entry as printed (string)"}
  - {name: unit, unit: "-", description: "unit as printed"}
  - {name: page, unit: "-", description: "journal page (PDF page = journal page - 167)"}
  - {name: source, unit: "-", description: "table, footnote or text"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). The original figure and
  table images are NOT reproduced.
