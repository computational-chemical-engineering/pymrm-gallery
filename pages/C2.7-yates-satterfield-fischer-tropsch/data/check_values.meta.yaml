dataset_id: check-values
title: "Independent check values for the page's functions at one test condition"
status: complete

source:
  authors: ["Yates, I. C.", "Satterfield, C. N."]
  year: 1991
  container: "Energy & Fuels 5, 168-173"
  doi: "10.1021/ef00025a029"
  access: >
    The equations are those of the paper (rate law eq. 16 with the Table V parameters, the Table IV
    statistics, the Table II repeat conditions and the slurry CSTR of the experimental section), with
    the readings and misprints stated in the build plan's equations file. The values are not read
    from the paper but computed from its equations and printed numbers by a second route; the
    half-unit and allowance rows compare those values with the paper's printed constants.
  licence: "computed values (no text, figure or page image reproduced)"

acquisition:
  method: computed by a second route, not by the page
  resolution: "12 significant digits (rounding up to 5e-12 relative); each row's rtol (1e-11 or looser) is the agreement the page must reach"
  operator: "Claude Opus 5.5 (assisted): plan agent's script c27_check_values.py (numpy and scipy, no pymrm, no page code; E_app roots cross-checked by brentq, CSTR closed forms by fsolve on the species balances, PFR closed form by DOP853 and quadrature), 2026-11-27"
  date: 2026-11-27
  estimated_error: "none beyond floating point for the closed-form and arithmetic rows; rows at rtol 1e-10 to 1e-7 carry the route's own error (root finding, critical t quantiles)"

conditions: >
  Test condition T: Table V at 240 C (513.15 K) and 220 C (493.15 K); state S = Table II row 1,
  P_H2 0.48 MPa, P_CO 0.25 MPa; R = 8.314462618 J/(mol K). Reactor: Table II feed 0.067 L(STP)/(min g),
  STP 273.15 K and 101.325 kPa (rows named _25C at 298.15 K), H2/CO 2, P 0.79 MPa, usage ratio 2, W = 1 g.

columns:
  - {name: name, unit: "-", description: "quantity; units as defined in the equations file"}
  - {name: value, unit: "-", description: "value computed by the second route"}
  - {name: rtol, unit: "-", description: "relative tolerance the page must meet"}
