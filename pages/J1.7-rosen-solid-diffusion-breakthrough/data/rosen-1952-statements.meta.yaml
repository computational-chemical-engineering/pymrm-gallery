dataset_id: rosen-1952-statements
title: "Statements of the paper that the page tests or quotes"
status: complete

source:
  authors: ["Rosen, J. B."]
  year: 1952
  container: "Journal of Chemical Physics 20(3) 387-394"
  doi: 10.1063/1.1700431
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/). No PDF and
    no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: "220 ppi renders of the page images; quotes copied from the image, not from the text layer"
  estimated_error: "none beyond the printed precision"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-24

conditions: >
  Short quotes only, with journal page and PDF page (journal page = PDF page + 385).
  numbers holds the values the page tests, as key=value pairs.

columns:
  - {name: id, unit: "-", description: "key used by the page"}
  - {name: journal_page, unit: "-", description: "journal page"}
  - {name: pdf_page, unit: "-", description: "page of the PDF"}
  - {name: quote, unit: "-", description: "short exact quote"}
  - {name: numbers, unit: "-", description: "numbers in the statement, key=value; semicolon separated"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image is reproduced.
