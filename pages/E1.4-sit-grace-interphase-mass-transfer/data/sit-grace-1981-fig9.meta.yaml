dataset_id: sit-grace-1981-fig9
title: "Figure 9: tracer concentration against time, front and back bubble of a vertical pair and a single bubble"
status: complete

source:
  authors: ["Sit, S. P.", "Grace, J. R."]
  year: 1981
  title: "Effect of bubble interaction on interphase mass transfer in gas fluidized beds"
  container: "Chemical Engineering Science 36, 327-335"
  doi: 10.1016/0009-2509(81)85012-9
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    institutional access (TU Eindhoven). A 300 ppi scan whose OCR text layer is usable for
    prose only: it drops every displayed equation and garbles table cells and numbers.
    No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Figure 9, journal page 332 (PDF page 6)"
  tool: "pdftoppm at 300 dpi (the native scan resolution); each curve traced column by column through the dark runs, following a linear prediction from the last six traced columns (curves assigned by continuity, never by the nearest dark pixel); a run wider than 12 px (text) is skipped"
  procedure: >
    Linear axes. Concentration: the bottom axis (row 1685.5) is 0 and the top frame (row
    1241.5) is 2.0 vol %, 222 px per vol %; the left-axis ticks at 1.8, 1.6 and 1.0 vol %
    sit 1.5 to 2.2 px below that line. Time: ticks at 0, 0.5, 1.0 and 1.5 s in columns
    1177.5, 1430, 1684.5 and 1939.5, 508 px/s. A value is the centre of the dark run of
    the traced curve in the column of the stated time. The back curve crosses the single
    curve near 0.56 s and the leader of its own label near 0.97 s; the single curve is
    traced from its right end for 0.6 s onward, the back curve from 1.12 s leftward for
    1.1 s, and each joining trace meets the other at 0.92 and 0.95 s to the pixel. At
    1.1 s the front and back curves are 6 px apart and 1 px wide; both are read. The
    back curve begins at about 0.5 s; its first column is stored.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    About 0.015 vol % in concentration (line 4 to 5 px wide where it is thickest, 1 px
    at the tails, and the 2 px offset of the left-axis ticks), and 0.002 s in time. On
    the steep part of the back curve near 0.6 s a time error of 0.002 s adds about
    0.01 vol %.

conditions: >
  390 um glass ballotini, two-dimensional column 9 mm thick, vertically aligned pairs
  and a single bubble in the same particles; ozone tracer. The text says Table 1's
  concentrations are "averaged values taken from Fig. 9" (p. 330).

missing:
  - "back curve before about 0.5 s: not drawn"

columns:
  - {name: curve, unit: "-", description: "front, back or single"}
  - {name: time_s, unit: s, description: "time"}
  - {name: C_vol_pct, unit: "vol %", description: "tracer concentration"}
  - {name: px_col, unit: px, description: "column at 300 dpi"}
  - {name: px_row, unit: px, description: "centre row of the curve's dark run"}
  - {name: line_px, unit: px, description: "height of that run in pixels"}
  - {name: note, unit: "-", description: "reading note"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
