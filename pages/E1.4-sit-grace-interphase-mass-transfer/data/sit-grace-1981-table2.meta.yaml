dataset_id: sit-grace-1981-table2
title: "Table 2: summary of interphase transfer results for interacting bubbles, as printed"
status: complete

source:
  authors: ["Sit, S. P.", "Grace, J. R."]
  year: 1981
  title: "Effect of bubble interaction on interphase mass transfer in gas fluidized beds"
  container: "Chemical Engineering Science 36, 327-335"
  doi: 10.1016/0009-2509(81)85012-9
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    institutional access (TU Eindhoven). A 300 ppi scan whose OCR text layer is usable for
    prose only: it drops every displayed equation and garbles table cells and numbers.
    No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: table
  figure: "Table 2, journal page 333 (PDF page 7)"
  resolution: "read from 300 dpi crops of the page image; OCR unusable"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision; every cell kept as printed (load with dtype=str): ranges such as 12-15 and 3-8, and the word small"

conditions: >
  "Overall % Inc. over Single Bubble" is not defined in the paper and the rows are
  different measures (pairs over 0.8 s, injected streams, a 3-d probe). The text gives
  Pereira's value as "5-8%" (p. 332) against the table's "3-8", and describes the
  Sit and Grace 90 um row as "less than for the larger particles used in the present
  work" (p. 333).

missing:
  - "eps_mf and U_B for every row: not printed"

columns:
  - {name: authors, unit: "-", description: "as printed"}
  - {name: ref, unit: "-", description: "reference number of the paper"}
  - {name: dp_um, unit: um, description: "mean particle diameter"}
  - {name: umf_cm_s, unit: cm/s, description: "minimum fluidization velocity"}
  - {name: DG_cm2_s, unit: cm2/s, description: "molecular diffusivity of the tracer"}
