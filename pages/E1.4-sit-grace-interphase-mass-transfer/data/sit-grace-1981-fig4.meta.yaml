dataset_id: sit-grace-1981-fig4
title: "Figure 4: nose height of the front bubble against time, approach period, oblique pair"
status: complete

source:
  authors: ["Sit, S. P.", "Grace, J. R."]
  year: 1981
  title: "Effect of bubble interaction on interphase mass transfer in gas fluidized beds"
  container: "Chemical Engineering Science 36, 327-335"
  doi: 10.1016/0009-2509(81)85012-9
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    institutional access (TU Eindhoven). A 300 ppi scan whose OCR text layer is usable for
    prose only: it drops every displayed equation and garbles table cells and numbers.
    No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Figure 4, journal page 329 (PDF page 3)"
  tool: "pdftoppm at 300 dpi (the native scan resolution); marker centres from the centroid of the marker's closed interior (sub-pixel) or, where the dashed line or a label leader opens the interior, from the peak of the normalised cross-correlation with a clean marker as template (integer pixel); every marker checked by eye"
  procedure: >
    Linear axes, calibrated by least squares on every tick of both axes in page pixels:
    time ticks every 0.1 s from 0 (the left frame, column 1228) to 1.3 s (column 1883),
    503.8 px/s, largest residual 1.8 ms; height ticks every 10 cm from 0 (the bottom
    frame, row 814) to 130 cm (the top frame, row 234.5), 4.463 px/cm, largest residual
    0.27 cm. The axis labels are irregular (0, 20, 50, 70, 100, 120 cm and 0, 0.2, 0.5,
    0.7, 1.0, 1.2 s); the ticks are regular. Only the front-bubble markers of the
    approach period are read: the dashed line drawn through them ends before the line
    that opens the encroachment period E. The first marker sits on the left frame and
    the marker at 0.73 s on the E line; both are stored and flagged, and not used in
    the slope.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    About 1 px in each direction for a hole centroid and for a template peak, 0.002 s
    and 0.25 cm, plus the calibration residuals above. The slope of a line through the
    eight fitted markers carries a standard error from their scatter, which the page
    prints.

conditions: >
  390 um glass ballotini, two-dimensional column 9 mm thick, a pair in OBLIQUE
  alignment (the caption). Time from completion of formation of the front bubble.
  The paper points to Fig. 4 for the front bubble's "relatively constant" velocity in
  the approach period (p. 330); the page uses the slope as U_B of the 390 um bubbles.

missing:
  - "rear-bubble markers and the markers after the approach period: not read (not used)"

columns:
  - {name: time_s, unit: s, description: "time from the pixel column through the calibration"}
  - {name: height_cm, unit: cm, description: "nose height from the pixel row through the calibration"}
  - {name: px_col, unit: px, description: "marker centre column at 300 dpi"}
  - {name: px_row, unit: px, description: "marker centre row at 300 dpi"}
  - {name: in_fit, unit: "-", description: "1 when used in the slope, 0 otherwise"}
  - {name: note, unit: "-", description: "how the centre was found"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
