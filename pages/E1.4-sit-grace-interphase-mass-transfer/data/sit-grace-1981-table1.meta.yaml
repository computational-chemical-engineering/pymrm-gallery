title: "Table 1: tracer accounting for a pair of bubbles in vertical alignment, as printed"
status: complete

source:
  authors: ["Sit, S. P.", "Grace, J. R."]
  year: 1981
  title: "Effect of bubble interaction on interphase mass transfer in gas fluidized beds"
  container: "Chemical Engineering Science 36, 327-335"
  doi: 10.1016/0009-2509(81)85012-9
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    institutional access (TU Eindhoven). A 300 ppi scan whose OCR text layer is usable for
    prose only: it drops every displayed equation and garbles table cells and numbers.
    No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: table
  figure: "Table 1, journal page 332 (PDF page 6)"
  resolution: "read from 300 dpi crops of the page image; OCR unusable"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision; every cell kept as printed (load with dtype=str)"

conditions: >
  390 um glass ballotini, two-dimensional column 9 mm thick, ozone tracer. Time from
  completion of formation of the front bubble. The text (p. 330) says the volumes are
  averaged measured values and "the concentration values are averaged values taken
  from Fig. 9". The cumulative columns are printed once per time, on the rear (or
  resultant) row; they are stored there. Two V_B C_B cells (0.6 s rear, 1.1 s) disagree
  with V_B x C_B by more than their rounding; they are kept as printed. The 1.1 s
  volume is printed "620" with a stray mark after it.

missing: []

