dataset_id: oh-cavendish-1982-results
title: Published results for the step decrease in feed temperature (case 2)
status: complete

source:
  authors:
    - "Oh, S. H."
    - "Cavendish, J. C."
  year: 1982
  container: "Industrial & Engineering Chemistry Product Research and Development 21(1) 29-37"
  doi: 10.1021/i300005a006
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

provenance_tier:
  tier: 6
  note: >
    THESE ARE NOT MEASUREMENTS. Every value is the authors' own computed
    result, obtained with a Galerkin discretisation in space (81 grid points,
    piecewise linear basis) and the GEAR stiff integrator in time. The paper
    contains no experimental data of any kind: the two experimental references
    it makes - Hegedus (1975) for the steady-state overshoot above adiabatic,
    and Mondt (1981) for the absence of melting during deceleration - are
    qualitative comparisons to other people's work, with no numbers to compare
    against. This page is therefore validated against a published reference
    solution, in the same sense as B1.1, D2.2 and F3.1, and must not be
    described as validated against experiment.

acquisition:
  method: table
  figure: "Table III (journal page 37); in-text values on journal pages 33, 34 and 36"
  tool: "poppler pdftoppm at 600 dpi"
  procedure: >
    Table III read from the render. The in-text values were located in the text
    layer, then each confirmed on the render, because the text layer renders
    T_s,max as "8-" in the sentence that states 991 K.
  operator: "Claude Opus 5 (assisted), reviewed by the gallery maintainers"
  date: 2026-07-30
  estimated_error: >
    The paper prints T_s,max to the nearest kelvin and x_max/L to four decimal
    places. The x_max/L values are exact multiples of 1/80 (0.6625 = 53/80,
    0.6750 = 54/80, 0.7625 = 61/80), which is consistent with the stated 81
    grid points and means the location is quantised to one cell, i.e. 0.0125 L.
    Do not read a precision into it that the grid cannot carry.

completeness:
  note: >
    Every number the paper prints for case 2 at the standard conditions. Its
    other case-2 results (Figures 13-19) are parametric curves, not numbers,
    and would need digitising; they are not here. Case 1 (the lightoff case)
    contributes no numerical result at all - the paper reports it entirely as
    figures - so the lightoff time on the page is a prediction of the
    reimplementation, not a comparison. That asymmetry is stated on the page.

columns:
  - {name: quantity,  unit: "-",    description: "what the number is"}
  - {name: condition, unit: "-",    description: "the run it belongs to"}
  - {name: value,     unit: varies, description: "value as printed"}
  - {name: unit,      unit: "-",    description: "unit"}
  - {name: source,    unit: "-",    description: "where in the paper it appears"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3), which cannot be overridden
  by contract. No page image is reproduced.
