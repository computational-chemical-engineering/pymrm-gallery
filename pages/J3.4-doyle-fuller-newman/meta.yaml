validation:
  - Eq. 16 (open-circuit potential, read from a page image) against the paper's own plotted dashed curve, 237 digitised points
  - Eq. 26 and Eq. 27 recomputed against the S_c and S_s values the paper prints, which independently confirm D_s and the salt diffusivity
  - the conductivity recovered twice, from Eq. 28 and from Eq. 29, and both checked against the paper's stated sigma/kappa = O(1e5)
  - exact conservation of total salt, which the flux form of the salt balance makes a property of the discretisation
  - grid independence over a 4x refinement
  - the short-time concentration rise at the anode against the semi-infinite analytical solution and against the paper's Figure 4
  - the long-time pore-wall flux against the charge-balance value and the paper's Figure 5
  - the utilisation at the 1.7 V cutoff against the 84 % the paper states
  - the porosity optimisation the paper reports as a single sentence

adds: >
  The paper never prints the conductivity of its own electrolyte: Appendix A
  says the PEO-LiCF3SO3 conductivity "was fit to a third-order polynomial" and
  gives no coefficients and no figure. The page recovers a value by inverting
  the paper's own Eqs. 28 and 29 - two independent routes that agree to 19 % and
  both reproduce its stated sigma/kappa = O(1e5). It also confronts two
  ambiguities in the printed model with the paper's own results: the Bruggeman
  exponent in the cathode salt flux, where eps^1.5 is decisively ruled out
  because it drives the electrolyte to zero before half of the discharge,
  contradicting their Figure 3; and the factor nu = 2 missing from Eq. 5's
  concentration term, which thermodynamics requires for a 1:1 salt but which
  Figure 2 cannot decide either way - the page shows both and says so. Finally
  it sweeps the porosity optimisation that the paper reports as one sentence: it
  finds the same optimum, 0.60, and shows that the penalty for being below the
  optimum is far steeper than for being above it. No new physics: the model is
  theirs, unchanged.

agreement: >
  Eq. 16 reproduces the paper's own open-circuit curve to 3.3 mV mean absolute
  deviation over 237 digitised points, against a digitisation accurate to about
  3 mV. The four discharge curves are reproduced to a pooled mean absolute
  deviation of 25.5 mV on a 3 V scale with nothing fitted (16.8, 24.1, 25.9 and
  34.0 mV at I = 5, 10, 13 and 20 A/m2, over 884 points), and every
  transport-limited 1.9 V crossing arrives short by 0.023 in utilisation, the
  same sign at all four currents. The 1.7 V cutoff utilisation at I = 10 comes
  out at 0.831, between the 0.821 the digitised curve gives and the 0.84 the
  paper states. The porosity optimum is found at 0.60, exactly where the paper
  puts it, at 0.928 utilisation against their 0.97. Salt is conserved to 3e-16
  and the cell potential moves by 0.14 mV over a fourfold grid refinement.

caveats: >
  Provenance tier 6. Figure 2 contains no experimental data at all - every curve
  on it is the authors' own simulation - so this page is validated against a
  published reference solution in the sense of D2.2 and must NOT be described as
  validated against experiment.

  The electrolyte conductivity is a reconstruction, not a reading: a single
  constant recovered from the paper's own dimensionless groups, whose two routes
  differ by 19 %. It therefore carries no concentration dependence, which the
  paper is explicit about mattering. The consequence is a model that is
  uniformly slightly too polarised - the discharge bias is -23.8 mV against a
  25.5 mV mean absolute deviation, so nearly all the deviation IS the bias - and
  the charge curve is over-polarised by 64 mV in the opposite direction. A
  deviation that follows the sign of the current is the signature of a series
  resistance, not of the kinetics or the open-circuit potential.

  The factor nu = 2 in Eq. 5 is settled by thermodynamics and NOT by Figure 2:
  the printed form gives a smaller mean deviation (18.2 mV) and the corrected
  one better transport limits, and the two bracket the published curves. The
  page prints both rather than choosing by fit.

  The 1.9 V and 1.7 V crossings are used as endpoint markers instead of "where
  the curve stops", because where a curve stops is a solver property and is not
  deterministic across machines.
