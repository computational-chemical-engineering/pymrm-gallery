# Ranked by what each check can catch; every non-structural claim has a break row.
validation:
  - >-
    the short-time salt rise at the lithium face against the semi-infinite solution
    c(0,t) - c_0 = 2J sqrt(t / pi D), with no conductivity in it and nothing fitted:
    mean deviation 0.83 <!-- claim: short_time_face_dev_mean --> mol/m3 with the face
    value read under the boundary condition; a control with t0+ held constant, where
    the solution is exact, agrees to below 0.2 <!-- claim: short_time_control_dev_max_10s -->
    mol/m3 up to 10 s, so what remains is the concentration dependence of t0+. It
    catches the migration sign and the transference factor
  - >-
    the four digitised Figure 2 discharge curves, pooled mean absolute deviation
    25.5 <!-- claim: discharge_pooled_mad_mV --> mV, and the charge curve,
    65.1 <!-- claim: mad_charge_mV --> mV
  - >-
    Eq. 16 (open-circuit potential, read from a page image) against the paper's own
    plotted dashed curve, 3.25 <!-- claim: ocp_eq16_mad_mV --> mV mean absolute deviation
  - >-
    Eq. 26 and Eq. 27 recomputed against the S_c and S_s values the paper prints, and
    the conductivity recovered twice, from Eq. 28 and from Eq. 29, both at the order
    of sigma/kappa the paper states
  - >-
    refinement in space and in time on separate nested ladders: the cell potential at
    u = 0.5 converges at second order in space (production-grid error
    0.028 <!-- claim: grid_error_mV --> mV) and first order in time (step error
    0.27 <!-- claim: dt_spread_mV --> mV); the headline deviation itself carries a step
    error of 0.8 <!-- claim: headline_dt_error_pooled_mV --> mV
  - >-
    identities of the scheme, each testing one coupling: Faraday's law for the
    utilisation (below 1e-12 <!-- claim: faraday_gap -->, the only check that sees the
    pore-wall current entering the solid balance differently), the mean pore-wall
    flux against the charge balance, and total salt (below 1e-12
    <!-- claim: salt_conservation_drift -->), which no interior defect can move and
    which tests only the two salt-flux boundary conditions
  - >-
    the Bruggeman exponent in the salt flux and the factor in Eq. 5, which the paper
    leaves ambiguous, confronted with its own results
  - >-
    the utilisation at the 1.7 V cutoff, 0.831 <!-- claim: u_at_cutoff_I10 -->,
    between the digitised curve and the value the paper states

adds: >
  The paper never prints the conductivity of its own electrolyte: Appendix A
  says the PEO-LiCF3SO3 conductivity "was fit to a third-order polynomial" and
  gives no coefficients and no figure. The page recovers a value by inverting
  the paper's own Eqs. 28 and 29, two independent routes that agree to 18.7
  <!-- claim: kappa_route_spread_pct --> % and both reproduce the order of
  sigma/kappa the paper states. It confronts two ambiguities in the printed model
  with the paper's own results: the Bruggeman exponent in the cathode salt flux,
  where eps^1.5 is ruled out because it exhausts the electrolyte early in the
  discharge, contradicting their Figure 3; and the factor nu = 2 missing from
  Eq. 5's concentration term, which thermodynamics requires for a 1:1 salt but
  which Figure 2 cannot decide. It sweeps and refines the porosity optimisation
  the paper reports as one sentence: the maximum is at 0.591
  <!-- claim: porosity_optimum -->, just below the paper's, flat, with the loss
  above the optimum the larger at equal distance, 0.0216 <!-- claim: loss_above_015 -->
  against 0.0163 <!-- claim: loss_below_015 --> at 0.15. The cell is one Newton system per backward-Euler step on pymrm
  operators, with the flux boundary conditions as Neumann data computed from the
  state. No new physics: the model is theirs, unchanged.

agreement: >
  Eq. 16 reproduces the paper's own open-circuit curve to 3.25
  <!-- claim: ocp_eq16_mad_mV --> mV mean absolute deviation, against a
  digitisation accurate to about 3 mV. The four discharge curves are reproduced
  to a pooled mean absolute deviation of 25.5 <!-- claim: discharge_pooled_mad_mV -->
  mV on a 3 V scale with nothing fitted (16.8 <!-- claim: mad_I5_mV -->, 24.1
  <!-- claim: mad_I10_mV -->, 25.9 <!-- claim: mad_I13_mV --> and 34.0
  <!-- claim: mad_I20_mV --> mV at I = 5, 10, 13 and 20 A/m2), and every
  transport-limited 1.9 V crossing arrives early, by 0.014
  <!-- claim: u19_shortfall_min --> to 0.031 <!-- claim: u19_shortfall_max --> in
  utilisation. The 1.7 V cutoff utilisation at I = 10 comes out at 0.831
  <!-- claim: u_at_cutoff_I10 -->, between the 0.821
  <!-- claim: u17_I10_digitised --> the digitised curve gives and the 0.84 the
  paper states. The porosity optimum is at 0.591 <!-- claim: porosity_optimum -->
  against the paper's 0.60, at 0.928 <!-- claim: u_at_optimum --> utilisation
  against their 0.97.

  Numerically: the step is the error that matters, 0.8
  <!-- claim: headline_dt_error_pooled_mV --> mV in the pooled deviation and 1.9
  <!-- claim: headline_dt_error_I20_mV --> mV at I = 20, against 0.028
  <!-- claim: grid_error_mV --> mV for the grid in the cell potential at u = 0.5.
  All are small against the model-figure deviation.

  Total salt is conserved to below 1e-12 <!-- claim: salt_conservation_drift -->,
  and that number is not evidence for the model: it is an identity of the
  discretisation for any interior flux, and tests only the two salt-flux boundary
  conditions.

caveats: >
  Provenance tier 6. Figure 2 contains no experimental data at all: every curve
  on it is the authors' own simulation, so this page is validated against a
  published reference solution in the sense of D2.2 and must NOT be described as
  validated against experiment.

  The electrolyte conductivity is a reconstruction, not a reading: a single
  constant recovered from the paper's own dimensionless groups, whose two routes
  differ by 18.7 <!-- claim: kappa_route_spread_pct --> %. It therefore carries no
  concentration dependence, which the paper is explicit about mattering. The
  model is uniformly slightly too polarised on discharge (bias -23.8
  <!-- claim: discharge_pooled_bias_mV --> mV against a 25.5
  <!-- claim: discharge_pooled_mad_mV --> mV mean absolute deviation) and the
  charge curve is over-polarised by 64.9 <!-- claim: charge_bias_mV --> mV in the
  opposite direction. A deviation that follows the sign of the current is the
  signature of a series resistance, not of the kinetics or the open-circuit
  potential; that it is the constant conductivity is the likely reading, not a
  measured one.

  The factor nu = 2 in Eq. 5 is settled by thermodynamics and NOT by Figure 2:
  the printed form gives a smaller mean deviation (18.2 <!-- claim: nu1_mad_mV -->
  mV) and puts the transport-limited crossings late where the corrected one puts
  them early; the two bracket the published curves. The page prints both rather
  than choosing by fit.

  The 1.9 V and 1.7 V crossings are used as endpoint markers instead of "where
  the curve stops", because where a published curve stops is the authors' choice.
  Marches that end where the electrolyte is exhausted (newton cannot follow the
  potential with steps 64 times shorter) are reported as such, with the smallest
  salt concentration at the last converged step.
