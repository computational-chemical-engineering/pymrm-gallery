dataset_id: doyle-fuller-newman-1993-stated-results
title: Scalar results stated in the text of the paper
status: complete

source:
  authors: ["Doyle, M.", "Fuller, T. F.", "Newman, J."]
  year: 1993
  container: "Journal of the Electrochemical Society 140(6) 1526-1533"
  doi: 10.1149/1.2221597
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

provenance_tier:
  tier: 6
  note: >
    THESE ARE NOT MEASUREMENTS. Every value is either a dimensionless group the
    authors evaluate from their own parameters, or an output of their own
    simulation. A page built on them is a reference-solution reproduction in the
    sense of D2.2 and must not be described as validated against experiment.

acquisition:
  method: table
  figure: "running text, journal pages 1529-1531; no table"
  tool: "poppler pdftoppm at 600 dpi; values read from the rendered page image"
  procedure: >
    These are the numbers the paper prints that a reimplementation can be held
    to without digitising anything. Two of them - delta and nu - are the only
    route to the electrolyte conductivity, which the paper never prints, so
    they are load-bearing rather than decorative. The two u_at_cutoff rows and
    porosity_optimum come from a single sentence describing an optimisation the
    authors ran but do not plot; they are a genuine prediction target because
    nothing in them was used to set any input.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-07-31
  estimated_error: >
    The paper's own rounding, which is 2-3 significant figures. sigma_over_kappa
    is printed as an order of magnitude, O(1e5), and is treated as such.

completeness:
  note: >
    Not exhaustive. The paper also prints specific energy (272.4 Wh/kg),
    average and peak specific power, and a "3 h rate" of 12.1 A/m2. Those are
    omitted because they require a mass and a cell configuration that the paper
    does not give, so they cannot be checked; the paper says so itself ("could
    be converted to W/kg from an estimate of the mass").

columns:
  - {name: quantity,   unit: "-",    description: "what the number is"}
  - {name: value,      unit: varies, description: "value as printed"}
  - {name: unit,       unit: "-",    description: "unit"}
  - {name: equation,   unit: "-",    description: "the paper's equation number, or the page of the running text"}
  - {name: conditions, unit: "-",    description: "the case the value belongs to"}
  - {name: kind,       unit: "-",    description: "dimensionless group, simulation result, or order of magnitude"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image is reproduced.
