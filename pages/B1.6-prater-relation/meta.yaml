validation:
  - the transcription of eqs. (4), (5), (7) and (8) is checked three ways against the paper's own content, including a sign in eq. (8) that the paper contradicts itself on
  - the identity is proved symbolically for an arbitrary rate function and an arbitrary geometry index nu
  - 324 pymrm two-field solves over 3 geometries, 3 rate laws, 3 Arrhenius numbers and Prater numbers of both signs, worst violation below 1e-10; convergence is judged separately by the backward error (below 1e-12), because the violation itself cannot detect a failed solve
  - "the sensitivity of that violation is measured rather than asserted: a sign, a scale and a rate at the wrong state in the heat source, and a film on the temperature field only, lift it from round-off to the size of the defect, and a heat source scaled by 1 + delta gives exactly delta (1 - y_min)"
  - "the same injection shows what it is blind to (a Newton iterate stopped after one step, the wrong geometry index, a 3-cell grid); the effectiveness factor and the backward error catch those; the worst violation over those three defects is below 1e-10 <!-- claim: blind_rows_max_identity_violation -->"
  - an independent scipy.solve_bvp collocation solve sharing no code with the pymrm one inherits the identity structurally, so it corroborates the profiles, not the identity; the pymrm y(u) profiles agree with it to 1.0e-6 on 800 cells at second order, against a reference that moves by less than 1e-10 when its tolerance or start point is refined
  - the effectiveness factor agrees with B1.1's shooting reference, which discretises nothing, at the same Thiele modulus to 2.0e-6 on 800 cells at second order
  - cross-page conventions; beta recovered from the two-field solution equals B1.5's beta = 0.6 and the reduced single equation B1.1/B1.5 solves has the two-field solution as its root; both are guaranteed by the identity and are labelled as convention and implementation checks, not corroboration
  - the film breakdown matches a closed form derived on the page to round-off, on 400 cells and on 8 (the match is an algebraic identity of the discrete system, confirming the derivation rather than the solve)
  - the transient breakdown vanishes identically at Le = 1 (round-off over the whole start-up), the control the theory predicts; the peaks elsewhere come from BDF2 taken to its limit in the step at second order and agree with solve_ivp on the same semi-discrete system below 2e-6
  - "which steady state: where several exist, the solve lands on the least-ignited one, the state a start-up from surface conditions reaches; 27 <!-- claim: sweep_cases_several_states --> of the sweep cases with beta > 0 have a second steady state (the solve is on the less ignited one in 27 <!-- claim: sweep_several_states_page_lowest -->), and at phi = 0.4 that is eta 1.159 <!-- claim: phi04_eta_page --> against 44.5 <!-- claim: phi04_eta_upper --> on the upper branch, equal to a resolved Le = 1 start-up to below 1e-8 <!-- claim: phi04_state_vs_startup -->"
  - defect-injection table with one row per injected defect; every claim is failed by at least one row

adds: >
  Nothing to the identity itself: Prater's result is exact and its proof is two
  lines. What is new is the size of the error when its assumptions fail, which
  the 1958 result could only assume away. With an external film the interior
  relation survives referenced to the SURFACE, while the bulk-referenced form
  everyone writes is wrong by beta(1-y_s)(Bi_m/Bi_h - 1), uniformly in position,
  a closed form derived here whose numerical match is forced by the discrete
  harmonicity; the contribution is the derivation plus the magnitudes (up to
  99.6 % of the temperature rise sitting outside the pellet). In a transient the
  relation is a linear invariant of the system exactly when Le = 1; away from
  that it is violated by up to 0.252 of beta, peaking early and decaying to zero
  at steady state. The identity also makes a cheap unit test for any
  non-isothermal pellet code, for one specific class of bug: it catches an
  inconsistency between the two source terms or between the two boundary
  conditions, linearly in the size of the defect, and nothing else; the page
  measures both by injecting defects. In pymrm the two-field state is one
  BlockLayout, the coupling block of the exact Jacobian one
  construct_coefficient_matrix call, and pseudo_transient reaches every case of
  the sweep from the surface state without a path in beta.

agreement: >
  Not applicable in the experimental sense: this is a tier 6 identity page. The
  numbers that matter are internal, and they are not of equal weight. The
  identity holds to round-off (below 1e-10) over 324 pymrm solves spanning
  slab/cylinder/sphere, first-order, Langmuir-Hinshelwood and zero-order
  kinetics, gamma = 10-30 and beta from -0.4 to +0.6, and under an independent
  collocation discretisation, but both are inherited identities of the discrete
  system, and the page demonstrates by injection what they can and cannot
  detect. The checks that can fail are the two profile comparisons: pymrm
  against the collocation solution, 1.0e-6 on 800 cells at second order, and
  pymrm's effectiveness factor against B1.1's shooting reference at the same
  Thiele modulus, 2.0e-6 on 800 cells at second order. The film failure matches
  its closed form to round-off (an algebraic identity, matched equally well on 8
  cells); the transient control at Le = 1 stays at round-off against peak
  violations of 0.124, 0.146 and 0.252 of beta at Le = 0.1, 0.01 and 10.

caveats: >
  Provenance tier 6, and emphatically NOT experimental validation: this is an
  identity proof plus numerical confirmation. Neither source paper reports
  measurements. Prater (1958) itself was not consulted (no copy is on disk and
  none is open access), so every equation is transcribed from Weisz & Hicks
  (1962) as printed, with Prater cited for the result as they cite him. Two
  printed expressions for beta in their eq. (8) carry opposite signs; the page
  states both alternatives and shows which one the paper's own rate expression,
  sign convention and eta > 1 result select, rather than repairing it by
  inference. Because the identity is linear and one construct_div serves both
  fields, any discretisation applying the same operator to both inherits it
  exactly: the sweep violation is a floating-point measurement and does NOT test
  the discretisation, the geometry index, or whether the nonlinear solve
  converged, all three demonstrated on the page by injection. The collocation
  solve inherits it for the same structural reason; the checks with resolving
  power are the profile comparisons against the collocation solution and
  against B1.1's shooting reference. The assumption that both balances share
  one reaction rate is not tested; nor is variable D_e and lambda, where only a
  Kirchhoff-transformed relation between the potentials survives and the
  relation between T and c itself becomes nonlinear. Zero-order kinetics is
  swept at small phi only, because above a threshold a dead core forms and no
  steady state exists to test.
