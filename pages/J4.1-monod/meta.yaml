data:
  tier: 2
  method: >
    Two transcriptions, no digitising and no figure extraction. (1) The seven
    time intervals printed in Levenspiel's Problem 29.18, book p. 644 - the
    page's only empirical input. (2) Twenty-eight equations and prose claims
    from the three books, verbatim, each with the book and page it was read
    from.
  status: complete
  provenance_of_the_measurements: A_DIFFERENT_MONOD_PUBLICATION_NOT_CONSULTED
  provenance_note: >
    READ THIS BEFORE REUSING THE CSV. Levenspiel introduces the table with "As
    experimental support for this equation he presented results from four batch
    reactor runs on the growth of a pure bacterial culture in a lactose solution
    (see Monod, 1958, p. 74). Here are the reported data for one of his runs."
    So these are presented as REPORTED MEASUREMENTS, which is why the page uses
    them - but they are attributed to MONOD (1958), the second edition of
    "Recherches sur la Croissance des Cultures Bacteriennes", NOT to the 1949
    paper this case catalogues. Neither document is on disk and neither was
    consulted, so WHICH of them prints this table is not established here.
    Levenspiel's own account of the history, quoted as his on the page, is that
    the equation was proposed "in 1939, as part of his thesis", that the thesis
    "was published as a book in 1948", and that it "was later condensed and
    translated into English in 1949".
    THE TABLE PRINTS NO UNITS for either concentration column; dt is in hours,
    which is the only unit given and which matches the h^-1 Froment prints for
    mu. Every conclusion on the page is in h^-1 or is a ratio, except K_S, which
    is quoted as "in the units of the printed CA_bar column" every time.
    THE CA_bar COLUMN HEADER CARRIES AN OVERBAR - an interval average - which
    every pdftotext mode drops and which is load-bearing: reading it as a point
    value is precisely the reduction bias the page measures.

printed_defect_reported_not_repaired: >
  ROW 4's CA_bar IS INCONSISTENT WITH THE TABLE'S OWN MATERIAL BALANCE. All
  three books assume a constant biomass yield (Froment eq. 1.5.2-3, Rawlings
  eq. 10.18, Levenspiel Ch. 29), which forces CA_bar to be an exact affine
  function of the interval-average biomass - a check needing no kinetics at all.
  Six of the seven rows satisfy that line at R^2 = 0.99995709 <!-- claim: balance_R2_six_rows -->; all seven give
  0.98504707 <!-- claim: balance_R2_all_rows -->. A LEAVE-ONE-OUT SWEEP SAYS WHICH ROW: dropping row 4 gives
  the six-row value, dropping any other leaves R^2 between 0.975738 <!-- claim: balance_R2_loo_min_other --> and
  0.984806 <!-- claim: balance_R2_loo_max_other -->. The six-row line predicts CA_bar = 60.18 <!-- claim: balance_row4_imputed_CA --> for
  row 4 against the printed 43 - a residual of -17.18 <!-- claim: balance_row4_residual --> where the largest of
  the other six is 0.654 <!-- claim: balance_worst_other_residual -->.
  A CANDIDATE EXPLANATION IS RECORDED AS AN INFERENCE AND THEN REFUSED AS A
  SYSTEMATIC: 43 is within 3.1 % <!-- claim: row4_end_of_interval_relgap --> of that interval's END-of-interval substrate
  concentration (44.33 <!-- claim: eoi_row4 --> on the same line), but the same substitution on rows 3
  and 5 gives 74.89 <!-- claim: eoi_row3 --> against 90 (16.8 % <!-- claim: eoi_row3_relgap --> off) and 13.46 <!-- claim: eoi_row5 --> against
  29 (53.6 % <!-- claim: eoi_row5_relgap --> off).
  NOTHING IS EDITED IN THE CSV. A break row puts the cell back into the balance
  line and another propagates its balance-implied value through all seven
  route-A fits, so exactly what depends on it is visible.

not_a_defect: >
  Rawlings' Tessier row prints mu = mu_m (1 - e^{-K_s S}), in which K_s must be
  a RECIPROCAL concentration - unlike the Monod and Blackman rows, where it is a
  concentration. That reads like a misprint for the commoner exp(-S/K_s) until
  the Moser row is read, where K_s adds to S^n and therefore carries units of
  concentration^n: the book is reusing K_s as a MODEL-LOCAL symbol, and the
  Moser row settles it. All three pdftotext modes and the 300 ppi render agree
  on the printed exponent. Transcribed as printed, flagged in the CSV, and NOT
  reported as a defect.

fit_or_test: >
  THREE KINDS ARE PRESENT AND ARE KEPT APART EVERYWHERE.
  STRUCTURAL (proofs, which cannot fail for the right reason and are labelled as
  identities in the coverage map): Monod == Langmuir with K_S = 1/K, which is
  Rawlings' printed claim; Froment's two defining properties of r_m and K_S;
  the fact that Blackman shares BOTH of them exactly while differing by exactly
  mu_m/3 at its branch switch and by mu_m(3-2 sqrt 2)/2 = 0.0858 <!-- claim: sym_blackman_gap_lower_over_mum --> mu_m at
  S = (sqrt 2 - 1) K_S; Moser == Monod at n = 1; and CONTOIS == MONOD under a
  constant yield, with mu_m' = mu_m/(1 - K_sx phi) and
  K_S' = K_sx phi a/(1 - K_sx phi). Five sympy residuals, all exactly zero, each
  registered as a bound at exactly 0 and named structural, with a companion.
  FITTED: every constant describing the culture. mu_m = 0.8809 <!-- claim: routeB_monod_mu_m --> 1/h and
  K_S = 20.45 <!-- claim: routeB_monod_K_S --> (in the units of the printed CA_bar column) were fitted to the
  same seven intervals the residuals are then reported against, SO THAT
  AGREEMENT IS A GOODNESS OF FIT AND NOT A TEST. Two one-parameter nulls are
  computed beside it and each is itself best-fitted: zero order 0.278278 <!-- claim: rmsA_zero_order --> 1/h and
  first order 0.201476 <!-- claim: rmsA_first_order --> (route A) - Monod beats the better of them by
  3.68 <!-- claim: rmsA_null_over_monod --> times and Blackman by 7.53 <!-- claim: rmsA_null_over_blackman --> times. That ratio is a claim about SATURATION, not about a
  mechanism, and the page says so.
  REPRODUCED (not validated): Rawlings' eq. (10.19) and their D_c at their own
  printed parameter set. That is their algebra reproduced by a different
  computation, not a measurement.
  DIRECTION OF THE IDENTIFIABILITY CLAIMS: the separations d are obtained by an
  optimiser, so each is an UPPER BOUND on a minimum distance. "Cannot be
  separated" is therefore the safe direction, and the quoted N* is if anything
  an underestimate of what an experiment needs.

validation:
  - "HEADLINE 1, AND IT IS EXACT. Contois IS Monod on any constant-yield batch or plug-flow run. Constant yield makes X = phi(a - S), so mu_m S/(K_sx X + S) = (mu_m/beta) S/(K_sx phi a/beta + S) with beta = 1 - K_sx phi - a bijection between the two parameter pairs. sympy residual exactly 0 (metric sym_contois_is_monod_residual). Confirmed numerically by two optimisers started from different places on the two parameterisations: pushing the fitted Contois constants through the map reproduces the Monod fit's mu_m and K_S to below 1e-3 <!-- claim: contois_map_KS_relerr --> relative, and the two residual RMS differ by below 1e-10 <!-- claim: contois_minus_monod_rms --> 1/h. These are optimiser exit tolerances, registered as bounds and quoted as bounds; their values are printed on the page. Moser is the other indistinguishable one, by nesting at n = 1; the measured separations at the seven design points are below 1e-9 <!-- claim: sep_moser --> for both, which is xtol and not a separation."
  - "HEADLINE 2, AND IT IS THE CASE'S OWN QUESTION. On the one real dataset, the ranking of the five printed laws is set by the DATA REDUCTION. Route A - mu_i = ln(Cc_end/Cc_start)/dt compared with mu(CA_bar), which is what the exercise invites - puts Monod LAST of the four two-parameter laws (RMS 0.054690 <!-- claim: rmsA_Monod --> 1/h against Contois 0.051534 <!-- claim: rmsA_Contois -->, Tessier 0.038710 <!-- claim: rmsA_Tessier -->, Blackman 0.026772 <!-- claim: rmsA_Blackman -->) and gives Moser n = 1.9317 <!-- claim: routeA_n_moser --> with F = 12.2698 <!-- claim: routeA_F_moser_vs_monod --> against F(1,4) = 7.7086 <!-- claim: F_crit_95 -->, i.e. SIGNIFICANT - a verdict CO-CAUSED by the one printed cell the page flags, since putting that cell at its balance-implied 60.18 <!-- claim: balance_row4_imputed_CA --> gives F = 5.45 <!-- claim: routeA_F_imputed --> against the same critical value, i.e. NOT significant. The RANKING claim is not co-caused: Blackman still beats Monod with the cell imputed (0.04065 <!-- claim: rmsA_imputed_Blackman --> against 0.04687 <!-- claim: rmsA_imputed_Monod -->), and the route-A-to-route-B reversal is the reduction. Route B - the same seven growth rates, the interval average done exactly by integrating the law across each interval, with phi and a taken from the table's own material balance and NO new parameter - gives Monod 0.031466 <!-- claim: rmsB_Monod --> (a 42 % <!-- claim: routeB_monod_rms_drop --> fall), makes Blackman the WORST of the four, and gives n = 1.51 <!-- claim: routeB_n_moser --> with F = 1.44 <!-- claim: routeB_F_moser_vs_monod -->, NOT significant.
      THE TWO ROUTES DO NOT READ THE SAME SEVEN NUMBERS. Both fit the same seven mu_i. Route A reads all seven printed CA_bar directly; route B never touches that column and takes the substrate trajectory from phi and a, which come from the SIX-ROW balance line that excludes the flagged row 4. The break table prices that by refitting every route-B law and route B's own F with the ALL-SEVEN line."
  - "THE BOOTSTRAP, WITH A CONTROL. 2000 seeded draws (seed 20260813) at sigma = route B's RMS, with EVERY DRAW FITTED THE WAY ROUTE A FITS THE REAL DATA - global scan, then refined. Truth = the FORWARD Monod model: route A's nominal-5 % F test rejects Monod 36.55 % <!-- claim: boot_size_forward_truth --> +- 1.1 % <!-- claim: boot_size_forward_se --> of the time and the median fitted exponent is 1.6117 <!-- claim: boot_median_n_forward_truth --> +- 0.0074 <!-- claim: boot_median_n_forward_se -->. Truth = mu(CA_bar), route A's OWN model, for which route A is correctly specified: size 4.95 % <!-- claim: boot_size_control_truth --> +- 0.5 % <!-- claim: boot_size_control_se -->, median exponent 1.0089 <!-- claim: boot_median_n_control_truth --> +- 0.0049 <!-- claim: boot_median_n_control_se -->. These are Monte-Carlo estimates at 2000 draws, four frequencies and two medians, each printed with its sampling error (binomial for the frequencies, from the order statistics for the medians); the four-figure values are exact for the seed and reproducible, not resolved. THE CONTROL SITS AT ITS NOMINAL SIZE (within three standard errors of a nominal test, a bound claim), so the small-sample F approximation at n = 7 is not the cause and the whole of the distortion is the reduction. Against a properly generated Monod null the OBSERVED route-A F has p = 0.2280 <!-- claim: boot_p_of_observed_F --> +- 0.0094 <!-- claim: boot_p_of_observed_F_se --> and its exponent has p = 0.1285 <!-- claim: boot_p_of_observed_n --> +- 0.0075 <!-- claim: boot_p_of_observed_n_se -->.
      A draw whose scan optimum sits on an end of a search grid is refined from its grid winner as far as the zoom reaches past that end and INCLUDED in every bootstrap statistic. The upper ends are the limits n -> infinity (a step) and K -> infinity, which no finite grid contains, so such a draw's F is a lower bound and it moves a frequency by at most its own count. Counted as claims: a fraction below 2.5e-3 <!-- claim: boot_edge_fraction_main --> of the draws at route B's scatter, 0.93 % <!-- claim: boot_edge_fraction_routeA_sigma --> at route A's; a break row cutting the Moser exponent grid at n = 2 raises both.
      READING THE DRAWS' FITS OFF THE SCAN GRID GETS THE SIX NUMBERS WRONG, AND IT IS A BREAK ROW: an unrefined Moser fit cannot reach its own optimum, so it deflates F on every draw. The grid-only numbers are size 0.3080 <!-- claim: boot_gridonly_size_forward --> and 0.0210 <!-- claim: boot_gridonly_size_control -->, median n 1.6029 <!-- claim: boot_gridonly_median_n_forward --> and 0.9514 <!-- claim: boot_gridonly_median_n_control -->, p 0.1835 <!-- claim: boot_gridonly_p_of_observed_F -->, and they make the control look CONSERVATIVE when it is at nominal. The refinement's convergence over zoom depths 0, 2, 4, 6, 8 is printed on the page as the count of draws whose two-dimensional fit, started from the grid winner alone, still ends above the one-dimensional fit nested inside it.
      THE NOISE SCALE IS A DECLARED CONVENTION FOR THE FORWARD ARM AND NOT FOR THE CONTROL: the forward size is a bias-to-noise ratio and reads 0.3655 <!-- claim: boot_size_forward_truth --> +- 0.0108 <!-- claim: boot_size_forward_se --> at route B's RMS and 0.2355 <!-- claim: boot_size_forward_at_routeA_sigma --> +- 0.0095 <!-- claim: boot_size_forward_at_routeA_sigma_se --> at route A's, while the control reads 0.0495 <!-- claim: boot_size_control_truth --> +- 0.0049 <!-- claim: boot_size_control_se --> and 0.0470 <!-- claim: boot_size_control_at_routeA_sigma --> +- 0.0047 <!-- claim: boot_size_control_at_routeA_sigma_se -->, scale-free to within three standard errors (a bound claim)."
  - "THE BIAS ITSELF, MEASURED. At CA_bar = 9 the shortcut misstates the rate by 0.066310 <!-- claim: bias_max_abs_excl_bad_row --> 1/h, which is 1.2125 <!-- claim: bias_over_routeA_rms --> times the residual scatter route A ranks the five laws on. It has a SIGN - mu is concave, so mu(mean) > mean of mu - which is why it inflates a saturating law's sharpness. The largest substrate swing over an interval is 1.8901 <!-- claim: max_swing_over_CAbar --> times that interval's own printed average, so this is not a small-perturbation regime. Row 4's entry in the same table, 0.068561 <!-- claim: bias_max_abs --> in magnitude, is dominated by that row's departure from the material balance rather than by curvature, and is reported separately for that reason."
  - "IDENTIFIABILITY AT THIS DESIGN, PRICED. Taking Monod as true at the route-B fit and asking how close each alternative can get at the seven design points: Blackman 0.03466 <!-- claim: sep_blackman --> 1/h (1.1015 <!-- claim: sep_over_scatter_blackman --> times the scatter, N* = 1.30 <!-- claim: Nstar_blackman --> repeats of the run), Tessier 0.012348 <!-- claim: sep_tessier --> (0.39242 <!-- claim: sep_over_scatter_tessier -->, N* = 10.27 <!-- claim: Nstar_tessier -->), Moser and Contois at the optimiser floor. So BLACKMAN - THE LAW ROUTE A LIKED BEST - IS THE ONLY ONE THIS DESIGN CAN RESOLVE, which means route A is not merely biased but is confidently ordering laws it cannot tell apart."
  - "THE DISCRIMINATING EXPERIMENT, NAMED AND PRICED. Rawlings' chemostat separates what the batch cannot: Monod washes out at D_c = mu_m S_f/(K_S + S_f) and Contois at D_c = mu_m independent of S_f. The two cross at EXACTLY S_f = a - an identity, verified by a root-find at 197.1 <!-- claim: Sf_crossing --> against the material balance's a = 197.120267 <!-- claim: balance_a -->, equal to within the Contois fit's exit tolerance (a relative gap below 1e-3 <!-- claim: Sf_crossing_vs_a_relerr -->, registered as a bound) - and separate on either side: a factor 1.8325 <!-- claim: Dc_ratio_at_Sf20 --> at S_f = 20, and more than one tenth apart for every S_f below 95.515 <!-- claim: Sf_for_10pct_gap -->."
  - "A STATED NUMERICAL RESULT REPRODUCED. Rawlings' eq. (10.19), S_s = D K_s/(mu_m - D) and X_s = y(S_f - S_s), at their printed Fig. 10.12 parameter set, reproduced to below 1e-9 <!-- claim: rawlings_10_19_max_relerr --> relative at D = 0.25, 0.5, 0.75 by marching eq. (10.18) to steady state; and their PRINTED FORMULA D_c = mu_m S_f/(K_s+S_f), which evaluates at their own printed parameter set to 5/6 = 0.8333 <!-- claim: rawlings_Dc_closed_form --> - the formula is theirs, the number is this page's evaluation of it and Chapter 10 prints no numeric D_c anywhere - recovered to 2.14e-4 <!-- claim: rawlings_Dc_relerr --> by a root-find on that marched model. Break rows change their printed K_s, S_f and y and the reproduction fails."
  - "THE SECOND, INDEPENDENT COMPUTATION OF THE HEADLINE FIT. Route B's Monod constants re-derived through a pymrm BACKWARD-EULER MARCHER built from NumJac((1,2)) and newton, Richardson-extrapolated from 200/400 steps, agreeing with the adaptive LSODA fit to below 1e-4 <!-- claim: pymrm_refit_mum_relerr --> in both mu_m and K_S (a bound: the gap is set by the two fits' stopping rules), at observed order 1.00 <!-- claim: pymrm_batch_observed_order --> from successive differences. The marcher carries S as an UNKNOWN rather than substituting the yield relation, but S + X/phi = const is then a TAUTOLOGY of the scheme: it closes below 1e-13 <!-- claim: pymrm_batch_conservation_relerr -->, tripling mu_m leaves it below 1e-13 <!-- claim: marcher_invariant_mu_tripled_relerr --> still, and only a break row using a different yield in the source from the one in the invariant breaks it.
      WHAT THE TWO-ROUTE COMPARISON DOES AND DOES NOT ESTABLISH. It catches a bug in either integrator. It is blind to everything the two share: a yield wrong by 30 % moves the common prediction by orders while the LSODA-versus-pymrm gap changes by below 1e-3 <!-- claim: blind_yield_gap_change_over_move --> of that move; a break row giving the wrong yield to one route only shows the check is not blind to that."
  - "AN EXACT IDENTITY FOR THE SPATIAL SOLVE. Levenspiel's Fig. 29.1 is captioned for 'batch OR PLUG FLOW' reactors, and that is a theorem: the plug-flow outlet at residence time tau is the batch state at t = tau. The pymrm solve (construct_convflux_upwind + construct_div(nu=0) + NumJac((n,2)) + newton, outlet {'outflow': True} read by compute_boundary_values) converges to the adaptive initial-value solution at observed order 1.00 <!-- claim: pfr_observed_order --> from successive differences on the ladder 200 to 6400 cells, with a Richardson value within 1e-4 <!-- claim: pfr_richardson_relerr --> of it; at the finest grid, 6400 cells, the outlet is 3.05e-4 <!-- claim: pfr_batch_relerr_finest --> relative from it. Break rows: nu = 1 instead of nu = 0, and a flipped substrate sign."
  - "THE BREAK TABLE AND THE CLAIMS. Every claim is registered in agreement.json (format 2) as a value, a bound or an exact result and is checked by its kind on every run; the quantities the page proves exactly zero are bounds with a stated basis and a limit that holds on any machine. Every break row is declared before it runs, and every non-structural claim has a row that fails its own check; the notebook prints the counts. Every number in this file, README.md and the models.yaml entry carries a claim marker checked against agreement.json, and the notebook's prose literals are checked by claims.says."
caveats:
  - "THE ORIGIN WAS NOT CONSULTED. Monod (1949) is not on disk and could not be obtained. Everything this page says about Monod is bounded by what Froment prints about him - eq. (1.5.2-1), the naming of K_S as 'the Monod- or saturation constant', the sentence about mu/mu_max/S in 'the original Monod equation', and the citation in the Chapter 1 reference list. NO SENTENCE OF THE FORM 'Monod showed/assumed/found/argued' APPEARS ANYWHERE on the page, in this file, or in README.md; that sweep was done deliberately, because attribution drift is the A3.2 defect class."
  - "NOTHING IS ATTRIBUTED TO BLACKMAN, TESSIER, MOSER OR CONTOIS EITHER. Rawlings & Ekerdt introduce all five forms with one sentence, 'Many different cell growth expressions have been found useful [1, 17]', citing Bailey & Ollis and Shuler & Kargi; only Monod carries an individual citation. The page therefore attributes the four alternative forms to the page that prints them, and says nothing about who proposed them or why."
  - "THE PAGE DOES NOT VALIDATE 'THE MONOD MECHANISM' AND SAYS SO. What the seven intervals support is that a two-parameter saturating law describes one batch run 3.68 <!-- claim: rmsA_null_over_monod --> times better than the best one-parameter alternative. That is a claim about SATURATION, and it is compatible with at least four of the five printed laws - two of which are exactly indistinguishable from Monod on this kind of experiment."
  - "SCOPE. Substrate inhibition - Froment eq. (1.5.2-4), attributed there to Graef and Andrews [1973], and Rawlings' mu_m S/(K_s + S + K_1 S^2) - is CASE J4.2 and gets no quantitative treatment here. Froment's contrast, that the inhibited rate 'exhibits a maximum, whereas with Monod-kinetics it tends to an asymptotic value', is quoted once and left to that case, exactly as A3.1 and A3.3 left the three-way comparison to A3.2. Both forms are transcribed into the printed-laws CSV so that the boundary is checkable, and neither is fitted or evaluated anywhere. Williams' structured model, eqs. (1.5.2-5) to (1.5.2-8) of the same section, is J4.9's. Product inhibition (Rawlings p. 596, Levenspiel Ch. 30) is out and is named."
  - "K_S IS IN UNITS THE SOURCE DOES NOT PRINT. The table gives no units for either concentration column; only dt is dimensioned, in hours. So mu_m = 0.8809 <!-- claim: routeB_monod_mu_m --> 1/h is a proper rate - and it agrees in KIND with the h^-1 Froment prints for mu - but K_S = 20.45 <!-- claim: routeB_monod_K_S --> is a number in the units of the printed CA_bar column and nothing more. The organism is not named and the substrate is identified only as lactose. Do not cite K_S as a half-saturation constant for anything."
  - "THE DATA ARE NOT FROM THE 1949 PAPER. See data.provenance_note. They are attributed by Levenspiel to Monod (1958) p. 74, which was not consulted."
  - "THE FLAGGED CELL. See printed_defect_reported_not_repaired. Note in particular that the one significance verdict the page could have reported is sensitive to it: the route-A F test's outcome is not stable to that single cell, which is itself part of the finding rather than a footnote to it."
  - "N* IS A CONVENTION AND IS REPORTED AS ONE. It is the number of independent repeats of this seven-interval design at which a chi-square separation at 95 % with 5 degrees of freedom becomes possible, computed with the route-B residual scatter as the noise scale. The confidence level and which route supplies the scatter have break rows, printed in the break table. The number is also an underestimate of the experimental effort in the direction that matters, because the separations bounding it are optimiser upper bounds."
  - "DETERMINISM IS A SHIPPED PROPERTY OF THIS PAGE AND IS CHECKED, NOT ASSUMED. Everything stochastic is drawn from np.random.default_rng(SEED) with SEED = 20260813 printed on the page, and NO WALL-CLOCK TIMING IS PRINTED ANYWHERE. Elapsed seconds differ between two consecutive executions, which is enough to make a page undiffable and so to hide a real drift behind a false one. Two fresh build-and-execute runs in isolated copies give byte-identical agreement.json, byte-identical figures and identical stream output in all 46 output blocks."
  - "THE CHEMOSTAT PREDICTIONS ARE EXTRAPOLATIONS. The right-hand panel of the results figure takes constants fitted to a batch run and predicts an experiment nobody ran. It is presented as such. A break row rebuilds the whole prediction from the ROUTE-A constants instead, and every number moves - which is the page's point applied to itself."
  - "WHAT PYMRM ADDS HERE IS SPECIFIC AND THE PAGE SAYS SO. The central argument is algebra plus a seven-point fit, and scipy does most of it - a well-mixed batch and a chemostat are 0-D and solve_ivp integrates them, as it does throughout, as the reference. What pymrm buys is (i) a genuinely independent second computation of the fit through NumJac + newton that tests the yield relation instead of assuming it, and (ii) turning Levenspiel's 'batch or plug flow' caption into a converged number. Neither is decoration, and neither is oversold."

