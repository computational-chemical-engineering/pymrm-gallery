  - "N* IS A CONVENTION AND IS REPORTED AS ONE. It is the number of independent repeats of this seven-interval design at which a chi-square separation at 95 % with 5 degrees of freedom becomes possible, computed with the route-B residual scatter as the noise scale. All three choices - the confidence level, the degrees of freedom and which route supplies the scatter - have break rows (N*_Blackman 1.30 -> 1.78 at 99 %, N*_Tessier 10.27 -> 31.03 on route A's scatter). The number is also an underestimate of the experimental effort in the direction that matters, because the separations bounding it are optimiser upper bounds."
  - "DETERMINISM IS A SHIPPED PROPERTY OF THIS PAGE AND IS CHECKED, NOT ASSUMED. Everything stochastic is drawn from np.random.default_rng(SEED) with SEED = 20260813 printed on the page, and NO WALL-CLOCK TIMING IS PRINTED ANYWHERE. An earlier version ended the route-B cell with that cell's elapsed seconds; two consecutive executions then differed by one character (29 s against 30 s), which is enough to make the page undiffable and so to hide a real drift behind a false one. Two fresh build-and-execute runs in isolated copies now give byte-identical agreement.json, byte-identical figures and identical stream output in all 46 output blocks."
  - "THE CHEMOSTAT PREDICTIONS ARE EXTRAPOLATIONS. The right-hand panel of the results figure takes constants fitted to a batch run and predicts an experiment nobody ran. It is presented as such. A break row rebuilds the whole prediction from the ROUTE-A constants instead, and every number moves - which is the page's point applied to itself."
  - "WHAT PYMRM ADDS HERE IS SPECIFIC AND THE PAGE SAYS SO. The central argument is algebra plus a seven-point fit, and scipy does most of it - a well-mixed batch and a chemostat are 0-D and solve_ivp integrates them, as it does throughout, as the reference. What pymrm buys is (i) a genuinely independent second computation of the fit through NumJac + newton that tests the yield relation instead of assuming it, and (ii) turning Levenspiel's 'batch or plug flow' caption into a converged number. Neither is decoration, and neither is oversold."

agreement: >
  Three kinds, kept apart. STRUCTURE: five symbolic identities with residual
  exactly zero - Monod == Langmuir, Froment's two defining properties, Blackman
  sharing both of them, Moser == Monod at n = 1, and Contois == Monod under a
  constant yield - plus the exact mu_m/3 gap at Blackman's switch, checked
  against a root-found extremum. FIT: mu_m = 0.880923 1/h and K_S = 20.4536 at
  0.031466 1/h RMS on the seven intervals they were fitted to, against 0.201476
  for the best one-parameter null; the route-A reduction of the same data gives
  0.054690 and a different ranking, and a seeded bootstrap with a control - every
  draw refit rather than read off the scan grid - shows the reduction rejects a
  true Monod 36.5 % +- 1.1 % of the time against 4.95 % +- 0.5 %, i.e. AT nominal
  size, for its own correctly-specified model. NUMERICS: Rawlings' eq. (10.19) reproduced exactly
  and their D_c to 2.1e-4; the fit reproduced through a pymrm backward-Euler
  marcher to 1.7e-6 with conservation below 1e-14 and observed order 0.9993; and
  the plug-flow-equals-batch identity at observed order 0.9981 with Richardson
  3.2e-6. One printed cell reported and not repaired.

