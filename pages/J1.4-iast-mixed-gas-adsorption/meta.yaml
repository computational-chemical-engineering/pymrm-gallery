adds: >
  Nothing to the theory, and the page says so plainly: IAST is algebra plus
  one scalar root-find per state, and most of the notebook would run with
  pymrm uninstalled, exactly as on J1.1, J1.3 and A1.6. What newton and
  NumJac do here is narrow and real. (1) The whole (P, y1) grid solved as one
  Newton problem with NumJac((K,1)) - independent scalars, a diagonal
  Jacobian by construction, and the shape is (K,1) never (K,) per the house
  rule; the iteration runs in ln z, which keeps Newton off the P(0) = 0
  singularity. (2) The general-isotherm inverse: for the dual-site pair the
  pure P(z) is itself a nested vectorised newton solve - the machinery a
  user with tabulated isotherms (eq. 43) actually needs. (3) Root-finds and
  closed forms where a sweep would have been wrong: the window supremum is
  root-found with the 0.67 %-low grid read printed beside it, the dilution
  limits are closed forms rather than end-of-grid reads, and every
  quadrature carries an observed order. The one output useful beyond
  reproduction is not pymrm at all: the closed-loop Gibbs consistency
  diagnostic with its symbolically derived curl, applicable to ANY proposed
  mixture-adsorption model n_i(P, y) with no IAST solve required, and the
  identification of exactly when the extended-Langmuir shortcut is safe
  (equal capacities, where it IS an ideal adsorbed solution).

agreement: >
  Everything on this page is structural or solver-versus-closed-form;
  nothing is experimental and nothing is a fit, and the page states in its
  title cell and Reuse that it establishes what the theory is, not that it
  is empirically right. Solver vs closed forms: equal-capacity extended
  Langmuir to 7.6e-16 over 900 states; pure-Henry eq. (31) to 2.2e-16;
  Henry-limit selectivity at observed order 1.0000 in P, 2.75e-8 at
  P = 1e-8; dilute-in-1 selectivity closed form recovered to 2.7e-8.
  Thermodynamic identities: Gibbs path integral to 4.1e-16 (Gauss-64) /
  8.8e-5 (trapezoid-65, order 2.0); IAST loop closure 7.8e-16. The
  discriminating number: extended Langmuir with unequal capacities leaves a
  loop deficit of 11.9 % of scale, computed by two assembly-free routes
  agreeing to 2.7e-15, exactly linear in m2 - m1 (factor 2.000000000000002
  measured), and collapsing to 5e-16 at equal capacities. Deviations of the
  shortcut model from IAST on the illustrative pair: 21.5 % in total amount
  (window supremum, root-found) and 64.2 % on the dilute component (closed
  form). Symbolic: eleven identities exactly zero. Printed defects: eq. (11)
  missing its '+'; the eq.-(21) self-citation; Fig. 6's 'MARKHAM & BENTON
  (1950)' vs ref. 8's 1931; ref. 5's impossible Ibid volume-year pair
  (4.6 volumes/year); 'absorbent' [sic]; Serpenskii vs SERPINSKII.

caveats: >
  NO EXPERIMENTAL CONTENT ANYWHERE, BY SCOPE DECISION STATED UP FRONT. The
  paper's four validation systems (methane-ethane and ethylene-CO2 on
  activated carbon, CO-O2 and propane-propylene on silica gel) live entirely
  in Figs. 3-10 as points from four external papers, none on disk; even the
  pure-component inputs exist only as citations and as Fig. 2's
  already-integrated curves. This page must not be cited as evidence that
  IAST describes any real system. If the Szepesy & Illes tables (Acta Chim.
  Hung. 35, 37/53/245) are acquired, the four comparisons become a natural
  companion page.

  TIER 6 BY CONSTRUCTION: pairs L, U and S are illustrative parameter sets
  in arbitrary units, chosen for no physical system, and the page says so at
  every use. The magnitudes of the loop deficit (11.9 % of scale), the
  21.5 % and 64.2 % shortcut errors and the selectivity factor 4.39 are
  properties of those illustrative parameters; the SIGNS and the structural
  statements (deficit nonzero iff capacities differ, exactly linear in
  m2 - m1; selectivity constant iff shapes match) are the claims.

  EQ. (14) - the fugacity form for high pressure - is transcribed and NOT
  exercised: the paper prints no real-gas model to put in it, and the page
  says so rather than leaving it looking supported. Everything else the
  paper prints as an equation, (1)-(13) and (15)-(46), is exercised
  symbolically, numerically, or both; eqs. (1), (2), (4)-(8), (15)-(17) are
  exercised only through their printed consequences ((9), (17), (19)-(21),
  (23)-(26)), which is where the paper itself takes them.

  ORIGIN NOT CONSULTED, and nothing here derives from them: Szepesy & Illes
  (1963), Markham & Benton (1931), Lewis et al. (1950), Bering & Serpenskii
  (1952) - the four data sources; Arnold (1949), the rival model, judged
  here only in the paper's own words; Hill (1949, 1959, 1960), Young &
  Crowell (1962), de Boer (1953). The claim that Arnold's model is
  inconsistent is the PAPER's, quoted as such; the inconsistency this page
  proves is extended Langmuir's, from its own closed form.

  THE EQUAL-CAPACITY CLOSED FORM AND THE SHAPE-TRANSLATION RESULT are this
  page's derivations (standard results, stated without attribution because
  no source was consulted for them); both are proved symbolically on the
  page rather than cited.

  WHAT THE PAGE DOES NOT SETTLE: whether ideality (gamma = 1) holds for any
  real mixture - the paper's own empirical claim - and anything dynamic;
  breakthrough is J1.5, and this page's solver drops into that page's
  mixture-equilibrium slot.
