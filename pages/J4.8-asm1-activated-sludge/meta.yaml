validation:
  - "every ionic-charge balance closes to exactly zero as a symbolic identity in Y_H, Y_A, f_P, i_XB and i_XP, with no parameter values substituted"
  - "every nitrogen balance closes to exactly zero once a dissolved-dinitrogen component is added; without it process 2 leaves (1-Y_H)/(2.86*Y_H) g N unaccounted for"
  - "6 <!-- claim: cod_closed_count --> COD balances close to exactly zero, all but those of processes 2 and 3, whose residuals are exactly the rounding of 20/7 to 2.86 and 32/7 to 4.57. Substituting the exact fractions makes every balance exactly zero"
  - "of ten printed coefficients recovered by solving continuity for them, 8 <!-- claim: coefficients_recovered_identically --> come back symbolically identical and the other 2 <!-- claim: coefficients_recovered_up_to_rounding --> differ only by that same rounding"
  - "the paper's own equation (3) is reproduced exactly from column 2 of the transcribed matrix times the transcribed rate column, cross-checking three cells and three rate rows against separately typeset material"
  - "the pymrm plug-flow lane conserves nitrogen and charge to below 1e-8 <!-- claim: reactor_nitrogen_balance --> g m-3 d-1 (round-off) at every grid tried, against an oxygen demand of 652 <!-- claim: lane_otr --> g m-3 d-1"
  - "the same lane leaks 0.2071 <!-- claim: reactor_cod_leak --> g COD m-3 d-1, predicted to below 1e-8 <!-- claim: reactor_cod_leak_vs_prediction --> relative by the two stoichiometric residuals; with 20/7 and 32/7 the leak falls to below 1e-8 <!-- claim: reactor_cod_leak_exact_factors --> g m-3 d-1"
  - "the recycle is solved inside one Newton system; a fixed-point iteration on the inlet value, kept as a second route, agrees to below 1e-7 <!-- claim: recycle_routes_gap --> g m-3"
  - "grid refinement on n = 100 to 1600 is first order for effluent ammonia and soluble organic nitrogen (observed orders at least 0.9 <!-- claim: lane_order_min --> and at most 1.1 <!-- claim: lane_order_max -->); the other outlet values are not yet asymptotic on that ladder (orders below 0.8 <!-- claim: lane_order_preasymptotic_max -->)"

adds: >
  Nothing to the matrix, which is the paper's contribution and is exact, and
  whose checks run on sympy alone. pymrm carries the lane: a fourteen-component
  network on a conservative upwind grid with the internal recycle inside one
  Newton system (shapes_d inlet, exit-face outlet row). What the reactor adds is
  the use of the alkalinity column, which the paper calls "not essential" and
  equips with a threshold (50 g m-3 as CaCO3) that it never evaluates. Charge
  continuity fixes the arithmetic with no parameter in it: denitrification
  returns exactly half the alkalinity nitrification destroys, a ratio of
  2 <!-- claim: alk_nit_den_ratio -->, and the lane turns that into a design
  curve: with no unaerated volume this operating point needs
  3.37 <!-- claim: alk_need_f0 --> mol m-3 of raw-water alkalinity to stay above
  the paper's limit, a 30 % anoxic zone drops that to
  1.48 <!-- claim: alk_need_f30 --> and a 50 % one to
  0.26 <!-- claim: alk_need_f50 -->. The same sweep locates the nitrogen-removal
  optimum at an unaerated fraction of 0.50 <!-- claim: tn_optimum_fraction -->,
  8.73 <!-- claim: tn_at_optimum --> g N m-3 against
  26.85 <!-- claim: tn_no_anoxic --> with no anoxic zone.

agreement: >
  Not applicable in the experimental sense; the source paper contains no worked
  example, no calibrated plant and no dataset of its own. The numbers that matter
  are internal-consistency checks on the transcription. Charge and nitrogen
  continuity close to exactly zero on every process as symbolic identities;
  COD closes on all but two and the two residuals are exactly the printed
  rounding of 20/7 and 32/7, vanishing identically when the exact fractions are
  used. Printed coefficients are recovered from continuity alone, most of them
  identically. The pymrm lane inherits this exactly: nitrogen and charge balance
  to below 1e-8 <!-- claim: reactor_charge_balance --> g m-3 d-1, COD leaks
  0.2071 <!-- claim: reactor_cod_leak --> g m-3 d-1
  (0.032 % <!-- claim: reactor_cod_leak_fraction_of_otr --> of the oxygen demand)
  and the leak is predicted from the stoichiometry to below
  1e-8 <!-- claim: reactor_cod_leak_vs_prediction --> relative.

caveats: >
  No comparison with a measurement anywhere, by construction: this is the
  abbreviated report and its one data figure is borrowed from Ekama et al. (1986)
  to illustrate a measurement procedure. The page validates a transcription and
  its internal consistency, not a prediction. The continuity relations are NOT
  printed in this paper - they follow from the component definitions it does
  state, and the page derives them rather than quoting them. A fourteenth
  component S_N2 is added, without which nitrogen continuity cannot close on
  process 2; that is the only change made to the published matrix. Table 4 prints
  twenty parameter rows against the nineteen the paper says the model has, with
  the ammonification coefficient appearing twice (k_a = 0.016 and an undefined
  k_A = 0.08); both are recorded and the reactor is run at both rather than one
  being chosen by inference. The reactor operating point, the influent, the 1:1
  return-sludge blend and the geometric-mean parameter rule are ours, not the
  paper's; the paper supplies no example to reproduce. Plug flow with no axial
  dispersion, a settler treated as a perfect separation point, and mixed-liquor
  solids imposed at the lane inlet rather than set by a sludge age. Continuity
  constrains stoichiometry only - it says nothing about whether the rate
  expressions or the parameter ranges are right.
