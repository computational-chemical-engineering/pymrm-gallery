  resolution: "300 ppi, the native scan resolution; one pixel is 0.0279 points of conversion and 0.001939 units of the abscissa"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: >
    Axis calibration by a linear least-squares fit through 8 vertical and 7 horizontal grid
    lines; largest residual 0.000972 abscissa units and 0.0302 points of conversion. Each
    line is traced as the centre of its dark run per pixel column, with the dotted grid removed (grid
    columns replaced by the AND of their neighbours 4 px away, thin runs confined to a grid row deleted)
    and text labels masked; it is read at the abscissa nodes as the mean of two one-sided linear fits
    over 4 to 28 px from the node (the equilibrium lines are polylines with kinks at the nodes, EQUATIONS
    M7). Reading error = max(calibration residual, half line width) = 0.056 points; doubled for a node
    read from one side only, read from columns next to a text label or grid crossing ("fallback"), and for
    a measured symbol that overlaps the model line. Symbols are read as the centroid of the dark pixels
    within 8 px of a guessed position, grid pixels removed, iterated three times. Nodes where two lines
    are within one line width of each other (both equilibrium lines at the lowest temperatures) are
    left out: the reading cannot tell the lines apart.

