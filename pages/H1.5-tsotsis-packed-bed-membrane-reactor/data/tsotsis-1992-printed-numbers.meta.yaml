acquisition:
  method: table
  figure: "text of pp. 2905 to 2907 and the captions of Figs. 2a, 2b, 3a, 3b and 3c"
  resolution: "PDF pages 3 to 5 (journal page = PDF page + 2902) rendered at 300 ppi; every entry read from the page image"
