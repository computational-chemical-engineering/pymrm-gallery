status: complete

source:
  authors: ["Tsotsis, T. T.", "Champagnie, A. M.", "Vasileiadis, S. P.", "Ziaka, Z. D.", "Minet, R. G."]
  year: 1992
  title: "Packed bed catalytic membrane reactors"
  container: "Chemical Engineering Science 47(9-11), 2903-2908"
  doi: "10.1016/0009-2509(92)87149-K"
  access: >
    Scanned journal PDF held outside the repository, lawful access. No PDF and no page image is
