dataset_id: van-welsenaere-froment-1970-barkelew
title: What Van Welsenaere & Froment's Section 5 prints about Barkelew's diagram
status: complete

source:
  authors:
    - "Van Welsenaere, R. J."
    - "Froment, G. F."
  year: 1970
  container: "Chemical Engineering Science 25(10) 1503-1516"
  doi: 10.1016/0009-2509(70)85073-4
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

reprint_of:
  authors: ["Barkelew, C. H."]
  year: 1959
  container: "Chemical Engineering Progress Symposium Series 55 37"
  note: >
    Barkelew's own paper is pre-DOI, is not on disk and has no open-access
    route. It was NOT consulted. Van Welsenaere & Froment's Section 5 is
    explicitly a comparison with it: it reproduces his diagram as their Fig. 9,
    states what his axes mean, states the one numerical property of his
    critical locus (tau_m = 1.275 at the tangency), and applies their own
    criterion in his notation. Every claim this page tests is one of theirs
    about his method - not a claim lifted from his paper.

provenance_tier:
  tier: 6
  note: >
    THESE ARE NOT MEASUREMENTS. Barkelew's diagram is a correlation of his own
    numerical integrations, and every Van Welsenaere & Froment value here is
    likewise their own computed number. The page is validated against a
    published reference solution in the same sense as B1.1, F3.1 and D2.2, and
    must not be described as validated against experiment. Neither paper
    contains experimental data.

acquisition:
  method: table
  figure: >
    Section 5 and Section 6 (running text; the paper has no numbered tables),
    journal pages 1511-1513, plus the axis and curve labels printed inside
    Figs. 9 and 10.
  tool: "poppler pdftoppm at 600 dpi; values read from the rendered page image"
  procedure: >
    The Elsevier full-text API returns the publisher's OCR of the same 1970
    scan and discards the mid-dot decimal separator, so it renders 1.275 as
    `1275` and 0.01651 as `001651`. It was used only to locate Section 5 and to
    read its prose. Every number in this file was then read from a 600 dpi
    render of the printed page. Nothing was reconstructed by inference, and no
    value was digitised off a curve - the `label` and `axis` rows are printed
    text inside the figure frames, not traced positions. The marker positions
    on Fig. 9 (the crosses at the tangencies and the circles at tau_m/S = 1/S)
    were deliberately NOT measured, because that would be a figure digitisation
    and would need maintainer review; the page compares against the printed
    1.275 instead.
  operator: "Claude Opus 5 (assisted), reviewed by the gallery maintainers"
  date: 2026-08-01
  estimated_error: >
    None beyond the paper's own rounding. "Very close to 1.275" is itself a
    rounded summary of a quantity the paper reports as varying slightly with S,
    so it should be read as a nominal value, not a tolerance.

completeness:
  note: >
    Section 5 contains no other numbers. The comparison it draws in its Fig. 8
    - Barkelew's critical inlet pressures marked as circled crosses against
    their own curves - is presented graphically only, and those marker
    positions are not transcribed here. That is why this page recomputes both
    sides of that comparison from the two papers' criteria rather than reading
    it off the figure.

columns:
  - {name: quantity, unit: "-",    description: "symbol or short name"}
  - {name: value,    unit: varies, description: "value as printed"}
  - {name: unit,     unit: "-",    description: "unit as printed"}
  - {name: kind,     unit: "-",    description: "stated (a claim in the text), label/axis (text printed inside a figure), derived (their closed-form value), criterion, or integration (their Runge-Kutta)"}
  - {name: source,   unit: "-",    description: "where in the paper it is printed"}
  - {name: note,     unit: "-",    description: "what the number is"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3), which cannot be overridden
  by contract. No page image is reproduced.
