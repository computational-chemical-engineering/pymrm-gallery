dataset_id: akita-yoshida-1974-table4-bubble-sizes
title: "Bubble size distribution of one run, Table IV of the 1974 paper"
status: complete

source:
  authors: ["Akita, K.", "Yoshida, F."]
  year: 1974
  container: "Industrial & Engineering Chemistry Process Design and Development 13(1) 84-91"
  doi: 10.1021/i260049a016
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: "native 300 ppi bilevel scan, rendered with pdftoppm -r 300 and read from a crop of the table"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-19
  estimated_error: "none beyond the printed precision; every value is transcribed as printed"

conditions: >
  Glycol-O2 in the 15.0 cm square column at UG = 46.2 m/hr (table footnote), single
  orifice sparger. The last four rows are single bubbles, printed with their size
  in the range column. The printed column sums and the printed d_vs, d_g and sigma
  are rows of akita-yoshida-printed-numbers.csv. Bubbles under 0.8 mm were not counted.

columns:
  - {name: range_mm, unit: mm, description: "size class as printed (a single size for the last four rows)"}
  - {name: x_mm, unit: mm, description: "representative size, the geometric mean of the class limits"}
  - {name: n_bubbles, unit: "-", description: "number of bubbles counted in the class"}
  - {name: dF_pct, unit: "%", description: "number fraction of the class, x 100"}
  - {name: F_pct, unit: "%", description: "cumulative number fraction, x 100"}
  - {name: dmu2_mm2, unit: mm2, description: "contribution x^2 dF to the second moment"}
  - {name: dmu3_mm3, unit: mm3, description: "contribution x^3 dF to the third moment"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
