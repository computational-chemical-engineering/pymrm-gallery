dataset_id: akita-yoshida-printed-numbers
title: "Correlation constants and printed results of the 1973 and 1974 papers"
status: complete

source:
  authors: ["Akita, K.", "Yoshida, F."]
  year: 1973, 1974
  container: "Industrial & Engineering Chemistry Process Design and Development 12(1) 76-80; Industrial & Engineering Chemistry Process Design and Development 13(1) 84-91"
  doi: 10.1021/i260045a015, 10.1021/i260049a016
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: >
    Eqs 19 to 23 and 32 of the 1974 paper and Table IV read from 300 ppi crops;
    the remaining equations (1973 eqs 10 to 18, 1974 eqs 24 and 33) from 110 ppi
    renders of the whole page, on which every exponent is legible.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-19
  estimated_error: "none beyond the printed precision"

conditions: >
  The `paper` column says which paper prints the number; the `equation` column
  gives its equation or table. Fractions are kept as printed (1/8, 10/9) and
  converted by the page.

columns:
  - {name: name, unit: "-", description: "key used by the page"}
  - {name: printed, unit: "-", description: "the value as printed, a decimal or a fraction"}
  - {name: paper, unit: "-", description: "1973 or 1974"}
  - {name: equation, unit: "-", description: "equation or table number"}
  - {name: meaning, unit: "-", description: "what the number is"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
