dataset_id: akita-yoshida-1973-table2-ranges
title: "Ranges of the mass-transfer experiments, Table II of the 1973 paper"
status: complete

source:
  authors: ["Akita, K.", "Yoshida, F."]
  year: 1973
  container: "Industrial & Engineering Chemistry Process Design and Development 12(1) 76-80"
  doi: 10.1021/i260045a015
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: "native 300 ppi bilevel scan, rendered with pdftoppm -r 300 and read from a crop of the table"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-19
  estimated_error: "none beyond the printed precision; blank cells (temperature, diameter carried down) are filled from the row above as the table implies"

conditions: >
  Each row gives the range of gas velocity and of gas holdup over the runs of one
  system, not paired runs: the lowest holdup is taken to belong to the lowest
  velocity only because holdup rises with velocity in every figure of the paper.
  The Schmidt number of the sulfite row at 30.1 cm is blank in the table and is
  left blank. property_key is added by this page: the row of the 1974 Table II
  with the same liquid and temperature. Water at 30 C and the 3 and 7 cP glycerol
  solutions have no such row.

columns:
  - {name: system, unit: "-", description: "system as printed"}
  - {name: temp_C, unit: degC, description: temperature}
  - {name: D_cm, unit: cm, description: "column diameter (side of the square column where square = yes)"}
  - {name: square, unit: "-", description: "yes for the square cross-section column"}
  - {name: UG_lo_m_h, unit: m/hr, description: lowest superficial gas velocity}
  - {name: UG_hi_m_h, unit: m/hr, description: highest superficial gas velocity}
  - {name: eps_lo, unit: "-", description: lowest gas holdup}
  - {name: eps_hi, unit: "-", description: highest gas holdup}
  - {name: NFr_lo_e3, unit: "-", description: "Froude number UG/sqrt(gD) at the lowest velocity, x 1e3"}
  - {name: NFr_hi_e3, unit: "-", description: "Froude number at the highest velocity, x 1e3"}
  - {name: NBo_em3, unit: "-", description: "Bond number g D^2 rho/gamma, x 1e-3"}
  - {name: NGa_em10, unit: "-", description: "Galilei number g D^3/nu^2, x 1e-10"}
  - {name: NSc_em3, unit: "-", description: "Schmidt number nu/D_L, x 1e-3"}
  - {name: property_key, unit: "-", description: "matching row of akita-yoshida-1974-table2-properties.csv, added by the page"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
