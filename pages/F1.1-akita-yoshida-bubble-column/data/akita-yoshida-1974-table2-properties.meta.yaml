dataset_id: akita-yoshida-1974-table2-properties
title: "Liquid properties, Table II of the 1974 paper"
status: complete

source:
  authors: ["Akita, K.", "Yoshida, F."]
  year: 1974
  container: "Industrial & Engineering Chemistry Process Design and Development 13(1) 84-91"
  doi: 10.1021/i260049a016
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: "native 300 ppi bilevel scan (pdfimages -list), rendered with pdftoppm -r 300 and read from a crop of the table"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-19
  estimated_error: "none beyond the printed precision; every value is transcribed as printed"

conditions: >
  The liquids used with the perforated and porous plate spargers. The same values
  are used on the page to recompute the dimensionless groups the 1973 paper prints
  for the same liquids, so the 1973 groups test this transcription and the 1973
  property values at once. The 1974 Table IV run is "glycol-O2" with no
  concentration, so no row here is assigned to it.

columns:
  - {name: key, unit: "-", description: "row key used by the page"}
  - {name: liquid, unit: "-", description: "liquid as printed"}
  - {name: temp_C, unit: degC, description: temperature}
  - {name: density_g_cm3, unit: g/cm3, description: liquid density}
  - {name: viscosity_cP, unit: "1e-2 g/(cm s)", description: dynamic viscosity}
  - {name: surface_tension_dyn_cm, unit: "g/s2", description: surface tension}
  - {name: diffusivity_O2_1e-5_cm2_s, unit: "1e-5 cm2/s", description: diffusivity of oxygen in the liquid}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
