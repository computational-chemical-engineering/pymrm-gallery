fit_vs_test: >
  Fitted: nothing. No constant on this page is adjusted to make any comparison
  work; the only averaging is a diagnostic mean of the page's OWN computed
  late-time asymptote, on the stated window 12 <= theta <= 20. Every check is a
  test.

validation:
  - the pymrm finite-volume march (two interleaved fields via BlockLayout, exact Jacobian, newton per step) against the exact closed-form penetration law E = sqrt(6 X(theta)) derived on the page from the paper's Eqs. 21 + 27 (the two routes share no code); 3.4e-5 and 6.2e-5 max relative over every step with 0.1 <= theta <= 20 at g = 0.5 and g = 5
  - the gas and grain profiles at the cell centres against the exact profiles at theta = 0.25, 1 and 2, 2.9e-5 and 1.7e-5 on 600 cells
  - the same march with NumJac((n, 2)) for the pointwise terms reaches the same state (below 1e-10) at theta = 2, and the analytic Jacobian itself agrees with NumJac mid-march to below 1e-5, a measurement that a Jacobian missing a term fails
  - the simulated surface-grain history against B3.1's Yagi-Kunii eq. 6 (no film, omega = g/6), converging onto it at observed order 1.94 on 300 and 600 cells, 4.3e-4 at n = 600; the algebraic identity between the two printed functions is checked separately (4.4e-13, the film term at gamma = 1e12)
  - the theta = 0 gas profile against the exact sinh solution (the grain-model twin of the paper's printed Eq. 18), 4.8e-5 at n = 600
  - both axes refined with observed orders, grid 2.00 (against the exact solution) and time step 2.00 (successive differences, no reference needed); the time window crosses the surface burnout so the orders include the complementarity clamp firing; each finest difference is at least 1e3 times n^2 eps
  - mass balance split into its two parts - the spatial telescoping identity labelled structural (round-off), and the temporal closure gas-in vs solid-consumed, which closes to 1.0e-6 and catches Eqs. 21 and 27 transcribed with inconsistent resistance denominators (the break row moves it by orders of magnitude)
  - a dimensional run in cgs on the printed Fig. 7 base case against ell * E_exact(t/tau), closing the ell/tau/g reduction algebra end to end, 2.3e-4 with its own step ladder; on a domain of 6 ell instead of 30 ell the check fails
  - the late-time lag from the page's own computed curves against Delta = 1/4 + g/30, which the exact route satisfies exactly beyond theta*, 2.2e-4 and 1.2e-4 relative
  - a break table of one injected defect per row (shell resistance, sink area exponent, Eq. 21 vs Eq. 27 denominators, surface concentration, surface read-off, geometry index, far boundary, time scheme, ladder rungs, domain length, conversion levels of the zone width, band width of the departure map, eq. 6 cubic coefficient); every claim except the structural spatial identity is failed by at least one row, and the far-boundary row fails none, which is the domain-truncation statement

adds: >
  The exact closed form E.P. = ell * sqrt(6 X(theta)) for the semi-infinite
  grain model, derived from the paper's own equations via an exposure
  transformation - for their exact formulation the numerical integration
  Szekely and Evans ran was avoidable. From it: the diffuse reaction zone the
  paper could only plot becomes a number (a travelling zone of exactly constant
  width w(g)*ell, 0.295 cm for the printed Fig. 7 base case, from printed
  constants alone with no C0 required); the lag Delta = 1/4 + g/30 separating
  the grain model from the specimen-scale shrinking core, exact once the surface
  grains are consumed; and a 5 % departure map showing the window where neither
  textbook limit works growing with g over many orders of magnitude in time,
  up to the paper's base case g = 500. The pymrm
  march is validated against the exact law at second order in both axes, and is
  what survives every generalisation (gas holdup, non-first-order kinetics,
  evolving structure, finite pellet) that kills the closed form.

agreement: >
  Not applicable in the experimental sense; tier 6 by necessity - the source
  contains no measurements and its results exist only as figures. The numbers
  that matter: pymrm vs the exact law 3.4e-5 / 6.2e-5 (g = 0.5 / 5); profiles at
  the cell centres 2.9e-5 (gas) and 1.7e-5 (grain); surface reduction onto
  B3.1's eq. 6 at 4.3e-4, order 1.94; observed orders 2.00 (grid) and 2.00
  (time) including grain-exhaustion events; temporal mass balance 1.0e-6; dimensional closure on the printed Fig. 7 constants 2.3e-4;
  late-time lag vs 1/4 + g/30 to 2.2e-4.

caveats: >
  No experimental comparison, by construction: the paper prints no
  measurements, and its own claim is reproducing "general trends" using
  "reasonable values" - a trend claim, not a fit, which this page inherits and
  must not be presented as a validated prediction. The geometry is Part I's
  semi-infinite slab; the finite spherical pellet is Part II (CES 26 (1971)
  1901), unavailable as a readable scan. C0 is printed nowhere, so the
  absolute time axes of Figs. 6-19 cannot be reconstructed and no figure is
  digitised; the dimensional check uses a chosen, labelled C0 whose value
  cannot affect its verdict. The break table shows what each check is blind
  to; what no check on the page can catch is a model mis-statement shared by
  both routes AND by B3.1's closed form, bounded by B3.1's own independent
  validation and the native-render transcription. The far boundary of the
  truncated domain is invisible to every interior check once L is adequate;
  the domain length itself is tested by the dimensional check, which fails on
  a domain of 6 ell.
