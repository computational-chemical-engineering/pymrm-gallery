id: C2.5
slug: vandenbussche-froment-methanol-co2-route
title: "Methanol synthesis from CO2: does the printed kinetic model reproduce its own reactor simulations (Vanden Bussche and Froment)"
section: C
status: planned
tier: T1
priority: P1
structures: [S2]
phases: [gas-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

reference:
  authors: ["Vanden Bussche, K. M.", "Froment, G. F."]
  year: 1996
  container: "Journal of Catalysis 161, 1-10"
  doi: 10.1006/jcat.1996.0156

pymrm_min_version: "3.4.0"
runtime_seconds: 160
datasets:
  - vandenbussche-1996-table1.csv
  - vandenbussche-1996-table2.csv
  - vandenbussche-1996-table3.csv
