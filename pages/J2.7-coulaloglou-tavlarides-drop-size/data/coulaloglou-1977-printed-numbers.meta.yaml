dataset_id: coulaloglou-1977-printed-numbers
title: "Printed constants, figure captions, vessel data and the estimates of pp. 1295-1296"
status: complete

source:
  authors: ["Coulaloglou, C. A.", "Tavlarides, L. L."]
  year: 1977
  title: "Description of interaction processes in agitated liquid-liquid dispersions"
  container: "Chemical Engineering Science 32, 1289-1297"
  doi: "10.1016/0009-2509(77)85023-9"
  access: >
    Scanned journal PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    access. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: table
  figure: "eqs. 36 and 37 (p. 1294), Fig. 1 caption (p. 1293), Fig. 2 caption and the Experimental section (p. 1294), text of pp. 1295 and 1296"
  resolution: "PDF pages 5 to 8 (journal page = PDF page + 1288) rendered at 100 and 300 ppi from the native 300 ppi bilevel scan"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-24
  estimated_error: >
    None beyond the printed precision; entries are kept as printed strings (read with
    dtype=str). The scan drops most decimal points ("0 40", "2 8 x 10^-6"); each decimal
    point is placed from the restatement of the same number elsewhere in the paper
    (C1, C2 on p. 1296; C3, C4 on p. 1295). The OCR text layer is garbled and not used.
    Exponents of ten are written in e-notation.

conditions: >
  cgs units as in the paper's notation (pp. 1296-1297). The paper prints no physical
  properties, no tank diameter and no feed distribution ("Details are reported
  elsewhere", p. 1294). The unit of the Fig. 2 caption's omega_v is not printed.

columns:
  - {name: item, unit: "-", description: "short name"}
  - {name: printed, unit: "see meaning", description: "the entry as printed, a string"}
  - {name: page, unit: "-", description: "journal page"}
  - {name: meaning, unit: "-", description: "what the entry is, with its unit"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure or page image is reproduced; the figures are re-plotted
  from the extracted points.
