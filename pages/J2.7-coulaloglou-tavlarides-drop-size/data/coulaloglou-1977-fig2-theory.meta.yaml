dataset_id: coulaloglou-1977-fig2-theory
title: "The theoretical volume density curve of Fig. 2 (310 rpm, phi 0.10)"
status: complete

source:
  authors: ["Coulaloglou, C. A.", "Tavlarides, L. L."]
  year: 1977
  title: "Description of interaction processes in agitated liquid-liquid dispersions"
  container: "Chemical Engineering Science 32, 1289-1297"
  doi: "10.1016/0009-2509(77)85023-9"
  access: >
    Scanned journal PDF held outside the repository (~/papers/pymrm-gallery/), lawful
    access. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 2, journal page 1294"
  tool: "poppler pdftoppm at 300 ppi + pixel-column runs"
  procedure: >
    Ticks of both axes located as short dark runs inside the frame and fitted linearly
    (abscissa 0.1 to 0.9 mm, 1.17e-3 mm per px; ordinate 0 to 9 mm^-1, 0.0221 mm^-1 per
    px). The curve read as the centre of its dark run in pixel columns where it is
    separate from the two histograms, the arrow and the label.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-24
  estimated_error: >
    Tick fits: largest residual 8.5e-4 mm on the abscissa and 0.020 mm^-1 on the ordinate.
    Curve centre +-2 px: +-0.0023 mm and +-0.045 mm^-1; on the steep flanks the column
    run is long and the ordinate error is larger (up to +-0.2 mm^-1). Reliable for the
    peak; the tail beyond 0.49 mm merges with the histograms and is not read.
  completeness: >
    35 points from 0.128 to 0.495 mm; the tail beyond 0.495 mm is not read. The histograms are not digitised.

conditions: "Model curve at 310 rpm, phi 0.10, d32 0.250 mm (calc), per the caption."

columns:
  - {name: d_mm, unit: "mm", description: "drop diameter"}
  - {name: A_per_mm, unit: "mm^-1", description: "volume density A(d) as plotted (theory curve)"}

redistribution_basis: >
