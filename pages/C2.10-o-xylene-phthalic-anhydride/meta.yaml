# Page metadata. Validated against models.yaml by scripts/check_metadata.py.
# models.yaml is canonical; this file must not contradict it.
id: C2.10
slug: o-xylene-phthalic-anhydride
title: "o-Xylene to phthalic anhydride: the classic hot spot"
section: C
status: published
tier: T0
priority: P1
structures: [S2, S6]
phases: [gas-solid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "3.3.0"
runtime_seconds: 170
datasets:
  - froment-1967-parameters.csv
  - froment-1967-stated-results.csv

validation:
  - >-
    Transcription identities: four printed derived values recomputed from the
    printed primaries (Pe_hR = 5.25 to 0.13 %, U = 82.7 to 0.29 %, U = 86 to
    0.01 %, U = 88 to 0.29 %) plus N_A0 from the stated 44 g/Nm3 (0.52 %).
    These also settle the two European thousands separators (G = "4.684",
    dH3 = "-1.090") from the paper's own numbers.
  - >-
    The pymrm radial operator (nu=1, Robin wall on the outward normal) marched
    with the reaction off against the paper's printed Bessel-series
    heat-exchanger solution: 4.9e-5 relative at n_r = 80, observed order 2.0,
    error 1e6 times its integrator noise; the same check fails with nu=0 and
    with the wall-film sign flipped.
  - >-
    All eleven numerical statements the text makes about the case, in one
    table: five stated model results reproduce to 4.0 % mean, worst 8.6 % (the
    363 degC rise, which doubles every ~2 degC there); the 1-D runaway limit
    (363.93) lands inside the paper's bracket (363, 365], the 2-D limit
    (360.006) is at 360 within the input reading (359.964 with the printed
    Pe_hR = 5.25).
  - >-
    Second independent routes: hand-built FD + Radau against pymrm operators +
    BDF for the 2-D hot spot (4.8e-4 rel, different grids) and runaway limit
    (within 1e-3 degC on the same grid, both bisected to 1e-4); pymrm upwind BVP + Newton, cold-started,
    against the adaptive march for the 1-D hot spots (<= 4.4e-3, first order in
    n_z); the 2-D march with the integrator's finite-difference Jacobian against
    the exact one.
  - >-
    Grid refinement (order 2.0, n_r = 80 within 0.0022 degC of n_r = 160),
    integrator-tolerance sweep, insensitivity of the bisected runaway limit to
    the 150 degC cap over 100-250 degC, and the limit on n_r = 160.
  - >-
    Claims format 2: 77 claims (one structural), each other one failed by at least one of 94 break rows
    that re-run its computation (wrong nu, flipped wall sign, k2<->k3 swap,
    heat-Pe/mass-Pe confusion, Kelvin offset 273, both thousands separators
    taken literally, 44 read as mol/m3, ...).

adds: >
  The 1967 landmark rebuilt from the printed constants: both models, with tube
  classes in model.py that take a pointwise source (plug flow, no axial
  dispersion, constant coefficients). Beyond reproduction: the
  runaway limits located to 1e-4 degC (the paper probed whole degrees), giving
  a 1-D/2-D gap of 3.9 degC, so the paper's "within five degrees" survives
  being computed properly; the Pe_mR = 8 "completely negligible" claim checked
  at the runaway limit itself (a shift of 0.043 degC, a seventh of what 1 % of
  heat-transfer capacity does); and the heat-transfer sensitivity drawn as a
  curve (0.30 degC of runaway limit per percent of heat-transfer capacity)
  where the paper had two points.

agreement: >
  Five stated model results reproduce to 4.0 % mean absolute deviation, worst
  8.6 % on the 363 degC hot-spot rise (a quantity that doubles every ~2 degC
  of inlet temperature); the 2-D hot spot at 357 degC is 29.53 against "about
  30"; the 1-D runaway limit sits inside the paper's bracket and the 2-D limit
  is at the paper's 360 within 0.01 degC (360.006; which side of 360 is set by
  reading the printed or the recomputed Pe_hR, not by the numerics), gap 3.9
  degC against "within five degrees". Four printed
  transcription identities close to 0.29 % or better. The paper's "3 m is
  sufficient to reach the maximum" in phthalic anhydride at 357 degC is not
  reproduced: the maximum is at 6.6 m (at 360 degC it is at 3.2 m, almost).
  Nothing is fitted anywhere.

caveats: >
  Provenance tier 6, and reproduction rather than validation: the paper
  contains no experimental data, the kinetics are asserted by Froment as
  "fairly representative" (never fitted to data in this document), and every
  comparison target is his own 1967 computed result. Calderbank, the second
  name on the catalogue row, is not on disk. The absolute-temperature offset
  is unprinted (273.15 used; 273 shifts the 363 degC rise by 1.9 degC and
  every runaway limit by exactly 0.15 degC, since the model sees only T0 plus
  the offset). k2 and k3 have no
  independent witness anywhere on disk; the k2<->k3 break row is their only
  guard. Page 24's "G = 4.684" and "dH3 = -1.090 kcal/gram mole" are European
  thousands separators, and "44 gram moles/cu. meter" means 44 g/Nm3, all
  three resolved from the paper's own numbers, not by inference.
