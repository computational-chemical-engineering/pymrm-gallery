dataset_id: froment-1967-stated-results
title: Numerical results stated in the running text (pp. 24, 26, 27)
status: complete

source:
  authors:
    - "Froment, G. F."
  year: 1967
  title: "Fixed Bed Catalytic Reactors — Current Design Status"
  container: "Industrial & Engineering Chemistry 59(2) 18-27"
  doi: 10.1021/ie50686a006
  access: "institutional subscription, TU Eindhoven (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

acquisition:
  method: table
  figure: >
    Running text of journal pages 24, 26 and 27. No figure was digitised:
    every row is a number or claim the text states outright. Figures 7-14 are
    used qualitatively only.
  tool: "poppler pdftoppm at the scan's native 300 ppi; cropped renders"
  procedure: >
    Each statement was located in the prose, then its numbers re-read from a
    cropped native-resolution render. The "qualifier" column preserves the
    paper's own hedging ("about", "now found to be") so the notebook can
    weight the comparisons honestly.
  operator: "Claude Fable 5 (assisted), staged for maintainer review"
  date: 2026-08-05
  estimated_error: >
    The two hot-spot values carry the paper's own "about"; the runaway limits
    are integer-degree statements produced by probing whole degrees (Figure 12
    jumps from 363 to 365), so each limit is really a bracket of about 2 degC.

validation:
  independent_check: >
    The three printed U values (82.7, 86, 88) are recomputed in the notebook
    from the printed lambda_R and alpha_w via the paper's own formula to 0.3 %
    or better. The provenance tier is 6: every row is the authors' computed
    result, not a measurement, and the page says so.

columns:
  quantity: "short id of the stated result"
  value: "the number as the paper states it"
  unit: "unit of the stated value"
  model: "which of the paper's models (1D/2D) the statement is about"
  qualifier: "the paper's own hedge ('about', 'runs away at', ...), empty when stated bare"
  printed_where: "journal page of the statement (p. 25 material corrected from an earlier p. 26 miscitation, 2026-08-06)"
  statement: "the sentence, quoted or closely paraphrased, the number was read from"
