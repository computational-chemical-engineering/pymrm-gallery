dataset_id: wammes-1991-parameters
title: Physical properties, geometry, correlation constants and stated statistics
status: complete

source:
  authors:
    - "Wammes, W. J. A."
    - "Westerterp, K. R."
  year: 1991
  container: "Chemical Engineering & Technology 14(6) 406-413"
  doi: 10.1002/ceat.270140608
  access: "open access via University of Twente institutional repository (ris.utwente.nl)"
  licence: "all rights reserved (facts transcribed)"

acquisition:
  method: transcribed
  procedure: >
    All values read from 600 dpi page renders (pdftoppm -r 600), not from the
    OCR text layer, which mangles Tables 1 and 2 and every equation. Tables 1
    and 2, the packing and column geometry of Sections 1-2, the correlation
    validity ranges and error statistics of Sections 3.3-3.4, and the residual
    hold-up value of Section 3.4.1.
  operator: "Claude (Fable 5), builder agent"
  date: 2026-07-31
  estimated_error: >
    Transcription. The gas-density coefficients are checked against the ideal
    gas law at 293 K on the page (1.150 computed vs 1.15 printed for N2, 0.164
    vs 0.16 for He), and the fitted-range extremes are checked against the
    operating envelope (water at v_l = 16 mm/s on 3.2 mm packing gives
    Re_l = 51 vs the printed cap of 55; water/3.2 mm gives Ga_l = 3.21e5 vs
    the printed cap of 0.32e6).

columns:
  - {name: quantity, unit: "-", description: "parameter name"}
  - {name: value, unit: mixed, description: "value as printed (SI unless the unit column says otherwise)"}
  - {name: unit, unit: "-", description: "unit"}
  - {name: source, unit: "-", description: "where in the paper the value is printed"}

redistribution_basis: >
