validation:
  - >-
    The page's functions reproduce check values from a second route (closed forms,
    solve_bvp, gradient-root fits) before any claim; the coupled finite-volume values
    after Richardson extrapolation with the first- and second-order terms, the inlet
    face within 5.6e-8 <!-- claim: v3_fv_vs_bvp_c0 --> of solve_bvp
  - >-
    The pymrm coupled solve is first order on six nested grids (inlet face order
    0.99 <!-- claim: v2_order_c0 --> on the finest triple), its finest differences far
    above the round-off measured with a second column ordering, and it reproduces the
    closed forms for an inert gas and for nitrogen
  - >-
    Three misprints of the appendix measured at one test condition: the printed sign of
    A4 moves the outlet by -9.8 % <!-- claim: m1_A4_printed_sign_c_out_shift -->, the
    printed A19 by -2.4 % <!-- claim: m2_A19_printed_c_out_shift -->, the printed sign of
    b' by 65.4 % <!-- claim: m3_bprime_printed_c_out_shift -->

adds: >
  The coupled liquid-dispersion and gas plug-flow model that the paper named and set
  aside, solved as one Newton system on pymrm operators with the outlet values read on
  the faces and a refinement study; it is the truth against which the paper's two
  prescribed-gas evaluation models are measured. The closed forms need only
  find_roots.

agreement: >
  No measured profile is compared: the page tests the paper's evaluation for
  self-consistency at its operating points. Against the coupled model, constant-y
  evaluation gives 0.831 <!-- claim: s3_fit_cy_F10BCII --> of the true Stanton number
  for BC II water desorption and eq. 7 gives 0.943 <!-- claim: s3_fit_e7_F10BCII -->, a
  gain of at most 13.4 % <!-- claim: s3_eq7_gain_max --> over constant y at the four
  points, inside the paper's "up to 20 per cent": S3 holds. The plug-flow NTU evaluation
  gives 0.464 <!-- claim: s2_ntu_ratio_VL0p8_min --> to
  0.622 <!-- claim: s2_ntu_ratio_VL0p8_max --> of the dispersion-model Stanton number at
  the liquid flow of Fig. 9 and 0.812 <!-- claim: s2_ntu_ratio_VL2p5_min --> to
  0.908 <!-- claim: s2_ntu_ratio_VL2p5_max --> at the BC II water flow of Fig. 10, so S2
  holds for Fig. 11 as drawn and is not a general bound.

caveats: >
  The feed of the BC I absorption points and the Henry coefficient are not printed and
  are named assumptions; the measured profiles of Figs. 9 and 10 are not digitised, and
  Table 1 is the paper's regression of its own fits, so no kLa here is validated. kLa,
  the gas holdup and the gas velocity are constant along the column, as in the paper,
  and the gas is in plug flow without dispersion.
