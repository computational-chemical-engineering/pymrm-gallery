id: F2.1
slug: deckwer-bubble-column-dispersion
title: "Axial dispersion and kLa in tall bubble columns (Deckwer, Burckhart and Zoll, 1974)"
section: F
status: published
tier: T1
priority: P2
structures: [S7, S4]
phases: [gas-liquid]

authors:
  - name: "PyMRM Gallery contributors"
    orcid: null

pymrm_min_version: "3.4.0"
runtime_seconds: 30
reference:
  authors: ["Deckwer, W.-D.", "Burckhart, R.", "Zoll, G."]
  year: 1974
  container: "Chemical Engineering Science 29(11) 2177-2188"
  doi: 10.1016/0009-2509(74)80025-4
datasets:
