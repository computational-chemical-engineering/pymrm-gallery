dataset_id: deckwer-1974-fig10-feeds
title: "Feed concentrations marked on the ordinate of Fig. 10"
status: complete

source:
  authors: ["Deckwer, W.-D.", "Burckhart, R.", "Zoll, G."]
  year: 1974
  container: "Chemical Engineering Science 29(11) 2177-2188"
  doi: 10.1016/0009-2509(74)80025-4
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 10, p. 2183"
  tool: "poppler pdftoppm at 300 dpi, a 0.5 mg/l grid overlay on the ordinate"
  procedure: >
    Ordinate calibration from the ticks 9.0 and 6.0 at rows 1806 and 2024.5 (72.83 px per mg/l).
    Marker centres on the axis placed by eye.
  estimated_error: "0.03 mg/l (2 px)"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-23

conditions: >
  The two open circles cannot be assigned to one of the two BC I curves by shape; the page does not
  use them as feeds and takes c0 = 0.6 mg/l for the BC I absorption points as a stated assumption.

columns:
  - {name: marker, unit: "-", description: "marker shape on the axis"}
  - {name: curve, unit: "-", description: "curve of the same marker"}
  - {name: c0_mgl, unit: "mg/l", description: "feed concentration"}
  - {name: err_mgl, unit: "mg/l", description: "reading error"}
  - {name: assigned, unit: "-", description: "yes when the shape names one curve"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
