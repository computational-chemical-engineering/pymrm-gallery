dataset_id: deckwer-1974-operating-points
title: "Operating points of the ten profiles drawn in Figs. 9 and 10"
status: complete

source:
  authors: ["Deckwer, W.-D.", "Burckhart, R.", "Zoll, G."]
  year: 1974
  container: "Chemical Engineering Science 29(11) 2177-2188"
  doi: 10.1016/0009-2509(74)80025-4
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  resolution: "300 ppi crops of the figure legends (pp. 2182, 2183)"
  estimated_error: "none beyond the printed precision"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-23

conditions: >
  The Fig. 9 legend prints "u = 10.95 cm/s" with the subscript lost; read as uG0. The 0.7 N Na2SO4 solution has no Table 1 row; the page uses the water row of the same column (p. 2184: about the same as water), flagged proxy.

columns:
  - {name: id, unit: "-", description: "page key"}
  - {name: figure, unit: "-", description: "figure"}
  - {name: column, unit: "-", description: "BC I or BC II"}
  - {name: liquid, unit: "-", description: "as printed"}
  - {name: mode, unit: "-", description: "absorption from air or desorption into nitrogen (p. 2180)"}
  - {name: VL_m3h, unit: "m3/h", description: "liquid flow"}
  - {name: uG0_cm_s, unit: "cm/s", description: "superficial gas velocity at the entry"}
  - {name: table1_row, unit: "-", description: "Table 1 liquid used for kLa"}
  - {name: proxy, unit: "-", description: "yes when the liquid has no Table 1 row"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
