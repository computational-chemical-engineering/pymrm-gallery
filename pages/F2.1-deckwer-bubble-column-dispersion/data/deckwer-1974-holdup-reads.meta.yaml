dataset_id: deckwer-1974-holdup-reads
title: "Gas holdup at the operating points and along the Fig. 1 tap-water lines"
status: complete

source:
  authors: ["Deckwer, W.-D.", "Burckhart, R.", "Zoll, G."]
  year: 1974
  container: "Chemical Engineering Science 29(11) 2177-2188"
  doi: 10.1016/0009-2509(74)80025-4
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Figs. 1 (p. 2178), 2 (p. 2178) and 3 (p. 2179)"
  tool: "poppler pdftoppm at 300 dpi (the native scan resolution), axis frame and tick columns located from pixel sums, drawn lines traced on vertical pixel runs and checked on a 4x overlay with a 0.5 cm/s and 0.01 grid"
  procedure: >
    Calibration from the printed ticks, in page pixels: Fig. 1 uG0 3 at column 454 and 12 at 866
    (45.8 px per cm/s), eps_G 0 at row 2483 and 0.25 at 1916; Fig. 2 uG0 2.0 at 1358.5 and 8.0 at 1836,
    eps_G 0 at 1011.5 and 0.5 at 232.5; Fig. 3 uG0 1.0 at 856.5 and 5.0 at 1460.5, eps_G 0 at 1004 and
    0.25 at 240.5. Points are read on the drawn line of the matching liquid; the molasses points of BC II
    from the cluster of molasses markers at 0.95 cm/s, which no line joins.
  estimated_error: "0.01 in eps_G (line width and overlap of the BC I and BC II lines below 1 cm/s); 0.015 for the BC II molasses cluster"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-23

conditions: >
  Below 1 cm/s the BC I and BC II lines of Fig. 1 coincide within their width. The holdup enters the page only through 1 - eps_G in eq. 4 and the hydrostatic head.

columns:
  - {name: kind, unit: "-", description: "point or line"}
  - {name: id, unit: "-", description: "operating point id, empty for a line"}
  - {name: column, unit: "-", description: "BC I or BC II"}
  - {name: figure, unit: "-", description: "where it was read"}
  - {name: uG0_cm_s, unit: "cm/s", description: "gas velocity"}
  - {name: eps_G, unit: "-", description: "gas holdup"}
  - {name: err, unit: "-", description: "reading error"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
