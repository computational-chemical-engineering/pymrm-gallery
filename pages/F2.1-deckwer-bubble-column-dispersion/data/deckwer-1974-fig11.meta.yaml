dataset_id: deckwer-1974-fig11
title: "Fig. 11: the BC II kLa line and the dashed NTU line for tap water"
status: complete

source:
  authors: ["Deckwer, W.-D.", "Burckhart, R.", "Zoll, G."]
  year: 1974
  container: "Chemical Engineering Science 29(11) 2177-2188"
  doi: 10.1016/0009-2509(74)80025-4
  access: >
    Publisher PDF held outside the repository (~/papers/pymrm-gallery/), downloaded
    through an institutional subscription (TU Eindhoven). No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 11, p. 2184"
  tool: "poppler pdftoppm at 300 dpi, vertical pixel runs at fixed uG0"
  procedure: >
    Log axes from the frame: uG0 0.2 at column 737 and 20 at 1477 (370 px per decade), kLa 0.002 at
    row 2498 and 0.20 at 1756 (371 px per decade). Each kLa is the centre of the line's pixel run on the
    column of that uG0; the dashed line only where a dash crosses the column.
  estimated_error: "1 px in the line centre, 0.6 %; calibration 2 %, common to both lines and cancelling in their ratio"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-23

conditions: >
  The BC II line read lies 1.3 to 1.8 % above Table 1 (0.0274 uG^0.8), within the calibration error.

columns:
  - {name: uG0_cm_s, unit: "cm/s", description: "gas velocity of the read"}
  - {name: kLa_BCII_line, unit: "1/s", description: "solid BC II line"}
  - {name: kLa_NTU_line, unit: "1/s", description: "dashed NTU line"}

