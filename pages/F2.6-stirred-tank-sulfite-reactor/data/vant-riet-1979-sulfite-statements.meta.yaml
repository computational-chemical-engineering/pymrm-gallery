dataset_id: vant-riet-1979-sulfite-statements
title: "What van 't Riet (1979) says about the sulfite method, verbatim, with the numbers it prints there"
status: complete

source:
  authors: ["van 't Riet, K."]
  year: 1979
  container: "Industrial & Engineering Chemistry Process Design and Development 18(3) 357-364"
  doi: 10.1021/i260071a001
  access: >
    Publisher PDF held outside the repository (institutional subscription, lawful access).
    No PDF and no page image is stored in this repository.
  licence: "all rights reserved (short verbatim quotations and numeric facts; no figure or page image reproduced)"

acquisition:
  method: page-image transcription
  tier: 2
  operator: "Claude Opus 5.5 (assisted), 2026-11-28"
  date: 2026-11-28
  resolution: >
    Journal pages 357, 358, 359 and 361 (PDF pages 1, 2, 3 and 5; journal page = PDF page + 356),
    rendered with pdftoppm at 150 dpi and read from column crops. The scan's text layer was used
    only to find the passages: it substitutes digits and symbols (it returns k_R as "/eR" and
    "kYi"). Subscripts are written flat (O2, Na2SO3, kLA, kR, kL); the quotes are otherwise
    character for character.
  estimated_error: "none for the text; every value is a printed integer read as a string"

conditions: >
  The review's own voice on the sulfite method, rows the page tests. kR_shift_factor (25) is the
  effect of 5 % glycerin reported by Onken and Schalk (1977), the only magnitude of a k_R shift the
  review prints; it is not stated as the uncertainty of k_R in a clean experiment. The orders 1 and
  2 are Reith and Beek's (1973), as the review attributes them; the review names neither the gas nor
  what "low" partial pressure means. "1 to 2 M" (p. 359) is not said to be a salt molarity or an
  ionic strength; the page reports both readings against "10-100 g of sulfite/L" (p. 361). Rows
  already transcribed by page A3.7 (eq. 9, the k_L values, the 20-40 % accuracy, the Figure 4
  legend) are not repeated here: the page loads them from A3.7's CSVs.

columns:
  - {name: key, unit: "-", description: "identifier used in the notebook"}
  - {name: value, unit: "-", description: "the printed number, as a string (empty for a statement row)"}
  - {name: unit, unit: "-", description: "unit as printed (M = mol/L)"}
  - {name: journal_page, unit: "-", description: "page of the journal issue"}
  - {name: pdf_page, unit: "-", description: "page of the PDF"}
  - {name: statement, unit: "-", description: "verbatim quotation from the page image; 'see <key>' repeats the quotation of that row"}

redistribution_basis: >
  Short quotations for criticism and review (Art. 15a Auteurswet) and numerical facts, which are not
  protected by copyright. No figure or page image is reproduced.
