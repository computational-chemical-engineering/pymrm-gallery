dataset_id: onda-1968-table1
title: Table 1 of Onda, Takeuchi & Okumoto (1968) - gas absorption into organic solvents
status: complete

source:
  authors:
    - "Onda, K."
    - "Takeuchi, H."
    - "Okumoto, Y."
  year: 1968
  container: "Journal of Chemical Engineering of Japan 1(1) 56-62"
  doi: 10.1252/jcej.1.56
  access: "PDF on disk at ~/papers/pymrm-gallery/1_56.pdf"
  licence: "numerical facts extracted; no page image or figure reproduced"

conditions:
  what_it_is: >
    Journal page 57. The authors' own absorption runs: "the gas absorption of
    pure CO2 into methanol and carbon tetrachloride were carried out. The
    columns used were 6- and 12 cm I.D. and packed with 10~25 mm Raschig rings,
    Berl saddles, spheres and rods for 20~30 cm height." (page 57). The table
    reports each run reduced to the power law k_L a = alpha L^n, where L is the
    superficial liquid mass velocity; the paper's own words are "The mass
    transfer results are given in Table 1 as a relation of k_L a = alpha L^n."
  units: >
    The paper does NOT print units for alpha, and alpha's units depend on n, so
    alpha is not dimensionally interpretable without them. n is dimensionless
    and IS interpretable, and n is what this page uses. alpha is transcribed for
    completeness and is never used as an input to any computation on the page.
  L_range_not_printed: >
    The range of L spanned by these runs is NOT printed anywhere in the article.
    The abscissa of Fig. 2 is Re_L = L/(a_w mu_L), not L, and neither a_t nor
    a_w is tabulated for any of these packings. The page therefore does NOT
    attempt to compute a numerical n from Eq. (1) plus Eq. (2) for a given row;
    it uses only the STRUCTURAL WINDOW that the exponents of Eqs. (1) and (2)
    impose on n whatever L is, which needs no property data at all.

acquisition:
  method: table
  figure: "Table 1, journal page 57"
  tool: "poppler pdftoppm -r 300 (the scan's NATIVE ppi), table cropped and re-read at that resolution"
  procedure: >
    Straight transcription of the six printed rows. The table uses ditto marks
    (") for repeated cells; they are expanded here. Rows 4 and 5 carry a ditto
    in the Packings column meaning "Sphere", row 2-4 and 6 carry dittos in the
    Absorbent column, and rows 2-3 and 5 carry dittos in the Temp. column. The
    expansion is recorded explicitly so no reader has to reconstruct it:
      row 1  Raschig ring  10 mm    CCl4    25 C   0.120   0.70
      row 2  Berl saddle   1/2-in   CCl4    25 C   0.0862  0.73
      row 3  Sphere        1/2-in   CCl4    25 C   0.0227  0.86
      row 4  Sphere        1/2-in   CH3OH   20 C   0.0735  0.76
      row 5  Sphere        1-in     CH3OH   20 C   0.0389  0.83
      row 6  Rod           14 mm    CCl4    25 C   0.093   0.70
    Note row 6's alpha is printed to three significant figures (0.093) where
    rows 2-5 carry three decimals; that is as printed and is not padded here.
  operator: "Claude Opus 5 (assisted)"
  date: 2026-08-05
  estimated_error: >
    None beyond the printed precision. n is printed to two decimals throughout,
    so the exponent test on the page is quoted no finer than +-0.005.

validation:
  read_twice: >
    The table was cropped from the 300 ppi render and read at roughly 3x
    magnification, then re-read independently. All twelve numerals agree. The
    values most at risk in this typesetting are 0.0862 vs 0.0362 and 0.86 vs
    0.36; both were re-cropped individually.
  spread: >
    n spans 0.70 to 0.86 across six rows, a range of 0.16 - larger than the
    0.133-wide window Onda's own exponent set allows. That is a finding, not a
    transcription doubt, and it is the reason this table is on the page.

columns:
  - {name: row, unit: "-", description: "row index as printed, top to bottom (1-6)"}
  - {name: packing, unit: "-", description: "packing type, ditto marks expanded"}
  - {name: size_printed, unit: "-", description: "nominal size exactly as printed"}
  - {name: absorbent, unit: "-", description: "liquid absorbent, ditto marks expanded"}
  - {name: temp_C, unit: "degC", description: "run temperature, ditto marks expanded"}
  - {name: alpha, unit: "unstated", description: "prefactor of the fitted power law k_L a = alpha L^n; units not printed, never used as an input"}
  - {name: n, unit: "-", description: "exponent of the fitted power law k_L a = alpha L^n"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image and no figure
  is reproduced here or on the page.

caveat: >
  TIER 3 in origin - these six rows reduce the authors' own measurements - but
  they are NOT an out-of-sample test of Eq. (2), and the page says so in every
  place the comparison is made. Page 57 states that these very runs were
  replotted against Eq. (2) in Fig. 2: "Applying Eq. (1) to k_L a data obtained
  in this work and reported in the literature for organic solvents, the same
  plottings are shown in Fig. 2 in which the agreement of the observed values
  and Eq. (2) is also satisfactory." So Eq. (2) has seen this data. What the
  page tests against it is the one thing a fit cannot absorb: the exponent
  window, which is fixed by the exponent SET of Eqs. (1) and (2) and cannot be
  moved by either prefactor.

  Six rows, no replicates, no error estimate on either alpha or n, and no stated
  L range. Two of the six rows lie outside the window; with six points and no
  uncertainties that is a fact about the printed table, not a statistically
  quantified rejection, and the page states it that way.
