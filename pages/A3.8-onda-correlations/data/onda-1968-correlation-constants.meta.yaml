redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image and no figure
  is reproduced here or on the page.

caveat: >
  TIER 6 - these are the authors' fitted constants, not measurements. Eqs. (2)
  and (3) were fitted to the k_L a and k_G a data plotted in Figs. 1, 2 and 3,
  which include the authors' own runs of Table 1. Eq. (1) is carried over from
  ref. 18 (Onda, Takeuchi & Koyama 1967) and is not refitted here. Nothing on
  this page treats agreement between these constants and Table 1 as
  out-of-sample.

  Eq. (3) is BRANCHED: the prefactor 5.23 applies to the upper group of Fig. 3
  and 2.00 to "Raschig rings and Berl saddles smaller than 15 mm" (page 58),
  which the Conclusion on page 61 restates as "Raschig rings smaller than 15 mm
  and Berl saddles smaller than 1/2 in". Page 60 adds that for 1/2-in spheres in
  VAPORIZATION "the constant of Eq.(3) might be changed into 2.00" as well. Both
  branches are exercised on the page; the branch criterion is stated, not
  guessed.
