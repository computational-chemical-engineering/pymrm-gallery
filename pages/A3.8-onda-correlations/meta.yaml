validation:
  - "THE EQ. (4) IDENTITY, the only check that pins all four constants of eq. (3) at once. Eq. (4) is eq. (3) rearranged into a j_D factor for spheres and printed with no working, so recovering it tests 5.23, 0.7, 1/3 and -2.0 against a fifth printed number. A sympy reduction and a numerical evaluate-and-regress over 4000 random property combinations give 0.774443 <!-- claim: jd_prefactor_symbolic --> against the printed 0.771, +0.447 <!-- claim: jd_prefactor_dev_pct --> %, and the exponent -0.30 with a gap below 1e-12 <!-- claim: jd_exponent_dev -->; the routes agree below 1e-12 <!-- claim: jd_two_routes_spread -->. The Schmidt number cancels exactly, which is what tests the 1/3. The gap sits inside the printed precision of a_t D_p = 3.4: 3.4076 <!-- claim: jd_atDp_for_printed_0771 --> reproduces 0.771."
  - "A CEILING THE CORRELATION CANNOT EXCEED. Eqs. (1) and (2) force n = dln(k_L a)/dlnL into (2/3, 0.8 <!-- claim: window_hi -->] for any packing, liquid and flow rate; the window holds no prefactor, so no refit moves it. Analytic and numerical-differentiation routes agree below 1e-8 <!-- claim: n_window_two_routes -->. Of Table 1's six exponents, 4 <!-- claim: table1_n_inside --> lie inside and 2 <!-- claim: table1_n_above_ceiling --> (both spheres) above, the worst by 0.06 <!-- claim: table1_worst_excess -->. Null baselines beside it: mean |error| in n 0.0667 <!-- claim: mae_window_ceiling --> at the ceiling, 0.0967 <!-- claim: mae_null_no_area_coupling --> with no wetted-area coupling, 0.0533 <!-- claim: mae_null_fitted_constant --> for one fitted constant; paired over the six rows the gaps have t = 0.80 <!-- claim: t_ceiling_vs_no_coupling --> and 0.60 <!-- claim: t_fitted_vs_ceiling -->, so the table separates none of these point predictors, while every exponent exceeds 2/3 (t = 3.50 <!-- claim: t_n_above_no_coupling -->)."
  - "EQ. (4) AGAINST SHULMAN'S EQ. (5), the one comparison with data Onda did not fit (correlation against correlation): -14.95 <!-- claim: eq45_dev_at_X100_pct --> % at X = 100 to +12.12 <!-- claim: eq45_dev_at_X10000_pct --> % at X = 10,000, crossing at X = 1486 <!-- claim: eq45_crossover_X -->, mean over ln X 6.96 <!-- claim: eq45_mean_dev_pct --> %."
  - "THE COLUMN, AND WHAT EACH CONSTANT IS WORTH. Onda's eq. (6) as a pymrm counter-current BVP: Z* = 0.8063 <!-- claim: Z_star_m --> m for 95 % removal at the illustrative point, gas-side share f_G = 0.7497 <!-- claim: f_G_ref -->. Elasticities of Z to every constant by the chain rule, by differences on Z (below 1e-6 <!-- claim: elasticity_two_routes -->) and through the column solve (below 1e-5 <!-- claim: elasticity_column_route -->). Eq. (1)'s 0.75 is exactly inert when sigma_c = sigma (below 1e-14 <!-- claim: inert_075_reldev --> for a tenfold exponent) and worth 119.6 % <!-- claim: live_075_reldev --> of height for the same change at sigma_c/sigma = 0.85. Eq. (3)'s 1/3 doubled moves the height by 0.73 % <!-- claim: e_ScG_doubled_reldev -->, 0.024 <!-- claim: e_ScG_doubled_over_height_band --> of the paper's own +-30 % band on height."
  - "THE COLUMN AGAINST ITS CLOSED FORM. Van Leer faces solved by newton on the exact ConvFluxTVD Jacobian, deferred correction as a second route (below 1e-10 <!-- claim: col_routes_gap -->). Outlet read at the face with compute_boundary_values: 1.90e-6 <!-- claim: col_raw_reldev --> at 800 cells, orders 1.930 <!-- claim: col_order_face_min --> to 1.990 <!-- claim: col_order_face_max --> on 25 to 800 cells, Richardson limit below 1e-7 <!-- claim: col_richardson_reldev -->, solute balance below 1e-13 <!-- claim: col_imbalance -->. Read at the last cell centre: 7.29e-4 <!-- claim: col_cell_centre_reldev -->, order 1.020 <!-- claim: col_order_cell_finest --> on the finest triple, falling toward 1 from above."
  - "A DEFECT-INJECTION TABLE: every study reruns under each defect, injected through a call argument or a physical parameter (each printed constant, Table 1, one route of each two-route check, the limiter, the outlet reading, the flow direction, the solver tolerances, the duty). Every claim fails at least one row."

adds: >
  Eq. (6) as a boundary value problem instead of a quadrature: two counter-current
  convective fluxes, a per-cell linear coupling and outlet values read at the
  faces. Upwind faces give a linear problem and one sparse solve; van Leer faces
  make it nonlinear and newton on the exact ConvFluxTVD Jacobian solves it. That
  gives a third route to the elasticities of packed height, through the solved
  column. It adds no accuracy, the closed form is exact; the correlations, the
  eq. (4) identity and the exponent window owe pymrm nothing.

agreement: >
  Eq. (4) recovered from eq. (3) to +0.447 <!-- claim: jd_prefactor_dev_pct --> %,
  inside the printed precision of a_t D_p = 3.4. Two of Table 1's six exponents
  sit above the ceiling of the window eqs. (1) and (2) allow, by up to
  0.06 <!-- claim: table1_worst_excess -->. The pymrm column meets its closed
  form to 1.90e-6 <!-- claim: col_raw_reldev --> at 800 cells, second order.

caveats:
  - "NOT AN OUT-OF-SAMPLE TEST. Eqs. (2) and (3) were fitted to the data of Figs. 1 to 3, which include the Table 1 runs (page 57). The window is the only quantity a refit could not absorb, and it is scored on six rows with no error bars."
  - "a = a_w, Onda's central assumption, is untestable from this article: a_w never appears except multiplied by a coefficient. No break row can be written for it."
  - "The illustrative absorber is a page choice: air and water at 25 C from standard tables, sigma_c/sigma = 0.85, m = 1, G = 2000 kg/(m2 hr) and the 95 % duty. The geometry a_t D_p = 6(1-eps) = 3.4 for spheres is Onda's (page 58) and the only one the article supplies. Every elasticity is printed with f_G and phi, which carry the operating-point dependence."
  - "The L range of Table 1's runs is not printed, so no n is computed for an individual row; the comparison uses only the window, which needs no property data."
  - "The four error bands (+-20 %, +-20 %, +-30 %, +-30 %) are the authors' assessments of their own fits; they are quoted as claims and used only as the scale against which the 1/3 is judged unseen."
  - "No three-way comparison with Billet-Schultes (A3.9) or Rocha-Bravo-Fair (A3.10): neither source is on disk."

reference:
  authors:
    - "Onda, K."
    - "Takeuchi, H."
    - "Okumoto, Y."
  year: 1968
  container: "Journal of Chemical Engineering of Japan 1(1) 56-62"
  doi: 10.1252/jcej.1.56
  note: >
    Identified by READING the article - the file on disk is named `Onda1968-gas-liquid-mass-transfer-packed-columns-JCEJ1-56.pdf` and
    a bare numeric filename carries no metadata. Journal page 56 carries the
    title, the three-author byline and the affiliation; the running feet read
    "VOL.1 NO.1 1968" and the folios run 56-62. The DOI was then VERIFIED against
    CrossRef, which returns the same title, the same three surnames, the same
    container, volume 1, issue 1, pages 56-62, 1968. It is not an auto-resolution
    from a terse citation.

    All equations and table cells were read from renders at the scan's NATIVE
    300 ppi (pdfimages -list reports CCITT-G4 bilevel at 300 ppi throughout, so a
    larger render only interpolates), each cropped to a single line and re-read at
    that resolution. The PDF is encrypted RC4 with copying permitted and has no
    usable text layer for numerals.

    Two other articles share the same seven-page PDF and neither is used for its
    own content: page 56 opens with the closing column of a preceding
    bubble-column paper, and page 62 begins "Gas absorption with chemical
    reaction in packed columns" by Onda, Sada and Takeuchi. That companion
    article is used for exactly one purpose - it reprints eqs. (1)-(3) verbatim,
    giving the second printing against which the transcription is checked.

origin_not_consulted: >
  Eq. (1) is not derived in this article. It is carried over from ref. 18, Onda,
  K., Takeuchi, H. and Koyama, Y., Kagaku Kogaku 31, 126 (1967), which is NOT on
  disk and was not consulted. The 1968 article prints eq. (1) in full and uses it
  throughout, which is what this page builds on; nothing about the 1967 paper is
  claimed. That reference is also where the critical surface tensions sigma_c of
  the packing materials live - they appear nowhere in the 1968 article - which is
  why sigma_c/sigma is carried here as a swept page parameter rather than a
  looked-up constant.

  Eq. (5) is Shulman, H. L., Ullrich, C. F., Proulx, A. Z. and Zimmerman, J. O.,
  AIChE Journal 1, 253 (1955), ref. 22. Not on disk and not consulted; the page
  uses only the correlation as Onda reprints it on page 59, with attribution, and
  makes no claim about Shulman's data or scatter.

