dataset_id: voorhies-1945-tableI
title: "Fixed-bed catalytic cracking of East Texas gas oil, 2-hour process periods: carbon on feed and on catalyst vs feed rate and temperature"
source:
  authors: ["Voorhies, A. Jr."]
  year: 1945
  container: "Industrial & Engineering Chemistry 37(4) 318-322"
  doi: 10.1021/ie50424a010
  access: institutional subscription (lawful access; ACS download stamp on the PDF)
  licence: all rights reserved (facts extracted; no page image reproduced)
acquisition:
  method: table
  figure: "Table I, journal page 320"
  operator: builder agent (B2.1)
  date: 2026-08-08
  estimated_error: >
    None from transcription: every cell was read from cropped renders at the
    scan's native 300 ppi, at digit scale, and the whole table is cross-checked
    on the page by the mass-balance identity between its two carbon columns
    (a mis-read digit breaks the identity for its row; see the page's Check 1).
    The printed values themselves are rounded to 2 significant figures
    (carbon), 1 F (temperature), 0.1 v/v/hr (feed rate).
columns:
  - {name: catalyst,       unit: "-",      description: "natural (activated clay) or synthetic (silica-alumina); the paper's two column groups"}
  - {name: block,          unit: "-",      description: "1-4, the four nominal-temperature clusters the table separates with whitespace (not printed as a number)"}
  - {name: feed_rate_vvhr, unit: "1/h",    description: "U, feed rate in volumes of feed per volume of catalyst per hour, as printed"}
  - {name: temp_F,         unit: "degF",   description: "cracking temperature, as printed"}
  - {name: C_feed_wtpct,   unit: "wt%",    description: "carbon as weight per cent on feed, as printed"}
  - {name: C_cat_wtpct,    unit: "wt%",    description: "carbon as weight per cent on catalyst, as printed"}
notes:
  process_period_min: 120
  measurement_method_quote: >
    "After each run the catalyst was discharged from the unit and analyzed for
    carbon by combustion; and a fresh batch of catalyst was installed for the
    next run." (p. 320, left column). One carbon determination per run; the
    page shows the two carbon columns are consistent, at the printed rounding,
    with both being computed from that single determination through the run's
    fixed feed-to-catalyst mass ratio.
  glyph_note: >
    The synthetic 911 F row's feed rate prints 1.1 (verified at 4x on the
    native render, twice; a whole-page read mis-gives it as 1.0). The natural
    793 F row also prints 1.1. Both are transcribed as printed. The mass-balance
    identity mildly disfavours 1.1 for the synthetic row (its implied W/U is
    6 % below its block mates where 1.0 would leave it 3 % high); the glyph is
    unambiguous, so 1.1 stands and the tension is reported on the page.
  fit_test_label: >
    These rows are the paper's own supporting evidence for its feed-rate
    independence claim and the data behind its Fig. 2 temperature claim.
    Nothing on the page is fitted to them; but every comparison of a printed
    CLAIM against these rows is a consistency check of the paper with its own
    data, not validation against held-out measurement.
redistribution_basis: >
  Numerical values are facts, not protected by copyright (Feist, 1991);
  extraction for scientific research is covered by Art. 15n Auteurswet
  (DSM Art. 3). No page image is reproduced.
