dataset_id: voorhies-1945-printed-constants
title: "Voorhies (1945): the printed correlation constants, exponents and quantitative prose claims"
source:
  authors: ["Voorhies, A. Jr."]
  year: 1945
  container: "Industrial & Engineering Chemistry 37(4) 318-322"
  doi: 10.1021/ie50424a010
  access: institutional subscription (lawful access; ACS download stamp on the PDF)
  licence: all rights reserved (facts extracted; no page image reproduced)
acquisition:
  method: table
  figure: "equations (1)-(8) and prose, pp. 319-322; each read from a cropped native-resolution render"
  operator: builder agent (B2.1)
  date: 2026-08-08
  estimated_error: >
    None from transcription (digit-scale crops; the coefficients and exponents
    of eqs. (1)-(3) and (5)-(7) ARE the case and were each read individually).
    The eq. (5) triple (96, 0.34, 0.19) is additionally pinned by arithmetic:
    the page re-derives it from eqs. (2)-(4) to 95.71 / 0.3413 / 0.1911, so
    every printed digit is confirmed as the rounding of the exact chain.
columns:
  - {name: item_id,       unit: "-", description: "stable key used by the page"}
  - {name: printed_value, unit: "mixed", description: "the value exactly as printed (units per statement)"}
  - {name: statement,     unit: "-", description: "what the paper says, with fit/figure-only provenance where relevant"}
  - {name: where,         unit: "-", description: "journal page and location"}
notes:
  fit_test_label: >
    Eqs. (1), (2), (3), (6), (7) are the AUTHOR'S fits to figure-only data
    (Figs. 1, 3, 5); their coefficients and exponents are transcribed and
    cannot be refit from anything printed. Eq. (5) is printed algebra, checked
    exactly. The doubling claim is the author's reading of Table I via Fig. 2,
    so testing it against Table I is a goodness-of-fit check, not validation.
redistribution_basis: >
  Numerical values are facts, not protected by copyright (Feist, 1991);
  extraction for scientific research is covered by Art. 15n Auteurswet
  (DSM Art. 3). No page image is reproduced.
