  0.34130 <!-- claim: eq5_expU_symbolic --> / 0.19113 <!-- claim: eq5_expTheta_symbolic --> by two routes with independent
  solvers (symbolic isolation with exact rationals; the same isolation root-found
  numerically with pymrm.checks.find_roots plus regression - their agreement, below
  1e-9 <!-- claim: eq5_route_gap_max -->, checks the solvers, the printed digits check the shared
  step); none of the six <!-- claim: eq5_misreadings_total --> leading-digit or exponent-scale
  misreadings of the five input constants tried hits the printed triple, while 6 <!-- claim: eq5_last_digit_alternatives_matching -->
  of the 10 <!-- claim: eq5_last_digit_alternatives_total --> last-digit +-1 alternatives still round to it - those
  final digits rest on the digit-scale crops, read independently twice (transcription and
