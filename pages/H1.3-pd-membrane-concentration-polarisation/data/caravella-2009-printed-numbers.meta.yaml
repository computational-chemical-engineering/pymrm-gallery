dataset_id: caravella-2009-printed-numbers
title: "Printed constants, operating conditions and stated ranges of Caravella, Barbieri and Drioli (2009)"
status: complete

source:
  authors: ["Caravella, A.", "Barbieri, G.", "Drioli, E."]
  year: 2009
  title: "Concentration polarization analysis in self-supported Pd-based membranes"
  container: "Separation and Purification Technology 66, 613-624"
  doi: "10.1016/j.seppur.2009.01.008"
  access: >
    Publisher PDF (12 pages; text and equations as vector text, figures embedded as
    200 ppi greyscale images) held outside the repository, lawful access. No PDF and no
    page image is stored in this repository.
  licence: "all rights reserved (facts extracted; no figure or page image is reproduced)"

acquisition:
  method: table
  figure: >
    Eq. (7) and Eq. (9) (p. 616), Table 4 (p. 618), Table 5 and the text of section 5
    (p. 623), the text labels of Fig. 9 panels and caption (p. 622) and of Fig. 10b (p. 623)
  resolution: "pages rendered at 300 ppi from the vector text layer; journal page = PDF page + 612"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    None beyond the printed precision: entries are kept as printed strings (read with
    dtype=str) and compared in half-units of their last printed digit. Each entry was read
    from the page image. Fig. 9 prints its reference flux as 'Flux^Referene' (sic). Table 4
    prints the Reynolds range with an approximately-equal sign and Table 5 'Re' with a
    tilde-equals sign: both are approximate by the paper's own notation.

conditions: >
  Fig. 9: 500 degC, retentate 1000 kPa, permeate 200 kPa (pure H2), x_H2 = 1 for the
  reference flux. Table 5: the validation against Peters et al., H2:N2 50:50, 400 degC,
  2.2 micrometre membrane, permeate 1.01 bar, feed 3 to 26 bar, Re about 115.

columns:
  - {name: item, unit: "-", description: "short name"}
  - {name: printed, unit: "-", description: "the entry as printed, a string"}
  - {name: page, unit: "-", description: "journal page"}
  - {name: meaning, unit: "-", description: "what the entry is, with its unit"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist Publications v.
  Rural Telephone, 1991). Extraction for scientific research by a research organisation
  with lawful access is covered by Art. 15n Auteurswet (implementing DSM Directive (EU)
  2019/790 Art. 3). No figure or page image is reproduced.
