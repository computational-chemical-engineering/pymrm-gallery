title: "Figure reads: the model's H2 flux and CPC of Fig. 10 at the four dashed guides"
status: complete

source:
  authors: ["Caravella, A.", "Barbieri, G.", "Drioli, E."]
  year: 2009
  title: "Concentration polarization analysis in self-supported Pd-based membranes"
  container: "Separation and Purification Technology 66, 613-624"
  doi: "10.1016/j.seppur.2009.01.008"
  access: >
    Publisher PDF held outside the repository, lawful access. No PDF and no page image is
    stored in this repository.
  licence: "all rights reserved (facts extracted; figure not reproduced)"

acquisition:
  method: digitised
  tool: "pixel script on the embedded image (556 x 870 px, 200 ppi greyscale), extracted with pdfimages"
  figure: "Fig. 10a (model curve, 'Results of the present model') and Fig. 10b (model points), p. 623"
  resolution: >
    200 ppi (native). Calibration from the frame lines: panel (a) 1.8 mol m-2 s-1 at
    pixel row 15.5 and 0.8 at row 385.5; panel (b) CPC 1 at row 427.5 and 0 at row
    797.5 (370 px per axis span); feed pressure from the tick columns 111 (10 bar) and
    316 (20 bar), which puts the four dashed guides at 10, 15, 20 and 26.0 bar.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    Figure reads, not printed numbers. About 2 px, i.e. +-0.005 in flux (mol m-2 s-1) and
    +-0.005 in CPC. At 15 and 20 bar the flux curve passes behind the data triangles, so
    the value there is the linear interpolation of clean columns on either side (columns
    200/228 and 296/326). At 15, 20 and 26 bar the model point overlaps the curve or a data
    diamond; its centre is taken from the upper edge of the disc (radius 5 px).

conditions: >
  Table 5 conditions: H2:N2 50:50, 400 degC, 2.2 micrometre membrane, permeate 1.01 bar,
  Re about 115. The model points are the arithmetic mean of the inlet and outlet fluxes
  (p. 623).

columns:
