validation:
  - >-
    VALIDATION AGAINST MEASUREMENT (tier 2, four values printed in the review's
    running text). Funke et al.'s n-hexane / 3-methylpentane permeation
    selectivity of 24 is reproduced as 25.0, +4.3 %, from nothing but the
    Table 2 pure-component isotherm fits and the single printed diffusivity
    ratio of nC6 to 3MP. Nothing was fitted, and the three things
    that were CHOSEN are swept at the point of comparison, because the review's
    one sentence about that run fixes none of them: whether "15 kPa" is the
    total or the per-component pressure, the feed composition, and the printed
    diffusivity ratio taken as exact. The alternatives span a factor of
    1.57, against a +4.3 % agreement with a measurement printed to two figures.
  - >-
    Bakker's two methane / n-butane selectivities are NOT reproduced
    quantitatively and the page says so. The M-S model with finite exchange
    coefficients gives 1.28x and 3.4x the two measurements; with the exchange
    coefficients removed it is 31x and 11x TOO LOW. Both measurements lie
    between the two models, nearer the finite-exchange one on a log axis (0.93
    and 0.66 of the way from the infinite-exchange model), so the data favour
    finite exchange while agreeing quantitatively with neither.
  - >-
    REPRODUCTION of the review's own computed results: the five printed
    permeation selectivities and the four printed mixture fluxes, worst
    0.74 %. The selectivities involve neither the membrane thickness nor the
    framework density, which cancel; and those two, the unit-cell mass and
    Avogadro's number cancel identically out of the four fluxes too, which the
    page demonstrates by swinging the density over a factor of four, so the
    flux comparison tests the mixture physics and not the thickness.
  - >-
    THE TRANSIENT IS GRID-REFINED UNDER THE TRANSIENT, which carries a
    self-sharpening n-butane front the steady profile does not have (the
    largest cell-to-cell jump in the nC4 loading reaches 21x its steady value).
    Refined in space over four grids (observed order 2.01 on the finest three)
    and in time over three step sizes, the methane peak arrives
    9.8 % before the printed 0.73 s, the one real disagreement on the page; it
    needs delta +5.3 % to close and is left as an open tension with its
    candidate causes named. The two peak heights are 1.2 % and 1.8 % above the
    printed values.
  - >-
    TWO PRINTED NUMBERS ARE NOT REPRODUCED AND BOTH ARE INVESTIGATED. The
    Henry-limit sorption selectivity: Table 1 gives 2649.9 against the printed
    2200, by two independent routes, and every single-parameter change to the
    C1 or nC4 row that would give 2200 moves A4.7's certifying flux-ratio
    check by 4.2 % to 24 %. The multicomponent-Langmuir counterfactual: its
    structural claim holds (S_P constant within a factor of 1.024 over five feed
    compositions, where IAST spans 3.2) and its value does not (1682 against
    the printed 800).
  - >-
    Internal checks, each with a second route and a break row: IAST forward /
    inverse round trip, the closed-form surface potential against quadrature,
    IAST against the multicomponent Langmuir at equal capacities, [Gamma] by
    implicit differentiation against central differences, and [B] against the
    friction system of eq. (42) solved matrix-free by GMRES. Three algebraic
    identities the review uses are labelled as such and not scored.
  - >-
    The steady solve is pymrm.newton with monotone damping on ln(Theta), direct
    from a linear profile for every production case; pymrm.continuation in the
    feed pressure reaches the same root. div N = 0 is checked on every steady
    solve. The steady grid order is 2; the downstream sweep
    pressure and the unstated loading dependence of the exchange coefficients
    are both measured and both small.
  - >-
    A break table re-runs every computation with a defect injected (IAST
    replaced by the Langmuir, the exchange removed or its exponents swapped,
    [Gamma] simplified, the slab solved as a cylinder, a Table 1 or Table 2
    parameter misread, the data files read one row off, the grids and step
    studies read one level off), and every claim that is not an identity
    fails at least one row.

adds: >
  The review's mixture results are reproduced, not improved on. Six things are
  not in it. (1) Its own experimental comparisons are scored, and the words
  validation and reproduction are kept apart: Funke's measurement is matched to
  4.3 % with nothing fitted, inside a 1.57x band of three readings the review's
  one sentence about that run leaves open, while Bakker's two come out 1.28x
  and 3.4x, the second passed over by the review without comment. (2) The
  printed Henry-limit selectivity of 2200 does not follow from Table 1, and no
  single-parameter transcription slip in the two Table 1 rows explains it
  without breaking A4.7's certifying check. (3) A4.7's reconstructed membrane
  thickness is tested on the one power of delta the page carries, the transient
  peak time, and it misses by 9.8 %. (4) Two structural claims of the review
  are separated from its numbers: the multicomponent Langmuir does make S_P
  composition-independent, and its printed 800 is not reproduced; the hexane
  thresholds are true but loose. (5) Every check on the coupled machinery has a
  second route that shares no code with the first. (6) The review's own
  counter-example, zeolite 4A, where the exchange coefficients are effectively
  infinite, is carried rather than dropped.

agreement: >
  VALIDATION (measurement): Funke et al.'s mixture selectivity to +4.3 %;
  Bakker's two to 1.28x and 3.4x, reported as disagreement. REPRODUCTION: nine
  steady-state targets, worst 0.74 %; the two transient peak heights 1.2 % and
  1.8 % high; the peak time 9.8 % early, the one real disagreement, needing
  delta +5.3 % to close and left open. Two printed numbers are not reproduced
  and are reported as findings: the Henry-limit selectivity and the
  multicomponent-Langmuir counterfactual. Nothing is fitted.

caveats: >
  TIER 2, BUT READ THROUGH A REVIEW. The four measured selectivities come from
  Bakker's PhD thesis and Funke et al., neither of which is on disk or was
  consulted; both are recorded under origin_not_consulted. A wrong number in
  the review would travel into this page undetected, and the review states no
  uncertainty for any of the four. Everything else on the page is the authors'
  own computed output, and comparing against it is reproduction, not
  validation.

  THE MEMBRANE THICKNESS IS A RECONSTRUCTION, NOT A PRINTED VALUE, AND EXACTLY
  ONE QUANTITY ON THE PAGE CARRIES IT: the transient peak time, which disagrees
  with the printed one. Every selectivity and the four mixture fluxes are
  independent of it. The Si96O192 unit-cell mass and its atomic masses are
  hard-coded and traceable to nothing printed in the review; they cancel out of
  everything except the peak time.

  MODELLING CHOICES THE REVIEW DOES NOT FIX, all measured rather than assumed:
  the loading dependence of the exchange coefficients inside the mixture, the
  downstream sweep pressure, the single-site affinity of the
  multicomponent-Langmuir counterfactual, and for the Funke comparison the
  meaning of "15 kPa" and the feed composition. The self-diffusivity section
  applies eq. (19) to the total occupancy, a choice the review does not state;
  its facile-to-finite ratios do not depend on it, and it has no printed target.

  SCOPED OUT: Sections 4.4-4.7 and the MD/KMC verification of Figs. 17-21, all
  validated only by figures with no printed numerical result. The review's
  zeolite 4A conclusion points the other way and is carried on the page.

  TWO PRINTED DEFECTS on the mixture side, neither repaired silently: eq. (37)
  is printed "L_ij = L_ij" where the Onsager reciprocal relations require
  L_ij = L_ji, and the caption of Fig. 21 repeats the subscript 1 where the
  second must be 2 (the running text of Section 3.4 supplies the correct pair).
  Both readings come from the Elsevier full text; no page image of this paper
  is on disk. Eq. (60) is read as a compound fraction, the same reading as
  eq. (61) and as the review's own worked value, and is not a defect.
