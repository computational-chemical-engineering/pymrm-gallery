redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image, figure or
  full-text excerpt is reproduced.

caveat: >
  TIER 2, AND READ THROUGH A REVIEW. These four numbers are measurements, so
  comparing against them is VALIDATION rather than reproduction, and the page
  keeps that word for these four rows alone. But they were read from a review
  article, not from the papers that made them: neither Bakker's thesis nor
  Funke et al. is on disk, both are recorded under origin_not_consulted, and
  nothing here has been checked against either original. A wrong number in the
  review would travel straight into this file undetected. The review reports no
  uncertainty for any of the four.

  The Funke rows carry one further inference, stated rather than hidden: the
  review gives 362 K for its own Section 4.3 simulations and does not restate a
  temperature beside the measured 24, so the temperature column for those rows
  is the section's temperature and not a value printed beside the measurement.
  Nothing on the page uses that column.
