redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No page image, figure or
  full-text excerpt is reproduced.

caveat: >
  TIER 6. Every row is the authors' own computed output. Reproducing them
  establishes that this page implements the review's mixture equations and reads
  its parameters correctly - it is REPRODUCTION, not validation. The page's
  tier-2 rating comes from the separate file of measured selectivities, not from
  this one.

  Three rows are the authors' readings off their own figures rather than printed
  computed results and are marked in the CSV; one of them
  (hex_SP_3MP_DMB_ternary) is a lower bound rather than a value. None of the
  three is folded into the page's headline deviation.

  Two printed defects were found on the mixture side and neither is repaired
  silently: eq. (37) is printed as "L_ij = L_ij" in the sentence stating that
  the Onsager reciprocal relations require [L] to be symmetric, where it must be
  L_ij = L_ji (nothing on the page uses eq. 37 - the Onsager matrix is never
  formed); and the caption of Fig. 21 prints "Theta_1,sat = 22 and
  Theta_1,sat = 13" where the second subscript must be 2. The second is NOT a
  repair by inference, because the running text of Section 3.4 supplies the same
  pair correctly; it is recorded in the parameter file's row note. Both readings
  come from the Elsevier full text - there is no page image of this paper on
  disk - and both involve only subscripts, which a text dump reproduces
  reliably.

  THERE IS NO THIRD DEFECT. An earlier version of this file and of the page
  stated that eq. (60) is PRINTED as S_P = (N_2/N_1)(p_2,0/p_1,0) and USED as
  the reciprocal. The text dump does not support that. It flattens eq. (60) as
  "Sp  =N2  N1   p20  p10" and eq. (61) as "S=Th2  Th1   p2  p1" - identical
  spacing, the ordinary flattening of a COMPOUND fraction. The page reads
  eq. (61) that way and must read eq. (60) the same way, and the review's own
  worked value 3.1/34.0/(5/95) = 1.73 is that same compound-fraction reading, so
  equation and worked value agree. What the break table settles is WHICH READING
  IS MEANT - the alternative lands a factor of 361 from every printed
  selectivity - not that the paper is wrong. A text dump is a poor witness for
  anything involving a fraction, and this is the case in point.
