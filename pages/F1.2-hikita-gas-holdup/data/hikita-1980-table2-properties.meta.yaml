dataset_id: hikita-1980-table2-properties
title: "Physical properties of the 14 gas-liquid systems, Table 2 of Hikita et al. (1980)"
status: complete

source:
  authors: ["Hikita, H.", "Asai, S.", "Tanigawa, K.", "Segawa, K.", "Kitao, M."]
  year: 1980
  container: "Chemical Engineering Journal 20, 59-67"
  doi: "10.1016/0300-9467(80)85006-4"
  access: >
    Publisher PDF (a 300 ppi bilevel scan) held outside the repository
    (~/papers/pymrm-gallery/). No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: transcribed
  figure: "Table 2, journal page 62"
  tool: "page image rendered at 300 and 600 dpi (pdftoppm); every entry read from the image"
  procedure: >
    All 14 rows copied as printed in the CGS units of the table (rhoG x 10^3 g/cm3,
    muG x 10^2 cP, rhoL g/cm3, muL cP, sigma dyn/cm), read with dtype=str. The role
    column marks the two systems the paper did not use to obtain eq. 8 (p. 63, Fig. 4).
    The fig3_marker column is the transcriber's mapping of the Fig. 3 legend to the
    Table 2 rows (not a column of Table 2).
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision: half a unit of the last printed digit"

conditions: "about 1 atm; temperatures as printed per row (10 to 20 C)"

columns:
  - {name: key, unit: "-", description: "identifier used by the page"}
  - {name: system, unit: "-", description: "system as printed"}
  - {name: temp_C, unit: C, description: "temperature"}
  - {name: rhoG_x1e3_g_cm3, unit: "1e-3 g/cm3", description: "gas density as printed (x 10^3)"}
  - {name: muG_x1e2_cP, unit: "1e-2 cP", description: "gas viscosity as printed (x 10^2)"}
  - {name: rhoL_g_cm3, unit: g/cm3, description: "liquid density"}
  - {name: muL_cP, unit: cP, description: "liquid viscosity"}
  - {name: sigma_dyn_cm, unit: dyn/cm, description: "surface tension"}
  - {name: role, unit: "-", description: "fitted (Fig. 3) or held out (Fig. 4)"}
  - {name: fig3_marker, unit: "-", description: "Fig. 3 legend marker of the system (transcriber's mapping)"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
