dataset_id: check-values
title: "Independent check values for the page's functions at one test condition"
status: complete

source:
  authors: ["Hikita, H.", "Asai, S.", "Tanigawa, K.", "Segawa, K.", "Kitao, M."]
  year: 1980
  container: "Chemical Engineering Journal 20, 59-67"
  doi: "10.1016/0300-9467(80)85006-4"
  access: >
    The equations are those of the paper (eqs. 8 to 10, Tables 1 and 2), with the readings and
    misprints stated in the build plan's equations file. The values are not read from the paper
    but computed from its equations and printed constants by a second route.
  licence: "computed values (no text, figure or page image reproduced)"

acquisition:
  method: computed by a second route, not by the page
  resolution: "12 significant digits (rounding up to 5e-12 relative); each row's rtol (1e-11 or looser) is the agreement the page must reach"
  operator: "Claude Opus 5.5 (assisted): plan agent's script f12_check_values.py (numpy and scipy, no pymrm, no page code; closed forms cross-checked against brentq roots), 2026-11-27"
  date: 2026-11-27
  estimated_error: "none beyond floating point for the closed-form rows; looser rtol rows carry the route's own error"

conditions: >
  The test condition stated in the build plan's equations file (f12_EQUATIONS.md).

columns:
  - {name: name, unit: "-", description: "quantity; units as defined in the equations file"}
  - {name: value, unit: "-", description: "value computed by the second route"}
  - {name: rtol, unit: "-", description: "relative tolerance the page must meet"}
