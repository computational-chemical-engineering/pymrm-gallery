dataset_id: hikita-1980-printed-numbers
title: "Constants, window, ranges and printed deviations of Hikita et al. (1980), eqs. 8 to 10 and Table 1"
status: complete

source:
  authors: ["Hikita, H.", "Asai, S.", "Tanigawa, K.", "Segawa, K.", "Kitao, M."]
  year: 1980
  container: "Chemical Engineering Journal 20, 59-67"
  doi: "10.1016/0300-9467(80)85006-4"
  access: >
    Publisher PDF (a 300 ppi bilevel scan) held outside the repository
    (~/papers/pymrm-gallery/). No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: transcribed
  figure: "eqs. 8, 9 and the window (p. 63), uG range (p. 62), column (p. 61), eq. 10 (p. 66), printed average deviations on Figs. 3, 6 and 13, Table 1 eq. 2 and its ranges (p. 60, printed rotated)"
  tool: "page images rendered at 300 and 600 dpi (pdftoppm); every entry read from the image, since the text layer substitutes digits"
  procedure: >
    Each constant copied as printed (string, fractions kept), one row per constant,
    with the place it is printed. Read the file with dtype=str.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: "none beyond the printed precision: half a unit of the last printed digit"

conditions: >
  One column, D 10.0 cm, single nozzle 1.1 cm ID, uG 4.2 to 38.0 cm/s (pp. 61-62).
  Table 1's Akita-Yoshida ranges are as Hikita prints them.

columns:
  - {name: name, unit: "-", description: "identifier used by the page"}
  - {name: printed, unit: "-", description: "the value as printed (units in the meaning column)"}
  - {name: where, unit: "-", description: "equation, table or figure and journal page"}
  - {name: meaning, unit: "-", description: "what the constant is, with its unit"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced; figure points are re-plotted from the extracted coordinates.
