dataset_id: hikita-1980-fig3
title: "Observed against calculated gas holdup for the fitted systems, Figure 3 of Hikita et al. (1980)"
status: complete

source:
  authors: ["Hikita, H.", "Asai, S.", "Tanigawa, K.", "Segawa, K.", "Kitao, M."]
  year: 1980
  container: "Chemical Engineering Journal 20, 59-67"
  doi: "10.1016/0300-9467(80)85006-4"
  access: >
    Publisher PDF (a 300 ppi bilevel scan) held outside the repository
    (~/papers/pymrm-gallery/). No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: digitised
  figure: "Fig. 3, journal page 64"
  tool: "pdftoppm at 600 dpi (twice the native 300 ppi of the scan); marker centres read by eye on zoomed crops; line centres from the dark run in single pixel columns; calibration and conversion by data/digitise.py (committed)"
  procedure: >
    Log-log axes. Calibration as for Fig. 2 from 11 abscissa ticks on each of the
    bottom (row 1861) and top (row 660.5) frames, 0.08 to 0.9, and 8 ordinate ticks
    on each of the left (column 441) and right (column 1830) frames, 0.07 to 0.5.
    About 1195 px per decade at 600 dpi (about 600 native). Largest tick-fit residual
    2.38 native px (abscissa) and 1.00 (ordinate). 48 markers read, 33 assigned to a
    system by their shape and the legend, 15 labelled unassigned (shape undecidable:
    open up against open down triangles in the dense band, half-hidden filled
    markers); the plotted set is larger (an estimated 55 to 60 markers), so the
    markers read are a lower bound of it and not a random sample. The drawn line read
    at 7 columns free of markers.
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-27
  estimated_error: >
    About 3 native px per marker centre (6 px at 600 dpi), 0.005 decades or about
    1.2 % in each coordinate. In the dense band (eps)cal 0.13 to 0.30 two readings of
    one open square differed by 10 px at 600 dpi (1.9 %), and the shape assignment
    there is weaker than the position.

conditions: "The 12 fitted systems of Table 2, D 10 cm, uG 4.2 to 38.0 cm/s; (eps)cal is eq. 8."

missing:
  - "Markers hidden under others or not separable in the dense band: an estimated 7 to 12, not read."

columns:
  - {name: kind, unit: "-", description: "marker or line"}
  - {name: system, unit: "-", description: "Table 2 key from the legend shape, or unassigned"}
  - {name: shape, unit: "-", description: "marker shape (empty when unassigned or line)"}
  - {name: eps_cal, unit: "-", description: "abscissa, eq. 8 holdup, from the calibration"}
  - {name: eps_obs, unit: "-", description: "ordinate, observed holdup, from the calibration"}
  - {name: px_x, unit: px, description: "centre column at 600 dpi"}
  - {name: px_y, unit: px, description: "centre row at 600 dpi"}
  - {name: note, unit: "-", description: "reading note"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
