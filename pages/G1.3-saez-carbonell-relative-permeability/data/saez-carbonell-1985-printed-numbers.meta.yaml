dataset_id: saez-carbonell-1985-printed-numbers
title: "Constants, table entries and statistics printed by Saez and Carbonell (1985)"
status: complete

source:
  authors: ["Saez, A. E.", "Carbonell, R. G."]
  year: 1985
  container: "AIChE Journal 31(1), 52-62"
  doi: "10.1002/aic.690310105"
  access: >
    Publisher PDF (a 300 ppi bilevel scan, 11 pages) held outside the repository
    (~/papers/pymrm-gallery/). PDF page 1 opens on the end of the previous article;
    journal page = PDF page + 51. No PDF and no page image is stored in this repository.
  licence: "all rights reserved (numeric facts extracted; no text block, figure or page image reproduced)"

acquisition:
  method: table
  figure: "Eqs. 8, 32 to 37, 46, 48; Tables 3, 4, 5, 6, 7, 8, 9; text of pp. 56 to 58; Summary p. 60"
  tool: "page images at the native 300 ppi (pdftoppm -r 300), read by eye on crops; the text layer substitutes digits and was used only to locate items"
  operator: "Claude Opus 5.5 (assisted)"
  date: 2026-11-28
  estimated_error: "none beyond transcription; every value is a string as printed, compared in half-units of its last printed digit"

conditions: "Air-water and other systems in cocurrent gas-liquid downflow through packed beds (Tables 2 and 6)."

missing:
  - "Eq. 8's constants are transcribed from the Summary's copy on p. 60; Eq. 8 itself (p. 54) was not re-read."
  - "Table 6 is printed with its symbols; only the smallest d_c/d_p (Charpentier et al., 9) is kept."

columns:
  - {name: name, unit: "-", description: "identifier used by the page"}
  - {name: printed, unit: "-", description: "the number as printed (string; read with dtype=str)"}
  - {name: journal_page, unit: "-", description: "journal page"}
  - {name: pdf_page, unit: "-", description: "page of the PDF (journal page - 51)"}
  - {name: meaning, unit: "-", description: "where it is printed and what it is; units in the text"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by a
  research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3). No figure or page image is
  reproduced.
