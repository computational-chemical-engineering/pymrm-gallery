validation:
  - "PRIMARY: the Chapman-Enskog first approximation against the 39 <!-- claim: d12_n_pairs --> usable pairs of Table 22's MEASURED D12 at S.T.P. Mean absolute deviation 3.65 <!-- claim: d12_mean_abs_dev_pct --> %, bias -2.74 <!-- claim: d12_bias_pct --> % (standard error 0.59 <!-- claim: d12_bias_se_pct --> %), r.m.s. 4.57 <!-- claim: d12_rms_pct --> %, worst -10.06 <!-- claim: d12_worst_dev_pct --> % (N2-CO2). Out of sample: the Lennard-Jones constants were fitted to pure-gas VISCOSITY (book p. 235) and no diffusion measurement enters the prediction."
  - "THE FIT AGAINST THE THEORY: the same theory with the book's own alternative force constants (Table 17's 'Other values', mainly from virial coefficients) gives 10.23 <!-- claim: d12_other_params_subset_mean_abs_pct --> % on the 27 <!-- claim: d12_subset_n_pairs --> pairs that have both sets, against 4.13 <!-- claim: d12_visc_params_subset_mean_abs_pct --> % for the viscosity constants; paired difference 6.11 <!-- claim: d12_subset_diff_pp --> percentage points, standard error 1.23 <!-- claim: d12_subset_diff_se_pp -->."
  - "NULL MODEL: the same expression with the collision integral deleted and Table 11's viscosity diameters gives 17.24 <!-- claim: d12_rigid_sphere_mean_abs_pct --> % with a bias of -17.24 <!-- claim: d12_rigid_sphere_bias_pct --> %, predicted by the book's statement that the viscosity half-sum exceeds the diffusion sigma_12 'by about 10 per cent', reproduced at 10.46 <!-- claim: sigma_ratio_mean_pct --> %."
  - "INDEPENDENT RECOMPUTATION: the 12,6 collision integrals by quadrature of the classical deflection angle (turning point as the largest real root of a sextic), no table used, reproduce Table 6 to 0.18 <!-- claim: omega11_quad_vs_t6_max_pct --> % and 0.30 <!-- claim: omega22_quad_vs_t6_half_max_pct --> % at worst, on the kT/eps = 100 row where the quadrature's own refinement error is at most 1e-3 <!-- claim: quad_refinement_at_worst_row_pct --> %; at the lowest (orbiting) rows the quadrature's error reaches 0.16 <!-- claim: quad_refinement_max_pct --> %. Every D12 through the quadrature instead of Table 6 changes by at most 0.1 <!-- claim: d12_two_routes_max_pct --> %."
  - "TABLE 6'S ILLEGIBLE HEADER FRACTION is 1/2: eq. (9.8, 7)'s A identity holds to 2.9e-4 <!-- claim: t6_A_identity_max_rel --> relative with 1/2, and both it and the quadrature fail with 1/3 (rows of the break table)."
  - "PRINTED-TABLE ROUND TRIPS against rounding allowances: Table 22's sigma12 from D12, worst 0.00509 <!-- claim: t22_sigma12_from_D_max_abs -->, unbiased at 1 atm (at most 2 <!-- claim: t22_sigma12_bias_z --> standard errors from zero in magnitude) and 34.8 <!-- claim: t22_sigma12_bias_z_1bar --> standard errors off at 1 bar, which pins the state; Table 22's half-sum from Table 11's sigma, worst 0.0075 <!-- claim: t22_halfsum_from_t11_max_abs --> (O2-Xe, 1.36 <!-- claim: t22_halfsum_max_over_rounding --> of its allowance); Table 11's sigma from mu, 8.7e-4 <!-- claim: t11_sigma_from_mu_max_rel --> (D2, 2.07 <!-- claim: t11_sigma_from_mu_max_over_rounding --> of its allowance), 8.8e-3 <!-- claim: t11_sigma_from_mu_no_corr_max_rel --> without the 1.016 correction; Table 17's r_m, 0.0052 <!-- claim: t17_rm_max_abs -->."
  - "PRINTED RESULTS OF THE SECOND APPROXIMATION, limits in closed form: eq. (14.3, 2) to at most 1e-12 <!-- claim: eq1432_max_rel -->; 1.083333 <!-- claim: lorentz_D2_over_D1 -->; 8.3333 <!-- claim: lorentz_variation_pct --> %; Kihara 11.1111 <!-- claim: kihara_variation_pct --> %. Section 14.3's 'about 6 per cent' bound holds: largest end-to-end swing 3.28 <!-- claim: composition_swing_max_pct --> %, largest variation over the range 3.39 <!-- claim: composition_variation_max_pct --> %."
  - "NUMERICS OF THE PYMRM CELL: the apparent excess extrapolated in cell size and step on separate ladders, observed orders of at least 1.9 <!-- claim: cell_grid_order --> and at most 2.1 <!-- claim: cell_grid_order --> and of at least 0.9 <!-- claim: cell_time_order --> and at most 1.1 <!-- claim: cell_time_order -->, the constant-D cell against its cosine series to at most 1e-4 <!-- claim: cell_const_vs_series --> relative; Newton reports success on every step."
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row (combination rules, force constants, state, transposed table digits, Table 6's header fraction, the 1.016 correction, rigid-sphere constants, quadrature knobs, geometry index, face-composition rule, time scheme, Newton tolerance, series length, ladder)."

adds: >
  pymrm supplies the closed-cell solver: construct_grad and construct_div for the
  zero-flux tube, construct_boundary_value_matrices for the boundary face
  compositions, construct_coefficient_matrix for the face diffusivity and its
  derivative in the exact Jacobian, newton per backward-Euler step,
  find_roots for inverting the constant-D series and observed_orders for the
  refinement ladders. With it the page answers the question the book sets aside
  (section 14.31 ignores the composition dependence of D12): a Loschmidt cell run
  on the second approximation reports an apparent D12 2.53 <!-- claim: cell_apparent_excess_pct_HeXe --> % above [D12]_1 for He-Xe, against
  2.68 <!-- claim: cell_equimolar_excess_pct_HeXe --> % for the equimolar second
  approximation, a shortfall of 0.15 <!-- claim: cell_shortfall_pp_HeXe -->
  percentage points that falls with the mass ratio and vanishes for the
  equal-mass control N2-CO. The Chapman-Enskog algebra, the statistics and the
  quadrature are the page's own; nothing here improves on Chapman-Enskog.



scope: >
  Binary, dilute, monatomic-or-effectively-spherical gases at S.T.P. Deliberately
  excluded: the Fuller-Schettler-Giddings empirical correlation for the same
  quantity (catalogue A4.5 - the page names it and argues the joint comparison
  belongs there, since A4.5 must transcribe its own source anyway and can load
  this page's Table 22 cross-page); multicomponent diffusion (A4.2, A4.9);
  pore transport (A4.3, A4.4); and the Wilke mixture rule (A4.1), which this
  monograph does not carry - its only Wilke is Buddenberg & Wilke (1949) on the
  viscosity of a mixture, cited once in section 12.43. Table 23's force
  constants are also excluded on purpose: they are derived from the temperature
  dependence of D12 itself, so using them would make the comparison circular.
