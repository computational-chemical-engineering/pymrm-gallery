acquisition:
  method: digitised
  figure: "Figures 19 and 20, solid lines"
  tool: "poppler pdftoppm at 600 dpi (native scan 300 ppi); ink runs along one pixel row"
  script: "pages/C2.13-voltz-co-propylene-oxidation/extract_figures.py"
