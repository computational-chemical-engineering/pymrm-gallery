validation:
  - "SCOPE: Tables I and II tabulate only the pH 6.0 run, so the page refits that one Table III row and scopes the other five out; a pdftotext search for 'Table' and a look at every page for ruled blocks find nothing else, and no curve is digitised"
  - "THE REFIT IS A CONSISTENCY CHECK ON THE AUTHORS' OWN FIT, NOT A VALIDATION: Fig. 11's axes are Table II's last two columns. Least squares on 22 <!-- claim: n_rows_eq3 --> points gives alpha = 2.2666 <!-- claim: alpha_refit_eq3 --> and beta = 0.5287 <!-- claim: beta_refit_eq3 -->, 3.03 % <!-- claim: alpha_refit_eq3_vs_printed --> and -3.88 % <!-- claim: beta_refit_eq3_vs_printed --> from the printed pair, which lies 0.51 <!-- claim: printed_alpha_in_se --> and 0.43 <!-- claim: printed_beta_in_se --> standard errors from the fit (printed_pair_inside_one_se); with the constants correlated at -0.89 <!-- claim: alpha_beta_corr_eq3 -->, the printed pair costs 0.65 % <!-- claim: eq3_printed_pair_rms_penalty --> in rms against the optimum"
  - "THREE ROUTES: eq. (3), eq. (2) weighted by N^2, and an integral form fitting P with no differentiated column (alpha = 2.2727 <!-- claim: alpha_refit_integral -->, beta = 0.5101 <!-- claim: beta_refit_integral -->); route spread 1.03 % <!-- claim: alpha_route_spread --> in alpha and 3.64 % <!-- claim: beta_route_spread --> in beta"
  - "TWO NULLS, BOTH THE PAPER'S OWN REJECTED ALTERNATIVES: growth-only and density-only have 5.55 <!-- claim: eq2_null_growth_only_ratio --> and 4.92 <!-- claim: eq2_null_density_only_ratio --> times the two-term rms over all rows, 14.2 <!-- claim: integral_null_growth_only_ratio --> and 17.8 <!-- claim: integral_null_density_only_ratio --> on the integrated curve; the direction is algebra (nested submodels), so both halves of the paper's sentence are measured: 1.036 <!-- claim: eq2_logphase_null_growth_only_ratio --> and 1.033 <!-- claim: eq2_logphase_null_density_only_ratio --> on the logarithmic plateau, 5.01 <!-- claim: eq2_outside_log_null_growth_only_ratio --> and 3.71 <!-- claim: eq2_outside_log_null_density_only_ratio --> outside it, where a ratio near 1 is degeneracy of the two regressors"
  - "INTEGRAL TEST, A COHERENCE CHECK BETWEEN TWO REDUCTIONS OF ONE RUN: the printed constants reproduce the acid curve to 1.70 % <!-- claim: P_curve_rms_rel --> rms and the final printed acid to 3.12 % <!-- claim: P_final_vs_printed -->"
  - "CROSSOVER k* = beta/alpha: crossed at t = 10.1 <!-- claim: crossover_time_h --> h by find_roots on the whole printed window, once on the k column and once on the dN/dt and N columns (crossover_two_routes_rel, a bounded transcription-consistency residual); quoted to one decimal because a linear interpolant moves it 0.16 % <!-- claim: crossover_interp_band_rel -->; the growth-associated term makes 46.7 % <!-- claim: growth_assoc_share --> of the acid over the printed window"
  - "TABLE III TRENDS: beta falls strictly as the pH falls by a factor of 5.0 <!-- claim: beta_range_ph6_over_ph45 -->, alpha rises 1.61 <!-- claim: alpha_range_ph45_over_ph6 -->, k* falls 8.07 <!-- claim: kstar_range_ph6_over_ph45 -->-fold; the pH column matches its second printing in the running text (ph_column_matches_text); six fitted pairs are six outputs of the Fig. 11 test, not the test"
  - "TABLE II CHECKS ITSELF: k = (1/N) dN/dt holds to 2.74 % <!-- claim: k_identity_max_rel --> at worst, and 87.4 % <!-- claim: digit_substitution_detection --> of single-digit substitutions in the (N, dN/dt, k) triple break it by more"
  - "TWO SOLVERS AGAINST THE CLOSED FORM P = P0 + alpha (N - N0) + beta int N dt, with k(t) from the printed column: backward Euler with newton + NumJac((1, 2)) and steady plug flow with construct_convflux_upwind + construct_div and a {outflow: True} outlet, observed orders from successive differences between 0.9 and 1.1 <!-- claim: batch_marcher_order --> and between 0.9 and 1.1 <!-- claim: pfr_grid_order -->, each with a round-off margin; first-order Richardson outlet 2.2e-5 <!-- claim: pfr_richardson_vs_closed_form --> from the closed form; the boundary read and the last cell coincide under the outflow outlet (pfr_boundary_over_last_cell, an identity a zero-gradient outlet breaks)"
  - "A DEFECT-INJECTION TABLE: every claim fails at least one row, each defect entering through an argument of its study (mis-transcribed cells of all three tables, the pH 5.6 mark read as a sign, a dropped low-precision row, changed fit window, fit variable, interpolant or quadrature, coarser resolution, orders against the finest level, loosened newton tolerances, a zero-gradient outlet)"

adds: >
  Little to the fit, and the page says so: the refit is numpy.linalg.lstsq. pymrm
  carries eq. (2) as a source term into a batch marcher (newton + NumJac((1, 2)))
  and a plug-flow fermenter (construct_convflux_upwind + construct_div, outflow
  outlet read by compute_boundary_values), both checked against the closed form
  with observed orders from pymrm.checks.observed_orders, and finds the crossover
  as a checked unique root with pymrm.checks.find_roots. The plug-flow model
  illustrates composability; nothing in the paper tests it.

caveats: >
  One run, and the constants were fitted on it: the page does not establish the
  relation, its form at the other five pH levels, any function alpha(pH) or
  beta(pH), or that the plug-flow extension describes a real fermenter.

