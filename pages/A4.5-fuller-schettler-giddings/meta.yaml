validation:
  - "THE PRINTED ERROR COLUMN RECOMPUTED from eq. (4) and the Table I volumes: 338 <!-- claim: n_rows_reproduced --> of 340 <!-- claim: n_rows --> rows to 0.043 <!-- claim: max_abs_delta_pp --> percentage points (median 0.0038 <!-- claim: median_abs_delta_pp -->). A check on the transcription and on the implementation, not on the correlation: the printed errors are the authors' arithmetic on the same equation. 2 <!-- claim: n_rows_irreproducible --> rows cannot be reproduced, He-H2O at 352.5 K and CO2-ethylene oxide at 298.0 K, both re-read on the page image and confirmed as printed."
  - "ROUTE B, sharing no code with the first: within one system from one reference eq. (4) makes D scale exactly as T^1.75, an identity in the printed temperature, observed D and error alone. For 142 <!-- claim: routeB_n_ratios --> ratios in 51 <!-- claim: routeB_n_series --> series every deviation lies below 1e-3 <!-- claim: routeB_max_dev_excl_anomaly -->, the printed rounding, except 1 <!-- claim: routeB_n_beyond_rounding --> ratio through the He-H2O row the first route flags. The identity recovers b = 1.7500 <!-- claim: routeB_recovered_exponent --> from the printed table without that ratio and 1.7492 <!-- claim: routeB_recovered_exponent_all --> with it."
  - "PRINTED AGGREGATES: AVE. ERROR 4.3211 <!-- claim: ave_error_pct --> against a printed 4.32, the tail beyond ten per cent 7.35 <!-- claim: pct_over_10 --> against 7.4, the STANDARD DEVIATION 6.7101 <!-- claim: residual_sd_pct --> against 6.71 as the residual standard deviation with every Table I volume and b counted, and 153 <!-- claim: n_systems --> binary systems as stated. 10 <!-- claim: aggregates_within_print --> of the 11 printed means and aggregates lie within half a unit of their last printed digit; the N2 mean of Table II sits 1.023 <!-- claim: aggregate_worst_halfunits --> half-units away."
  - "THE HELD-OUT TEST, the page's own contribution: leave-one-organic-compound-out for 42 <!-- claim: loco_n_compounds --> organic vapours, refitting every volume each time. 5.04 <!-- claim: loco_in_sample_refit_pct --> % in sample against 6.61 <!-- claim: loco_held_out_pct --> % held out on the same 153 <!-- claim: loco_n_points --> points, an excess of 1.56 <!-- claim: loco_gap_pp --> percentage points with a standard error of 0.48 <!-- claim: loco_gap_se_pp --> over compounds. The simple-molecule points admit no held-out test, because each simple molecule carries its own fitted parameter."
  - "THE TEMPERATURE EXPONENT against the paper's 'usually lie in the range 1.6 to 1.8': 20 <!-- claim: exponent_in_band --> of 26 <!-- claim: exponent_n_series --> series slopes fall in the band, but only 6 <!-- claim: exponent_certain_in --> inside and 4 <!-- claim: exponent_certain_out --> outside by more than two standard errors. The extremes differ by 7.9 <!-- claim: exponent_extremes_z --> combined standard errors."
  - "THE FREE REFIT recovers the printed simple-molecule volumes to within 1.8 % <!-- claim: refit_simple_volume_max_rel_dev -->; random starts reach the same minimum to below 1e-10 <!-- claim: refit_start_spread --> in phi', and no volume sits on a bound."
  - "THE PYMRM TUBE against an adaptive quadrature of 1/Gamma that forms no grid and calls no pymrm: 1.79e-7 <!-- claim: flux_pymrm_vs_quadrature --> relative at 400 cells, observed orders 1.84 <!-- claim: flux_grid_order_min --> to 1.98 <!-- claim: flux_grid_order_max --> on 25 to 800 cells, Richardson limit below 1e-8 <!-- claim: flux_richardson_vs_quadrature -->. Both routes read the same Gamma(T), so the check is blind to a wrong exponent, a wrong D or a wrong molar mass; the break table shows it."
  - "A DEFECT-INJECTION TABLE: every study reruns under each defect, injected through a published constant or a call argument (Table I values, the alternative increment set, b, the prefactor, the two inferences, the error definition, the parameter count, the refit objective and tolerance, the held-out split, the exponent band, the grid, the geometry index, the outlet condition, the face rule, the tube temperatures). Every non-structural claim fails at least one row."

adds: >
  Nothing to the correlation: eq. (4), the reproduction, the cross-validation and
  the measured exponents are numpy and scipy. pymrm supplies the transport solve
  that turns an error in D into an error in an answer: one linear sparse solve of
  a variable-coefficient diffusion operator in a heated tube. For benzene through
  air from 300 K to 600 K, moving b across the measured range changes the flux by
  -5.85 <!-- claim: flux_change_b_min_anchor_cold --> % to
  +7.33 <!-- claim: flux_change_b_max_anchor_cold --> % when D is pinned at the
  cold end, and by -0.22 <!-- claim: flux_change_b_min_anchor_mid --> % to
  +0.12 <!-- claim: flux_change_b_max_anchor_mid --> % when it is pinned at the
  geometric mean temperature. A scale error in D carries over to the flux one for
  one and needs no solve.

agreement: >
  Against the paper's printed tables: 338 <!-- claim: n_rows_reproduced --> of
  340 <!-- claim: n_rows --> FSG errors to 0.043 <!-- claim: max_abs_delta_pp -->
  percentage points; AVE. ERROR 4.3211 <!-- claim: ave_error_pct --> against 4.32;
  the residual standard deviation 6.7101 <!-- claim: residual_sd_pct --> against
  6.71. Two printed rows are irreproducible and are reported as such. The pymrm
  flux meets an independent quadrature to
  1.79e-7 <!-- claim: flux_pymrm_vs_quadrature --> at second order. Out of
  sample, the page's own number: 6.61 <!-- claim: loco_held_out_pct --> % held out
  against 5.04 <!-- claim: loco_in_sample_refit_pct --> % in sample.

caveats:
  - "THE QUOTED AVERAGE ERROR IS A GOODNESS OF FIT, NOT A VALIDATION. The diffusion volumes were obtained by nonlinear least squares on the same measurements it is reported against; the authors write: 'Despite the large sample, this is not a totally objective test since the parameters were obtained from these particular data.' The one out-of-sample number is the page's leave-one-compound-out figure, and it applies only to organic vapours."
  - "THE 1966 ERRATUM, doi:10.1021/ie50680a601, HAS NOT BEEN CONSULTED. It is not on disk and the article contains no correction notice. The 1966 table is used as printed; the widely reproduced later increments appear only as an injected defect."
  - "TWO CHOICES ARE INFERENCES FROM THE PRINTED ERROR COLUMN, not readings: the ring term applied to aromatic rings only, despite its caption 'Aromatic or Heterocyclic rings', and M(D2) = 4.00. The 22 <!-- claim: n_rows_inferred --> rows they rest on are not independent tests; of the remaining rows 1 <!-- claim: n_free_rows_failing --> is irreproducible."
  - "THE PRINTED PHI' MINIMA DO NOT BELONG TO THE PUBLISHED TABLE: the printed error column gives a phi' that sits 0.071 <!-- claim: phi_prime_gap_printed_min --> below the paper's constrained minimum, which eq. (4) as a special case of eq. (2) cannot do. Reported, not resolved."
  - "ONLY THE FSG COLUMN OF TABLE III IS TRANSCRIBED. The AVE. ERROR and STANDARD DEVIATION rows at its foot follow Table II's method order, not Table III's column order; anyone using the other eight columns must settle that first."
  - "A4.6 (Chapman-Enskog) should own the comparison of kinetic theory with this correlation on one measured axis; no number here comes from Chapman & Cowling. Molar masses are modern IUPAC values; the paper prints none."
