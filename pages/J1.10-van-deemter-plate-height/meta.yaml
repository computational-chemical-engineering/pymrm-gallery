validation:
  primary: >
    Eq. (38) computed a second, independent way: eqs. (29)/(30) integrated in
    time with pymrm, with H read from the difference of the first two time
    moments at two interior stations. Agreement 4.1e-5. The route shares no
    algebra with eq. (38) - no Gaussian, no plate theory - and the two-station
    difference cancels every boundary effect (measured: changing the inlet from
    Danckwerts to Dirichlet moves H by 1.5e-6).
  secondary: >
    A third route, also independent: the Laplace transform of eqs. (29)/(30)
    gives the residence-time cumulants in closed form - kappa_1 to kappa_4, the
    expansion taken to s^4 - and kappa_2/kappa_1^2 equals eq. (38) symbolically
    (residual exactly 0). The PDE reproduces kappa_3 to 0.21 % and kappa_4 to
    1.5 %. NEITHER OF THOSE TWO IS A CONVERGED DEVIATION and the page says so
    where it prints them: on the higher cumulants the grid error is positive and
    the time error negative, so at fixed grid the deviation passes through zero
    as dt is varied (printed: +7.6e-3, +2.1e-3, -1.0e-2 at n_z = 1400 for
    dt = 0.5, 1, 2). They are honest at the stated settings and are regression
    guards, but they are cancellation-limited, and the page names the converging
    companion (pymrm_H_vs_eq38_rel). Every shape number quoted on the page - the
    skewness and the excess kurtosis - uses the ANALYTIC cumulants, and the PDE's
    kappa_3 and kappa_4 are used for nothing but this check. The one place a PDE
    moment reaches a printed number is the pair of peak-normalised
    max|curve - Gaussian| values under the elution figure (0.0563 and 0.0323),
    which overlay each computed curve with a Gaussian built from that curve's own
    mean and variance; they are labelled configuration-dependent where they are
    printed, are not agreement metrics, and carry no conclusion.
  grid_and_time: >
    Grid refined over 4x: observed order 3.00 with the van Leer deferred
    correction, 1.00 with bare upwind. The bare-upwind run is a PREDICTION with a
    known answer - first-order upwind adds u h / 2 of numerical dispersion, which
    adds exactly h to H - and the measured coefficient is 0.99999. Time step
    refined over 8x: the two-station H moves 1.2e-6 (it is not the error-carrying
    axis, and the page says so), while mu_1 at the downstream station moves
    2.3e-5 at observed order 1.79. THAT 1.79 IS NOT A DEGRADED SECOND ORDER, and
    the page measures what it is: Crank-Nicolson is second order, but the van Leer
    correction is deferred and LAGGED ONE STEP at sweeps = 1, so the configuration
    run here is first order in time. Reference-free successive-difference orders
    over dt = 8 -> 0.125 s at n_z = 700 are printed for both settings:
    +1.65 +1.41 +1.01 +0.83 +0.99 with the limiter on, against
    +1.85 +1.96 +1.99 +2.00 +2.00 with limiter = None. The 1.79 is a
    pre-asymptotic three-point fit on the coarse end of the first sequence, and
    nothing on the page needs it to be 2. The order is also broken deliberately:
    rerunning the same sweep with backward Euler (theta = 1) in place of
    Crank-Nicolson moves the observed order to 0.91 and blows H's own dt swing up
    from 1.2e-6 to 4.1e-1.
  break_tables: >
    Two, both executed, and the coverage map is GENERATED from the measured
    movers rather than asserted. Break table 1 perturbs the PDE (9 genuine
    movers, smallest 1.7e-4 against a baseline error of 4.1e-5, plus one
    deliberate non-mover and one row that produces NaN rather than a bias).
    Break table 2 perturbs the algebra and the extractions (22 rows). The one
    metric neither table reaches directly, pymrm_dt_order_mu1, is covered by the
    backward-Euler run in the refinement study.
  structural_metrics: >
    Two metrics sit below check_agreement.py's ABS_FLOOR = 1e-12 and are outside
    the regression suite: sym_chain_residual (exactly 0 when the algebra is
    right; a break row moves it off zero) and rootfind_vs_closed_form_optimum
    (2.2e-16; the same three constants evaluated two ways). Both are named on the
    page and each is given an above-floor companion. Two further metrics are
    flagged on the page for a different reason: pymrm_kappa3_vs_laplace_rel and
    pymrm_kappa4_vs_laplace_rel are above the floor and inside CI, but they are
    CANCELLATION-LIMITED rather than converged (see validation.secondary), and
    the page names pymrm_H_vs_eq38_rel as the converging companion.

what_pymrm_adds: >
  Not the plate height - eq. (38) is exact for this model and the page proves it
  twice. What this page adds is a number for the paper's own unquantified
  condition. Eqs. (33)/(34) are stated to hold "for locations z much larger than
  both 2D/u and F_I u/alpha", and how much larger is never said. Because the
  cumulants are exactly additive along the column, kappa_3 and kappa_4 per unit
  length give the skewness and excess kurtosis of a column of any length in
  closed form; all four cumulants come from the Laplace expansion, and pymrm's
  role here is the independent CHECK on them (0.21 % and 1.5 %, both with the
  cancellation caveat above), not the source of any quoted number. The result:
  the paper's two groups fall as 1/z
  while the skewness falls only as z^(-1/2), so at the ion-exclusion column that
  produced Table 3 the groups are 2.4e-3 and 3.4e-3 - comfortably "<< 1" - and
  the elution curve is still skewed by 0.14. Reaching a skewness of 0.05 needs a
  column 8.2 times longer (root-found, not swept).

inferences:
  - what: "column length of the ion-exclusion column, 558 mm"
    why: >
      Printed nowhere in the paper. Searched: all nineteen pages read on 300 ppi
      renders, plus a document-wide text-layer search for "length", whose only
      hits are pp. 272, 278, 279, 283 and 288 - p. 283 is the gas-liquid columns
      (1.80 m) and p. 288 is the symbol list. Recovered from Table 3's own n and
      H columns, whose product must be constant and comes out 539-578 mm.
    used_for: "reporting the skewness at the column actually used; nothing else"
  - what: "d_p = 0.2201 mm for 50-100 mesh"
    why: "Recovered from Table 3's H and H/d_p columns, five distinct flow rates."
    used_for: "the abscissa of the eq. (49) regression, and the PDE conditions"
    sensitivity: "a break row replaces it with the mesh geometric mean; D_II moves 4.5 %"
  - what: "gamma = 0.75 and D_I = 10 x D_II for the PDE run"
    why: >
      gamma is the midpoint of the paper's own printed range 0.5-1.0; D_I follows
      from its own statement that D_II is "about 10 times smaller than the
      diffusion coefficient in the free liquid".
    used_for: "the longitudinal diffusivity and eq. (45)'s first term"
    sensitivity: >
      Measured on the page: gamma D_I carries 0.42 % of H directly, and the D_I
      term of 1/alpha is 1.33 % OF 1/ALPHA - which, since the transfer term is
      34.92 % of H, is 0.465 % of H. Both shares are printed beside the run.
