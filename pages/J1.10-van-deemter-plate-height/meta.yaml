inferences:
  - what: "column length of the ion-exclusion column"
    why: >
      Printed nowhere in the paper (all pages read on renders, plus a
      document-wide text-layer search for "length"). Recovered from Table 3's own
      n and H columns, whose product must be constant: 558
      <!-- claim: table3_recovered_length_mm --> mm.
    used_for: "reporting the skewness at the column actually used; nothing else"
  - what: "d_p for 50-100 mesh"
    why: "Recovered from Table 3's H and H/d_p columns, five distinct flow rates."
    used_for: "the abscissa of the eq. (49) regression, and the PDE conditions"
    sensitivity: "a break row replaces it with the mesh geometric mean and moves the D_II deviation"
  - what: "gamma at the midpoint of the paper's printed range, and D_I = 10 x D_II, for the PDE run"
    why: >
      gamma is the midpoint of the paper's own printed range; D_I follows from its
      own statement that D_II is "about 10 times smaller than the diffusion
      coefficient in the free liquid".
    used_for: "the longitudinal diffusivity and eq. (45)'s first term"
    sensitivity: "the shares of H that each assumed input carries are printed beside the run"

validation:
  - >-
    Eq. (38) computed a second, independent way: eqs. (29)/(30) integrated in time
    with pymrm, H read from the difference of the first two time moments at two
    interior stations, agreement 4.1e-5 <!-- claim: pymrm_H_vs_eq38_rel -->. The
    two-station difference cancels every boundary effect: a Dirichlet inlet in
    place of the Danckwerts one moves H by below 1e-5 <!-- claim: pymrm_bc_insensitivity -->,
    and read from one station the same change is not cancelled.
  - >-
    Grid refined over four nested grids: the observed order of H from successive
    differences lies between 2.5 and 3.5 <!-- claim: pymrm_grid_order -->, and bare
    upwind adds exactly h to H, as predicted (coefficient 0.99999
    <!-- claim: pymrm_upwind_dispersion_coeff -->).
  - >-
    Time: the van Leer limiter is the only nonlinear part of a step and is taken
    as a correction deferred to the start of the step. The same theta scheme
    with the limited flux implicit (ConvFluxTVD Jacobian, newton with monotone
    damping) gives the same two-station H to below 1e-5
    <!-- claim: pymrm_deferred_vs_newton_H_rel -->; over a 16-fold range of the
    step H moves below 1e-5 <!-- claim: pymrm_dt_swing_H -->; with the limiter
    off the Crank-Nicolson order on c_I at fixed times departs from 2 by below
    0.1 <!-- claim: pymrm_dt_order_upwind_dev -->, and backward Euler breaks it.
  - >-
    The Laplace transform of eqs. (29)/(30) gives the residence-time cumulants in
    closed form, and kappa_2/kappa_1^2 equals eq. (38) symbolically. The PDE
    reproduces kappa_3 to 0.21 % <!-- claim: pymrm_kappa3_vs_laplace_rel --> and
    kappa_4 to 1.5 % <!-- claim: pymrm_kappa4_vs_laplace_rel -->; both are
    cancellation-limited (grid and time errors of opposite sign), regression
    guards and not converged deviations. Every shape number quoted on the page
    uses the analytic cumulants.
  - >-
    Two break tables, both executed, and every claim has a break row that fails
    its own check; the rows are declared before they run.

adds: >
  Not the plate height: eq. (38) is exact for this model and the page proves it
  twice. What this page adds is a number for the paper's own unquantified
  condition. Eqs. (33)/(34) are stated to hold "for locations z much larger than
  both 2D/u and F_I u/alpha", and how much larger is never said. Because the
  cumulants are exactly additive along the column, kappa_3 and kappa_4 per unit
  length give the skewness and excess kurtosis of a column of any length in
  closed form; all four cumulants come from the Laplace expansion, and pymrm's
  role is the independent CHECK on them, not the source of any quoted number.
  The paper's two groups fall as 1/z while the skewness falls only as z^(-1/2),
  so at the ion-exclusion column that produced Table 3 the groups are 2.4e-3
  <!-- claim: group1_at_recovered_column --> and 3.4e-3
  <!-- claim: group2_at_recovered_column --> and the elution curve is still
  skewed by 0.14 <!-- claim: skewness_at_recovered_column -->. Reaching a
  skewness of 0.05 needs a column 8.2 <!-- claim: z_for_skewness_over_column -->
  times longer.

agreement: >
  Against the paper's printed results: lambda = 2.99 <!-- claim: lambda_from_table3 -->
  against 3, D_II = 1.34e-10 <!-- claim: DII_from_table3_m2s --> m2/s against
  1.3e-10 (3.7 % <!-- claim: DII_from_table3_rel_dev -->), film thicknesses 10.06
  <!-- claim: df_celite_n_butane_um -->, 10.57 <!-- claim: df_celite_iso_butane_um -->
  and 8.66 <!-- claim: df_sterchamol_um --> um against about 10, 10 and 9, and
  Table 3's plate numbers rebuilt from Table 2 to a median 2.1 %
  <!-- claim: table3_n_median_rel_dev -->. Eqs. (54)/(55) against Table 4 are fits
  (worst rmse 0.28 <!-- claim: eq54_fit_rmse_mm --> mm against a null baseline of
  0.92 <!-- claim: eq54_null_rmse_mm --> mm at best).

caveats: >
  Provenance tier 6: the source's own printed tables, transcribed. The velocity
  convention of the gas-liquid section cannot be settled from what is printed,
  and the page carries both readings. The ion-exclusion column's length and its
  50-100 mesh particle diameter are inferences from Table 3, labelled as such.
  Simpson & Wheaton's original paper was not consulted.
