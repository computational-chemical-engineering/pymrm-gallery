four_tables_not_two: >
  The paper prints FOUR tables, not two - a correction to this repository's own
  papers inventory, which records "both of the paper's tables". Table 1 (p. 277)
  is the feed-volume experiment, Table 2 (p. 280) is Simpson & Wheaton's ion
  exclusion data restated, Table 3 (p. 281) is the plate heights the authors
  derive from Table 2, and Table 4 (p. 286) is the gas-liquid plate-height
  measurement that produces the van Deemter equation itself. All four are
  transcribed here. The two that carry the plate height are 3 and 4.

data:
  tier: 6
  method: >
    Four printed tables (71 data rows) and 56 printed scalars transcribed from
    2x digit-scale crops of 300 ppi native-resolution renders. NO POINT WAS TAKEN
    OFF ANY FIGURE and none needed to be: the paper's own tables carry every
    number this page uses. The exact accounting, which is what a "no figure
    digitised" claim has to get right:
    (a) FIVE ambiguous readings were settled by arithmetic constraints the tables
    impose on themselves and not by pixel shape - in Table 2, the velocity
    column's doubling series (which fixes "0 365" against "0 865") and the 23 ml
    base width on that row (the only reading consistent with Table 3's printed
    125-156 plates); in Table 3, the decimal placement of "0 56- 0 93" (n H must
    be the same column length in every row) and the integer readings of "11 -18"
    and of "13 -14"/"16 -20" (H divided by H/d_p must reproduce the stated mesh).
    (b) THREE readings spanning FIVE cells of Table 4 were settled with Figs. 11
    and 13, which was needed because the 1956 face sets 3 with a nearly flat top:
    the Celite "3 4"/"3 5" pair, the Sterchamol "3 2"/"3 3" pair, and "31"
    against "81". Neither figure carries a point between u = 5 and 15 mm/s and
    Fig. 13's rightmost point sits at u ~ 31 on an axis stopping just past it.
    All three are ALSO forced from inside Table 4 alone, which the page computes
    and prints: the velocity column is printed in ascending order in both blocks
    (excluding 8.4/8.5 and 8.2/8.3 by position), and eq. (55) - the authors' own
    fit to these rows - gives 4.14 mm at u = 81 against the printed 1.7 mm while
    landing within 5 % at u = 31.
    (c) TWO of the 56 scalars, n = 240 and n = 277, are numbers printed as curve
    labels on Fig. 8; they are read as printed text, not as point coordinates,
    and are used in one place only, to identify which of Table 3's two printed
    endpoints came from which of the paper's two routes.
  status: complete

fit_or_test: >
  MIXED, AND LABELLED THROUGHOUT. Eqs. (54) and (55) - the three-term formulae
  this case is named for - were FITTED BY THE AUTHORS to the twelve Table 4
  points they are compared against, and the paper says so ("the values of the
  constants in (54) are highly uncertain, owing to the relatively small number of
  experimental data that were available"). Every residual against Table 4 on
  this page is therefore a goodness of fit, is called one, and is reported beside
  a null baseline (the best constant H). The same applies to lambda and D_II:
  they were extracted FROM Table 3 by the authors, so refitting Table 3 through
  eq. (49) reproduces the paper's own extraction, not an independent measurement.
  What IS a test: the symbolic chain (34) -> (38) -> (49) -> (52), the Laplace
  cumulants of eqs. (29)/(30), the pymrm PDE against eq. (38), the film thickness
  d_f recomputed from three independent printed constant sets, eq. (56)'s two
  ratios, the slope ratio of section 4, and Table 1's calc column.

printed_defects_found:
  - id: eq21
    severity: substantive
    as_printed: >
      "Ds = a + 2d + sqrt(2 pi) ((a+d)/d) e^(1/2 d^2) (erf((a+d)/sqrt 2) - erf(d/sqrt 2))"
      (eq. 21, p. 275; d is the paper's delta, given by its eq. 22)
    finding: >
      The denominator of the third term cannot be delta. As printed, the
      expression tends to 2 as a -> 0, where the paper's own eq. (24) fixes it at
      4 ("For the Gaussian curve this value of Delta S is just equal to 4 times
      the standard deviation", p. 275); and it DIVERGES as a grows, where the
      paper's own eq. (25) fixes it at a + sqrt(2 pi) for a > 3. With the
      denominator a - which is what deriving Delta s from eq. (19) gives - both
      limits are met (4.0000 and, at a = 5, 7.5066 against the required
      7.5066). Eq. (22) is not free either: it is exactly the inflection
      condition of eq. (19), verified symbolically. And the correction is not
      inferred from the limits - it is DERIVED: writing Delta s = a + 2 delta +
      2 f/|f''| at the inflection point of eq. (19) and applying eq. (22) gives
      the printed third term with a underneath, residual exactly 0, while the
      same derivation minus the printed form leaves
      -sqrt(2 pi) Q e (a - delta)(a + delta)/(a delta). The limits merely
      confirm it.
    consequence: >
      As printed, the width route to the plate number admits no root at all for
      seven of the nine conditions in Table 2, so Table 3's second determination
      cannot be reproduced from it. REPORTED, NOT REPAIRED: the printed form is
      quoted verbatim, shown to fail its own two limits, and the corrected form
      is used with every number that depends on it labelled as resting on a
      correction.
  - id: eq49_subscript
    severity: typographic
    as_printed: '"75 (1 - F_1)^2" in the numerator of C, eq. (49), p. 282'
    finding: >
      The subscript is an arabic 1 where every other occurrence in the same
      expression - and the derivation from eqs. (45) and (46) - requires the
      roman F_I. Reported, not repaired.
  - id: table4_caption
    severity: typographic
    as_printed: '"Experimental data on H.E.T.P. in gas-liquid chromatographic colums." (Table 4 caption, p. 286)'
    finding: 'Printed "colums" [sic] for "columns". Quoted verbatim in the dataset sidecar.'
  - id: eq56_threshold
    severity: minor numerical
    as_printed: '"the two resistances become of equal order of magnitude in the case of a film thickness smaller than about 0 0001 of the particle diameter" (p. 287)'
    finding: >
      Eq. (56) set to unity gives d_f/d_p = sqrt(D_II/(100 D_I)) = 1.83e-4 from
      the paper's own D_II = 0.3e-10 and D_I = 9e-6, i.e. 1.8 times the quoted
      1e-4. THIS IS A ROUNDING, NOT AN ERROR, and the page says so on every
      surface: the sentence is an order-of-magnitude claim quoted to one
      significant figure with "about", and 1.83e-4 is the same order of
      magnitude, which is all it claims. The conclusion it carries (both columns
      are far from that regime, at 3e-7 and 2.5e-5) holds on either number. It is
      recorded here because the quantity is exactly recomputable from printed
      inputs, not because the paper got it wrong; the one substantive printed
      defect on this page is eq. (21) above.

velocity_convention: >
  The paper's List of Symbols (p. 288) defines u as the INTERSTITIAL velocity and
  its eqs. (29)/(30) use it that way, but Tables 2, 3 and 4 and Figs. 11-14 are
  all headed SUPERFICIAL velocity. Fig. 9 converts (its abscissa is u F_I d_p);
  the gas-liquid section does not appear to - the quoted 2 gamma D_I = 8e-6
  m2/s is numerically identical to eq. (54)'s iso-butane B coefficient read in
  mm2/s, i.e. obtained with F_I = 1. F_I is not printed for those columns, so the
  ambiguity CANNOT BE CLOSED; the page states the band of F_I each reading
  requires (0.50 to 1.00, from the paper's own bound 0.5 <= gamma <= 1) and
  carries both readings wherever the difference changes a number. The two
  affected constants move in OPPOSITE directions, and the page prints both: the
  interstitial reading makes gamma larger by 1/F_I (up to 2.0x, since gamma =
  B/(2 D_I F_I)) and d_f^2 smaller by F_I (up to 2.0x in d_f^2, 1.41x in d_f,
  because the fitted C multiplies u_sup = F_I u_int so eq. (53)'s C is F_I times
  the fitted one). 2 lambda d_p is unaffected, because the eddy term contains no
  u at all; and x = K F_I/F_II is printed as a single number, so it carries no
  ambiguity either.

