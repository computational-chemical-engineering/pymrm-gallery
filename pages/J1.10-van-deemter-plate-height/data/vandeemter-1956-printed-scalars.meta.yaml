dataset_id: vandeemter-1956-printed-scalars
title: "van Deemter et al. (1956): every printed scalar this page uses or tests, with the journal page it is on"
source:
  authors: ["van Deemter, J. J.", "Zuiderweg, F. J.", "Klinkenberg, A."]
  year: 1956
  container: "Chemical Engineering Science 5(6) 271-289"
  doi: 10.1016/0009-2509(56)80003-1
  access: institutional subscription (lawful access; Elsevier PII 0009250956800031)
  licence: all rights reserved (tabulated facts extracted; no page image reproduced)
acquisition:
  method: table
  figure: "prose, equations (54)-(56) and table footnotes, pp. 277-287, read on 2x digit-scale crops of 300 ppi renders"
  operator: builder agent (J1.10)
  date: 2026-08-09
  estimated_error: >
    The as_printed column carries the glyphs as they appear, including the
    dropped mid-dot decimals ("0 019" for 0.019, "0 8" for 0.8) and the paper's
    own approximation marks ("~ 165 ml", "about 1.5", "d_f approx 10 mu").
    The text layer of this scan misreads the journal VOLUME in its first line
    (prints 6 where the page prints 5) and was used for nothing numeric.
    Fifty-four of the fifty-six rows are prose, equation or table-footnote
    scalars. TWO - n_fig8_height = 240 and n_fig8_width = 277 - are numbers
    printed as CURVE LABELS on Fig. 8 (p. 280). They are read as printed text,
    not as point coordinates, and the page uses them in one place only: to
    identify which of Table 3's two printed endpoints came from which of the
    paper's two routes to the plate number.
columns:
  - {name: quantity, unit: "-", description: "stable key used by the page"}
  - {name: value, unit: "-", description: "the numeric value in the unit named by the unit column"}
  - {name: unit, unit: "-", description: "SI or the paper's own unit"}
  - {name: page, unit: "-", description: "journal page, 271-289"}
  - {name: kind, unit: "-", description: "'input' = fed to the page's computations; 'result' = stated by the paper and recomputed here"}
  - {name: as_printed, unit: "-", description: "the glyphs as printed, verbatim"}
  - {name: note, unit: "-", description: "context"}
notes:
  fit_test_label: >
    The 'result' rows are what this page tests. They are not measurements: each
    is a number the authors derived from their own tables through their own
    equations, so reproducing one tests the paper's internal arithmetic and this
    page's transcription, not the physics against experiment.
redistribution_basis: >
  Facts, equations and short quotations for verification. No page image is reproduced.
