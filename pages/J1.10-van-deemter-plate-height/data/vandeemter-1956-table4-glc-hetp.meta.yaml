dataset_id: vandeemter-1956-table4-glc-hetp
title: "van Deemter et al. (1956) Table 4: measured plate height versus gas velocity, two gas-liquid columns"
source:
  authors: ["van Deemter, J. J.", "Zuiderweg, F. J.", "Klinkenberg, A."]
  year: 1956
  container: "Chemical Engineering Science 5(6) 271-289"
  doi: 10.1016/0009-2509(56)80003-1
  access: institutional subscription (lawful access; Elsevier PII 0009250956800031)
  licence: all rights reserved (tabulated facts extracted; no page image reproduced)
acquisition:
  method: table
  figure: "Table 4, journal p. 286, read from 2x digit-scale crops of a 300 ppi render"
  operator: builder agent (J1.10)
  date: 2026-08-09
  estimated_error: >
    Transcription only. The 1956 face renders 3 with a nearly flat top, so "3 4"
    and "8 4" are hard to separate at page scale. THREE readings, spanning FIVE
    cells of this table, were settled by an external constraint rather than by
    shape: the Celite "3 4"/"3 5" pair, the Sterchamol "3 2"/"3 3" pair, and "31"
    against "81". Figs. 11 and 13 plot these very rows against a linear velocity
    axis and carry NO point anywhere between u = 5 and u = 15 mm/s, so the two
    pairs read 3.4/3.5 and 3.2/3.3; and Fig. 13's rightmost point sits at u = 31
    on an axis that stops at ~32, which excludes 81. The figures were used only
    to discriminate between two candidate readings of a printed digit - no value
    on this page is taken off a figure.
    ALL THREE ARE ALSO FORCED FROM INSIDE THIS TABLE, which the page computes and
    prints, and which is the stronger statement: the velocity column is printed
    in ascending order in both blocks, so a cell between 2.0 and 4.8 (Celite) or
    2.0 and 5.0 (Sterchamol) cannot read 8.4/8.5 or 8.2/8.3 whatever it looks
    like; and eq. (55), which the authors fitted to these very rows, gives
    4.14 mm at u = 81 against the printed 1.7 mm while landing within 5 % of it
    at u = 31.
columns:
  - {name: solid_carrier, unit: "-", description: "'celite' (~30 um) or 'sterchamol' (240 um; 180-300 um)"}
  - {name: superficial_velocity_mm_s, unit: mm/s, description: "superficial velocity (the printed column head)"}
  - {name: hetp_n_butane_mm, unit: mm, description: "H.E.T.P. for normal butane"}
  - {name: hetp_iso_butane_mm, unit: mm, description: "H.E.T.P. for iso-butane; blank for the Sterchamol block, as printed"}
notes:
  velocity_convention: >
    The column head reads "Superficial velocity (mm/sec)" and Figs. 11-14 read
    "SUPERFICIAL GAS VELOCITY". The paper's own List of Symbols (p. 288) defines
    u as the INTERSTITIAL velocity, and eqs (29)/(30) use it that way. Eqs
    (54)/(55) are fitted to the column below and quoted with "u in mm/sec", i.e.
    with the superficial values of this table. This page measures what that costs.
  particle_size_distribution: >
    The Celite block carries a printed sieve analysis in the "Solid carrier"
    column: >40 um 24%, 40-20 um 52%, 20-10 um 18.5%, 10-6 um 4.5%, <6 um 1%.
    It sums to 100% exactly. Not carried as a column here because it labels the
    whole block, not a row.
  fit_test_label: >
    Eqs (54) and (55) were FITTED to these rows by the authors. Any agreement
    between them and this file is a GOODNESS OF FIT, not a test, and the page
    reports a null baseline beside it.
redistribution_basis: >
