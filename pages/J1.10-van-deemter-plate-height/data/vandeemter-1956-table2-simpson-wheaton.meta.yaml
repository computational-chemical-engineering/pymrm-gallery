dataset_id: vandeemter-1956-table2-simpson-wheaton
title: "Simpson & Wheaton's ion-exclusion elution curves, as tabulated by van Deemter et al. (1956) Table 2"
source:
  authors: ["van Deemter, J. J.", "Zuiderweg, F. J.", "Klinkenberg, A."]
  year: 1956
  container: "Chemical Engineering Science 5(6) 271-289"
  doi: 10.1016/0009-2509(56)80003-1
  access: institutional subscription (lawful access; Elsevier PII 0009250956800031)
  licence: all rights reserved (tabulated facts extracted; no page image reproduced)
reference_origin:
  authors: ["Simpson, D. W.", "Wheaton, R. M."]
  container: "Chemical Engineering Progress (ref. [14] of the 1956 paper)"
  status: origin_not_consulted
  note: >
    NOT ON DISK AND NOT READ. Every value here is van Deemter et al.'s
    restatement of it, and the page says so wherever one carries a result.
    The 1956 reference list prints this entry with a damaged year field; no
    attempt was made to repair it and no page of the original was consulted.
acquisition:
  method: table
  figure: "Table 2, journal p. 280, read from a 2x digit-scale crop of a 300 ppi render"
  operator: builder agent (J1.10)
  date: 2026-08-09
  estimated_error: >
    Transcription only. Two glyph ambiguities were settled by arithmetic, not by
    pixel shape: the velocity column is a doubling series (0.046, 0.091, 0.182,
    0.365, 0.73 - each twice the last to within the printed rounding), which
    fixes "0 365" against "0 865"; and the 0.365 row's width of 23 ml is the only
    reading consistent with Table 3's printed 125-156 plates for the same row.
columns:
  - {name: feed_volume_ml, unit: ml, description: "A, feed volume"}
  - {name: particle_mesh, unit: "-", description: "particle size, US mesh range"}
  - {name: superficial_velocity_mm_s, unit: mm/s, description: "superficial velocity (the printed column head)"}
  - {name: width_at_base_ml, unit: ml, description: "width of the elution curve at its base"}
  - {name: max_height_frac_c0, unit: "-", description: "maximum height of the elution curve, as a fraction of c_0"}
notes:
  effective_column_volume: "nv = 70 ml, printed as the table's own footnote."
  fit_test_label: >
    These are measurements (Simpson & Wheaton's), restated. Table 3 is DERIVED
    from them by van Deemter et al. via their eqs (20) and (21), so any agreement
    between this file and Table 3 is a check on that derivation, not on the model.
redistribution_basis: >
