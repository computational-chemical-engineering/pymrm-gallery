dataset_id: vandeemter-1956-table1-feed-volume
title: "van Deemter et al. (1956) Table 1: width and height of the elution curve versus feed volume"
source:
  authors: ["van Deemter, J. J.", "Zuiderweg, F. J.", "Klinkenberg, A."]
  year: 1956
  container: "Chemical Engineering Science 5(6) 271-289"
  doi: 10.1016/0009-2509(56)80003-1
  access: institutional subscription (lawful access; Elsevier PII 0009250956800031)
  licence: all rights reserved (tabulated facts extracted; no page image reproduced)
acquisition:
  method: table
  figure: "Table 1, journal p. 277, read from 2x digit-scale crops of a 300 ppi render"
  operator: builder agent (J1.10)
  date: 2026-08-09
  estimated_error: >
    Transcription only. The 1956 Pergamon face sets the decimal point as a raised
    mid-dot which the scan drops to a space, so "1 0" is 1.0 and "0 27" is 0.27;
    every such cell was resolved against the paper's own prose ("For the cases of
    1 0, 3 0 and 4 5% of n butane", p. 278). Printed em-dashes are empty cells.
columns:
  - {name: feed_volume_ml, unit: ml, description: "A, feed volume"}
  - {name: butane_pct_in_feed, unit: "%", description: "n-butane concentration in the feed gas"}
  - {name: width_delta_ml, unit: ml, description: "Delta, width of the elution curve (printed as the column head Delta)"}
  - {name: final_retention_volume_ml, unit: ml, description: "S_rf, final retention volume"}
  - {name: cmax_exp, unit: "-", description: "(c_In/c_0)max, measured"}
  - {name: cmax_calc, unit: "-", description: "(c_In/c_0)max, calculated by the authors for n = 650 (their footnote)"}
notes:
  fit_test_label: >
    The cmax_calc column is the authors' OWN calculation from their eq (20) with
    n = 650, where n itself was obtained from these same rows via eqs (24)/(26).
    Reproducing it is an internal-consistency check on the paper's arithmetic,
    NOT a validation of the model against measurement.
redistribution_basis: >
  Facts and measurements are not protected by copyright (Feist, 1991); the
  selection reproduced here is the minimum needed to verify the paper. No page
  image is reproduced.
