adds: >
  Nothing to the closed form: the classical solution is exact, the algebra is
  short, and every number the solve gives is also given by the closed form derived
  on the page.

  One flow field, read twice. The cloud volume (equation 9) and the convective
  part of the interchange coefficient (the 4.5 in equations 10 and 11) appear in
  the reactor literature as separate correlations. The derivation on the page
  shows they are the same field evaluated in two ways. What the pymrm solve adds
  beyond it is a check of that derivation: the discrete operator, given only the
  boundary-value problem, reproduces the cloud radius and the 4.5 at its
  discretisation error, and the break table shows which output catches which
  operator error.

  A threshold rather than a limit. V_c/V_b = 3/(u_br/u_f - 1) has a pole at
  u_br = u_f. Applied to the paper's own appendix beds it puts appendix B on the
  wrong side, at u_br/u_f = 0.787 <!-- claim: ubr_over_uf_B -->; nothing in the
  paper is wrong, because appendix B never evaluates equation 9, but the paper
  never says how fast a bubble must be for equation 9 to apply. The verdict is
  robust to the eps_mf that appendix B's printed (1 - eps_f)(u_0 + 5.8) implies.

  The asymmetry between the two constants. u_br never enters the gas potential,
  so the through-flow, and therefore the 4.5, holds on both sides of that
  threshold while the 3 in equation 9 does not.

  The two-dimensional bubble from one argument. nu = 1 instead of 2 gives
  R_c/R = [(u_br+u_f)/(u_br-u_f)]^(1/2), a larger cloud at the same velocity
  ratio, and a through-flow of 8 u_mf/(pi d_b). Kunii and Levenspiel print only
  the 3-D form.

agreement: >
  Tier 6. Nothing on this page is compared with a measurement, and the source
  contains no single-bubble measurements to compare with. The printed numbers are
  the authors' own arithmetic, already reproduced on E2.1 from the same
  transcription, and are not counted as independent confirmation. The internal
  numbers are discretisation errors against the closed form derived on the page,
  each with a break row that moves it.

caveats: >
  No experimental comparison, and not because one was skipped: Kunii and
  Levenspiel (1968) reports conversions and transfer coefficients for whole beds,
  never observations of a single bubble. Everything here is either the authors'
  own arithmetic or this page's own derivation.

  Every equation and number was read from Kunii & Levenspiel (1968) on 600 dpi
  renders of journal pages 482, 490, 491 and 492. Their attribution for the
  underlying object is one parenthesis: the name Davidson appears in the body of
  the paper exactly once, on journal page 490, inside a list of the model's
  simplifying assumptions - "many simplifying assumptions were made in developing
  this model (the Davidson bubble, bed with single size of bubbles, ...)". There
  is NO Davidson & Harrison entry in their literature cited on journal page 492,
  where Davidson, J. F. appears only as a co-author of Orcutt, Davidson & Pigford
  (1958); equations 3 and 9 and the 0.711 carry no citation at all; and the
  derivations are credited to Kunii & Levenspiel (1968b), I&EC Fundamentals 7 446,
  which is not on disk. The monograph normally cited as the origin of these
  results, Davidson & Harrison's Fluidised Particles, was NOT consulted and is the
  source of nothing here - and even the knowledge that it is the usual citation is
  general background rather than something traced to a document read for this
  page. The derivation on the page is done from scratch rather than copied from
  any source.

  Appendix C's u_0 = 13.2 cm/s, which enters the reproduced u_b, is printed by
  Kunii & Levenspiel as (6.6 + 9.9 + 13.2 + 20)/5 = 13.2, four terms divided by
  five, a slip E2.1's sidecar records and declines to repair. 13.2 is the value
  the authors use throughout, and the page inverts the CSV's own printed u_b and
  u_br back to it rather than only retyping it. Appendix B's printed
  (1 - eps_f)(u_0 + 5.8), which implies a smaller eps_mf than the stated 0.50,
  touches a verdict and is therefore tested on the page rather than merely noted.

  The 0.711 in u_br is taken as given, not derived - it is the Davies-Taylor
  spherical-cap rise velocity and does not follow from the percolation problem at
  all. The 5.85 diffusive terms in equations 10 and 11 are likewise used only as
  printed constants; they are a penetration-theory contribution the 1968 paper
  does not derive.

  The model itself assumes a spherical bubble, a uniform pressure over its
  surface, an emulsion exactly at minimum fluidisation, inviscid potential flow of
  the solids and Darcy flow of the gas, and an isolated bubble. Real bubbles are
  spherical caps with wakes; the wake fraction alpha in equation 17 is empirical
  (Rowe & Partridge, 1965) and is no part of this theory. And d_b is a fitted
  effective bubble size in the reactor model, not a measured diameter - E2.1 says
  so at length - so the appendix values used here inherit that.
