validation:
  - >-
    the through-flow computed from the pymrm flow field rebuilds the coefficient 4.5
    that opens Kunii and Levenspiel's equations 10 and 11, with 4.5 entering the code
    nowhere; at n = 1600 it is off by 1.1e-6 <!-- claim: throughflow_coefficient_rel
    -->, the discretisation error
  - >-
    eight single-defect breaks of the operator and its boundary conditions (a wrong
    geometry index, mismatched sink coefficients, an l = 2 sink, a far-field factor, a
    flipped outward normal, a flipped far-field datum, a truncating Dirichlet far
    field) each fail the through-flow claim; the break table records every claim each
    defect fails
  - >-
    grid convergence against the closed form derived on the page is second order
    (field error order 2.00 <!-- claim: grid_order_observed -->), and the observed
    order of the cloud radius from pymrm.checks.observed_orders on a nested ladder
    needs no exact solution; the cloud radius is 7.2e-8 <!-- claim: Rc_rel_error_n1600
    --> of R off the closed form at n = 1600
  - >-
    the far-field Robin condition is measured, not assumed - extending the domain from
    20 R to 400 R with the same cells near the bubble moves R_c by below 1e-9 <!--
    claim: far_field_robin_shift_Rc --> of R, while a truncating Dirichlet condition
    moves it at the size of its truncation
  - >-
    the cloud radius is found a second way, by integrating gas trajectories through
    spline interpolants of the computed field and bisecting on release radius; the gap
    is below 1e-10 <!-- claim: Rc_two_routes_rel -->, set by the interpolants and the
    bisection, and it confirms the topology claim rather than supplying an independent
