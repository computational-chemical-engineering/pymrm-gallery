  - >-
    the R_c/R limits hold to 5.3e-7 <!-- claim: limit_worst_rel --> for u_br/u_f from
    1.001 to 1000, below u_br = u_f the model returns no cloud, and a cloud beyond the
    outer radius raises instead of being reported as absent
  - >-
    the discrete integral identity is reported as the algebraic identity it is; it
    detects a geometry index or sink coefficient that differs from the model's nu and
    nothing else, staying at round-off under the boundary-condition defects
  - >-
    K_bc and H_bc reassembled from the derived through-flow plus the printed 5.85
