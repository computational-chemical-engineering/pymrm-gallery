dataset_id: krishna-1997-fig6
title: 'Fig. 6 markers: dense-phase voidage against U, 0.38 m column, four slurry concentrations'
status: complete
conditions:
  column_diameter_m: 0.38
  liquid: paraffin oil
  solids: porous silica
  gas: air
acquisition:
  method: digitised
  figure: Figure 6, journal p. 314 (PDF page 4)
  tool: 'poppler pdftoppm -r 300 -gray (the scan is a 300 ppi bilevel image), ink = grey < 128; numpy
    and scipy.ndimage scripts: tick marks located as short ink runs normal to each axis line, linear calibration
    by least squares through the tick centres'
  procedure: 'Matching pursuit with outline templates (circle 21 px, diamond 27, square 23, triangle 25,
    stroke 3): score = outline coverage by the 1-px dilated ink - 0.6 x interior fill - 0.5 x ink in a
    shell 2 to 4 px off the outline; best (position, shape) taken, its outline erased, repeated down to
    score 0.6. Centre refined to sub-pixel by the coverage-weighted mean over +-2 px. Series: eps_s 0
    and 0.16 by their disjoint bands (eps_df above 0.2, 0.08 to 0.17); below 0.08 by the square-minus-triangle
    local score gap (|gap| > 0.1), otherwise `unassigned`. Overlapping markers in the U < 0.15 m/s clusters
    are partly missed. Rows with legend = yes are the legend glyphs, found only when the legend box is
    not masked; they are not data (break row "legend unmasked").'
