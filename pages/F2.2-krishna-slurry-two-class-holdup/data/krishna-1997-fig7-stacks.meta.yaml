  liquid: paraffin oil
  solids: porous silica
  gas: air
acquisition:
  method: digitised
  figure: Figure 7, journal p. 314 (PDF page 4)
  tool: 'poppler pdftoppm -r 300 -gray (the scan is a 300 ppi bilevel image), ink = grey < 128; numpy
    and scipy.ndimage scripts: tick marks located as short ink runs normal to each axis line, linear calibration
    by least squares through the tick centres'
  procedure: 'Markers in each stack overlap, so no marker can be counted and no mean is formed. Per stack:
    vertical extent of the ink (components over 25 px) in a column band around the eps_s position, after
    removing a +-3.5 px strip around the drawn line, the legend, the axis line and tick marks; centre
    range = extent shrunk by the glyph half height (circle 10.5 px, square 11.5, diamond 13). eps_s 0:
    all three diameters overlap on the y-axis line and are not separable; the whole stack is given (top
    glyph circle, bottom glyph square). eps_s 0.16: open 0.10 m circles above a solid mass of 0.38 m diamonds,
    split by the row profile (lowest open circle interior; first and last full-width rows of the diamond
    mass). eps_s 0.35 and 0.36 overlap: narrow +-4 px bands around each position.'
