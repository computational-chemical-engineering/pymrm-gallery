# Ranked by measured power: the notebook's break table re-evaluates every claim
# with one defect injected.
validation:
  - >-
    PRIMARY - the dense-phase half of the split against Fig. 6 and Fig. 7: at
    eps_s = 0.16 the lowest 0.10 m centre sits 0.0198 <!-- claim: dense_016_gap_D010_minus_fig6 -->
    from the 0.38 m Fig. 6 mean, still 0.0149 <!-- claim: dense_016_margin --> after the
    read error and two standard errors; the 0.38 m mean has a residual of -0.0342
    <!-- claim: fig6_minus_eq4_es016 --> against eq. 4 at that concentration
  - >-
    PRIMARY - the dilute-phase half against Fig. 8a and 8b: amplitude ratios 1.104
    <!-- claim: dilute_ratio_D019_low --> (0.19 m) and 0.880 <!-- claim: dilute_ratio_D038_low -->
    (0.38 m) to 0.10 m against 0.891 and 0.786 for N = 0.18, free N 0.11
    <!-- claim: dilute_free_N -->; slurry ratio 1.152 <!-- claim: slurry_ratio_D038 --> at
    0.38 m against 1 and the paper's alpha2 ratio
  - >-
    the printed constants against the drawn lines: Fig. 5 lines -16.6 %
    <!-- claim: fig5_gap_eq2_es0 --> and 17.5 % <!-- claim: fig5_gap_eq2_es005 --> off eq. 2 at
    eps_s 0 and 0.05; Fig. 7 line 0.10 <!-- claim: fig7_intercept_halfunits --> half-units from
    0.27; Fig. 9 curves on eqs. 2 to 7 with the printed alpha2
  - >-
    the pymrm two-class reactor converges at first order to the closed form on six
    nested grids, with a round-off companion; 101 check values of a second route agree
  - >-
    STRUCTURAL - eq. 1 inverts eq. 7, eq. 3 meets eq. 7 at U_df, the residence-time
    identity, and the Danckwerts limits

adds: >
  Nothing in the holdup tests, which are algebra on figure reads. In the reactor
  consequence every number has a closed form; pymrm supplies find_roots for every
  root (design root, per-gas crossing, U_df maximum) and the assembled two-class
  reactor (upwind plug flow with an outflow outlet, convection-dispersion with a
  Danckwerts inlet, one linear newton step), converging at first order to the closed
  form.

agreement: >
  Eqs. 2 to 7 against the Fig. 9 markers: 3.4 % <!-- claim: fig9_mad_es035 -->, 3.8 %
  <!-- claim: fig9_mad_es0 --> and 3.7 % <!-- claim: fig9_mad_es036 --> mean absolute
  deviation for the three sets. Eq. 4 against Fig. 6 (0.38 m): the series means are
  below eq. 4 in 4 <!-- claim: fig6_series_below_eq4 --> of 4 series.

caveats: >
  Fig. 4a is not digitised. Fig. 7's stacks give ranges, never means, and at eps_s = 0
  the diameters cannot be separated, so diameter independence of eps_df is tested at
  eps_s = 0.16 only. In Fig. 8b only markers isolated from the dense band carry a
  label, which can bias those amplitudes; the 0.10 m high-slurry series has 7
  <!-- claim: fig8_n_D010_high --> labelled markers and gets no amplitude. The reactor
  numbers are consequences of the correlations with an illustrative rate constant,
  equal in both classes; nothing in the paper measures a conversion.
