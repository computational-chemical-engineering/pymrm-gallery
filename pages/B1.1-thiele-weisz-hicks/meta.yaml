datasets:
  - isothermal-exact.csv

validation:
  - isothermal eta against the exact closed form, three geometries
  - grid convergence order at fixed Thiele modulus, per geometry, with a round-off guard
  - non-isothermal continuation (pymrm.continuation) against an independent shooting solution
  - steady states at the probe modulus, root-found on the reference and solved by Newton on the pellet
  - the library continuation against the page's own warm-start loop
  - Prater bound on the centre temperature rise
  - 48 claims (one structural), each other one failed by at least one of 55 break rows that re-run its computation

adds: >
  Nothing for the isothermal case, deliberately - Thiele's formula is exact and
  the value is that it pins the discretisation to 2.2e-4 and confirms second-order
  convergence. For the non-isothermal case, the entire solution branch: making
  phi^2 an unknown and pinning the centre concentration turns the multivalued
  eta(phi) curve single-valued, and pymrm.continuation traces it in one sweep,
  including the unstable middle branch, which continuation in phi cannot reach.

agreement: >
  Isothermal 2.2e-4 max relative error for phi <= 30 at n_r = 200; the error
  grows to 6.5e-3 by phi = 100 where the surface layer is thinner than a cell,
  and falls to 1.9e-5 under refinement to n_r = 1600. Non-isothermal
  continuation agrees with the shooting reference to 1.0e-5 median relative
  deviation in eta at equal centre concentration. At beta = 0.6, gamma = 20 the
  fold spans 0.2973 < phi < 0.5719 and phi = 0.4123 has three steady states:
  reference 1.1731 / 6.2055 / 44.450 (root-found), pymrm 1.1731 / 6.2054 /
  44.450 (Newton at fixed phi). Before the 2026-10 refresh the states were
  interpolated on sampled curves (reference 1.177 / 6.207, pymrm 1.173 / 6.225),
  a 0.3 % gap that was interpolation, not discretisation.

caveats: >
  Provenance tier 6 - this page is validated against exact and reference
  solutions, NOT against experiment. Neither source paper reports measurements.
