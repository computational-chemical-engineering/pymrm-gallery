adds: >
  Nothing for the isothermal case, deliberately - Thiele's formula is exact and
  the value is that it pins the discretisation to 2e-4 and confirms second-order
  convergence. For the non-isothermal case, the entire solution branch: making
  phi^2 an unknown and pinning the centre concentration turns the multivalued
  eta(phi) curve single-valued and traces it in one sweep, including the
  unstable middle branch that Newton iteration on phi cannot reach.

agreement: >
  Isothermal 2.2e-4 max relative error for phi <= 30 at n_r = 200; the error
  grows to 6.5e-3 by phi = 100 where the surface layer is thinner than a cell,
  and falls to 1.9e-5 under refinement to n_r = 1600. Non-isothermal
  continuation agrees with the shooting reference to 1.0e-5 median relative
  deviation in eta at equal centre concentration. At beta = 0.6, gamma = 20 the
  fold spans 0.297 < phi < 0.572 and phi = 0.412 has three steady states:
  reference 1.177 / 6.207 / 44.450, pymrm 1.173 / 6.225 / 44.450.

caveats: >
  Provenance tier 6 - this page is validated against exact and reference
  solutions, NOT against experiment. Neither source paper reports measurements.
