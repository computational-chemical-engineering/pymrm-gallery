dataset_id: aris-1957-table1
title: "Aris (1957) Table 1 — effectiveness factor against the generalised modulus, three shapes"
status: complete

source:
  authors:
    - "Aris, R."
  year: 1957
  container: "Chemical Engineering Science 6(6) 262-268"
  doi: 10.1016/0009-2509(57)85028-3
  access: >
    Institutional subscription (TU/e), retrieved through the Elsevier article
    retrieval API. Reprinted verbatim as Chemical Engineering Science 50(24)
    3899-3903 (1995), doi:10.1016/0009-2509(96)81819-7, for the journal's Golden
    Jubilee; both printings were retrieved and compared.
  licence: "all rights reserved (numerical values extracted as facts; no figure or page image reproduced)"

acquisition:
  method: table
  figure: "Table 1, journal page 265 (1957) / page 3901 (1995 reprint)"
  procedure: >
    Transcribed from the text layer of BOTH printings. The 1957 scan is a poor
    OCR of a mid-dot-decimal typesetting and cannot be trusted on its own (it
    renders 0.698 as 898 and 0.432 as 482); the 1995 reprint is a clean
    re-typesetting whose text layer is legible. Every digit below is one on
    which the two printings agree, or on which the 1995 reprint is unambiguous
    and the 1957 OCR is merely mangled in a way consistent with it.

    A 600 dpi page render was NOT obtainable: the institutional entitlement
    returns only a one-page preview PDF for both printings (journal pages 262
    and 3899), and Table 1 is on pages 265 / 3901. The transcription is instead
    checked against the paper's own closed-form equations (15)-(17), which
    reproduce 19 of the 21 entries to <= 0.0008 - i.e. to the printed
    three-decimal precision. See `estimated_error`.

    Retried 2026-08-02 when a 1957 PDF appeared in ~/papers/pymrm-gallery/. It is
    the same one-page preview, so the render is still not available; the
    article-object endpoint was also queried and holds no page images for either
    PII. Nothing in this file changed as a result - the retry is recorded so it
    is not repeated.
  tool: "Elsevier article retrieval API (text/plain), PII 0009250957850283 and 0009250996818197"
  operator: "Claude Opus 5 (assisted), NOT yet reviewed by the gallery maintainers"
  date: 2026-07-31
  estimated_error: >
    Exact as printed for 19 of 21 entries. The two exceptions are the cylinder
    column at Lambda = 5 (printed 0.197, eq. 16 gives 0.1897, +3.8%) and at
    Lambda = 10 (printed 0.100, eq. 16 gives 0.0975, +2.6%). Both printings show
    the same digits there, so these are almost certainly arithmetic slips in the
    original rather than transcription errors - but without a page render that
    cannot be stated with certainty, and the page reports them as a discrepancy
    rather than correcting them. Three eliminations, added 2026-08-02: the plate
    and sphere columns are right at those same two moduli to 0.0003; the first
    five rows of the cylinder column reproduce eq. 16; and no single rescaling of
    Lambda fits both cells (0.197 would need 0.961x the stated modulus, 0.100
    would need 0.974x), so the column is not eq. 16 at some other definition of
    Lambda. That narrows the cause but does not read the print.

provenance_tier: 6

not_experimental: >
  THIS IS NOT MEASURED DATA. Aris (1957) is a purely analytical paper and reports
  no experiments. Table 1 is the author's own evaluation of his equations
  (15)-(17). Reproducing it therefore tests the transcription of those equations
  and the numerics used here; it is not a test against nature. Experimental
  effectiveness-factor measurements on non-spherical pellets exist elsewhere in
  the literature and would make a valuable companion page.

columns:
  - {name: Lambda,      unit: "-", description: "generalised modulus, lambda * v_p / s_x"}
  - {name: shape,       unit: "-", description: "plate | cylinder | sphere (flat plate, cylinder with sealed ends, sphere)"}
  - {name: eta_printed, unit: "-", description: "effectiveness factor as printed in Table 1"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist, 1991);
  extraction for scientific research from a lawfully accessible work is covered
  by Art. 15n Auteurswet (DSM Art. 3). Neither the original table image nor the
  source PDF is reproduced or committed.
