  figure: "worked example in the running text of section 4"
  procedure: >
    Transcribed from the text layer of both printings, as the other two tables
    of this page. The inputs (five flat-plate sizes in equal fractions 0.2, at
    Lambda = 0.5, 1, 2, 5, 10) and the first two results (mean modulus 1.316,
    eta at that mean 0.658) read the same in both printings, and eqs. 19-20
    reproduce both results from the inputs, which confirms the inputs. The third
    result, eta of the mixture, reads 0.397 in the 1995 reprint and 0.897 in the
    1957 scan; eq. 19 gives neither, so both readings are kept with their
    printing and neither is used as a reference.

    A 600 dpi page render was NOT obtainable: the institutional entitlement
    returns a one-page preview PDF only, and this example is not on that page.
