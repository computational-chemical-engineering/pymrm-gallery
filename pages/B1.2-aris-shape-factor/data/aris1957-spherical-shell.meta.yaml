dataset_id: aris-1957-spherical-shell
title: "Aris (1957) section 3 — effectiveness factor of a spherical shell against inner:outer radius ratio, at Lambda = 1"
status: complete

source:
  authors:
    - "Aris, R."
  year: 1957
  container: "Chemical Engineering Science 6(6) 262-268"
  doi: 10.1016/0009-2509(57)85028-3
  access: >
    Institutional subscription (TU/e), retrieved through the Elsevier article
    retrieval API. Cross-checked against the 1995 verbatim reprint,
    doi:10.1016/0009-2509(96)81819-7.
  licence: "all rights reserved (numerical values extracted as facts; no figure or page image reproduced)"

acquisition:
  method: table
  figure: "unnumbered table in section 3, journal page 265 (1957) / page 3901 (1995 reprint)"
  procedure: >
    Transcribed from the text layer of both printings. The two disagree at
    p = 0.75 (1957 OCR gives 728, the 1995 reprint gives 0.723). The paper's own
    shell expression, transcribed independently, evaluates to 0.72273 there, so
    the 1995 reading is the correct one and the 1957 value is an OCR corruption.
    All five entries are reproduced by that expression to <= 0.00041, which is
    the printed rounding.

    A 600 dpi page render was NOT obtainable: the institutional entitlement
    returns a one-page preview PDF only, and this table is not on that page.
  tool: "Elsevier article retrieval API (text/plain), PII 0009250957850283 and 0009250996818197"
  operator: "Claude Opus 5 (assisted), NOT yet reviewed by the gallery maintainers"
  date: 2026-07-31
  estimated_error: "exact as printed (three decimals); confirmed by the paper's own shell expression to 0.00041"

provenance_tier: 6

not_experimental: >
  THIS IS NOT MEASURED DATA. These are the author's own evaluations of his
  spherical-shell expression at Lambda = 1, tabulated to illustrate how much the
  effectiveness factor varies with shape at fixed generalised modulus.

columns:
  - {name: p,           unit: "-", description: "inner:outer radius ratio of the shell; p = 0 is a solid sphere, p = 1 a flat plate"}
  - {name: Lambda,      unit: "-", description: "generalised modulus, lambda * v_p / s_x (= 1 throughout this table)"}
  - {name: eta_printed, unit: "-", description: "effectiveness factor as printed"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist, 1991);
  extraction for scientific research from a lawfully accessible work is covered
  by Art. 15n Auteurswet (DSM Art. 3). Neither the original page image nor the
  source PDF is reproduced or committed.
