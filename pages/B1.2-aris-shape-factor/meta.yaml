also:
  note: >
    Reprinted verbatim as Chemical Engineering Science 50(24) 3899-3903 (1995),
    doi:10.1016/0009-2509(96)81819-7. The 1995 re-typesetting has a clean text
    layer and is the version to read; the 1957 scan OCRs badly.

validation:
  - eqs. 15-17 reproduce 19 of the 21 entries of Aris's Table 1 to 0.00078, within one unit of the printed third decimal (17 round to the printed digits); the two that do not are both in the cylinder column at Lambda = 5 and 10, printed high by 3.8% and 2.6%, while the plate and sphere columns are right at those moduli to 0.0003 and no single rescaling of Lambda fits both cells (0.961x and 0.974x, each the only root found), so the column is eq. 16 and the two cells are slips in it
  - the spherical-shell expression, transcribed from a mangled scan, reproduces all five printed values to 0.00041 and approaches eq. 17 as p^3 and eq. 15 linearly in 1 - p
  - pymrm 1-D reproduces eqs. 15-17 and the shell expression to 2.4e-4 worst case at n = 400 (Lambda up to 20); the sphere ladder at Lambda = 1 is second order from successive differences (pymrm.checks.observed_orders)
  - the 2-D axisymmetric solve reproduces Aris's unevaluated double series to 4.2e-4 when p is read as radius:length (his nomenclature), a gap that is grid error (over all 16 cases the Richardson limits on 80/160/320 radial cells lie below 1e-5 from the series), and the series is off by 47% of the solved value when p is read as in his running text
  - the 2-D square rod and the 3-D cube reproduce independent eigenfunction expansions to 8.2e-6 and 7.5e-5; the cube's 8/16/32 ladder converges at an order between 2 and 3 (pre-asymptotic) to within 2e-5 of its series; the sweep's cube curve is that series at every Lambda
  - every series is truncated far below the gaps it judges (measured by doubling the terms)
  - eq. 18, eta*Lambda -> 1, extrapolates to 1 within 1.2e-4 on the references (the line fit; the cylinder reference is a closed-form axial sum, truncated by 5e-8 at Lambda = 50) and within 0.0011 on pymrm solves for five shapes including two with edges
  - eqs. 19-20 reproduce his worked mixture example (mean modulus and eta at the mean)
  - eta from the surface flux (compute_boundary_values) equals the volume average to the solve residual; it is the same sum, not a second route
  - every claim is failed by at least one row of a break table that injects one defect

adds: >
  Aris quantified the shape-independence of the v_p/s_x collapse on the only
  three shapes with closed-form answers, and wrote that the general case "would
  be an excessively difficult task, equivalent to solving the problem
  completely". One pymrm class (construct_grad, construct_div with nu on axis 0,
  construct_coefficient_matrix) solves the shell, finite cylinders from long rod
  to flat disc, a square rod and a cube, each checked against its closed form or
  series (every shape here is separable, so each has one; the solver needs no
  derivation per shape and is independent of them). With
  their curves and the closed forms over fourteen shapes, the band is 0.1165
  wide at its widest, 27% wider than his plate-to-sphere 0.0918; its edges are
  the plate (closed form) and the cube (eigenfunction series, checked by the 3-D
  solve at Lambda = 1). The sphere, which Table 1 makes look like the extreme
  case, is not the floor: at the same v_p/s_x = a/3 the cube lies up to 0.026
  below it, with the cylinder of length 2a between them. The 2-D solve also
  settles the factor-of-two ambiguity in his case (iv) series, which the paper
  cannot settle because it never evaluates it.

agreement: >
  Not applicable in the experimental sense; Aris (1957) contains no measurements
  and this is a tier 6 analytic page. Eqs. 15-17 match 19 of 21 Table 1 entries
  to 0.00078. The shell expression matches all five printed values to 0.00041.
  pymrm matches the closed forms to 2.4e-4 in 1-D, the printed double series to
  4.2e-4 in 2-D (grid error), and eigenfunction expansions to 8.2e-6 (square
  rod) and 7.5e-5 (cube on 32^3).

caveats: >
  No experimental comparison is possible from this source. A 600 dpi page render
  could NOT be obtained: the institutional entitlement returns a one-page preview
  PDF for both the 1957 printing and the 1995 reprint (journal page 262 / 3899),
  the 1957 PDF archived on disk is that same preview, and the Elsevier
  article-object endpoint holds no page images for either PII. The transcription
  therefore rests on two independent text layers that agree with each other plus
  the paper's own algebra. The two cylinder-column entries at Lambda >= 5 are
  reported as a discrepancy rather than corrected; they cannot be a different
  definition of Lambda, since no single factor fits both rows. The third number
  in the section 4 mixture example cannot be established: the two printings give
  0.397 and 0.897 and eq. 19 gives 0.4936; it is left as printed. The cube's
  curve in the sweep is its eigenfunction series at every Lambda, not a pymrm
  solve; the O(1/lambda) reacting layer is not resolved by uniform 24^3 or 32^3
  grids (they differ by 11% at Lambda = 20), and the series is checked against
  the 3-D solve at Lambda = 1 only. The widened band is a statement
  about the idealised isothermal first-order problem with no film resistance.

