validation:
  - "THE BED MODEL AGAINST THE PAPER'S CLOSED FORM: eq. (4) with Danckwerts conditions, one sparse solve per grid, on a ladder of 200 to 3200 cells; observed orders 1.00 <!-- claim: pymrm_order_min --> to 1.03 <!-- claim: pymrm_order_max --> from successive differences, the extrapolated value below 1e-5 <!-- claim: pymrm_vs_eq7_richardson --> from eq. (7), the finest difference far above the solve residual."
  - "EQ. (7) COLLAPSES ONTO EQ. (8): ln(theta_7/theta_8) Pe_L/N^2 = 0.99995 <!-- claim: eq7_eq8_rate --> at `Pe_L = 1e5`, against the limit `1`; this is why the liquid data survive the re-analysis."
  - "THE LIQUID CORRECTION OVER THE WHOLE ACCEPTED RANGE: at most 1.33 % <!-- claim: liquid_correction_max --> at L/d_p = 10 and 1.39 % <!-- claim: liquid_correction_max_all_Ldp --> for L/d_p up to 100, against conclusion 1's 'not appreciably different'."
  - "THE STAGNANT-SPHERE LIMIT: eqs. (9) and (12) tend to 2 for any constants, an identity of the form; eq. (11) crosses Sh = 2 at Re = 4.59 <!-- claim: eq11_crosses_sh2_Re -->, a root over 1e-6 <= Re <= 1e6."
  - "PETROVIC AND THODOS' EQ. (11) RE-ANALYSED with eq. (2) returns eq. (12) to 1.67 % <!-- claim: eq11_reanalysed_vs_eq12_mean_abs_dev_logRe --> mean and 4.48 % <!-- claim: eq11_reanalysed_vs_eq12_worst --> worst over 100 <= Re <= 900, nothing fitted; the same re-analysis on the pymrm solve agrees below 1e-3 <!-- claim: reanalysis_route_gap -->."
  - "THE CALIBRATION CONTROL: Figure 3's drawn correlation refitted from its own ink returns 1.107 <!-- claim: fig3_drawn_line_alpha_skew --> / 0.598 <!-- claim: fig3_drawn_line_beta_skew --> against the printed `1.1` / `0.6` with the column-dependent ordinate origin that corrects a 5.64 <!-- claim: fig3_tick_skew_px --> px decade-tick skew."
  - "THE ERASURE BAND SWEPT as the dominant systematic on the Figure 3 refit: free alpha 1.296 <!-- claim: refit_liquid_alpha_band_lo --> to 1.440 <!-- claim: refit_liquid_alpha_band_hi -->, alpha at the printed beta 1.098 <!-- claim: refit_liquid_alpha_beta_fixed_logmetric_lo --> to 1.118 <!-- claim: refit_liquid_alpha_beta_fixed_logmetric_hi --> over both calibrations."
  - "THE FREE REFIT'S ERROR MODEL TESTED: a quadratic term at t = 5.0 <!-- claim: refit_liquid_quadratic_term_z -->, Newey-West standard errors 1.4 <!-- claim: hac_inflation_alpha_min --> to 1.9 <!-- claim: hac_inflation_alpha_max --> times the ordinary ones, and a bootstrap of whole Re bins 2.5 <!-- claim: refit_liquid_cluster_se_inflation_alpha --> times."
  - "A DEFECT-INJECTION TABLE: every printed constant, the solver's boundary condition, geometry, sign and sink, both figures' axis calibrations and the data choices are injected one at a time through the functions that compute the claims; every claim fails under at least one row."

adds: >
  The bed model as a solved boundary-value problem. pymrm discretises eq. (4)
  with Danckwerts conditions on the outward normal, reads the outlet through the
  same condition, and on a grid ladder shows that the paper's eq. (7) is its
  solution. The inversions run on eq. (7), which is exact; the re-analysis also
  runs on the pymrm solve with the same root finder and agrees to the
  discretisation error, the route a bed model with no closed form would need. The
  correlation and the figure statistics owe pymrm nothing.

agreement: >
  Deviation is (model - measured)/measured throughout. The data-free results are
  the strong ones: eq. (11) re-analysed with eq. (2) returns eq. (12) to
  1.67 % <!-- claim: eq11_reanalysed_vs_eq12_mean_abs_dev_logRe --> on average
  over 100 <= Re <= 900 with nothing fitted, and the liquid correction stays
  below 1.39 % <!-- claim: liquid_correction_max_all_Ldp -->. Against the
  79 <!-- claim: n_fig2_markers --> Figure 2 markers eq. (12) has a mean absolute
  deviation of 27.2 % <!-- claim: eq12_vs_fig2_mean_abs_dev --> and a bias of
  +9.7 % <!-- claim: eq12_vs_fig2_bias -->, standard error
  3.6 % <!-- claim: eq12_vs_fig2_bias_se -->; against the
  182 <!-- claim: n_fig3_markers --> Figure 3 markers it was fitted on,
  17.6 % <!-- claim: eq12_vs_fig3_mean_abs_dev --> and
  +2.3 % <!-- claim: eq12_vs_fig3_bias -->, standard error
  1.6 % <!-- claim: eq12_vs_fig3_bias_se -->.

  With beta held at the printed value the Figure 3 markers return
  alpha = 1.1000 <!-- claim: refit_liquid_alpha_beta_fixed -->, and between
  1.007 <!-- claim: refit_liquid_alpha_beta_fixed_grid_lo --> and
  1.118 <!-- claim: refit_liquid_alpha_beta_fixed_grid_hi --> over every erasure
  band, both calibrations and three estimators; the free alpha over the same
  choices runs from 1.05 <!-- claim: refit_liquid_alpha_free_grid_lo --> to
  1.46 <!-- claim: refit_liquid_alpha_free_grid_hi -->. The free log-log fit gives
  1.344 <!-- claim: refit_liquid_alpha --> / 0.5496 <!-- claim: refit_liquid_beta -->,
  the same points in linear y 1.157 <!-- claim: refit_liquid_alpha_linear_metric -->
  / 0.584 <!-- claim: refit_liquid_beta_linear_metric -->; the bin-bootstrap 95 %
  interval of alpha, 1.04 <!-- claim: refit_liquid_alpha_cluster_ci_lo --> to
  1.53 <!-- claim: refit_liquid_alpha_cluster_ci_hi -->, contains the printed
  value. The page does not claim the printed constants are wrong.

caveats: >
  NEITHER figure extraction has been confirmed by a maintainer beyond Figure 2's
  marker identifications; the sidecars carry the review questions.

  Recall is short on both figures, and on Figure 3 the loss is DIRECTIONAL:
  markers lying on the drawn correlation are the ones the line removal is most
  likely to destroy, which biases a refit away from the printed alpha and beta.
  The band sweep is shipped as data and bounds that from one side only.

  Figure 2's three drawn curves all sit slightly above their computed rows (the
  sidecar's residual_offset); the ordinate is NOT corrected, because one of the
  three supplied the voidage. One pixel of ordinate origin is
  0.68 % <!-- claim: fig2_sh_per_px --> in every Sh.

  Series identity is not carried on either figure; the fitted marker shape is
  advisory and nothing on the page reads it.

  The bed voidage is inferred from the eq. (11) line drawn in Figure 2, not
  stated in the paper. L/d_p is swept rather than known. Where a gas bed
  saturates depends on its length: with an outlet resolution of `1e-3`, below
  Re = 85.0 <!-- claim: gas_saturation_Re_Ldp10 --> at L/d_p = 10, nowhere in the
  range at L/d_p = 5.
