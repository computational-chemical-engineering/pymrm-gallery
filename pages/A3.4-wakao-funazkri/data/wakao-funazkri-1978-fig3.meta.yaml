  - {name: Re, unit: "-", description: "particle Reynolds number on the superficial velocity, d_p U eps_b / nu"}
  - {name: Sh_minus_2_over_Sc13, unit: "-", description: "(Sh - 2)/Sc^(1/3), the group the figure plots; Sh reevaluated with eq. (2)"}
