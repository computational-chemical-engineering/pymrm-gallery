    Figure 3 calibration is no longer the one they saw.

missing:
  - "The stretches of the curve covered by marker chains, which are exactly the
     columns the single-thin-run filter rejects. They are missing by design, not
     by failure, and their absence is why a fit to this file must be binned by
     column."

columns:
  - {name: col_px, unit: px, description: "column in the 600 dpi crop"}
  - {name: row_px, unit: px, description: "ink centroid of the drawn curve in that column"}
  - {name: run_px, unit: px, description: "vertical extent of the ink run, i.e. the drawn stroke width there"}
  - {name: Re, unit: "-", description: "particle Reynolds number of that column"}
  - {name: Sh_minus_2_over_Sc13, unit: "-", description: "what the shipped calibration makes of that row; should equal 1.1 Re^0.6"}

redistribution_basis: >
  Numerical values are facts and are not protected by copyright (Feist
  Publications v. Rural Telephone, 1991). Extraction for scientific research by
  a research organisation with lawful access is covered by Art. 15n Auteurswet
  (implementing DSM Directive (EU) 2019/790 Art. 3), which cannot be overridden
  by contract. The figure image is NOT reproduced; the curve is re-plotted from
  the extracted coordinates.
