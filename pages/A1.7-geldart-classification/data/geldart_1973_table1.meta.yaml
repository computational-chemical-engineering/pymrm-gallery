caveat: >
  TIER 2 - a table printed in the paper, and the values in it are the author's own
  laboratory measurements. Comparing a correlation with these columns is
  validation against measurement, not reproduction of an author's arithmetic.

  Three limits on what they can test. (a) They are all group A or borderline
  group A/B powders: the table's title is "Experimental results on Group A
  powders" and the density range is 1 to 1.5 g/cm3. Nothing here touches the C/A
  boundary or the B/D boundary, and no page may claim otherwise. (b) The two
  catalyst densities are approximate, so any per-row quantity that divides by
  (rho_s - rho_f) carries that uncertainty for 14 of the 22 rows. (c) U_MB was
  fitted by the paper itself: equation (2), U_MB = 100 d_sv, is the line drawn
  through these very points in the paper's Figure 1, so comparing equation (2)
  with the U_MB column measures the quality of a fit and not its predictive
  power. The U_0 column carries no such circularity - equation (3) is Davies and
  Richardson's and was not fitted here.
