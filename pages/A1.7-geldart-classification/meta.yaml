adds: >
  Nothing to the classification, and the page says so in the pymrm section rather
  than burying it. Geldart's criteria are two inequalities in two variables; they
  need no solver, and sections 1 to 4 of the page would run without pymrm
  installed. What the reimplementation adds is four things, one of which is a
  solver.

  The boundary constants are Geldart's own arithmetic rounded, and the rounding
  is harmless. 225 should be 229.36 <!-- claim: eq6_constant_recomputed --> and 1e6 should be 1.016e6 <!-- claim: eq8_constant_recomputed -->,
  low by 1.94 <!-- claim: eq6_constant_dev_pct --> % and 1.59 <!-- claim: eq8_constant_dev_pct --> %. No powder in Table 1 falls in either gap, both
  gaps computed, so no verdict moves. The recomputation is what licenses that
  statement, and it also fixes the constants for anyone re-deriving the boundary
  at a different mu or K_MB, which is what section 5.1 of the paper asks for when
  it discusses raised pressure.

  The A/B criterion sorted against a measurement, row by row, AND SCORED
  HONESTLY. Geldart's own test of it is one sentence of prose about Diakon.
  Doing it arithmetically across all 21 <!-- claim: AB_rows_compared --> fractions with a measured U_0 gives 20 <!-- claim: AB_rows_agreeing -->
  agreements, but 19 <!-- claim: AB_rows_null_baseline --> of those rows are measured group A, so a null model that
  predicts group A for everything already scores 19 <!-- claim: AB_rows_null_baseline --> and the criterion is
  worth one row over it. The page prints that baseline, names the only 3 <!-- claim: AB_discriminating_rows --> rows
  on which the two predictors can differ (Diakon at 220, 263 and 318 um) and
  reports the criterion's score on those rows: 2 <!-- claim: AB_discriminating_rows_agreeing --> of 3 <!-- claim: AB_discriminating_rows -->. It also states the
  tie-break that produces the margin, costs the alternative in break table 2, and
  reports the boundary's sharpness: the last group A row sits 0.46 <!-- claim: AB_last_A_row_inside_pct --> % inside it
  and is measured group A, but half a unit in the last printed digit of its density
  and size moves its product by 0.69 <!-- claim: AB_last_A_row_rounding_pct --> %, so at the upper rounding edge the
  agreement is 19 <!-- claim: AB_rows_agreeing_upper_rounding --> of 21 <!-- claim: AB_rows_compared -->.

  The one genuine conflict resolved the right way round. On the 220 um fraction
  eq. (6) says group B, the strict ratio test on the measured velocities says
  group A, and section 4.3 says group B, so Geldart's own prose sides with
  eq. (6), against a mechanical reading of his velocity columns.

  The weak half of the boundary identified and quantified. The A/B line is the
  ratio U_MB/U_0 and only U_0 comes from something not fitted to this table.
  Inverting eq. (3) row by row shows the constant it would need spans a factor
  6.4 <!-- claim: eq3_K0eff_spread_factor --> across Geldart's own powders, geometric mean 0.998 <!-- claim: eq3_K0eff_geomean --> with a standard
  error of 9.6 <!-- claim: eq3_K0eff_geomean_se_pct --> %: the centre is consistent with the printed 8e-4 and the scatter is
  the problem. That is the number a reader needs before carrying the boundary to
  a new powder and it is not in the paper. It is also why A1.6 (Wen and Yu) is a
  separate case: replacing eq. (3) is the obvious next move and this page does
  not make it.

  The B/D boundary re-read as a cloud condition, with the one solve pymrm
  contributes. Eq. (7) is the statement that a 25 cm bubble rises more slowly
  than the interstitial gas, which is the condition under which the Davidson
  bubble has no cloud: E1.2's (R_c/R)^3 = (u_br + 2u_f)/(u_br - u_f) has a pole
  exactly there. Geldart's 1/sqrt(2) and Davies-Taylor's 0.711 differ by
  0.55 <!-- claim: eq8_davies_taylor_vs_geldart_pct --> %, less than the 1.59 <!-- claim: eq8_constant_dev_pct --> % by which Geldart rounded his own answer, so the
  two are the same boundary. The page shows the same 25 cm bubble in three
  powders: a thin cloud at R_c/R = 1.025 <!-- claim: cloud_RcR_sand_100um --> far inside group B, a cloud swollen to
  3.23 <!-- claim: cloud_RcR_sand_600um --> just inside the line, and no dividing streamline at all in group D,
  from a computed flow field (E1.2's model, copied unchanged) rather than from
  the formula being examined. It is also the one part of the page that inherits
  E1.2: if E1.2's operator or closed form changes, these cloud numbers move with it.

agreement: >
  Tier 2 data, and the comparison that matters is against measurement. Geldart's
  Table 1 is narrow size fractions of three powders that he fluidised himself in
  a 5 cm column, with U_0 from the pressure-drop curve and U_MB from the first
  visible bubble. The A/B criterion agrees with those measurements on 20 <!-- claim: AB_rows_agreeing --> of the
  21 <!-- claim: AB_rows_compared --> rows that have a U_0, but that score carries about one row of
  information, because a null model predicting group A for everything scores
  19 <!-- claim: AB_rows_null_baseline -->/21 <!-- claim: AB_rows_compared -->, and it depends on a stated tie-break. The number the page reports is
  2 <!-- claim: AB_discriminating_rows_agreeing --> of the 3 <!-- claim: AB_discriminating_rows --> rows on which the criterion and the null model can differ. Equation (3)
  against the same measured U_0 column is far looser, a factor 6.4 <!-- claim: eq3_K0eff_spread_factor --> in the constant it
  implies, median 0.98 <!-- claim: eq3_K0eff_ratio_median -->, and that number is reported as the page's least
  flattering result rather than hidden.

  The remaining numbers are internal. The two boundary constants recompute to
  +1.94 <!-- claim: eq6_constant_dev_pct --> % and +1.59 <!-- claim: eq8_constant_dev_pct --> % of the printed 225 and 1e6; the worked example on journal
  page 289 reproduces to the two significant figures he printed; the voidage identity closes
  to a bound of 1e-12 and is labelled structural; the pymrm cloud radius matches
  E1.2's closed form to 3.6e-7 <!-- claim: cloud_pymrm_vs_closed_form -->, which is discretisation error against a
  formula E1.2 already validated and is not counted as evidence here.

caveats: >
  Every powder in Table 1 is group A or borderline A/B, the table's own title says
  so, and the sizes and densities are far from the B/D line. So the A/B boundary
  is the ONLY boundary on this page tested against data. The C/A boundary is not
  reproduced at all, because Geldart prints no expression for it: on his Fig. 3 it
  is a shaded band PQ "drawn so as to separate empirically open and half-closed
  points". The B/D work is algebra, recomputing 1e6 and identifying eq. (7) with
  the Davidson cloud condition, and Geldart himself calls that criterion tentative.

  The A/B agreement is weak in two separate ways and the page quantifies both.
  First, the classes are lopsided: 19 <!-- claim: AB_rows_null_baseline --> of the 21 <!-- claim: AB_rows_compared --> comparable rows are measured
  group A, so a null model scores 19 <!-- claim: AB_rows_null_baseline -->/21 <!-- claim: AB_rows_compared --> against the criterion's 20 <!-- claim: AB_rows_agreeing -->/21 <!-- claim: AB_rows_compared -->, all the
  information sits in the 3 <!-- claim: AB_discriminating_rows --> rows the criterion calls group B, and the score there is
  2 <!-- claim: AB_discriminating_rows_agreeing --> of 3 <!-- claim: AB_discriminating_rows -->. Second, it is not fully independent of the data it is tested on:
  the 100 inside the 225 is eq. (2), a line fitted through this table's own U_MB
  column in the paper's Fig. 1; the page reports eq. (2)'s 9.6 <!-- claim: eq2_fit_residual_mean_abs_pct --> % mean residual
  against that column explicitly as a fit residual and never counts it as
  agreement. What IS independent is the U_0 side, and section 3 shows it is the
  sloppy half. On top of both, the margin over the null model depends on a
  tie-break: 2 <!-- claim: AB_tie_rows --> rows print U_MB = U_0 exactly and eq. (4) is displayed as >= but
  applied in the text as >, so the strict form is used, stated, justified from
  section 4.3 and costed in break table 2.

  Section 4.2 states how U_0 and U_MB were measured and says nothing about
  eps_MB or H_MB/H_0. Those two columns are therefore called REPORTED, not
  measured, and are used only for a transcription check. If eps_MB was in fact
  derived from bed height, the 200 g charge and rho_s, then on the catalyst rows
  it inherits an approximate rho_s, and so does the eps_0 recovered from it.

  Two of the three particle densities are printed as approximate ("rho_s ~= 1",
  "rho_s ~= 1.5" against Diakon's "rho_s = 1.18"), so the catalyst rows carry a
  density uncertainty of unstated size. Every per-row quantity that divides by the
  density difference is reported for Diakon separately for that reason.

  rho_f = 1.2e-3 g/cm3 is NOT printed in the paper; it is air at ambient. Nothing
  on the page depends on it in any conclusion (dropping it leaves every count and
  classification unchanged), and the page therefore makes no claim about it.

  Equation (3) originates with Davies and Richardson, Trans. Inst. Chem. Engrs.
  44 (1966) T293, Geldart's reference 11. That paper is NOT on disk and was not
  consulted; eq. (3) is used exactly as Geldart prints it. The same holds for
  eq. (9) (Verloop and Heertjes) and eq. (10) (Oltrogge). The Davies-Taylor
  coefficient 0.711 is not printed by Geldart either; it comes from E1.2, where
  it is likewise taken as given.

  Nothing here is digitised. Every equation, constant and table value was read
  visually off 600 dpi renders of journal pages 285-292; the PDF text layer of
  this 1973 Elsevier scan renders the paper's own title as "Types of Gas
  Fhidization" and was not used. The only figure-derived quantities on the page
  are Fig. 3's LABELLED axis ticks, which are printed text, not digitised
  coordinates. The page makes no claim about which curves are drawn on that
  figure; that eq. (9) "is not shown on Fig. 3" is Geldart's own statement and is
  quoted, not checked.
