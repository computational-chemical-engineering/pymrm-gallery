adds: >
  Four things the paper does not contain, and a correction to one of its own
  remarks.

  First, a number on the wall argument. Eqs (7)-(8) conclude that the interstitial
  velocity in the wall region is within 2 % of the bulk, "suggesting that there
  may be no significant differences". The consequence for a reactor depends on
  L/d, on d_t/d and on the reaction rate, none of which appears in eq. (8); the
  2-D bed puts it at +0.001 % for Gunn's corrected ratio and +5.46 % for the
  uncorrected one, and separates how much radial dispersion erodes (79 %).

  Also a second, independent computation of two of those reactor numbers, by
  collocation rather than finite volume - the one thing a defect-injection table
  structurally cannot supply, and the thing that caught this page's own
  first-order error in the outlet metric.

  Second, a closed form for the 2-D problem. Gunn prints eq. (17) for the 1-D
  reactor; feeding the bed a zero-flux radial eigenmode gives the same expression
  with k -> k + D_R (beta_1/R)^2. That is the only check on the page that reads
  the radial operator, and the only reason the break table can tell an axial
  defect from a radial one - the flat-inlet check against eq. (17) leaves nu = 0
  at exactly its baseline value.

  Third, the cost of the wrong outlet closure, measured - AND a correction to the
  natural reading of Gunn's "not easy to implement except where the reactor is
  long". A longer bed protects the interior profile and does nothing at all for
  the outlet concentration, whose error is a length-independent multiplicative
  bias of size lambda D/U. Since the outlet is usually what is being computed,
  "make the reactor long" is not a workaround.

  Fourth, the high-Reynolds-number limit as an identity rather than a claim, and
  applied to all three of the paper's particle shapes rather than the one it
  discusses. Pe -> 2 for spheres, 1.7037 for solid cylinders and 1.1746 for
  hollow cylinders follows from constants the paper prints and never puts side by
  side. The page also states the width of that claim: two printed digits fix the
  limit only to about 4 %.

  It also puts a number on a claim Gunn makes qualitatively about Table 1 - the
  three independent estimates of intraparticle diffusivity agree to a worst
  within-row spread of 16.0 % and a mean of 10.6 %, which is what "consistency of
  bed-independent parameters" is worth here.

agreement: >
  Mixed, and the page separates the parts. The structural results are exact and
  come from printed constants: the shape dependence of the high-Reynolds-number
  Peclet group, and seven stated numbers reproduced to between 0.0 % and 11.4 %,
  each inside the precision of the phrase it tests. The one stated range that does
  not survive - the upper end of 0.2 < Re < 300 - is reported as it stands.

  The comparison against measurement is the weakest part and is labelled that way.
  Eq. (1) sits +15.8 % high on the 55 markers A2.5 digitised from Edwards and
  Richardson's Figure 9, at 20.3 % mean absolute deviation against 11.75 % for
  their own fit - the expected ordering, since E&R fitted two constants to exactly
  those markers. It is not a clean held-out prediction either, but the printed
  evidence says these gas-phase points are probably OUTSIDE the set Gunn estimated
  p(Re) from, not inside it, and the page argues that rather than assuming. What
  really limits it is resolving power: against the strongest null, a free constant
  p at 23.0 %, deleting p(Re) costs 2.7 percentage points at eps = 0.37, while the
  porosity the paper never prints moves the headline 9.1 points across a plausible
  range and has an interior optimum at eps = 0.443.

  On the solver side the two closed forms converge at order 1.99 and 2.00 to
  7.5e-07 and 2.9e-05, and the break table measures what each is blind to rather
  than asserting sensitivity. Two reactor numbers are additionally computed a
  second time by collocation; one agreed to 1.4e-04 and the other did not, and
  fixing what that revealed moved the outlet metric from 0.92 % to 1.03 %.

caveats: >
  The porosity is an ASSUMPTION. Eq. (1) needs one and the paper prints none for
  any figure; 0.37 is taken from the tube-diameter argument on journal page 368.
  It is the largest single lever on every comparison here. The residual against
  the 55 markers is NOT monotone in eps: it has an interior minimum at eps = 0.443
  (16.4 %, against 20.3 % at the assumed 0.37) and rises again above that, so
  those data prefer a looser bed than Gunn quotes for the bulk but not an
  arbitrarily loose one. Nothing on this page can separate a porosity error from a
  model error, and the margin by which p(Re) beats a free constant p is itself
  porosity-dependent - 2.7 points at eps = 0.37, 4.6 points at each model's own
  preferred eps.

  The measurement comparison is not a prediction and it is one particle shape and
  one gas pair. Whether these markers are inside Gunn's fit set is decided from
  printed text, not assumed: his stated criterion (molecular diffusion very small,
  i.e. ReSc >> 1, which his 1993 note glosses as liquid-phase measurements) is
  failed by all but 8 of these 55 gas-phase points, so the comparison is probably
  out of sample - though nothing printed says they were held out either, and the
  page does not upgrade the word. The Schmidt-group dependence - the thing Gunn's
  Figure 1 exists to show, over a 1000-fold range, and the single most valuable
  extension to this page - is not tested at all, because the gallery has no
  liquid-phase dispersion dataset. Jacques & Vermeulen (1957) or Miller & King
  (1966) would supply one.

  The borrowed dataset carries A2.5's open questions with it: three glyphs remain
  fused and carry no row (including the most nearly resolvable one, whose
  inclusion moves this page's headline from 20.30 % to 20.65 %), a +/-5 px
  ink-centroid systematic is unresolved (it moves the headline to 19.27 % or
  21.59 %), and A2.5's figure review is pending and non-blocking. No new
  digitisation was done here and none is proposed - there is no maintainer
  available for a figure review.

  The reactor operating point is chosen, not printed: the paper contains no worked
  reactor example. Every number of it is stated on the page. The wall-channel
  result is one operating point with a STEP porosity profile, which is what the
  paper's "wall region of extent 0.5d" describes and no more; the erosion fraction
  depends on L/d, d_t/d and the Damkohler group. The Danckwerts inlet is written
  with the area-mean velocity rather than the local u(r); the alternative is a
  break row and is worth 1.1 % of the wall-channel answer.

  Two metrics are labelled structural and have no break row: the cross-document
  identity against Gunn 1993's eq. (42), which is algebraically exact and is
  evidence about two transcriptions only; and eq. (17) substituted back into eq.
  (16), whose floor is round-off in the finite differences. Several more are
  guarded by a family rather than an individual row (the four nulls, the porosity
  sweep and its optimum, and the recomputation of A2.5's published headline), and
  four are guarded by something stronger - a second, independent computation of
  the same quantity. The two closed-form solver checks are measured to be jointly
  insufficient: a 10 % error made consistently in D or D_R is invisible to both,
  although the same error injected into the operator alone is not.

  THREE printing inconsistencies in the source are recorded rather than repaired:
  the caption of Figure 5 names "eq. (4)" where the body text and the figure both
  require eqs (9) and (10); the tortuosity for spheres is 1.4 in eq. (3) and 1.2
  in eq. (10), a 17 % difference the paper describes only as "small amounts"; and
  eq. (2) prints its second denominator as 16 alpha_1^4 (1-eps) where eq. (1),
  which it must reduce to at sigma_v^2 = 0, prints 16 alpha_1^4 (1-eps)^2 - Gunn
  1993's eq. (42) confirms the square. The page uses only eq. (1).
