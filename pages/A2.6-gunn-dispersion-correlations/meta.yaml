adds: >
  Four things the paper does not contain. A number on the wall argument: eqs
  (7) and (8) conclude the interstitial velocity in the wall region is close to
  the bulk; the 2-D bed puts the consequence at 0.0009 % <!-- claim: wall_cost_gunn_ratio_with_radial -->
  for Gunn's corrected ratio and 1.142 % <!-- claim: wall_channel_cost_with_radial -->
  for the uncorrected one, and separates how much radial dispersion erodes.
  A closed form for the 2-D problem, feeding the bed a zero-flux radial eigenmode,
  which is the check that reads the radial operator. The cost of the wrong outlet
  closure: a longer bed protects the interior profile and does nothing for the
  outlet concentration, whose error is a length-independent bias of size
  lambda D/U. And the high-Reynolds-number limit for all three of the paper's
  particle shapes, which the paper never puts side by side. A second computation
  of two reactor numbers by collocation guards their accuracy. The correlations
  themselves are closed forms and pymrm adds nothing to them.

agreement: >
  Mixed, and separated. The structural results come from printed constants: the
  shape dependence of the high-Reynolds-number Peclet group and the stated numbers
  (5 <!-- claim: stated_numbers_within_half_unit --> of seven within their printed
  precision). Against the markers A2.5 digitised eq. (1) sits 15.77 % <!-- claim: eq1_vs_fig9_bias -->
  high at 20.30 % <!-- claim: eq1_vs_fig9_mean_abs_dev --> mean absolute deviation,
  probably out of sample; at the assumed porosity the markers do not distinguish
  p(Re) from a free constant. On the solver side both closed forms converge at
  second order, and two reactor numbers agree with an independent collocation
  route.

caveats: >
  The porosity is an assumption (0.37, from the bulk of a bed of spheres); the
  paper prints none for any figure, and it is the largest lever on every
  comparison with the markers. No liquid-phase data: the Schmidt-group
  dependence is untested. The borrowed markers carry A2.5's open questions (three
  fused glyphs, an ink-centroid systematic, a pending figure review). The reactor
  operating point is chosen, the wall annulus is a step, and the Danckwerts inlet
  uses the area-mean velocity (the local u(r) changes the answer by
  1.05 % <!-- claim: local_inlet_effect --> of itself). The two closed-form solver
  checks cannot see a coefficient that is wrong everywhere. Three printing
  inconsistencies in the source are recorded, not repaired: the Figure 5 caption,
  the two tortuosities for spheres (1.4 in eq. 3, 1.2 in eq. 10), and the missing
  square in eq. (2)'s denominator.
