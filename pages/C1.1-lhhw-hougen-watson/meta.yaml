  - "run 25a's printed R_calc proven wrong by its own row: off by 0.50 <!-- claim: tableC_25a_printed_minus_consistent -->, 33 <!-- claim: tableC_25a_gap_over_rounding --> times the rounding of the printed inputs; 3 <!-- claim: DEF_duplicate_inconsistencies --> duplicate-row inconsistencies in Tables E/F, each judged by the implied-sum test; the 275 C g/m row unexplained by any single-element repair"
  - "discrimination with paired standard errors: d and h are 0.36 <!-- claim: discrim_d_vs_h_gap_pct_points --> percentage points apart with a standard error of 0.58 <!-- claim: discrim_d_vs_h_gap_se_pts -->, and the best rejected mechanism trails by 2.7 <!-- claim: discrim_third_best_gap_pct_points --> points with a standard error of 2.2 <!-- claim: discrim_third_best_gap_se_pts -->, neither resolved at two standard errors; noiseless h-rates are fitted by d to 3.6 <!-- claim: discrim_power_d_fits_exact_h_pct --> %"
