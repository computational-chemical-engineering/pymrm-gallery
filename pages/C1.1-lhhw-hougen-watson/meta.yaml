fit_or_test: >
  ENTIRELY FIT DATA. Every constant in the source (Tables D to G and the final
  eq. q) was fitted BY THE BOOK to the same 40 printed runs of Table A, and no
  held-out measurement exists anywhere in the source. Every agreement on the
  page is therefore a reproduction of the estimation (of the book's linearised
  least squares, its goodness-of-fit arithmetic, its temperature correlation)
  or an internal-consistency adjudication between the book's own printed
  numbers, and the page says so wherever a number appears. The one numerical
  experiment (noiseless rates generated from the fitted mechanism h, refitted
  by mechanism d, to measure the discrimination power of the design) is
  labelled as synthetic in the cell that runs it and is never presented as
  data. The reactor section is a demonstration with no printed target: the
  book poses the integration as its Chapter XXI Problem 1 but prints no
  answer, and its stated temperature lies outside the fitted range, so the
  page keeps the demonstration at 200 C and labels it a demonstration.

# The notebook's break table re-runs every study with one defect injected
# through its arguments; every claim has a row that fails its own check.
