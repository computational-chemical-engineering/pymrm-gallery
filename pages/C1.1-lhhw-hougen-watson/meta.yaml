  - "mechanism d constants at 200 C reproduced by two routes sharing no inputs beyond the model form (least squares on the transcribed data, and direct solution of the normal equations exactly as printed on book p. 952) agreeing with each other to 0.0063 <!-- claim: mechd_200C_two_routes_max_rel --> and with the printed solution to 0.0058 <!-- claim: mechd_200C_vs_printed_max_rel --> relative"
  - "the book's fit-quality arithmetic reproduced: Sum delta^2 to 0.0014 <!-- claim: tableC_sum_delta_sq_rel_dev --> relative, average deviation 8.42 <!-- claim: tableC_avg_abs_pct --> % against the printed +-8.44, and Table C's per-run R_calc to 0.026 <!-- claim: tableC_other_Rcalc_worst_abs --> worst outside the one provably misprinted cell"
  - "38 <!-- claim: DEF_clean_row_count --> of 54 printed Table D/E/F rows consistent with the data to better than 3 % in every implied normal-equation summation; the 200 C anomaly diagnosed as ONE corrupted Sum(R pS) worksheet entry by two independent printed rows that imply the same wrong value to 0.011 <!-- claim: DEF_corrupted_sum_two_witness_gap_rel --> relative"
  - "the dS_S adjudication: with the printed dH_S, Table G's -30.46 reproduces the printed K_S row to 0.025 <!-- claim: KS_row_rms_rel_tableG_dSS --> rms relative where eq. (q)'s -30.96 misses by 0.236 <!-- claim: KS_row_rms_rel_eqq_dSS -->"
  - "two-route reactor check: the pymrm bed (bed length a root of the outlet conversion) against adaptive quadrature; observed orders within 0.9 to 1.1 (theory, first-order upwind) with the finest difference at least 1e3 <!-- claim: reactor_order_roundoff_margin --> times the solver tolerances; the extrapolated bed agrees with the quadrature to at most 1e-4 <!-- claim: reactor_WF_richardson_vs_quad_rel -->. The routes share the rate function, so this tests transport only, as the page says"
