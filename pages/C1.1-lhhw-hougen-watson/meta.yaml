adds: >
  Three things the book does not give. First, forensics: a single corrupted
  Sum(R pS) entry in the 1947 worksheets is identified behind eight of Table
  D's eighteen rows (two independent printed rows imply the same wrong value),
  the eq. (q)/Table G dS_S disagreement is adjudicated from the book's own K_S
  row, and one Table C cell is proven a digit slip by its own row, with the
  joint acceptance verdict shown to survive all of it. Second, the
  discrimination question on the formalism's founding dataset, with paired
  standard errors: fit quality cannot separate d from h, nor the best rejected
  desorption-controlled forms from the survivors, nor d with and without the
  product's adsorption term; what the fits resolve is the gap to the forms that
  fit 1.5 <!-- claim: nls_resolved_ratio_min --> to 3.4 <!-- claim: nls_resolved_ratio_max --> times worse than d, and the rest is the
  book's sign test. Third, the bookkeeping demonstration: the fitted law in a
  pymrm plug-flow bed, where building partial pressures from the fixed inlet
  total, a smooth, plausible-looking slip, lengthens the 99.8 %-conversion bed
  by a relative 0.51 <!-- claim: reactor_naive_fixed_total_bias_rel -->.

agreement: >
  Mechanism d constants at 200 C reproduced to 0.0058 <!-- claim: mechd_200C_vs_printed_max_rel -->
  relative worst (two independent routes, 0.0063 <!-- claim: mechd_200C_two_routes_max_rel --> apart);
  the book's Sum delta^2 and +-8.44 % reproduced (8.42 <!-- claim: tableC_avg_abs_pct --> %); 38 <!-- claim: DEF_clean_row_count -->
  of 54 printed mechanism rows consistent with the data with the remainder
  diagnosed; K_S row reproduced to 0.025 <!-- claim: KS_row_rms_rel_tableG_dSS --> rms by Table G's dS_S;
  eq. (q) itself reproduces its own 40 fitting rates to 19.1 <!-- claim: eqq_all40_mean_abs_pct --> % mean
  absolute deviation in rate space, the rate-space size of the book's
  +-8.44 % in transformed space (16.9 <!-- claim: rate_space_scatter_pct_200C --> % at 200 C, a factor of 2.00 <!-- claim: rate_space_over_R_space_ratio -->).

