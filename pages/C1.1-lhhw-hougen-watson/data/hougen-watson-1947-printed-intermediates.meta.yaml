dataset_id: hougen-watson-1947-printed-intermediates
title: "Printed intermediates of Illustration 2: the 200 C normal-equation sums, Table C's fit quality, the run 3c specimen"
status: complete

source:
  authors:
    - "Hougen, O. A."
    - "Watson, K. M."
  year: 1947
  title: "Chemical Process Principles, Part Three: Kinetics and Catalysis (combined volume)"
  container: "John Wiley & Sons / Chapman & Hall. Chap. XIX, Illustration 2, book pp. 945-952"
  doi: null
  access: "book scan held by the maintainers (lawful access)"
  licence: "all rights reserved (facts extracted; no page image reproduced)"

acquisition:
  method: table
  figure: "normal equations (f)-(i), book p. 952; Table C column totals, book pp. 950-951; specimen calculation for run 3c, book pp. 945-946"
  tool: "poppler pdftoppm at 150 dpi (native), cropped and enlarged 4x nearest-neighbour"
  procedure: >
    Read in the same pass as Tables A to G, each value cropped and enlarged.
    Values are kept with the digits as printed, so the number of printed
    decimals can be read from the strings.
  operator: "Claude Fable 5 (assisted)"
  date: 2026-08-05
  estimated_error: "none beyond the book's own printing (each value to its last printed digit)"

validation:
  internal_consistency: >
    The 13 sums are reproduced by the page from Table A's 200 C block (the three
    linear sums exactly, the product sums to the printed rounding); the
    normal-equation sum of pU^2 (21.682) and Table C's column total (21.681)
    disagree by one unit of the last digit, as printed.
  what_it_tests: >
    The transcription of Table A's 200 C block, and the book's own arithmetic
    of the mechanism d fit and of the run 3c rate.

columns:
  - {name: name,          unit: "dimensionless (identifier)", description: "the printed quantity"}
  - {name: printed,       unit: "mixed by row, listed in the description", description: "the value with the printed digits. Units: sums of pH, pU, pS in atm; their squares and products in atm^2; Sum R in lb-mol/(lb hr); Sum R p in lb-mol atm/(lb hr); Sum delta2 in squared units of Table C's transformed observable; avg abs pct in per cent; run3c liquid in ml/hr, specific gravity and refractive index difference dimensionless, molecular weight in g/mol, g per lb in g/lb, per cent per unit index in per cent per unit of refractive index difference"}
  - {name: printed_where, unit: "dimensionless (text label)", description: "book location"}

notes:
  provenance: >
    These values were moved from the page code on 2026-11-16, values unchanged
    (previously hard-coded in build_page.py).
